[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-monitor-logs-ingestion"
version = "0.1.0"
description = "Ingest JSON mock data into Azure Monitor custom and supported standard tables."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "azure-identity>=1.17,<2",
  "requests>=2.31,<3"
]

[project.scripts]
azure-monitor-logs-ingestion = "azure_monitor_logs_ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["azure_monitor_logs_ingestion*"]
