version: 1
name: xdr-migration-common-security-log
workspace: qualification-target
inputStream: Custom-XDRMigrationCommonSecurityLogMock
inputColumns:
  - { name: TimeGenerated, type: datetime }
  - { name: Activity, type: string }
  - { name: ApplicationProtocol, type: string }
  - { name: CommunicationDirection, type: string }
  - { name: DestinationIP, type: string }
  - { name: DestinationPort, type: int }
  - { name: DeviceAction, type: string }
  - { name: DeviceEventClassID, type: string }
  - { name: DeviceName, type: string }
  - { name: DeviceProduct, type: string }
  - { name: DeviceVendor, type: string }
  - { name: Message, type: string }
  - { name: ReceivedBytes, type: long }
  - { name: SentBytes, type: long }
  - { name: SourceIP, type: string }
transformKql: >-
  source
  | project TimeGenerated=todatetime(TimeGenerated),
            Activity=tostring(Activity),
            ApplicationProtocol=tostring(ApplicationProtocol),
            CommunicationDirection=tostring(CommunicationDirection),
            DestinationIP=tostring(DestinationIP),
            DestinationPort=toint(DestinationPort),
            DeviceAction=tostring(DeviceAction),
            DeviceEventClassID=tostring(DeviceEventClassID),
            DeviceName=tostring(DeviceName),
            DeviceProduct=tostring(DeviceProduct),
            DeviceVendor=tostring(DeviceVendor),
            Message=tostring(Message),
            ReceivedBytes=tolong(ReceivedBytes),
            SentBytes=tolong(SentBytes),
            SourceIP=tostring(SourceIP)
destination:
  kind: standard
  table: CommonSecurityLog
  outputStream: Microsoft-CommonSecurityLog
  columns:
    - { name: TimeGenerated, type: datetime }
    - { name: Activity, type: string }
    - { name: ApplicationProtocol, type: string }
    - { name: CommunicationDirection, type: string }
    - { name: DestinationIP, type: string }
    - { name: DestinationPort, type: int }
    - { name: DeviceAction, type: string }
    - { name: DeviceEventClassID, type: string }
    - { name: DeviceName, type: string }
    - { name: DeviceProduct, type: string }
    - { name: DeviceVendor, type: string }
    - { name: Message, type: string }
    - { name: ReceivedBytes, type: long }
    - { name: SentBytes, type: long }
    - { name: SourceIP, type: string }
resources:
  dce: xdr-migration-common-security-log-mock-dce
  dcr: xdr-migration-common-security-log-mock-dcr
