version: 1
name: xdr-migration-syslog-mock
workspace: qualification-target
inputStream: Custom-XDRMigrationSyslogMock
inputColumns:
  - { name: CollectorHostName, type: string }
  - { name: Computer, type: string }
  - { name: EventTime, type: datetime }
  - { name: Facility, type: string }
  - { name: HostIP, type: string }
  - { name: HostName, type: string }
  - { name: ProcessID, type: int }
  - { name: ProcessName, type: string }
  - { name: SeverityLevel, type: string }
  - { name: SourceSystem, type: string }
  - { name: SyslogMessage, type: string }
  - { name: TimeGenerated, type: datetime }
  - { name: Type, type: string }
transformKql: >-
  source
  | project CollectorHostName=tostring(CollectorHostName),
            Computer=tostring(Computer),
            EventTime=todatetime(EventTime),
            Facility=tostring(Facility),
            HostIP=tostring(HostIP),
            HostName=tostring(HostName),
            ProcessID=toint(ProcessID),
            ProcessName=tostring(ProcessName),
            SeverityLevel=tostring(SeverityLevel),
            SourceSystem=tostring(SourceSystem),
            SyslogMessage=tostring(SyslogMessage),
            TimeGenerated=todatetime(TimeGenerated),
            Type=tostring(Type)
destination:
  kind: standard
  table: Syslog
  outputStream: Microsoft-Syslog
resources:
  dce: xdr-migration-syslog-mock-dce
  dcr: xdr-migration-syslog-mock-dcr
