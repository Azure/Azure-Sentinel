version: 1
name: xdr-migration-event-mock
workspace: qualification-target
inputStream: Custom-XDRMigrationEventMock
inputColumns:
  - { name: AzureDeploymentID, type: string }
  - { name: Computer, type: string }
  - { name: EventCategory, type: int }
  - { name: EventData, type: string }
  - { name: EventID, type: int }
  - { name: EventLevel, type: int }
  - { name: EventLevelName, type: string }
  - { name: EventLog, type: string }
  - { name: ManagementGroupName, type: string }
  - { name: Message, type: string }
  - { name: ParameterXml, type: string }
  - { name: RenderedDescription, type: string }
  - { name: Role, type: string }
  - { name: Source, type: string }
  - { name: SourceSystem, type: string }
  - { name: TimeGenerated, type: datetime }
  - { name: Type, type: string }
  - { name: UserName, type: string }
transformKql: >-
  source
  | project AzureDeploymentID=tostring(AzureDeploymentID),
            Computer=tostring(Computer),
            EventCategory=toint(EventCategory),
            EventData=tostring(EventData),
            EventID=toint(EventID),
            EventLevel=toint(EventLevel),
            EventLevelName=tostring(EventLevelName),
            EventLog=tostring(EventLog),
            ManagementGroupName=tostring(ManagementGroupName),
            Message=tostring(Message),
            ParameterXml=tostring(ParameterXml),
            RenderedDescription=tostring(RenderedDescription),
            Role=tostring(Role),
            Source=tostring(Source),
            SourceSystem=tostring(SourceSystem),
            TimeGenerated=todatetime(TimeGenerated),
            Type=tostring(Type),
            UserName=tostring(UserName)
destination:
  kind: standard
  table: Event
  outputStream: Microsoft-Event
resources:
  dce: xdr-migration-event-mock-dce
  dcr: xdr-migration-event-mock-dcr
