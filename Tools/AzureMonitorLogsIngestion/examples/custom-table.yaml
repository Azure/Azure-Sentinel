version: 1
name: sample-custom-events
workspace: replace-with-workspace-name-or-arm-id
inputStream: Custom-SampleEventsRaw
inputColumns:
  - name: EventTime
    type: datetime
  - name: Message
    type: string
  - name: Severity
    type: string
transformKql: >-
  source
  | project TimeGenerated=todatetime(EventTime),
            Message=tostring(Message),
            Severity=tostring(Severity)
destination:
  kind: custom
  table: SampleEvents_CL
  outputStream: Custom-SampleEvents_CL
  columns:
    - name: TimeGenerated
      type: datetime
    - name: Message
      type: string
    - name: Severity
      type: string
resources:
  dce: sample-events-dce
  dcr: sample-events-dcr
