version: 1
name: sample-common-security-log
workspace: replace-with-workspace-name-or-arm-id
inputStream: Custom-CommonSecurityLogMock
inputColumns:
  - name: EventTime
    type: datetime
  - name: DeviceVendor
    type: string
  - name: DeviceProduct
    type: string
  - name: Activity
    type: string
transformKql: >-
  source
  | project TimeGenerated=todatetime(EventTime),
            DeviceVendor=tostring(DeviceVendor),
            DeviceProduct=tostring(DeviceProduct),
            Activity=tostring(Activity)
destination:
  kind: standard
  table: CommonSecurityLog
  outputStream: Microsoft-CommonSecurityLog
resources:
  dce: common-security-log-mock-dce
  dcr: common-security-log-mock-dcr
