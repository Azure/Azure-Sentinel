[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-xdr-migration"
version = "0.1.0"
description = "Convert Microsoft Sentinel analytic rules and workbooks into Defender XDR solution content."
requires-python = ">=3.11,<3.13"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "PyYAML>=6.0,<7",
  "azure-identity>=1.17,<2",
  "azure-monitor-query>=1.3,<2",
  "jsonschema>=4.0,<5"
]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]

[project.scripts]
solution-manager = "solution_manager.cli:main"
sentinel-xdr-migrate = "solution_manager.cli:main"
sentinel-xdr-migration = "solution_manager.cli:main"

[tool.setuptools.packages.find]
include = ["solution_manager*", "sentinel_xdr_migration*"]

[tool.setuptools.package-data]
"solution_manager.migration._workbook_core" = ["data/*.json", "LICENSE", "import-manifest.json"]
