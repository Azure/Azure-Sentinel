[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-xdr-migration"
version = "0.1.0"
description = "Convert Microsoft Sentinel analytic rules into Defender XDR Custom Detection YAML."
requires-python = ">=3.11,<3.13"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "PyYAML>=6.0,<7",
  "azure-identity>=1.17,<2",
  "jsonschema>=4.0,<5"
]

[project.scripts]
sentinel-xdr-migrate = "sentinel_xdr_migration.cli:main"
sentinel-xdr-migration = "sentinel_xdr_migration.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel_xdr_migration*"]
