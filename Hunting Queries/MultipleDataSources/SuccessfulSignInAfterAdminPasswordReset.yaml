id: 4a2d8101-aa40-40ad-a5ba-b124605b8908
name: Entra ID sign-in from pre-reset IP after admin password reset
description: |
  Identifies successful sign-ins from an IP the user used before a "Reset password (by admin)" audit event, after a grace period. A later success from that IP can mean residual access or use of the new password.
description-detailed: |
  An admin password reset changes the user's password, but it does not revoke every class of refresh token (non-password-based cookies stay valid; a reset from the Azure portal also leaves non-password-based tokens and confidential-client tokens valid), and already-issued access tokens can remain valid until they expire (the documented default lifetime is a random value between 60 and 90 minutes, 75 minutes on average). Continuous Access Evaluation can cut this shorter for CAE-capable apps, with latency of up to about 15 minutes, but it does not apply to every app. Tenants that do not use Conditional Access have a default access token lifetime of two hours for clients such as Microsoft Teams and Microsoft 365, so tune the grace period if that applies. This hunt pairs each successful "Reset password (by admin)" audit event (the Self-service password management activity logged when an administrator resets a password on behalf of a user) with successful interactive or non-interactive sign-ins for the same user that happen after a grace period and come from an IP address seen for that user in the pre-reset window (default 1 day) before the event.
  A hit is a lead, not a verdict: the legitimate user often signs in again from their usual IP after a reset, including with the new password. For hybrid accounts, a successful cloud admin reset is written back to on-premises Active Directory when password writeback is enabled and the reset is done from the Microsoft Entra admin center or Microsoft Graph, except for users in on-premises protected groups, whose cloud password can change while the on-premises password remains unchanged. A reset from the Microsoft 365 admin center or from PowerShell is not written back, so the on-premises password can remain unchanged. Review hits together with session-revocation and MFA-method changes for the same user. Tune the lookback, pre-reset window and grace period for your environment.
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
      - SigninLogs
      - AADNonInteractiveUserSignInLogs
tactics:
  - InitialAccess
  - Persistence
relevantTechniques:
  - T1078.004
query: |
  let lookback = 7d;
  // How far before the reset to collect the user's sign-in IPs
  let preWindow = 1d;
  // Already-issued access tokens can stay valid for a while after a reset
  let gracePeriod = 90m;
  // Correlate on the stable object ID (TargetResources.id / sign-in UserId) so renamed users,
  // guest UPN differences, and reused UPNs are less likely to cause missed or misattributed results.
  // UPNs are kept for display only.
  let Resets =
      AuditLogs
      | where TimeGenerated >= ago(lookback)
      | where OperationName =~ "Reset password (by admin)"
      | where Result =~ "success"
      | mv-expand TargetResource = TargetResources
      | where tostring(TargetResource.type) =~ "User"
      | extend TargetUserId = tostring(TargetResource.id)
      | where isnotempty(TargetUserId)
      | extend ResetUpn = tolower(tostring(TargetResource.userPrincipalName))
      | extend ResetBy = iff(isnotempty(tostring(InitiatedBy.user.userPrincipalName)),
                               tostring(InitiatedBy.user.userPrincipalName),
                               tostring(InitiatedBy.app.displayName))
      | project ResetTime = TimeGenerated, TargetUserId, ResetUpn, ResetBy;
  let ResetUserIds = Resets | distinct TargetUserId;
  let SuccessfulSignIns = materialize(
      union
          (SigninLogs
          | where TimeGenerated >= ago(lookback + preWindow)
          | where ResultType == "0"
          | where UserId in (ResetUserIds)
          | extend SignInType = "Interactive"
          | project TimeGenerated, UserId, UserPrincipalName, IPAddress, AppDisplayName, SignInType),
          (AADNonInteractiveUserSignInLogs
          | where TimeGenerated >= ago(lookback + preWindow)
          | where ResultType == "0"
          | where UserId in (ResetUserIds)
          | extend SignInType = "NonInteractive"
          | project TimeGenerated, UserId, UserPrincipalName, IPAddress, AppDisplayName, SignInType)
      | where isnotempty(IPAddress)
      | extend SignInUpn = tolower(UserPrincipalName)
      | project TimeGenerated, UserId, SignInUpn, IPAddress, AppDisplayName, SignInType);
  let PreResetIps =
      SuccessfulSignIns
      | join kind=inner Resets on $left.UserId == $right.TargetUserId
      | where TimeGenerated between ((ResetTime - preWindow) .. ResetTime)
      | distinct UserId, ResetTime, IPAddress;
  SuccessfulSignIns
  | join kind=inner Resets on $left.UserId == $right.TargetUserId
  | where TimeGenerated > ResetTime + gracePeriod
  | join kind=inner PreResetIps on UserId, ResetTime, IPAddress
  | summarize
      FirstSignInAfterReset = min(TimeGenerated),
      LastSignInAfterReset = max(TimeGenerated),
      SignInCount = count(),
      SignInTypes = make_set(SignInType, 2),
      SignInUpns = make_set(SignInUpn, 5),
      Apps = make_set(AppDisplayName, 20)
      by UserId, ResetUpn, IPAddress, ResetTime, ResetBy
  // Display UPN: the UPN at reset time, or the sign-in UPN if the audit event had none
  | extend UserUpn = iff(isnotempty(ResetUpn), ResetUpn, tostring(SignInUpns[0]))
  | extend AccountName = tostring(split(UserUpn, "@")[0])
  | extend AccountUPNSuffix = tostring(split(UserUpn, "@")[1])
  | sort by FirstSignInAfterReset desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserUpn
      - identifier: Name
        columnName: AccountName
      - identifier: UPNSuffix
        columnName: AccountUPNSuffix
      - identifier: AadUserId
        columnName: UserId
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  ResetTime: ResetTime
  ResetBy: ResetBy
  SignInCount: SignInCount
version: 1.0.0
metadata:
    source:
        kind: Community
    author:
        name: mikedsosa
    support:
        tier: Community
    categories:
        domains: [ "Security - Threat Protection", "Identity" ]
