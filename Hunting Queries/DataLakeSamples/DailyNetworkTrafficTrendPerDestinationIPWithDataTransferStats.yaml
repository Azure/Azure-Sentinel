id: 0d4d8648-d2d2-423b-a33f-6b0a4dde3d87
name: Daily network traffic trend per destination IP with data transfer stats
description: |
  Identify internal host that reached out outbound destination, including volume trends, estimating blast radius.
requiredDataConnectors:
  - connectorId: CEF
    dataTypes:
      - CommonSecurityLog
tactics:
  - CommandAndControl
  - Exfiltration
relevantTechniques:
  - T1071
query: |
  // Daily Network traffic trend Per Destination IP along with Data transfer stats
  // Frequency - Daily - Maintain 30 days or more history.
  CommonSecurityLog
  | where TimeGenerated > ago(1d)
  | extend Day = format_datetime(TimeGenerated, "yyyy-MM-dd")
  | summarize Count = count(), DistinctSourceIps = dcount(SourceIP), NoofBytesTransferred = sum(SentBytes), NoofBytesReceived = sum(ReceivedBytes) by Day, DestinationIP, DeviceVendor
  | extend IPCustomEntity = DestinationIP
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.0
metadata:
  source:
    kind: Microsoft
  author:
    name: Microsoft Sentinel Team
  support:
    tier: Microsoft
  categories:
    domains:
      - Security - Network
