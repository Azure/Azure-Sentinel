id: 66a15973-7088-4c04-8901-df7324422886
name: Daily process execution trend
description: |
  Identify new processes and prevalence, making "new rare process" detections easier.
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
tactics:
  - Execution
relevantTechniques:
  - T1059
query: |
  // Daily ProcessExecution Trend in SecurityEvents
  // Frequency - Daily - Maintain 30 days or more history.
  SecurityEvent
  | where TimeGenerated > ago(1d)
  | where EventID == 4688
  | extend Day = format_datetime(TimeGenerated, "yyyy-MM-dd")
  // Preserve per-process totals and retain one sample account for investigation.
  | summarize Count = count(), DistinctComputers = dcount(Computer), DistinctAccounts = dcount(Account), DistinctParent = dcount(ParentProcessName), NoofCommandLines = dcount(CommandLine), SampleAccount = take_any(Account) by Day, NewProcessName
  | extend AccountCustomEntity = SampleAccount
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountCustomEntity
version: 1.0.0
metadata:
  source:
    kind: Microsoft
  author:
    name: Microsoft Sentinel Team
  support:
    tier: Microsoft
  categories:
    domains:
      - Security - Others
