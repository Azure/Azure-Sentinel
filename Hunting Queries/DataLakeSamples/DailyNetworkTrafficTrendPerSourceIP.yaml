id: bc5b7be9-274d-4368-8390-c5d97492fc0f
name: Daily network traffic trend per source IP
description: |
  Create a baseline including bytes and distinct peers to detect beaconing and exfiltration.
requiredDataConnectors:
  - connectorId: CEF
    dataTypes:
      - CommonSecurityLog
tactics:
  - CommandAndControl
  - Exfiltration
relevantTechniques:
  - T1071
query: |
  // Daily Network traffic trend Per source IP along with data transfer stats
  CommonSecurityLog
  | where TimeGenerated > ago(1d)
  | extend Day = format_datetime(TimeGenerated, "yyyy-MM-dd")
  | summarize Count = count(), DistinctDestinationIps = dcount(DestinationIP), NoofBytesTransferred = sum(SentBytes), NoofBytesReceived = sum(ReceivedBytes) by Day, SourceIP, DeviceVendor
  | extend IPCustomEntity = SourceIP
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.0
metadata:
  source:
    kind: Microsoft
  author:
    name: Microsoft Sentinel Team
  support:
    tier: Microsoft
  categories:
    domains:
      - Security - Network
