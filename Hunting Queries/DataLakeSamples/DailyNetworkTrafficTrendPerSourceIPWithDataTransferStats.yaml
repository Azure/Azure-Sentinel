id: 4bfa85d2-9c51-41a1-ae3e-a05feb8a7b42
name: Daily network traffic trend per source IP with data transfer stats
description: |
  Today's connections and bytes are evaluated against the host's day-over-day baseline to determine whether the observed behaviors deviate significantly from established pattern.
requiredDataConnectors:
  - connectorId: CEF
    dataTypes:
      - CommonSecurityLog
tactics:
  - CommandAndControl
  - Exfiltration
relevantTechniques:
  - T1071
query: |
  // Daily Network traffic trend per source IP along with data transfer stats
  // Frequency - Daily - Maintain 30 days or more history.
  CommonSecurityLog
  | where TimeGenerated > ago(1d)
  | extend Day = format_datetime(TimeGenerated, "yyyy-MM-dd")
  | summarize Count = count(), DistinctDestinationIps = dcount(DestinationIP), NoofBytesTransferred = sum(SentBytes), NoofBytesReceived = sum(ReceivedBytes) by Day, SourceIP, DeviceVendor
  | extend IPCustomEntity = SourceIP
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.0
metadata:
  source:
    kind: Microsoft
  author:
    name: Microsoft Sentinel Team
  support:
    tier: Microsoft
  categories:
    domains:
      - Security - Network
