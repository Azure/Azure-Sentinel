id: e09b893b-71cf-4adf-b8b3-63a678de47e0
name: Daily network traffic trend per destination IP
description: |
  Create a baseline including bytes and distinct peers to detect beaconing and exfiltration.
requiredDataConnectors:
  - connectorId: CEF
    dataTypes:
      - CommonSecurityLog
tactics:
  - CommandAndControl
  - Exfiltration
relevantTechniques:
  - T1071
query: |
  // Daily Network traffic trend Per destination IP along with data transfer stats
  CommonSecurityLog
  | where TimeGenerated > ago(1d)
  | extend Day = format_datetime(TimeGenerated, "yyyy-MM-dd")
  | summarize Count = count(), DistinctSourceIps = dcount(SourceIP), NoofBytesTransferred = sum(SentBytes), NoofBytesReceived = sum(ReceivedBytes) by Day, DestinationIP, DeviceVendor
  | extend IPCustomEntity = DestinationIP
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.0
metadata:
  source:
    kind: Microsoft
  author:
    name: Microsoft Sentinel Team
  support:
    tier: Microsoft
  categories:
    domains:
      - Security - Network
