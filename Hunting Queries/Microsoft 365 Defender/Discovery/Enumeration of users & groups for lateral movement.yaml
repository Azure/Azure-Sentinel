id: dde6f931-559e-4e21-9409-6286de59771e
name: Enumeration of users & groups for lateral movement
description: |
  The query finds attempts to list users or groups using Net commands.
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
query: |
  DeviceProcessEvents 
  | where Timestamp > ago(14d) 
  | where (FileName in~ ('net.exe', 'net1.exe') or ProcessVersionInfoOriginalFileName in~ ('net.exe', 'net1.exe')) and AccountName != "" and ProcessCommandLine !contains '\\'  and ProcessCommandLine !contains '/add'
  // net.exe starts net1.exe with the same command line; drop that child so each command is counted once
  | where not((FileName =~ 'net1.exe' or ProcessVersionInfoOriginalFileName =~ 'net1.exe') and (InitiatingProcessFileName =~ 'net.exe' or InitiatingProcessVersionInfoOriginalFileName =~ 'net.exe'))
  | where (ProcessCommandLine contains ' user ' or ProcessCommandLine contains ' group ') and (ProcessCommandLine contains ' /do' or ProcessCommandLine contains ' /domain') 
  | extend Target = extract("(?i)[user|group] (\"*[a-zA-Z0-9-_ ]+\"*)", 1, ProcessCommandLine) | filter Target  != '' 
  | project AccountName, Target, ProcessCommandLine, DeviceName, Timestamp  
  | sort by AccountName, Target
