id: 17c67860-20da-4eea-adc4-78d9e69d9f9e
name: First SSH password logon for an account on a host
description: |
  Identifies accounts that completed an sshd password logon on a Linux host for the first time in the lookback period
  of 14 days. It needs no watchlist and covers accounts that were never added to a list of password-disabled accounts.
description-detailed: |
  This query is a companion to the hunting query `SSH password logon for a password-disabled account`, which depends on
  an administrator-maintained watchlist. Watchlists are rarely complete, so this query looks at the same outcome from
  the other side: for each host and account, it returns password logons (password or keyboard-interactive) in the
  query window when the same account had no password logon on the same host during the previous 14 days.
  A first password logon is not malicious by itself. New hosts, newly created accounts and users switching from keys to
  passwords all produce rows. It is useful as a lead when the account is `root`, a service account, or a default image
  user that is expected to use keys only, and when the logon comes from an address that has no other history on the
  host. The output lists up to 10 source addresses, one of which is used as a sample for the IP entity, and the number
  of logons in the window. From OpenSSH 9.8 the logon is written by the `sshd-session` process, which the query also
  matches.
  Newly onboarded hosts will return one row per account because there is no history for them. Exclude such hosts by
  checking when they started sending Syslog data.
  An authentication bypass in the SSH daemon is recorded exactly like a normal password logon, so this query cannot
  distinguish it; it narrows the review to accounts with no prior password use.
  References:
  - https://attack.mitre.org/techniques/T1078/003/
  - https://attack.mitre.org/techniques/T1021/004/
requiredDataConnectors:
  - connectorId: Syslog
    dataTypes:
      - Syslog
tactics:
  - InitialAccess
  - Persistence
  - LateralMovement
relevantTechniques:
  - T1078.003
  - T1021.004
query: |
  let starttime = todatetime('{{StartTimeISO}}');
  let endtime = todatetime('{{EndTimeISO}}');
  let lookback = 14d;
  // OpenSSH 9.8 and later write the logon from sshd-session, earlier versions write it from sshd
  let AcceptedPasswordLogons = (start: datetime, finish: datetime) {
      Syslog
      | where TimeGenerated >= start and TimeGenerated < finish
      | where ProcessName startswith "sshd"
      | where SyslogMessage startswith "Accepted password for" or SyslogMessage startswith "Accepted keyboard-interactive"
      | extend AuthMethod = extract(@"^Accepted (\S+) for ", 1, SyslogMessage)
      | extend TargetUser = tolower(extract(@"^Accepted \S+ for (\S+) from ", 1, SyslogMessage))
      | extend SourceIP = extract(@" from (\S+) port ", 1, SyslogMessage)
      | where isnotempty(TargetUser)
  };
  // Host and account pairs that already used a password logon before the query window
  let PriorPairs = AcceptedPasswordLogons(starttime - lookback, starttime)
      | distinct Computer, TargetUser;
  AcceptedPasswordLogons(starttime, endtime)
  | join kind=leftanti PriorPairs on Computer, TargetUser
  | summarize
      FirstLogon = min(TimeGenerated),
      LogonCount = count(),
      SourceIPs = make_set(SourceIP, 10),
      AuthMethods = make_set(AuthMethod, 5)
      by Computer, TargetUser
  | extend IsRoot = TargetUser == "root"
  | extend SourceIP = tostring(SourceIPs[0])
  | extend AccountCustomEntity = TargetUser, HostCustomEntity = Computer, IPCustomEntity = SourceIP
  | sort by IsRoot desc, FirstLogon desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: HostCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
customDetails:
  LogonCount: LogonCount
  IsRoot: IsRoot
version: 1.0.0
metadata:
    source:
        kind: Community
    author:
        name: descambiado
    support:
        tier: Community
    categories:
        domains: [ "Security - Threat Protection", "Identity" ]
