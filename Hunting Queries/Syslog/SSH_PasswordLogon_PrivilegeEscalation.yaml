id: 2e08acac-326e-4068-98b7-467f277cf543
name: Root command after SSH logon to a password-disabled account
description: |
  Identifies sudo or doas commands run as root within a short time after a successful sshd password logon for an
  account that an administrator has listed as password-disabled.
description-detailed: |
  This query is a companion to the hunting query `SSH password logon for a password-disabled account`. That query
  finds the logon itself. This one answers the next triage question: what did the account do
  with the session. A password logon to an account that is meant to be key-only, followed within minutes by a command
  run as root, is the sequence an attacker needs to turn an authentication bypass into full control of a host. Some
  cloud image default accounts are reported to have passwordless privilege escalation, which makes that second step
  immediate.
  The query depends on the same watchlist, `PasswordDisabledAccounts`, whose `SearchKey` column holds the account names
  as they appear in sshd. It then looks in Syslog, on the same host, for two kinds of events logged by the invoking
  account: sudo events (`<user> : TTY=... ; PWD=... ; USER=root ; COMMAND=...`, where `TTY=` is absent when there is no
  terminal) and doas events (`<user> ran command <cmd> as root from <dir>`). Only commands run as `root` are returned. The window between logon and command is 15 minutes.
  Results are grouped per logon and list up to 10 distinct commands. The password logon event does not prove a bypass
  by itself, since it can also be a legitimate use of an account that should be removed from the watchlist. Treat a
  match as high priority when the logon has no history of password use (see the companion query) or comes from an
  address that has never connected to the host before.
  Failed sudo attempts are excluded, because only lines where the user and a colon are followed directly by `TTY=` or
  `PWD=` are parsed (sudo omits `TTY=` when there is no terminal, as with a command run over SSH). The
  doas pattern is matched on the message text and not on the process name, because OpenDoas does not set a syslog
  identity and the process name can be empty on musl. `su` is not covered. If the same account has overlapping logons
  or a parallel key-based session within the window, the same commands appear under each logon.
  Hosts must send authpriv messages for both sshd and sudo or doas to Syslog. If sudo or doas events are not collected,
  the query returns nothing, so confirm collection before relying on an empty result. From OpenSSH 9.8 the logon is
  written by the `sshd-session` process, which the query also matches.
  References:
  - https://attack.mitre.org/techniques/T1548/003/
  - https://attack.mitre.org/techniques/T1078/003/
requiredDataConnectors:
  - connectorId: Syslog
    dataTypes:
      - Syslog
tactics:
  - InitialAccess
  - PrivilegeEscalation
relevantTechniques:
  - T1078.003
  - T1548.003
query: |
  let starttime = todatetime('{{StartTimeISO}}');
  let endtime = todatetime('{{EndTimeISO}}');
  // Time allowed between the password logon and the command run as root
  let window = 15m;
  // Accounts that must never complete a password logon, maintained by the administrator
  let PasswordDisabledAccounts = (
      _GetWatchlist('PasswordDisabledAccounts')
      | project TargetUser = tolower(tostring(SearchKey))
  );
  // OpenSSH 9.8 and later write the logon from sshd-session, earlier versions write it from sshd
  let Logons = Syslog
      | where TimeGenerated between (starttime .. endtime)
      | where ProcessName startswith "sshd"
      | where SyslogMessage startswith "Accepted password for" or SyslogMessage startswith "Accepted keyboard-interactive"
      | extend AuthMethod = extract(@"^Accepted (\S+) for ", 1, SyslogMessage)
      | extend TargetUser = tolower(extract(@"^Accepted \S+ for (\S+) from ", 1, SyslogMessage))
      | extend SourceIP = extract(@" from (\S+) port ", 1, SyslogMessage)
      | extend SourcePort = toint(extract(@" port (\d+)", 1, SyslogMessage))
      | where TargetUser in (PasswordDisabledAccounts)
      | project LogonTime = TimeGenerated, Computer, TargetUser, AuthMethod, SourceIP, SourcePort;
  // sudo logs a COMMAND= line; OpenDoas logs "<user> ran command ..." with no process name on musl
  let Escalations = Syslog
      | where TimeGenerated between (starttime .. endtime + window)
      | where (ProcessName == "sudo" and SyslogMessage has "COMMAND=") or SyslogMessage has "ran command"
      | extend SudoUser = tolower(extract(@"^\s*(\S+)\s+:\s+(?:TTY|PWD)=.*COMMAND=", 1, SyslogMessage))
      | extend SudoRunAs = tolower(extract(@"USER=(\S+)\s*;.*COMMAND=", 1, SyslogMessage))
      | extend SudoCommand = extract(@"COMMAND=(.*)$", 1, SyslogMessage)
      | extend DoasUser = tolower(extract(@"(?:^|:\s)\s*(\S+) ran command ", 1, SyslogMessage))
      | extend DoasRunAs = tolower(extract(@" ran command .* as (\S+) from ", 1, SyslogMessage))
      | extend DoasCommand = extract(@" ran command (.*) as \S+ from ", 1, SyslogMessage)
      | extend TargetUser = coalesce(SudoUser, DoasUser)
      | extend RunAs = coalesce(SudoRunAs, DoasRunAs)
      | extend Command = coalesce(SudoCommand, DoasCommand)
      | where isnotempty(TargetUser) and RunAs == "root"
      | project EscalationTime = TimeGenerated, Computer, TargetUser, Command;
  Logons
  | join kind=inner Escalations on Computer, TargetUser
  | where EscalationTime between (LogonTime .. LogonTime + window)
  | summarize
      EscalationCount = count(),
      FirstEscalation = min(EscalationTime),
      Commands = make_set(Command, 10)
      by LogonTime, Computer, TargetUser, AuthMethod, SourceIP, SourcePort
  | extend AccountCustomEntity = TargetUser, HostCustomEntity = Computer, IPCustomEntity = SourceIP
  | sort by LogonTime desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: HostCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
customDetails:
  AuthMethod: AuthMethod
  EscalationCount: EscalationCount
version: 1.0.0
metadata:
    source:
        kind: Community
    author:
        name: descambiado
    support:
        tier: Community
    categories:
        domains: [ "Security - Threat Protection", "Identity" ]
