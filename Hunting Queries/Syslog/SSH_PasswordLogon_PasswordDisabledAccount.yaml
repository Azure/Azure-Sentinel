id: 928b860d-f424-4bde-a95f-18f12ef2ad9b
name: SSH password logon for a password-disabled account
description: |
  Identifies sshd password logons for accounts an administrator has listed as password-disabled, such as locked
  service accounts and key-only cloud image users. These accounts should never complete a password logon.
description-detailed: |
  Accounts whose password field in /etc/shadow is locked or disabled (for example `*` or `!`) should never complete
  a password logon. A successful `Accepted password` or `Accepted keyboard-interactive` event for such an account
  means the password path was reached by something other than a normal password check: a misconfigured
  authentication stack, a reused or re-enabled credential, or an authentication bypass in the SSH daemon or the C
  library it runs on.
  The OpenSSH on musl libc issue known as sshole (CVE-2026-123158, OpenSSH 10.6p2 added a defense) is one example of
  the last case. On musl systems where sshd runs without PAM, a password longer than 256 bytes could be accepted for
  an account with `*` in /etc/shadow, because musl's SHA-256 and SHA-512 crypt return the same `*` token that marks a
  disabled password. The maintainers disagree on which component is at fault, so this query does not depend on the
  fix location.
  A successful exploit is written to the log exactly like a normal password logon (`Accepted password for <user> from
  <ip> port <port> ssh2`), and sshd does not log the password length, so there is no log signature of the exploit
  itself. This query is a compensating control: it does not detect the vulnerability, it surfaces the one observable
  outcome, a password logon to an account that was never supposed to have one. From OpenSSH 9.8 the logon is written by
  the `sshd-session` process, which the query also matches.
  This query depends on a watchlist named `PasswordDisabledAccounts` whose `SearchKey` column holds the account
  names (as they appear in sshd, for example `alpine` or `svc-backup`). Populate it from the accounts with `*`, `!`
  or `!!` in /etc/shadow on your Linux estate, and from image defaults that are documented as key-only. It cannot be
  inferred from Syslog alone.
  The output includes `PriorPasswordLogons`, the number of password logons for the same account on the same host
  during the 14 days before the query window. A value of 0 means the account has not logged on with a password in
  recent history and is the strongest lead. A non-zero value usually points to a legitimate use of the account that
  should be removed from the watchlist or fixed at the source.
  Triage: check whether the host runs musl libc (Alpine Linux, OpenWrt, Buildroot, Yocto) and which OpenSSH version
  it runs, then check what the account did after the logon (the companion query on privilege escalation does this for
  sudo and doas; `su` is not covered), since some cloud image default accounts are reported to
  have passwordless privilege escalation.
  References:
  - https://www.openwall.com/lists/musl/2026/11/06/7
  - https://attack.mitre.org/techniques/T1078/003/
  - https://attack.mitre.org/techniques/T1021/004/
requiredDataConnectors:
  - connectorId: Syslog
    dataTypes:
      - Syslog
tactics:
  - InitialAccess
  - Persistence
  - LateralMovement
relevantTechniques:
  - T1078.003
  - T1021.004
query: |
  let starttime = todatetime('{{StartTimeISO}}');
  let endtime = todatetime('{{EndTimeISO}}');
  let lookback = 14d;
  // Accounts that must never complete a password logon, maintained by the administrator
  let PasswordDisabledAccounts = (
      _GetWatchlist('PasswordDisabledAccounts')
      | project TargetUser = tolower(tostring(SearchKey))
  );
  // OpenSSH 9.8 and later write the logon from sshd-session, earlier versions write it from sshd
  let AcceptedPasswordLogons = (start: datetime, finish: datetime) {
      Syslog
      | where TimeGenerated >= start and TimeGenerated < finish
      | where ProcessName startswith "sshd"
      | where SyslogMessage startswith "Accepted password for" or SyslogMessage startswith "Accepted keyboard-interactive"
      | extend AuthMethod = extract(@"^Accepted (\S+) for ", 1, SyslogMessage)
      | extend TargetUser = tolower(extract(@"^Accepted \S+ for (\S+) from ", 1, SyslogMessage))
      | extend SourceIP = extract(@" from (\S+) port ", 1, SyslogMessage)
      | extend SourcePort = toint(extract(@" port (\d+)", 1, SyslogMessage))
      | where isnotempty(TargetUser)
  };
  let PriorLogons = AcceptedPasswordLogons(starttime - lookback, starttime)
      | where TargetUser in (PasswordDisabledAccounts)
      | summarize PriorPasswordLogons = count(), PriorLastSeen = max(TimeGenerated) by Computer, TargetUser;
  AcceptedPasswordLogons(starttime, endtime)
  | where TargetUser in (PasswordDisabledAccounts)
  | join kind=leftouter PriorLogons on Computer, TargetUser
  | extend PriorPasswordLogons = coalesce(PriorPasswordLogons, long(0))
  | extend AccountCustomEntity = TargetUser, HostCustomEntity = Computer, IPCustomEntity = SourceIP
  | project
      TimeGenerated,
      Computer,
      HostIP,
      TargetUser,
      AuthMethod,
      SourceIP,
      SourcePort,
      PriorPasswordLogons,
      PriorLastSeen,
      SyslogMessage,
      AccountCustomEntity,
      HostCustomEntity,
      IPCustomEntity
  | sort by PriorPasswordLogons asc, TimeGenerated desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: HostCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
customDetails:
  AuthMethod: AuthMethod
  PriorPasswordLogons: PriorPasswordLogons
version: 1.0.0
metadata:
    source:
        kind: Community
    author:
        name: descambiado
    support:
        tier: Community
    categories:
        domains: [ "Security - Threat Protection", "Identity" ]
