jobs:
- job: "JsonFileValidation"
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: UseNode@1
    inputs:
      version: '>=22.23.4'
  - task: Npm@1
    displayName: 'npm install'
    inputs:
      verbose: false
  - script: 'npm run tsc && node .script/jsonFileValidator.js'
    displayName: 'Json File Syntax Validation'
