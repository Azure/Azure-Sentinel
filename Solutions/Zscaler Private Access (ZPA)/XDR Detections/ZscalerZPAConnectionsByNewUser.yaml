properties:
  id: xdr-236a7ec1-0120-40f2-a157-c1a72dde8bcb
  displayName: Zscaler - ZPA connections by new user
  status: disabled
  queryCondition:
    queryText: |-
      let listUsers =
      ZPAEvent
      | where TimeGenerated > ago(14d)
      | where DvcAction == 'open'
      | summarize ListofUsers = make_set(DstUserName) by DstUserName
      | project ListofUsers;
      ZPAEvent
      | where DstUserName !in (listUsers)
      | summarize EventCount = count() by DstUserName
      | project-away EventCount
      | extend AccountCustomEntity = DstUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Zscaler - ZPA connections by new user
      description: '''Detects ZPA connections by new user.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1078
