properties:
  id: xdr-24f0779d-3927-403a-aac1-cc8791653606
  displayName: Zscaler - ZPA connections from new IP
  status: disabled
  queryCondition:
    queryText: |-
      let listIPs =
      ZPAEvent
      | where TimeGenerated > ago(14d)
      | where DvcAction == 'open'
      | summarize ListofIPs = make_set(SrcIpAddr) by DstUserName
      | project ListofIPs;
      ZPAEvent
      | where isnotempty(SrcIpAddr)
      | where SrcIpAddr !in (listIPs)
      | summarize EventCount = count() by DstUserName, SrcIpAddr
      | project-away EventCount
      | extend IPCustomEntity = SrcIpAddr, AccountCustomEntity = DstUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Zscaler - ZPA connections from new IP
      description: '''Detects ZPA connections from new IP.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
        - technique: T1133
