properties:
  id: xdr-593e3e2a-43ce-11ec-81d3-0242ac130003
  displayName: Zscaler - Unexpected event count of rejects by policy
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 1000;
      ZPAEvent
      | where EventResult has "REJECTED_BY_POLICY"
      | summarize rejected = count() by EventResult, DstUserName
      | where rejected > threshold
      | extend AccountCustomEntity = DstUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Zscaler - Unexpected event count of rejects by policy
      description: '''Detects unexpected event count of rejects by policy.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
        - technique: T1133
      customDetails:
        AccountName: AccountCustomEntity
