id: 2b4d8f60-91c3-4e77-a5d8-3f19b6c42a07
Function:
  Title: ASIM Audit Event Parser for Airlock Digital
  Version: '1.0.0'
  LastUpdated: '2026-08-04'
Category: Microsoft Sentinel Parser
FunctionName: ASimAuditEventAirlockDigital
FunctionAlias: ASimAuditEventAirlockDigital
FunctionQuery: |
  AirlockDigitalServerActivities_CL
  | extend
      EventCount         = int(1),
      EventStartTime     = TimeGenerated,
      EventEndTime       = TimeGenerated,
      EventResult        = "Success",
      EventSeverity      = "Informational",
      EventOriginalType  = Task,
      EventProduct       = "Airlock Digital",
      EventVendor        = "Airlock Digital",
      EventSchema        = "AuditEvent",
      EventSchemaVersion = "0.1.0",
      EventType          = case(
          Task has_any ("Delete", "Remove"),                                                 "Delete",
          Task has_any ("Create", "Add"),                                                    "Create",
          Task has_any ("Update", "Set", "Edit", "Modify", "Change", "Enable", "Disable"),  "Set",
          Task has_any ("Read", "Get", "View", "List"),                                      "Read",
          "Other"
      ),
      ActorUsername      = User,
      ActorUsernameType  = "Simple",
      Operation          = Task,
      Object             = Description,
      ObjectType         = "Other",
      EventMessage       = Description,
      AdditionalFields   = bag_pack(
          "checkpoint",    Checkpoint,
          "connectorName", ConnectorName
      )
  | project-away Task, User, Description, Checkpoint, ConnectorName, EventDateTime
version: 1
