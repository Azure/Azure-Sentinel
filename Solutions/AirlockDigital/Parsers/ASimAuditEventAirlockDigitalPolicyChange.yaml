id: 9c1a5e38-7b62-42f0-8d94-1e70c5a83b26
Function:
  Title: ASIM Audit Event Parser for Airlock Digital Policy Changes
  Version: '1.0.0'
  LastUpdated: '2026-08-04'
Category: Microsoft Sentinel Parser
FunctionName: ASimAuditEventAirlockDigitalPolicyChange
FunctionAlias: ASimAuditEventAirlockDigitalPolicyChange
FunctionQuery: |
  AirlockDigitalPolicyChanges_CL
  | extend
      EventCount         = int(1),
      EventStartTime     = TimeGenerated,
      EventEndTime       = TimeGenerated,
      EventResult        = "Success",
      EventSeverity      = "Informational",
      EventType          = "Set",
      EventProduct       = "Airlock Digital",
      EventVendor        = "Airlock Digital",
      EventSchema        = "AuditEvent",
      EventSchemaVersion = "0.1.0",
      ActorUsername      = User,
      ActorUsernameType  = "Simple",
      Operation          = ChangeDescription,
      Object             = PolicyGroup,
      ObjectType         = "Policy",
      EventMessage       = ChangeDescription,
      AdditionalFields   = bag_pack(
          "checkpoint",     Checkpoint,
          "policyId",       PolicyId,
          "policyVersion",  PolicyVersion,
          "uuid",           Uuid,
          "userReason",     UserReason,
          "connectorName",  ConnectorName
      )
  | project-away User, ChangeDescription, PolicyGroup, Checkpoint, ConnectorName, EventDateTime
version: 1
