id: 7e9f3c21-4a86-4d1b-9f52-6c8a0d3b5e14
Function:
  Title: ASIM Process Event Parser for Airlock Digital
  Version: '1.0.0'
  LastUpdated: '2026-08-04'
Category: Microsoft Sentinel Parser
FunctionName: ASimProcessEventAirlockDigital
FunctionAlias: ASimProcessEventAirlockDigital
FunctionQuery: |
  AirlockDigitalExecutionHistories_CL
  | extend
      EventCount               = int(1),
      EventStartTime           = TimeGenerated,
      EventEndTime             = TimeGenerated,
      EventType                = "ProcessCreated",
      EventResult              = iif(ExecutionType in (1, 6, 7, 12, 15, 16), "Failure", "Success"),
      EventSeverity            = iif(ExecutionType in (1, 6, 7, 12, 15, 16), "High", "Informational"),
      EventOriginalType        = tostring(ExecutionType),
      EventProduct             = "Airlock Digital",
      EventVendor              = "Airlock Digital",
      EventSchema              = "ProcessEvent",
      EventSchemaVersion       = "0.1.4",
      DvcHostname              = Hostname,
      DvcIpAddr                = LocalIPAddress,
      DvcDomain                = NetDomain,
      TargetProcessName        = FileName,
      TargetProcessCommandLine = CommandLine,
      TargetProcessMD5         = MD5,
      TargetProcessSHA256      = SHA256,
      TargetProcessSHA512      = SHA512,
      TargetProcessFileCompany = Publisher,
      ActorUsername            = Username,
      ActorUsernameType        = "Simple",
      ParentProcessName        = ParentProcess,
      ActingProcessName        = GrandparentProcess,
      RuleName                 = PolicyName,
      AdditionalFields         = bag_pack(
          "executionTypeName", ExecutionTypeName,
          "checkpoint",    Checkpoint,
          "policyId",      PolicyId,
          "policyVersion", PolicyVersion,
          "parentPolicy",  ParentPolicy,
          "filePath",      FilePath,
          "sha128",        SHA128,
          "sha384",        SHA384,
          "remoteIp",      IPAddress,
          "extBrowser",    ExtensionBrowser,
          "extId",         ExtensionId,
          "extName",       ExtensionName,
          "extType",       ExtensionType,
          "metaruleId",    MetaruleId,
          "packageId",     PackageId,
          "connectorName", ConnectorName
      )
  | project-away
      Hostname, LocalIPAddress, NetDomain, FileName, FilePath, CommandLine,
      MD5, SHA256, SHA512, Publisher, Username, ParentProcess,
      GrandparentProcess, PolicyName, PolicyId, PolicyVersion, ParentPolicy,
      Checkpoint, SHA128, SHA384, IPAddress, ExtensionBrowser, ExtensionId,
      ExtensionName, ExtensionType, ExecutionType, ExecutionTypeName,
      MetaruleId, PackageId, ConnectorName, EventDateTime
version: 1
