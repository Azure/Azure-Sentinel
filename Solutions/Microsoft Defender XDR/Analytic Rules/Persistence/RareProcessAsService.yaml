id: 91a451e3-178f-41b2-9e5d-da97d75b9971
name: Rare Process as a Service
description: |
  This query is looking for rarely seen processes which are launched as a service. Whiltelisted process list need to be updated based on the environment.
  Author: Jouni Mikkola
  More info: https://threathunt.blog/rare-process-launch-as-a-service/
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceProcessEvents
      - DeviceNetworkEvents
      - DeviceFileEvents
      - DeviceImageLoadEvents
queryFrequency: 1d
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
relevantTechniques:
  - T1543
  - T1543.003
query: |
  let LookupTime = 14d;
  let WhiteList = dynamic([
      "svchost.exe",
      "mssense.exe",
      "msmpeng.exe",
      "searchindexer.exe",
      "microsoftedgeupdate.exe"
  ]);
  let ServiceEvents = materialize(
      DeviceProcessEvents
      | where TimeGenerated >= ago(LookupTime)
      | where InitiatingProcessParentFileName =~ "services.exe"
      | where InitiatingProcessFileName !in~ (WhiteList)
      | project
          DeviceName,
          ServiceProcess = InitiatingProcessFileName,
          ServiceProcessSHA1 = InitiatingProcessSHA1,
          ServiceProcessCmdline = InitiatingProcessCommandLine,
          ServiceProcessID = InitiatingProcessId,
          ServiceProcessCreationTime = InitiatingProcessCreationTime,
          ServiceProcessUser = InitiatingProcessAccountName,
          StartedChildProcess = FileName,
          StartedChildProcessCmdline = ProcessCommandLine
  );
  let RareServices =
      ServiceEvents
      | summarize hint.strategy=shuffle ExecutionCount = count() by DeviceName, ServiceProcess
      | where ExecutionCount < 6;
  let RareInstances =
      ServiceEvents
      | join kind=inner hint.strategy=shuffle (RareServices) on DeviceName, ServiceProcess
      | summarize hint.strategy=shuffle
          ChildProcesses = make_set(StartedChildProcess, 1000),
          ChildCommandlines = make_set(StartedChildProcessCmdline, 1000)
        by
          DeviceName,
          ServiceProcess,
          ServiceProcessSHA1,
          ServiceProcessCmdline,
          ServiceProcessID,
          ServiceProcessCreationTime,
          ServiceProcessUser;
  let NetworkEvents =
      DeviceNetworkEvents
      | where TimeGenerated >= ago(LookupTime)
      | where InitiatingProcessParentFileName =~ "services.exe"
      | where InitiatingProcessFileName !in~ (WhiteList)
      | summarize hint.strategy=shuffle
          ConnectedAddresses = make_set(RemoteIP, 1000),
          ConnectedUrls = make_set(RemoteUrl, 1000)
        by
          DeviceName,
          ServiceProcess = InitiatingProcessFileName,
          ServiceProcessSHA1 = InitiatingProcessSHA1,
          ServiceProcessCmdline = InitiatingProcessCommandLine,
          ServiceProcessID = InitiatingProcessId,
          ServiceProcessCreationTime = InitiatingProcessCreationTime,
          ServiceProcessUser = InitiatingProcessAccountName;
  let FileEvents =
      DeviceFileEvents
      | where TimeGenerated >= ago(LookupTime)
      | where InitiatingProcessParentFileName =~ "services.exe"
      | where InitiatingProcessFileName !in~ (WhiteList)
      | summarize hint.strategy=shuffle
          FilesModified = make_set(FileName, 1000),
          FileModFolderPath = make_set(FolderPath, 1000),
          FileModHA1s = make_set(SHA1, 1000)
        by
          DeviceName,
          ServiceProcess = InitiatingProcessFileName,
          ServiceProcessSHA1 = InitiatingProcessSHA1,
          ServiceProcessCmdline = InitiatingProcessCommandLine,
          ServiceProcessID = InitiatingProcessId,
          ServiceProcessCreationTime = InitiatingProcessCreationTime,
          ServiceProcessUser = InitiatingProcessAccountName;
  let ImageLoadEvents =
      DeviceImageLoadEvents
      | where TimeGenerated >= ago(LookupTime)
      | where InitiatingProcessParentFileName =~ "services.exe"
      | where InitiatingProcessFileName !in~ (WhiteList)
      | summarize hint.strategy=shuffle
          DLLsLoaded = make_set(FileName, 1000),
          DLLSHA1 = make_set(SHA1, 1000)
        by
          DeviceName,
          ServiceProcess = InitiatingProcessFileName,
          ServiceProcessSHA1 = InitiatingProcessSHA1,
          ServiceProcessCmdline = InitiatingProcessCommandLine,
          ServiceProcessID = InitiatingProcessId,
          ServiceProcessCreationTime = InitiatingProcessCreationTime,
          ServiceProcessUser = InitiatingProcessAccountName;
  RareInstances
  | join kind=leftouter hint.strategy=shuffle (
      NetworkEvents
  ) on DeviceName, ServiceProcess, ServiceProcessSHA1, ServiceProcessCmdline, ServiceProcessID, ServiceProcessCreationTime, ServiceProcessUser
  | join kind=leftouter hint.strategy=shuffle (
      FileEvents
  ) on DeviceName, ServiceProcess, ServiceProcessSHA1, ServiceProcessCmdline, ServiceProcessID, ServiceProcessCreationTime, ServiceProcessUser
  | join kind=leftouter hint.strategy=shuffle (
      ImageLoadEvents
  ) on DeviceName, ServiceProcess, ServiceProcessSHA1, ServiceProcessCmdline, ServiceProcessID, ServiceProcessCreationTime, ServiceProcessUser
  | extend HostName = iff(DeviceName has ".", tostring(split(DeviceName, ".")[0]), DeviceName)
  | extend DnsDomain = iff(DeviceName has ".", substring(DeviceName, indexof(DeviceName, ".") + 1), "")
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: DeviceName
      - identifier: HostName
        columnName: HostName
      - identifier: DnsDomain
        columnName: DnsDomain
  - entityType: Process
    fieldMappings:
      - identifier: ProcessId
        columnName: ServiceProcessID
      - identifier: CommandLine
        columnName: ServiceProcessCmdline
version: 1.0.1
kind: Scheduled
