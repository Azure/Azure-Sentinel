properties:
  id: xdr-1e6a8802-9129-44d4-a4f9-c6010b5725e8
  displayName: FortiNDR Cloud - Security Event Detected
  status: disabled
  queryCondition:
    queryText: |-
      Fortinet_FortiNDR_Cloud
      | extend AlertSeverity = case(EventType == 'FncEventsDetections_CL' and de_severity in~ ('high', 'critical'), 'High', EventType == 'FncEventsSuricata_CL' and su_sig_severity <= 2, 'High', EventType == 'FncEventsObservation_CL' and ob_confidence in~ ('high', 'critical'), 'High', EventType == 'FncEventsDetections_CL' and de_severity in~ ('medium', 'moderate'), 'Medium', EventType == 'FncEventsSuricata_CL' and su_sig_severity == 3, 'Medium', EventType == 'FncEventsObservation_CL' and ob_confidence in~ ('medium', 'moderate'), 'Medium', 'Low')
      | extend IncidentDevice = coalesce(de_device_ip, su_src_ip, ob_src_ip)
      | extend Description = coalesce(de_rule_name, su_sig_name, ob_observation_title)
      | summarize EventCount = count(), Descriptions = strcat_array(make_set(Description), '; '), EventTypes = strcat_array(make_set(EventType), ', '), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by IncidentDevice, AlertSeverity
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: FortiNDR Cloud - Security Event Detected
      description: '''Triggers an alert for High, Medium, or Low severity FortiNDR events grouped by target device and alert
        severity.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IncidentDevice
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      - tactic: Execution
        techniques:
        - technique: T1059
      - tactic: LateralMovement
        techniques:
        - technique: T1021
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
        - technique: T1568
      - tactic: Exfiltration
        techniques:
        - technique: T1041
      - tactic: Discovery
        techniques:
        - technique: T1046
      - tactic: Impact
        techniques:
        - technique: T1486
      customDetails:
        EventDescriptions: Descriptions
        EventTypes: EventTypes
        EventCount: EventCount
