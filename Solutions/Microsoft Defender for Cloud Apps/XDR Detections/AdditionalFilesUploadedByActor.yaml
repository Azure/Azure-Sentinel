properties:
  id: xdr-b9e3b9f8-a406-4151-9891-e5ff1ddd8c1d
  displayName: Linked Malicious Storage Artifacts
  status: disabled
  queryCondition:
    queryText: |-
      //Collect the alert events
      let alertData = AlertEvidence
      | where Title has "Potential malware uploaded to"
      | extend AdditionalFields = parse_json(AdditionalFields);
      //Parse the IP address data
      let ipData = alertData
      | where EntityType =~ "Ip" or tostring(AdditionalFields['Type']) =~ "ip"
      | extend AttackerIP = coalesce(RemoteIP, tostring(AdditionalFields['Address'])), AttackerCountry = tostring(AdditionalFields['Location']['CountryName']);
      //Parse the file data
      let FileData = alertData
      | where EntityType =~ "File" or tostring(AdditionalFields['Type']) =~ "file"
      | extend MaliciousFileDirectory = coalesce(FolderPath, tostring(AdditionalFields['Directory'])), MaliciousFileName = coalesce(FileName, tostring(AdditionalFields['Name'])), MaliciousFileHashes = coalesce(SHA256, SHA1, tostring(AdditionalFields['FileHashes']));
      //Combine the File and IP data together
      ipData
      | join (FileData) on AlertId
      | summarize by Timestamp, AttackerIP, AttackerCountry, Title, ResourceId = ResourceID, AlertType = ServiceSource, MaliciousFileDirectory, MaliciousFileName, MaliciousFileHashes
      //Create a type column so we can track if it was a File storage or blobl storage upload
      | extend type = iff(Title has "file", "File", "Blob")
      | join (
        union
        StorageFileLogs,
        StorageBlobLogs
        //File upload operations
        | where OperationName =~ "PutBlob" or OperationName =~ "PutRange"
        //Parse out the uploader IP
        | extend ClientIP = tostring(split(CallerIpAddress, ":", 0)[0])
        //Extract the filename from the Uri
        | extend FileName = extract(@"\/([\w\-. ]+)\?", 1, Uri)
        //Base64 decode the MD5 filehash, we will encounter non-ascii hex so string operations don't work
        //We can work around this by making it an array then converting it to hex from an int
        | extend base64Char = base64_decode_toarray(ResponseMd5)
        | mv-expand base64Char
        | extend hexChar = tohex(toint(base64Char))
        | extend hexChar = iff(strlen(hexChar) < 2, strcat("0", hexChar), hexChar)
        | extend SourceTable = iff(OperationName has "range", "StorageFileLogs", "StorageBlobLogs")
        | summarize make_list(hexChar, 1000) by CorrelationId, ResponseMd5, FileName, AccountName, TimeGenerated, RequestBodySize, ClientIP, SourceTable
        | extend Md5Hash = strcat_array(list_hexChar, "")
        //Pack the file information the summarise into a ClientIP row
        | extend p = pack("FileName", FileName, "FileSize", RequestBodySize, "Md5Hash", Md5Hash, "Time", TimeGenerated, "SourceTable", SourceTable)
        | summarize UploadedFileInfo=make_list(p, 10000), FilesUploaded=count() by ClientIP
            | join kind=leftouter (
              union
              StorageFileLogs,
              StorageBlobLogs
              | where OperationName =~ "DeleteFile" or OperationName =~ "DeleteBlob"
              | extend ClientIP = tostring(split(CallerIpAddress, ":", 0)[0])
              | extend FileName = extract(@"\/([\w\-. ]+)\?", 1, Uri)
              | extend SourceTable = iff(OperationName has "range", "StorageFileLogs", "StorageBlobLogs")
              | extend p = pack("FileName", FileName, "Time", TimeGenerated, "SourceTable", SourceTable)
              | summarize DeletedFileInfo=make_list(p, 10000), FilesDeleted=count() by ClientIP
              ) on ClientIP
        ) on $left.AttackerIP == $right.ClientIP
      | mvexpand UploadedFileInfo
      | extend LinkedMaliciousFileName = tostring(UploadedFileInfo.FileName)
      | extend LinkedMaliciousFileHash = tostring(UploadedFileInfo.Md5Hash)
      | extend HashAlgorithm = "MD5"
      | project AlertTimeGenerated = Timestamp, LinkedMaliciousFileName, LinkedMaliciousFileHash, HashAlgorithm, AlertType, AttackerIP, AttackerCountry, MaliciousFileDirectory, MaliciousFileName, FilesUploaded, UploadedFileInfo
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Linked Malicious Storage Artifacts
      description: '''This query identifies the additional files uploaded by the same IP address which triggered a malware
        alert for malicious content upload on Azure Blob or File Storage Container.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: AttackerIP
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      customDetails:
        FileHashAlgorithm: HashAlgorithm
        FileHashValue: LinkedMaliciousFileHash
