properties:
  id: xdr-65c2a6fe-ff7b-46b0-9278-61265f77f3bc
  displayName: Trend Micro CAS - Multiple infected users
  status: disabled
  queryCondition:
    queryText: |-
      TrendMicroCAS
      | where EventType has_all ('virtual', 'analyzer')
      | where isnotempty(VirusName)
      | summarize count() by DstUserName, VirusName, bin(TimeGenerated, 15m)
      | where count_ >= 2
      | extend AccountCustomEntity = DstUserName, MalwareCustomEntity = VirusName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Trend Micro CAS - Multiple infected users
      description: '''Detects when same malware was detected for multiple user account.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
      customDetails:
        AccountName: AccountCustomEntity
        MalwareName: MalwareCustomEntity
