properties:
  id: xdr-38e043ce-a1fd-497b-8d4f-ce5ca2db90cd
  displayName: Trend Micro CAS - Ransomware outbreak
  status: disabled
  queryCondition:
    queryText: "// TrendMicroCAS parser inlined: Defender XDR cannot resolve Sentinel workspace functions.\nlet xdr_inline_TrendMicroCAS\
      \ = view () {\nunion isfuzzy=true TrendMicroCAS_CL, TrendMicroCASV2_CL*, (datatable(TimeGenerated:datetime)[])\n| extend\n\
      \    EventVendor = \"Trend Micro\",\n    EventProduct = \"Cloud App Security\",\n    EventOriginalUid = coalesce(column_ifexists('LogItemId',\
      \ ''), tostring(column_ifexists('log_item_id_g', ''))),\n    EventCategoryType = coalesce(column_ifexists('Service',\
      \ ''), column_ifexists('service_s', '')),\n    EventType = coalesce(column_ifexists('Event', ''), column_ifexists('event_s',\
      \ '')),\n    ScanType = coalesce(column_ifexists('ScanType', ''), column_ifexists('message_scan_type_s', '')),\n   \
      \ DstUserName = coalesce(column_ifexists('AffectedUser', ''), column_ifexists('message_affected_user_s', '')),\n   \
      \ SrcFilePath = coalesce(column_ifexists('Location', ''), column_ifexists('message_location_s', '')),\n    DetectionTime\
      \ = coalesce(column_ifexists('DetectionTime', datetime(null)), column_ifexists('message_detection_time_t', datetime(null))),\n\
      \    TriggeredPolicyName = coalesce(column_ifexists('TriggeredPolicyName', ''), column_ifexists('message_triggered_policy_name_s',\
      \ '')),\n    TriggeredSecurityFilter = coalesce(column_ifexists('TriggeredSecurityFilter', ''), column_ifexists('message_triggered_security_filter_s',\
      \ '')),\n    EventOriginalResultDetails = coalesce(column_ifexists('Action', ''), column_ifexists('message_action_s',\
      \ '')),\n    EventResult = coalesce(column_ifexists('ActionResult', ''), column_ifexists('message_action_result_s',\
      \ '')),\n    MailMessageId = coalesce(column_ifexists('MailMessageId', ''), tostring(column_ifexists('message_mail_message_id_g',\
      \ ''))),\n    MailMessageSender = coalesce(column_ifexists('MailMessageSender', ''), column_ifexists('message_mail_message_sender_s',\
      \ '')),\n    MailMessageRecipient = coalesce(column_ifexists('MailMessageRecipient', dynamic(null)), column_ifexists('message_mail_message_recipient_d',\
      \ dynamic(null))),\n    MailMessageSubmitTime = coalesce(column_ifexists('MailMessageSubmitTime', datetime(null)), column_ifexists('message_mail_message_submit_time_t',\
      \ datetime(null))),\n    MailMessageDeliveryTime = coalesce(column_ifexists('MailMessageDeliveryTime', datetime(null)),\
      \ column_ifexists('message_mail_message_delivery_time_t', datetime(null))),\n    MailMessageSubject = coalesce(column_ifexists('MailMessageSubject',\
      \ ''), column_ifexists('message_mail_message_subject_s', '')),\n    MailMessageFileName = coalesce(column_ifexists('MailMessageFileName',\
      \ ''), column_ifexists('message_mail_message_file_name_s', '')),\n    SrcFileName = coalesce(column_ifexists('FileName',\
      \ ''), column_ifexists('message_file_name_s', '')),\n    FileUploadTime = coalesce(column_ifexists('FileUploadTime',\
      \ datetime(null)), column_ifexists('message_file_upload_time_t', datetime(null))),\n    SecurityRiskName = coalesce(column_ifexists('SecurityRiskName',\
      \ ''), column_ifexists('message_security_risk_name_s', '')),\n    DetectedBy = coalesce(column_ifexists('DetectedBy',\
      \ ''), column_ifexists('message_detected_by_s', '')),\n    RiskLevel = coalesce(column_ifexists('RiskLevel', ''), column_ifexists('message_risk_level_s',\
      \ '')),\n    SrcFileSHA1 = coalesce(column_ifexists('FileSHA1', ''), column_ifexists('message_file_sha1_s', '')),\n\
      \    SrcFileSHA256 = coalesce(column_ifexists('FileSHA256', ''), column_ifexists('message_file_sha256_s', '')),\n  \
      \  VirusName = coalesce(column_ifexists('VirusName', ''), column_ifexists('message_virus_name_s', '')),\n    DetectionType\
      \ = coalesce(column_ifexists('DetectionType', ''), column_ifexists('message_detection_type_s', '')),\n    RansomwareName\
      \ = coalesce(column_ifexists('RansomwareName', ''), column_ifexists('message_ransomware_name_s', '')),\n    TriggeredDlpTemplate\
      \ = coalesce(column_ifexists('TriggeredDlpTemplate', dynamic(null)), column_ifexists('message_triggered_dlp_template_d',\
      \ dynamic(null)))\n| project\n    TimeGenerated, EventVendor, EventProduct, EventOriginalUid, EventCategoryType, EventType,\n\
      \    ScanType, DstUserName, SrcFilePath, DetectionTime, TriggeredPolicyName, TriggeredSecurityFilter,\n    EventOriginalResultDetails,\
      \ EventResult, MailMessageId, MailMessageSender, MailMessageRecipient,\n    MailMessageSubmitTime, MailMessageDeliveryTime,\
      \ MailMessageSubject, MailMessageFileName,\n    SrcFileName, FileUploadTime, SecurityRiskName, DetectedBy, RiskLevel,\
      \ SrcFileSHA1, SrcFileSHA256,\n    VirusName, DetectionType, RansomwareName, TriggeredDlpTemplate\n};\nxdr_inline_TrendMicroCAS\n\
      | where EventType =~ 'ransomware'\n| summarize count() by DstUserName, bin(TimeGenerated, 2m)\n| where count_ >= 2\n\
      | extend AccountCustomEntity = DstUserName"
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: Trend Micro CAS - Ransomware outbreak
      description: '''Triggeres when ransomware was detected on several accounts.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1486
      customDetails:
        AccountName: AccountCustomEntity
