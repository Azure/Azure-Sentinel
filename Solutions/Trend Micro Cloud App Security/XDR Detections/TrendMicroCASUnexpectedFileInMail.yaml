properties:
  id: xdr-201fd2d1-9131-4b29-bace-ce5d19f3e4ee
  displayName: Trend Micro CAS - Unexpected file via mail
  status: disabled
  queryCondition:
    queryText: |-
      let f_types = dynamic(['ps1', 'bat', 'scr', 'sh', 'exe', 'js', 'lnk']);
      TrendMicroCAS
      | where EventCategoryType in~ ('exchange', 'gmail', 'exchangeserver')
      | where isnotempty(SrcFileName)
      | extend file_type = extract(@'\.(\w+)$', 1, SrcFileName)
      | where file_type in~ (f_types)
      | extend AccountCustomEntity = DstUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Trend Micro CAS - Unexpected file via mail
      description: '''Detects when unexpected file received via mail.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
      customDetails:
        AccountName: AccountCustomEntity
