properties:
  id: xdr-de54f817-f338-46bf-989b-4e016ea6b71b
  displayName: Trend Micro CAS - Unexpected file on file share
  status: disabled
  queryCondition:
    queryText: |-
      let f_types = dynamic(['ps1', 'bat', 'scr', 'sh', 'exe', 'js', 'lnk']);
      TrendMicroCAS
      | where EventCategoryType in~ ('sharepoint', 'onedrive', 'dropbox', 'box', 'googledrive')
      | where isnotempty(SrcFileName)
      | extend file_type = extract(@'\.(\w+)$', 1, SrcFileName)
      | where file_type in~ (f_types) or SrcFileName !contains @'.'
      | extend AccountCustomEntity = DstUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Trend Micro CAS - Unexpected file on file share
      description: '''Detects unexpected files on file share.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
      customDetails:
        AccountName: AccountCustomEntity
