properties:
  id: xdr-9e7b3811-d743-479c-a296-635410562429
  displayName: Trend Micro CAS - Possible phishing mail
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 5;
      TrendMicroCAS
      | where EventCategoryType in~ ('exchange', 'gmail', 'exchangeserver')
      | where isnotempty(SrcFileName)
      | where isnotempty(SecurityRiskName)
      | summarize r_users = makeset(DstUserName) by SrcFileName, bin(TimeGenerated, 30m)
      | where array_length(r_users) > threshold
      | extend AccountCustomEntity = r_users
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Trend Micro CAS - Possible phishing mail
      description: '''Detects possible phishing mail.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
      customDetails:
        AccountName: AccountCustomEntity
