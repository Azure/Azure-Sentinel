properties:
  id: xdr-9cc9ed36-573f-11ec-bf63-0242ac130002
  displayName: Oracle - Request to sensitive files
  status: disabled
  queryCondition:
    queryText: 'let forbidden_files = dynamic([''shadow'', ''passwd'', ''hosts'',
      ''id_rsa'']);

      OracleWebLogicServerEvent

      | extend File = extract(@''(.*\/)?(.*)'', 2, tostring(UrlOriginal))

      | where isnotempty(File)

      | where File in~ (forbidden_files)

      | extend FileCustomEntity = File, UrlCustomEntity = UrlOriginal, IPCustomEntity
      = SrcIpAddr'
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: Oracle - Request to sensitive files
      description: '''Detects request to sensitive files.'''
      severity: high
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlCustomEntity
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      customDetails:
        FileName: FileCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1189
