properties:
  id: xdr-41775080-5740-11ec-bf63-0242ac130002
  displayName: Oracle - Multiple client errors from single IP
  status: disabled
  queryCondition:
    queryText: 'let threshold = 100;

      OracleWebLogicServerEvent

      | where HttpStatusCode >= 400 and HttpStatusCode <= 499

      | summarize MultipleClientErrors = count() by SrcIpAddr, bin(TimeGenerated,
      5m)

      | where MultipleClientErrors > threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Oracle - Multiple client errors from single IP
      description: '''Detects multiple client errors from one source in short timeframe'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
