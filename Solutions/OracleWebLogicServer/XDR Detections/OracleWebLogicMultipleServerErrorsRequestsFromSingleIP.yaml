properties:
  id: xdr-268f4fde-5740-11ec-bf63-0242ac130002
  displayName: Oracle - Multiple server errors from single IP
  status: disabled
  queryCondition:
    queryText: 'let threshold = 100;

      OracleWebLogicServerEvent

      | where HttpStatusCode >= 500 and HttpStatusCode <= 599

      | summarize MultipleServerErrors = count() by SrcIpAddr, bin(TimeGenerated,
      5m)

      | where MultipleServerErrors > threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Oracle - Multiple server errors from single IP
      description: '''Detects multiple server errors from one source in short timeframe'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1498
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
