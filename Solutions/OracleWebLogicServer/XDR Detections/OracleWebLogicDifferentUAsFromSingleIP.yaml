properties:
  id: xdr-44c7d12a-573f-11ec-bf63-0242ac130002
  displayName: Oracle - Multiple user agents for single source
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5;

      OracleWebLogicServerEvent

      | where isnotempty(HttpUserAgentOriginal)

      | summarize ua_count=makeset(HttpUserAgentOriginal) by SrcIpAddr, bin(TimeGenerated,
      5m)

      | where array_length(ua_count) > threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Oracle - Multiple user agents for single source
      description: '''Detects requests with different user agents from one source
        in short timeframe.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
