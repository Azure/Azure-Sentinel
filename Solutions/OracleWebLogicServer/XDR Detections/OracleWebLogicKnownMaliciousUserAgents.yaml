      ''get-minimal'', ''gootkit auto-rooter scanner'', ''grabber'', ''grendel-scan'',
      ''havij'', ''inspath'', ''internet ninja'', ''jaascois'', ''zmeu'', ''masscan'',
      ''metis'', ''morfeus'', ''mysqloit'', ''n-stealth'', ''nessus'', ''netsparker'',
      ''nmap nse'', ''nmap scripting engine'', ''nmap-nse'', ''nsauditor'', ''openvas'',
      ''pangolin'', ''paros'', ''pmafind'', ''prog.customcrawler'', ''qualys was'',
      ''s.t.a.l.k.e.r.'', ''security scan'', ''springenwerk'', ''sql power injector'',
