properties:
  id: xdr-153ce6d8-5740-11ec-bf63-0242ac130002
  displayName: Oracle - Private IP in URL
  status: disabled
  queryCondition:
    queryText: 'OracleWebLogicServerEvent

      | where isnotempty(UrlOriginal)

      | where UrlOriginal matches regex @''(10\.\d{1,3}\.\d{1,3}\.\d{1,3})|(172\.1[6-9]\.\d{1,3}\.\d{1,3})|(172\.2[0-9]\.\d{1,3}\.\d{1,3})|(172\.3[0-1]\.\d{1,3}\.\d{1,3})|(192\.168\.\d{1,3}\.\d{1,3})''

      | extend IPCustomEntity = SrcIpAddr, UrlCustomEntity = UrlOriginal'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Oracle - Private IP in URL
      description: '''Detects requests to unusual URL'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlCustomEntity
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
