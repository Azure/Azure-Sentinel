properties:
  id: xdr-edc2f2b4-573f-11ec-bf63-0242ac130002
  displayName: Oracle - Put suspicious file
  status: disabled
  queryCondition:
    queryText: 'OracleWebLogicServerEvent

      | where HttpRequestMethod in~ ("POST", "PUT")

      | extend File = extract(@"(.*\/)?(.*)", 2, tostring(UrlOriginal))

      | where isnotempty(File)

      | where File matches regex @"([a-zA-Z0-9-_]+\.)([a-zA-Z0-9-]+\.[a-zA-Z0-9-]+)"

      | extend IPCustomEntity = SrcIpAddr, FileCustomEntity = File, UrlCustomEntity
      = UrlOriginal'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Oracle - Put suspicious file
      description: '''Detects PUT or POST of suspicious file'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlCustomEntity
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      customDetails:
        FileName: FileCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
      - tactic: Exfiltration
        techniques:
        - technique: T1048
