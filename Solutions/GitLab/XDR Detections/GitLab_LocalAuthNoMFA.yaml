properties:
  id: xdr-e0b45487-5c79-482d-8ac0-695de8c031af
  displayName: GitLab - Local Auth - No MFA
  status: disabled
  queryCondition:
    queryText: |-
      let isAdmin = true;
      GitLabAudit()
      | where AuthenticationType == "standard" and ((isAdmin and TargetDetails contains "Administrator") or (isAdmin==false))
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GitLab - Local Auth - No MFA
      description: '''This query checks GitLab Audit Logs to see if a user authenticated without MFA. Ot might mean that MFA
        was disabled for the GitLab server or that an external authentication provider was bypassed. This rule focuses on
        ''admin'' privileges but the parameter can be adapted to also include all users.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountFullName: AuthorName
