properties:
  id: xdr-57b1634b-531d-4eab-a456-8b855887428f
  displayName: GitLab - SSO - Sign-Ins Burst
  status: disabled
  queryCondition:
    queryText: |-
      let locationCountMin = 1;
      let appRegistrationName = "GitLab";
      SigninLogs
      | where AppDisplayName == appRegistrationName
      | where ResultType == 0
      | where Location != ""
      | summarize CountOfLocations = dcount(Location), Locations = make_set(Location) by User = Identity, UserPrincipalName, AADUserId = UserId
      | where CountOfLocations > locationCountMin
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GitLab - SSO - Sign-Ins Burst
      description: '''This query relies on Microsoft Entra ID sign-in activity when Microsoft Entra ID is used for SSO with
        GitLab to highlights GitLab accounts associated with multiple authentications from different geographical locations
        in a short space of time.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          aadUserIdColumn: AADUserId
          nameColumn: User
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
