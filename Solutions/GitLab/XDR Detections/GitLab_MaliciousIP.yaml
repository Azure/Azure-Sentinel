properties:
  id: xdr-7241740a-5280-4b74-820a-862312d721a8
  displayName: GitLab - TI - Connection from Malicious IP
  status: disabled
  queryCondition:
    queryText: |-
      ThreatIntelligenceIndicator
      | where Action == true
      // Picking up only IOCs that contain the entities we want
      | where isnotempty(NetworkIP) or isnotempty(EmailSourceIpAddress) or isnotempty(NetworkDestinationIP) or isnotempty(NetworkSourceIP)
      // Taking the first non-empty value based on potential IOC match availability
      | extend TI_ipEntity = iff(isnotempty(NetworkIP), NetworkIP, NetworkDestinationIP)
      | extend TI_ipEntity = iff(isempty(TI_ipEntity) and isnotempty(NetworkSourceIP), NetworkSourceIP, TI_ipEntity)
      | extend TI_ipEntity = iff(isempty(TI_ipEntity) and isnotempty(EmailSourceIpAddress), EmailSourceIpAddress, TI_ipEntity)
      //Exclude local addresses using ipv4_is_private operator
      |where ipv4_is_private(TI_ipEntity) == false and  TI_ipEntity !startswith "fe80" and TI_ipEntity !startswith "::" and TI_ipEntity !startswith "127."
      | join (GitLabAccess) on $left.TI_ipEntity == $right.IPAddress
      | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by IndicatorId
      | project LatestIndicatorTime, Description, ActivityGroupNames, IndicatorId, ThreatType, Url, ExpirationDateTime, ConfidenceScore, TimeGenerated = EventTime, TI_ipEntity, IPAddress, URI
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GitLab - TI - Connection from Malicious IP
      description: '''This query correlates Threat Intelligence data from Microsoft Sentinel with GitLab NGINX Access Logs
        (available in GitLab CE as well) to identify access from potentially TI-flagged IPs.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPAddress
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
