properties:
  id: xdr-3efd09bd-a582-4410-b7ec-5ff21cfad7bd
  displayName: GitLab - Abnormal number of repositories deleted
  status: disabled
  queryCondition:
    queryText: |-
      let LearningPeriod = 7d;
      let BinTime = 1h;
      let RunTime = 1h;
      let StartTime = 1h;
      let NumberOfStds = 3;
      let MinThreshold = 10.0;
      let EndRunTime = StartTime - RunTime;
      let EndLearningTime = StartTime + LearningPeriod;
      let GitLabRepositoryDestroyEvents = (GitLabAudit
      | where RemoveAction == "project" or RemoveAction == "repository");
      GitLabRepositoryDestroyEvents
      | where TimeGenerated between (ago(EndLearningTime) .. ago(StartTime))
      | summarize count() by bin(TimeGenerated, BinTime)
      | summarize AvgInLearning = avg(count_), StdInLearning = stdev(count_)
      | extend LearningThreshold = max_of(AvgInLearning + StdInLearning * NumberOfStds, MinThreshold)
      | extend Dummy = 1
      | join kind=innerunique (GitLabRepositoryDestroyEvents
      | where TimeGenerated between (ago(StartTime) .. ago(EndRunTime))
      | summarize CountInRunTime = count(), IPAddress = take_any(IPAddress), AuthorName = take_any(AuthorName) by bin(TimeGenerated, BinTime)
      | extend Dummy = 1) on Dummy
      | project TimeGenerated, AvgInLearning, StdInLearning, LearningThreshold, CountInRunTime, IPAddress, AuthorName
      | where CountInRunTime > LearningThreshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GitLab - Abnormal number of repositories deleted
      description: '''This hunting queries identify an unusual increase of repo deletion activities adversaries may want to
        disrupt availability or compromise integrity by deleting business data.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1485
      customDetails:
        AccountFullName: AuthorName
