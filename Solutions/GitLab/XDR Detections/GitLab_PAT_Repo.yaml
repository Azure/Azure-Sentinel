properties:
  id: xdr-4d6d8b0e-6d9a-4857-a141-f5d89393cddb
  displayName: GitLab - Personal Access Tokens creation over time
  status: disabled
  queryCondition:
    queryText: |-
      // l_min_tokens_created - minimum tokens created per repository per user per day to consider
      let l_min_tokens_created = 0;
      let interval = 1d;
      GitLabAudit()
      | where TargetType == "PersonalAccessToken"
      | project Severity, TimeGenerated = bin(todatetime(EventTime),1d), AuthorName, IPAddress = tostring(IPAddress), Repository = EntityName, Action, TargetType
      | summarize total = count() by Repository, TimeGenerated, AuthorName, IPAddress
      | where total >= l_min_tokens_created
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GitLab - Personal Access Tokens creation over time
      description: "'This queries GitLab Audit Logs for access tokens. Attacker can exfiltrate data from you GitLab repository\
        \ after gaining access to it by generating or hijacking access tokens. \nThis hunting queries allows you to track\
        \ the personal access tokens creation for each of your repositories. \nThe visualization allow you to quickly identify\
        \ anomalies/excessive creation, to further investigate repo access & permissions.'"
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1213
      customDetails:
        AccountName: AuthorName
