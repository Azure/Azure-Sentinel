properties:
  id: xdr-8b291c3d-90ba-4ebf-af2c-0283192d430e
  displayName: GitLab - Repository visibility to Public
  status: disabled
  queryCondition:
    queryText: |-
      GitLabAudit()
      | where SourceVisibility != "Public" and ChangeType == "visibility" and TargetVisibility == "Public"
      | project TimeGenerated, EventTime, IPAddress, AuthorName, ChangeType, TargetType, SourceVisibility,  TargetVisibility, EntityName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GitLab - Repository visibility to Public
      description: '''This query leverages GitLab Audit Logs. A repository in GitLab changed visibility from Private or Internal
        to Public which could indicate compromise, error or misconfiguration leading to exposing the repository to the public.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPAddress
        urls:
        - id: url1
          addressColumn: EntityName
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1556
      - tactic: DefenseEvasion
        techniques:
        - technique: T1556
      - tactic: CredentialAccess
        techniques:
        - technique: T1556
      customDetails:
        AccountFullName: AuthorName
