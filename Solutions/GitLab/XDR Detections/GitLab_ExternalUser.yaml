properties:
  id: xdr-c1544d8f-cbbd-4e35-8d32-5b9312279833
  displayName: GitLab - External User Added to GitLab
  status: disabled
  queryCondition:
    queryText: |-
      // List of allow-listed domains
      let allowedDomain = pack_array("mydomain.com");
      GitLabAudit()
      | where AddAction == "user"
      | project AuthorName, IPAddress, User = EntityName
      | join (GitLabApp
      | where UserAdded == 1
      | parse kind=regex Message with "User \"" User "\"" EmailAddress " was created"
      | project tostring(User), EmailAddress = substring(EmailAddress,2,strlen(EmailAddress)-3)) on User
      | project  AuthorName, IPAddress, User, EmailAddress, DomainName = tostring(extract("@(.*)$", 1, EmailAddress))
      | where allowedDomain !contains DomainName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GitLab - External User Added to GitLab
      description: '''This queries GitLab Application logs to list external user accounts (i.e.: account not in allow-listed
        domains) which have been added to GitLab users.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1136
      customDetails:
        AccountFullName: User
        AccountFullName_2: AuthorName
        DnsDomainName: DomainName
