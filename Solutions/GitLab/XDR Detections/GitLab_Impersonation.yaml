properties:
  id: xdr-0f4f16a2-b464-4c10-9a42-993da3e15a40
  displayName: GitLab - User Impersonation
  status: disabled
  queryCondition:
    queryText: |-
      let impersonationStart = (GitLabAudit
      | where CustomMessage == 'Started Impersonation');
      let impersonationStop = (GitLabAudit
      | where CustomMessage == 'Stopped Impersonation');
      impersonationStart
      | join kind=inner impersonationStop on $left.TargetID == $right.TargetID and $left.AuthorID == $right.AuthorID
      | where EventTime1 > EventTime
      | project TimeGenerated, AuthorID, AuthorName, TargetID, TargetDetails, IPStart = IPAddress, IPStop = IPAddress1, ImpStartTime = EventTime, ImpStopTime = EventTime1, EntityName
      | join kind=inner (GitLabAudit | project ActionTime = EventTime, AuthorName, Action, CustomMessage) on $left.TargetDetails == $right.AuthorName
      | where ImpStartTime < ActionTime and ActionTime < ImpStopTime
      | project TimeGenerated, AuthorID, AuthorName, TargetID, TargetDetails, IPStart, IPStop, ImpStartTime, ImpStopTime, ActionTime, Action, CustomMessage, EntityName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GitLab - User Impersonation
      description: '''This queries GitLab Audit Logs for user impersonation. A malicious operator or a compromised admin account
        could leverage the impersonation feature of GitLab to change code or repository settings bypassing usual processes.
        This hunting queries allows you to track the audit actions done under impersonation.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPStart
        - id: ip2
          addressColumn: IPStop
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: EntityName
        AccountFullName_2: TargetDetails
