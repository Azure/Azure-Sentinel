properties:
  id: xdr-a9956d3a-07a9-44a6-a279-081a85020cae
  displayName: ClientDeniedAccess
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 15;
      let rejectedAccess = SymantecVIP
      | where isnotempty(RADIUSAuth)
      | where RADIUSAuth =~ "Reject"
      | summarize Total = count() by ClientIP, bin(TimeGenerated, 15m)
      | where Total > threshold
      | project ClientIP;
      SymantecVIP
      | where isnotempty(RADIUSAuth)
      | where RADIUSAuth =~ "Reject"
      | join kind=inner rejectedAccess on ClientIP
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), count() by ClientIP, User
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: ClientDeniedAccess
      description: '''Creates an incident in the event a Client has an excessive amounts of denied access requests.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: ClientIP
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountFullName: User
