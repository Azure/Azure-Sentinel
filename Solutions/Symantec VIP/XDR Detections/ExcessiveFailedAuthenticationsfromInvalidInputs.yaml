properties:
  id: xdr-c775a46b-21b1-46d7-afa6-37e3e577a27b
  displayName: Excessive Failed Authentication from Invalid Inputs
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 15;
      SymantecVIP
      | where isnotempty(RADIUSAuth)
      | where RADIUSAuth =~ "Reject"
      | summarize Total = count() by bin(TimeGenerated, 15m), User, ClientIP
      | where Total > threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Excessive Failed Authentication from Invalid Inputs
      description: '''Creates an incident in the event that a user generates an excessive amount of failed authentications
        due to invalid inputs, indications of a potential brute force.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: ClientIP
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountFullName: User
