id: e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8a9b
name: High-risk internal endpoint with critical quantum vulnerability
description: |
  An internal endpoint or network appliance has a risk score above 20, indicating critical or high
  severity quantum vulnerabilities. This may include expired certificates on appliances, RSA keys
  shorter than 2048 bits, or multiple compounding vulnerabilities on the same endpoint. Immediate
  remediation is recommended.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: QCryptonPQCScannerAgentCCPDefinition
    dataTypes:
      - PQReadiness_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
relevantTechniques:
  - T1565
query: |
  PQReadiness_CL
  | where TimeGenerated > ago(1h)
  | where QuantumPosture == "vulnerable"
  | where RiskScore > 20
  | project TimeGenerated, ResourceName, ResourceType, AssetIdentifier, AssetKind, Algorithm, KeySize, SignatureAlgorithm, PostureReason, RiskScore, ExpiresOn, SubscriptionId, ResourceGroup
  | order by RiskScore desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: ResourceName
  - entityType: Url
    fieldMappings:
      - identifier: Url
        columnName: AssetIdentifier
version: 1.0.0
kind: Scheduled
