properties:
  id: xdr-8e0403b1-07f8-4865-b2e9-74d1e83200a4
  displayName: High Urgency IONIX Action Items
  status: disabled
  queryCondition:
    queryText: |-
      let timeframe = 14d;
      let min_urgency = 9;
      CyberpionActionItems_CL
       | where TimeGenerated > ago(timeframe)
       | summarize arg_max(TimeGenerated, *) by id_s
       | where is_open_b == true
       | where urgency_d >= min_urgency
       | extend timestamp = opening_datetime_t
       | extend DNSCustomEntity = host_s, host_s = host_s
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: High Urgency IONIX Action Items
      description: |-
        'This query creates an alert for active IONIX Action Items with high urgency (9-10).
         Urgency can be altered using the "min_urgency" variable in the query.'
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: host_s
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1195
