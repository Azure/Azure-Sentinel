      targetQuerySha256: d1e0d080fcb68742c9b7bf59a8543b474d69c502665389c698a7e6364db11e49
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 1
      identifier: FullName
      sourceColumn: service_account
      column: service_account
      status: unproven-destructive-projection
      reason: unproven-destructive-projection
properties:
  id: xdr-fc135860-8773-4ead-b5be-9789af1ff8ff
  displayName: GCP IAM - New Service Account Key
  status: disabled
  queryCondition:
    queryText: |-
      GCP_IAM
      | where PayloadMethodname =~ 'google.iam.admin.v1.CreateServiceAccountKey'
      | extend result = parse_json(todynamic(PayloadAuthorizationinfo))[0]['granted']
      | where result =~ 'true'
      | extend service_account = extract(@'serviceAccounts\/(.*?)@', 1, PayloadResponseName)
      | project-away result
        | extend AccountName = tostring(split(service_account, "@")[0]), AccountUPNSuffix = tostring(split(service_account, "@")[1])
  schedule:
    frequency: PT24H
  detectionAction:
    alertTemplate:
      title: GCP IAM - New Service Account Key
      description: '''Detects new service account key creation.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: LateralMovement
        techniques:
        - technique: T1550
