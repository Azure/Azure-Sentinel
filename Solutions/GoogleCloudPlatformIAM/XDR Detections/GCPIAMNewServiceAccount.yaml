properties:
  id: xdr-a768aa52-453e-4e3e-80c2-62928d2e2f56
  displayName: GCP IAM - New Service Account
  status: disabled
  queryCondition:
    queryText: |-
      GCP_IAM
      | where PayloadMethodname =~ 'google.iam.admin.v1.CreateServiceAccount'
      | extend result = parse_json(todynamic(PayloadAuthorizationinfo))[0]['granted']
      | where result =~ 'true'
      | project-away result
      | extend AccountName = tostring(split(PayloadRequestAccountId, "@")[0]), AccountUPNSuffix = tostring(split(PayloadRequestAccountId, "@")[1])
  schedule:
    frequency: PT24H
  detectionAction:
    alertTemplate:
      title: GCP IAM - New Service Account
      description: '''Detects new service account creation.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1136
