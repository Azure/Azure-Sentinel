properties:
  id: xdr-7ad3cfed-18c0-44af-9e9d-9fb5472a2321
  displayName: GCP IAM - Service Account Keys Enumeration
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 5;
      GCP_IAM
      | where PayloadMethodname =~ 'google.iam.admin.v1.ListServiceAccountKeys'
      | summarize count() by PayloadAuthenticationinfoPrincipalemail, bin(TimeGenerated, 1h)
      | where count_ > threshold
      | extend AccountCustomEntity = PayloadAuthenticationinfoPrincipalemail
  schedule:
    frequency: PT12H
  detectionAction:
    alertTemplate:
      title: GCP IAM - Service Account Keys Enumeration
      description: '''Detects possible service account keys enumeration.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1069
