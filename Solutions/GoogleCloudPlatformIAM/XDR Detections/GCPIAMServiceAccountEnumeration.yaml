properties:
  id: xdr-50e0437e-912d-4cd0-ac19-fef0aebdd3d7
  displayName: GCP IAM - Service Account Enumeration
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 5;
      GCP_IAM
      | where PayloadMethodname =~ 'google.iam.admin.v1.ListServiceAccounts'
      | summarize count() by PayloadAuthenticationinfoPrincipalemail, bin(TimeGenerated, 1h)
      | where count_ > threshold
      | extend AccountCustomEntity = PayloadAuthenticationinfoPrincipalemail
  schedule:
    frequency: PT12H
  detectionAction:
    alertTemplate:
      title: GCP IAM - Service Account Enumeration
      description: '''Detects possible service account enumeration.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1087
