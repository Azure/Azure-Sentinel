properties:
  id: xdr-52d88912-fa8b-4db2-b247-ee9225e41e8f
  displayName: GCP IAM - Privileges Enumeration
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 5;
      GCP_IAM
      | where PayloadMethodname =~ 'google.iam.admin.v1.ListRoles'
      | summarize count() by PayloadAuthenticationinfoPrincipalemail, bin(TimeGenerated, 1h)
      | where count_ > threshold
      | extend AccountCustomEntity = PayloadAuthenticationinfoPrincipalemail
  schedule:
    frequency: PT12H
  detectionAction:
    alertTemplate:
      title: GCP IAM - Privileges Enumeration
      description: '''Detects possible privileges enumeration.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1069
