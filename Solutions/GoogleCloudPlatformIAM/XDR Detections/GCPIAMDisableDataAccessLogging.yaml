properties:
  id: xdr-2530a631-9605-404d-ae58-58ef1f91b17c
  displayName: GCP IAM - Disable Data Access Logging
  status: disabled
  queryCondition:
    queryText: |-
      GCP_IAM
      | where PayloadMethodname == 'SetIamPolicy'
      | extend s = parse_json(todynamic(PayloadRequestPolicyAuditconfigs))[0]['auditLogConfigs']
      | where isempty(s)
      | extend AccountName = tostring(split(PayloadAuthenticationinfoPrincipalemail, "@")[0]), AccountUPNSuffix = tostring(split(PayloadAuthenticationinfoPrincipalemail, "@")[1])
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GCP IAM - Disable Data Access Logging
      description: '''Detects when Data Access Logging is disabled.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
      customDetails:
        AccountFullName: PayloadAuthenticationinfoPrincipalemail
