properties:
  id: xdr-4a433846-4b05-4a27-99d7-92093feded79
  displayName: GCP IAM - Publicly exposed storage bucket
  status: disabled
  queryCondition:
    queryText: |-
      GCP_IAM
      | where PayloadMethodname =~ 'google.iam.v1.IAMPolicy.SetIamPolicy'
      | where ResourceType has 'bucket'
      | extend members = parse_json(todynamic(PayloadRequestPolicyBindings))[0]['members']
      | extend action = parse_json(todynamic(PayloadRequestPolicyBindings))[0]['action']
      | where members in~ ('allUsers', 'allAuthenticatedUsers')
      | where action =~ 'ADD'
      | extend AccountName = tostring(split(PayloadAuthenticationinfoPrincipalemail, "@")[0]), AccountUPNSuffix = tostring(split(PayloadAuthenticationinfoPrincipalemail, "@")[1])
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GCP IAM - Publicly exposed storage bucket
      description: '''Detects possible misconfiguration for bucket policy making it publicly available.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1069
      customDetails:
        AccountFullName: PayloadAuthenticationinfoPrincipalemail
