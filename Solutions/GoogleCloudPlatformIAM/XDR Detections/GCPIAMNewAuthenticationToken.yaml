properties:
  id: xdr-80e4db30-5636-4fbd-8816-24c3ded8d243
  displayName: GCP IAM - New Authentication Token for Service Account
  status: disabled
  queryCondition:
    queryText: |-
      GCP_IAM
      | where PayloadMethodname in ('GenerateAccessToken', 'google.iam.admin.v1.GenerateAccessToken')
      | extend result = parse_json(todynamic(PayloadAuthorizationinfo))[0]['granted']
      | where result =~ 'true'
      | extend service_account = extract(@'serviceAccounts\/(.*?)@', 1, PayloadResponseName)
      | project-away result
      | extend AccountName = tostring(split(service_account, "@")[0]), AccountUPNSuffix = tostring(split(service_account, "@")[1])
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GCP IAM - New Authentication Token for Service Account
      description: '''Detects when new authentication token is created for service account.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: LateralMovement
        techniques:
        - technique: T1550
