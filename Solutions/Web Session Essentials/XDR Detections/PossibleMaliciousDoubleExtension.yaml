properties:
  id: xdr-6a71687f-00cf-44d3-93fc-8cbacc7b5615
  displayName: Detect potential presence of a malicious file with a double extension (ASIM Web Session)
  status: disabled
  queryCondition:
    queryText: |-
      let common_file_ext_list = dynamic([".txt", ".xlsx", ".doc", ".docx", ".csv", ".pdf", ".png", ".jpg", ".jpeg"]); // Add list of common files as per your environment
      _Im_WebSession (starttime=ago(1h), eventresult='Success')
      | where HttpRequestMethod in~ ("POST", "PUT")
      | project
          Url,
          SrcIpAddr,
          SrcUsername,
          SrcHostname,
          DstIpAddr,
          DstPortNumber,
          DstHostname,
          TimeGenerated
      | extend requestedFileName=tostring(split(tostring(parse_url(Url)["Path"]), '/')[-1])
      | extend FileWithdualextension = extract(@'([\w-]+\.\w+\.\w+)$', 1, requestedFileName, typeof(string))
      | extend SecondExt = tostring(split(FileWithdualextension, '.')[-1])
      | where strcat('.', SecondExt) in~ (common_file_ext_list) // Second extension is mostly from the common files
      | summarize
          EventCount=count(),
          EventStartTime=min(TimeGenerated),
          EventEndTime=max(TimeGenerated)
          by
          SrcIpAddr,
          Url,
          FileWithdualextension,
          SrcUsername,
          SrcHostname,
          DstIpAddr,
          DstPortNumber,
          DstHostname
      | extend Name = iif(SrcUsername contains "@", tostring(split(SrcUsername,'@',0)[0]),SrcUsername), UPNSuffix = iif(SrcUsername contains "@",tostring(split(SrcUsername,'@',1)[0]),"")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Detect potential presence of a malicious file with a double extension (ASIM Web Session)
      description: '''Double extension vulnerability is a significant concern in file uploads, as it can lead to various issues
        if an attacker successfully uploads a virus-infected file.'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: Url
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        hosts:
        - id: host1
          nameColumn: SrcHostname
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1036
      - tactic: Persistence
        techniques:
        - technique: T1505
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        EventCount: EventCount
        EventStartTime: EventStartTime
        EventEndTime: EventEndTime
        DstHostname: DstHostname
