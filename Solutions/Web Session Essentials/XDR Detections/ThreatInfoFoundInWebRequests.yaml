properties:
  id: xdr-7d2ed1c7-da26-45fd-b4ea-b6f2bbeccea7
  displayName: Detect threat information in web requests (ASIM Web Session)
  status: disabled
  queryCondition:
    queryText: |-
      let lookback= 5m;
      _Im_WebSession(starttime=ago(lookback))
      | project
          EventSeverity,
          ThreatName,
          ThreatCategory,
          ThreatRiskLevel,
          ThreatOriginalConfidence,
          ThreatField,
          TimeGenerated,
          SrcIpAddr,
          SrcUsername,
          SrcHostname,
          Url,
          DstIpAddr
      | where ThreatRiskLevel >= 90
          or toint(ThreatOriginalConfidence) >= 90
          or EventSeverity =~ "High"
      | summarize
          EventCount = count(),
          EventStartTime=min(TimeGenerated),
          EvenEndTime=max(TimeGenerated)
          by
          SrcIpAddr,
          SrcUsername,
          SrcHostname,
          Url,
          DstIpAddr,
          ThreatName,
          ThreatCategory,
          ThreatRiskLevel,
          ThreatOriginalConfidence,
          ThreatField
      | extend
          Name = iif(SrcUsername contains "@", tostring(split(SrcUsername, '@', 0)[0]), SrcUsername),
          UPNSuffix = iif(SrcUsername contains "@", tostring(split(SrcUsername, '@', 1)[0]), "")
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Detect threat information in web requests (ASIM Web Session)
      description: '''This rule would generate an alert if EvenSeverity is ''High'' or ''ThreatRiskLevel'' or ''ThreatOriginalConfidence''
        value is greater than 90.'
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: SrcHostname
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
        - id: ip2
          addressColumn: DstIpAddr
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
      customDetails:
        ThreatCategory: ThreatCategory
        ThreatConfidence: ThreatOriginalConfidence
        ThreatName: ThreatName
        EventStartTime: EventStartTime
        EvenEndTime: EvenEndTime
        EventCount: EventCount
