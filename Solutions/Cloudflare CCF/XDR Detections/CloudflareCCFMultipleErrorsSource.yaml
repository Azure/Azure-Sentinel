properties:
  id: xdr-cloudflare-multiple-error-requests-from-single-source-ef877d68
  displayName: Cloudflare - Multiple error requests from single source
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 100;
      Cloudflare
      | where HttpRequestMethod =~ 'GET'
      | summarize err_cnt = count() by SrcIpAddr, bin(TimeGenerated, 5m)
      | where err_cnt > threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - Multiple error requests from single source
      description: '''Detects multiple failure requests from single source in short timeframe.'''
      severity: low
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
