properties:
  id: xdr-cloudflare-unexpected-uri-dcb797cd
  displayName: Cloudflare - Unexpected URI
  status: disabled
  queryCondition:
    queryText: |-
      CloudflareV2_CL
      | where ClientRequestMethod =~ 'GET'
      | where EdgeResponseBytes != 0 or ClientRequestBytes != 0
      | where ClientRequestURI matches regex @'(127\.\d{1,3}\.\d{1,3}\.\d{1,3})|(10\.\d{1,3}\.\d{1,3}\.\d{1,3})|(172\.1[6-9]\.\d{1,3}\.\d{1,3})|(172\.2[0-9]\.\d{1,3}\.\d{1,3})|(172\.3[0-1]\.\d{1,3}\.\d{1,3})|(192\.168\.\d{1,3}\.\d{1,3})'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - Unexpected URI
      description: '''Detects client requests to unusual URI.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: ClientIP
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
