properties:
  id: xdr-cloudflare-unexpected-client-request-f32142b1
  displayName: Cloudflare - Unexpected client request
  status: disabled
  queryCondition:
    queryText: |-
      Cloudflare
      | where HttpRequestMethod =~ 'GET'
      | where DstBytes != 0 or SrcBytes != 0
      | where ClientRequestURI has_any ('/admin', '/admin.php', 'wp-admin', '.htaccess', '/etc/shadow', '/etc/passwd', '/etc/hosts', '/etc/ssh/')
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - Unexpected client request
      description: '''Detects client requests to unusual client request.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
