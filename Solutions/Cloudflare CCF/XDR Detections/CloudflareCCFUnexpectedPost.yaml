properties:
  id: xdr-cloudflare-unexpected-post-requests-7313352a
  displayName: Cloudflare - Unexpected POST requests
  status: disabled
  queryCondition:
    queryText: |-
      CloudflareV2_CL
      | where ClientRequestMethod in~ ('POST', 'PUT')
      | where tostring(OriginResponseStatus) startswith '2'
      | where EdgeResponseBytes != 0 or ClientRequestBytes != 0
      | extend fe = extract(@'.*(\.\w+)$', 1, ClientRequestURI)
      | where fe in~ ('.jpg', '.jpeg', '.gif', '.png', '.icon', '.ico', '.xml', '.swf', '.svg', '.ppt', '.pttx', '.doc', '.docx', '.rtf', '.pdf', '.tif', '.zip', '.mov')
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - Unexpected POST requests
      description: '''Detects post requests to unusual extensions.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: ClientIP
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1505
