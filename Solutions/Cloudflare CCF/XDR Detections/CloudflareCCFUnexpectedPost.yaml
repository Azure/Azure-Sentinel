resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 7313352a-09f6-4a84-88bd-6f17f1cbeb88
    path: Analytic Rules/CloudflareCCFUnexpectedPost.yaml
    version: 1.0.1
    querySha256: 9299e3e1e48411e460be875ab721b7527472087ad532fdf5e6f91fb873a14f3e
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
    - multiple source tactics were resolved by the configured per-rule override
    errors: []
