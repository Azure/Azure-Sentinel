properties:
  id: xdr-cloudflare-multiple-user-agents-for-single-source-fc50076a
  displayName: Cloudflare - Multiple user agents for single source
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      CloudflareV2_CL
      | where isnotempty(ClientRequestUserAgent)
      | summarize d_ua = dcount(ClientRequestUserAgent) by ClientIP, bin(TimeGenerated, 3m)
      | where d_ua > threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - Multiple user agents for single source
      description: '''Detects requests with different user agents from one source in short timeframe.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: ClientIP
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
