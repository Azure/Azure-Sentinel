properties:
  id: xdr-cloudflare-bad-client-ip-a7ce6135
  displayName: Cloudflare - Bad client IP
  status: disabled
  queryCondition:
    queryText: |-
      let ip_reputation = dynamic(['unknown', 'badHost', 'greylist', 'securityScanner', 'scan', 'tor']);
      Cloudflare
      | where ClientIPClass in~ (ip_reputation)
      | extend CompleteUrl = strcat(HttpRequestHeaderHost,ClientRequestPath)
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - Bad client IP
      description: '''Detects requests from IP with bad reputation index.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
        urls:
        - id: url1
          addressColumn: CompleteUrl
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
