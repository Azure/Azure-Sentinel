properties:
  id: xdr-cloudflare-waf-allowed-threat-f53fe2a9
  displayName: Cloudflare - WAF Allowed threat
  status: disabled
  queryCondition:
    queryText: |-
      Cloudflare
      | where isnotempty(WAFRuleID) or isnotempty(WAFRuleMessage)
      | where WAFAction =~ 'Allow'
      | extend CompleteUrl = strcat(HttpRequestHeaderHost,ClientRequestPath)
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - WAF Allowed threat
      description: '''Detects WAF "Allowed" action on threat events.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
        urls:
        - id: url1
          addressColumn: CompleteUrl
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
