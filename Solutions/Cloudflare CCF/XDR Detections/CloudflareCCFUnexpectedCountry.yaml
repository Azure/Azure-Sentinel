properties:
  id: xdr-cloudflare-client-request-from-country-in-blocklist-40554544
  displayName: Cloudflare - Client request from country in blocklist
  status: disabled
  queryCondition:
    queryText: |-
      let bl_countries = dynamic(['cn', 'hk']);
      CloudflareV2_CL
      | where ClientCountry in~ (bl_countries)
      | extend CompleteUrl = strcat(ClientRequestHost,ClientRequestPath)
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cloudflare - Client request from country in blocklist
      description: '''Detects requests from countries which are in blocklist.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: ClientIP
        urls:
        - id: url1
          addressColumn: CompleteUrl
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
