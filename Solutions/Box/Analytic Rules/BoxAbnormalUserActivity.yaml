id: 1139230c-cf10-45db-b616-fed0d1415c05
name: Box - Abmormal user activity
description: |
  'Identifies users whose Box activity in the last hour is well above their own hourly average over the previous 14 days.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: BoxDataConnector
    dataTypes:
      - BoxEvents_CL
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Collection
relevantTechniques:
  - T1530
query: |
  let lookback = 14d;
  let recent = 1h;
  let min_events = 50;
  let stdev_factor = 3;
  BoxEvents
  | where EventEndTime between (ago(lookback) .. now())
  | where isnotempty(SrcUserUpn)
  // hourly buckets are aligned to the run time, so the newest bucket is the last hour
  | summarize Events = count(), SrcUserName = take_any(SrcUserName) by SrcUserUpn, Hour = bin_at(EventEndTime, recent, now())
  | extend IsLastHour = Hour >= ago(recent)
  // the baseline is the average over the earlier hours in which the user was active
  | summarize EventsLastHour = sumif(Events, IsLastHour),
              BaselineHours = countif(not(IsLastHour)),
              BaselineAvg = avgif(Events, not(IsLastHour)),
              BaselineStdev = stdevif(Events, not(IsLastHour)),
              SrcUserName = take_any(SrcUserName)
              by SrcUserUpn
  // a user with no earlier activity has an empty baseline, treat it as zero
  | extend BaselineAvg = iff(BaselineHours == 0, 0.0, BaselineAvg)
  | where EventsLastHour >= min_events and EventsLastHour > BaselineAvg + stdev_factor * BaselineStdev
  | project SrcUserUpn, SrcUserName, EventsLastHour, BaselineAvg = round(BaselineAvg, 2), BaselineStdev = round(BaselineStdev, 2), BaselineHours
  | extend AccountCustomEntity = SrcUserUpn
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountCustomEntity
version: 1.0.2
kind: Scheduled