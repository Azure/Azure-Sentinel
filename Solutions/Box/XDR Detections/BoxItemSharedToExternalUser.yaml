properties:
  id: xdr-3b803560-f8a6-4db4-89cb-617d89724ba1
  displayName: Box - Item shared to external entity
  status: disabled
  queryCondition:
    queryText: 'BoxEvents

      | where EventType =~ ''COLLABORATION_INVITE''

      | extend corp_domain = tolower(extract(@''@(.*)'', 1, SrcUserUpn))

      | extend accessibleby_domain = tolower(extract(@''@(.*)'', 1, AccessibleByLogin))

      | where corp_domain != accessibleby_domain

      | extend AccountCustomEntity = SrcUserUpn'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Box - Item shared to external entity
      description: '''Detects when an item was shared to external entity.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1537
