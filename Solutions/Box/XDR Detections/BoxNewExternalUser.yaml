properties:
  id: xdr-fd36ac88-cd92-4137-aa23-37a3648621fa
  displayName: Box - New external user
  status: disabled
  queryCondition:
    queryText: 'BoxEvents

      | where EventType =~ ''NEW_USER''

      | extend corp_domain = tolower(extract(@''@(.*)'', 1, SrcUserUpn))

      | extend new_domain = tolower(extract(@''@(.*)'', 1, SourceLogin))

      | where corp_domain != new_domain

      | extend AccountCustomEntity = SourceLogin

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Box - New external user
      description: '''Detects when new user created with SourceLogin containing non-corporate
        domain.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      - tactic: Persistence
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: AccountCustomEntity
alertTemplate:
  tactics:
  - InitialAccess
