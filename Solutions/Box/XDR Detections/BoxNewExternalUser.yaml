    - Persistence
    originalTechniques:
    - T1078
    reviewScope:
      sourceDocumentSha256: e5943d5963121ec9937883c5949cb0cf18c08de0729e42fd0f1665b384439d53
      targetQuerySha256: 16901c8b7b652fa7b489a4897a495e5c87d330d90912cbd9daca780976af9885
    eventTimeWindow:
      status: default-native-lookback
      appliedDefault: hourly-1h-to-native-4h-lookback
      queryFrequency: 1h
      queryPeriod: 1h
      targetFrequency: PT1H
      effectiveLookback: PT4H
      originalSentinelLookbackSeconds: 3600
      effectiveEventWindowSeconds: 14400
      xdrServiceWindowSeconds: 14400
      filterInjected: false
      parityClaimed: false
      hasAggregation: false
      aggregationWindowDifference: false
      timingDifference: Four hours (PT4H / 14400s) is the native XDR ingestion-based
