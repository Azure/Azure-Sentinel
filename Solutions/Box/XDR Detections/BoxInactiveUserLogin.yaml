schemaVersion: 1.0.0
version: 3.2.2
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
requiredDataConnectors: &id001
- connectorId: BoxDataConnector
  dataTypes:
  - BoxEvents_CL
- connectorId: BoxEventsCCPDefinition
  dataTypes:
  - BoxEventsV2_CL
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - BoxEvents
    - BoxEventsV2_CL
    - BoxEvents_CL
  requiredDataConnectors: *id001
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: edbf38d7-e170-4af2-ad50-1a05b374611b
    path: Analytic Rules/BoxInactiveUserLogin.yaml
    version: 1.0.1
    querySha256: 7837329440e98b85f220a63151105047674fe56b483e4102b37064d462f1149e
    schedule:
      queryFrequency: 1h
      queryPeriod: 14d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1h, lookback=14d; target frequency=PT1H,
      native lookback=unknown/unconfigured; mixed, Sentinel-only, or unknown query
      surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/defender-xdr/custom-detection-rules#lookback'
    - Account mapping is incomplete and was removed
    - entity mappings were resolved by the configured per-rule override
    informational: []
    errors: []
    originalTactics:
    - InitialAccess
    originalTechniques:
    - T1078
    reviewScope:
      sourceDocumentSha256: 305db977e06d7a07332c530d180d0896536cd1010792e8d2a4698e092e82d877
      targetQuerySha256: 325c4c20af69e3adaa6112a11bfbec211a0415eb3596ab86a31b0d39e2106427
properties:
  id: xdr-edbf38d7-e170-4af2-ad50-1a05b374611b
  displayName: Box - Inactive user login
  status: disabled
  queryCondition:
    queryText: 'let lbperiod_start = 14d;

      let lbperiod_end = 7d;

      let lbtime = 1h;

      let active_users = BoxEvents

      | where EventEndTime between (ago(lbperiod_end) .. ago(lbtime))

      | where EventType =~ ''LOGIN''

      | summarize makeset(SourceName);

      let inactive_users = BoxEvents

      | where EventEndTime between (ago(lbperiod_start) .. ago(lbperiod_end))

      | where EventType =~ ''LOGIN''

      | where SourceName !in (active_users)

      | summarize makeset(SourceName);

      BoxEvents

      | where EventType == ''LOGIN''

      | where SourceName in (inactive_users)

      | extend AccountCustomEntity = SourceName'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Box - Inactive user login
      description: '''Detects user login after long inactivity period.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
