properties:
  id: xdr-174c31c9-22ec-42e5-8226-814391c08200
  displayName: Box - User role changed to owner
  status: disabled
  queryCondition:
    queryText: "let lbperiod = 14d;\nlet lbtime = 1h;\nBoxEvents\n| where EventEndTime\
      \ between (ago(lbperiod) .. ago(lbtime))\n| where EventType =~ 'COLLABORATION_INVITE'\n\
      | where AdditionalDetailsRole !~ 'Owner'\n| summarize min(EventEndTime) by AccessibleByName,\
      \ FileDirectory, AdditionalDetailsRole\n| project AccessibleByName, FileDirectory,\
      \ InitialRole = AdditionalDetailsRole\n|join (BoxEvents\n          | where EventType\
      \ =~ 'COLLABORATION_ROLE_CHANGE'\n          | summarize max(EventEndTime) by\
      \ AccessibleByName, FileDirectory, AdditionalDetailsRole\n          | project\
      \ AccessibleByName, FileDirectory, NewRole = AdditionalDetailsRole\n       \
      \   ) on FileDirectory, AccessibleByName\n| where NewRole =~ 'Owner'\n| project\
      \ AccessibleByName, FileDirectory\n| extend AccountCustomEntity = AccessibleByName"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Box - User role changed to owner
      description: '''Detects when user collaboration role is changed to owner.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
