properties:
  id: xdr-8889e69c-2161-412a-94a6-76c1b2d9daa7
  displayName: Box - Forbidden file type downloaded
  status: disabled
  queryCondition:
    queryText: 'let forbidden_files = dynamic([''ps1'', ''bat'', ''scr'', ''sh'']);

      BoxEvents

      | where EventType =~ ''DOWNLOAD''

      | extend file_type = extract(@''\.(\w+)$'', 1, SourceItemName)

      | where file_type in (forbidden_files)

      | extend AccountCustomEntity = SrcUserName

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Box - Forbidden file type downloaded
      description: '''Detects when new user downloads forbidden file types.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1189
      customDetails:
        AccountFullName: AccountCustomEntity
