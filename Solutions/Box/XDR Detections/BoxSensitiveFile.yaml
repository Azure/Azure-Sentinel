    version: 1.0.0
    querySha256: 35c6847cc3321b66bc82f1d1c2ea699253b5bd55d3088bfd6a7bb1d38d3c38ae
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
