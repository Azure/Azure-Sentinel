properties:
  id: xdr-266746ae-5eaf-4068-a980-5d630f435c46
  displayName: Box - File containing sensitive data
  status: disabled
  queryCondition:
    queryText: 'BoxEvents

      | where SourceItemName =~ ''id_rsa'' or SourceItemName contains ''password''
      or SourceItemName contains ''key'' or SourceItemName contains ''_key'' or SourceItemName
      contains ''.ssh'' or SourceItemName endswith ''.npmrc'' or SourceItemName endswith
      ''.muttrc'' or SourceItemName contains ''config.json'' or SourceItemName contains
      ''.gitconfig'' or SourceItemName endswith ''.netrc'' or SourceItemName endswith
      ''package.json'' or SourceItemName endswith ''Gemfile'' or SourceItemName endswith
      ''bower.json'' or SourceItemName endswith ''config.gypi'' or SourceItemName
      endswith ''travis.yml'' or SourceFileName =~ ''id_rsa'' or SourceFileName contains
      ''password'' or SourceFileName contains ''key'' or SourceFileName contains ''_key''
      or SourceFileName contains ''.ssh'' or SourceFileName endswith ''.npmrc'' or
      SourceFileName endswith ''.muttrc'' or SourceFileName contains ''config.json''
      or SourceFileName contains ''.gitconfig'' or SourceFileName endswith ''.netrc''
      or SourceFileName endswith ''package.json'' or SourceFileName endswith ''Gemfile''
      or SourceFileName contains ''bower.json'' or SourceFileName contains ''config.gypi''
      or SourceFileName contains ''travis.yml''

      | extend AccountCustomEntity = SrcUserName

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Box - File containing sensitive data
      description: '''Detects files which potentialy may contain sensitive data such
        as passwords, authentication tokens, secret keys.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1048
      customDetails:
        AccountFullName: AccountCustomEntity
