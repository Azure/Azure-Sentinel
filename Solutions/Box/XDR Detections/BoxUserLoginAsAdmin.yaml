properties:
  id: xdr-b2197d7f-4731-483c-89de-d48606b872da
  displayName: Box - User logged in as admin
  status: disabled
  queryCondition:
    queryText: 'let lbperiod_start = 14d;

      let lbperiod_end = 1d;

      let admins = BoxEvents

      | where EventEndTime between (ago(lbperiod_start) .. ago(lbperiod_end))

      | where EventType =~ ''ADMIN_LOGIN''

      | summarize makeset(SourceLogin);

      BoxEvents

      | where EventType =~ ''ADMIN_LOGIN''

      | where SourceLogin !in (admins)

      | extend AccountCustomEntity = SourceLogin

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Box - User logged in as admin
      description: '''Detects when user logged in as admin.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: AccountCustomEntity
