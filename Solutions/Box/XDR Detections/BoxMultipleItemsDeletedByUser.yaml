properties:
  id: xdr-1b212329-6f2c-46ca-9071-de3464f3d88d
  displayName: Box - Many items deleted by user
  status: disabled
  queryCondition:
    queryText: 'let threshold = 100;

      BoxEvents

      | where EventType =~ ''DELETE''

      | summarize deleted_items = dcount(SourceItemName) by SrcUserName, bin(EventEndTime,
      5m)

      | where deleted_items > threshold

      | extend AccountCustomEntity = SrcUserName'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Box - Many items deleted by user
      description: '''Detects when a user deletes many items in short period of time.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1485
