schemaVersion: 1.0.0
version: 3.2.2
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
requiredDataConnectors: []
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - ADOAuditLogs_CL
  requiredDataConnectors:
  - connectorId: AzureDevOpsAuditLogs
    dataTypes:
    - ADOAuditLogs_CL
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: acfdee3f-b794-404a-aeba-ef6a1fa08ad1
    path: Analytic Rules/ADOAgentPoolCreatedDeleted.yaml
    version: 1.0.5
    querySha256: cec48599e8c05d1278a9a4a26ca57d70bddadf7ae1382306761c8062a7865b19
    schedule:
      queryFrequency: 7d
      queryPeriod: 14d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=7d, lookback=14d; target frequency=P7D, native lookback=unknown/unconfigured; mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Account.FullName value is retained as customDetails.AccountFullName from query column `ActorUPN`, but its target output binding requires runtime-schema verification; custom details do not restore entity identity or correlation
    - Supplemental customDetails.AccountFullName column `ActorUPN` requires runtime output-schema binding verification
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified and the service drops all custom details if exceeded
    informational: []
    errors: []
    originalTactics:
    - DefenseEvasion
    originalTechniques:
    - T1578.002
    reviewScope:
      sourceDocumentSha256: 0ff84d27661b6f3e249b450fc973245f6b8419cacef90554efac721a106d0bc3
      targetQuerySha256: 417b8cb737efc1e5ca8d97d2432c3a1eb1c2f94bbf4eef84a540c9b4345bf0d9
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 1
      identifier: FullName
      sourceColumn: ActorUPN
      column: ActorUPN
      status: runtime-binding-pending
      customDetailKey: AccountFullName
    dependencyReviewRequired: false
properties:
  id: xdr-acfdee3f-b794-404a-aeba-ef6a1fa08ad1
  displayName: Azure DevOps Agent Pool Created Then Deleted
  status: disabled
  queryCondition:
    queryText: 'let lookback = 14d;

      let timewindow = 7d;

      AzureDevOpsAuditing

      | where TimeGenerated > ago(lookback)

      | where OperationName =~ "Library.AgentPoolCreated"

      | extend AgentCloudId = tostring(Data.AgentCloudId)

      | extend PoolType = iif(isnotempty(AgentCloudId), "Azure VMs", "Self Hosted")

      // Comment this line out to include cloud pools as well

      | where PoolType == "Self Hosted"

      | extend AgentPoolName = tostring(Data.AgentPoolName)

      | extend AgentPoolId = tostring(Data.AgentPoolId)

      | extend IsHosted = tostring(Data.IsHosted)

      | extend IsLegacy = tostring(Data.IsLegacy)

      | extend timekey = bin(TimeGenerated, timewindow)

      // Join only with pools deleted in the same window

      | join (AzureDevOpsAuditing

      | where TimeGenerated > ago(lookback)

      | where OperationName =~ "Library.AgentPoolDeleted"

      | extend AgentPoolName = tostring(Data.AgentPoolName)

      | extend AgentPoolId = tostring(Data.AgentPoolId)

      | extend timekey = bin(TimeGenerated, timewindow)) on AgentPoolId, timekey

      | project-reorder TimeGenerated, ActorUPN, UserAgent, IpAddress, AuthenticationMechanism, OperationName, AgentPoolName, IsHosted, IsLegacy, Data

      | extend timestamp = TimeGenerated

      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])'
  schedule:
    frequency: P7D
  detectionAction:
    alertTemplate:
      title: Azure DevOps Agent Pool Created Then Deleted
      description: '''As well as adding build agents to an existing pool to execute malicious activity within a pipeline, an attacker could create a complete new agent pool and use this for execution.

        Azure DevOps allows for the creation of agent pools with Azure hosted infrastructure or self-hosted infrastructure. Given the additional customizability of self-hosted agents this   detection focuses on the creation of new self-hosted pools.

        To further reduce false positive rates the detection looks for pools created and deleted relatively quickly (within 7 days by default), as an attacker is likely to remove a malic'
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1578
          subTechniques:
          - T1578.002
      customDetails:
        AccountFullName: ActorUPN
