properties:
  id: xdr-5f0d80db-3415-4265-9d52-8466b7372e3a
  displayName: Azure DevOps PAT used with Browser
  status: disabled
  queryCondition:
    queryText: 'AzureDevOpsAuditing

      | where AuthenticationMechanism startswith "PAT"

      // Look for useragents that include a redenring engine

      | where UserAgent has_any ("Gecko", "WebKit", "Presto", "Trident", "EdgeHTML", "Blink")

      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Azure DevOps PAT used with Browser
      description: "'Personal Access Tokens (PATs) are used as an alternate password to authenticate into Azure DevOps. PATs are intended for programmatic access use in code or applications. \nThis can be prone to attacker theft if not adequately secured. This query looks for the use of a PAT in authentication but from a User Agent indicating a browser. \nThis should not be normal activity and could be an indicator of an attacker using a stolen PAT.'"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1528
      customDetails:
        AccountFullName: ActorUPN
