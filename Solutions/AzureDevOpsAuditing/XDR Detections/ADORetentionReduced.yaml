properties:
  id: xdr-71d374e0-1cf8-4e50-aecd-ab6c519795c2
  displayName: Azure DevOps Retention Reduced
  status: disabled
  queryCondition:
    queryText: 'AzureDevOpsAuditing

      | where OperationName =~ "Pipelines.PipelineRetentionSettingChanged"

      | where Data.SettingName in ("PurgeArtifacts", "PurgeRuns")

      | where Data.NewValue == 1 or Data.NewValue < Data.OldValue/2

      | project-reorder TimeGenerated, OperationName, ActorUPN, IpAddress, UserAgent, Data

      | extend timestamp = TimeGenerated

      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Azure DevOps Retention Reduced
      description: '''AzureDevOps retains items such as run records and produced artifacts for a configurable amount of time. An attacker looking to reduce the footprint left by their malicious activity may look to reduce the retention time for artifacts and runs.

        This query will look for where retention has been reduced to the minimum level - 1, or reduced by more than half.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1564
      customDetails:
        AccountFullName: ActorUPN
