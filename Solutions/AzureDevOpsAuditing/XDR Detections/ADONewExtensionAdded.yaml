    id: bf07ca9c-e408-443a-8939-6860a45a929e
    path: Analytic Rules/ADONewExtensionAdded.yaml
    version: 1.0.4
    querySha256: 21ad1b18b200afae960613b861b7c008a3719c828de3b895950c56fd6f248b3b
    schedule:
      queryFrequency: 1d
