properties:
  id: xdr-bf07ca9c-e408-443a-8939-6860a45a929e
  displayName: Azure DevOps New Extension Added
  status: disabled
  queryCondition:
    queryText: 'let allowed_publishers = dynamic([]);

      AzureDevOpsAuditing

      | where OperationName =~ "Extension.Installed"

      | extend ExtensionName = tostring(Data.ExtensionName)

      | extend PublisherName = tostring(Data.PublisherName)

      | where PublisherName !in (allowed_publishers)

      | project-reorder TimeGenerated, OperationName, ExtensionName, PublisherName, ActorUPN, IpAddress, UserAgent, ScopeDisplayName, Data

      | extend timestamp = TimeGenerated

      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Azure DevOps New Extension Added
      description: "'Extensions add additional features to Azure DevOps. An attacker could use a malicious extension to conduct malicious activity. \nThis query looks for new extensions that are not from a configurable list of approved publishers.'"
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1505
      customDetails:
        AccountFullName: ActorUPN
