properties:
  id: xdr-155e9134-d5ad-4a6f-88f3-99c220040b66
  displayName: Azure DevOps Pipeline modified by a new user
  status: disabled
  queryCondition:
    queryText: '// Set the lookback to determine if user has created pipelines before

      let timeback = 14d;

      // Set the period for detections

      let timeframe = 1d;

      // Get a list of previous Release Pipeline creators to exclude

      let releaseusers = AzureDevOpsAuditing

      | where TimeGenerated > ago(timeback) and TimeGenerated < ago(timeframe)

      | where OperationName in ("Release.ReleasePipelineCreated", "Release.ReleasePipelineModified")

      // We want to look for users performing actions in specific projects so we create this userscope object to match on

      | extend UserScope = strcat(ActorUserId, "-", ProjectName)

      | summarize by UserScope;

      // Get Release Pipeline creations by new users

      AzureDevOpsAuditing

      | where TimeGenerated > ago(timeframe)

      | where OperationName =~ "Release.ReleasePipelineModified"

      | extend UserScope = strcat(ActorUserId, "-", ProjectName)

      | where UserScope !in (releaseusers)

      | extend ActorUPN = tolower(ActorUPN)

      | project-away Id, ActivityId, ActorCUID, ScopeId, ProjectId, TenantId, SourceSystem, UserScope

      // See if any of these users have Azure AD alerts associated with them in the same timeframe

      | join kind = leftouter (

      SecurityAlert

      | where TimeGenerated > ago(timeframe)

      | where ProviderName == "IPC"

      | extend AadUserId = tostring(parse_json(Entities)[0].AadUserId)

      | summarize Alerts=count() by AadUserId) on $left.ActorUserId == $right.AadUserId

      | extend Alerts = iif(isnotempty(Alerts), Alerts, 0)

      // Uncomment the line below to only show results where the user as AADIdP alerts

      //| where Alerts > 0

      | extend timestamp = TimeGenerated

      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Azure DevOps Pipeline modified by a new user
      description: "'There are several potential pipeline steps that could be modified by an attacker to inject malicious code into the build cycle. A likely attacker path is the modification to an existing pipeline that they have access to. \nThis detection looks for users modifying a pipeline when they have not previously been observed modifying or creating that pipeline before. This query also joins events with data to Microsoft Entra ID Protection in order to show if the user conducting the action has any associated Microsoft Entra ID Protection alerts. You can also choose to filter this detection to only aler"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1569
      - tactic: DefenseEvasion
        techniques:
        - technique: T1578
