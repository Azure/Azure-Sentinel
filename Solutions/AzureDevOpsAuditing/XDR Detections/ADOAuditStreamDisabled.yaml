properties:
  id: xdr-4e8238bd-ff4f-4126-a9f6-09b3b6801b3d
  displayName: Azure DevOps Audit Stream Disabled
  status: disabled
  queryCondition:
    queryText: 'AzureDevOpsAuditing

      | where OperationName =~ "AuditLog.StreamDisabledByUser"

      | extend StreamType = tostring(Data.ConsumerType)

      | project-reorder TimeGenerated, Details, ActorUPN, IpAddress, UserAgent, StreamType

      | extend timestamp = TimeGenerated

      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Azure DevOps Audit Stream Disabled
      description: '''Azure DevOps allow for audit logs to be streamed to external storage solutions such as SIEM solutions. An attacker looking to hide malicious Azure DevOps activity from defenders may look to disable data streams before conducting activity and then re-enabling the stream after (so as not to raise data threshold-based alarms). Looking for disabled audit streams can identify this activity, and due to the nature of the action its unlikely to have a high false positive rate.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.008
      customDetails:
        AccountFullName: ActorUPN
