properties:
  id: xdr-35ce9aff-1708-45b8-a295-5e9a307f5f17
  displayName: New PA, PCA, or PCAS added to Azure DevOps
  status: disabled
  queryCondition:
    queryText: 'AzureDevOpsAuditing

      | where OperationName =~ "Group.UpdateGroupMembership.Add"

      | where Details has_any ("Project Administrators", "Project Collection Administrators", "Project Collection Service Accounts", "Build Administrator")

      | project-reorder TimeGenerated, Details, ActorUPN, IpAddress, UserAgent, AuthenticationMechanism, ScopeDisplayName

      | extend timekey = bin(TimeGenerated, 1h)

      | extend ActorUserId = tostring(Data.MemberId)

      | project timekey, ActorUserId, AddingUser=ActorUPN, TimeAdded=TimeGenerated, PermissionGrantDetails = Details

      // Get details of operations conducted by user soon after elevation of permissions

      | join (AzureDevOpsAuditing

      | extend ActorUserId = tostring(Data.MemberId)

      | extend timekey = bin(TimeGenerated, 1h)) on timekey, ActorUserId

      | summarize ActionsWhenAdded = make_set(OperationName) by ActorUPN, AddingUser, TimeAdded, PermissionGrantDetails, IpAddress, UserAgent

      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])

      | extend AddingUserAccountName = tostring(split(AddingUser, "@")[0]), AddingUserAccountUPNSuffix = tostring(split(AddingUser, "@")[1])'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: New PA, PCA, or PCAS added to Azure DevOps
      description: "'In order for an attacker to be able to conduct many potential attacks against Azure DevOps they will need to gain elevated permissions. \nThis detection looks for users being granted key administrative permissions. If the principal of least privilege is applied, the number of users granted these permissions should be small. Note that permissions can also be granted via Microsoft Entra ID Protection groups and monitoring of these should also be conducted.'"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        - id: account2
          nameColumn: AddingUserAccountName
          upnSuffixColumn: AddingUserAccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      customDetails:
        AccountFullName: ActorUPN
        AccountFullName_2: AddingUser
