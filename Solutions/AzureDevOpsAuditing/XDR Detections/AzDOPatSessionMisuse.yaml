properties:
  id: xdr-ac891683-53c3-4f86-86b4-c361708e2b2b
  displayName: Azure DevOps Personal Access Token (PAT) misuse
  status: disabled
  queryCondition:
    queryText: "// Allowlisted UPNs should likely stay empty\nlet AllowlistedUpns = datatable(UPN:string)['foo@bar.com', 'test@foo.com'];\n// Operation Name parts that will alert\nlet HasAnyBlocklist = datatable(OperationNamePart:string)['Security.','Project.','AuditLog.','Extension.'];\n// Distinct Operation Names that will flag\nlet HasExactBlocklist = datatable(OperationName:string)['Group.UpdateGroupMembership.Add','Library.ServiceConnectionExecuted','Pipelines.PipelineModified',\n'Release.ReleasePipelineModified', 'Git.RefUpdatePoliciesBypassed'];\nAzureDevOpsAuditing\n| where AuthenticationMechanism startswith \"PAT\" and (OperationName has_any (HasAnyBlocklist) or OperationName in (HasExactBlocklist))\n  and ActorUPN !in (AllowlistedUpns)\n| project TimeGenerated, AuthenticationMechanism, ProjectName, ActorUPN, ActorDisplayName, IpAddress, UserAgent, OperationName, Details, Data\n| extend timestamp = TimeGenerated\n| extend AccountName = tostring(split(ActorUPN, \"@\")[0]), AccountUPNSuffix\
      \ = tostring(split(ActorUPN, \"@\")[1])"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Azure DevOps Personal Access Token (PAT) misuse
      description: '''This Alert detects whenever a PAT is used in ways that PATs are not normally used. May require an allow list and baselining.

        Reference - https://docs.microsoft.com/azure/devops/organizations/accounts/use-personal-access-tokens-to-authenticate?view=azure-devops&tabs=preview-page

        Use this query for baselining:

        ADOAuditLogs

        | distinct OperationName'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1559
      - tactic: Impact
        techniques:
        - technique: T1496
      customDetails:
        AccountFullName: ActorUPN
