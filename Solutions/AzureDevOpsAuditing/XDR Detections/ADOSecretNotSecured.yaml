properties:
  id: xdr-4ca74dc0-8352-4ac5-893c-73571cc78331
  displayName: Azure DevOps Variable Secret Not Secured
  status: disabled
  queryCondition:
    queryText: 'let keywords = dynamic(["secret", "secrets", "password", "PAT", "passwd", "pswd", "pwd", "cred", "creds", "credentials", "credential", "key"]);

      AzureDevOpsAuditing

      | where OperationName =~ "Library.VariableGroupModified"

      | extend Type = tostring(Data.Type)

      | extend VariableGroupId = tostring(Data.VariableGroupId)

      | extend VariableGroupName = tostring(Data.VariableGroupName)

      | mv-expand Data.Variables

      | where VariableGroupName has_any (keywords) or Data_Variables has_any (keywords)

      | where Type != "AzureKeyVault"

      | where Data_Variables !has "IsSecret"

      | extend timestamp = TimeGenerated

      | extend AccountName = tostring(split(ActorUPN, "@")[0]), AccountUPNSuffix = tostring(split(ActorUPN, "@")[1])'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Azure DevOps Variable Secret Not Secured
      description: "'Credentials used in the build process may be stored as Azure DevOps variables. To secure these variables they should be stored in KeyVault or marked as Secrets. \nThis detection looks for new variables added with names that suggest they are credentials but where they are not set as Secrets or stored in KeyVault.'"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: IpAddress
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1552
      customDetails:
        AccountFullName: ActorUPN
