requiredDataConnectors: []
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - ADOAuditLogs_CL
  requiredDataConnectors:
  - connectorId: AzureDevOpsAuditLogs
    dataTypes:
    - ADOAuditLogs_CL
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 4ca74dc0-8352-4ac5-893c-73571cc78331
    path: Analytic Rules/ADOSecretNotSecured.yaml
    version: 1.0.4
    querySha256: 74d12bc3710763103390488662f61178303e5bda515bce5d364e4515d4618001
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1d, lookback=1d; target frequency=P1D, native lookback=unknown/unconfigured; mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Account.FullName value is retained as customDetails.AccountFullName from query column `ActorUPN`, but its target output binding requires runtime-schema verification; custom details do not restore entity identity or correlation
