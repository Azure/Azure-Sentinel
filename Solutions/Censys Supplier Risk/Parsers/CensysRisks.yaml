Function:
  Title: Parser for Censys risks
  Version: "1.0.0"
  LastUpdated: "2026-10-21"
Category: Microsoft Sentinel Parser
FunctionName: CensysRisks
FunctionAlias: CensysRisks
FunctionQuery: |
  // Current state of every supplier risk: the latest event of each risk instance, whether the risk is open or closed
  let CensysRisks_view = view () {
      CensysRiskEvents
      | summarize arg_max(InsertedAt, *) by RiskInstanceId
  };
  CensysRisks_view
