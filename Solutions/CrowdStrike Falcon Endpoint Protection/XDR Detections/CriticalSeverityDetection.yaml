properties:
  id: xdr-f7d298b2-726c-42a5-bbac-0d7f9950f527
  displayName: Common Event Format (CEF) via AMA - Critical Severity Detection
  status: disabled
  queryCondition:
    queryText: |-
      let timeframe = 1h;
      CrowdStrikeFalconEventStream
      | where TimeGenerated > ago(timeframe)
      | where EventType == "DetectionSummaryEvent"
      | where Severity == "Critical"
      | summarize StartTimeUtc = min(TimeGenerated), EndTimeUtc = max(TimeGenerated), Total = count() by DstHostName, SrcIpAddr, DstUserName, Activity, Technique, FileName, FilePath, FileHash, Message
      | extend timestamp = StartTimeUtc, AccountCustomEntity = DstUserName, HostCustomEntity = DstHostName, IPCustomEntity = SrcIpAddr, FileHashCustomEntity = FileHash, FileHashAlgo = "MD5"
      | project StartTimeUtc, EndTimeUtc, Total, DstHostName, SrcIpAddr, DstUserName, Activity, Technique, FileName, FilePath, FileHash, Message, timestamp, AccountCustomEntity, HostCustomEntity, IPCustomEntity, FileHashCustomEntity, FileHashAlgo
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Common Event Format (CEF) via AMA - Critical Severity Detection
      description: '''Creates an incident when a CrowdStrike Falcon sensor detection is triggered with Critical severity.
        The rule queries CrowdStrikeFalconEventStream for DetectionSummaryEvent records where Severity is Critical, summarizes
        detections by host, source IP, user, activity, technique, file details, hash, and message, and raises an incident
        for each matching result.'''
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1204
          subTechniques:
          - T1204.002
      - tactic: Impact
        techniques:
        - technique: T1499
      customDetails:
        DetectionCount: Total
        DetectionMessage: Message
        DetectionTechnique: Technique
        DetectionActivity: Activity
        DetectionFileName: FileName
        DetectionFilePath: FilePath
        DetectionHost: DstHostName
        DetectionUser: DstUserName
        DetectionSourceIp: SrcIpAddr
        AccountFullName: AccountCustomEntity
        HostFullName: HostCustomEntity
        FileHashAlgorithm: FileHashAlgo
        FileHashValue: FileHashCustomEntity
