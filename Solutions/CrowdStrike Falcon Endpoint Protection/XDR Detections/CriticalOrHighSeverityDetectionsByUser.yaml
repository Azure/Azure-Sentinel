properties:
  id: xdr-4465ebde-b381-45f7-ad08-7d818070a11c
  displayName: Common Event Format (CEF) via AMA - Critical or High Severity Detections by User
  status: disabled
  queryCondition:
    queryText: |-
      let timeframe = 1h;
      let threshold = 15; // update threshold value based on organization's preference
      let NotableEvents = CrowdStrikeFalconEventStream
      | where TimeGenerated > ago(timeframe)
      | where EventType == "DetectionSummaryEvent"
      | where Severity in ("Critical", "High")
      | summarize StartTimeUtc = min(TimeGenerated), EndTimeUtc = max(TimeGenerated), Total = count() by DstUserName, DstHostName, SrcIpAddr, FileName, FileHash, Message
      | where Total > threshold;
      NotableEvents
      | extend timestamp = StartTimeUtc, AccountCustomEntity = DstUserName, HostCustomEntity = DstHostName, IPCustomEntity = SrcIpAddr, FileHashCustomEntity = FileHash, FileHashAlgo = "MD5"
      | project timestamp, StartTimeUtc, EndTimeUtc, DstUserName, DstHostName, SrcIpAddr, FileName, FileHash, FileHashAlgo, Message, Total, AccountCustomEntity, HostCustomEntity, IPCustomEntity, FileHashCustomEntity
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Common Event Format (CEF) via AMA - Critical or High Severity Detections by User
      description: '''Creates an incident when a large number of Critical or High severity CrowdStrike Falcon sensor detections
        is triggered by a single user within 1 hour. The rule uses the CrowdStrikeFalconEventStream table, filters for DetectionSummaryEvent
        records with Severity set to Critical or High, and alerts when detections for a single DstUserName exceed the configured
        threshold of 15. Review DstHostName, SrcIpAddr, FileName, FileHash, and Message for investigation context.'''
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1489
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
      customDetails:
        DstUserName: DstUserName
        DstHostName: DstHostName
        SrcIpAddr: SrcIpAddr
        FileName: FileName
        FileHash: FileHash
        Total: Total
        AccountFullName: AccountCustomEntity
        HostFullName: HostCustomEntity
        FileHashAlgorithm: FileHashAlgo
        FileHashValue: FileHashCustomEntity
