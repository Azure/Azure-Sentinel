Function:
  Title: Union Parser for all CrowdStrike API events 
  Version: '1.0.0'
  LastUpdated: '2026-08-13'
Category: CrowdStrikeParser
FunctionName: CrowdStrike
FunctionAlias: CrowdStrike
FunctionQuery: |
    let CrowdStrikeAlerts_view = view () {
        CrowdStrikeAlerts
        | extend TemplateInstanceId = tostring(TemplateInstanceId)
    };
    let CrowdStrikeAlertsV2_view = view () {
        CrowdStrikeAlertsV2_CL
        | extend TemplateInstanceId = tostring(TemplateInstanceId)
    };
    let CrowdStrikeCases_view = view () {
        CrowdStrikeCases
    };
    let CrowdStrikeCasesV2_view = view () {
        CrowdStrikeCasesV2_CL
    };
    let CrowdStrikeDetections_view = view () {
        CrowdStrikeDetections
    };
    let CrowdStrikeDetectionsV2_view = view () {
        CrowdStrikeDetectionsV2_CL
    };
    let CrowdStrikeHosts_view = view () {
        CrowdStrikeHosts
    };
    let CrowdStrikeHostsV2_view = view () {
        CrowdStrikeHostsV2_CL
    };
    let CrowdStrikeVulnerabilities_view = view () {
        CrowdStrikeVulnerabilities
    };
    let CrowdStrikeVulnerabilitiesV2_view = view () {
        CrowdStrikeVulnerabilitiesV2_CL
    };
    union isfuzzy=true CrowdStrikeAlerts_view, CrowdStrikeAlertsV2_view, CrowdStrikeCases_view, CrowdStrikeCasesV2_view, CrowdStrikeDetections_view, CrowdStrikeDetectionsV2_view, CrowdStrikeHosts_view, CrowdStrikeHostsV2_view, CrowdStrikeVulnerabilities_view, CrowdStrikeVulnerabilitiesV2_view
