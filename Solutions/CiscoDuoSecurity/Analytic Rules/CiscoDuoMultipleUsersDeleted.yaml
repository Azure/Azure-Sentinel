id: 6e4f9031-91d3-4fa1-8baf-624935f04ad8
name: Cisco Duo - Multiple users deleted
description: |
  'Detects when multiple users were deleted.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: CiscoDuoActivityConnectorDefinition
    dataTypes:
      - DuoActivity_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
relevantTechniques:
  - T1531
query: |
  DuoActivity_CL
  | where ActionName =~ "user_delete"
  | summarize count() by ActorName, bin(TimeGenerated, 10m)
  | where count_ > 1
  | extend AccountCustomEntity = ActorName
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
version: 1.0.1
kind: Scheduled
