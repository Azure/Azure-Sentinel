id: 398dd1cd-3251-49d8-b927-5b93bae4a094
name: Cisco Duo - AD sync failed
description: |
  'Detects when AD syncronization failed.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: CiscoDuoActivityConnectorDefinition
    dataTypes:
      - DuoActivity_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
relevantTechniques:
  - T1489
query: |
  DuoActivity_CL
  | where ActionName =~ "ad_sync_failed"
  | extend IPCustomEntity = AccessDeviceIp
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.1
kind: Scheduled
