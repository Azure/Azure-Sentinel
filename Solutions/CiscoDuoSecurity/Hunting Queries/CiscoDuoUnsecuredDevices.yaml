id: c308e737-e620-4c89-ab1e-a186e901b087
name: Cisco Duo - Devices with unsecure settings
description: |
  'Query searches for devices with unsecure settings.'
severity: Medium
requiredDataConnectors:
  - connectorId: CiscoDuoAuthConnectorDefinition
    dataTypes:
      - DuoAuthentication_CL
tactics:
  - InitialAccess
relevantTechniques:
  - T1078
query: |
  DuoAuthentication_CL
  | where TimeGenerated > ago(24h)
  | where tobool(AccessDeviceIsEncryptionEnabled) == false or tobool(AccessDeviceIsFirewallEnabled) == false or tobool(AccessDeviceIsPasswordSet) == false
  | project TimeGenerated, AccessDeviceIp, UserName
  | extend AccountCustomEntity = UserName, IPCustomEntity = AccessDeviceIp
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
