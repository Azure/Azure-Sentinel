id: b8c43652-1b79-4b18-a348-a719bafad6d3
name: Cisco Duo - Authentication errors
description: |
  'Query searches for authentication errors.'
severity: Medium
requiredDataConnectors:
  - connectorId: CiscoDuoAuthConnectorDefinition
    dataTypes:
      - DuoAuthentication_CL
tactics:
  - InitialAccess
relevantTechniques:
  - T1078
query: |
  DuoAuthentication_CL
  | where TimeGenerated > ago(24h)
  | where Result =~ 'error'
  | project TimeGenerated, UserName, AccessDeviceIp, Reason
  | extend AccountCustomEntity = UserName, IPCustomEntity = AccessDeviceIp
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
