id: 5d0b00fd-1dc0-4e1b-ae09-5cec3b4fadf6
name: Cisco Duo - Deleted users
description: |
  'Query searches for deleted users.'
severity: Medium
requiredDataConnectors:
  - connectorId: CiscoDuoActivityConnectorDefinition
    dataTypes:
      - DuoActivity_CL
tactics:
  - Impact
relevantTechniques:
  - T1531
query: |
  DuoActivity_CL
  | where TimeGenerated > ago(24h)
  | where ActionName =~ "user_delete"
  | project TimeGenerated, AccessDeviceIp, TargetName, ActorName
  | extend AccountCustomEntity = TargetName, IPCustomEntity = AccessDeviceIp
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
