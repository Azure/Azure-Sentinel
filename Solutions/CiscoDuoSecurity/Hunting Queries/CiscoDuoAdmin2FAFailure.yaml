id: 421bbeed-ad5b-4acd-9f0b-6b609da33914
name: Cisco Duo - Admin failure authentications
description: |
  'Query searches for administrator issue completing secondary authentication.'
severity: Medium
requiredDataConnectors:
  - connectorId: CiscoDuoActivityConnectorDefinition
    dataTypes:
      - DuoActivity_CL
tactics:
  - InitialAccess
relevantTechniques:
  - T1078
query: |
  DuoActivity_CL
  | where TimeGenerated > ago(24h)
  | where ActionName =~ "admin_2fa_error"
  | project TimeGenerated, AccessDeviceIp, ActorName
  | extend AccountCustomEntity = ActorName, IPCustomEntity = AccessDeviceIp
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
