id: 9de62fee-f601-43c9-8757-2098e59fedeb
name: Cisco Duo - Devices with vulnerable OS
description: |
  'Query searches for devices with vulnerable OS.'
severity: Medium
requiredDataConnectors:
  - connectorId: CiscoDuoAuthConnectorDefinition
    dataTypes:
      - DuoAuthentication_CL
tactics:
  - InitialAccess
relevantTechniques:
  - T1078
query: |
  let os_latest = 'x.x.xxx'; // Put the latest version of OS here before running the query
  DuoAuthentication_CL
  | where TimeGenerated > ago(24h)
  | where AccessDeviceOsVersion != os_latest
  | project TimeGenerated, AccessDeviceIp, UserName
  | extend AccountCustomEntity = UserName, IPCustomEntity = AccessDeviceIp
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
