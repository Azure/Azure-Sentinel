id: 72c81132-bc09-4a2f-9c32-02e2e9ee7978
name: Cisco Duo - New users
description: |
  'Query searches for new users created.'
severity: Medium
requiredDataConnectors:
  - connectorId: CiscoDuoActivityConnectorDefinition
    dataTypes:
      - DuoActivity_CL
tactics:
  - InitialAccess
  - Persistence
relevantTechniques:
  - T1078
query: |
  DuoActivity_CL
  | where TimeGenerated > ago(24h)
  | where ActionName == "user_create"
  | project TimeGenerated, AccessDeviceIp, TargetName, ActorName
  | extend AccountCustomEntity = TargetName, IPCustomEntity = AccessDeviceIp
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
