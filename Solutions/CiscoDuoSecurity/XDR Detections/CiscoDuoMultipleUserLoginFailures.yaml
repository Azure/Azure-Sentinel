properties:
  id: xdr-034f62b6-df51-49f3-831f-1e4cfd3c40d2
  displayName: Cisco Duo - Multiple user login failures
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      DuoAuthentication_CL
      | where Result in~ ('denied', 'failure')
      | summarize count() by UserName, bin(TimeGenerated, 10m)
      | where count_ > threshold
      | extend AccountCustomEntity = UserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco Duo - Multiple user login failures
      description: '''Detects when multiple user login failures occurs.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
