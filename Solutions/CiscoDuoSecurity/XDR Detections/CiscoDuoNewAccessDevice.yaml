properties:
  id: xdr-f05271b6-26a5-49cf-ad73-4a202fba6eb6
  displayName: Cisco Duo - New access device
  status: disabled
  queryCondition:
    queryText: |-
      DuoAuthentication_CL
      | where Result =~ 'success'
      | where isnotempty(AccessDeviceIp)
      | summarize dvc_ip = make_set(AccessDeviceIp) by UserName
      | join (DuoAuthentication_CL
              | where Result =~ 'success') on UserName
      | where dvc_ip !has AccessDeviceIp
      | extend IPCustomEntity = AccessDeviceIp, AccountCustomEntity = UserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco Duo - New access device
      description: '''Detects new access device.'''
      severity: medium
