properties:
  id: xdr-6e4f9031-91d3-4fa1-8baf-624935f04ad8
  displayName: Cisco Duo - Multiple users deleted
  status: disabled
  queryCondition:
    queryText: |-
      DuoActivity_CL
      | where ActionName =~ "user_delete"
      | summarize count() by ActorName, bin(TimeGenerated, 10m)
      | where count_ > 1
      | extend AccountCustomEntity = ActorName
  schedule:
