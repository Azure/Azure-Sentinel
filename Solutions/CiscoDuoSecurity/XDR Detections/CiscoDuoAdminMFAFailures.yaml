properties:
  id: xdr-e46c5588-e643-4a60-a008-5ba9a4c84328
  displayName: Cisco Duo - Multiple admin 2FA failures
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      DuoActivity_CL
      | where ActionName =~ "admin_2fa_error"
      | summarize count() by ActorName, bin(TimeGenerated, 10m)
      | where count_ > threshold
      | extend AccountCustomEntity = ActorName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco Duo - Multiple admin 2FA failures
      description: '''Detects when multiple admin 2FA failures occurs.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
