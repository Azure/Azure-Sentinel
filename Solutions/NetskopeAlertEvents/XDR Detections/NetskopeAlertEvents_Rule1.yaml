  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: a1f6c2d4-8b35-4e19-9c7a-2d4e6f8a1b30
    path: Analytic Rules/NetskopeAlertEvents_Rule1.yaml
    version: 1.0.0
    querySha256: 551bce19634c367552738543d6fd12ebcecc6173df23c67bb3d9117f8906332a
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - Unconfirmed generic Account.Name mapping was omitted because another required Host, Mailbox, or IP asset is available
