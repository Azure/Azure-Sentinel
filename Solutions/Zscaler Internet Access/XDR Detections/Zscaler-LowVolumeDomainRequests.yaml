    kind: AnalyticsRule
    id: 4d500e6d-c984-43a3-9f39-7edec8dcc04d
    path: Analytic Rules/Zscaler-LowVolumeDomainRequests.yaml
    version: 1.0.5
    querySha256: 0303838d46bc0e7387bc328686881b5d52f7c64da5406de44ae73f8ca5dbbd2f
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
