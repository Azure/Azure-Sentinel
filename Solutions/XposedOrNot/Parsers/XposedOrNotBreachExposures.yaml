id: 80fbc942-09d0-44fc-a150-19ceb54af039
Function:
  Title: Parser for XposedOrNot breach exposures
  Version: '1.0.0'
  LastUpdated: '2026-11-11'
Category: Microsoft Sentinel Parser
FunctionName: XposedOrNotBreachExposures
FunctionAlias: XposedOrNotBreachExposures
FunctionQuery: |
    let Catalog = XposedOrNotBreachCatalog_CL
        | summarize arg_max(TimeGenerated, *) by BreachName
        | project BreachName, BreachedDate, AddedDate, BreachDomain, Industry, BreachType, PasswordRisk, ExposedData, ExposedRecords, BreachDescription, IsSearchable, IsSensitive, IsVerified, ReferenceUrl, LogoUrl;
    XposedOrNotExposures_CL
    | summarize FirstSeen = min(TimeGenerated), TimeGenerated = max(TimeGenerated) by Domain, Email, EmailDomain, BreachName
    | join kind=leftouter Catalog on BreachName
    | project
        TimeGenerated,
        FirstSeen,
        Email,
        EmailDomain,
        Domain,
        BreachName,
        BreachedDate,
        AddedDate,
        PasswordRisk = iff(isempty(PasswordRisk), "unknown", PasswordRisk),
        ExposedDataTypes = strcat_array(ExposedData, ";"),
        ExposedRecords,
        BreachDescription,
        BreachDomain,
        Industry,
        BreachType,
        IsSearchable,
        IsSensitive,
        IsVerified,
        ReferenceUrl,
        LogoUrl
