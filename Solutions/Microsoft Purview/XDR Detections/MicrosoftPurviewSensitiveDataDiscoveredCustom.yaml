properties:
  id: xdr-79f296d9-e6e4-45dc-9ca7-1770955435fa
  displayName: Sensitive Data Discovered in the Last 24 Hours - Customized
  status: disabled
  queryCondition:
    queryText: |-
      PurviewDataSensitivityLogs
      | where Classification contains "Social Security Number"
      //| where SourceRegion == "westeurope"
      //| where SourceType contains "Amazon"
      | where TimeGenerated > ago(24h)
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Sensitive Data Discovered in the Last 24 Hours - Customized
      description: '''Customized query used to identify specific classifications and parameters that have been discovered
        on assets in the last 24 hours by Microsoft Purview. By default, the query identifies Social Security Numbers detected,
        but the specific classification monitored along with other data fields can be adjusted. A list of supported Microsoft
        Purview classifications can be found here: https://docs.microsoft.com/azure/purview/supported-classifications'''
      severity: informational
      entityMappings:
        azureResources:
        - id: azureResource1
          resourceIdColumn: SourcePath
        files:
        - id: file1
          nameColumn: AssetName
        accounts:
        - id: account1
          upnColumn: PurviewAccountName
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1087
      customDetails:
        AssetName: AssetName
        Classification: Classification
        AssetPath: AssetPath
        SourceRegion: SourceRegion
        PurviewAccount: PurviewAccountName
        LastScanTime: AssetLastScanTime
