properties:
  id: xdr-64d16e62-1a17-4a35-9ea7-2b9fe6f07118
  displayName: Potential Password Spray Attack
  status: disabled
  queryCondition:
    queryText: |-
      let FailureThreshold = 15;
      SalesforceServiceCloud
      | where EventType =~ 'Login' and  LoginStatus != 'LOGIN_NO_ERROR'
      | where LoginStatus  in~ ('LOGIN_ERROR_INVALID_PASSWORD', 'LOGIN_ERROR_SSO_PWD_INVALID')
      | extend TimestampDerived = todatetime(TimestampDerived)
      | summarize UserCount=dcount(UserId), Users = make_set(UserId,100) by ClientIp, bin(TimestampDerived, 5m)
      | where UserCount > FailureThreshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Potential Password Spray Attack
      description: '''This query searches for failed attempts to log in from more than 15 various users within a 5 minutes
        timeframe from the same source. This is a potential indication of a password spray attack.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: ClientIp
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        Users: Users
