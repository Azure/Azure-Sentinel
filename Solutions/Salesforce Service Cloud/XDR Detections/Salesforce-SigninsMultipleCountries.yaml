properties:
  id: xdr-3094e036-e5ae-4d6e-8626-b0f86ebc71f2
  displayName: User Sign in from different countries
  status: disabled
  queryCondition:
    queryText: |-
      let __xdr_inline_SalesforceServiceCloud = () {
          union SalesforceServiceCloud_CL, SalesforceServiceCloudV2_CL, SalesforceServiceCloudV3_CL
          | extend
              EventType = column_ifexists('event_type_s', column_ifexists('EventType', '')),
              LoginStatus = column_ifexists('login_status_s', column_ifexists('LoginStatus', '')),
              ClientIp = column_ifexists('client_ip_s', column_ifexists('ClientIp', '')),
              User = column_ifexists('user_name_s', column_ifexists('User', '')),
              UserId = column_ifexists('user_id_s', column_ifexists('UserId', '')),
              UserType = column_ifexists('user_type_s', column_ifexists('UserType', '')),
              TimestampDerived = column_ifexists('timestamp_derived_t', column_ifexists('TimestampDerived', ''))
      };
      let threshold = 2;
      let Countrydb = externaldata(Network:string, geoname_id:string, continent_code:string, continent_name:string, country_iso_code:string, country_name:string)
      [@"https://raw.githubusercontent.com/datasets/geoip2-ipv4/master/data/geoip2-ipv4.csv"];
      let UsersLocation = __xdr_inline_SalesforceServiceCloud
      | where EventType =~ 'Login' and LoginStatus=~'LOGIN_NO_ERROR'
      | project TimeGenerated, TimestampDerived, ClientIp, UserId, User, UserType ;
      UsersLocation
      | extend Dummy=1
      | extend TimestampDerived = todatetime(TimestampDerived)
      | summarize count() by Hour=bin(TimestampDerived,30m), ClientIp,User, Dummy
      | partition by Hour(
                      lookup (Countrydb|extend Dummy=1) on Dummy
                    | where ipv4_is_match(ClientIp, Network)
                    )
      | summarize NumOfCountries = dcount(country_name) by User, Hour
      | where NumOfCountries >= threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: User Sign in from different countries
      description: '''This query searches for successful user logins from different countries within 30 mins.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          aadUserIdColumn: User
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
