id: 6625e5b8-e65c-4f91-8216-bb0b59122a44
Function:
  Title: Union Parser for all Salesforce Audit log events 
  Version: '1.0.0'
  LastUpdated: '2026-08-18'
Category: Microsoft Sentinel Parser
FunctionName: SalesforceAuditLogs
FunctionAlias: SalesforceAuditLogs
FunctionQuery: |
    let SalesforceAuditTrail_view = view () {
        SalesforceAuditTrail
    };
    let SalesforceAuditTrailV2_view = view () {
        SalesforceAuditTrailV2_CL
    };
    let SalesforceLoginHistory_view = view () {
        SalesforceLoginHistory
    };
    let SalesforceLoginHistoryV2_view = view () {
        SalesforceLoginHistoryV2_CL
    };
    union isfuzzy=true SalesforceAuditTrail_view, SalesforceAuditTrailV2_view, SalesforceLoginHistory_view, SalesforceLoginHistoryV2_view
