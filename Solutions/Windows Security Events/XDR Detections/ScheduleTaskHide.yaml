properties:
  id: xdr-6dd2629c-534b-4275-8201-d7968b4fa77e
  displayName: Scheduled Task Hide
  status: disabled
  queryCondition:
    queryText: |-
      SecurityEvent
      | where EventID == 4657
      | extend EventData = parse_xml(EventData).EventData.Data
      | mv-expand bagexpansion=array EventData
      | evaluate bag_unpack(EventData)
      | extend Key = tostring(column_ifexists('@Name', "")), Value = column_ifexists('#text', "")
      | evaluate pivot(Key, any(Value), TimeGenerated, TargetAccount, Computer, EventSourceName, Channel, Task, Level, EventID, Activity, TargetLogonId, SourceComputerId, EventOriginId, Type, _ResourceId, TenantId, SourceSystem, ManagementGroupName, IpAddress, Account)
      | extend ObjectName = column_ifexists('ObjectName', ""), OperationType = column_ifexists('OperationType', ""), ObjectValueName = column_ifexists('ObjectValueName', "")
      | where ObjectName has 'Schedule\\TaskCache\\Tree' and ObjectValueName == "SD" and OperationType == "%%1906"  // %%1906 - Registry value deleted
      | extend HostName = tostring(split(Computer, ".")[0]), DomainIndex = toint(indexof(Computer, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(Computer, DomainIndex + 1), Computer)
      | extend AccountName = tostring(split(TargetAccount, @'\')[1]), AccountNTDomain = tostring(split(TargetAccount, @'\')[0])
      | extend timestamp = TimeGenerated
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Scheduled Task Hide
      description: |-
        'Identifies malware hiding scheduled tasks by deleting the SD (Security Descriptor) value, making tasks disappear from schtasks /query and Task Scheduler.
         Enable registry auditing policy and auditing on HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree.
         Reference: https://www.microsoft.com/en-us/security/blog/2022/04/12/tarrask-malware-uses-scheduled-tasks-for-defense-evasion/
         Reference: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/audit-registry'
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          ntDomainColumn: AccountNTDomain
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
      customDetails:
        AccountFullName: TargetAccount
        HostFullName: Computer
