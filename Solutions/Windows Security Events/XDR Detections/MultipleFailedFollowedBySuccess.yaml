schemaVersion: 1.0.0
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: cf3ede88-a429-493b-9108-3e46d3c741f7
    path: Analytic Rules/MultipleFailedFollowedBySuccess.yaml
    version: 1.0.7
    querySha256: fe83b35b4940aa9a57174583b3ea2ba60b363ea843fa2a3a90e9c15398c46aac
    schedule:
      queryFrequency: 2h
      queryPeriod: 2h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - Host.FullName has no supported Custom Detection field
    errors: []
    originalTactics:
