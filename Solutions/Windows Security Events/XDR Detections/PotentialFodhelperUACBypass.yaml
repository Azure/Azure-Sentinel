properties:
  id: xdr-potential-fodhelper-uac-bypass-56f3f35c
  displayName: Potential Fodhelper UAC Bypass
  status: disabled
  queryCondition:
    queryText: |-
      SecurityEvent
        | where EventID == 4657
        | parse ObjectName with "\\REGISTRY\\" KeyPrefix "\\" RegistryKey
        | project-reorder RegistryKey
        | where RegistryKey has "Software\\Classes\\ms-settings\\shell\\open\\command"
        | extend TimeKey = bin(TimeGenerated, 1h)
        | join (
        SecurityEvent
        | where EventID == 4688
        | where Process =~ "fodhelper.exe"
        | where ParentProcessName endswith "cmd.exe" or ParentProcessName endswith "powershell.exe" or ParentProcessName endswith "powershell_ise.exe"
        | extend TimeKey = bin(TimeGenerated, 1h)) on TimeKey, Computer
        | extend HostName = tostring(split(Computer, ".")[0]), DomainIndex = toint(indexof(Computer, '.'))
        | extend HostNameDomain = iff(DomainIndex != -1, substring(Computer, DomainIndex + 1), Computer)
        | extend AccountName = tostring(split(TargetAccount, @'\')[1]), AccountNTDomain = tostring(split(TargetAccount, @'\')[0])
  schedule:
    frequency: PT2H
  detectionAction:
    alertTemplate:
      title: Potential Fodhelper UAC Bypass
      description: '''This detection looks for the steps required to conduct a UAC bypass using Fodhelper.exe. By default
        this detection looks for the setting of the required registry keys and the invoking of the process within 1 hour -
        this can be tweaked as required.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1548
          subTechniques:
          - T1548.002
