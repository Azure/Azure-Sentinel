  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: dcdf9bfc-c239-4764-a9f9-3612e6dff49c
    path: Analytic Rules/ADFSDBNamedPipeConnection.yaml
    version: 1.0.2
    querySha256: 1daf1828fbd72115e5015ca11b9c1d34bc0f6a8af264e85eabe11214211ba01a
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - Account.NTDomain column `AccountNTDomain` is not produced by the query
    - Host.FullName has no supported Custom Detection field
