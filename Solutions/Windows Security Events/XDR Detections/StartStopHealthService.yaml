schemaVersion: 1.0.0
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 2bc7b4ae-eeaa-4538-ba15-ef298ec1ffae
    path: Analytic Rules/StartStopHealthService.yaml
    version: 1.0.2
    querySha256: 6c2275312bd7c7f2c883241459d97d17979c6a4c083bb8a0b6172e3045ae81b4
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
    - Account.NTDomain column `AccountNTDomain` is not produced by the query
    - Host.FullName has no supported Custom Detection field
    - Unconfirmed generic Account.Name mapping was omitted because another required Host, Mailbox, or IP asset is available
    errors: []
    originalTactics:
    - DefenseEvasion
