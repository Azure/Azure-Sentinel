    querySha256: 95f38cf051193e54415451342cbe7ca9c3ccaba85316271c1480a29ff049ca3a
    schedule:
      queryFrequency: 1d
      queryPeriod: 14d
  conversion:
    tool: sentinel-to-xdr-migration
