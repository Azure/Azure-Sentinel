properties:
  id: xdr-508cef41-2cd8-4d40-a519-b04826a9085f
  displayName: NRT Security Event log cleared
  status: disabled
  queryCondition:
    queryText: |-
      SecurityEvent
      | where EventID == 1102 and EventSourceName == "Microsoft-Windows-Eventlog"
      | summarize StartTimeUtc = min(TimeGenerated), EndTimeUtc = max(TimeGenerated), EventCount = count() by Computer, Account, EventID, Activity
      | extend HostName = tostring(split(Computer, ".")[0]), DomainIndex = toint(indexof(Computer, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(Computer, DomainIndex + 1), Computer)
      | extend AccountName = tostring(split(Account, @'\')[1]), AccountNTDomain = tostring(split(Account, @'\')[0])
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: NRT Security Event log cleared
      description: |-
        'Checks for event id 1102 which indicates the security event log was cleared.
        It uses Event Source Name "Microsoft-Windows-Eventlog" to avoid generating false positives from other sources, like AD FS servers for instance.'
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1070
      customDetails:
        AccountFullName: Account
        AccountName: AccountName
        AccountNTDomain: AccountNTDomain
        HostFullName: Computer
