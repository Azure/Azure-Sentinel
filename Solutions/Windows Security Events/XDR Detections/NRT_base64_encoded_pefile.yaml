properties:
  id: xdr-nrt-base64-encoded-windows-process-command-lines-c3e5dbaa
  displayName: NRT Base64 Encoded Windows Process Command-lines
  status: disabled
  queryCondition:
    queryText: |-
      SecurityEvent
       | where EventID == 4688
       | where isnotempty(CommandLine)
       | where CommandLine contains "TVqQAAMAAAAEAAA"
       | extend HostName = tostring(split(Computer, '.', 0)[0]), DnsDomain = tostring(strcat_array(array_slice(split(Computer, '.'), 1, -1), '.'))
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: NRT Base64 Encoded Windows Process Command-lines
      description: '''This detection identifies instances of a base64 encoded PE file header seen in the process command line
        parameter.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: SubjectUserName
          ntDomainColumn: SubjectDomainName
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1027
        - technique: T1140
