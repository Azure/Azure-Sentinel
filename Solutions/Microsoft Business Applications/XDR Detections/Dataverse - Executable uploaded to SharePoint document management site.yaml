properties:
  id: xdr-ba5e608f-7879-4927-8b0d-a9948b4fe6f3
  displayName: Dataverse - Executable uploaded to SharePoint document management site
  status: disabled
  queryCondition:
    queryText: |-
      let file_extensions = dynamic(['com', 'exe', 'bat', 'cmd', 'vbs', 'vbe', 'js', 'jse', 'wsf', 'wsh', 'msc', 'cpl', 'ps1', 'scr']);
      let query_frequency = 1h;
      DataverseSharePointSites
      | join kind=inner (
          OfficeActivity
          | where TimeGenerated >= ago(query_frequency)
          | where OfficeWorkload == "SharePoint" and Operation == "FileUploaded")
          on $left.SharePointUrl == $right.Site_Url
      | where SourceFileExtension in (file_extensions)
      | extend
          CloudAppId = int(32780),
          SharePointId = int(20892),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          TimeGenerated,
          UserId,
          ClientIP,
          InstanceUrl,
          SourceFileName,
          SharePointUrl,
          CloudAppId,
          SharePointId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Executable uploaded to SharePoint document management site
      description: Identifies executable files and scripts uploaded to SharePoint sites used for Dynamics document management,
        circumventing native file extension restrictions in Dataverse.
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIP
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
        - id: cloudApplication2
          appIdColumn: SharePointId
        files:
        - id: file1
          nameColumn: SourceFileName
      tactics:
      - tactic: Execution
        techniques:
        - technique: T0863
      - tactic: Persistence
        techniques:
        - technique: T0873
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
        CloudApplicationInstanceName_2: SharePointUrl
