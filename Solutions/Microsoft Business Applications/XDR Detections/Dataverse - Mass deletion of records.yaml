properties:
  id: xdr-716cf6d4-97ad-407b-923e-6790083acb58
  displayName: Dataverse - Mass deletion of records
  status: disabled
  queryCondition:
    queryText: |-
      let mass_delete_threshold = 10000;
      let query_frequency = 1d;
      let delete_activities = DataverseActivity
          | where TimeGenerated >= ago(query_frequency)
          | where Message == "Delete";
      union
          (
          delete_activities
          | summarize FirstEvent = min(TimeGenerated), TotalEvents = count() by UserId, InstanceUrl
          | where TotalEvents > mass_delete_threshold
          | join kind=inner (
              delete_activities
              | summarize DeleteCount = count() by UserId, InstanceUrl, ClientIp, EntityName)
              on UserId, InstanceUrl
          | extend Entities = bag_pack("Entity", EntityName, "Count", DeleteCount)
          | summarize Details = make_set(Entities, 100), FirstEvent = min(FirstEvent) by UserId, InstanceUrl, ClientIp, TotalEvents
          ),
          (
          DataverseActivity
          | where TimeGenerated >= ago(query_frequency)
          | where Message == "BulkDelete"
          | summarize FirstEvent = min(TimeGenerated), TotalEvents = count() by UserId, InstanceUrl, ClientIp
          | extend Details = todynamic("Bulk delete scheduled")
          )
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          FirstEvent,
          UserId,
          ClientIp,
          TotalEvents,
          Details,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Mass deletion of records
      description: Identifies large scale record delete operations based on a predefined threshold and also detects scheduled
        bulk deletion jobs.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
        ips:
        - id: ip1
          addressColumn: ClientIp
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1485
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
