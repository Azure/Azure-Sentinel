properties:
  id: xdr-6e480329-84bc-409a-b97b-22e8102af3ca
  displayName: Dataverse - Bulk record ownership re-assignment or sharing
  status: disabled
  queryCondition:
    queryText: |-
      // Set threshold for number of shared/assigned records
      let detection_threshold = 100;
      let query_frequency = 1h;
      DataverseActivity
      | where TimeGenerated >= ago(query_frequency)
      | where Message in ("ModifyAccess", "Assign", "GrantAccess")
      | summarize
          FirstEvent = min(TimeGenerated),
          LastEvent = max(TimeGenerated),
          Events = count()
          by UserId, Message, InstanceUrl, ClientIp
      | where Events > detection_threshold
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          FirstEvent,
          LastEvent,
          Message,
          Events,
          UserId,
          ClientIp,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Bulk record ownership re-assignment or sharing
      description: Identifies individual record ownership changes including sharing of records with other users/teams or re-assignment
        of ownership exceeding a pre-defined threshold.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1548
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
