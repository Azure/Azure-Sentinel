properties:
  id: xdr-81c693fe-f6c4-4352-bc10-3526f6e22637
  displayName: Dataverse - Login from IP not in the allow list
  status: disabled
  queryCondition:
    queryText: |-
      // Use static IP address or CIDR list specified in the
      // NetworkAddresses watchlist template with tag "AllowDataverse"
      let allowed_networks = MSBizAppsNetworkAddresses()
          | where Tags has "AllowDataverse"
          | summarize by IPSubnet;
      let query_frequency = 1h;
      let watchlist_entries_count = toscalar (allowed_networks
          | summarize count());
      let dataverse_signin_activity = materialize(
          DataverseActivity
          | where watchlist_entries_count > 0
          | where TimeGenerated >= ago (query_frequency)
          | where Message == "UserSignIn" and isnotempty(ClientIp)
          | summarize FirstEvent = arg_min(TimeGenerated, *) by UserId, ClientIp, InstanceUrl
          );
      let authorized_ip_addresses = dataverse_signin_activity
          | evaluate ipv4_lookup(allowed_networks, ClientIp, IPSubnet);
      dataverse_signin_activity
      | join kind=leftanti(authorized_ip_addresses) on ClientIp
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          FirstEvent,
          UserId,
          ClientIp,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Login from IP not in the allow list
      description: Identifies logons from IPv4 addresses not matching IPv4 subnets maintained on an allow list. This analytics
        rule uses the NetworkAddresses watchlist template.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
        - technique: T1190
        - technique: T1133
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
