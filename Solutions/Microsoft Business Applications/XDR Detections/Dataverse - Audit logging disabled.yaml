properties:
  id: xdr-ea07523b-e6b8-469b-9e25-cdef1ae6fb45
  displayName: Dataverse - Audit logging disabled
  status: disabled
  queryCondition:
    queryText: |-
      let query_frequency = 1h;
      let audit_properties = dynamic(['isauditenabled', 'isuseraccessauditenabled','isreadauditenabled']);
      DataverseActivity
      | where TimeGenerated >= ago(query_frequency)
      | where Message in~ ("Update", "UpdateAuditSettings")
      | where Fields has_any (audit_properties)
      | mv-expand Fields
      | extend AuditValue = Fields.Name, AuditEnabled = tobool(Fields.Value)
      | where AuditValue in~ (audit_properties) and not (AuditEnabled)
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          TimeGenerated,
          UserId,
          ClientIp,
          OriginalObjectId,
          AuditValue,
          AuditEnabled,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Audit logging disabled
      description: Identifies a change in system audit configuration whereby audit logging is turned off.
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
