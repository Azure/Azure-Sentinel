properties:
  id: xdr-c4c3510a-0ee0-4561-9835-47882ffa7f46
  displayName: Dataverse - SharePoint document management site added or updated
  status: disabled
  queryCondition:
    queryText: |-
      let query_frequency = 1h;
      DataverseActivity
      | where TimeGenerated >= ago(query_frequency)
      | where Message in ("Create", "Update") and EntityName == "sharepointsite"
      | mv-expand Fields
      | where Fields.Name == "absoluteurl"
      | extend
          SharePointAppId = int(20892),
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1]),
          SharePointUrl = tostring(Fields.Value)
      | project
          TimeGenerated,
          UserId,
          ClientIp,
          Message,
          SharePointUrl,
          InstanceUrl,
          CloudAppId,
          SharePointAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - SharePoint document management site added or updated
      description: Identifies modifications of SharePoint document management integration. Document management allows storage
        of data located externally to Dataverse. Combine this analytics rule with the MSBizApps-Add-SharePointSite-To-Watchlist
        Playbook to automatically update the Dataverse-SharePointSites watchlist. This watchlist can be used to correlate
        events between Dataverse and SharePoint when using the Office 365 data connector.
      severity: informational
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
        - id: cloudApplication2
          appIdColumn: SharePointAppId
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
        - technique: T1537
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
        CloudApplicationInstanceName_2: SharePointUrl
