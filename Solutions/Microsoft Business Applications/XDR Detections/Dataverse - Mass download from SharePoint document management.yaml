properties:
  id: xdr-95e02f1b-5886-4043-8f0e-a42e6e23330f
  displayName: Dataverse - Mass download from SharePoint document management
  status: disabled
  queryCondition:
    queryText: |-
      // Set threshold for number of downloaded files
      let detection_threshold = 10000;
      let query_frequency = 1h;
      DataverseSharePointSites
      | join kind=inner (
          OfficeActivity
          | where TimeGenerated >= ago(query_frequency)
          | where OfficeWorkload == "SharePoint" and Operation == "FileDownloaded")
          on $left.SharePointUrl == $right.Site_Url
      | summarize FileDownloadCount = count() by UserId, SharePointUrl, InstanceUrl, ClientIP
      | where FileDownloadCount > detection_threshold
      | extend
          CloudAppId = int(32780),
          SharePointId = int(20892),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          UserId,
          ClientIP,
          FileDownloadCount,
          SharePointUrl,
          InstanceUrl,
          CloudAppId,
          SharePointId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Mass download from SharePoint document management
      description: Identifies mass download (in the last hour) of files from SharePoint sites configured for document management
        in Dynamics 365. This analytics rule utilizes the MSBizApps-Configuration watchlist to identify SharePoint sites used
        for Document Management.
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIP
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
        - id: cloudApplication2
          appIdColumn: SharePointId
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
        CloudApplicationInstanceName_2: SharePointUrl
