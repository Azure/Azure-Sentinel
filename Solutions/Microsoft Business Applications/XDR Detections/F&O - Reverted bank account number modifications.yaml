properties:
  id: xdr-44b1021c-d517-4b7a-9ba6-a91eab94e632
  displayName: F&O - Reverted bank account number modifications
  status: disabled
  queryCondition:
    queryText: |-
      let detection_window = 24h;
      let query_frequency = 15m;
      let bank_changes = FinanceOperationsActivity_CL
          | where LogType == "Update" and TableName == "BankAccountTable"
          | extend AccountId = tostring(parse_json(tostring(FormattedData.AccountID)).NewData)
          | extend AccountNum = parse_json(tostring(FormattedData.AccountNum))
          | extend
              CurrentAccountNum = tostring(AccountNum.NewData),
              OldAccountNum = tostring(AccountNum.OldData)
          | where CurrentAccountNum != OldAccountNum;
      bank_changes
      | join kind=inner (bank_changes
          | where TimeGenerated >= ago(query_frequency)
          | project-rename UpdatedTime = LogCreatedDateTime, UpdatedAccount = CurrentAccountNum)
          on $left.OldAccountNum == $right.UpdatedAccount
      | where UpdatedTime between (LogCreatedDateTime .. (LogCreatedDateTime + detection_window))
      | extend
          FinOpsAppId = 32780,
          AccountName = tostring(split(Username, '@')[0]),
          UPNSuffix = tostring(split(Username, '@')[1])
      | project
          TimeGenerated,
          LogCreatedDateTime,
          LogType,
          TableName,
          Username,
          AccountName,
          UPNSuffix,
          AccountId,
          CurrentAccountNum,
          OldAccountNum,
          FinOpsAppId
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: F&O - Reverted bank account number modifications
      description: Identifies changes to bank account numbers in Finance & Operations, whereby a bank account number is modified
        but then subsequently reverted a short time later.
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: FinOpsAppId
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1565
        - technique: T1496
        - technique: T0828
        - technique: T0831
