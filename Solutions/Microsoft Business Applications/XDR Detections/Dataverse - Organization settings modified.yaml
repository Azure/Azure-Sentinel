    reviewScope:
      sourceDocumentSha256: 2fe17e72b10401156bff5cdfa71300c8aefbee1b0280b16e0f2f0f906dbdc800
      targetQuerySha256: cef769e1365349c4b38111f2e725da01b43f5614ea7f6c345929ea4a8b97e8c5
    supplementalEntityDetails:
    - entityType: CloudApplication
      entityIndex: 3
      identifier: InstanceName
      sourceColumn: InstanceUrl
      column: InstanceUrl
      status: runtime-binding-pending
