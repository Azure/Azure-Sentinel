properties:
  id: xdr-a6f6b734-3db8-4259-a988-69e0b8eac0c2
  displayName: Dataverse - Organization settings modified
  status: disabled
  queryCondition:
    queryText: |-
      let query_frequency = 1h;
      DataverseActivity
      | where TimeGenerated >= ago(query_frequency)
      | where Message == "Update" and EntityName == "organization"
      | mv-expand Fields
      | extend FieldName = tostring(Fields.Name)
      | extend Value = tostring(Fields.Value)
      | where FieldName != "organizationid"
      | lookup MSBizAppsOrgSettings on FieldName
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          TimeGenerated,
          UserId,
          ClientIp,
          FieldName,
          Value,
          DisplayName,
          Description,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Organization settings modified
      description: Identifies changes made at organization level in the Dataverse environment.
      severity: informational
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1078
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
