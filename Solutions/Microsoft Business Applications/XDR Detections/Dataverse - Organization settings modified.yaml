    kind: AnalyticsRule
    id: a6f6b734-3db8-4259-a988-69e0b8eac0c2
    path: Analytic Rules/Dataverse - Organization settings modified.yaml
    version: 3.2.0
    querySha256: 2d3b62bd7df26e2ecd71a213a7ef782c95db488068ade67921fa8c5f3f2102ce
    schedule:
      queryFrequency: 1h
      queryPeriod: 14d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1h, lookback=14d; target frequency=PT1H, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
