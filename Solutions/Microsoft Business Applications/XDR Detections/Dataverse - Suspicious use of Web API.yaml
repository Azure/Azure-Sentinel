properties:
  id: xdr-8a6ecba2-ccfe-4c8c-b086-fa3e6ff7fa86
  displayName: Dataverse - Suspicious use of Web API
  status: disabled
  queryCondition:
    queryText: |-
      let query_frequency = 1h;
      let query_lookback = 24h;
      // AppID of the multi-tenant Dynamics 365 Example Client Application
      let well_known_app_id = "51f81489-12ee-4a9e-aaae-a2591f45987d";
      let environment_count_threshold = 10;
      SigninLogs
      | where TimeGenerated >= ago(query_lookback)
      // Comment out the line below to monitor activity from all Azure AD apps
      | where AppId == well_known_app_id
      | where ResourceIdentity == '00000007-0000-0000-c000-000000000000'
      | summarize FirstSeen = min(TimeGenerated) by AppId, UserPrincipalName, IPAddress, AppDisplayName
      | join kind=inner (
          DataverseActivity
          | where TimeGenerated >= ago(query_frequency)
          | where Message == "UserSignIn")
          on $left.UserPrincipalName == $right.UserId, $left.IPAddress == $right.ClientIp
      | where TimeGenerated between (FirstSeen .. (FirstSeen + 2h))
      | summarize InstanceCount = dcount(InstanceUrl, 4), FirstSeen = min(FirstSeen) by UserId, ClientIp, InstanceUrl, AppDisplayName, AppId
      | where InstanceCount > environment_count_threshold
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          FirstSeen,
          UserId,
          ClientIp,
          AppDisplayName,
          AppId,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Suspicious use of Web API
      description: Identifies sign-in across multiple Dataverse environments, breaching a predefined threshold, originating
        from a user with IP address that was used to sign-into the well known Microsoft Entra app registration.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1106
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      - tactic: Reconnaissance
        techniques:
        - technique: T1595
      - tactic: Discovery
        techniques:
        - technique: T1526
        - technique: T1580
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
