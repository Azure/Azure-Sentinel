properties:
  id: xdr-5ab00fbb-ba2c-44dc-b02e-f119639b9a11
  displayName: F&O - Mass update or deletion of user records
  status: disabled
  queryCondition:
    queryText: |-
      // Set threshold for number of updated or deleted records
      let update_detection_threshold = 50;
      let deleted_detection_threshold = 10;
      FinanceOperationsActivity_CL
      | where TableName == "UserInfo" and LogType in ("Update", "Delete")
      | summarize
          TotalEvents = count(),
          StartTime = min(LogCreatedDateTime),
          EndTime = max(LogCreatedDateTime)
          by TableName, Username, LogType
      | where (LogType == "Update" and TotalEvents > update_detection_threshold) or (LogType == "Delete" and TotalEvents > deleted_detection_threshold)
      | extend
          FinOpsAppId = 32780,
          AccountName = tostring(split(Username, '@')[0]),
          UPNSuffix = tostring(split(Username, '@')[1])
      | project StartTime, EndTime, Username, AccountName, UPNSuffix, LogType, TableName, TotalEvents, FinOpsAppId
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: F&O - Mass update or deletion of user records
      description: Identifies large delete or update operations on Finance & Operations user records based on predefined thresholds.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: FinOpsAppId
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1485
        - technique: T1565
        - technique: T1491
