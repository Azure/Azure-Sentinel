properties:
  id: xdr-f1634822-b7e9-44f5-95ac-fa4a04f14513
  displayName: Dataverse - Audit log data deletion
  status: disabled
  queryCondition:
    queryText: |-
      let query_frequency = 1h;
      DataverseActivity
      | where TimeGenerated >= ago(query_frequency)
      | where Message =~ 'DeleteRecordChangeHistory' or Message =~ 'DeleteAuditData'
      | extend CloudAppId = int(32780)
      | extend AccountName = tostring(split(UserId, "@")[0])
      | extend UPNSuffix = tostring(split(UserId, "@")[1])
      | project
          TimeGenerated,
          UserId,
          ClientIp,
          UserAgent,
          Message,
          EntityName,
          InstanceUrl,
          AccountName,
          UPNSuffix,
          CloudAppId
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Audit log data deletion
      description: Identifies audit log data deletion activity in Dataverse.
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
        ips:
        - id: ip1
          addressColumn: ClientIp
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1070
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
