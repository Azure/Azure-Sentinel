properties:
  id: xdr-4c1c9aee-8e44-4bb9-bd53-f3e7d6761282
  displayName: Dataverse - New sign-in from an unauthorized domain
  status: disabled
  queryCondition:
    queryText: |-
      // Allow list of UPN suffixes allowed by the organization.
      let allowed_domains = dynamic([
          'onmicrosoft.com',
          'microsoft.com'
          ]);
      // All list of users allowed by the organization
      let allowed_users = dynamic([
          'user1@mydomain.com',
          'user2@mydomain.com'
          ]);
      let query_frequency = 1h;
      let query_lookback = 14d;
      let historical_users = DataverseActivity
          | where TimeGenerated between(ago(query_lookback) .. ago(query_frequency))
          | where Message == 'UserSignIn'
          | summarize by UserId;
      DataverseActivity
      | where TimeGenerated >= ago (query_frequency)
      | where Message == 'UserSignIn'
      | join kind=leftanti (historical_users) on UserId
      | summarize FirstEvent = min(TimeGenerated), LastEvent = max(TimeGenerated) by UserId, ClientIp, InstanceUrl
      | where isnotempty(ClientIp)
      | extend CloudAppId = int(32780)
      | extend AccountName = tostring(split(UserId, '@')[0])
      | extend UPNSuffix = tostring(split(UserId, '@')[1])
      | where UPNSuffix !in (allowed_domains) and UserId !in (allowed_users)
      | project
          FirstEvent,
          LastEvent,
          UserId,
          ClientIp,
          InstanceUrl,
          AccountName,
          UPNSuffix,
          CloudAppId
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - New sign-in from an unauthorized domain
      description: Identifies Dataverse sign-in activity originating from users with UPN suffixes that have not been seen
        previously in the last 14 days and are not present on a predefined list of authorized domains. Common internal Power
        Platform system users are excluded by default.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
        - technique: T1190
        - technique: T1133
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
