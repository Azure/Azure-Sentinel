properties:
  id: xdr-f327816b-9328-4b17-9290-a02adc2f4928
  displayName: Dataverse - Login by a sensitive privileged user
  status: disabled
  queryCondition:
    queryText: |-
      // Sensitive users are marked in the VIP Users watchlist using the Tags field.
      // Enter the tags values to monitor
      let monitored_tags = dynamic(["DataverseSensitive"]);
      let query_frequency = 1h;
      let sensitive_users = MSBizAppsVIPUsers()
          | where Tags in (monitored_tags);
      sensitive_users
      | join kind=inner (DataverseActivity
          | where TimeGenerated >= ago(query_frequency)
          | where Message == "UserSignIn")
          on $left.UserPrincipalName == $right.UserId
      | summarize FirstSeen = arg_max(TimeGenerated, *) by UserId
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          FirstSeen,
          UserId,
          ClientIp,
          UserAgent,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Login by a sensitive privileged user
      description: Identifies Dataverse and Dynamics 365 logons by sensitive users.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
        ips:
        - id: ip1
          addressColumn: ClientIp
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1133
        - technique: T1190
        - technique: T1078
      - tactic: CredentialAccess
        techniques:
        - technique: T1212
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
