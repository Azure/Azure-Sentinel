properties:
  id: xdr-682e230c-e5da-4085-8666-701d1f1be7de
  displayName: Dataverse - New non-interactive identity granted access
  status: disabled
  queryCondition:
    queryText: |-
      let dataverse_app_id = "00000007-0000-0000-c000-000000000000";
      let query_frequency = 1h;
      let azure_ad_changes = AuditLogs
          | where TimeGenerated >= ago(query_frequency)
          | where OperationName =~ 'Update application'
          | where TargetResources has dataverse_app_id
          | extend TargetAppName = tostring(TargetResources[0].displayName)
          | extend TargetAppId = tostring(TargetResources[0].id)
          | extend UserId = tostring(parse_json(tostring(InitiatedBy.user)).userPrincipalName)
          | extend ClientIp = tostring(parse_json(tostring(InitiatedBy.user)).ipAddress)
          | extend NewData = tostring(parse_json(tostring(parse_json(TargetResources)[0].modifiedProperties))[0].newValue)
          | where NewData has dataverse_app_id;
      let dataverse_changes = DataverseActivity
          | where TimeGenerated >= ago(query_frequency)
          | where (Message == "Create" and EntityName == "systemuser" and parse_json(Fields)[0].Name == "applicationid")
          | extend TargetAppId = tostring(Fields[0].Value);
      union azure_ad_changes, dataverse_changes
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          TimeGenerated,
          UserId,
          ClientIp,
          TargetAppName,
          TargetAppId,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - New non-interactive identity granted access
      description: Identifies API level access grants, either via the delegated permissions of a Microsoft Entra application
        or direct assignment within Dataverse as an application user.
      severity: informational
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        - id: account2
          aadUserIdColumn: TargetAppId
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
        ips:
        - id: ip1
          addressColumn: ClientIp
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1098
        - technique: T0859
        - technique: T1078
      - tactic: LateralMovement
        techniques:
        - technique: T0859
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1098
        - technique: T1078
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
