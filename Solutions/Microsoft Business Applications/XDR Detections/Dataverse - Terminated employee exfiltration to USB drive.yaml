properties:
  id: xdr-c5e75cb6-cea0-49c2-a998-da414035aac1
  displayName: Dataverse - Terminated employee exfiltration to USB drive
  status: disabled
  queryCondition:
    queryText: |-
      let drive_mount_lookback = 14d;
      let query_frequency = 1h;
      DataverseActivity
      | distinct InstanceUrl
      | join kind=inner (DeviceFileEvents
          | where TimeGenerated >= ago(query_frequency))
          on $left.InstanceUrl == $right.FileOriginUrl
      | join kind=inner (MSBizAppsTerminatedEmployees()) on $left.InitiatingProcessAccountUpn == $right.UserPrincipalName
      | join kind=inner (DeviceEvents
          | where TimeGenerated >= ago(drive_mount_lookback)
          | where ActionType == "UsbDriveMounted"
          | extend DriveLetter = tostring(parse_json(AdditionalFields).DriveLetter)
          | summarize MountedDriveLetters = make_set(DriveLetter, 26) by DeviceId, DeviceName)
          on DeviceId
      | extend TargetDriveLetter = tostring(split(FolderPath, "\\")[0])
      | where set_has_element(MountedDriveLetters, TargetDriveLetter)
      | join kind=inner (DeviceInfo
          | summarize arg_max(TimeGenerated, DeviceId, PublicIP) by DeviceName)
          on DeviceId
      | project-rename
          UserId = UserPrincipalName
      | summarize LatestEvent = arg_max(TimeGenerated, *), Files = make_set(FileName, 100) by UserId, InstanceUrl
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          LatestEvent,
          UserId,
          PublicIP,
          Files,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Terminated employee exfiltration to USB drive
      description: Identifies files downloaded from Dataverse by departing or terminated employees which are copied to USB
        mounted drives.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: PublicIP
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1052
      customDetails: {}
