properties:
  id: xdr-df577f0f-1d8a-4420-9057-a07f0edb15c8
  displayName: Dataverse - Mass record updates
  status: disabled
  queryCondition:
    queryText: |-
      // Set threshold for number of updated records
      let detection_threshold = 10000;
      let query_frequency = 1h;
      DataverseActivity
      | where TimeGenerated >= ago(query_frequency)
      | where Message == "Update"
      | summarize EventCount = count() by InstanceUrl, UserId, ClientIp, Message
      | where EventCount > detection_threshold
      | join kind=inner(
          DataverseActivity
          | where TimeGenerated >= ago(query_frequency))
          on InstanceUrl, UserId, ClientIp, Message
      | mv-expand Fields
      | summarize
          UpdatedFields = make_set(Fields.Name, 100),
          FirstEvent = min(TimeGenerated)
          by UserId, ClientIp, InstanceUrl, EventCount, EntityName
      | extend Details = bag_pack("Entity", EntityName, "Count", EventCount, "FieldsUpdated", UpdatedFields)
      | summarize
          TotalEvents = sum(EventCount),
          FirstEvent = min(FirstEvent),
          Details = make_list(Details, 100)
          by UserId, ClientIp, InstanceUrl
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          FirstEvent,
          UserId,
          ClientIp,
          TotalEvents,
          Details,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Mass record updates
      description: This query detects mass record update changes in Dataverse and Dynamics 365, exceeding a pre-defined threshold.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1641
        - technique: T1485
        - technique: T1565
      customDetails:
        Details: Details
        CloudApplicationInstanceName: InstanceUrl
