schemaVersion: 1.0.0
version: 3.2.4
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
requiredDataConnectors:
- connectorId: AzureActiveDirectory
  dataTypes:
  - SigninLogs
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - SigninLogs
  requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
    - SigninLogs
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 54d48840-1c64-4399-afee-ad39a069118d
    path: Analytic Rules/Power Platform - Possibly compromised user accesses Power Platform services.yaml
    version: 3.0.0
    querySha256: 13c66782c03c830ae9e8d8c5664e425ca7b32705e2f2fd9d6747aa4ee601ad49
    schedule:
      queryFrequency: 1h
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1h, lookback=1d; target frequency=PT1H, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - customDetails 'RiskEventTypes' column `RiskEventTypes` requires runtime output-schema binding verification
    - customDetails 'RiskEventTypes_V2' column `RiskEventTypes_V2` requires runtime output-schema binding verification
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified
      and the service drops all custom details if exceeded
    informational:
    - All source MITRE tactics are preserved in source order in authored YAML. V3.1 ARM packaging carries only the first tactic
      and its compatible techniques; this classification loss is not validated parity. Direct Graph deployment requires a
      single tactic.
    errors: []
    originalTactics:
    - InitialAccess
    - LateralMovement
    originalTechniques:
    - T1078
    - T1210
    reviewScope:
      sourceDocumentSha256: f9af809944f760c47ae6ff9b4fb918be510332dfee1fc6f25bd7a5da2089a86b
      targetQuerySha256: b4b38618d5909ee9f56455b7760df2d39a5c11fd764827e48709ceeee253f628
properties:
  id: xdr-54d48840-1c64-4399-afee-ad39a069118d
  displayName: Power Platform - Possibly compromised user accesses Power Platform services
  status: disabled
  queryCondition:
    queryText: |-
      let power_automate_appid = "6204c1d1-4712-4c46-a7d9-3ed63d992682";
      let power_apps_appid = "a8f7a65c-f5ba-4859-b2d6-df772c264e9d";
      let ppac_appid = "065d9450-1e87-434e-ac2f-69af271549ed";
      let query_frequency = 1h;
      SigninLogs
      | where ingestion_time() >= ago(query_frequency)
      | where array_length(todynamic(RiskEventTypes)) != 0 or array_length(todynamic(RiskEventTypes_V2)) != 0
      | where AppId in (power_automate_appid, power_apps_appid, ppac_appid)
      | extend AffectedPlatform = case(
                                      AppId == ppac_appid,
                                      "Power Platform Admin Center",
                                      AppId == power_apps_appid,
                                      "Power Apps",
                                      AppId == power_automate_appid,
                                      "Power Automate",
                                      "Unknown"
                                  )
      | extend
          Severity = iif(AffectedPlatform in ("Power Apps", "Power Automate"), "Medium", "High"),
          CloudAppId = case(AffectedPlatform == "Power Apps", int(27593), AffectedPlatform == "Power Automate", int(27592), 0),
          AccountName = tostring(split(UserPrincipalName, '@')[0]),
          UPNSuffix = tostring(split(UserPrincipalName, '@')[1])
      | project
          TimeGenerated,
          UserId,
          UniqueTokenIdentifier,
          Identity,
          RiskEventTypes,
          RiskEventTypes_V2,
          UserPrincipalName,
          AppId,
          AppDisplayName,
          AffectedPlatform,
          IPAddress,
          Severity,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Power Platform - Possibly compromised user accesses Power Platform services
      description: Identifies user accounts flagged at risk in Microsoft Entra Identity Protection and correlates these users
        with sign-in activity in Power Platform, including Power Apps, Power Automate and Power Platform Admin Center.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: IPAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: AffectedPlatform
          appIdColumn: AppId
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      - tactic: LateralMovement
        techniques:
        - technique: T1210
      customDetails:
        RiskEventTypes: RiskEventTypes
        RiskEventTypes_V2: RiskEventTypes_V2
