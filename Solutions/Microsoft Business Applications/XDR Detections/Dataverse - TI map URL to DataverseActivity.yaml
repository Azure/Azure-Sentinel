properties:
  id: xdr-d88a0e22-3b6a-40c2-af28-c064b44d03b7
  displayName: Dataverse - TI map URL to DataverseActivity
  status: disabled
  queryCondition:
    queryText: |-
      let dt_lookBack = 1h;
      let ioc_lookBack = 14d;
      ThreatIntelligenceIndicator
      | where TimeGenerated >= ago(ioc_lookBack) and ExpirationDateTime > now()
      | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by IndicatorId
      | where Active == true
      | where isnotempty(Url)
      | join kind=innerunique (
          DataverseActivity
          | where TimeGenerated >= ago(dt_lookBack)
          | where Message in ("Create", "Update")
          | where isnotempty(Fields) and Fields has "http"
          | extend
              ExtractedUrls = extract_all("(http[s]?://(?:[a-zA-Z\\.-]|[0-9])+)", tostring(Fields)),
              DataverseActivity_TimeGenerated = TimeGenerated
          | mv-expand Url = ExtractedUrls
          | project
              DataverseActivity_TimeGenerated,
              tostring(Url),
              UserId,
              ClientIp,
              InstanceUrl,
              EntityName
          )
          on Url
      | where DataverseActivity_TimeGenerated < ExpirationDateTime
      | summarize DataverseActivity_TimeGenerated  = arg_max(DataverseActivity_TimeGenerated, *) by IndicatorId, Url
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          DataverseActivity_TimeGenerated,
          Description,
          ActivityGroupNames,
          IndicatorId,
          ThreatType,
          ExpirationDateTime,
          ConfidenceScore,
          UserId,
          ClientIp,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix,
          Url
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - TI map URL to DataverseActivity
      description: Identifies a match in DataverseActivity from any URL IOC from Microsoft Sentinel Threat Intelligence.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        urls:
        - id: url1
          addressColumn: Url
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
        - technique: T1456
        - technique: T1474
        - technique: T0819
        - technique: T0865
        - technique: T0862
      - tactic: Execution
        techniques:
        - technique: T0863
        - technique: T1204
      - tactic: Persistence
        techniques:
        - technique: T1574
        - technique: T0873
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
