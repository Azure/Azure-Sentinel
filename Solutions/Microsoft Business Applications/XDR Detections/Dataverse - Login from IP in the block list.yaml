properties:
  id: xdr-666fef96-1bb8-4abf-ad72-e5cb49561381
  displayName: Dataverse - Login from IP in the block list
  status: disabled
  queryCondition:
    queryText: |-
      // Use static IP address or CIDR list specified in the
      // NetworkAddresses watchlist (from watchlist template)
      // with tag "BlockDataverse"
      let query_frequency = 1h;
      let blocked_networks = MSBizAppsNetworkAddresses()
          | where Tags has "BlockDataverse"
          | summarize by IPSubnet;
      let watchlist_entries_count = toscalar (blocked_networks
          | summarize count());
      DataverseActivity
      | where watchlist_entries_count > 0
      | where TimeGenerated >= ago(query_frequency)
      | where Message == "UserSignIn" and isnotempty(ClientIp)
      | summarize FirstEvent = arg_min(TimeGenerated, *) by UserId, ClientIp, InstanceUrl
      | evaluate ipv4_lookup(blocked_networks, ClientIp, IPSubnet)
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          FirstEvent,
          UserId,
          ClientIp,
          Message,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Login from IP in the block list
      description: Identifies Dataverse sign-in activity from IPv4 addresses which are on a predefined block list. Blocked
        network ranges are maintained in the NetworkAddresses watchlist template.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
        - technique: T1078
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
