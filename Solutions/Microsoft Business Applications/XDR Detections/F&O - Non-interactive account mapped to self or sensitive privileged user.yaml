properties:
  id: xdr-5b7cc7f9-fe54-4138-9fb0-d650807345d3
  displayName: F&O - Non-interactive account mapped to self or sensitive privileged user
  status: disabled
  queryCondition:
    queryText: |-
      // Add sensitive privilege accounts to the privileged_user_accounts variable.
      // Example: let privileged_user_accounts = dynamic(["Admin1", "Admin"]);
      let privileged_user_accounts = dynamic([]);
      FinanceOperationsActivity_CL
      | where TableName == "SysAADClientTable" and LogType in ("Insert", "Update")
      | extend ClientId = tostring(parse_json(tostring(FormattedData.["03::AADClientId"])).NewData)
      | extend User = parse_json(tostring(FormattedData.UserId))
      | extend
          MappedUser = tostring(User.NewData),
          PreviousUserId = tostring(User.OldData),
          TargetAppName = tostring(parse_json(tostring(FormattedData.Name)).NewData),
          FinOpsAppId = 32780
      | where MappedUser in (privileged_user_accounts) or LogCreatedBy == MappedUser
      | project
          LogCreatedDateTime,
          LogCreatedBy,
          LogType,
          TargetAppName,
          MappedUser,
          PreviousUserId,
          ClientId,
          FinOpsAppId
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: F&O - Non-interactive account mapped to self or sensitive privileged user
      description: Identifies changes to Microsoft Entra client apps registered for Finance & Operations, specifically when
        a new client is mapped to a predefined list of sensitive privileged user accounts, or when a user associates a client
        app with their own account.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          aadUserIdColumn: ClientId
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: FinOpsAppId
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1556
      - tactic: Persistence
        techniques:
        - technique: T1556
        - technique: T1098
        - technique: T1136
        - technique: T1078
        - technique: T0859
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1098
        - technique: T1078
      customDetails:
        AccountFullName: LogCreatedBy
        AccountFullName_2: MappedUser
