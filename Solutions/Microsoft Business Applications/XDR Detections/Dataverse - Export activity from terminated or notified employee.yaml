properties:
  id: xdr-0881b209-62c9-4b15-9f9a-e0c1d1b1eb7b
  displayName: Dataverse - Export activity from terminated or notified employee
  status: disabled
  queryCondition:
    queryText: |-
      // Set a time period before employee terminatation date to search for export events
      let termination_watch_period = 7d;
      let query_frequency = 1h;
      let exportEvents = dynamic(['ExportToExcel', 'ExportPdfDocument', 'ExportWordDocument', 'ExecutePowerBISql']);
      MSBizAppsTerminatedEmployees
      | where (UserState =~ "Terminated") or (UserState =~ "Notified" and TerminationDate <= startofday(now()) + termination_watch_period)
      | join kind=inner (DataverseActivity
          | where TimeGenerated >= ago(query_frequency)
          | where Message in (exportEvents))
          on $left.UserPrincipalName == $right.UserId
      | summarize
          FirstEvent = min(TimeGenerated),
          LastEvent = max(TimeGenerated),
          Event = make_set(Message, 4)
          by UserId, InstanceUrl, ClientIp, UserState
      | extend
          CloudAppId = int(32780),
          AccountName = tostring(split(UserId, '@')[0]),
          UPNSuffix = tostring(split(UserId, '@')[1])
      | project
          FirstEvent,
          LastEvent,
          UserId,
          ClientIp,
          UserState,
          InstanceUrl,
          CloudAppId,
          AccountName,
          UPNSuffix
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Dataverse - Export activity from terminated or notified employee
      description: This query identifies Dataverse export activity triggered by terminated, or employees about to leave the
        organization. This analytics rule uses the TerminatedEmployees watchlist template.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIp
        cloudApplications:
        - id: cloudApplication1
          appIdColumn: CloudAppId
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
        - technique: T1048
      customDetails:
        CloudApplicationInstanceName: InstanceUrl
