  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 0a627f29-f0dd-4924-be92-c3d6dac84367
    path: Analytic Rules/Threat_Essentials_NRT_UseraddedtoPrivilgedGroups.yaml
    version: 1.0.4
    querySha256: ba76c6490ad31bdb9a94a0628202d1ecc94e1a6730dcdef58e4d59e3453eab0e
    schedule:
      queryFrequency: 1d
      queryPeriod: 14d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
    - multiple source tactics were resolved by the configured per-rule override
