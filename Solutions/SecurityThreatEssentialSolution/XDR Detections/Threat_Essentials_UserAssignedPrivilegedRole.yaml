    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: b09795c9-8dce-47ab-8f75-5a4afb78ef0c
    path: Analytic Rules/Threat_Essentials_UserAssignedPrivilegedRole.yaml
    version: 1.0.3
    querySha256: 2c469b42048a16534378e56c9032f73e769acffbc029f950b9a1cf8d36bbf3ae
    schedule:
      queryFrequency: 2h
      queryPeriod: 2h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
