properties:
  id: xdr-bdf3cf98-d64f-4c55-97e4-43483d6d3237
  displayName: Idira - Multiple Failed Actions Followed by Success (15m)
  status: disabled
  queryCondition:
    queryText: "let window = 15m;\nlet fails =\n    CyberArk_AuditEvents_CL\n    |\
      \ where TimeGenerated > ago(window)\n    | where actionType has_any (\"Fail\"\
      ,\"Failed\",\"Denied\",\"Error\")\n        or message has_any (\"fail\",\"failed\"\
      ,\"denied\",\"unauthorized\")\n    | summarize Fails=count(), firstFail=min(TimeGenerated),\
      \ lastFail=max(TimeGenerated) by username, targetAccount;\nlet success =\n \
      \   CyberArk_AuditEvents_CL\n    | where TimeGenerated > ago(window)\n    |\
      \ where actionType has_any (\"Success\",\"Succeeded\",\"Allow\",\"Allowed\"\
      )\n        or message has_any (\"success\",\"allowed\")\n    | summarize Successes=count(),\
      \ firstSuccess=min(TimeGenerated) by username, targetAccount;\nfails\n| where\
      \ Fails >= 3\n| join kind=inner success on username, targetAccount\n| join kind=inner\
      \ (\n    CyberArk_AuditEvents_CL\n    | extend cd = parse_json(customData)\n\
      \    | extend cd_client_ip = tostring(cd.client_ip_address),\n             cd_source_ip\
      \ = tostring(cd.source_ip_address),\n             cd_device_os = tostring(cd.device_os),\n\
      \             cd_browser = tostring(cd.browser_name),\n             cd_geo_city\
      \ = tostring(cd.geoip_city_name),\n             cd_geo_country = tostring(cd.geoip_country_name),\n\
      \             cd_target = coalesce(tostring(cd.target), tostring(cd.target_resource),\
      \ tostring(cd.new_target))\n    | project username, targetAccount, any_cd_client_ip\
      \ = cd_client_ip, any_cd_source_ip = cd_source_ip,\n              any_cd_device_os\
      \ = cd_device_os, any_cd_browser = cd_browser,\n              any_cd_geo_city\
      \ = cd_geo_city, any_cd_geo_country = cd_geo_country, any_cd_target = cd_target\n\
      \  ) on username, targetAccount\n| project username, targetAccount, Fails, Successes,\
      \ firstFail, lastFail, firstSuccess,\n          any_cd_source_ip, any_cd_client_ip,\
      \ any_cd_device_os, any_cd_browser,\n          any_cd_geo_city, any_cd_geo_country,\
      \ any_cd_target"
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Idira - Multiple Failed Actions Followed by Success (15m)
      description: Detects 3+ failed actions against an account followed by a success
        in a short window, indicating brute-force or credential guessing.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: targetAccount
      tactics:
      - tactic: CredentialAccess
      customDetails:
        AccountFullName: username
        AccountName: targetAccount
