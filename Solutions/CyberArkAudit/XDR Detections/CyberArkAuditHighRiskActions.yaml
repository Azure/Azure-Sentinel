properties:
  id: xdr-3733e1ac-991b-4504-99e8-24ff4fbaf6e4
  displayName: Idira - High-Risk Actions Outside Business Hours
  status: disabled
  queryCondition:
    queryText: "let risky = dynamic([\"Delete\",\"Remove\",\"Rotate\",\"Elevate\"\
      ,\"Disable\",\"Grant\",\"Policy\",\"Safe\",\"Vault\",\"Key\"]);\nCyberArk_AuditEvents_CL\n\
      | where isnotempty(action) or isnotempty(actionType) or isnotempty(auditType)\
      \ or isnotempty(message)\n| where hourofday(TimeGenerated) < 7 or hourofday(TimeGenerated)\
      \ > 20\n| where action has_any (risky) or actionType has_any (risky) or auditType\
      \ has_any (risky) or message has_any (risky)\n| extend cd = parse_json(customData)\n\
      | extend cd_username = tostring(cd.username),\n         cd_auth_method = tostring(cd.authentication_method),\n\
      \         cd_client_ip = tostring(cd.client_ip_address),\n         cd_source_ip\
      \ = tostring(cd.source_ip_address),\n         cd_device_os = tostring(cd.device_os),\n\
      \         cd_browser = tostring(cd.browser_name),\n         cd_geo_city = tostring(cd.geoip_city_name),\n\
      \         cd_geo_country = tostring(cd.geoip_country_name),\n         cd_target\
      \ = coalesce(tostring(cd.target), tostring(cd.target_resource), tostring(cd.new_target))\n\
      | project TimeGenerated, CyberArkTenantId, username, cd_username, identityType,\
      \ action, actionType, auditType,\n          target, targetAccount, safe, source,\
      \ cd_source_ip, cd_client_ip, cd_auth_method, cd_device_os,\n          cd_browser,\
      \ cd_geo_city, cd_geo_country, cd_target, component, serviceName, message"
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: Idira - High-Risk Actions Outside Business Hours
      description: Detects privileged or destructive actions (delete/disable/rotate/elevate/etc.)
        occurring outside standard business hours. Useful for insider misuse or compromised
        admin detection.
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: target
        ips:
        - id: ip1
          addressColumn: source
      tactics:
      - tactic: DefenseEvasion
      customDetails:
        AccountFullName: username
