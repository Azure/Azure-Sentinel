properties:
  id: xdr-30938118-8812-4b5f-afa4-a8d4ba2b5d86
  displayName: Idira - Sensitive Safe/Permission/Entitlement Changes (with customData)
  status: disabled
  queryCondition:
    queryText: "let indicators = dynamic([\"SafeMember\",\"Permission\",\"Access\"\
      ,\"ACL\",\"Owner\",\"Role\",\"Entitlement\",\"Policy\"]);\nlet changeVerbs =\
      \ dynamic([\"grant\",\"revoke\",\"assign\",\"elevate\",\"enable\",\"disable\"\
      ,\"remove\",\"delete\",\"update\"]);\nlet actions = dynamic([\"policy-add\"\
      , \"policy-change\"]);\nCyberArk_AuditEvents_CL\n| extend cd = parse_json(tostring(customData))\n\
      | extend cd_changeType = tolower(tostring(cd.changeType)),\n         cd_role\
      \       = tostring(cd.role),\n         cd_perm       = tostring(cd.permission),\n\
      \         cd_policy     = tostring(cd.policy),\n         cd_entitle    = tostring(cd.entitlement),\n\
      \         cd_description= tostring(cd.description),\n         cd_action    \
      \ = tostring(cd.action)\n| where\n    action has_any(actions) and\n    (auditType\
      \ has_any (indicators)\n    or message has_any (indicators)\n    or cd_description\
      \ has_any (indicators)\n    or cd_action has_any (indicators)\n    or cd_role\
      \ !~ \"\" or cd_perm !~ \"\" or cd_policy !~ \"\" or cd_entitle !~ \"\"\n  \
      \  or cd_changeType in (changeVerbs))\n| project TimeGenerated, CyberArkTenantId,\
      \ serviceName, username, userId, safe,\n          action, actionType, auditType,\n\
      \          cd_action, cd_description, cd_changeType, cd_role, cd_perm, cd_policy,\
      \ cd_entitle,\n          target, message"
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: Idira - Sensitive Safe/Permission/Entitlement Changes (with customData)
      description: 'Alerts on control-plane modifications: safes, permissions, roles,
        entitlements, policy changes. Leverages customData fields such as changeType/role/permission/policy/entitlement
        to reduce misses.'
      severity: low
      entityMappings:
        hosts:
        - id: host1
          nameColumn: target
      tactics:
      - tactic: PrivilegeEscalation
      customDetails:
        AccountFullName: username
