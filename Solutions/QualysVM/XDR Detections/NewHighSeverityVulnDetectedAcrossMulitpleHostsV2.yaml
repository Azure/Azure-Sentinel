properties:
  id: xdr-6116dc19-475a-4148-84b2-efe89c073e27
  displayName: New High Severity Vulnerability Detected Across Multiple Hosts
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      QualysHostDetection
      | extend Status = tostring(Status), Vulnerability = tostring(QID), Severity = tostring(Severity)
      | where Status =~ "New" and Severity == "5"
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), AffectedHostCount = dcount(NetBios), AffectedHosts = make_set(NetBios, 100), HostName = take_any(NetBios) by QID = tostring(QID)
      | where AffectedHostCount >= threshold
      | extend timestamp = StartTime
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: New High Severity Vulnerability Detected Across Multiple Hosts
      description: '''This creates an incident when a new high severity vulnerability is detected across multilple hosts'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      customDetails:
        QID: QID
        AffectedHosts: AffectedHosts
        AffectedHostCount: AffectedHostCount
