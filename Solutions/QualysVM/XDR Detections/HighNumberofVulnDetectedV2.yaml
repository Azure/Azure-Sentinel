properties:
  id: xdr-3edb7215-250b-40c0-8b46-79093949242d
  displayName: High Number of Urgent Vulnerabilities Detected
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      QualysHostDetection
      | where Severity == "5"
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), count() by NetBios, IPAddress
      | where count_ >= threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: High Number of Urgent Vulnerabilities Detected
      description: '''This creates an incident when a host has a high number of urgent, severity 5, vulnerabilities detected.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: NetBios
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      customDetails:
        HostFullName: NetBios
