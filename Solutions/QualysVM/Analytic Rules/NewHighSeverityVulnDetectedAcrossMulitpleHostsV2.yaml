id: 6116dc19-475a-4148-84b2-efe89c073e27
name: New High Severity Vulnerability Detected Across Multiple Hosts
description: |
  'This creates an incident when a new high severity vulnerability is detected across multilple hosts'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: QualysVMLogsCCPDefinition
    dataTypes:
      - QualysHostDetection
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1190
query: |
  let threshold = 10;
  QualysHostDetection
  | extend Status = tostring(Status), Vulnerability = tostring(QID), Severity = tostring(Severity)
  | where Status =~ "New" and Severity == "5"
  | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), AffectedHostCount = dcount(NetBios), AffectedHosts = make_set(NetBios, 100), HostName = take_any(NetBios) by QID = tostring(QID)
  | where AffectedHostCount >= threshold
  | extend timestamp = StartTime
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostName
customDetails:
  QID: QID
  AffectedHosts: AffectedHosts
  AffectedHostCount: AffectedHostCount
version: 1.0.3
kind: Scheduled
