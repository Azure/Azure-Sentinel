id: 7162903e-e07f-426b-9b07-63b8c7eb77b1
Function:
    Title: Parser for QualysHostDetection
    Version: '1.0.4'
    LastUpdated: '2026-09-11'
Category: Microsoft Sentinel Parser
FunctionName: QualysHostDetection
FunctionAlias: QualysHostDetection
FunctionQuery: |
  let QualysHostDetection_view = view () {
    QualysHostDetection_CL
    | mv-expand todynamic(Detections_s)
    | extend
        Severity_s = tostring(Detections_s.Severity),
        Status_s = tostring(Detections_s.Status),
        QID_s = tostring(Detections_s.Results)
    | extend    
        TenantId = column_ifexists('TenantId', ''),
        SourceSystem = column_ifexists('SourceSystem', ''),
        MG = column_ifexists('MG', ''),
        ManagementGroupName = column_ifexists('ManagementGroupName', ''),
        TimeGenerated = column_ifexists('TimeGenerated', ''),
        Computer = column_ifexists('Computer', ''),
        RawData = column_ifexists('RawData', ''),
        Id = column_ifexists('Id_s', ''),
        HostId = column_ifexists('HostId_s', ''),
        HostTags = column_ifexists('HostTags_s', ''),
        IPAddress = column_ifexists('IPAddress', ''),
        TrackingMethod = column_ifexists('TrackingMethod_s', ''),
        OperatingSystem = column_ifexists('OperatingSystem_s', ''),
        DnsName = column_ifexists('DnsName_s', ''),
        NetBios = column_ifexists('NetBios_s', ''),
        QGHostId = column_ifexists('QGHostId_g', ''),
        LastScanDateTime = column_ifexists('LastScanDateTime_t', ''),
        LastVMScannedDateTime = column_ifexists('LastVMScannedDateTime_t', ''),
        LastVMAuthScannedDateTime = column_ifexists('LastVMAuthScannedDateTime_t', ''),
        QID = column_ifexists('QID_s', ''),
        SSL = column_ifexists('SSL_s', ''),
        Status = column_ifexists('Status_s', ''),
        Ignored = column_ifexists('Ignored_s', ''),
        Severity = column_ifexists('Severity_s', ''),
        Disabled = column_ifexists('Disabled_s', ''),
        LastFixed = column_ifexists('LastFixed_t', ''),
        LastFound = column_ifexists('LastFound_t', ''),
        TimesFound = column_ifexists('TimesFound_s', ''),
        FirstFound = column_ifexists('FirstFound_t', ''),
        LastUpdate = column_ifexists('LastUpdate_t', datetime(null)),
        LastProcessedDateTime = column_ifexists('LastProcessed_t', datetime(null)),
        Result_column_count = tostring(column_ifexists('Result_column_count_d', '')),
        Results_0 = column_ifexists('Results_0_s', ''),
        Type = column_ifexists('Type', ''),
        _ResourceId = column_ifexists('_ResourceId', '')
    };
    let QualysHostDetectionV2_view = view () {
    QualysHostDetectionV2_CL
    | extend    
        TenantId = column_ifexists('TenantId', ''),
        SourceSystem = column_ifexists('SourceSystem', ''),
        MG = column_ifexists('MG', ''),
        ManagementGroupName = column_ifexists('ManagementGroupName', ''),
        TimeGenerated = column_ifexists('TimeGenerated', ''),
        Computer = column_ifexists('Computer', ''),
        RawData = column_ifexists('RawData', ''),
        Id = column_ifexists('Id_s', ''),
        HostId = column_ifexists('HostId_s', ''),
        IPAddress = column_ifexists('IPAddress', ''),
        TrackingMethod = column_ifexists('TrackingMethod_s', ''),
        OperatingSystem = column_ifexists('OperatingSystem_s', ''),
        DnsName = column_ifexists('DnsName_s', ''),
        NetBios = column_ifexists('NetBios_s', ''),
        QGHostId = column_ifexists('QGHostId_g', ''),
        LastScanDateTime = column_ifexists('LastScanDateTime_t', ''),
        LastVMScannedDateTime = column_ifexists('LastVMScannedDateTime_t', ''),
        LastVMAuthScannedDateTime = column_ifexists('LastVMAuthScannedDateTime_t', ''),
        QID = column_ifexists('QID_s', ''),
        SSL = column_ifexists('SSL_s', ''),
        Status = column_ifexists('Status_s', ''),
        Ignored = column_ifexists('Ignored_s', ''),
        Severity = column_ifexists('Severity_s', ''),
        Disabled = column_ifexists('Disabled_s', ''),
        LastFixed = column_ifexists('LastFixed_t', ''),
        LastFound = column_ifexists('LastFound_t', ''),
        TimesFound = column_ifexists('TimesFound_s', ''),
        FirstFound = column_ifexists('FirstFound_t', ''),
        LastUpdate = column_ifexists('LastUpdate_t', datetime(null)),
        LastProcessedDateTime = column_ifexists('LastProcessed_t', datetime(null)),
        Result_column_count = tostring(column_ifexists('Result_column_count_d', '')),
        Results_0 = column_ifexists('Results_0_s', ''),
        Type = column_ifexists('Type', ''),
        _ResourceId = column_ifexists('_ResourceId', '')
    };
    let QualysHostDetectionV3_view = view () {
    QualysHostDetectionV3_CL
    | extend DetectionList = todynamic(DetectionList)
    | extend Detections = iff(
        gettype(DetectionList.DETECTION) == "array",
        DetectionList.DETECTION,
        pack_array(DetectionList.DETECTION))
    | mv-expand Detections
    | extend 
        TenantId = column_ifexists('TenantId', ''),
        SourceSystem = column_ifexists('SourceSystem', ''),
        MG = column_ifexists('MG', ''),
        ManagementGroupName = column_ifexists('ManagementGroupName', ''),
        TimeGenerated = column_ifexists('TimeGenerated', ''),
        Computer = column_ifexists('Computer', ''),
        RawData = column_ifexists('RawData', ''),
        Id = column_ifexists('Id', ''),
        HostId = column_ifexists('HostId', ''),
        HostTags = column_ifexists('HostTags', ''),
        IPAddress = column_ifexists('IPAddress', ''),
        TrackingMethod = column_ifexists('TrackingMethod', ''),
        OperatingSystem = column_ifexists('OperatingSystem', ''),
        DnsName = column_ifexists('DnsName', ''),
        NetBios = column_ifexists('NetBios', ''),
        QGHostId = column_ifexists('QGHostId', ''),
        LastScanDateTime = column_ifexists('LastScanDateTime', ''),
        LastVMScannedDateTime = column_ifexists('LastVMScannedDateTime', ''),
        LastVMAuthScannedDateTime = column_ifexists('LastVMAuthScannedDateTime', ''),
        QID = tostring(Detections.QID),
        UniqueVulnerabilityId = tostring(Detections.UNIQUE_VULN_ID),
        Port = tostring(Detections.PORT),
        Protocol = tostring(Detections.PROTOCOL),
        FQDN = tostring(Detections.FQDN),
        SSL = tostring(Detections.SSL),
        Instance = tostring(Detections.INSTANCE),
        ResultInstance = tostring(Detections.RESULT_INSTANCE),
        CVE = tostring(Detections.CVE),
        Status = tostring(Detections.STATUS),
        Ignored = tostring(Detections.IS_IGNORED),
        Severity = tostring(Detections.SEVERITY),
        Disabled = tostring(Detections.IS_DISABLED),
        LastFixed = todatetime(Detections.LAST_FIXED_DATETIME),
        LastFound = todatetime(Detections.LAST_FOUND_DATETIME),
        TimesFound = tostring(Detections.TIMES_FOUND),
        FirstFound = todatetime(Detections.FIRST_FOUND_DATETIME),
        LastTestDateTime = todatetime(Detections.LAST_TEST_DATETIME),
        LastUpdate = todatetime(Detections.LAST_UPDATE_DATETIME),
        FirstReopenedDateTime = todatetime(Detections.FIRST_REOPENED_DATETIME),
        LastReopenedDateTime = todatetime(Detections.LAST_REOPENED_DATETIME),
        TimesReopened = tostring(Detections.TIMES_REOPENED),
        LastProcessedDateTime = coalesce(
            todatetime(Detections.LAST_PROCESSED_DATETIME),
            todatetime(Detections.LAST_PROCESSED_DATE)),
        Results_0 = coalesce(
            tostring(Detections['RESULTS']['#cdata-section']),
            tostring(Detections.RESULTS)),
        Result_column_count = "1",
        Type = tostring(Detections.TYPE),
        Source = tostring(Detections.SOURCE),
        VulnerabilityDetectionSources = tostring(Detections.VULNERABILITY_DETECTION_SOURCES),
        LatestVulnerabilityDetectionSource = tostring(Detections.LATEST_VULNERABILITY_DETECTION_SOURCE),
        MitreTacticName = tostring(Detections.MITRE_TACTIC_NAME),
        MitreTechniqueName = tostring(Detections.MITRE_TECHNIQUE_NAME),
        MitreTacticId = tostring(Detections.MITRE_TACTIC_ID),
        MitreTechniqueId = tostring(Detections.MITRE_TECHNIQUE_ID),
        TruRiskEliminationStatus = tostring(Detections.TRURISK_ELIMINATION_STATUS),
        QDS = coalesce(
            toint(Detections.QDS),
            toint(Detections.QDS['#text']),
            toint(Detections.QDS['#cdata-section'])),
        QDSSeverity = coalesce(
            tostring(Detections.QDS['@severity']),
            tostring(Detections.QDS._severity),
            tostring(Detections.QDS.SEVERITY),
            tostring(Detections.QDS_SEVERITY)),
        QDSFactors = tostring(Detections.QDS_FACTORS),
        Service = tostring(Detections.SERVICE),
        AffectRunningKernel = tostring(Detections.AFFECT_RUNNING_KERNEL),
        AffectRunningService = tostring(Detections.AFFECT_RUNNING_SERVICE),
        AffectExploitableConfig = tostring(Detections.AFFECT_EXPLOITABLE_CONFIG),
        AssetCVE = tostring(Detections.ASSET_CVE),
        _ResourceId = column_ifexists('_ResourceId', '')
    | extend _IngestionTime = todatetime(TimeGenerated)
    | summarize arg_max(_IngestionTime, *) by HostId, QID, UniqueVulnerabilityId, Type, Severity, Port, Protocol, FQDN, SSL, Instance, ResultInstance, CVE, Results_0, Status, FirstFound, LastFound, Source, VulnerabilityDetectionSources, LatestVulnerabilityDetectionSource, MitreTacticName, MitreTechniqueName, MitreTacticId, MitreTechniqueId, TruRiskEliminationStatus, QDS, QDSSeverity, QDSFactors, TimesFound, LastTestDateTime, LastFixed, FirstReopenedDateTime, LastReopenedDateTime, TimesReopened, Service, Ignored, Disabled, AffectRunningKernel, AffectRunningService, AffectExploitableConfig, AssetCVE
    | project-away _IngestionTime
    };
    union isfuzzy=true
    (QualysHostDetection_view),
    (QualysHostDetectionV2_view),
    (QualysHostDetectionV3_view)
    | project
        TenantId,
        SourceSystem,
        MG,
        ManagementGroupName,
        TimeGenerated,
        Computer,
        RawData,
        Id,
        HostId,
        HostTags,
        IPAddress,
        TrackingMethod,
        OperatingSystem,
        DnsName,
        NetBios,
        QGHostId,
        LastScanDateTime,
        LastVMScannedDateTime,
        LastVMAuthScannedDateTime,
        QID,
        UniqueVulnerabilityId,
        Port,
        Protocol,
        FQDN,
        SSL,
        Instance,
        ResultInstance,
        CVE,
        Type,
        Status,
        Ignored,
        Severity,
        Disabled,
        LastFixed,
        LastFound,
        TimesFound,
        FirstFound,
        LastTestDateTime,
        LastUpdate,
        FirstReopenedDateTime,
        LastReopenedDateTime,
        TimesReopened,
        LastProcessedDateTime,
        Result_column_count,
        Results_0,
        Source,
        VulnerabilityDetectionSources,
        LatestVulnerabilityDetectionSource,
        MitreTacticName,
        MitreTechniqueName,
        MitreTacticId,
        MitreTechniqueId,
        TruRiskEliminationStatus,
        QDS,
        QDSSeverity,
        QDSFactors,
        Service,
        AffectRunningKernel,
        AffectRunningService,
        AffectExploitableConfig,
        AssetCVE,
        _ResourceId
    | extend
        HostId = tostring(HostId),
        QID = tostring(QID),
        Status = tostring(Status),
        LastProcessedDateTime = todatetime(LastProcessedDateTime),
        LastUpdate = todatetime(LastUpdate),
        LastFound = todatetime(LastFound)
    | extend DetectionTime = coalesce(LastProcessedDateTime, LastUpdate, LastFound, todatetime(TimeGenerated))