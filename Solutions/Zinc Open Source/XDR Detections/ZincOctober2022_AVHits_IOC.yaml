properties:
  id: xdr-3705158d-e008-49c9-92dd-e538e1549090
  displayName: AV detections related to Zinc actors
  status: disabled
  queryCondition:
    queryText: |-
      let Zinc_threats = dynamic(["Trojan:Win32/ZetaNile.A", "Trojan:Win32/EventHorizon.A", "Trojan:Win32/FoggyBrass.A", "Trojan:Win32/FoggyBrass.B", "Trojan:Win32/PhantomStar.A","Trojan:Win32/PhantomStar.C","TrojanDropper:Win32/PhantomStar.A"]);
      DeviceInfo
      | extend DeviceName = tolower(DeviceName)
      | join kind=inner ( SecurityAlert
      | where ProviderName == "MDATP"
      | extend ThreatName = tostring(parse_json(ExtendedProperties).ThreatName)
      | extend ThreatFamilyName = tostring(parse_json(ExtendedProperties).ThreatFamilyName)
      | where ThreatName in~ (Zinc_threats) or ThreatFamilyName in~ (Zinc_threats)
      | extend CompromisedEntity = tolower(CompromisedEntity)
      ) on $left.DeviceName == $right.CompromisedEntity
      | summarize by DisplayName, ThreatName, ThreatFamilyName, PublicIP, AlertSeverity, Description, tostring(LoggedOnUsers), DeviceId, TenantId , bin(TimeGenerated, 1d), CompromisedEntity, ProductName, Entities
      | extend HostName = tostring(split(CompromisedEntity, '.', 0)[0]), DnsDomain = tostring(strcat_array(array_slice(split(CompromisedEntity, '.'), 1, -1), '.'))
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AV detections related to Zinc actors
      description: "'This query looks for Microsoft Defender AV detections related to  Zinc threat actor. In Microsoft Sentinel\
        \ the SecurityAlerts table includes only the Device Name of the affected device, this query joins the DeviceInfo table\
        \ to clearly connect other information such as Device group, ip, etc. \n This would allow the Microsoft Sentinel analyst\
        \ to have more context related to the alert, if available.\n Reference: https://www.microsoft.com/en-us/security/blog/2022/09/29/zinc-weaponizing-open-source-software/'"
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
        ips:
        - id: ip1
          addressColumn: PublicIP
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1486
