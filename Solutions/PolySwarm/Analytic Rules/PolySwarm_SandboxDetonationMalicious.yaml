id: 901521a4-09b6-43e4-85f2-b915e4898d4b
name: PolySwarm sandbox detonation malicious
description: |
  'Any PolySwarmSandbox_CL row with a malicious verdict becomes an incident. Covers both
  file and URL detonations submitted through the enrichment playbooks. This is how a
  PolySwarm sandbox verdict becomes an incident in the unified Defender portal, since the
  playbooks that submit detonations only post an incident comment and never create an
  incident themselves.'
severity: High
status: Available
requiredDataConnectors:
  - connectorId: PolySwarmHuntingCCFDefinition
    dataTypes:
      - PolySwarmSandbox_CL
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
relevantTechniques:
  - T1204
  - T1059
query: |
  PolySwarmSandbox_CL
  | where TimeGenerated > ago(15m)
  | where Verdict =~ "malicious"
  | extend HashAlgorithm = iff(isnotempty(Sha256), "SHA256", "")
  | extend TechniquesText = tostring(Techniques)
  | project TimeGenerated, TaskId, ArtifactType, Sha256, HashAlgorithm, Url, Provider, Community, Verdict, Score, Family, TechniquesText, ReportUrl, CreatedAt, CompletedAt
entityMappings:
  - entityType: FileHash
    fieldMappings:
      - identifier: Value
        columnName: Sha256
      - identifier: Algorithm
        columnName: HashAlgorithm
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
customDetails:
  TaskId: TaskId
  Provider: Provider
  Community: Community
  Family: Family
  Techniques: TechniquesText
  ReportUrl: ReportUrl
version: 1.0.0
kind: Scheduled
