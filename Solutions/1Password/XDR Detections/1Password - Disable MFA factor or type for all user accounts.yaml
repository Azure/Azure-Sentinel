properties:
  id: xdr-1password-disable-mfa-factor-or-type-for-all-user-accounts-92ab0938
  displayName: 1Password - Disable MFA factor or type for all user accounts
  status: disabled
  queryCondition:
    queryText: |-
      OnePasswordEventLogs_CL
      | where log_source == "auditevents"
      | where action == "disblmfa"
      | where object_type == "account"
      | extend
          ActorUsername = actor_details.email
          , SrcIpAddr = session.ip
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: 1Password - Disable MFA factor or type for all user accounts
      description: |-
        This will alert when the MFA factor or type for all user accounts are disabled. Once this analytics rule is triggered it will group all related future alerts for upto an hour when all related entities are the same.

        Ref: https://1password.com/
        Ref: https://github.com/securehats/
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1556
