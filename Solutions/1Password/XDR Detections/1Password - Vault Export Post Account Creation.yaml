schemaVersion: 1.0.0
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 969e2e5c-9cc6-423c-a3de-514f7ad75fe7
    path: Analytics Rules/1Password - Vault Export Post Account Creation.yaml
    version: 1.0.0
    querySha256: db16b63e88bb49332362e0e557413437f7f6573d821e32d60c0e8cb820f4b318
    schedule:
      queryFrequency: 1h
      queryPeriod: 14d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - Account mapping is incomplete and was removed
    - Account.FullName has no supported Custom Detection field
    - multiple source tactics were resolved by the configured per-rule override
    errors: []
    originalTactics:
    - CredentialAccess
    - Persistence
    originalTechniques:
    - T1555
