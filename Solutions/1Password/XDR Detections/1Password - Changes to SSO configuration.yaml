    reviewScope:
      sourceDocumentSha256: 17aad86b4cc957f7c8e033f7066cba60fb0b630abb379aa5f46b93199d32256f
      targetQuerySha256: 41b36c09e4c2a3fd6952a3403059cf0919b8e32c58ea75686a06b5963ddd97e2
