properties:
  id: xdr-9406f5ab-1197-4db9-8042-9f3345be061c
  displayName: 1Password - Changes to SSO configuration
  status: disabled
  queryCondition:
    queryText: |-
      OnePasswordEventLogs_CL
      | where log_source == "auditevents"
      | where action has_any("enblsso", "disblsso", "chngpsso", "chngasso", "chngdsso", "addgsso", "delgsso")
      | where object_type == "sso"
      | extend
          ActorUsername = actor_details.email
          , SrcIpAddr = session.ip
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: 1Password - Changes to SSO configuration
      description: |-
        This will alert when changes have been made to the SSO configuration. Once this analytics rule is triggered it will group all related future alerts for upto an hour when all related entities are the same.

        Ref: https://1password.com/
        Ref: https://github.com/securehats/
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1556
      customDetails:
        AccountFullName: ActorUsername
