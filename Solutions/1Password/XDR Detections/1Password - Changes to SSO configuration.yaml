schemaVersion: 1.0.0
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 9406f5ab-1197-4db9-8042-9f3345be061c
    path: Analytics Rules/1Password - Changes to SSO configuration.yaml
    version: 1.0.1
    querySha256: 41b36c09e4c2a3fd6952a3403059cf0919b8e32c58ea75686a06b5963ddd97e2
    schedule:
      queryFrequency: 5m
      queryPeriod: 5m
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
    - Account mapping is incomplete and was removed
    - Account.FullName has no supported Custom Detection field
    errors: []
