    dataTypes:
    - OnePasswordEventLogs_CL
  requiredDataConnectors:
  - connectorId: 1Password
    dataTypes:
    - OnePasswordEventLogs_CL
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 3c8140eb-e946-4bf2-8c61-03e4df56d400
    path: Analytics Rules/1Password - User account MFA settings changed.yaml
    version: 1.0.0
    querySha256: 85fd23eecb70d1031bf886ae0a678c6c0dc89b13dc50517f865802dcd04f0885
    schedule:
      queryFrequency: 30m
      queryPeriod: 30m
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=30m, lookback=30m; target frequency=PT30M, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Account mapping is incomplete and was removed
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified
      and the service drops all custom details if exceeded
    informational:
    - Account.FullName mismatch is informational because its original value is preserved as customDetails.AccountFullName
      from query column `ActorUsername`; supplemental details do not restore entity identity, correlation, or alert parity
    - All source MITRE tactics are preserved in source order in authored YAML. V3.1 ARM packaging carries only the first tactic
      and its compatible techniques; this classification loss is not validated parity. Direct Graph deployment requires a
      single tactic.
    errors: []
    originalTactics:
    - Persistence
    - DefenseEvasion
    originalTechniques:
    - T1556
    reviewScope:
      sourceDocumentSha256: ccba38270eb1598f2f7564ed780298765a5af6ab98a6a620fbccdc84ca0cf45b
      targetQuerySha256: 85fd23eecb70d1031bf886ae0a678c6c0dc89b13dc50517f865802dcd04f0885
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 1
      identifier: FullName
      sourceColumn: ActorUsername
      column: ActorUsername
      status: available
      customDetailKey: AccountFullName
properties:
  id: xdr-3c8140eb-e946-4bf2-8c61-03e4df56d400
  displayName: 1Password - User account MFA settings changed
  status: disabled
  queryCondition:
    queryText: |-
      OnePasswordEventLogs_CL
      | where log_source == "auditevents"
      | where action has_any("enblmfa", "updatmfa", "disblmfa")
      | where object_type == "user"
      | extend
          ActorUsername = actor_details.email
          , SrcIpAddr = session.ip
  schedule:
    frequency: PT30M
  detectionAction:
    alertTemplate:
      title: 1Password - User account MFA settings changed
      description: |-
        This will alert when a user creates, updates, or disables the user account MFA settings. Once this analytics rule is triggered it will group all related future alerts for upto an hour when all related entities are the same.

        Ref: https://1password.com/
        Ref: https://github.com/securehats/
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1556
      - tactic: DefenseEvasion
        techniques:
        - technique: T1556
      customDetails:
        AccountFullName: ActorUsername
