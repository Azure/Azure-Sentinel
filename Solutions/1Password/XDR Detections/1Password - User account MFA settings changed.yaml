schemaVersion: 1.0.0
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 3c8140eb-e946-4bf2-8c61-03e4df56d400
    path: Analytics Rules/1Password - User account MFA settings changed.yaml
    version: 1.0.0
    querySha256: 85fd23eecb70d1031bf886ae0a678c6c0dc89b13dc50517f865802dcd04f0885
    schedule:
      queryFrequency: 30m
      queryPeriod: 30m
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
    - Account mapping is incomplete and was removed
    - Account.FullName has no supported Custom Detection field
