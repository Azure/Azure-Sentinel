    version: 1.0.0
    querySha256: 02b31eb6b5d611b2fd2d94f2240fbadbe3dd8252e50a8dc58baf5d150503ae47
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
