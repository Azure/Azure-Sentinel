properties:
  id: xdr-dae4c601-51c9-47f5-83d3-e6eaef929cf6
  displayName: 1Password - Vault export
  status: disabled
  queryCondition:
    queryText: |-
      OnePasswordEventLogs_CL
      | where action == "export"
      | where object_type == "vault"
      | extend
          TargetUsername = actor_details.email
          , SrcIpAddr = session.ip
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: 1Password - Vault export
      description: |-
        This will alert when a successful vault export has occurred within 1Password.
        Ref: https://1password.com/
        Ref: https://github.com/securehats/
      severity: low
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1555
      customDetails:
        AccountFullName: TargetUsername
