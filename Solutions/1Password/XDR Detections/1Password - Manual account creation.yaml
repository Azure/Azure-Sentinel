properties:
  id: xdr-9a264487-bcb8-4c7f-a461-b289a46377b8
  displayName: 1Password - Manual account creation
  status: disabled
  queryCondition:
    queryText: |-
      OnePasswordEventLogs_CL
      | where action == "create"
      | where object_type == "invite"
      | where actor_details.email !endswith "@1passwordserviceaccounts.com"
      | extend
          ActorUsername = actor_details.email
          , SrcIpAddr = session.ip
          , TargetUsername = aux_info
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: 1Password - Manual account creation
      description: |-
        This will alert when a new account was created manually within 1Password. This should only be used when a 1Password integration via a SCIM Bridge has been implemented.

        Ref: https://support.1password.com/scim/
        Ref: https://1password.com/
        Ref: https://github.com/securehats/
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1136
      customDetails:
        AccountFullName: ActorUsername
        AccountFullName_2: TargetUsername
