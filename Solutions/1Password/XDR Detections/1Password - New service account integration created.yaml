properties:
  id: xdr-26daed54-cea5-469c-9b6e-0d85a40dc463
  displayName: 1Password - New service account integration created
  status: disabled
  queryCondition:
    queryText: |-
      OnePasswordEventLogs_CL
      | where log_source == "auditevents"
      | where action == "create"
      | where object_type == "sa"
      | extend
          ActorUsername = actor_details.email
          , SrcIpAddr = session.ip
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: 1Password - New service account integration created
      description: |-
        This will alert when a new integration has been created. Once this analytics rule is triggered it will group all related future alerts for upto an hour when all related entities are the same.

        Ref: https://1password.com/
        Ref: https://github.com/securehats/
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1136
      customDetails:
        AccountFullName: ActorUsername
