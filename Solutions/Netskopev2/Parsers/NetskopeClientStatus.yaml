        Isp = column_ifexists('isp', ''),
        LastConnectedFromPrivateIp = column_ifexists('last_connected_from_private_ip', ''),
        LastConnectedFromPublicIp = column_ifexists('last_connected_from_public_ip', ''),
        LastEventTimestamp = column_ifexists('last_event_timestamp', ''),
        LastSeenDeviceEventActor = column_ifexists('last_seen_device_event_actor', ''),
