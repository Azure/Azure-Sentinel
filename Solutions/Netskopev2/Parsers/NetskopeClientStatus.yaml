        UserInfoUserkey = column_ifexists('user_info_userkey', ''),
        UserInfoUsername = column_ifexists('user_info_username', ''),
        Zipcode = column_ifexists('zipcode', ''),
        RecordType = column_ifexists('record_type', '')
    | project
        TimeGenerated,
        As,
        Asn,
        City,
        ClientInstallTime,
        ClientVersion,
        Count,
        Continent,
        Country,
        DeviceHash,
        DeviceId,
        DemFeatureEnabled,
        DemFeatureEnabledName,
        Enriched,
