        City = column_ifexists('city', ''),
        ClientInstallTime = column_ifexists('client_install_time', ''),
        ClientVersion = column_ifexists('client_version', ''),
        Count = column_ifexists('count_i', ''),
        Continent = column_ifexists('continent', ''),
        Country = column_ifexists('country', ''),
        DeviceHash = column_ifexists('device_hash', ''),
        DeviceId = column_ifexists('device_id', ''),
        DemFeatureEnabled = column_ifexists('dem_feature_enabled', ''),
        DemFeatureEnabledName = column_ifexists('dem_feature_enabled_name', ''),
        Enriched = column_ifexists('enriched', ''),
        Guid = column_ifexists('guid', ''),
        HeartBeat = column_ifexists('heart_beat', ''),
        HostInfoClientVersion = column_ifexists('host_info_client_version', ''),
        HostInfoDeviceMake = column_ifexists('host_info_device_make', ''),
