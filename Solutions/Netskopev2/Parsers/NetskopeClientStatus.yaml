        LastSeenDeviceEventServiceName,
        LastSeenDeviceEventStatus,
        LastSeenDeviceEventStatusName,
        LastSeenDeviceEventStatusV2,
        LastSeenDeviceEventStatusV2Name,
        LastSeenDeviceEventTimestamp,
        Latitude,
        Longitude,
        Organization,
        PostalCode,
        PopName,
        PopPinned,
        Region,
        Timestamp,
        UserInfoDeviceClassificationStatus,
        UserInfoDeviceClassificationStatusName,
        UserInfoOrgkey,
        UserInfoUserkey,
