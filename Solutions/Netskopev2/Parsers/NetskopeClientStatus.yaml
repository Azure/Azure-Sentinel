        LastSeenDeviceEventStatus = column_ifexists('last_seen_device_event_status', ''),
        LastSeenDeviceEventStatusName = column_ifexists('last_seen_device_event_status_name', ''),
        LastSeenDeviceEventStatusV2 = column_ifexists('last_seen_device_event_status_v2', ''),
        LastSeenDeviceEventStatusV2Name = column_ifexists('last_seen_device_event_status_v2_name', ''),
        LastSeenDeviceEventTimestamp = column_ifexists('last_seen_device_event_timestamp', ''),
