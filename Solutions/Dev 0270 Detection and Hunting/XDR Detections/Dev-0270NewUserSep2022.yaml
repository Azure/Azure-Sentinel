properties:
  id: xdr-7965f0be-c039-4d18-8ee8-9a6add8aecf3
  displayName: DEV-0270 New User Creation
  status: disabled
  queryCondition:
    queryText: |-
      (union isfuzzy=true
      (SecurityEvent
      | where EventID == 4688
      | where CommandLine has_all ('net user', '/add')
      | parse CommandLine with * "user " username " "*
      | extend ExtractedArg = extract(@"\buser\s+[^\s]+\s+([^\s]+)", 1, CommandLine)
      | where username in('DefaultAccount') or ExtractedArg in(strcat('P@ss', 'w0rd1234'), '_AS_@1394')
      | project TimeGenerated, Computer, Account, AccountDomain, ProcessName, ProcessNameFullPath = NewProcessName, EventID, Activity, CommandLine, EventSourceName, Type
      ),
      (DeviceProcessEvents
      | where InitiatingProcessCommandLine has_all('net user', '/add')
      | parse InitiatingProcessCommandLine with * "user " username " "*
      | extend ExtractedArg = extract(@"\buser\s+[^\s]+\s+([^\s]+)", 1, InitiatingProcessCommandLine)
      | where username in('DefaultAccount') or ExtractedArg in(strcat('P@ss', 'w0rd1234'), '_AS_@1394')
      | extend Account = strcat(InitiatingProcessAccountDomain, @'\', InitiatingProcessAccountName), Computer = DeviceName
      )
      )
      | extend HostName = tostring(split(Computer, ".")[0]), DomainIndex = toint(indexof(Computer, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(Computer, DomainIndex + 1), Computer)
      | extend AccountName = tostring(split(Account, @'\')[1]), AccountNTDomain = tostring(split(Account, @'\')[0])
  schedule:
    frequency: PT6H
  detectionAction:
    alertTemplate:
      title: DEV-0270 New User Creation
      description: '''The following query tries to detect creation of a new user using a known DEV-0270 username/password
        schema'''
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1098
      customDetails:
        AccountFullName: Account
        AccountName: AccountName
        AccountNTDomain: AccountNTDomain
        HostFullName: Computer
