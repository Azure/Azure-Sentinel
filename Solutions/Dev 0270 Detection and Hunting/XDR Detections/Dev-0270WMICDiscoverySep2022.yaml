properties:
  id: xdr-6b652b4f-9810-4eec-9027-7aa88ce4db23
  displayName: Dev-0270 WMIC  Discovery
  status: disabled
  queryCondition:
    queryText: |-
      (union isfuzzy=true
      (SecurityEvent
      | where EventID==4688
      | where CommandLine has "wmic computersystem get domain" and ParentProcessName has "dllhost.exe"
      | project TimeGenerated, Computer, Account, AccountDomain, ProcessName, ProcessNameFullPath = NewProcessName, EventID, Activity, CommandLine, EventSourceName, Type
      ),
      (DeviceProcessEvents
      | where ProcessCommandLine has "wmic computersystem get domain" and InitiatingProcessFileName =~ "dllhost.exe" and InitiatingProcessCommandLine has "dllhost.exe"
      | extend Account = strcat(InitiatingProcessAccountDomain, @'\', InitiatingProcessAccountName), Computer = DeviceName
      )
      )
      | extend HostName = tostring(split(Computer, ".")[0]), DomainIndex = toint(indexof(Computer, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(Computer, DomainIndex + 1), Computer)
      | extend AccountName = tostring(split(Account, @'\')[1]), AccountNTDomain = tostring(split(Account, @'\')[0])
  schedule:
    frequency: PT6H
  detectionAction:
    alertTemplate:
      title: Dev-0270 WMIC  Discovery
      description: '''The query below identifies dllhost.exe using WMIC to discover additional hosts and associated domains
        in the environment.'''
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1482
      customDetails:
        AccountFullName: Account
        AccountName: AccountName
        HostFullName: Computer
