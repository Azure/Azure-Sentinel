properties:
  id: xdr-dfdb9a73-4335-4bb4-b29b-eb713bce61a6
  displayName: Cisco SEG - Multiple suspiciuos attachments received
  status: disabled
  queryCondition:
    queryText: |-
      let r_threshold = 5;
      CiscoSEGEvent
      | where NetworkDirection =~ 'Incoming'
      | where isnotempty(EventMessage)
      | where strlen(EventMessage) < 20
      | summarize rec = make_set(DstUserName), TimeGenerated = max(TimeGenerated), SrcUserName = take_any(SrcUserName), SourceIP = take_any(SourceIP), DvcIpAddr = take_any(DvcIpAddr) by EventMessage, bin(TimeGenerated, 10m)
      | where array_length(rec) > r_threshold
      | extend AccountCustomEntity = tostring(rec[0]), IPCustomEntity = coalesce(SourceIP, DvcIpAddr), rec = strcat_array(rec, ', ')
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco SEG - Multiple suspiciuos attachments received
      description: '''Detects possibly phishing emails.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
      customDetails:
        AccountName: AccountCustomEntity
