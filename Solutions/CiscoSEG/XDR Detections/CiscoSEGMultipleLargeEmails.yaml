properties:
  id: xdr-1399a9a5-6200-411e-8c34-ca5658754cf7
  displayName: Cisco SEG - Multiple large emails sent to external recipient
  status: disabled
  queryCondition:
    queryText: |-
      let e_theshold = 3;
      let s_threshold = 10000000;
      CiscoSEGEvent
      | where AdditionalFields[15]['ESAMsgSize'] > s_threshold
      | where NetworkDirection =~ 'Outgoing'
      | extend rec_domain = extract(@'@(.*)', 1, DstUserName)
      | extend s_domain = extract(@'@(.*)', 1, SrcUserName)
      | where s_domain != rec_domain
      | summarize count(), TimeGenerated = max(TimeGenerated), SourceIP = take_any(SourceIP), DvcIpAddr = take_any(DvcIpAddr) by SrcUserName
      | where count_ >= e_theshold
      | extend AccountCustomEntity = SrcUserName, IPCustomEntity = coalesce(SourceIP, DvcIpAddr)
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco SEG - Multiple large emails sent to external recipient
      description: '''Detects possible data exfiltration.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1030
      customDetails:
        AccountName: AccountCustomEntity
