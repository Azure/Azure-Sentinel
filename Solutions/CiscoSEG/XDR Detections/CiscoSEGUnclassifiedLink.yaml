properties:
  id: xdr-9cb4a02d-3708-42ba-b33b-0fdd360ce4b6
  displayName: Cisco SEG - Unexpected link
  status: disabled
  queryCondition:
    queryText: |-
      let u_cat = dynamic(['Unclassified']);
      CiscoSEGEvent
      | where NetworkDirection =~ 'Incoming'
      | where tostring(AdditionalFields) has 'ESAURLDetails'
      | extend link_cat = extract(@"'Category': '(.*?)'", 1, tostring(AdditionalFields))
      | where link_cat in~ (u_cat)
      | extend AccountCustomEntity = DstUserName, IPCustomEntity = coalesce(SourceIP, DvcIpAddr)
      | project-away AdditionalFields
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco SEG - Unexpected link
      description: '''Detects mails with suspicious links.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
