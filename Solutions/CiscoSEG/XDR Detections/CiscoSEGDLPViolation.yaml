properties:
  id: xdr-df5c34dd-e1e6-4e07-90b1-4309ebfe754c
  displayName: Cisco SEG - DLP policy violation
  status: disabled
  queryCondition:
    queryText: |-
      CiscoSEGEvent
      | where NetworkDirection =~ 'Outgoing'
      | where tostring(AdditionalFields) has 'ESADLPVerdict'
      | extend dlp_verdict = extract(@'ESADLPVerdict":"(NOT_EVALUATED|NO TRIGGER|VIOLATION|NO VIOLATION)"', 1, tostring(AdditionalFields))
      | where dlp_verdict =~ 'VIOLATION'
      | extend AccountCustomEntity = SrcUserName, IPCustomEntity = coalesce(SourceIP, DvcIpAddr)
      | project-away AdditionalFields
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco SEG - DLP policy violation
      description: '''Detects DLP policy violation.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1030
