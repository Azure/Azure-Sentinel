properties:
  id: xdr-236e872c-31d1-4b45-ac2a-fda3af465c97
  displayName: Cisco SEG - Malicious attachment not blocked
  status: disabled
  queryCondition:
    queryText: |-
      CiscoSEGEvent
      | where NetworkDirection =~ 'Incoming'
      | where SimplifiedDeviceAction =~ 'DELIVERED'
      | where tostring(AdditionalFields) has 'ESAAMPVerdict'
      | extend amp_verdict = extract(@'ESAAMPVerdict":"(NOT_EVALUATED|CLEAN|FA_PENDING|UNKNOWN|SKIPPED|UNSCANNABLE|LOW_RISK|MALICIOUS)"', 1, tostring(AdditionalFields))
      | where amp_verdict =~ 'MALICIOUS'
      | extend AccountCustomEntity = DstUserName, IPCustomEntity = coalesce(SourceIP, DvcIpAddr)
      | project-away AdditionalFields
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: Cisco SEG - Malicious attachment not blocked
      description: '''Detects mails with malicious attachments which were not blocked.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
