properties:
  id: xdr-f8ba18c4-81e3-4db0-8f85-4989f2ed2ade
  displayName: Cisco SEG - Unexpected attachment
  status: disabled
  queryCondition:
    queryText: |-
      CiscoSEGEvent
      | where NetworkDirection =~ 'Incoming'
      | where tostring(AdditionalFields) has 'ESAAttachmentDetails'
      | extend attachment = replace_string(tostring(extract(@'"ESAAttachmentDetails":"{(.*?):', 1, tostring(AdditionalFields))), "'", "")
      | where attachment endswith '.ps1' or attachment endswith '.lnk' or attachment endswith '.exe'
      | extend AccountCustomEntity = DstUserName, IPCustomEntity = coalesce(SourceIP, DvcIpAddr)
      | project-away AdditionalFields
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco SEG - Unexpected attachment
      description: '''Detects possibly malicious attachments.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
