id: dfdb9a73-4335-4bb4-b29b-eb713bce61a6
name: Cisco SEG - Multiple suspiciuos attachments received
description: |
  'Detects possibly phishing emails.'
severity: High
status: Available
requiredDataConnectors:
  - connectorId: CefAma
    dataTypes:
      - CommonSecurityLog
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1566
query: |
  let r_threshold = 5;
  CiscoSEGEvent
  | where NetworkDirection =~ 'Incoming'
  | where isnotempty(EventMessage)
  | where strlen(EventMessage) < 20
  | summarize rec = make_set(DstUserName), TimeGenerated = max(TimeGenerated), SrcUserName = take_any(SrcUserName), SourceIP = take_any(SourceIP), DvcIpAddr = take_any(DvcIpAddr) by EventMessage, bin(TimeGenerated, 10m)
  | where array_length(rec) > r_threshold
  | extend AccountCustomEntity = tostring(rec[0]), IPCustomEntity = coalesce(SourceIP, DvcIpAddr), rec = strcat_array(rec, ', ')
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.3
kind: Scheduled