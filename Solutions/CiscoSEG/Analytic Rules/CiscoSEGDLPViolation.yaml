id: df5c34dd-e1e6-4e07-90b1-4309ebfe754c
name: Cisco SEG - DLP policy violation
description: |
  'Detects DLP policy violation.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: CefAma
    dataTypes:
      - CommonSecurityLog
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Exfiltration
relevantTechniques:
  - T1030
query: |
  CiscoSEGEvent
  | where NetworkDirection =~ 'Outgoing'
  | where tostring(AdditionalFields) has 'ESADLPVerdict'
  | extend dlp_verdict = extract(@'ESADLPVerdict":"(NOT_EVALUATED|NO TRIGGER|VIOLATION|NO VIOLATION)"', 1, tostring(AdditionalFields))
  | where dlp_verdict =~ 'VIOLATION'
  | extend AccountCustomEntity = SrcUserName, IPCustomEntity = coalesce(SourceIP, DvcIpAddr)
  | project-away AdditionalFields
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.3
kind: Scheduled