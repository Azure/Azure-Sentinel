properties:
  id: xdr-f0be259a-34ac-4946-aa15-ca2b115d5feb
  displayName: Palo Alto - potential beaconing detected
  status: disabled
  queryCondition:
    queryText: 'let starttime = 2d;

      let endtime = 1d;

      let TimeDeltaThreshold = 25;

      let TotalEventsThreshold = 30;

      let MostFrequentTimeDeltaThreshold = 25;

      let PercentBeaconThreshold = 80;

      CommonSecurityLog

      | where DeviceVendor == "Palo Alto Networks" and Activity == "TRAFFIC"

      | where TimeGenerated between (startofday(ago(starttime))..startofday(ago(endtime)))

      | where ipv4_is_private(DestinationIP)== false

      | project TimeGenerated, DeviceName, SourceUserID, SourceIP, SourcePort, DestinationIP, DestinationPort, ReceivedBytes, SentBytes

      | sort by SourceIP asc,TimeGenerated asc, DestinationIP asc, DestinationPort asc

      | serialize

      | extend nextTimeGenerated = next(TimeGenerated, 1), nextSourceIP = next(SourceIP, 1)

      | extend TimeDeltainSeconds = datetime_diff(''second'',nextTimeGenerated,TimeGenerated)

      | where SourceIP == nextSourceIP

      //Whitelisting criteria/ threshold criteria

      | where TimeDeltainSeconds > TimeDeltaThreshold

      | summarize count(), sum(ReceivedBytes), sum(SentBytes)

      by TimeDeltainSeconds, bin(TimeGenerated, 1h), DeviceName, SourceUserID, SourceIP, DestinationIP, DestinationPort

      | summarize (MostFrequentTimeDeltaCount, MostFrequentTimeDeltainSeconds) = arg_max(count_, TimeDeltainSeconds), TotalEvents=sum(count_), TotalSentBytes = sum(sum_SentBytes), TotalReceivedBytes = sum(sum_ReceivedBytes)

      by bin(TimeGenerated, 1h), DeviceName, SourceUserID, SourceIP, DestinationIP, DestinationPort

      | where TotalEvents > TotalEventsThreshold and MostFrequentTimeDeltaCount > MostFrequentTimeDeltaThreshold

      | extend BeaconPercent = MostFrequentTimeDeltaCount/toreal(TotalEvents) * 100

      | where BeaconPercent > PercentBeaconThreshold'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Palo Alto - potential beaconing detected
      description: 'Identifies beaconing patterns from Palo Alto Network traffic logs based on recurrent timedelta patterns. The query calculates time deltas and compares them with total events in a day to find the percentage of beaconing. This outbound beaconing pattern to untrusted public networks should be investigated for malware callbacks or exfiltration. Reference Blog: https://medium.com/@HuntOperator/detect-beaconing-with-flare-elastic-stack-and-intrusion-detection-systems-110dc74e0c56'
      severity: low
      entityMappings:
        hosts:
        - id: host1
          nameColumn: DeviceName
        ips:
        - id: ip1
          addressColumn: DestinationIP
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
        - technique: T1571
      customDetails:
        AccountFullName: SourceUserID
        HostFullName: DeviceName
