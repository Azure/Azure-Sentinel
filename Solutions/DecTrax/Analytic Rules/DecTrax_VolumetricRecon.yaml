id: a8326e47-5c01-4478-bc4a-675db3ee1f19
name: DECTRAX - Volumetric Port Scanning & Reconnaissance
description: |
  'Detects automated adversary scanners probing multiple honeypot sensors or targeting multiple distinct network ports across the DECTRAX deception mesh.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: DecTraxDefinition
    dataTypes:
      - DECTRAXThreats_CL
queryFrequency: 15m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Discovery
  - Reconnaissance
relevantTechniques:
  - T1046
  - T1595
query: |
  DECTRAXThreats_CL
  | where TimeGenerated >= ago(1h)
  | summarize DistinctPorts = dcount(DestinationPort_d), DistinctNodes = dcount(NodeID_s), TotalAttempts = count(), Signatures = make_set(Signature_s, 5) by SourceIP_s, SourceCountry_s, bin(TimeGenerated, 15m)
  | where DistinctPorts >= 5 or TotalAttempts >= 20
  | extend IPCustomEntity = SourceIP_s
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.0
kind: Scheduled
