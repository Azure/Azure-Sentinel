id: e4157a90-349f-43b6-9ca8-fcb65c3de578
name: DECTRAX - GATE Zero-Trust Threat & Injection Intercepted
description: |
  'Detects SQL injection, OS command injection, XSS, or prompt injection payloads intercepted and blocked by the DECTRAX GATE edge reverse proxy.'
severity: High
status: Available
requiredDataConnectors:
  - connectorId: DecTraxDefinition
    dataTypes:
      - DECTRAXThreats_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - DefenseEvasion
relevantTechniques:
  - T1190
  - T1059
query: |
  DECTRAXThreats_CL
  | where TimeGenerated >= ago(1h)
  | where Platform_s =~ 'GATE' or Signature_s has_any ('SQL Injection', 'Command Injection', 'XSS', 'Prompt Injection', 'Schema Violation', 'BMS Override')
  | extend IPCustomEntity = SourceIP_s
  | extend URLCustomEntity = URL_s
  | project TimeGenerated, IPCustomEntity, URLCustomEntity, Signature_s, Method_s, SourceCountry_s, NodeID_s
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: URLCustomEntity
version: 1.0.0
kind: Scheduled
