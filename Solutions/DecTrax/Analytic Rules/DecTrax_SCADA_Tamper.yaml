id: 7b561c29-43c2-49da-912b-3e5f2cf2130e
name: DECTRAX - Critical SCADA / BMS / IoT Protocol Tampering
description: |
  'Detects unauthorized connection attempts or command injections targeting Modbus, BACnet, S7comm, MQTT, or BMS/IoT industrial control protocols.'
severity: High
status: Available
requiredDataConnectors:
  - connectorId: DecTraxDefinition
    dataTypes:
      - DECTRAXThreats_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
  - InitialAccess
relevantTechniques:
  - T0855
  - T0812
query: |
  DECTRAXThreats_CL
  | where TimeGenerated >= ago(1h)
  | where Protocol_s in~ ('modbus', 'bacnet', 's7comm', 'dnp3', 'mqtt', 'coap') or DestinationPort_d in (502, 47808, 102, 20000, 1883, 5683)
  | extend IPCustomEntity = SourceIP_s
  | extend HostCustomEntity = NodeID_s
  | project TimeGenerated, IPCustomEntity, HostCustomEntity, Protocol_s, DestinationPort_d, Signature_s, Severity_s, SourceCountry_s
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostCustomEntity
version: 1.0.0
kind: Scheduled
