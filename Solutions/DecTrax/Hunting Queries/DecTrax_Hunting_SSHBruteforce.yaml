id: b6188e42-7cf2-4de9-b529-6889410313cb
name: DECTRAX - SSH Deception Brute Force Hunting
description: |
  'Identifies repeated automated SSH authentication and credential stuffing against honeypot sensors over the last 7 days.'
severity: Medium
requiredDataConnectors:
  - connectorId: DecTraxDefinition
    dataTypes:
      - DECTRAXThreats_CL
tactics:
  - CredentialAccess
  - InitialAccess
relevantTechniques:
  - T1110
  - T1078
query: |
  DECTRAXThreats_CL
  | where TimeGenerated >= ago(7d)
  | where Protocol_s =~ 'ssh' or DestinationPort_d == 22
  | summarize AttemptCount = count(), NodeCount = dcount(NodeID_s), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by SourceIP_s, SourceCountry_s
  | where AttemptCount > 10
  | sort by AttemptCount desc
  | extend IPCustomEntity = SourceIP_s
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
