properties:
  id: xdr-netskope-impossible-travel-detection-two-countries-in-less-than-1-hour-d1b88716
  displayName: Netskope - Impossible Travel Detection (Two Countries in Less Than 1 Hour)
  status: disabled
  queryCondition:
    queryText: |-
      let timeWindow = 1h;
      NetskopeWebTransactions_CL
      | where TimeGenerated > ago(1h)
      | where isnotempty(CsUsername) and isnotempty(XCCountry)
      | summarize
          Countries = make_set(XCCountry),
          Locations = make_set(XCLocation),
          IPs = make_set(CIp),
          MinTime = min(TimeGenerated),
          MaxTime = max(TimeGenerated),
          EventCount = count()
          by CsUsername, bin(TimeGenerated, timeWindow)
      | where array_length(Countries) > 1
      | extend TimeDiffMinutes = datetime_diff('minute', MaxTime, MinTime)
      | where TimeDiffMinutes < 60
      | project
          TimeGenerated,
          User = CsUsername,
          DistinctCountries = Countries,
          Locations,
          SourceIPs = IPs,
          TimeDifferenceMinutes = TimeDiffMinutes,
          EventCount,
          AlertDetails = strcat('User ', CsUsername, ' accessed from ', array_length(Countries), ' countries within ', TimeDiffMinutes, ' minutes')
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Netskope - Impossible Travel Detection (Two Countries in Less Than 1 Hour)
      description: Detects when a user accesses resources from two distinct countries within less than 1 hour, indicating
        potential credential compromise or VPN abuse.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: User
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1078
