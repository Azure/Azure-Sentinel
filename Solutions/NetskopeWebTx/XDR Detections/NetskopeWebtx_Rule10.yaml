properties:
  id: xdr-netskope-unsanctioned-risky-cloud-app-access-shadow-it-cdc01279
  displayName: Netskope - Unsanctioned/Risky Cloud App Access (Shadow IT)
  status: disabled
  queryCondition:
    queryText: |-
      NetskopeWebTransactions_CL
      | where TimeGenerated > ago(1h)
      | where isnotempty(CsUsername) and isnotempty(XCsApp)
      | where XCsAppTags contains 'Unsanctioned'
          or XCsAppCcl =~ 'poor'
          or XCsAppCcl =~ 'low'
          or XCsAppCci < 50
      | summarize
          EventCount = count(),
          TotalBytesMB = round(sum(Bytes) / 1048576.0, 2),
          Activities = make_set(XCsAppActivity),
          FirstSeen = min(TimeGenerated),
          LastSeen = max(TimeGenerated)
          by
          CsUsername,
          XCsApp,
          XCsAppCategory,
          XCsAppCcl,
          XCsAppCci,
          XCsAppTags,
          XCCountry,
          XCDevice
      | extend RiskLevel = case(
          XCsAppCci < 30, 'Critical',
          XCsAppCci < 50, 'High',
          XCsAppCci < 70, 'Medium',
          'Low')
      | project
          TimeGenerated = LastSeen,
          User = CsUsername,
          RiskyApplication = XCsApp,
          AppCategory = XCsAppCategory,
          CloudConfidenceLevel = XCsAppCcl,
          CloudConfidenceIndex = XCsAppCci,
          AppTags = XCsAppTags,
          RiskLevel,
          Country = XCCountry,
          Device = XCDevice,
          Activities,
          EventCount,
          DataTransferMB = TotalBytesMB
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Netskope - Unsanctioned/Risky Cloud App Access (Shadow IT)
      description: Alerts when users access unsanctioned or risky cloud applications based on Cloud Confidence Level (CCL)
        and app tags. Detects Shadow IT usage.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: User
        cloudApplications:
        - id: cloudApplication1
          nameColumn: RiskyApplication
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
