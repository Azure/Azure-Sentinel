id: 6b2d4e8a-5f7c-4b9e-8a1d-3c5e7a9b2f4d
name: Lookout - Critical Audit and Policy Changes (v2)
description: |
  'Detects administrative changes in the Lookout console reported by the Lookout Mobile Risk API v2 audit feed: changes to admin accounts, tenancy and enterprise settings, classification, allowlist and denylist policies, smishing and vishing settings, device groups, URL classifications, data exports and admin-initiated device deletions. Routine admin logins and logouts and system-initiated changes are excluded. Changes are grouped into one alert per admin and audit type per run, with the change count, affected targets and attribute changes included.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: LookoutStreaming_Definition
    dataTypes:
      - LookoutMtdV2_CL
queryFrequency: 15m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1629
  - T1626
query: |
  let HighImpactAuditTypes = dynamic(["ADMIN", "TENANCY", "EXPORT", "ENTERPRISE", "DENYLIST_POLICY", "ALLOWLIST_POLICY"]);
  let PolicyAuditTypes = dynamic(["CLASSIFICATION_POLICY", "ENTERPRISE_FEATURE", "SMISHING_SETTINGS", "VISHING_SETTINGS", "PCP_AI_DENYLIST_DOMAIN", "URL_CLASSIFICATION", "EMAIL_INVITE", "DEVICE_GROUP_CHANGE"]);
  LookoutEvents
  | where ingestion_time() > ago(15m) and ingestion_time() <= now()
  | where EventType == "AUDIT"
  | where ActorType == "ADMIN"
  | where AuditType in (HighImpactAuditTypes) or AuditType in (PolicyAuditTypes)
      or (AuditType == "DEVICE" and ChangeType == "DELETED")
  // One alert per admin and audit type per run: a single console session can emit dozens of policy events
  | summarize
      TimeGenerated = max(TimeGenerated),
      ChangeCount = dcount(EventId),
      ChangeTypes = make_set(ChangeType),
      Targets = make_set(TargetGuid, 20),
      AuditAttributeChanges = make_list(AuditAttributeChanges, 20)
      by ActorGuid, ActorType, AuditType
  | extend
      AlertSeverity = iff(AuditType in (HighImpactAuditTypes) or AuditType == "DEVICE", "Medium", "Low"),
      ChangeSummary = case(
          AuditType == "ADMIN", "Admin account change",
          AuditType == "TENANCY", "Tenancy change",
          AuditType == "EXPORT", "Data export",
          AuditType == "ENTERPRISE", "Enterprise settings change",
          AuditType in ("DENYLIST_POLICY", "ALLOWLIST_POLICY"), "Allowlist/denylist policy change",
          AuditType == "DEVICE", "Device deleted by admin",
          AuditType == "DEVICE_GROUP_CHANGE", "Device group change",
          AuditType in (PolicyAuditTypes), "Policy or settings change",
          "Audit change"
      )
  | project
      TimeGenerated,
      AuditType,
      ChangeSummary,
      ChangeCount,
      ChangeTypes,
      AlertSeverity,
      ActorType,
      ActorGuid,
      Targets,
      AuditAttributeChanges
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: ActorGuid
customDetails:
  AuditType: AuditType
  ChangeSummary: ChangeSummary
  ChangeCount: ChangeCount
  ChangeTypes: ChangeTypes
  ActorType: ActorType
alertDetailsOverride:
  alertDisplayNameFormat: "Lookout admin change: {{ChangeSummary}}"
  alertDescriptionFormat: "{{ChangeCount}} {{AuditType}} changes by admin {{ActorGuid}}"
  alertSeverityColumnName: AlertSeverity
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: P1D
    matchingMethod: Selected
    groupByEntities:
      - Account
    groupByCustomDetails:
      - ChangeSummary
eventGroupingSettings:
  aggregationKind: AlertPerResult
suppressionEnabled: false
suppressionDuration: PT30M
version: 2.1.0
kind: Scheduled
