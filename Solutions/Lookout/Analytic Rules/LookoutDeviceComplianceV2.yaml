id: 9c5b6d8f-3a02-4e9b-af4c-2d7e9b1f5a8c
name: Lookout - Device Compliance and Security Status Changes (v2)
description: |
  'Detects mobile devices moving into a degraded security state reported by the Lookout Mobile Risk API v2: high-severity threats present, Lookout protection disconnected, or device deactivated. A device alerts when its posture changes compared with its previous state in the last 7 days, not on every check-in. Platform, OS version, patch level and MDM context are included.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: LookoutStreaming_Definition
    dataTypes:
      - LookoutMtdV2_CL
queryFrequency: 1h
queryPeriod: 7d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Discovery
  - DefenseEvasion
  - Persistence
relevantTechniques:
  - T1418
  - T1629
  - T1655
query: |
  // DEVICE events report current state, so alert only when a device moves into a degraded posture
  let DevicePosture = LookoutEvents
  | where EventType == "DEVICE"
  | extend SecurityPosture = case(
          DeviceProtectionStatus == "DISCONNECTED", "Protection Disconnected",
          DeviceActivationStatus == "DEACTIVATED", "Device Deactivated",
          DeviceSecurityStatus == "THREATS_HIGH", "High Severity Threats Present",
          "OK"
      );
  let PriorPosture = DevicePosture
  | where ingestion_time() <= ago(1h)
  | summarize arg_max(TimeGenerated, PriorSecurityPosture = SecurityPosture) by DeviceGuid;
  DevicePosture
  | where ingestion_time() > ago(1h) and ingestion_time() <= now()
  | summarize arg_max(TimeGenerated, *) by DeviceGuid
  | where SecurityPosture != "OK"
  | join kind=leftouter (PriorPosture | project DeviceGuid, PriorSecurityPosture) on DeviceGuid
  | where isempty(PriorSecurityPosture) or PriorSecurityPosture != SecurityPosture
  | extend
      AlertSeverity = iff(DeviceSecurityStatus == "THREATS_HIGH", "Medium", "Low"),
      OSOutdated = iff(isnotempty(DeviceLatestOSVersion) and isnotempty(DeviceOSVersion) and DeviceOSVersion != DeviceLatestOSVersion, "Yes", "No")
  | project
      TimeGenerated,
      EventId,
      ChangeType,
      PriorSecurityPosture,
      DeviceGuid,
      DeviceEmailAddress,
      DevicePlatform,
      DeviceOSVersion,
      DeviceLatestOSVersion,
      OSOutdated,
      DeviceSecurityPatchLevel,
      DeviceManufacturer,
      DeviceModel,
      DeviceSecurityStatus,
      DeviceProtectionStatus,
      DeviceActivationStatus,
      DeviceComplianceStatus,
      SecurityPosture,
      AlertSeverity,
      MDMType,
      MDMExternalId,
      ClientLookoutSDKVersion
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: DeviceEmailAddress
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceGuid
      - identifier: OSFamily
        columnName: DevicePlatform
      - identifier: OSVersion
        columnName: DeviceOSVersion
customDetails:
  SecurityPosture: SecurityPosture
  DeviceSecStatus: DeviceSecurityStatus
  ProtectionStatus: DeviceProtectionStatus
  ActivationStatus: DeviceActivationStatus
  DevCompliance: DeviceComplianceStatus
  OSOutdated: OSOutdated
  PatchLevel: DeviceSecurityPatchLevel
  DeviceModel: DeviceModel
  MDMType: MDMType
  ClientSDKVersion: ClientLookoutSDKVersion
alertDetailsOverride:
  alertDisplayNameFormat: "Lookout device at risk: {{SecurityPosture}}"
  alertDescriptionFormat: "{{DevicePlatform}} {{DeviceModel}} for {{DeviceEmailAddress}}"
  alertSeverityColumnName: AlertSeverity
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: P1D
    matchingMethod: Selected
    groupByEntities:
      - Host
    groupByCustomDetails:
      - SecurityPosture
eventGroupingSettings:
  aggregationKind: AlertPerResult
suppressionEnabled: false
suppressionDuration: PT30M
version: 2.1.0
kind: Scheduled
