id: 7a3e5f9b-4c8d-4a2e-9f1b-6d8e2a4c7f9e
name: Lookout - Critical Smishing and Phishing Alerts (v2)
description: |
  'Detects new smishing (SMS phishing) alerts from Lookout Mobile Risk API v2, including fraud detections, embedded phishing URLs and suspicious-intent messages. Fraud and URL detections are raised as High severity, suspicious detections as Medium. The impersonated employee, sender and phishing URL are included when Lookout reports them.'
severity: High
status: Available
requiredDataConnectors:
  - connectorId: LookoutStreaming_Definition
    dataTypes:
      - LookoutMtdV2_CL
queryFrequency: 5m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - CredentialAccess
  - Collection
relevantTechniques:
  - T1660
  - T1417
query: |
  LookoutEvents
  | where ingestion_time() > ago(5m) and ingestion_time() <= now()
  | where EventType == "SMISHING_ALERT"
  | where ChangeType == "CREATED"
  | summarize arg_max(TimeGenerated, *) by SmishingAlertId
  | extend
      AlertSeverity = case(
          SmishingAlertSeverity == "HIGH", "High",
          SmishingAlertSeverity == "MEDIUM", "Medium",
          "Low"
      ),
      ThreatCategory = case(
          SmishingAlertType == "FRAUD_DETECTION", "Fraud",
          SmishingAlertType == "URL_DETECTION", "Phishing URL",
          SmishingAlertType == "SUSPICIOUS_DETECTION", "Suspicious Message",
          "Smishing"
      ),
      ImpersonationRisk = iff(isnotempty(SmishingImpersonatedEmployee), "Employee Impersonation", "None Reported")
  | project
      TimeGenerated,
      EventId,
      SmishingAlertId,
      SmishingAlertType,
      SmishingAlertCategory,
      SmishingAlertSeverity,
      AlertSeverity,
      ThreatCategory,
      ImpersonationRisk,
      SmishingImpersonatedEmployee,
      SmishingSenderId,
      SmishingAlertURL,
      SmishingAlertDescription,
      DeviceGuid,
      DeviceEmailAddress,
      MDMType,
      MDMExternalId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: DeviceEmailAddress
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceGuid
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: SmishingAlertURL
customDetails:
  SmishAlertId: SmishingAlertId
  SmishAlertType: SmishingAlertType
  SmishCategory: SmishingAlertCategory
  ThreatCategory: ThreatCategory
  Impersonation: ImpersonationRisk
  ImpersonatedUser: SmishingImpersonatedEmployee
  SenderId: SmishingSenderId
alertDetailsOverride:
  alertDisplayNameFormat: "Lookout smishing alert: {{ThreatCategory}}"
  alertDescriptionFormat: "{{SmishingAlertType}} ({{SmishingAlertCategory}}) for {{DeviceEmailAddress}}"
  alertSeverityColumnName: AlertSeverity
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: P1D
    matchingMethod: Selected
    groupByEntities:
      - Account
      - Host
    groupByCustomDetails:
      - ThreatCategory
eventGroupingSettings:
  aggregationKind: AlertPerResult
suppressionEnabled: false
suppressionDuration: PT1H
version: 2.1.0
kind: Scheduled
