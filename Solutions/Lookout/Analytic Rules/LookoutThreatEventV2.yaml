id: 8b4a5c7e-2f91-4d8a-9e3b-1c6f8a2d4e9f
name: Lookout - High Severity Mobile Threats Detected (v2)
description: |
  'Detects open high severity mobile threats reported by the Lookout Mobile Risk API v2, including malicious applications, OS and configuration risks, network threats and web content threats. Each threat is alerted once per ingestion window with the affected device, user, file hash and URL mapped as entities.'
severity: High
status: Available
requiredDataConnectors:
  - connectorId: LookoutStreaming_Definition
    dataTypes:
      - LookoutMtdV2_CL
queryFrequency: 5m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Discovery
  - DefenseEvasion
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1424
  - T1418
  - T1629
  - T1630
query: |
  LookoutEvents
  | where ingestion_time() > ago(5m) and ingestion_time() <= now()
  | where EventType == "THREAT"
  | where ThreatSeverity == "HIGH"
  | where ThreatStatus == "OPEN"
  | summarize arg_max(TimeGenerated, *) by ThreatId
  | extend
      ThreatCategory = case(
          ThreatType == "APPLICATION", "Malicious or Risky App",
          ThreatType == "FILE", "Malicious File",
          ThreatType == "OS", "Vulnerable OS",
          ThreatType == "NETWORK", "Network Threat",
          ThreatType == "CONFIGURATION", "Risky Device Configuration",
          ThreatType == "WEB_CONTENT", "Malicious Web Content",
          ThreatType
      ),
      HashAlgorithm = case(
          strlen(ThreatPackageSha) == 64, "SHA256",
          strlen(ThreatPackageSha) == 40, "SHA1",
          strlen(ThreatPackageSha) == 32, "MD5",
          ""
      )
  | project
      TimeGenerated,
      EventId,
      ChangeType,
      ThreatId,
      ThreatType,
      ThreatCategory,
      ThreatSeverity,
      ThreatStatus,
      ThreatAction,
      ThreatClassification,
      ThreatClassifications,
      ThreatName,
      ThreatDescription,
      ThreatApplicationName,
      ThreatPackageName,
      ThreatPackageSha,
      HashAlgorithm,
      ThreatFileName,
      ThreatURL,
      ThreatDetectedAt,
      DeviceGuid,
      DeviceEmailAddress,
      DeviceCustomerId,
      MDMType,
      MDMExternalId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: DeviceEmailAddress
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceGuid
  - entityType: FileHash
    fieldMappings:
      - identifier: Algorithm
        columnName: HashAlgorithm
      - identifier: Value
        columnName: ThreatPackageSha
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: ThreatURL
customDetails:
  ThreatId: ThreatId
  ThreatType: ThreatType
  ThreatCategory: ThreatCategory
  ThreatStatus: ThreatStatus
  ThreatAction: ThreatAction
  ThreatClass: ThreatClassification
  AppName: ThreatApplicationName
  PackageName: ThreatPackageName
  MDMExternalId: MDMExternalId
alertDetailsOverride:
  alertDisplayNameFormat: "Lookout high severity threat: {{ThreatCategory}}"
  alertDescriptionFormat: "Open {{ThreatType}} threat ({{ThreatClassification}}) for {{DeviceEmailAddress}}"
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: P1D
    matchingMethod: Selected
    groupByEntities:
      - Host
    groupByCustomDetails:
      - ThreatType
eventGroupingSettings:
  aggregationKind: AlertPerResult
suppressionEnabled: false
suppressionDuration: PT1H
version: 2.1.0
kind: Scheduled
