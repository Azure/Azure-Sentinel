id: d2cf5018-d863-4bc5-90f9-5c6ccde08e7d
Function:
  Title: Parser for QualysKB
  Version: '1.1.1'
  LastUpdated: '2026-08-28'
Category: Microsoft Sentinel Parser
FunctionName: QualysKB
FunctionAlias: QualysKB
FunctionQuery: |
  union isfuzzy=true
    (QualysKB_CL
    | project
      TimeGenerated,
      Qid = tostring(column_ifexists("QID_s", "")),
      VulnTitle = tostring(column_ifexists("Title_s", "")),
      Category = tostring(column_ifexists("Category_s", "")),
      Consequence = tostring(column_ifexists("Consequence_s", "")),
      Diagnosis = tostring(column_ifexists("Diagnosis_s", "")),
      LastServiceModificationDateTime = todatetime(column_ifexists("Last_Service_Modification_DateTime_t", "")),
      Patchable = tostring(column_ifexists("Patchable_s", "")),
      CveId = parse_json(tostring(column_ifexists("CVE_ID_s", ""))),
      CveUrl = parse_json(tostring(column_ifexists("CVE_URL_s", ""))),
      VendorReferenceId = parse_json(tostring(column_ifexists("Vendor_Reference_ID_s", ""))),
      VendorReferenceUrl = parse_json(tostring(column_ifexists("Vendor_Reference_URL_s", ""))),
      PciFlag = tostring(column_ifexists("PCI_Flag_s", "")),
      PublishedDatetime = todatetime(column_ifexists("Published_DateTime_t", "")),
      SeverityLevel = tostring(column_ifexists("Severity_Level_s", "")),
      SoftwareProduct = parse_json(tostring(column_ifexists("Software_Product_s", ""))),
      SoftwareVendor = parse_json(tostring(column_ifexists("Software_Vendor_s", ""))),
      Solution = tostring(column_ifexists("Solution_s", "")),
      VulnType = tostring(column_ifexists("Vuln_Type_s", "")),
      DiscoveryAdditionalInfo = tostring(column_ifexists("Discovery_Additional_Info_s", "")),
      DiscoveryRemote = tostring(column_ifexists("Discovery_Remote_s", "")),
      DiscoveryAuthType = parse_json(tostring(column_ifexists("Discovery_Auth_Type_s", ""))),
      ThreatIntelligence = parse_json(tostring(column_ifexists("THREAT_INTELLIGENCE_s", "")))),
    (QualysKnowledgeBase
    | project
      TimeGenerated,
      Qid = tostring(column_ifexists("Qid", "")),
      VulnTitle = tostring(column_ifexists("VulnTitle", "")),
      Category = tostring(column_ifexists("Category", "")),
      Consequence = tostring(column_ifexists("Consequence", "")),
      Diagnosis = tostring(column_ifexists("Diagnosis", "")),
      LastServiceModificationDateTime = todatetime(column_ifexists("LastServiceModificationDateTime", "")),
      Patchable = tostring(column_ifexists("Patchable", "")),
      CveId = parse_json(tostring(column_ifexists("CveId", ""))),
      CveUrl = parse_json(tostring(column_ifexists("CveUrl", ""))),
      VendorReferenceId = parse_json(tostring(column_ifexists("VendorReferenceId", ""))),
      VendorReferenceUrl = parse_json(tostring(column_ifexists("VendorReferenceUrl", ""))),
      PciFlag = tostring(column_ifexists("PciFlag", "")),
      PublishedDatetime = todatetime(column_ifexists("PublishedDatetime", "")),
      SeverityLevel = tostring(column_ifexists("SeverityLevel", "")),
      SoftwareProduct = parse_json(tostring(column_ifexists("SoftwareProduct", ""))),
      SoftwareVendor = parse_json(tostring(column_ifexists("SoftwareVendor", ""))),
      Solution = tostring(column_ifexists("Solution", "")),
      VulnType = tostring(column_ifexists("VulnType", "")),
      DiscoveryAdditionalInfo = tostring(column_ifexists("DiscoveryAdditionalInfo", "")),
      DiscoveryRemote = tostring(iff(
        isnotempty(column_ifexists("DiscoveryRemote", "")),
        column_ifexists("DiscoveryRemote", ""),
        column_ifexists("DiscoveryRemove", ""))),
      DiscoveryAuthType = parse_json(tostring(column_ifexists("DiscoveryAuthType", ""))),
      ThreatIntelligence = parse_json(tostring(column_ifexists("ThreatIntelligence", ""))))
  | summarize arg_max(TimeGenerated, *) by Qid, LastServiceModificationDateTime