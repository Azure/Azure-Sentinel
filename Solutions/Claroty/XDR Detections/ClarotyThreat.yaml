properties:
  id: xdr-731e5ac4-7fe1-4b06-9941-532f2e008bb3
  displayName: Claroty - Threat detected
  status: disabled
  queryCondition:
    queryText: 'ClarotyEvent

      | where EventOriginalType has ''Threat'' or EventType has ''Threat''

      | extend IPCustomEntity = DstIpAddr

      | project TimeGenerated, EventProduct, EventSeverity, EventOriginalType, EventType, DstIpAddr, SrcIpAddr, Computer,
      IPCustomEntity'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Claroty - Threat detected
      description: Detects Claroty events where EventOriginalType or EventType contains 'Threat', identifying Threat-related
        activity and surfacing the destination IP address for investigation.
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1018
      - tactic: Reconnaissance
        techniques:
        - technique: T1595
      customDetails:
        EventOriginalType: EventOriginalType
        EventType: EventType
        TimeGenerated: TimeGenerated
