      title: Claroty - Policy violation
      description: '''Detects Claroty policy violation events from ClarotyEvent when EventOriginalType or EventType contains
        ''Policy

        Violation''. Use this rule to identify policy enforcement events that may indicate unauthorized discovery or prohibited
        network

        activity. This rule expects ClarotyEvent data to be available in the workspace.'''
      severity: high
      entityMappings:
        ips:
