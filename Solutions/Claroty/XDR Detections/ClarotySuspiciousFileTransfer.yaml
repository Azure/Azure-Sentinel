properties:
  id: xdr-5cf35bad-677f-4c23-8927-1611e7ff6f28
  displayName: Claroty - Suspicious file transfer
  status: disabled
  queryCondition:
    queryText: 'ClarotyEvent

      | where EventOriginalType has ''Suspicious File Transfer'' or EventType has ''Suspicious File Transfer''

      | project TimeGenerated, DstIpAddr, EventOriginalType, EventType

      | extend IPCustomEntity = DstIpAddr

      | project TimeGenerated, DstIpAddr, EventOriginalType, EventType, IPCustomEntity'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Claroty - Suspicious file transfer
      description: Detects Claroty events where EventOriginalType or EventType contains Suspicious File Transfer and maps
        the destination IP as the primary entity for triage.
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1018
      - tactic: Exfiltration
        techniques:
        - technique: T1020
      customDetails:
        EventOriginalType: EventOriginalType
        EventType: EventType
