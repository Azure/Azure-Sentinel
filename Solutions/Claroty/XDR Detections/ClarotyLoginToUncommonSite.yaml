properties:
  id: xdr-e7dbcbc3-b18f-4635-b27c-718195c369f1
  displayName: Claroty - Login to uncommon location
  status: disabled
  queryCondition:
    queryText: 'let usr_sites = ClarotyEvent

      | where TimeGenerated between (ago(14d) .. ago(1h))

      | where EventType has ''Login to SRA succeeded''

      | extend Site = column_ifexists("site_name","")

      | where isnotempty(Site)

      | extend SrcUsername = extract(@''User\s(.*?)\slogged'', 1, EventMessage)

      | where isnotempty(SrcUsername)

      | summarize all_loc = make_set(tostring(Site)) by SrcUsername;

      ClarotyEvent

      | where TimeGenerated > ago(1h)

      | where EventType has ''Login to SRA succeeded''

      | extend Site = column_ifexists("site_name","")

      | where isnotempty(Site)

      | extend SrcUsername = extract(@''User\s(.*?)\slogged'', 1, EventMessage)

      | where isnotempty(SrcUsername)

      | join kind=leftouter (usr_sites) on SrcUsername

      | where isempty(all_loc) or not(set_has_element(all_loc, tostring(Site)))

      | summarize StartTime=min(TimeGenerated), EndTime=max(TimeGenerated), EventCount=count(), Sites=make_set(Site, 100),
      KnownSites=any(all_loc) by SrcUsername, SrcIpAddr, Site, EventType, EventMessage

      | extend UncommonSiteCount = array_length(Sites)

      | project StartTime, EndTime, SrcUsername, SrcIpAddr, Site, EventType, EventMessage, EventCount, UncommonSiteCount,
      KnownSites'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Claroty - Login to uncommon location
      description: Detects user login to uncommon location.
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
