properties:
  id: xdr-4b5bb3fc-c690-4f54-9a74-016213d699b4
  displayName: Claroty - Multiple failed logins by user
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5;

      ClarotyEvent

      | where EventType has ''Login to SRA''

      | where EventType !has ''succeeded''

      | extend SrcUsername = trim('' '', tostring(extract(@''User\s(.*?)\sfailed'', 1, EventMessage)))

      | where isnotempty(SrcUsername)

      | summarize FailedLogins = count() by SrcUsername, bin(TimeGenerated, 5m)

      | where FailedLogins > threshold

      | extend AccountCustomEntity = SrcUsername'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Claroty - Multiple failed logins by user
      description: Detects multiple failed logins by the same user in Claroty SRA event logs. The rule looks for failed Login
        to SRA events, extracts the source username from the event message, and alerts when a user exceeds 5 failed logins
        within 5 minutes.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
      customDetails:
        AccountName: AccountCustomEntity
