properties:
  id: xdr-1c2310ef-19bf-4caf-b2b0-a4c983932fa5
  displayName: Claroty - Multiple failed logins to same destinations
  status: disabled
  queryCondition:
    queryText: "let threshold = 10;\n  ClarotyEvent\n  | where EventType has 'Login to SRA'\n  | where EventType !has 'succeeded'\n\
      \  | extend Site = column_ifexists(\"site_name\",\"\")\n  | where isnotempty(Site)\n  | extend SrcUsername = extract(@'User\\\
      s(.*?)\\sfailed', 1, EventMessage)\n  | summarize FailedLogins = count(), SampleUser = any(SrcUsername), DstIpAddr =\
      \ any(DstIpAddr) by Site, bin(TimeGenerated, 5m)\n  | where FailedLogins > threshold\n  | extend SGCustomEntity = Site\n\
      \  | project TimeGenerated, Site, FailedLogins, Threshold = threshold, SampleUser, SGCustomEntity, DstIpAddr"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Claroty - Multiple failed logins to same destinations
      description: Detects multiple failed login attempts to the same Claroty SRA destination site within a 5-minute window.
        The rule counts failed logins per site and alerts when the number of failures exceeds the threshold value of 10.
      severity: high
      entityMappings:
        securityGroups:
        - id: securityGroup1
          distinguishedNameColumn: SGCustomEntity
        ips:
        - id: ip1
          addressColumn: DstIpAddr
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
