properties:
  id: xdr-ff1bec81-e241-44bf-98ed-c6e37805a2e3
  displayName: PROD (TM018.1) - DOMAIN - Child Domain promoted within the Forest
  status: disabled
  queryCondition:
    queryText: |-
      SecurityEvent
      | where EventID == 5137 and EventData has '"ObjectClass">crossRef' and EventData has 'CN=Partitions,CN=Configuration'
      | extend ObjectName = extract("(?i)CN=([^,]+),(?i)CN=Partitions,(?i)CN=Configuration", 1, EventData)
      | extend ActivityType = extract("([a-zA-Z]+)\\.$", 1, Activity)
      | extend Domain = extract("([^.]+\\.[^.]+)$", 1, Computer)
      | project TimeGenerated
              , ObjectName
              , ActivityType
              , Account
              , Domain
              , Computer
              , Channel
              , EventID
              , EventData
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: PROD (TM018.1) - DOMAIN - Child Domain promoted within the Forest
      description: New child domain has been promoted within the Forest and should have the Tier Model deployed.
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: Computer
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1484
          subTechniques:
          - T1484.002
      customDetails:
        ObjectName: ObjectName
        ActivityType: ActivityType
        Account: Account
        Domain: Domain
        Computer: Computer
        Channel: Channel
        EventID: EventID
        EventData: EventData
