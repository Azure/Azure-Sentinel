properties:
  id: xdr-891315d2-e080-4ac8-af5a-50bae17f2d4d
  displayName: PROD (TM019.1) - TRUST - A new AD Trust has been established
  status: disabled
  queryCondition:
    queryText: |-
      SecurityEvent
      | where EventID == 5137 and EventData has '"ObjectClass">trustedDomain' and EventData has 'CN=System'
      | extend ObjectName = extract("(?i)CN=([^,]+),(?i)CN=System", 1, EventData)
      | extend ActivityType = extract("([a-zA-Z]+)\\.$", 1, Activity)
      | extend Domain = extract("([^.]+\\.[^.]+)$", 1, Computer)
      | project TimeGenerated
              , ObjectName
              , ActivityType
              , Account
              , Domain
              , Computer
              , Channel
              , EventID
              , EventData
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: PROD (TM019.1) - TRUST - A new AD Trust has been established
      description: A new Trust has been established with the Forest or Domains. The other forest should have a Tier Model
        deployed.
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: Computer
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1484
          subTechniques:
          - T1484.002
      customDetails:
        ObjectName: ObjectName
        ActivityType: ActivityType
        Account: Account
        Domain: Domain
        Computer: Computer
        Channel: Channel
        EventID: EventID
        EventData: EventData
