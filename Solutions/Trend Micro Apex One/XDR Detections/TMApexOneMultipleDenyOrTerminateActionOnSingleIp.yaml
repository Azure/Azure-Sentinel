properties:
  id: xdr-cd94e078-67b7-11ec-90d6-0242ac120003
  displayName: ApexOne - Multiple deny or terminate actions on single IP
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 5;
      TMApexOneEvent
      | where EventMessage has "Behavior Monitoring"
      | where DvcAction == 2 or DvcAction == 3
      | summarize count() by SrcIpAddr, bin(TimeGenerated, 10m)
      | where count_ > threshold
      | extend IPCustomEntity = SrcIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: ApexOne - Multiple deny or terminate actions on single IP
      description: '''Detects multiple deny or terminate actions on single IP.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
