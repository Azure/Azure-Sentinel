properties:
  id: xdr-b463b952-67b8-11ec-90d6-0242ac120003
  displayName: ApexOne - Device access permissions was changed
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 1;
      TMApexOneEvent
      | where EventMessage has "Device access"
      | extend DeviceCustomNumber3 = coalesce(
                                        column_ifexists("FieldDeviceCustomNumber3", long(null)),
                                        DeviceCustomNumber3,
                                        long(null)
                                    )
      | extend Permission = case(
                                  DeviceCustomNumber3 == "0", "Modify",
                                  DeviceCustomNumber3 == "1", "Read and execute",
                                  DeviceCustomNumber3 == "2", "Read",
                                  DeviceCustomNumber3 == "3", "List device content only",
                                  DeviceCustomNumber3 == "4", "Block",
                                  "unknown"
                            )
      | summarize Permissions = make_set(Permission), TimeGenerated = max(TimeGenerated), SrcIpAddr = take_any(SrcIpAddr), DstDvcHostname = take_any(DstDvcHostname) by DstUserName
      | extend PermissionCount = array_length(Permissions)
      | where PermissionCount > threshold
      | extend AccountCustomEntity = DstUserName, IPCustomEntity = SrcIpAddr, HostCustomEntity = DstDvcHostname
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: ApexOne - Device access permissions was changed
      description: '''Query shows device access permissions was changed.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
