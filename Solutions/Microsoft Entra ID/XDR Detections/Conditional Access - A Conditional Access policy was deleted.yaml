properties:
  id: xdr-2e96fa64-ac4d-4c92-b79e-e9c54b5d8230
  displayName: Conditional Access - A Conditional Access policy was deleted
  status: disabled
  queryCondition:
    queryText: |-
      // A Conditional Access policy was deleted.
      AuditLogs
      | where OperationName in ("Delete conditional access policy")
      | extend modifiedBy = tostring(InitiatedBy.user.userPrincipalName)
      | extend accountName = tostring(split(modifiedBy, "@")[0])
      | extend upnSuffix = tostring(split(modifiedBy, "@")[1])
      | project
          TimeGenerated,
          OperationName,
          policy = TargetResources[0].displayName,
          modifiedBy,
          accountName,
          upnSuffix,
          result = Result,
          oldPolicy = TargetResources[0].modifiedProperties[0].oldValue
      | order by TimeGenerated desc
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Conditional Access - A Conditional Access policy was deleted
      description: A Conditional Access policy was deleted from Entra ID.
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: accountName
          upnSuffixColumn: upnSuffix
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.007
