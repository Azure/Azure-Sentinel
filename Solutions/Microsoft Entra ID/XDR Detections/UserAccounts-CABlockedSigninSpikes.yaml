properties:
  id: xdr-3a9d5ede-2b9d-43a2-acc4-d272321ff77c
  displayName: User Accounts - Sign in Failure due to CA Spikes
  status: disabled
  queryCondition:
    queryText: "let BehaviorAnalytics = BehaviorInfo\n| extend UserPrincipalName =\
      \ AccountUpn, UserName = tostring(split(AccountUpn, \"@\")[0]), UsersInsights\
      \ = parse_json(\"{}\"), DevicesInsights = parse_json(\"{}\"), ActivityInsights\
      \ = parse_json(\"{}\"), InvestigationPriority = int(0), SourceIPAddress = \"\
      \", EventSource = ServiceSource, ActivityType = Categories, SourceDevice = \"\
      \";\nlet riskScoreCutoff = 20; //Adjust this based on volume of results\nlet\
      \ starttime = 14d;\nlet timeframe = 1d;\nlet scorethreshold = 3;\nlet baselinethreshold\
      \ = 50;\nlet aadFunc = (tableName:string){\n  // Failed Signins attempts with\
      \ reasoning related to conditional access policies.\n  table(tableName)\n  |\
      \ where TimeGenerated between (startofday(ago(starttime))..startofday(now()))\n\
      \  | where ResultDescription has_any (\"conditional access\", \"CA\") or ResultType\
      \ in (50005, 50131, 53000, 53001, 53002, 52003, 70044)\n  | extend UserPrincipalName\
      \ = tolower(UserPrincipalName)\n  | extend timestamp = TimeGenerated, AccountCustomEntity\
      \ = UserPrincipalName\n};\nlet aadSignin = aadFunc(\"SigninLogs\");\nlet aadNonInt\
      \ = aadFunc(\"AADNonInteractiveUserSignInLogs\");\nlet allSignins = union isfuzzy=true\
      \ aadSignin, aadNonInt;\nlet TimeSeriesAlerts =\nallSignins\n| make-series DailyCount=count()\
      \ on TimeGenerated from startofday(ago(starttime)) to startofday(now()) step\
      \ 1d by UserPrincipalName\n| extend (anomalies, score, baseline) = series_decompose_anomalies(DailyCount,\
      \ scorethreshold, -1, 'linefit')\n| mv-expand DailyCount to typeof(double),\
      \ TimeGenerated to typeof(datetime), anomalies to typeof(double), score to typeof(double),\
      \ baseline to typeof(long)\n// Filtering low count events per baselinethreshold\n\
      | where anomalies > 0 and baseline > baselinethreshold\n| extend AnomalyHour\
      \ = TimeGenerated\n| project UserPrincipalName, AnomalyHour, TimeGenerated,\
      \ DailyCount, baseline, anomalies, score;\n// Filter the alerts for specified\
      \ timeframe\nTimeSeriesAlerts\n| where TimeGenerated > startofday(ago(timeframe))\n\
      | join kind=inner (\n  allSignins\n  | where TimeGenerated > startofday(ago(timeframe))\n\
      \  // create a new column and round to hour\n  | extend DateHour = bin(TimeGenerated,\
      \ 1h)\n  | summarize PartialFailedSignins = count(), LatestAnomalyTime = arg_max(TimeGenerated,\
      \ *) by bin(TimeGenerated, 1h), OperationName, Category, ResultType, ResultDescription,\
      \ UserPrincipalName, UserDisplayName, AppDisplayName, ClientAppUsed, IPAddress,\
      \ ResourceDisplayName\n) on UserPrincipalName, $left.AnomalyHour == $right.DateHour\n\
      | project LatestAnomalyTime, OperationName, Category, UserPrincipalName, UserDisplayName,\
      \ ResultType, ResultDescription, AppDisplayName, ClientAppUsed, UserAgent, IPAddress,\
      \ Location, AuthenticationRequirement, ConditionalAccessStatus, ResourceDisplayName,\
      \ PartialFailedSignins, TotalFailedSignins = DailyCount, baseline, anomalies,\
      \ score\n| extend timestamp = LatestAnomalyTime, Name = tostring(split(UserPrincipalName,'@',0)[0]),\
      \ UPNSuffix = tostring(split(UserPrincipalName,'@',1)[0])\n| extend UserPrincipalName\
      \ = tolower(UserPrincipalName)\n| join kind=leftouter (\n    IdentityInfo\n\
      \    | summarize LatestReportTime = arg_max(TimeGenerated, *) by AccountUpn\n\
      \    | project AccountUpn, Tags, JobTitle, GroupMembership, AssignedRoles, Type,\
      \ IsAccountEnabled\n    | summarize\n        Tags = make_set(Tags, 1000),\n\
      \        GroupMembership = make_set(GroupMembership, 1000),\n        AssignedRoles\
      \ = make_set(AssignedRoles, 1000),\n        Type = make_set(Type, 1000),\n \
      \       UserAccountControl = make_set(Type, 1000)\n    by AccountUpn\n    |\
      \ extend UserPrincipalName=tolower(AccountUpn)\n) on UserPrincipalName\n| join\
      \ kind=leftouter (\n    BehaviorAnalytics\n    | where ActivityType in (\"FailedLogOn\"\
      , \"LogOn\")\n    | where isnotempty(SourceIPAddress)\n    | project UsersInsights,\
      \ DevicesInsights, ActivityInsights, InvestigationPriority, SourceIPAddress\n\
      \    | project-rename IPAddress = SourceIPAddress\n    | summarize\n       \
      \ UsersInsights = make_set(UsersInsights, 1000),\n        DevicesInsights =\
      \ make_set(DevicesInsights, 1000),\n        IPInvestigationPriority = sum(InvestigationPriority)\n\
      \    by IPAddress)\non IPAddress\n| extend UEBARiskScore = IPInvestigationPriority\n\
      | where UEBARiskScore > riskScoreCutoff\n| sort by UEBARiskScore desc"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: User Accounts - Sign in Failure due to CA Spikes
      description: ''' Identifies spike in failed sign-ins from user accounts due
        to conditional access policied.

        Spike is determined based on Time series anomaly which will look at historical
        baseline values.

        Ref : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-user-accounts#monitoring-for-failed-unusual-sign-ins

        This query has also been updated to include UEBA logs IdentityInfo and BehaviorAnalytics
        for contextual information around the results.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
