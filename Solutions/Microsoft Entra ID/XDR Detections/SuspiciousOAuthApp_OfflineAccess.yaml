properties:
  id: xdr-3533f74c-9207-4047-96e2-0eb9383be587
  displayName: Suspicious application consent for offline access
  status: disabled
  queryCondition:
    queryText: "let detectionTime = 1d;\nlet joinLookback = 14d;\nAuditLogs\n| where\
      \ TimeGenerated > ago(detectionTime)\n| where LoggedByService =~ \"Core Directory\"\
      \n| where Category =~ \"ApplicationManagement\"\n| where OperationName =~ \"\
      Consent to application\"\n| where TargetResources has \"offline\"\n| mv-apply\
      \ TargetResource=TargetResources on\n  (\n      where TargetResource.type =~\
      \ \"ServicePrincipal\"\n      | extend ModifiedProperties = TargetResource.modifiedProperties,\n\
      \               AppDisplayName = tostring(TargetResource.displayName),\n   \
      \            AppClientId = tolower(tostring(TargetResource.id))\n  )\n| where\
      \ AppClientId !in ((externaldata(knownAppClientId:string, knownAppDisplayName:string)[@\"\
      https://raw.githubusercontent.com/Azure/Azure-Sentinel/master/Sample%20Data/Feeds/Microsoft.OAuth.KnownApplications.csv\"\
      ] with (format=\"csv\")))\n| mv-apply Properties=ModifiedProperties on\n  (\n\
      \      where Properties.displayName =~ \"ConsentAction.Permissions\"\n     \
      \ | extend ConsentFull = tostring(Properties.newValue)\n      | extend ConsentFull\
      \ = trim(@'\"',tostring(ConsentFull))\n  )\n| parse ConsentFull with * \"ConsentType:\
      \ \" GrantConsentType \", Scope: \" GrantScope1 \",\" *\n| where GrantScope1\
      \ has \"offline_access\" and GrantScope1 has_any (\n    \"ChannelMessage.Read\"\
      , \"ChannelMessage.ReadWrite\",\n    \"Chat.Read\", \"Chat.ReadWrite\", \"Chat.ReadWrite.All\"\
      ,\n    \"EAS.AccessAsUser.All\",\n    \"EWS.AccessAsUser.All\",\n    \"Files.Read\"\
      , \"Files.ReadWrite\", \"Files.ReadWrite.All\",\n    \"Group.Read\", \"Group.ReadWrite.All\"\
      ,\n    \"Mail.Read\", \"Mail.ReadWrite\", \"Mail.ReadWrite.Shared\",\n    \"\
      Notes.Read\", \"Notes.ReadWrite\", \"Notes.ReadWrite.All\",\n    \"TeamsActivity.Read\"\
      )\n| where GrantConsentType != \"AllPrincipals\" // NOTE: we are ignoring if\
      \ OAuth application was granted to all users via an admin - but admin due diligence\
      \ should be audited occasionally\n| extend GrantInitiatedByAppName = tostring(InitiatedBy.app.displayName)\n\
      | extend GrantInitiatedByAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n\
      | extend GrantInitiatedByUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n\
      | extend GrantInitiatedByAadUserId = tostring(InitiatedBy.user.id)\n| extend\
      \ GrantIpAddress = iff(isnotempty(InitiatedBy.user.ipAddress), tostring(InitiatedBy.user.ipAddress),\
      \ tostring(InitiatedBy.app.ipAddress))\n| extend GrantInitiatedBy = iff(isnotempty(GrantInitiatedByUserPrincipalName),\
      \ GrantInitiatedByUserPrincipalName, GrantInitiatedByAppName)\n| extend GrantUserAgent\
      \ = tostring(iff(AdditionalDetails[0].key =~ \"User-Agent\", AdditionalDetails[0].value,\
      \ \"\"))\n| project TimeGenerated, GrantConsentType, GrantScope1, GrantInitiatedBy,\
      \ AppDisplayName, GrantInitiatedByUserPrincipalName, GrantInitiatedByAadUserId,\
      \ GrantInitiatedByAppName, GrantInitiatedByAppServicePrincipalId, GrantIpAddress,\
      \ GrantUserAgent, AppClientId, OperationName, ConsentFull, CorrelationId\n|\
      \ join kind = leftouter (AuditLogs\n| where TimeGenerated > ago(joinLookback)\n\
      | where LoggedByService =~ \"Core Directory\"\n| where Category =~ \"ApplicationManagement\"\
      \n| where OperationName =~ \"Add service principal\"\n| mv-apply TargetResource=TargetResources\
      \ on\n  (\n      where TargetResource.type =~ \"ServicePrincipal\"\n      |\
      \ extend ModifiedProperties = TargetResource.modifiedProperties,\n         \
      \      AppClientId = tolower(TargetResource.id)\n  )\n| mv-apply ModifiedProperties=TargetResource.modifiedProperties\
      \ on\n   (\n      where ModifiedProperties.displayName =~ \"AppAddress\" and\
      \ ModifiedProperties.newValue has \"AddressType\"\n      | extend AppReplyURLs\
      \ = ModifiedProperties.newValue\n   )\n | distinct AppClientId, tostring(AppReplyURLs)\n\
      )\non AppClientId\n| join kind = innerunique (AuditLogs\n| where TimeGenerated\
      \ > ago(joinLookback)\n| where LoggedByService =~ \"Core Directory\"\n| where\
      \ Category =~ \"ApplicationManagement\"\n| where OperationName =~ \"Add OAuth2PermissionGrant\"\
      \ or OperationName =~ \"Add delegated permission grant\"\n | mv-apply TargetResource=TargetResources\
      \ on\n  (\n      where TargetResource.type =~ \"ServicePrincipal\" and array_length(TargetResource.modifiedProperties)\
      \ > 0 and isnotnull(TargetResource.displayName)\n      | extend GrantAuthentication\
      \ = tostring(TargetResource.displayName)\n  )\n| extend GrantOperation = OperationName\n\
      | project GrantAuthentication, GrantOperation, CorrelationId\n) on CorrelationId\n\
      | project TimeGenerated, GrantConsentType, GrantScope1, GrantInitiatedBy, AppDisplayName,\
      \ AppReplyURLs, GrantInitiatedByUserPrincipalName, GrantInitiatedByAadUserId,\
      \ GrantInitiatedByAppName, GrantInitiatedByAppServicePrincipalId, GrantIpAddress,\
      \ GrantUserAgent, AppClientId, GrantAuthentication, OperationName, GrantOperation,\
      \ CorrelationId, ConsentFull\n| extend Name = tostring(split(GrantInitiatedByUserPrincipalName,'@',0)[0]),\
      \ UPNSuffix = tostring(split(GrantInitiatedByUserPrincipalName,'@',1)[0])"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Suspicious application consent for offline access
      description: '''This will alert when a user consents to provide a previously-unknown
        Azure application with offline access via OAuth.

        Offline access will provide the Azure App with access to the listed resources
        without requiring two-factor authentication.

        Consent to applications with offline access and read capabilities should be
        rare, especially as the knownApplications list is expanded. Public contributions
        to expand this filter are welcome!

        For further information on AuditLogs please see https://docs.microsoft.com/azure/active-directory/reports-monitoring/reference-audit-activities.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        - id: account2
          aadUserIdColumn: GrantInitiatedByAadUserId
        - id: account3
          aadUserIdColumn: GrantInitiatedByAppServicePrincipalId
        ips:
        - id: ip1
          addressColumn: GrantIpAddress
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1528
      customDetails:
        AccountFullName: GrantInitiatedByUserPrincipalName
