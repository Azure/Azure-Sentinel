properties:
  id: xdr-6d63efa6-7c25-4bd4-a486-aa6bf50fde8a
  displayName: Account created or deleted by non-approved user
  status: disabled
  queryCondition:
    queryText: |-
      // Add non-approved user principal names or apps to the list below to search for their account creation/deletion activity
      // ex: dynamic(["UPN1", "upn123"])
      let nonapproved_users = dynamic([]);
      let nonapproved_apps = dynamic([]);
      AuditLogs
      | where OperationName =~ "Add user" or OperationName =~ "Delete user"
      | where Result =~ "success"
      | extend InitiatingAppName = tostring(InitiatedBy.app.displayName)
      | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)
      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)
      | extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))
      | where InitiatingUserPrincipalName has_any (nonapproved_users) or InitiatingAppName has_any (nonapproved_apps)
      | extend InitiatingAccountName = tostring(split(InitiatingUserPrincipalName, "@")[0]), InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName, "@")[1])
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Account created or deleted by non-approved user
      description: |-
        'Identifies accounts that were created or deleted by a defined list of non-approved user principal names. Add to this list before running the query for accurate results.
        Ref : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-user-accounts'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: InitiatingAppName
          aadUserIdColumn: InitiatingAppServicePrincipalId
        - id: account2
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      customDetails:
        AccountFullName: InitiatingUserPrincipalName
