properties:
  id: xdr-0459a1b5-909d-4783-9e27-24536b05a47f
  displayName: Conditional Access - A new Conditional Access policy was created
  status: disabled
  queryCondition:
    queryText: |-
      // A new Conditional Access policy was created.
      AuditLogs
      | where OperationName in ("Add conditional access policy")
      | extend modifiedBy = tostring(InitiatedBy.user.userPrincipalName)
      | extend accountName = tostring(split(modifiedBy, "@")[0])
      | extend upnSuffix = tostring(split(modifiedBy, "@")[1])
      | project
          TimeGenerated,
          OperationName,
          policy = TargetResources[0].displayName,
          modifiedBy,
          accountName,
          upnSuffix,
          result = Result,
          newPolicy = TargetResources[0].modifiedProperties[0].newValue
      | order by TimeGenerated desc
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Conditional Access - A new Conditional Access policy was created
      description: A new Conditional Access policy was created in Entra ID.
      severity: informational
      entityMappings:
        accounts:
        - id: account1
          nameColumn: accountName
          upnSuffixColumn: upnSuffix
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.007
