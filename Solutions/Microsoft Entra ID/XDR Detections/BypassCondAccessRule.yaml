properties:
  id: xdr-3af9285d-bb98-4a35-ad29-5ea39ba0c628
  displayName: Attempt to bypass conditional access rule in Microsoft Entra ID
  status: disabled
  queryCondition:
    queryText: "let threshold = 1; // Modify this threshold value to reduce false\
      \ positives based on your environment\nlet aadFunc = (tableName:string){\ntable(tableName)\n\
      | where ConditionalAccessStatus == 1 or ConditionalAccessStatus =~ \"failure\"\
      \n| mv-apply CAP = parse_json(ConditionalAccessPolicies) on (\n  project ConditionalAccessPoliciesName\
      \ = CAP.displayName, result = CAP.result\n  | where result =~ \"failure\"\n\
      )\n| extend DeviceDetail = todynamic(DeviceDetail), Status = todynamic(Status),\
      \ LocationDetails = todynamic(LocationDetails)\n| extend OS = DeviceDetail.operatingSystem,\
      \ Browser = DeviceDetail.browser\n| extend State = tostring(LocationDetails.state),\
      \ City = tostring(LocationDetails.city), Region = tostring(LocationDetails.countryOrRegion)\n\
      | extend StatusCode = tostring(Status.errorCode), StatusDetails = tostring(Status.additionalDetails)\n\
      // Filter out status codes using watchlist\n// uncomment the following line\
      \ to enable watchlist filtering\n// | join kind=leftanti (_GetWatchlist(\"ConditionalAccessBenignStatusCodes\"\
      ) | project StatusCode) on StatusCode\n| extend Status = strcat(StatusCode,\
      \ \": \", ResultDescription)\n| summarize StartTime = min(TimeGenerated), EndTime\
      \ = max(TimeGenerated), Status = make_list(Status,10), StatusDetails = make_list(StatusDetails,50),\
      \ IPAddresses = make_list(IPAddress,100), IPAddressCount = dcount(IPAddress),\
      \ CorrelationIds = make_list(CorrelationId,100), ConditionalAccessPoliciesName\
      \ = make_list(ConditionalAccessPoliciesName,100)\nby UserPrincipalName, UserId,\
      \ AppDisplayName, tostring(Browser), tostring(OS), City, State, Region, Type\n\
      | where IPAddressCount > threshold and StatusDetails !has \"MFA successfully\
      \ completed\"\n| mv-expand IPAddresses, Status, StatusDetails, CorrelationIds\n\
      | extend Status = strcat(Status, \" \", StatusDetails)\n| summarize IPAddresses\
      \ = make_set(IPAddresses,100), Status = make_set(Status,10), CorrelationIds\
      \ = make_set(CorrelationIds,100), ConditionalAccessPoliciesName = make_set(ConditionalAccessPoliciesName,100)\n\
      by StartTime, EndTime, UserPrincipalName, UserId, AppDisplayName, tostring(Browser),\
      \ tostring(OS), City, State, Region, IPAddressCount, Type\n| extend IPAddressFirst\
      \ = tostring(IPAddresses[0]), Name = tostring(split(UserPrincipalName, \"@\"\
      )[0]), UPNSuffix = tostring(split(UserPrincipalName, \"@\")[1])\n};\nlet aadSignin\
      \ = aadFunc(\"SigninLogs\");\nlet aadNonInt = aadFunc(\"AADNonInteractiveUserSignInLogs\"\
      );\nunion isfuzzy=true aadSignin, aadNonInt"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Attempt to bypass conditional access rule in Microsoft Entra ID
      description: '''Identifies an attempt to Bypass conditional access rule(s) in
        Microsoft Entra ID.

        The ConditionalAccessStatus column value details if there was an attempt to
        bypass Conditional Access or if the Conditional access rule was not satisfied
        (ConditionalAccessStatus == 1).

        References:

        https://docs.microsoft.com/azure/active-directory/conditional-access/overview

        https://docs.microsoft.com/azure/active-directory/reports-monitoring/concept-sign-ins

        https://docs.microsoft.com/azure/active-directory/reports-monitoring/reference-sign-ins-error-codes

        ConditionalAccessStatus == 0 // Success

        ConditionalAcce'
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        - id: account2
          aadUserIdColumn: UserId
        ips:
        - id: ip1
          addressColumn: IPAddressFirst
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      - tactic: Persistence
        techniques:
        - technique: T1078
        - technique: T1098
      customDetails:
        AccountFullName: UserPrincipalName
