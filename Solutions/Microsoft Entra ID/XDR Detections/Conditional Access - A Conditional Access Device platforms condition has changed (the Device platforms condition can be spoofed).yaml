properties:
  id: xdr-e3368079-a2c0-4f1c-9fb7-287e907393ef
  displayName: 'Conditional Access - A Conditional Access Device platforms condition has changed (the Device platforms condition
    can be '
  status: disabled
  queryCondition:
    queryText: |-
      // A Conditional Access Device platforms condition has changed (the Device platforms condition can be spoofed).
      AuditLogs
      | where OperationName in ("Update conditional access policy")
      | extend excludePlatformsOld = extractjson("$.conditions.platforms.excludePlatforms", tostring(TargetResources[0].modifiedProperties[0].oldValue))
      | extend excludePlatformsNew = extractjson("$.conditions.platforms.excludePlatforms", tostring(TargetResources[0].modifiedProperties[0].newValue))
      | where excludePlatformsOld != excludePlatformsNew
      | extend modifiedBy = tostring(InitiatedBy.user.userPrincipalName)
      | extend accountName = tostring(split(modifiedBy, "@")[0])
      | extend upnSuffix = tostring(split(modifiedBy, "@")[1])
      | project
          TimeGenerated,
          OperationName,
          policy = TargetResources[0].displayName,
          modifiedBy,
          accountName,
          upnSuffix,
          result = Result,
          excludePlatformsOld,
          excludePlatformsNew
      | order by TimeGenerated desc
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: 'Conditional Access - A Conditional Access Device platforms condition has changed (the Device platforms condition
        can be '
      description: A Conditional Access Device platforms condition has changed (the Device platforms condition can be spoofed)
        in Entra ID.
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: accountName
          upnSuffixColumn: upnSuffix
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
