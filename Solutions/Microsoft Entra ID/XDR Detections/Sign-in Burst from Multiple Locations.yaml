properties:
  id: xdr-d3980830-dd9d-40a5-911f-76b44dfdce16
  displayName: GitHub Signin Burst from Multiple Locations
  status: disabled
  queryCondition:
    queryText: 'let locationThreshold = 1;

      let aadFunc = (tableName:string){

      table(tableName)

      | where AppDisplayName =~ "GitHub.com"

      | where ResultType == 0

      | summarize CountOfLocations = dcount(Location), Locations = make_set(Location,100),
      BurstStartTime = min(TimeGenerated), BurstEndTime = max(TimeGenerated) by UserPrincipalName,
      Type

      | where CountOfLocations > locationThreshold

      | extend timestamp = BurstStartTime

      };

      let aadSignin = aadFunc("SigninLogs");

      let aadNonInt = aadFunc("AADNonInteractiveUserSignInLogs");

      union isfuzzy=true aadSignin, aadNonInt

      | extend Name = tostring(split(UserPrincipalName,''@'',0)[0]), UPNSuffix = tostring(split(UserPrincipalName,''@'',1)[0])'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GitHub Signin Burst from Multiple Locations
      description: "'This detection triggers when there is a Signin burst from multiple\
        \ locations in GitHub (Entra ID SSO).\n This detection is based on configurable\
        \ threshold which can be prone to false positives. To view the anomaly based\
        \ equivalent of thie detection, please see here https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Microsoft%20Entra%20ID/Analytic%20Rules/AnomalousUserAppSigninLocationIncrease-detection.yaml.\
        \ '"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountFullName: UserPrincipalName
