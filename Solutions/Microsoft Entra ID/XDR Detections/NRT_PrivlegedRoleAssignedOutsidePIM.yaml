properties:
  id: xdr-14f6da04-2f96-44ee-9210-9ccc1be6401e
  displayName: NRT Privileged Role Assigned Outside PIM
  status: disabled
  queryCondition:
    queryText: "AuditLogs\n| where Category =~ \"RoleManagement\"\n| where OperationName has \"Add member\
      \ to role outside of PIM\"\n        or (LoggedByService =~ \"Core Directory\" and OperationName\
      \ =~ \"Add member to role\" and Identity != \"MS-PIM\" and Identity != \"MS-PIM-Fairfax\")\n| mv-apply\
      \ TargetResource = TargetResources on\n  (\n      where TargetResource.type =~ \"User\"\n      |\
      \ extend TargetUserPrincipalName = tostring(TargetResource.userPrincipalName)\n  )\n| extend InitiatingAppName\
      \ = tostring(InitiatedBy.app.displayName)\n| extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n\
      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n| extend InitiatingAadUserId\
      \ = tostring(InitiatedBy.user.id)\n| extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress),\
      \ InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))\n| extend TargetName = tostring(split(TargetUserPrincipalName,'@',0)[0]),\
      \ TargetUPNSuffix = tostring(split(TargetUserPrincipalName,'@',1)[0])\n| extend InitiatedByName\
      \ = tostring(split(InitiatingUserPrincipalName,'@',0)[0]), InitiatedByUPNSuffix = tostring(split(InitiatingUserPrincipalName,'@',1)[0])"
  schedule:
    frequency: PT0S
  detectionAction:
    alertTemplate:
      title: NRT Privileged Role Assigned Outside PIM
      description: '''Identifies a privileged role being assigned to a user outside of PIM

        Ref : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-privileged-accounts#things-to-monitor-1'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: TargetName
          upnSuffixColumn: TargetUPNSuffix
        - id: account2
          nameColumn: InitiatedByName
          upnSuffixColumn: InitiatedByUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        - id: account4
          aadUserIdColumn: InitiatingAppServicePrincipalId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      customDetails:
        AccountFullName: TargetUserPrincipalName
        AccountFullName_2: InitiatingUserPrincipalName
queryText: "AuditLogs\n| where Category =~ \"RoleManagement\"\n| where OperationName has \"Add member\
  \ to role outside of PIM\"\n        or (LoggedByService =~ \"Core Directory\" and OperationName =~ \"\
  Add member to role\" and Identity != \"MS-PIM\" and Identity != \"MS-PIM-Fairfax\")\n| mv-apply TargetResource\
  \ = TargetResources on\n  (\n      where TargetResource.type =~ \"User\"\n      | extend TargetUserPrincipalName\
  \ = tostring(TargetResource.userPrincipalName)\n  )\n| extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n\
  | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n| extend InitiatingUserPrincipalName\
  \ = tostring(InitiatedBy.user.userPrincipalName)\n| extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n\
  | extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress,\
  \ InitiatedBy.app.ipAddress))\n| extend TargetName = tostring(split(TargetUserPrincipalName,'@',0)[0]),\
  \ TargetUPNSuffix = tostring(split(TargetUserPrincipalName,'@',1)[0])\n| extend InitiatedByName = tostring(split(InitiatingUserPrincipalName,'@',0)[0]),\
  \ InitiatedByUPNSuffix = tostring(split(InitiatingUserPrincipalName,'@',1)[0])"
