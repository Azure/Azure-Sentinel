properties:
  id: xdr-fb7ca1c9-e14c-40a3-856e-28f3c14ea1ba
  displayName: Password spray attack against Microsoft Entra ID Seamless SSO
  status: disabled
  queryCondition:
    queryText: "let account_threshold = 5;\nAADNonInteractiveUserSignInLogs\n//| where\
      \ ResultType == \"81016\"\n| where ResultType startswith \"81\"\n| summarize\
      \ DistinctAccounts = dcount(UserPrincipalName), DistinctAddresses = make_set(IPAddress,100)\
      \ by ResultType\n| where DistinctAccounts > account_threshold\n| mv-expand IPAddress\
      \ = DistinctAddresses\n| extend IPAddress = tostring(IPAddress)\n| join kind=leftouter\
      \ (union isfuzzy=true SigninLogs, AADNonInteractiveUserSignInLogs) on IPAddress\n\
      | summarize\n    StartTime = min(TimeGenerated),\n    EndTime = max(TimeGenerated),\n\
      \    UserPrincipalName = make_set(UserPrincipalName,100),\n    UserAgent = make_set(UserAgent,100),\n\
      \    ResultDescription = take_any(ResultDescription),\n    ResultSignature =\
      \ take_any(ResultSignature)\n    by IPAddress, Type, ResultType\n| project Type,\
      \ StartTime, EndTime, IPAddress, ResultType, ResultDescription, ResultSignature,\
      \ UserPrincipalName, UserAgent = iff(array_length(UserAgent) == 1, UserAgent[0],\
      \ UserAgent)\n| extend Name = tostring(split(UserPrincipalName[0],'@',0)[0]),\
      \ UPNSuffix = tostring(split(UserPrincipalName[0],'@',1)[0])"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Password spray attack against Microsoft Entra ID Seamless SSO
      description: '''This query detects when there is a spike in Microsoft Entra
        ID Seamless SSO errors. They may not be caused by a Password Spray attack,
        but the cause of the errors might need to be investigated.

        Microsoft Entra ID only logs the requests that matched existing accounts,
        thus there might have been unlogged requests for non-existing accounts.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountFullName: UserPrincipalName
