properties:
  id: xdr-50574fac-f8d1-4395-81c7-78a463ff0c52
  displayName: Microsoft Entra ID PowerShell accessing non-Entra ID resources
  status: disabled
  queryCondition:
    queryText: 'let aadFunc = (tableName:string){

      table(tableName)

      | where AppId =~ "1b730954-1685-4b74-9bfd-dac224a7b894" // AppDisplayName IS
      Azure Active Directory PowerShell

      | where TokenIssuerType =~ "AzureAD"

      | where ResourceIdentity !in ("00000002-0000-0000-c000-000000000000", "00000003-0000-0000-c000-000000000000")
      // ResourceDisplayName IS NOT Windows Azure Active Directory OR Microsoft Graph

      | extend Status = todynamic(Status)

      | where Status.errorCode == 0 // Success

      | project-reorder IPAddress, UserAgent, ResourceDisplayName, UserDisplayName,
      UserId, UserPrincipalName, Type

      | order by TimeGenerated desc

      | extend Name = tostring(split(UserPrincipalName,''@'',0)[0]), UPNSuffix = tostring(split(UserPrincipalName,''@'',1)[0])

      };

      let aadSignin = aadFunc("SigninLogs");

      let aadNonInt = aadFunc("AADNonInteractiveUserSignInLogs");

      union isfuzzy=true aadSignin, aadNonInt'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Microsoft Entra ID PowerShell accessing non-Entra ID resources
      description: '''This will alert when a user or application signs in using Microsoft
        Entra ID PowerShell to access non-Active Directory resources, such as the
        Azure Key Vault, which may be undesired or unauthorized behavior.

        For capabilities and expected behavior of the Microsoft Entra ID PowerShell
        module, see: https://docs.microsoft.com/powershell/module/azuread/?view=azureadps-2.0.

        For further information on Microsoft Entra ID Signin activity reports, see:
        https://docs.microsoft.com/azure/active-directory/reports-monitoring/concept-sign-ins.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        - id: account2
          aadUserIdColumn: UserId
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: UserPrincipalName
