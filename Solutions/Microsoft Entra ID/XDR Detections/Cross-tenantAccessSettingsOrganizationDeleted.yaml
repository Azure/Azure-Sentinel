    - T1136.003
    - T1087.004
    reviewScope:
      sourceDocumentSha256: 3c4ae9927dccc4755f45f34ffd67efd9309115153a534553cc7eeb57c09272d0
      targetQuerySha256: d21be6096f1e189412475d9314fdcbdb71cdace32d220f59507b46bf449d8fcb
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 2
      identifier: FullName
      sourceColumn: InitiatingUserPrincipalName
      column: InitiatingUserPrincipalName
      status: runtime-binding-pending
