properties:
  id: xdr-eb8a9c1c-f532-4630-817c-1ecd8a60ed80
  displayName: Cross-tenant Access Settings Organization Deleted
  status: disabled
  queryCondition:
    queryText: |-
      AuditLogs
      | where OperationName has "Delete partner specific cross-tenant access setting"
      | mv-apply TargetResource = TargetResources on
        (
            where TargetResource.type =~ "Policy"
            | extend Properties = TargetResource.modifiedProperties
        )
      | mv-apply Property = Properties on
        (
            where Property.displayName =~ "tenantId"
            | extend ExtTenantDeleted = trim('"',tostring(Property.oldValue))
        )
      | extend InitiatingAppName = tostring(InitiatedBy.app.displayName)
      | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)
      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)
      | extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))
      | extend InitiatingAccountName = tostring(split(InitiatingUserPrincipalName, "@")[0]), InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName, "@")[1])
  schedule:
    frequency: P2D
  detectionAction:
    alertTemplate:
      title: Cross-tenant Access Settings Organization Deleted
      description: '''Organizations are added in the Cross-tenant Access Settings to control communication inbound or outbound
        for users and applications. This detection notifies when an Organization is deleted from the Microsoft Entra ID Cross-tenant
        Access Settings.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: InitiatingAppName
          aadUserIdColumn: InitiatingAppServicePrincipalId
        - id: account2
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      - tactic: Persistence
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
        - technique: T1136
          subTechniques:
          - T1136.003
      - tactic: Discovery
        techniques:
        - technique: T1087
          subTechniques:
          - T1087.004
      customDetails:
        AccountFullName: InitiatingUserPrincipalName
