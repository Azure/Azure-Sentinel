properties:
  id: xdr-aec77100-25c5-4254-a20a-8027ed92c46c
  displayName: Suspicious Sign In Followed by MFA Modification
  status: disabled
  queryCondition:
    queryText: 'let BehaviorAnalytics = BehaviorInfo

      | extend UserPrincipalName = AccountUpn, UserName = tostring(split(AccountUpn,
      "@")[0]), UsersInsights = parse_json("{}"), DevicesInsights = parse_json("{}"),
      ActivityInsights = parse_json("{}"), InvestigationPriority = int(0), SourceIPAddress
      = "", EventSource = ServiceSource, ActivityType = Categories, SourceDevice =
      "";

      let PriorityScore = 9;

      BehaviorAnalytics

      | where ActionType == "Sign-in"

      | where InvestigationPriority > PriorityScore

      | extend UserPrincipalName = tolower(UserPrincipalName)

      | extend LogOnTime = TimeGenerated

      | join kind=inner (AuditLogs

      | where Category =~ "UserManagement"

      | where OperationName in~ ("Admin registered security info", "Admin updated
      security info", "Admin deleted security info", "User registered security info",
      "User changed default security info", "User deleted security info","User registered
      all required security info","User started security info registration")

      | extend InitiatorUPN = tolower(tostring(InitiatedBy.user.userPrincipalName))

      | extend InitiatorID = tostring(InitiatedBy.user.id)

      | extend FromIP = tostring(InitiatedBy.user.ipAddress)

      | extend TargetUPN = tolower(tostring(TargetResources[0].userPrincipalName))

      | extend TargetId = tostring(TargetResources[0].id)

      | extend MFAModTime = TimeGenerated

      | where isnotempty(InitiatorUPN)) on $left.UserPrincipalName == $right.InitiatorUPN

      | where MFAModTime between((LogOnTime-30m)..(LogOnTime+1h))

      | extend InitiatorName = tostring(split(InitiatorUPN, "@")[0]), InitiatorUPNSuffix
      = tostring(split(InitiatorUPN, "@")[1]), TargetName = tostring(split(TargetUPN,
      "@")[0]), TargetUPNSuffix = tostring(split(TargetUPN, "@")[1])'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Suspicious Sign In Followed by MFA Modification
      description: '''This query looks uses Microsoft Sentinel''s UEBA features to
        look for suspicious logons followed by modifications to MFA settings by that
        user.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: InitiatorName
          upnSuffixColumn: InitiatorUPNSuffix
        - id: account2
          aadUserIdColumn: InitiatorID
        - id: account3
          nameColumn: TargetName
          upnSuffixColumn: TargetUPNSuffix
        - id: account4
          aadUserIdColumn: TargetId
        ips:
        - id: ip1
          addressColumn: FromIP
        - id: ip2
          addressColumn: SourceIPAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      - tactic: DefenseEvasion
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
        - technique: T1556
          subTechniques:
          - T1556.006
      customDetails:
        AccountFullName: InitiatorUPN
        AccountFullName_2: TargetUPN
