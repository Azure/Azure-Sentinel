properties:
  id: xdr-8540c842-5bbc-4a24-9fb2-a836c0e55a51
  displayName: NRT Modified domain federation trust settings
  status: disabled
  queryCondition:
    queryText: "AuditLogs\n| where OperationName =~ \"Set federation settings on domain\" or OperationName\
      \ =~ \"Set domain authentication\"\n\n| mv-expand TargetResources\n| extend modifiedProperties =\
      \ parse_json(TargetResources).modifiedProperties\n| mv-apply Property = modifiedProperties on\n\
      \  (\n      where Property.displayName =~ \"LiveType\"\n      | extend targetDisplayName = tostring(Property.displayName),\n\
      \               NewDomainValue = tostring(Property.newValue)\n  )\n| extend Federated = iif(OperationName\
      \ =~ \"Set domain authentication\", iif(NewDomainValue has \"Federated\", True, False), True)\n\
      | where Federated == True\n| mv-expand AdditionalDetails\n| mv-apply AdditionalDetail = AdditionalDetails\
      \ on\n  (\n      where AdditionalDetail.key =~ \"User-Agent\"\n      | extend UserAgent = tostring(AdditionalDetail.value)\n\
      \  )\n| extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n| extend InitiatingAppServicePrincipalId\
      \ = tostring(InitiatedBy.app.servicePrincipalId)\n| extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n\
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n| extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress),\
      \ InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))\n| project-reorder TimeGenerated, OperationName,\
      \ InitiatingUserPrincipalName, InitiatingAadUserId, InitiatingAppName, InitiatingAppServicePrincipalId,\
      \ InitiatingIpAddress, AADOperationType, targetDisplayName, Result, UserAgent, CorrelationId, TenantId,\
      \ AADTenantId\n| extend Name = tostring(split(InitiatingUserPrincipalName,'@',0)[0]), UPNSuffix\
      \ = tostring(split(InitiatingUserPrincipalName,'@',1)[0])"
  schedule:
    frequency: PT0S
  detectionAction:
    alertTemplate:
      title: NRT Modified domain federation trust settings
      description: 'This will alert when a user or application modifies the federation settings on the domain or Update domain authentication from Managed to Federated. For example, this alert will trigger when a new Active Directory Federated Service (ADFS) TrustedRealm object, such as a signing certificate, is added to the domain. Modification to domain federation settings should be rare. Confirm the added or modified target domain/URL is legitimate administrator behavior.'
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        - id: account2
          aadUserIdColumn: InitiatingAadUserId
        - id: account3
          aadUserIdColumn: InitiatingAppServicePrincipalId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1555
      - tactic: Persistence
        techniques:
        - technique: T1098
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1098
      customDetails:
        AccountFullName: InitiatingUserPrincipalName
