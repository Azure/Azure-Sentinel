properties:
  id: xdr-694c91ee-d606-4ba9-928e-405a2dd0ff0f
  displayName: Authentication Methods Changed for Privileged Account
  status: disabled
  queryCondition:
    queryText: "let queryperiod = 14d;\nlet queryfrequency = 2h;\nlet security_info_actions\
      \ = dynamic([\"User registered security info\", \"User changed default security\
      \ info\", \"User deleted security info\", \"Admin updated security info\", \"\
      User reviewed security info\", \"Admin deleted security info\", \"Admin registered\
      \ security info\"]);\nlet VIPUsers = (\n    IdentityInfo\n    | where TimeGenerated\
      \ > ago(queryperiod)\n    | mv-expand AssignedRoles\n    | where AssignedRoles\
      \ contains 'Admin'\n    | summarize by AccountUpn);\nAuditLogs\n| where TimeGenerated\
      \ > ago(queryfrequency)\n| where Category =~ \"UserManagement\"\n| where ActivityDisplayName\
      \ in (security_info_actions)\n| extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n\
      | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n\
      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n\
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n| extend InitiatingIpAddress\
      \ = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress,\
      \ InitiatedBy.app.ipAddress))\n| mv-apply TargetResource = TargetResources on\n\
      \  (\n      where TargetResource.type =~ \"User\"\n      | extend TargetUserPrincipalName\
      \ = tostring(TargetResource.userPrincipalName)\n  )\n| where TargetUserPrincipalName\
      \ in~ (VIPUsers)\n// Uncomment the line below if you are experiencing high volumes\
      \ of Target entities. If this is uncommented, the Target column will not be\
      \ mapped to an entity.\n//| summarize Start=min(TimeGenerated), End=max(TimeGenerated),\
      \ Actions = make_set(ResultReason, MaxSize=8), Targets=make_set(Target, MaxSize=256)\
      \ by Initiator, IP, Result\n// Comment out this line below, if line above is\
      \ used.\n| summarize Start=min(TimeGenerated), End=max(TimeGenerated), Actions\
      \ = make_set(ResultReason, MaxSize=8) by InitiatingAppName, InitiatingAppServicePrincipalId,\n\
      InitiatingUserPrincipalName, InitiatingAadUserId, InitiatingIpAddress, TargetUserPrincipalName,\
      \ Result\n| extend InitiatingAccountName = tostring(split(InitiatingUserPrincipalName,\
      \ \"@\")[0]), InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName,\
      \ \"@\")[1]),\nTargetName = iff(tostring(TargetUserPrincipalName) has \"[\"\
      , \"\", tostring(split(TargetUserPrincipalName,'@',0)[0])), TargetUPNSuffix\
      \ = iff(tostring(TargetUserPrincipalName) has \"[\", \"\", tostring(split(TargetUserPrincipalName,'@',1)[0]))"
  schedule:
    frequency: PT2H
  detectionAction:
    alertTemplate:
      title: Authentication Methods Changed for Privileged Account
      description: '''Identifies authentication methods being changed for a privileged
        account. This could be an indication of an attacker adding an auth method
        to the account so they can have continued access.

        Ref : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-privileged-accounts#things-to-monitor-1'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: InitiatingAppName
          aadUserIdColumn: InitiatingAppServicePrincipalId
        - id: account2
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1098
      customDetails:
        AccountFullName: InitiatingUserPrincipalName
