properties:
  id: xdr-95dc4ae3-e0f2-48bd-b996-cdd22b90f9af
  displayName: Modified domain federation trust settings
  status: disabled
  queryCondition:
    queryText: "(union isfuzzy=true\n(\nAuditLogs\n| where OperationName =~ \"Set\
      \ federation settings on domain\"\n//| where Result =~ \"success\"   // commenting\
      \ out, as it may be interesting to capture failed attempts\n| mv-expand TargetResources\n\
      | extend modifiedProperties = parse_json(TargetResources).modifiedProperties\n\
      | mv-expand modifiedProperties\n| extend targetDisplayName = tostring(parse_json(modifiedProperties).displayName)\n\
      ),\n(\nAuditLogs\n| where OperationName =~ \"Set domain authentication\"\n//|\
      \ where Result =~ \"success\"   // commenting out, as it may be interesting\
      \ to capture failed attempts\n| mv-expand TargetResources\n| extend modifiedProperties\
      \ = parse_json(TargetResources).modifiedProperties\n| mv-expand modifiedProperties\n\
      | mv-apply Property = modifiedProperties on\n  (\n      where Property.displayName\
      \ =~ \"LiveType\"\n      | extend targetDisplayName = tostring(Property.displayName),\n\
      \               NewDomainValue = tostring(Property.newValue)\n  )\n| where NewDomainValue\
      \ has \"Federated\"\n)\n)\n| mv-apply AdditionalDetail = AdditionalDetails on\n\
      \  (\n      where AdditionalDetail.key =~ \"User-Agent\"\n      | extend UserAgent\
      \ = tostring(AdditionalDetail.value)\n  )\n| extend InitiatingUserOrApp = iff(isnotempty(InitiatedBy.user.userPrincipalName),tostring(InitiatedBy.user.userPrincipalName),\
      \ tostring(InitiatedBy.app.displayName))\n| extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n\
      | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n\
      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n\
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n| extend InitiatingIpAddress\
      \ = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress,\
      \ InitiatedBy.app.ipAddress))\n| extend InitiatingAccountName = tostring(split(InitiatingUserPrincipalName,\
      \ \"@\")[0]), InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName,\
      \ \"@\")[1])\n| project-reorder TimeGenerated, OperationName, InitiatingUserOrApp,\
      \ AADOperationType, targetDisplayName, Result, InitiatingIpAddress, UserAgent,\
      \ CorrelationId, TenantId, AADTenantId"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Modified domain federation trust settings
      description: 'This will alert when a user or application modifies the federation settings on the domain or Update domain authentication from Managed to Federated. For example, this alert will trigger when a new Active Directory Federated Service (ADFS) TrustedRealm object, such as a signing certificate, is added to the domain. Modification to domain federation settings should be rare. Confirm the added or modified target domain/URL is legitimate administrator behavior.'
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: InitiatingAppName
          aadUserIdColumn: InitiatingAppServicePrincipalId
        - id: account2
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1555
      - tactic: Persistence
        techniques:
        - technique: T1098
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1098
      customDetails:
        AccountFullName: InitiatingUserPrincipalName
