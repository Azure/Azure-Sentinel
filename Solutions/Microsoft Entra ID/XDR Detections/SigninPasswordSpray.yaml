properties:
  id: xdr-48607a29-a26a-4abf-8078-a06dbdd174a4
  displayName: Password spray attack against Microsoft Entra ID application
  status: disabled
  queryCondition:
    queryText: "let timeRange = 1d;\nlet lookBack = 7d;\nlet authenticationWindow\
      \ = 20m;\nlet authenticationThreshold = 5;\nlet isGUID = \"[0-9a-z]{8}-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{12}\"\
      ;\nlet failureCodes = dynamic([50053, 50126, 50055]); // invalid password, account\
      \ is locked - too many sign ins, expired password\nlet successCodes = dynamic([0,\
      \ 50055, 50057, 50155, 50105, 50133, 50005, 50076, 50079, 50173, 50158, 50072,\
      \ 50074, 53003, 53000, 53001, 50129]);\n// Lookup up resolved identities from\
      \ last 7 days\nlet aadFunc = (tableName:string){\nlet identityLookup = table(tableName)\n\
      | where TimeGenerated >= ago(lookBack)\n| where not(Identity matches regex isGUID)\n\
      | where isnotempty(UserId)\n| summarize by UserId, lu_UserDisplayName = UserDisplayName,\
      \ lu_UserPrincipalName = UserPrincipalName, Type;\n// collect window threshold\
      \ breaches\ntable(tableName)\n| where TimeGenerated > ago(timeRange)\n| where\
      \ ResultType in(failureCodes)\n| summarize FailedPrincipalCount = dcount(UserPrincipalName)\
      \ by bin(TimeGenerated, authenticationWindow), IPAddress, AppDisplayName, Type\n\
      | where FailedPrincipalCount >= authenticationThreshold\n| summarize WindowThresholdBreaches\
      \ = count() by IPAddress, Type\n| join kind= inner (\n// where we breached a\
      \ threshold, join the details back on all failure data\ntable(tableName)\n|\
      \ where TimeGenerated > ago(timeRange)\n| where ResultType in(failureCodes)\n\
      | extend LocationDetails = todynamic(LocationDetails)\n| extend FullLocation\
      \ = strcat(LocationDetails.countryOrRegion,'|', LocationDetails.state, '|',\
      \ LocationDetails.city)\n| summarize StartTime = min(TimeGenerated), EndTime\
      \ = max(TimeGenerated), make_set(ClientAppUsed,20), make_set(FullLocation,20),\
      \ FailureCount = count() by IPAddress, AppDisplayName, UserPrincipalName, UserDisplayName,\
      \ Identity, UserId, Type\n// lookup any unresolved identities\n| extend UnresolvedUserId\
      \ = iff(Identity matches regex isGUID, UserId, \"\")\n| join kind= leftouter\
      \ (\n identityLookup\n) on $left.UnresolvedUserId==$right.UserId\n| extend UserDisplayName=iff(isempty(lu_UserDisplayName),\
      \ UserDisplayName, lu_UserDisplayName)\n| extend UserPrincipalName=iff(isempty(lu_UserPrincipalName),\
      \ UserPrincipalName, lu_UserPrincipalName)\n| summarize StartTime = min(StartTime),\
      \ EndTime = max(EndTime), make_set(UserPrincipalName,20), make_set(UserDisplayName,20),\
      \ make_set(set_ClientAppUsed,20), make_set(set_FullLocation,20), make_list(FailureCount,20)\
      \ by IPAddress, AppDisplayName, Type\n| extend FailedPrincipalCount = array_length(set_UserPrincipalName)\n\
      ) on IPAddress\n| project IPAddress, StartTime, EndTime, TargetedApplication=AppDisplayName,\
      \ FailedPrincipalCount, UserPrincipalNames=set_UserPrincipalName, UserDisplayNames=set_UserDisplayName,\
      \ ClientAppsUsed=set_set_ClientAppUsed, Locations=set_set_FullLocation, FailureCountByPrincipal=list_FailureCount,\
      \ WindowThresholdBreaches, Type\n| join kind= inner (\ntable(tableName) // get\
      \ data on success vs. failure history for each IP\n| where TimeGenerated > ago(timeRange)\n\
      | where ResultType in(successCodes) or ResultType in(failureCodes) // success\
      \ or failure types\n| summarize GlobalSuccessPrincipalCount = dcountif(UserPrincipalName,\
      \ (ResultType in (successCodes))), ResultTypeSuccesses = make_set_if(ResultType,\
      \ (ResultType in (successCodes))), GlobalFailPrincipalCount = dcountif(UserPrincipalName,\
      \ (ResultType in (failureCodes))), ResultTypeFailures = make_set_if(ResultType,\
      \ (ResultType in (failureCodes))) by IPAddress, Type\n| where GlobalFailPrincipalCount\
      \ > GlobalSuccessPrincipalCount // where the number of failed principals is\
      \ greater than success - eliminates FPs from IPs who authenticate successfully\
      \ alot and as a side effect have alot of failures\n) on IPAddress\n| project-away\
      \ IPAddress1\n| extend timestamp=StartTime\n};\nlet aadSignin = aadFunc(\"SigninLogs\"\
      );\nlet aadNonInt = aadFunc(\"AADNonInteractiveUserSignInLogs\");\nunion isfuzzy=true\
      \ aadSignin, aadNonInt"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Password spray attack against Microsoft Entra ID application
      description: '''Identifies evidence of password spray activity against Microsoft
        Entra ID applications by looking for failures from multiple accounts from
        the same IP address within a time window. If the number of accounts breaches
        the threshold just once, all failures from the IP address within the time
        range are bought into the result. Details on whether there were successful
        authentications by the IP address within the time window are also included.

        This can be an indicator that an attack was successful.

        The default failure acccount threshold is 5, Default time window for failures
        is 20m and default look '
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
