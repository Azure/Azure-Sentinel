  ]);\nAuditLogs\n| where Category =~ \"RoleManagement\"\n| where OperationName in~ (OperationList)\n\
  | mv-apply TargetResource = TargetResources on\n  (\n      where TargetResource.type =~ \"User\"\n \
  \     | extend TargetUserPrincipalName = tostring(TargetResource.userPrincipalName),\n             \
  \  modProps = TargetResource.modifiedProperties\n  )\n| mv-apply Property = modProps on\n  (\n     \
  \ where Property.displayName =~ \"Role.WellKnownObjectName\"\n      | extend DisplayName = trim('\"\
  ',tostring(Property.displayName)),\n               GroupName = trim('\"',tostring(Property.newValue))\n\
  \  )\n| extend InitiatingAppId = tostring(InitiatedBy.app.appId)\n| extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n\
  | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n| extend InitiatingAppServicePrincipalName\
  \ = tostring(InitiatedBy.app.servicePrincipalName)\n| extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n\
  | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n| extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress),\
  \ InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))\n| extend InitiatingUserRoles = InitiatedBy.user.roles\n\
  | where GroupName in~ (PrivilegedGroups)\n\n\n| project TimeGenerated, AADOperationType, Category, OperationName,\
  \ AADTenantId, InitiatingUserPrincipalName, InitiatingAadUserId, InitiatingAppName, InitiatingAppId,\
