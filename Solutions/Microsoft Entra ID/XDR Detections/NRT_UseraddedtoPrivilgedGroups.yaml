  displayName: NRT User added to Microsoft Entra ID Privileged Groups
  status: disabled
  queryCondition:
    queryText: "let OperationList = dynamic([\"Add member to role\",\"Add eligible member to role\"]);\n\
      let PrivilegedGroups = dynamic([\"UserAccountAdmins\",\"PrivilegedRoleAdmins\",\"TenantAdmins\"\
      ,\"PrivilegedAuthenticationAdmins\"]);\nAuditLogs\n| where Category =~ \"RoleManagement\"\n| where\
      \ OperationName in~ (OperationList)\n| mv-apply TargetResource = TargetResources on\n  (\n     \
      \ where TargetResource.type =~ \"User\"\n      | extend TargetUserPrincipalName = tostring(TargetResource.userPrincipalName),\n\
      \               modProps = TargetResource.modifiedProperties\n  )\n| mv-apply Property = modProps\
      \ on\n  (\n      where Property.displayName =~ \"Role.WellKnownObjectName\"\n      | extend DisplayName\
      \ = trim('\"',tostring(Property.displayName)),\n               GroupName = trim('\"',tostring(Property.newValue))\n\
      \  )\n| extend InitiatingAppId = tostring(InitiatedBy.app.appId)\n| extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n\
      | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n| extend\
      \ InitiatingAppServicePrincipalName = tostring(InitiatedBy.app.servicePrincipalName)\n| extend InitiatingUserPrincipalName\
      \ = tostring(InitiatedBy.user.userPrincipalName)\n| extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n\
      | extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress,\
      \ InitiatedBy.app.ipAddress))\n| extend InitiatingUserRoles = InitiatedBy.user.roles\n| where GroupName\
      \ in~ (PrivilegedGroups)\n\n\n| project TimeGenerated, AADOperationType, Category, OperationName,\
      \ AADTenantId, InitiatingUserPrincipalName, InitiatingAadUserId, InitiatingAppName, InitiatingAppId,\
      \ InitiatingAppServicePrincipalId, InitiatingIpAddress, InitiatingUserRoles, DisplayName, GroupName,\
      \ TargetUserPrincipalName\n| extend InitiatedByName = tostring(split(InitiatingUserPrincipalName,'@',0)[0]),\
      \ InitiatedByUPNSuffix = tostring(split(InitiatingUserPrincipalName,'@',1)[0])\n| extend TargetName\
      \ = tostring(split(TargetUserPrincipalName,'@',0)[0]), TargetUPNSuffix = tostring(split(TargetUserPrincipalName,'@',1)[0])"
  schedule:
    frequency: PT0S
  detectionAction:
    alertTemplate:
      title: NRT User added to Microsoft Entra ID Privileged Groups
      description: '''This will alert when a user is added to any of the Privileged Groups.

        For further information on AuditLogs please see https://docs.microsoft.com/azure/active-directory/reports-monitoring/reference-audit-activities.

        For Administrator role permissions in Microsoft Entra ID please see https://docs.microsoft.com/azure/active-directory/users-groups-roles/directory-assign-admin-roles'''
