properties:
  id: xdr-d99cf5c3-d660-436c-895b-8a8f8448da23
  displayName: MFA Rejected by User
  status: disabled
  queryCondition:
    queryText: "let BehaviorAnalytics = BehaviorInfo\n| extend UserPrincipalName =\
      \ AccountUpn, UserName = tostring(split(AccountUpn, \"@\")[0]), UsersInsights\
      \ = parse_json(\"{}\"), DevicesInsights = parse_json(\"{}\"), ActivityInsights\
      \ = parse_json(\"{}\"), InvestigationPriority = int(0), SourceIPAddress = \"\
      \", EventSource = ServiceSource, ActivityType = Categories, SourceDevice = \"\
      \";\nlet riskScoreCutoff = 3; //Adjust this score threshold based on volume\
      \ of results. Activities identified as the most abnormal receive the highest\
      \ scores (on a scale of 0-10)\nSigninLogs\n| where ResultType == 500121\n| extend\
      \ additionalDetails_ = tostring(Status.additionalDetails)\n| extend UserPrincipalName\
      \ = tolower(UserPrincipalName)\n| where additionalDetails_ =~ \"MFA denied;\
      \ user declined the authentication\" or additionalDetails_ has \"fraud\"\n|\
      \ summarize StartTime = min(TimeGenerated), EndTIme = max(TimeGenerated) by\
      \ UserPrincipalName, UserId, AADTenantId, FailedIPAddress = IPAddress\n| extend\
      \ Name = tostring(split(UserPrincipalName,'@',0)[0]), UPNSuffix = tostring(split(UserPrincipalName,'@',1)[0])\n\
      | join kind=leftouter (\n    IdentityInfo\n    | summarize LatestReportTime\
      \ = arg_max(TimeGenerated, *) by AccountUpn\n    | project AccountUpn, Tags,\
      \ JobTitle, GroupMembership, AssignedRoles, Type, IsAccountEnabled\n    | summarize\n\
      \        Tags = make_set(Tags, 1000),\n        GroupMembership = make_set(GroupMembership,\
      \ 1000),\n        AssignedRoles = make_set(AssignedRoles, 1000),\n        Type\
      \ = make_set(Type, 1000),\n        UserAccountControl = make_set(Type, 1000)\n\
      \    by AccountUpn\n    | extend UserPrincipalName=tolower(AccountUpn)\n) on\
      \ UserPrincipalName\n//Below it will be joined with BehaviorAnalytics table\
      \ to the Failed IP Addresses\n| join kind=leftouter (\n    BehaviorAnalytics\n\
      \    | where ActivityType in (\"FailedLogOn\", \"LogOn\")\n    | where isnotempty(SourceIPAddress)\n\
      \    | project UsersInsights, DevicesInsights, ActivityInsights, InvestigationPriority,\
      \ SourceIPAddress, UserName\n    | project-rename FailedIPAddress = SourceIPAddress,\
      \ Name = UserName\n    | summarize\n      MaxInvestigationScore = max(InvestigationPriority)\
      \  // Only retrieve maximum Investigation Property score for both FailedIP and\
      \ User\n    by FailedIPAddress, Name)\non FailedIPAddress, Name  // Joining\
      \ on both IP and User so as to only return context associated with same user\n\
      | extend UEBARiskScore = MaxInvestigationScore\n| project-away *1 // removing\
      \ duplicate columns post outer join from output\n| where  UEBARiskScore > riskScoreCutoff\n\
      | sort by UEBARiskScore desc"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: MFA Rejected by User
      description: "'Identifies occurances where a user has rejected an MFA prompt.\
        \ This could be an indicator that a threat actor has compromised the username\
        \ and password of this user account and is using it to try and log into the\
        \ account.\nRef : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-user-accounts#monitoring-for-failed-unusual-sign-ins\n\
        This query has also been updated to include UEBA logs IdentityInfo and BehaviorAnalytics\
        \ for contextual information around the results. \nPlease note, MFA Failed\
        \ logons from known IP ranges can be benign depending on the conditional acc"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        - id: account2
          aadUserIdColumn: UserId
        ips:
        - id: ip1
          addressColumn: FailedIPAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
