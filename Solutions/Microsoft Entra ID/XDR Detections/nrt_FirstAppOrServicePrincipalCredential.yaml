properties:
  id: xdr-b6988c32-4f3b-4a45-8313-b46b33061a74
  displayName: NRT First access credential added to Application or Service Principal where no credential
    was present
  status: disabled
  queryCondition:
    queryText: "AuditLogs\n| where OperationName has_any (\"Add service principal\", \"Certificates and\
      \ secrets management\")\n| where Result =~ \"success\"\n| where tostring(InitiatedBy.user.userPrincipalName)\
      \ has \"@\" or tostring(InitiatedBy.app.displayName) has \"@\"\n| mv-apply TargetResource = TargetResources\
      \ on\n  (\n    where TargetResource.type =~ \"Application\"\n    | extend targetDisplayName = tostring(TargetResource.displayName),\n\
      \             targetId = tostring(TargetResource.id),\n             targetType = tostring(TargetResource.type),\n\
      \             keyEvents = TargetResource.modifiedProperties\n  )\n|  mv-apply Property = keyEvents\
      \ on\n (\n  where Property.displayName =~ \"KeyDescription\"\n  | extend new_value_set = parse_json(tostring(Property.newValue)),\n\
      \           old_value_set = parse_json(tostring(Property.oldValue))\n )\n| where old_value_set ==\
      \ \"[]\"\n| mv-expand new_value_set\n| parse new_value_set with * \"KeyIdentifier=\" keyIdentifier:string\
      \ \",KeyType=\" keyType:string \",KeyUsage=\" keyUsage:string \",DisplayName=\" keyDisplayName:string\
      \ \"]\" *\n| where keyUsage == \"Verify\"\n | mv-apply AdditionalDetail = AdditionalDetails on\n\
      \  (\n    where AdditionalDetail.key =~ \"User-Agent\"\n    | extend UserAgent = tostring(AdditionalDetail.value)\n\
      \  )\n| extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n| extend InitiatingAppServicePrincipalId\
      \ = tostring(InitiatedBy.app.servicePrincipalId)\n| extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n\
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n| extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress),\
      \ InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))\n\n| project-away new_value_set, old_value_set\n\
      | project-reorder TimeGenerated, OperationName, InitiatingUserPrincipalName, InitiatingAadUserId,\
      \ InitiatingAppName, InitiatingAppServicePrincipalId, InitiatingIpAddress, UserAgent, targetDisplayName,\
      \ targetId, targetType, keyDisplayName, keyType, keyUsage, keyIdentifier, CorrelationId, TenantId\n\
      | extend InitiatedByName = tostring(split(InitiatingUserPrincipalName,'@',0)[0]), InitiatedByUPNSuffix\
      \ = tostring(split(InitiatingUserPrincipalName,'@',1)[0])"
  schedule:
    frequency: PT0S
  detectionAction:
    alertTemplate:
      title: NRT First access credential added to Application or Service Principal where no credential
        was present
      description: '''This will alert when an admin or app owner account adds a new credential to an Application
        or Service Principal where there was no previous verify KeyCredential associated.

        If a threat actor obtains access to an account with sufficient privileges and adds the alternate
        authentication material triggering this event, the threat actor can now authenticate as the Application
        or Service Principal using this credential.

        Additional information on OAuth Credential Grants can be found in RFC 6749 Section 4.4 or https://docs.microsoft.com/azure/active-directory/develop/v2-oauth2-client-creds-grant-flow'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: InitiatedByName
          upnSuffixColumn: InitiatedByUPNSuffix
        - id: account2
          aadUserIdColumn: InitiatingAadUserId
        - id: account3
          aadUserIdColumn: InitiatingAppServicePrincipalId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1550
          subTechniques:
          - T1550.001
