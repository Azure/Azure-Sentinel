properties:
  id: xdr-34c5aff9-a8c2-4601-9654-c7e46342d03b
  displayName: Privileged Accounts - Sign in Failure Spikes
  status: disabled
  queryCondition:
    queryText: "let starttime = 14d;\nlet timeframe = 1d;\nlet scorethreshold = 3;\n\
      let baselinethreshold = 5;\nlet aadFunc = (tableName:string){\n    IdentityInfo\n\
      \    | where TimeGenerated > ago(starttime)\n    | summarize arg_max(TimeGenerated,\
      \ *) by AccountUpn\n    | mv-expand AssignedRoles\n    | where AssignedRoles\
      \ contains 'Admin' or GroupMembership has \"Admin\"\n    | summarize Roles =\
      \ make_list(AssignedRoles) by AccountUpn = tolower(AccountUpn)\n    | join kind=inner\
      \ (\n        table(tableName)\n        | where TimeGenerated between (startofday(ago(starttime))..startofday(now()))\n\
      \        | where ResultType != 0\n        | extend UserPrincipalName = tolower(UserPrincipalName)\n\
      \    ) on $left.AccountUpn == $right.UserPrincipalName\n    | extend timestamp\
      \ = TimeGenerated, AccountCustomEntity = UserPrincipalName, Roles = tostring(Roles)\n\
      };\nlet aadSignin = aadFunc(\"SigninLogs\");\nlet aadNonInt = aadFunc(\"AADNonInteractiveUserSignInLogs\"\
      );\nlet allSignins = union isfuzzy=true aadSignin, aadNonInt;\nlet TimeSeriesAlerts\
      \ =\n    allSignins\n    | make-series HourlyCount=count() on TimeGenerated\
      \ from startofday(ago(starttime)) to startofday(now()) step 1h by UserPrincipalName,\
      \ Roles\n    | extend (anomalies, score, baseline) = series_decompose_anomalies(HourlyCount,\
      \ scorethreshold, -1, 'linefit')\n    | mv-expand HourlyCount to typeof(double),\
      \ TimeGenerated to typeof(datetime), anomalies to typeof(double), score to typeof(double),\
      \ baseline to typeof(long)\n    // Filtering low count events per baselinethreshold\n\
      \    | where anomalies > 0 and baseline > baselinethreshold\n    | extend AnomalyHour\
      \ = TimeGenerated\n    | project UserPrincipalName, Roles, AnomalyHour, TimeGenerated,\
      \ HourlyCount, baseline, anomalies, score;\n// Filter the alerts for specified\
      \ timeframe\nTimeSeriesAlerts\n| where TimeGenerated > startofday(ago(timeframe))\n\
      | join kind=inner (\n    allSignins\n    | where TimeGenerated > startofday(ago(timeframe))\n\
      \    // create a new column and round to hour\n    | extend DateHour = bin(TimeGenerated,\
      \ 1h)\n    | summarize PartialFailedSignins = count(), LatestAnomalyTime = arg_max(TimeGenerated,\
      \ *) by bin(TimeGenerated, 1h), OperationName, Category, ResultType, ResultDescription,\
      \ UserPrincipalName, Roles, UserDisplayName, AppDisplayName, ClientAppUsed,\
      \ IPAddress, ResourceDisplayName\n) on UserPrincipalName, $left.AnomalyHour\
      \ == $right.DateHour\n| project LatestAnomalyTime, OperationName, Category,\
      \ UserPrincipalName, Roles = todynamic(Roles), UserDisplayName, ResultType,\
      \ ResultDescription, AppDisplayName, ClientAppUsed, UserAgent, IPAddress, Location,\
      \ AuthenticationRequirement, ConditionalAccessStatus, ResourceDisplayName, PartialFailedSignins,\
      \ TotalFailedSignins = HourlyCount, baseline, anomalies, score\n| extend Name\
      \ = tostring(split(UserPrincipalName,'@',0)[0]), UPNSuffix = tostring(split(UserPrincipalName,'@',1)[0])"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Privileged Accounts - Sign in Failure Spikes
      description: ''' Identifies spike in failed sign-ins from Privileged accounts.
        Privileged accounts list can be based on IdentityInfo UEBA table.

        Spike is determined based on Time series anomaly which will look at historical
        baseline values.

        Ref : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-privileged-accounts#things-to-monitor'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      customDetails:
        AccountFullName: UserPrincipalName
