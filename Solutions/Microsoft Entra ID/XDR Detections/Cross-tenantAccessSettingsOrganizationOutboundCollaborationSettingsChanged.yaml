properties:
  id: xdr-229f71ba-d83b-42a5-b83b-11a641049ed1
  displayName: Cross-tenant Access Settings Organization Outbound Collaboration Settings Changed
  status: disabled
  queryCondition:
    queryText: |-
      // In User & Groups and in Applications, the following "AccessType" values in columns PremodifiedOutboundSettings and ModifiedOutboundSettings are interpreted accordingly
      // When Access Type in premodified outbound settings value was 1 that means that the initial access was allowed. When Access Type in premodified outbound settings value was 2 that means that the initial access was blocked.
      // When Access Type in modified outbound settings value is 1 that means that now access is allowed. When Access Type in modified outbound settings value is 2 that means that now access is blocked.
      AuditLogs
      | where OperationName has "Update a partner cross-tenant access setting"
      | mv-apply TargetResource = TargetResources on
        (
            where TargetResource.type =~ "Policy"
            | extend Properties = TargetResource.modifiedProperties
        )
      | mv-apply Property = Properties on
        (
            where Property.displayName =~ "b2bCollaborationOutbound"
            | extend PremodifiedOutboundSettings = trim('"',tostring(Property.oldValue)),
                     ModifiedOutboundSettings = trim(@'"',tostring(Property.newValue))
        )
      | where PremodifiedOutboundSettings != ModifiedOutboundSettings
      | extend InitiatingAppName = tostring(InitiatedBy.app.displayName)
      | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)
      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)
      | extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))
      | extend InitiatingAccountName = tostring(split(InitiatingUserPrincipalName, "@")[0]), InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName, "@")[1])
  schedule:
    frequency: P2D
  detectionAction:
    alertTemplate:
      title: Cross-tenant Access Settings Organization Outbound Collaboration Settings Changed
      description: '''Organizations are added in the Cross-tenant Access Settings to control communication inbound or outbound
        for users and applications. This detection notifies when Organization Outbound Collaboration Settings are changed
        for "Users & Groups" and for "Applications".'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: InitiatingAppName
          aadUserIdColumn: InitiatingAppServicePrincipalId
        - id: account2
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      - tactic: Persistence
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
        - technique: T1136
          subTechniques:
          - T1136.003
      - tactic: Discovery
        techniques:
        - technique: T1087
          subTechniques:
          - T1087.004
      customDetails:
        AccountFullName: InitiatingUserPrincipalName
