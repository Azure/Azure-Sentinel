properties:
  id: xdr-87210ca1-49a4-4a7d-bb4a-4988752f978c
  displayName: Azure Portal sign in from another Azure Tenant
  status: disabled
  queryCondition:
    queryText: "// Get details of current Azure Ranges (note this URL updates regularly\
      \ so will need to be manually updated over time)\n// You may find the name of\
      \ the new JSON here: https://www.microsoft.com/download/details.aspx?id=56519\n\
      // On the downloads page, click the 'details' button, and then replace just\
      \ the filename in the URL below\nlet azure_ranges = externaldata(changeNumber:\
      \ string, cloud: string, values: dynamic)\n[\"https://raw.githubusercontent.com/microsoft/mstic/master/PublicFeeds/MSFTIPRanges/ServiceTags_Public.json\"\
      ] with(format='multijson')\n| mv-expand values\n| mv-expand values.properties.addressPrefixes\n\
      | mv-expand values_properties_addressPrefixes\n| summarize by tostring(values_properties_addressPrefixes)\n\
      | extend isipv4 = parse_ipv4(values_properties_addressPrefixes)\n| extend isipv6\
      \ = parse_ipv6(values_properties_addressPrefixes)\n| extend ip_type = case(isnotnull(isipv4),\
      \ \"v4\", \"v6\")\n| summarize make_list(values_properties_addressPrefixes)\
      \ by ip_type\n;\nSigninLogs\n// Limiting to Azure Portal really reduces false\
      \ positives and helps focus on potential admin activity\n| where ResultType\
      \ == 0\n| where AppDisplayName =~ \"Azure Portal\"\n| extend isipv4 = parse_ipv4(IPAddress)\n\
      | extend ip_type = case(isnotnull(isipv4), \"v4\", \"v6\")\n // Only get logons\
      \ where the IP address is in an Azure range\n| join kind=fullouter (azure_ranges)\
      \ on ip_type\n| extend ipv6_match = ipv6_is_in_any_range(IPAddress,  list_values_properties_addressPrefixes)\n\
      | extend ipv4_match = ipv4_is_in_any_range(IPAddress,  list_values_properties_addressPrefixes)\n\
      | where ipv4_match or ipv6_match\n// Limit to where the user is external to\
      \ the tenant\n| where HomeTenantId != ResourceTenantId\n// Further limit it\
      \ to just access to the current tenant (you can drop this if you wanted to look\
      \ elsewhere as well but it helps reduce FPs)\n| where ResourceTenantId == AADTenantId\n\
      | summarize FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), make_set(ResourceDisplayName)\
      \ by UserPrincipalName, IPAddress, UserAgent, Location, HomeTenantId, ResourceTenantId,\
      \ UserId\n| extend AccountName = split(UserPrincipalName, \"@\")[0]\n| extend\
      \ UPNSuffix = split(UserPrincipalName, \"@\")[1]"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Azure Portal sign in from another Azure Tenant
      description: '''This query looks for successful sign in attempts to the Azure
        Portal where the user who is signing in from another Azure tenant, and the
        IP address the login attempt is from is an Azure IP. A threat actor who compromises
        an Azure tenant may look to pivot to other tenants leveraging cross-tenant
        delegated access in this manner.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        - id: account2
          aadUserIdColumn: UserId
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1199
      customDetails:
        AccountFullName: UserPrincipalName
