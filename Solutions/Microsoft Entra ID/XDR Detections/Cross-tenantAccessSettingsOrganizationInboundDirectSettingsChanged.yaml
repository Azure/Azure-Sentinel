properties:
  id: xdr-276d5190-38de-4eb2-9933-b3b72f4a5737
  displayName: Cross-tenant Access Settings Organization Inbound Direct Settings Changed
  status: disabled
  queryCondition:
    queryText: |-
      // In User & Groups and in Applications, the following "AccessType" values in columns PremodifiedInboundSettings and ModifiedInboundSettings are interpreted accordingly
      // When Access Type in premodified inbound settings value was 1 that means that the initial access was allowed. When Access Type in premodified inbound settings value was 2 that means that the initial access was blocked.
      // When Access Type in modified inbound settings value is 1 that means that now access is allowed. When Access Type in modified inbound settings value is 2 that means that now access is blocked.
      AuditLogs
      | where OperationName has "Update a partner cross-tenant access setting"
      | mv-apply TargetResource = TargetResources on
        (
            where TargetResource.type =~ "Policy"
            | extend Properties = TargetResource.modifiedProperties
        )
      | mv-apply Property = Properties on
        (
            where Property.displayName =~ "b2bDirectConnectInbound"
            | extend PremodifiedInboundSettings = trim('"',tostring(Property.oldValue)),
                     ModifiedInboundSettings = trim(@'"',tostring(Property.newValue))
        )
      | where PremodifiedInboundSettings != ModifiedInboundSettings
      | extend InitiatingAppName = tostring(InitiatedBy.app.displayName)
      | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)
      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)
      | extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))
      | extend InitiatingAccountName = tostring(split(InitiatingUserPrincipalName, "@")[0]), InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName, "@")[1])
  schedule:
    frequency: P2D
  detectionAction:
    alertTemplate:
      title: Cross-tenant Access Settings Organization Inbound Direct Settings Changed
      description: '''Organizations are added in the Cross-tenant Access Settings to control communication inbound or outbound
        for users and applications. This detection notifies when Organization Inbound Direct Settings are changed for "Users
        & Groups" and for "Applications".'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: InitiatingAppName
          aadUserIdColumn: InitiatingAppServicePrincipalId
        - id: account2
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      - tactic: Persistence
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
        - technique: T1136
          subTechniques:
          - T1136.003
      - tactic: Discovery
        techniques:
        - technique: T1087
          subTechniques:
          - T1087.004
      customDetails:
        AccountFullName: InitiatingUserPrincipalName
