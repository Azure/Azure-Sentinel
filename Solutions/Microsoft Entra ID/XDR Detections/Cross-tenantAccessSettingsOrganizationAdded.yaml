properties:
  id: xdr-757e6a79-6d23-4ae6-9845-4dac170656b5
  displayName: Cross-tenant Access Settings Organization Added
  status: disabled
  queryCondition:
    queryText: |-
      // Tenants IDs can be found by navigating to Azure Active Directory then from menu on the left, select External Identities, then from menu on the left, select Cross-tenant access settings and from the list shown of Tenants
      let ExpectedTenantIDs = dynamic(["List of expected tenant IDs","Tenant ID 2"]);
      AuditLogs
      | where OperationName has "Add a partner to cross-tenant access setting"
      | mv-apply TargetResource = TargetResources on
        (
            where TargetResource.type =~ "Policy"
            | extend Properties = TargetResource.modifiedProperties
        )
      | mv-apply Property = Properties on
        (
            where Property.displayName =~ "tenantId"
            | extend ExtTenantIDAdded = trim('"',tostring(Property.newValue))
        )
      | where ExtTenantIDAdded !in (ExpectedTenantIDs)
      | extend InitiatingAppName = tostring(InitiatedBy.app.displayName)
      | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)
      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)
      | extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))
      | extend InitiatingAccountName = tostring(split(InitiatingUserPrincipalName, "@")[0]), InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName, "@")[1])
  schedule:
    frequency: P2D
  detectionAction:
    alertTemplate:
      title: Cross-tenant Access Settings Organization Added
      description: '''Organizations are added in the Cross-tenant Access Settings to control communication inbound or outbound
        for users and applications. This detection notifies when an Organization is added other than the list that is supposed
        to exist from the Microsoft Entra ID Cross-tenant Access Settings.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: InitiatingAppName
          aadUserIdColumn: InitiatingAppServicePrincipalId
        - id: account2
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      - tactic: Persistence
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
        - technique: T1136
          subTechniques:
          - T1136.003
      - tactic: Discovery
        techniques:
        - technique: T1087
          subTechniques:
          - T1087.004
      customDetails:
        AccountFullName: InitiatingUserPrincipalName
