properties:
  id: xdr-a22740ec-fc1e-4c91-8de6-c29c6450ad00
  displayName: '[Deprecated] Explicit MFA Deny'
  status: disabled
  queryCondition:
    queryText: "let aadFunc = (tableName: string) {\n    table(tableName)\n    | where\
      \ ResultType == 500121\n    | where Status has \"MFA Denied; user declined the\
      \ authentication\" or Status has \"MFA denied; Phone App Reported Fraud\"\n\
      \    | extend Type = Type, PublicIP = IPAddress\n    | extend\n        Name\
      \ = tostring(split(UserPrincipalName, '@', 0)[0]),\n        UPNSuffix = tostring(split(UserPrincipalName,\
      \ '@', 1)[0])\n};\nlet aadSignin = aadFunc(\"SigninLogs\");\nlet dvcInfo = DeviceInfo\n\
      \    | extend SensorHealthState = column_ifexists(\"SensorHealthState\", \"\"\
      )\n    | where OnboardingStatus == \"Onboarded\" and SensorHealthState == \"\
      Active\"\n    | project PublicIP, AadDeviceId;\nlet aadNonInt = aadFunc(\"AADNonInteractiveUserSignInLogs\"\
      );\nunion isfuzzy=true aadSignin, aadNonInt\n| join kind=leftouter dvcInfo on\
      \ PublicIP"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: '[Deprecated] Explicit MFA Deny'
      description: "'User explicitly denies MFA push, indicating that login was not\
        \ expected and the account's password may be compromised.\nThis rule is deprecated\
        \ as of July-2024. Alternative rule with similar logic and contex from more\
        \ data source \nis available at https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Microsoft%20Entra%20ID/Analytic%20Rules/MFARejectedbyUser.yaml'"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: PublicIP
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
