properties:
  id: xdr-132fdff4-c044-4855-a390-c1b71e0f833b
  displayName: Azure RBAC (Elevate Access)
  status: disabled
  queryCondition:
    queryText: |-
      AuditLogs
      | where Category =~ "AzureRBACRoleManagementElevateAccess"
      | where ActivityDisplayName =~ "User has elevated their access to User Access Administrator for their Azure Resources"
      | extend Actor = tostring(InitiatedBy.user.userPrincipalName)
      | extend IPAddress = tostring(InitiatedBy.user.ipAddress)
      | project
          TimeGenerated,
          Actor,
          OperationName,
          IPAddress,
          Result,
          LoggedByService
  schedule:
    frequency: PT2H
  detectionAction:
    alertTemplate:
      title: Azure RBAC (Elevate Access)
      description: '''Detects when a Global Administrator elevates access to all subscriptions and management groups in a
        tenant. When a Global Administrator elevates access they are assigned the User Access Administrator role at root scope.
        This Microsoft Sentinel Analytic Rule monitors who has elevated access in your tenant so that admins can take appropriate
        action. [Learn more](https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin?tabs=azure-portal)'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
      customDetails:
        AccountName: Actor
