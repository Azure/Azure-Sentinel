properties:
  id: xdr-4f42b94f-b210-42d1-a023-7fa1c51d969f
  displayName: New onmicrosoft domain added to tenant
  status: disabled
  queryCondition:
    queryText: |-
      AuditLogs
      | where AADOperationType == "Add"
      | where Result == "success"
      | where OperationName in ("Add verified domain", "Add unverified domain")
      | extend InitiatedBy = parse_json(InitiatedBy)
      | extend InitiatingUser = tostring(InitiatedBy.user.userPrincipalName)
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)
      | extend InitiatingIp = tostring(InitiatedBy.user.ipAddress)
      | extend InitiatingApp = tostring(InitiatedBy.app.displayName)
      | extend InitiatingSPID = tostring(InitiatedBy.app.servicePrincipalId)
      | extend DomainAdded = tostring(TargetResources[0].displayName)
      | where DomainAdded has "onmicrosoft"
      | extend ActionInitiatedBy = case(isnotempty(InitiatingUser), InitiatingUser, strcat(InitiatingApp, " - ", InitiatingSPID))
      | extend UserName = split(InitiatingUser, "@")[0]
      | extend UPNSuffix = split(InitiatingUser, "@")[1]
      | project-reorder TimeGenerated, OperationName, DomainAdded, ActionInitiatedBy, InitiatingIp
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: New onmicrosoft domain added to tenant
      description: "'This detection looks for new onmicrosoft domains being added to a tenant. \nAn attacker who compromises a tenant may register a new onmicrosoft domain in order to masquerade as a service provider for launching phishing campaigns.\nDomain additions are not a common occurrence and users should validate that the domain was added by a legitimate user, with a legitimate purpose.'"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: UserName
          upnSuffixColumn: UPNSuffix
        - id: account2
          aadUserIdColumn: InitiatingAadUserId
        - id: account3
          aadUserIdColumn: InitiatingSPID
        ips:
        - id: ip1
          addressColumn: InitiatingIp
        dns:
        - id: dn1
          domainNameColumn: DomainAdded
      tactics:
      - tactic: ResourceDevelopment
        techniques:
        - technique: T1585
          subTechniques:
          - T1585.003
      customDetails:
        AccountFullName: InitiatingUser
