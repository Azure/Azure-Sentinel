properties:
  id: xdr-75ea5c39-93e5-489b-b1e1-68fa6c9d2d04
  displayName: Attempts to sign in to disabled accounts
  status: disabled
  queryCondition:
    queryText: 'let threshold = 3;

      let aadFunc = (tableName:string){

      table(tableName)

      | where ResultType == "50057"

      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), applicationCount
      = dcount(AppDisplayName),

      applicationSet = make_set(AppDisplayName), count() by UserPrincipalName, IPAddress,
      Type

      | where applicationCount >= threshold

      | extend Name = tostring(split(UserPrincipalName,''@'',0)[0]), UPNSuffix = tostring(split(UserPrincipalName,''@'',1)[0])

      };

      let aadSignin = aadFunc("SigninLogs");

      let aadNonInt = aadFunc("AADNonInteractiveUserSignInLogs");

      union isfuzzy=true aadSignin, aadNonInt'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Attempts to sign in to disabled accounts
      description: '''Identifies failed attempts to sign in to disabled accounts across
        multiple Azure Applications.

        Default threshold for Azure Applications attempted to sign in to is 3.

        References: https://docs.microsoft.com/azure/active-directory/reports-monitoring/reference-sign-ins-error-codes

        50057 - User account is disabled. The account has been disabled by an administrator.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: IPAddress
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: UserPrincipalName
