properties:
  id: xdr-29e99017-e28d-47be-8b9a-c8c711f8a903
  displayName: NRT Authentication Methods Changed for VIP Users
  status: disabled
  queryCondition:
    queryText: "let security_info_actions = dynamic([\"User registered security info\"\
      , \"User changed default security info\", \"User deleted security info\", \"\
      Admin updated security info\", \"User reviewed security info\", \"Admin deleted\
      \ security info\", \"Admin registered security info\"]);\nlet VIPUsers = _GetWatchlist('VIPUsers')\n\
      \  | extend [\"User Principal Name\"] = column_ifexists(\"User Principal Name\"\
      ,\"\")\n  | distinct [\"User Principal Name\"];\nAuditLogs\n| where Category\
      \ =~ \"UserManagement\"\n| where ActivityDisplayName in (security_info_actions)\n\
      | extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n| extend\
      \ InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n\
      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n\
      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n| extend InitiatingIpAddress\
      \ = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress,\
      \ InitiatedBy.app.ipAddress))\n| mv-apply TargetResource = TargetResources on\n\
      \  (\n      where TargetResource.type =~ \"User\"\n      | extend Target = trim(@'\"\
      ',tolower(tostring(TargetResource.userPrincipalName)))\n  )\n| where Target\
      \ in~ (VIPUsers)\n| summarize Start=min(TimeGenerated), End=max(TimeGenerated),\
      \ Actions = make_set(ResultReason) by InitiatingUserPrincipalName, InitiatingAadUserId,\
      \ InitiatingAppName, InitiatingAppServicePrincipalId, InitiatingIpAddress, Result,\
      \ Target\n| extend TargetName = tostring(split(Target,'@',0)[0]), TargetUPNSuffix\
      \ = tostring(split(Target,'@',1)[0])\n| extend InitiatedByName = tostring(split(InitiatingUserPrincipalName,'@',0)[0]),\
      \ InitiatedByUPNSuffix = tostring(split(InitiatingUserPrincipalName,'@',1)[0])"
  schedule:
    frequency: PT1H
    queryPeriod: PT4H
  detectionAction:
    alertTemplate:
      title: NRT Authentication Methods Changed for VIP Users
      description: '''Identifies authentication methods being changed for a list of
        VIP users watchlist. This could be an indication of an attacker adding an
        auth method to the account so they can have continued access.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: TargetName
          upnSuffixColumn: TargetUPNSuffix
        - id: account2
          nameColumn: InitiatedByName
          upnSuffixColumn: InitiatedByUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        - id: account4
          aadUserIdColumn: InitiatingAppServicePrincipalId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1098
      customDetails:
        AccountFullName: Target
        AccountFullName_2: InitiatingUserPrincipalName
