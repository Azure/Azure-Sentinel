properties:
  id: xdr-5db427b2-f406-4274-b413-e9fcb29412f8
  displayName: NRT PIM Elevation Request Rejected
  status: disabled
  queryCondition:
    queryText: "AuditLogs\n| where ActivityDisplayName =~ 'Add member to role request denied (PIM activation)'\n\
      | mv-apply ResourceItem = TargetResources on\n  (\n      where ResourceItem.type =~ \"Role\"\n \
      \     | extend Role = trim(@'\"',tostring(ResourceItem.displayName))\n  )\n| mv-apply ResourceItem\
      \ = TargetResources on\n  (\n      where ResourceItem.type =~ \"User\"\n      | extend TargetUserPrincipalName\
      \ = trim(@'\"',tostring(ResourceItem.userPrincipalName))\n  )\n| where ResultReason != \"RoleAssignmentExists\"\
      \n| where isnotempty(InitiatedBy.user)\n| extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n\
      | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n| extend\
      \ InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n| extend InitiatingAadUserId\
      \ = tostring(InitiatedBy.user.id)\n| extend InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress),\
      \ InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))\n| extend TargetName = tostring(split(TargetUserPrincipalName,'@',0)[0]),\
      \ TargetUPNSuffix = tostring(split(TargetUserPrincipalName,'@',1)[0])\n| extend InitiatedByName\
      \ = tostring(split(InitiatingUserPrincipalName,'@',0)[0]), InitiatedByUPNSuffix = tostring(split(InitiatingUserPrincipalName,'@',1)[0])\n\
      | project-reorder TimeGenerated, TargetUserPrincipalName, Role, OperationName, Result, ResultDescription"
  schedule:
    frequency: PT0S
  detectionAction:
    alertTemplate:
      title: NRT PIM Elevation Request Rejected
      description: '''Identifies when a user is rejected for a privileged role elevation via PIM. Monitor
        rejections for indicators of attacker compromise of the requesting account.

        Ref : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-privileged-identity-management'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: TargetName
          upnSuffixColumn: TargetUPNSuffix
        - id: account2
          nameColumn: InitiatedByName
          upnSuffixColumn: InitiatedByUPNSuffix
        - id: account3
          aadUserIdColumn: InitiatingAadUserId
        - id: account4
          aadUserIdColumn: InitiatingAppServicePrincipalId
        ips:
        - id: ip1
          addressColumn: InitiatingIpAddress
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      customDetails:
        AccountFullName: TargetUserPrincipalName
        AccountFullName_2: InitiatingUserPrincipalName
