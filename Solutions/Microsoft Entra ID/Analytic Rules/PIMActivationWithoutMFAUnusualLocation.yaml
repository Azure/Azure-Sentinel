id: 9b4306d2-af4a-4d68-8db3-8ff15f56b4a3
name: PIM Privileged Role Activation Without MFA From Unusual Location
description: |
  'Detects Privileged Identity Management (PIM) role activations that occur
  without a strong MFA claim, or from a country/region not previously seen
  for that user, indicating potential compromised credential use to escalate
  privileges via PIM self-activation.'
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
      - SigninLogs
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - PrivilegeEscalation
relevantTechniques:
  - T1078.004
  - T1098.003
query: |
  let detectionWindow = 1h;
  let signinLookback = 1h;
  let baselineEnd = detectionWindow + signinLookback;
  // Baseline stops before any sign-in that could be correlated with a new activation
  let UserBaseline = SigninLogs
  | where TimeGenerated between (ago(14d) .. ago(baselineEnd))
  | where ResultType == 0
  | extend Country = tostring(LocationDetails.countryOrRegion)
  | where isnotempty(Country)
  | summarize UsualCountries = make_set(Country) by UserPrincipalName;
  // Only activations inside the current detection window
  let PIMActivations = AuditLogs
  | where TimeGenerated > ago(detectionWindow)
  | where OperationName == "Add member to role completed (PIM activation)"
  | extend Actor = tostring(InitiatedBy.user.userPrincipalName)
  | where isnotempty(Actor)
  | extend Role = tostring(TargetResources[0].displayName)
  | project ActivationTime = TimeGenerated, Actor, Role;
  let CandidateSignins = SigninLogs
  | where TimeGenerated > ago(baselineEnd)
  | where ResultType == 0
  | project SigninTime = TimeGenerated, UserPrincipalName, AuthenticationRequirement,
      Country = tostring(LocationDetails.countryOrRegion), IPAddress;
  PIMActivations
  | join kind=inner CandidateSignins on $left.Actor == $right.UserPrincipalName
  // Successful sign-ins in the hour before the activation only
  | where SigninTime between ((ActivationTime - signinLookback) .. ActivationTime)
  // Resolve multiple candidates: keep the most recent one per activation
  | summarize arg_max(SigninTime, AuthenticationRequirement, Country, IPAddress) by ActivationTime, Actor, Role
  | join kind=leftouter UserBaseline on $left.Actor == $right.UserPrincipalName
  | where AuthenticationRequirement != "multiFactorAuthentication"
      or (array_length(UsualCountries) > 0 and not(set_has_element(UsualCountries, Country)))
  | project ActivationTime, Actor, Role, SigninTime, Country, IPAddress, AuthenticationRequirement, UsualCountries
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Actor
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
version: 1.0.0
kind: Scheduled