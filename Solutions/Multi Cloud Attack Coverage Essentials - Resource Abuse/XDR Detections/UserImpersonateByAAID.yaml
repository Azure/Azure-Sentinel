properties:
  id: xdr-11c3d541-5fa5-49df-8218-d1c98584473b
  displayName: User impersonation by Identity Protection alerts
  status: disabled
  queryCondition:
    queryText: "// Retrieve SecurityAlerts generated within the last day\n AlertInfo\
      \ | join kind=leftouter AlertEvidence on AlertId\n // Filter alerts for Azure\
      \ Active Directory Identity Protection and High severity\n | where ServiceSource\
      \ has \"Azure Active Directory Identity Protection\"\n | where Severity == \"\
      High\"\n // Extract IP address entities from the 'Entities' field\n | extend\
      \ ipAddress = extract(@'\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b', 0, AdditionalFields)\n\
      \ // Filter out alerts without IP address entities\n | where isnotempty(ipAddress)\n\
      \ // Summarize entities per unique combination of attributes\n | summarize make_set(AdditionalFields)\n\
      \     by\n     AlertTime = Timestamp,\n     ipAddress,\n     Title,\n     ServiceSource,\n\
      \     Severity\n // Perform an inner join with AWS CloudTrail events\n | join\
      \ kind=inner (\n     AWSCloudTrail\n     | where isempty(ErrorMessage)\n   \
      \  | extend UserType = tostring(parse_json(RequestParameters).userType)\n  \
      \   | where EventName in~ (\"CreateRole\", \"DeleteRole\", \"CreateUser\", \"\
      CreateAccessKey\", \"DeleteAccessKey\", \"CreateGroup\", \"AddUserToGroup\"\
      , \"ChangePassword\", \"DeleteGroup\", \"DeleteUser\", \"RemoveUserFromGroup\"\
      , \"CreateVirtualMFADevice\", \"DeleteLoginProfile\")\n     | summarize\n  \
      \       make_set(RequestParameters),\n         make_set(ResponseElements)\n\
      \         by\n         SourceIpAddress,\n         UserIdentityArn,\n       \
      \  UserIdentityType,\n         EventName,\n         EventTime = TimeGenerated\n\
      \     )\n     on $left.ipAddress == $right.SourceIpAddress\n // Filter results\
      \ based on temporal correlation\n | where AlertTime between ((EventTime - 1h)\
      \ .. (EventTime + 1h))"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: User impersonation by Identity Protection alerts
      description: '''This detection focuses on identifying user-related events involving
        IAM roles, groups, user access, and password changes. It examines instances
        where the user''s IP address matches and alerts generated by Identity Protection
        share the same IP address. The analysis occurs within a time window of 1 hour,
        helping to flag potential cases of user impersonation.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1134
      customDetails:
        AWSUser: UserIdentityArn
        AlertIp: ipAddress
        AlertName: Title
