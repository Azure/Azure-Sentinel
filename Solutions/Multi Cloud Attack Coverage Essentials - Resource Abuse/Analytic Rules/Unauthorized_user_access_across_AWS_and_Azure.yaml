id: 60f31001-018a-42bf-8045-a92e1f361b7b
name: Unauthorized user access across AWS and Azure
description: '''This detection compiles and correlates unauthorized user access alerts
  originating from AWS GuardDuty with Azure portal sign-in activities. It focuses
  on AWS GuardDuty alerts related to unauthorized user access, specifically targeting
  network IP associations tied to activities such as logins from malicious IP addresses
  or instance credential exfiltration attempts. The ditection leverages these common
  network IP advisories to detect and pinpoint unauthorized users attempting to access
  both AWS and Azure resources.''

  '
severity: Medium
requiredDataConnectors:
- connectorId: AzureActiveDirectory
  dataTypes:
  - SigninLogs
- connectorId: AWSS3
  dataTypes:
  - AWSGuardDuty
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
- Exfiltration
- Discovery
relevantTechniques:
- T1557
- T1110
- T1110.003
- T1110.004
- T1212
- T1048
- T1087
- T1580
query: "// Define a variable 'AwsAlert' to collect Unauthorized user access alerts\
  \ from AWS GuardDuty table\nlet AwsAlert = materialize (\n    AWSGuardDuty\n   \
  \ | where ActivityType has_any (\"UnauthorizedAccess:IAMUser/TorIPCaller\", \"UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom\"\
  , \n    \"UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS\"\
  , \"UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS\",\n   \
  \ \"UnauthorizedAccess:IAMUser/ConsoleLoginSuccess.B\",\"UnauthorizedAccess:IAMUser/MaliciousIPCaller\"\
  )\n    | extend\n        AWSAlertId = Id, \n        AWSAlertTitle = Title,\n   \
  \     AWSAlertDescription = Description,\n        AWSresourceType = tostring(parse_json(ResourceDetails).resourceType),\n\
  \        AWSNetworkEntity = tostring(parse_json(ServiceDetails).action.awsApiCallAction.remoteIpDetails.ipAddressV4),\n\
  \        AWSAlertUserNameEntity = tostring(parse_json(ResourceDetails).accessKeyDetails.userName),\n\
  \        InstanceType = tostring(parse_json(ResourceDetails).instanceDetails.instanceType),\n\
  \        AWSTargetingService = parse_json(ServiceDetails).additionalInfo.apiCalls,\n\
  \        AWSAlertTime = TimeCreated,\n        AWSAlertLink= tostring(strcat('https://us-east-1.console.aws.amazon.com/guardduty/home?region=us-east-1#/findings?macros=current&fId=',Id)),\n\
  \        Severity = \n  case (\n    Severity >= 7.0, \"High\",\n    Severity between\
  \ (4.0 .. 6.9), \"Medium\",\n    Severity between (1.0 .. 3.9), \"Low\",\n    \"\
  Unknown\")\n    | mv-apply AIPCall = AWSTargetingService on \n        ( \n     \
  \   where AIPCall has \"name\"    \n        | extend APICallName = tostring(AIPCall.name),\
  \ APICallCount = tostring(AIPCall[\"count\"])\n        ) \n    | distinct\n    \
  \    AWSAlertTime,\n        ActivityType,\n        Severity,\n        AWSAlertId,\n\
  \        AWSAlertTitle,\n        AWSAlertDescription,\n        AWSAlertLink,\n \
  \       Arn,\n        AWSresourceType,\n        AWSNetworkEntity,\n        AWSAlertUserNameEntity,\n\
  \        InstanceType,\n        APICallName,\n        APICallCount      \n    );\n\
  \    // Define a variable 'Azure_sigin' to collect Azure portal Signing activity\
  \ from SigninLogs Table\n    let Azure_sigin = materialize (SigninLogs\n       \
  \ | where AppDisplayName == \"Azure Portal\"\n        | where isnotempty(OriginalRequestId)\n\
  \        | summarize \n            totalAzureLoginEventId = dcount(OriginalRequestId),\
  \ \n            AzureFailedEventsCount = dcountif(OriginalRequestId, ResultType\
  \ != 0), \n            AzureSuccessfulEventsCount = dcountif(OriginalRequestId,\
  \ ResultType == 0),\n            AzureSetOfFailedEvents = makeset(iff(ResultType\
  \ != 0, OriginalRequestId, \"\"), 5), \n            AzureSetOfSuccessfulEvents =\
  \ makeset(iff(ResultType == 0, OriginalRequestId, \"\"), 5) \n        by \n    \
  \        IPAddress, \n            UserPrincipalName, \n            bin(TimeGenerated,\
  \ 1min), \n            UserAgent,\n            ConditionalAccessStatus,\n      \
  \      OperationName,\n            RiskDetail,\n            AuthenticationRequirement,\n\
  \            ClientAppUsed \n        // Extracting the name and UPN suffix from\
  \ UserPrincipalName\n        | extend\n            Name = tostring(split(UserPrincipalName,\
  \ \"@\")[0]),\n            UPNSuffix = tostring(split(UserPrincipalName, \"@\")[1])\n\
  \    );\n    // Join 'AwsAlert' and 'Azure_sigin' on the AWS Network Entity and\
  \ Azure IP Address\n    AwsAlert\n    | join kind=inner Azure_sigin on $left.AWSNetworkEntity\
  \ == $right.IPAddress\n"
entityMappings:
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IPAddress
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: UserPrincipalName
  - identifier: Name
    columnName: Name
  - identifier: UPNSuffix
    columnName: UPNSuffix
customDetails:
  AWSAlertUserName: AWSAlertUserNameEntity
  AWSArn: Arn
  AWSresourceType: AWSresourceType
  AWSInstanceType: InstanceType
  AWSAPICallName: APICallName
  AWSAPICallCount: APICallCount
  AzureUserAgent: UserAgent
  AzureUser: UserPrincipalName
  AzureClientAppUsed: ClientAppUsed
  AzConditionalAccess: ConditionalAccessStatus
  AzureOperationName: OperationName
  AzureRiskDetail: RiskDetail
  AzAuthRequirement: AuthenticationRequirement
  alertSeverity: Severity
alertDetailsOverride:
  alertDisplayNameFormat: '{{AWSNetworkEntity}} from {{AWSAlertTitle}} observed in
    Azure Singins with {{UserPrincipalName}}'
  alertDescriptionFormat: "  This detection compiles and correlates unauthorized user\
    \ access alerts originating from AWS GuardDuty With Alert Description '{{AWSAlertDescription}}'\
    \ with Azure portal sign-in activities. It focuses on AWS GuardDuty alerts related\
    \ to unauthorized user access, specifically targeting network IP associations\
    \ tied to activities such as logins from malicious IP addresses or instance credential\
    \ exfiltration attempts. The detection leverages these common network IP advisories\
    \ to detect and pinpoint unauthorized users attempting to access both AWS and\
    \ Azure resources.  \n\n AWS ALert Link : '{{AWSAlertLink}}' \n\n Find More Details\
    \ :https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-active.html"
  alertSeverityColumnName: Severity
  alertDynamicProperties:
  - alertProperty: AlertLink
    value: AWSAlertLink
  - alertProperty: ProviderName
    value: AWS
  - alertProperty: ProductName
    value: AWSGuardDuty
  - alertProperty: ProductComponentName
    value: AWSGuardDuty
kind: Scheduled
version: 1.0.4
status: Available
