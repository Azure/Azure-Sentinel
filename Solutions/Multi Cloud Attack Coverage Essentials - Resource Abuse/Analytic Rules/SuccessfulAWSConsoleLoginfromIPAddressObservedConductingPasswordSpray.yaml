id: 188db479-d50a-4a9c-a041-644bae347d1f
name: Successful AWS Console Login from IP Address Observed Conducting Password Spray
description: "'This query aims to detect instances of successful AWS console login\
  \ events followed by multiple failed app logons alerts generated by Microsoft Cloud\
  \ App Security or password spray alerts generated by Defender Products.\n Specifically,\
  \ it focuses on scenarios where the successful login takes place within a 60-minute\
  \ timeframe of the high-severity alert. \n The login is considered relevant if it\
  \ originates from an IP address associated with potential attackers.'\n"
severity: Medium
requiredDataConnectors:
- connectorId: AWS
  dataTypes:
  - AWSCloudTrail
- connectorId: MicrosoftDefenderAdvancedThreatProtection
  dataTypes:
  - SecurityAlert
- connectorId: AzureActiveDirectoryIdentityProtection
  dataTypes:
  - SecurityAlert (IPC)
- connectorId: BehaviorAnalytics
  dataTypes:
  - IdentityInfo
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - SecurityAlert
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
- InitialAccess
- CredentialAccess
relevantTechniques:
- T1110
- T1078
query: "SecurityAlert \n// Filtering alerts based on Microsoft product names and Relevent\
  \ alert names\n  | where ProductName in ( \"Microsoft Cloud App Security\",\"Azure\
  \ Active Directory Identity Protection\")\n  |where AlertName in (\"Multiple failed\
  \ user log on attempts to an app\",\"Password Spray\")\n// Parsing and extending\
  \ the 'Entities' column as JSON objects\n  | extend Entities = parse_json(Entities)\
  \ \n// Exploring IP entities within the alert entities\n  | mv-apply Entity = Entities\
  \ on \n      ( \n      where Entity.Type == 'ip' \n      | extend EntityIp = tostring(Entity.Address)\
  \ \n      ) \n// Exploring account entities within the alert entities\n  | mv-apply\
  \ Entity = Entities on \n      ( \n      where Entity.Type == 'account' \n     \
  \ | extend AccountObjectId = tostring(Entity.AadUserId)\n      )\n// Filtering out\
  \ alerts with missing IP or account information\n  | where isnotempty(EntityIp)\
  \ and isnotempty(AccountObjectId)\n// Summarizing relevant fields for further analysis\n\
  \  | summarize \n      by \n      AlertName,\n      ProductName,\n      ProviderName,\n\
  \      AlertSeverity,\n      EntityIp,\n      Tactics,\n      Techniques,\n    \
  \  AlertTime= bin(TimeGenerated, 1min),\n      AccountObjectId,\n      AlertTimeGenerated=TimeGenerated\n\
  // Joining with IdentityInfo to obtain additional account details\n  | join kind=inner\
  \ (\n      IdentityInfo\n      | where TimeGenerated >= ago(1d)\n      | distinct\
  \ AccountObjectId, AccountUPN=tolower(AccountUPN)\n      )\n      on AccountObjectId\
  \ \n      |extend Name = tostring(split(AccountUPN,'@')[0]), UPNSuffix =tostring(split(AccountUPN,'@')[1])\n\
  // Joining with AWSCloudTrail data to correlate AWS console logins\n  | join kind=inner\
  \ (\n      AWSCloudTrail\n      | where EventName == \"ConsoleLogin\"\n      | extend\
  \ CTUPN= tolower(tostring(tolower(split(UserIdentityArn, \"/\", 2)[0])))\n     \
  \ | extend ActionType= tostring(parse_json(ResponseElements).ConsoleLogin)  \n \
  \     | where ActionType == \"Success\"\n      | extend AWSTime= bin(TimeGenerated,\
  \ 1min)\n      | project\n          EventName,\n          EventSource,\n       \
  \   EventTypeName,\n          RecipientAccountId,\n          ResponseElements,\n\
  \          SessionMfaAuthenticated,\n          SourceIpAddress,\n          TimeGenerated,\n\
  \          UserAgent,\n          UserIdentityArn,\n          UserIdentityType,\n\
  \          CTUPN,\n          AWSTime,\n          UserIdentityUserName\n      )\n\
  \      on $left.EntityIp == $right.SourceIpAddress \n// Filtering login event after\
  \ the Alert generation time\n  | where AlertTimeGenerated between ((AWSTime - 1h)..(AWSTime\
  \ + 1h))\n// Calculating the time difference between alert generation and AWS login\n\
  \  | extend timediff = datetime_diff('minute', AlertTimeGenerated, TimeGenerated)\
  \ \n// Filtering alerts with a time difference of up to 60 minutes\n  | where timediff\
  \ <= 60\n"
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: AccountUPN
  - identifier: Name
    columnName: Name
  - identifier: UPNSuffix
    columnName: UPNSuffix
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIpAddress
customDetails:
  AWSUser: UserIdentityArn
  UserAgent: UserAgent
  AWSUserUPN: CTUPN
kind: Scheduled
version: 1.0.1
status: Available
