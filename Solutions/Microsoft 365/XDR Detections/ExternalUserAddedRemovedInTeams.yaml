properties:
  id: xdr-bff093b2-500e-4ae5-bb49-a5b1423cbd5b
  displayName: External user added and removed in short timeframe
  status: disabled
  queryCondition:
    queryText: 'let TeamsAddDel = (Op:string){

      OfficeActivity

      | where OfficeWorkload =~ "MicrosoftTeams"

      | where Operation == Op

      | where Members has ("#EXT#")

      | mv-expand Members

      | extend UPN = tostring(Members.UPN)

      | where UPN has ("#EXT#")

      | project TimeGenerated, Operation, UPN, UserId, TeamName, ClientIP

      };

      let TeamsAdd = TeamsAddDel("MemberAdded")

      | project TimeAdded=TimeGenerated, Operation, MemberAdded = UPN, UserWhoAdded
      = UserId, TeamName, ClientIP;

      let TeamsDel = TeamsAddDel("MemberRemoved")

      | project TimeDeleted=TimeGenerated, Operation, MemberRemoved = UPN, UserWhoDeleted
      = UserId, TeamName, ClientIP;

      TeamsAdd

      | join kind=inner (TeamsDel) on $left.MemberAdded == $right.MemberRemoved

      | where TimeDeleted > TimeAdded

      | project TimeAdded, TimeDeleted, MemberAdded_Removed = MemberAdded, UserWhoAdded,
      UserWhoDeleted, TeamName, ClientIP

      | extend MemberAdded_RemovedAccountName = tostring(split(MemberAdded_Removed,
      "@")[0]), MemberAdded_RemovedAccountUPNSuffix = tostring(split(MemberAdded_Removed,
      "@")[1])

      | extend UserWhoAddedAccountName = tostring(split(UserWhoAdded, "@")[0]), UserWhoAddedAccountUPNSuffix
      = tostring(split(UserWhoAdded, "@")[1])

      | extend UserWhoDeletedAccountName = tostring(split(UserWhoDeleted, "@")[0]),
      UserWhoDeletedAccountUPNSuffix = tostring(split(UserWhoDeleted, "@")[1])'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: External user added and removed in short timeframe
      description: '''This detection flags the occurrences of external user accounts
        that are added to a Team and then removed within one hour.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: MemberAdded_RemovedAccountName
          upnSuffixColumn: MemberAdded_RemovedAccountUPNSuffix
        - id: account2
          nameColumn: UserWhoAddedAccountName
          upnSuffixColumn: UserWhoAddedAccountUPNSuffix
        - id: account3
          nameColumn: UserWhoDeletedAccountName
          upnSuffixColumn: UserWhoDeletedAccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: ClientIP
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1136
      customDetails:
        AccountFullName: MemberAdded_Removed
        AccountFullName_2: UserWhoAdded
        AccountFullName_3: UserWhoDeleted
