properties:
  id: xdr-173f8699-6af5-484a-8b06-8c47ba89b380
  displayName: Multiple Teams deleted by a single user
  status: disabled
  queryCondition:
    queryText: |-
      // Adjust this value to change how many Teams should be deleted before including
      let max_delete_count = 3;
      // Adjust this value to change the timewindow the query runs over
        OfficeActivity
      | where OfficeWorkload =~ "MicrosoftTeams"
      | where Operation =~ "TeamDeleted"
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), DeletedTeams = make_set(TeamName, 1000) by UserId
      | where array_length(DeletedTeams) > max_delete_count
      | extend AccountName = tostring(split(UserId, "@")[0]), AccountUPNSuffix = tostring(split(UserId, "@")[1])
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Multiple Teams deleted by a single user
      description: |-
        'This detection flags the occurrences of deleting multiple teams within an hour.
        This data is a part of Office 365 Connector in Microsoft Sentinel.'
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1485
        - technique: T1489
      customDetails:
        AccountFullName: UserId
