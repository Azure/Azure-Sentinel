    kind: AnalyticsRule
    id: 957cb240-f45d-4491-9ba5-93430a3c08be
    path: Analytic Rules/RareOfficeOperations.yaml
    version: 2.0.5
    querySha256: edddd5612cb9f7acd42f7e4074711a7aec449be10d9ef758a3f7843f3e7e72fe
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1d, lookback=1d; target frequency=P1D, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Account.FullName value is retained as customDetails.AccountFullName from query column `UserId`, but its target output
