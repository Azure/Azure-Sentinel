contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - OfficeActivity
  requiredDataConnectors:
  - connectorId: Office365
    dataTypes:
    - OfficeActivity (SharePoint)
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 8a547285-801c-4290-aa2e-5e7e20ca157d
    path: Analytic Rules/sharepoint_file_transfer_folders_above_threshold.yaml
    version: 1.0.6
    querySha256: 25f80b17b3e56f3d616127578245a6746dbc70109d871a36ca45c08838d1df0d
    schedule:
      queryFrequency: 15m
      queryPeriod: 15m
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=15m, lookback=15m; target frequency=PT15M, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - customDetails 'TransferCount' column `count_distinct_SourceRelativeUrl` requires runtime output-schema binding verification
    - customDetails 'FilesList' column `dirlist` requires runtime output-schema binding verification
    - Account.FullName value is retained as customDetails.AccountFullName from query column `UserId`, but its target output
