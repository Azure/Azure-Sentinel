contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - OfficeActivity
  requiredDataConnectors:
  - connectorId: Office365
    dataTypes:
    - OfficeActivity (SharePoint)
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 8b4f03e7-3460-4401-824d-e65a8dd464f0
    path: Analytic Rules/sharepoint_file_transfer_above_threshold.yaml
    version: 1.0.6
    querySha256: aad143c7440987fd5d4dffa9d5c52c0c853edcc803f050e8cf92cbc61f882579
    schedule:
      queryFrequency: 15m
      queryPeriod: 15m
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=15m, lookback=15m; target frequency=PT15M, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - customDetails 'TransferCount' column `count_distinct_OfficeObjectId` requires runtime output-schema binding verification
    - customDetails 'FilesList' column `fileslist` requires runtime output-schema binding verification
    - Account.FullName value is retained as customDetails.AccountFullName from query column `UserId`, but its target output
      binding requires runtime-schema verification; custom details do not restore entity identity or correlation
    - Supplemental customDetails.AccountFullName column `UserId` requires runtime output-schema binding verification
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified
      and the service drops all custom details if exceeded
