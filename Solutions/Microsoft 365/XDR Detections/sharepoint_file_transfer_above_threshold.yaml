    reviewScope:
      sourceDocumentSha256: 4d5d35817bc0bf3c51b04eaeba1dc53b615740a250a6f91e80c8f841c13509fa
      targetQuerySha256: 645f2b92303b0519234d37aaec374dc7d0d94477fe888545ebce408af47d0e13
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 1
