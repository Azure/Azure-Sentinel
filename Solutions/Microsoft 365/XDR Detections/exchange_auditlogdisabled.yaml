  dataTypes:
  - OfficeActivity (Exchange)
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - OfficeActivity
  requiredDataConnectors:
  - connectorId: Office365
    dataTypes:
    - OfficeActivity (Exchange)
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 194dd92e-d6e7-4249-85a5-273350a7f5ce
    path: Analytic Rules/exchange_auditlogdisabled.yaml
    version: 2.0.6
    querySha256: abdbca8ecb1eab448be60e6742ed7154546bfdc41b3af6496dcb892ce1be7190
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1d, lookback=1d; target frequency=P1D, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Account mapping was completed with projected column `AccountUPNSuffix`
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified
      and the service drops all custom details if exceeded
    informational:
    - Account.FullName mismatch is informational because its original value is preserved as customDetails.AccountFullName
      from query column `UserId`; supplemental details do not restore entity identity, correlation, or alert parity
    errors: []
    originalTactics:
    - DefenseEvasion
    originalTechniques:
    - T1562
    reviewScope:
      sourceDocumentSha256: 2caf366b63da451d954b3b90ed7c3682362774118bc105cd31700edcdb45bef5
      targetQuerySha256: dd60c5c3a2db92d4dfc5b423a2f9328ff815f78a570ef91fbdf7ee0da9574cb2
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 1
