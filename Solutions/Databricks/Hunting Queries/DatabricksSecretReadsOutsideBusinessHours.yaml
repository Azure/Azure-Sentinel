id: 2d6e8f1a-4c7b-4e9d-b3a5-6f0c1e2d9b74
name: Databricks - Secret reads outside business hours
description: |
  Lists reads of Databricks secrets (getSecret) between 19:00 and 07:00 UTC in the last 7 days, grouped by user and source IP. Secret reads at unusual hours from unusual addresses can indicate credential harvesting from notebooks or jobs. Adjust the hours to the customer's time zone.
requiredDataConnectors:
  - connectorId: DatabricksAuditLogs
    dataTypes:
      - DatabricksAudit_CL
tactics:
  - CredentialAccess
relevantTechniques:
  - T1552
query: |
  DatabricksAudit_CL
  | where TimeGenerated > ago(7d)
  | where ServiceName == "secrets" and ActionName == "getSecret"
  | where hourofday(EventTime) !between (7 .. 19)
  | extend Scope = tostring(RequestParams.scope), Key = tostring(RequestParams.key)
  | summarize Reads = count(), Scopes = make_set(Scope, 20), Keys = make_set(Key, 50), FirstSeen = min(EventTime), LastSeen = max(EventTime)
      by UserEmail, SourceIPAddress, WorkspaceId
  | order by Reads desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserEmail
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIPAddress
version: 1.0.0
