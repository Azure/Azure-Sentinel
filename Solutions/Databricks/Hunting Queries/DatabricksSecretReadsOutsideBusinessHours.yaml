id: 2d6e8f1a-4c7b-4e9d-b3a5-6f0c1e2d9b74
name: Databricks - Secret reads outside business hours
description: |
  Lists Databricks secret reads (getSecret) from 19:00 to 07:00 UTC in the last 7 days, by user and source IP. Off-hours reads can indicate credential harvesting. Adjust the hours to your time zone.
requiredDataConnectors:
  - connectorId: DatabricksAuditLogs
    dataTypes:
      - DatabricksAudit_CL
tactics:
  - CredentialAccess
relevantTechniques:
  - T1552
query: |
  DatabricksAudit_CL
  | where TimeGenerated > ago(7d)
  | where ServiceName == "secrets" and ActionName == "getSecret"
  | where hourofday(EventTime) < 7 or hourofday(EventTime) >= 19
  | extend Scope = tostring(RequestParams.scope), Key = tostring(RequestParams.key)
  | summarize Reads = count(), Scopes = make_set(Scope, 20), Keys = make_set(Key, 50), FirstSeen = min(EventTime), LastSeen = max(EventTime)
      by UserEmail, SourceIPAddress, WorkspaceId
  | order by Reads desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserEmail
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIPAddress
version: 1.0.0
