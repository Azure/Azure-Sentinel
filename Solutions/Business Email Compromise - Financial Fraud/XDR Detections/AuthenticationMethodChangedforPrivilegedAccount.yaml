properties:
  id: xdr-feb0a2fb-ae75-4343-8cbc-ed545f1da289
  displayName: Authentication Method Changed for Privileged Account
  status: disabled
  queryCondition:
    queryText: 'let VIPUsers = (IdentityInfo

      | where AssignedRoles contains "Admin"

      | summarize by tolower(AccountUpn));

      AuditLogs

      | where TimeGenerated > ago(2h)

      | where Category =~ "UserManagement"

      | where ActivityDisplayName =~ "User registered security info"

      | where LoggedByService =~ "Authentication Methods"

      | extend TargetUserPrincipalName = tostring(TargetResources[0].userPrincipalName)

      | where tolower(TargetUserPrincipalName) in (VIPUsers)

      | extend TargetAadUserId = tostring(TargetResources[0].id)

      | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)

      | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)

      | extend InitiatingIPAddress = tostring(InitiatedBy.user.ipAddress)

      | extend TargetAccountName = tostring(split(TargetUserPrincipalName, "@")[0]),
      TargetAccountUPNSuffix = tostring(split(TargetUserPrincipalName, "@")[1])

      | extend InitiatingAccountName = tostring(split(InitiatingUserPrincipalName,
      "@")[0]), InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName,
      "@")[1])'
  schedule:
    frequency: PT2H
  detectionAction:
    alertTemplate:
      title: Authentication Method Changed for Privileged Account
      description: '''Identifies authentication methods being changed for a privileged
        account. This could be an indication of an attacker adding an auth method
        to the account so they can have continued access.

        Ref : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-privileged-accounts#things-to-monitor-1'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: TargetAccountName
          upnSuffixColumn: TargetAccountUPNSuffix
        - id: account2
          aadUserIdColumn: TargetAadUserId
        - id: account3
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account4
          aadUserIdColumn: InitiatingAadUserId
        ips:
        - id: ip1
          addressColumn: InitiatingIPAddress
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1098
      customDetails:
        AccountFullName: TargetUserPrincipalName
        AccountFullName_2: InitiatingUserPrincipalName
