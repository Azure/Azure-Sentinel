properties:
  id: xdr-0433c8a3-9aa6-4577-beef-2ea23be41137
  displayName: Privileged Account Permissions Changed
  status: disabled
  queryCondition:
    queryText: "let admin_users = (IdentityInfo\n  | where Timestamp > ago(2d)\n \
      \ | summarize arg_max(Timestamp, *) by AccountUpn\n  | where AssignedRoles contains\
      \ \"admin\" or GroupMembership has \"Admin\"\n  | summarize by tolower(AccountUpn));\n\
      \  AuditLogs\n  | where Category =~ \"RoleManagement\"\n  | where OperationName\
      \ has \"Add eligible member\"\n  | extend TargetUserPrincipalName = tostring(TargetResources[0].userPrincipalName)\n\
      \  | where tolower(TargetUserPrincipalName) in (admin_users)\n  | extend TargetAadUserId\
      \ = tostring(TargetResources[0].id)\n  | extend Group = tostring(TargetResources[0].displayName)\n\
      \  | extend RoleAddedTo = iif(isnotempty(TargetUserPrincipalName), TargetUserPrincipalName,\
      \ Group)\n  | extend mod_props = TargetResources[0].modifiedProperties\n  |\
      \ extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n  | extend\
      \ InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n\
      \  | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n\
      \  | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n  | extend\
      \ InitiatingIPAddress = tostring(InitiatedBy.user.ipAddress)\n  | extend RoleAddedBy\
      \ = iif(isnotempty(InitiatingAppName), InitiatingAppName, InitiatingUserPrincipalName)\n\
      \  | mv-expand mod_props\n  | where mod_props.displayName == \"Role.DisplayName\"\
      \n  | extend UserAgent = tostring(AdditionalDetails[0].value)\n  | extend RoleAdded\
      \ = tostring(parse_json(tostring(mod_props.newValue)))\n  | extend TargetAccountName\
      \ = tostring(split(TargetUserPrincipalName, \"@\")[0]), TargetAccountUPNSuffix\
      \ = tostring(split(TargetUserPrincipalName, \"@\")[1])\n  | extend InitiatingAccountName\
      \ = tostring(split(InitiatingUserPrincipalName, \"@\")[0]), InitiatingAccountUPNSuffix\
      \ = tostring(split(InitiatingUserPrincipalName, \"@\")[1])\n  | project-reorder\
      \ TimeGenerated, OperationName, TargetUserPrincipalName, RoleAddedTo, RoleAdded,\
      \ RoleAddedBy, InitiatingUserPrincipalName, InitiatingAppName"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Privileged Account Permissions Changed
      description: '''Detects changes to permissions assigned to admin users. Threat
        actors may try and increase permission scope by adding additional roles to
        already privileged accounts.

        Review any modifications to ensure they were made legitimately.

        Ref: https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-privileged-accounts#changes-to-privileged-accounts'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: TargetAccountName
          upnSuffixColumn: TargetAccountUPNSuffix
        - id: account2
          aadUserIdColumn: TargetAadUserId
        - id: account3
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account4
          aadUserIdColumn: InitiatingAadUserId
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      customDetails:
        AccountFullName: TargetUserPrincipalName
        AccountFullName_2: InitiatingUserPrincipalName
