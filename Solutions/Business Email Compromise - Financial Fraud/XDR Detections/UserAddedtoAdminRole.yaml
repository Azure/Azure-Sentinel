properties:
  id: xdr-2a09f8cb-deb7-4c40-b08b-9137667f1c0b
  displayName: User Added to Admin Role
  status: disabled
  queryCondition:
    queryText: "AuditLogs\n  | where OperationName in (\"Add eligible member (permanent)\"\
      , \"Add eligible member (eligible)\", \"Add member to role\")\n  | mv-apply\
      \ TargetResource = TargetResources on\n  (\n      where TargetResource.type\
      \ =~ \"User\"\n      | extend Target = tostring(TargetResource.userPrincipalName),\n\
      \               props = TargetResource.modifiedProperties\n  )\n  | mv-apply\
      \ Property = props on\n  (\n      where Property.displayName =~ \"Role.DisplayName\"\
      \n      | extend RoleName = trim('\"',tostring(Property.newValue))\n  )\n  |\
      \ where RoleName contains \"admin\"\n  | extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n\
      \  | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n\
      \  | extend InitiatingUserPrincipalName = tostring(InitiatedBy.user.userPrincipalName)\n\
      \  | extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n  | extend\
      \ InitiatingIPAddress = tostring(InitiatedBy.user.ipAddress)\n  | extend InitiatedBy\
      \ = iif(isnotempty(InitiatingAppName), InitiatingAppName, InitiatingUserPrincipalName)\n\
      \  | extend TargetUserPrincipalName = iff(OperationName==\"Add member to role\"\
      ,tostring(TargetResources[0].userPrincipalName),tostring(TargetResources[2].userPrincipalName))\n\
      \  | extend TargetAadUserId = iff(OperationName==\"Add member to role\", tostring(TargetResources[0].id),\
      \ tostring(TargetResources[2].id))\n  | extend AddedUser = TargetUserPrincipalName\n\
      \  | extend TargetAccountName = tostring(split(TargetUserPrincipalName, \"@\"\
      )[0]), TargetAccountUPNSuffix = tostring(split(TargetUserPrincipalName, \"@\"\
      )[1])\n  | extend InitiatingAccountName = tostring(split(InitiatingUserPrincipalName,\
      \ \"@\")[0]), InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName,\
      \ \"@\")[1])\n  | project-reorder TimeGenerated, AddedUser, RoleName, InitiatedBy"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: User Added to Admin Role
      description: "'Detects a user being added to a new privileged role. Monitor\
        \ these additions to ensure the users are made eligible for these roles are\
        \ intended to have these levels of access.\n  Ref: https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-privileged-accounts#changes-to-privileged-accounts'"
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: TargetAccountName
          upnSuffixColumn: TargetAccountUPNSuffix
        - id: account2
          aadUserIdColumn: TargetAadUserId
        - id: account3
          nameColumn: InitiatingAccountName
          upnSuffixColumn: InitiatingAccountUPNSuffix
        - id: account4
          aadUserIdColumn: InitiatingAadUserId
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      customDetails:
        AccountFullName: TargetUserPrincipalName
        AccountFullName_2: InitiatingUserPrincipalName
