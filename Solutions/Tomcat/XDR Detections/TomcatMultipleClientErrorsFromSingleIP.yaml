properties:
  id: xdr-4fa66058-4870-11ec-81d3-0242ac130003
  displayName: Tomcat - Multiple client errors from single IP address
  status: disabled
  queryCondition:
    queryText: 'let threshold = 100;

      TomcatEvent

      | where HttpStatusCode >= 400 and HttpStatusCode <= 499

      | summarize MultipleClientErrors = count() by SrcIpAddr, bin(TimeGenerated, 5m)

      | where MultipleClientErrors > threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Tomcat - Multiple client errors from single IP address
      description: '''Detects multiple client errors from one source in short timeframe'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
