properties:
  id: xdr-de9df79c-4872-11ec-81d3-0242ac130003
  displayName: Tomcat - Multiple server errors from single IP address
  status: disabled
  queryCondition:
    queryText: 'let threshold = 100;

      TomcatEvent

      | where HttpStatusCode >= 500 and HttpStatusCode <= 599

      | summarize MultipleServerErrors = count() by SrcIpAddr, bin(TimeGenerated, 5m)

      | where MultipleServerErrors > threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Tomcat - Multiple server errors from single IP address
      description: '''Detects multiple server errors from one source in short timeframe'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1498
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
