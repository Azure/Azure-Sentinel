properties:
  id: xdr-7c9a1026-4872-11ec-81d3-0242ac130003
  displayName: Tomcat - Multiple empty requests from same IP
  status: disabled
  queryCondition:
    queryText: 'let threshold = 50;

      TomcatEvent

      | where HttpResponseBodyBytes == 0

      | summarize MultipleClientErrors = count() by SrcIpAddr, bin(TimeGenerated, 5m)

      | where MultipleClientErrors > threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Tomcat - Multiple empty requests from same IP
      description: '''Detects multiple empty requests from same IP'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
      - tactic: Impact
        techniques:
