properties:
  id: xdr-0c851bd4-4875-11ec-81d3-0242ac130003
  displayName: Tomcat - Request to sensitive files
  status: disabled
  queryCondition:
    queryText: 'let forbidden_files = dynamic([''shadow'', ''passwd'', ''id_rsa'']);

      TomcatEvent

      | extend File = extract(@''(.*\/)?(.*)'', 2, tostring(UrlOriginal))

      | where File in (forbidden_files)

      | extend FileCustomEntity = File, UrlCustomEntity = UrlOriginal, IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Tomcat - Request to sensitive files
      description: '''Detects request to sensitive files.'''
      severity: high
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlCustomEntity
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1189
