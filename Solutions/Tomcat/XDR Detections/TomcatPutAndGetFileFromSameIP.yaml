properties:
  id: xdr-103d5ada-4874-11ec-81d3-0242ac130003
  displayName: Tomcat - Put file and get file from same IP address
  status: disabled
  queryCondition:
    queryText: 'let p = TomcatEvent

      | where HttpRequestMethod in~ (''POST'', ''PUT'')

      | sort by EventStartTime asc

      | summarize post_time=min(EventStartTime) by SrcIpAddr, tostring(UrlOriginal);

      TomcatEvent

      | where HttpRequestMethod =~ ''GET''

      | sort by EventStartTime asc

      | summarize get_time=min(EventStartTime) by SrcIpAddr, tostring(UrlOriginal)

      | join kind=innerunique (p) on UrlOriginal, SrcIpAddr

      | extend second = datetime_diff(''second'',get_time,post_time)

      | where second between (1 .. 300)

      | project second, post_time, get_time, SrcIpAddr, UrlOriginal

      | extend IPCustomEntity = SrcIpAddr, UrlCustomEntity = tostring(UrlOriginal)'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Tomcat - Put file and get file from same IP address
      description: '''Detects put or get files from one source in short timeframe'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
        urls:
        - id: url1
          addressColumn: UrlCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
