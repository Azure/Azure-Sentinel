id: 4cc23b15-a048-45f1-b1e8-2dfc40013d84
kind: Scheduled
name: SAP - Sensitive User's Password Change and Log in
description: |
  Identifies password changes and other master record changes made to privileged users which are later exploited by the admin.

  Source Action: Change Password or maintain a privileged user and then login with the same user from the same IP address.

  Privileged users should be maintained in "SAP - Privileged Users" Watchlist

  This rule requires a fresh full reload of SAP user master data to be performed daily.
  *Data Sources: SAPcon -  Audit Log*
  *Data Sources: SAPcon -  User MD*
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SAPCC
    dataTypes:
      - SAPAuditLog
      - SAPGetSourceIdentifier
      - SAPSystems
      - SAPUsersGetSensitive
      - SAPUsersGetVIP
      - SAPUsersHeader
queryFrequency: 1h
queryPeriod: 2d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
  - CommandAndControl
  - PrivilegeEscalation
relevantTechniques: []
query: |
  // SAP - High - Sensitive Users Password Change and Login
  // IMPORTANT!!! The alert rule's "lookup data from the last" parameter needs to be greater than both of these time spans:
  let CreationLookBack= 75m;// lookback for user creation/ modification to be alerted on
  let LogOnLookBack= 2d; // further lookback to evaluate known IP address
  // true- include sensitive users, like those who have sensitive roles or profiles listed
  // false- only focus on users that are listed in the "SAP - Privileged Users" WL or have SAP_ALL
  let IncludeSensitiveUsers= false;
  // here you can exclude system users which are OK to execute this action
  // by adding those users in the SAP_User_Config watchlist with a tag of 'CreateUsersAndUseOK'
  // can also specify relevant SAP Roles or Profiles to exclude
  let excludeUsersTags= dynamic(['CreateUsersAndUseOK']);// dynamic(['CreateUsersAndUseOK','SAP_ALL']);
  let excludedUsers= SAPUsersGetVIP(SearchForTags= excludeUsersTags)
      | summarize by User=SAPUser;
  let SelectedSystemRoles = dynamic(["Production", "UAT"]); //can also do// let SelectedSystemRoles =  dynamic(["Production"]); dynamic(["All System Roles"])
  let SelectedSystems = SAPSystems(SelectedSystemRoles= SelectedSystemRoles)
      | project SystemID= SearchKey, SystemRole;
  let AuditLogIn = dynamic(['AU1', 'AU5']); // Messages of connect with user
  let AuditUserMaintain = dynamic(['BU2', 'AUD']); // Message of user password change, maintenance
  let SensitivePrivilegedUsers= materialize(SAPUsersGetSensitive()
      | join kind=inner SelectedSystems on SystemID
      | where IsPrivileged or IncludeSensitiveUsers
      | summarize IsPrivileged=max(IsPrivileged) by UserGotChanged=User, SystemID, ClientID= Client);
  let PrivUserModifications=materialize(SAPAuditLog
      | where TimeGenerated > ago(CreationLookBack)
      | where SystemID in (SelectedSystems)
      | where MessageID in (AuditUserMaintain)
      | where isnotempty(TerminalIPv6)
      | join kind=leftantisemi excludedUsers on User
      | extend UserGotChanged=iff(MessageID == "BU2", Variable2, Variable1)
      | join kind= inner SensitivePrivilegedUsers on UserGotChanged, SystemID, ClientID
      | project-rename UserChanger= User
      | where UserChanger != UserGotChanged
      | extend Action=iff(MessageID == "BU2", "'s password was changed", "'s authorization maintained"));
  let UsersHeaders= materialize(SAPUsersHeader()
      | join kind=inner (PrivUserModifications
          | distinct UserChanger, UserGotChanged
          | evaluate narrow()
          | distinct User= Value)
          on User
      | where isnotempty(PrimaryIP) and LastSeen > ago(CreationLookBack + LogOnLookBack)
      | summarize
          KnownIPs=make_set(KnownIPs),
          PrimaryEmail=make_set_if(PrimaryEmail, isnotempty(PrimaryEmail))
          by User);
  PrivUserModifications
  // get logon details for UserCreator, cross-client
  | lookup UsersHeaders on $left.UserChanger == $right.User
  | project-rename KnownIPsChangerUser= KnownIPs, ChangerEmail= PrimaryEmail
  // get logon details for UserCreated
  | lookup UsersHeaders on $left.UserGotChanged == $right.User
  | project-rename KnownIPsChangedUser= KnownIPs, ChangedEmail= PrimaryEmail
  | extend IPsIntersected= set_intersect(KnownIPsChangerUser, KnownIPsChangedUser)
  | where array_length(IPsIntersected) > 0
  | lookup SelectedSystems on SystemID
  | lookup SensitivePrivilegedUsers on UserGotChanged
  | extend AlertName= strcat(iff(IsPrivileged, "SAP - privileged user ", "SAP - sensitive user "), UserGotChanged, Action, " and then used by ", UserChanger, " in a ", tolower(SystemRole), " system")
  | extend Severity= iff(IsPrivileged, "High", "Medium")
  | mv-expand IPIntersected= IPsIntersected to typeof(string)
  | extend IPGeoLocation= geo_info_from_ip_address(IPIntersected)
  | extend AlertDescription= strcat(trim_end(@"\.", MessageText)," by User ", UserChanger, ".\n Both users were observed using the same IP address: ", IPIntersected, ".\n"
  , iff(IPGeoLocation != ("{}"), strcat(".\n Geo location: ", IPGeoLocation), ""))
  | project
      UserChanger,
      UserGotChanged,
      TimeChanged=UpdatedOn_t,
      ChangerEmail= coalesce(Email, tostring(ChangerEmail[0])),
      ChangedEmail= ChangedEmail[0],
      Instance,
      Host,
      SystemID,
      ClientID,
      IPsIntersected,
      AlertName,
      AlertDescription,
      Severity
  | extend SourceIdentifier= trim("-", strcat_delim("-","SAP", column_ifexists("SystemID", ""), column_ifexists("ClientID", ""), toscalar(SAPGetSourceIdentifier() | project SourceIdentifier)))
eventGroupingSettings:
  aggregationKind: AlertPerResult
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: ChangerEmail
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: Host
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPsIntersected
  - entityType: CloudApplication
    fieldMappings:
      - identifier: Name
        columnName: SourceIdentifier
alertDetailsOverride:
  alertDisplayNameFormat: '{{AlertName}} '
  alertDescriptionFormat: |+
    Identifies password changes and other master record changes for privileged users which are later exploited by the admin.

    {{AlertDescription}}
    Privileged users can be maintained in "SAP - Privileged Users" Watchlist.

customDetails:
  SAP_User: UserChanger
  SAP_User2: UserGotChanged
version: 3.5.09
