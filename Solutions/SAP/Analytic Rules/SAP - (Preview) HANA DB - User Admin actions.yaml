id: 3ba35622-3071-477e-9af9-5380bce25e1e
kind: Scheduled
name: SAP - (Preview) HANA DB - User Admin actions
description: |
  Identifies user administration actions.

  Souirce Action: Create/Update/Delete a DB User.

  *Data Sources: Linux Agent - Syslog*
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SAPCC
    dataTypes:
      - SAPGetSourceIdentifier
      - SAPSyslog
queryFrequency: 3h
queryPeriod: 3h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - PrivilegeEscalation
relevantTechniques: []
query: |
  SAPSyslog
  | where ProcessName startswith "HDB"
  | where SyslogMessage contains "CREATE USER" or
      SyslogMessage contains 'ALTER USER' or
      SyslogMessage contains 'DROP USER' or
      SyslogMessage contains 'DROP SCHEMA'
  | extend AlertRuleUniqueName = 'hanadb-useradminactions'
  | extend SourceIdentifier= trim("-", strcat_delim("-","SAP", column_ifexists("SystemID", ""), column_ifexists("ClientID", ""), toscalar(SAPGetSourceIdentifier() | project SourceIdentifier)))
eventGroupingSettings:
  aggregationKind: AlertPerResult
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostName
  - entityType: Process
    fieldMappings:
      - identifier: ProcessId
        columnName: ProcessID
  - entityType: CloudApplication
    fieldMappings:
      - identifier: Name
        columnName: SourceIdentifier
version: 3.5.09
