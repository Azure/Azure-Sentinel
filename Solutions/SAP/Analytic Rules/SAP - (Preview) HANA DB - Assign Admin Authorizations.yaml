id: 2d7cbb53-cb18-4c9e-8855-c5393aa91db0
kind: Scheduled
name: SAP - (Preview) HANA DB - Assign Admin Authorizations
description: |
  Identifies admin privileges/roles assignment.

  Source Action: Assign a user with any Admin role / privileges.

  *Data Sources: Linux Agent - Syslog*
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SAPCC
    dataTypes:
      - SAPGetSourceIdentifier
      - SAPSyslog
queryFrequency: 3h
queryPeriod: 3h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - PrivilegeEscalation
relevantTechniques: []
query: |
  SAPSyslog
  | where ProcessName startswith "HDB"
  | where SyslogMessage contains "ADMIN" and (SyslogMessage contains "GRANT PRIVILEGE" or SyslogMessage contains "GRANT ROLE")
  | extend AlertRuleUniqueName = 'hanadb-assignadminauthorizations'
  | extend SourceIdentifier= trim("-", strcat_delim("-","SAP", column_ifexists("SystemID", ""), column_ifexists("ClientID", ""), toscalar(SAPGetSourceIdentifier() | project SourceIdentifier)))
eventGroupingSettings:
  aggregationKind: AlertPerResult
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostName
  - entityType: Process
    fieldMappings:
      - identifier: ProcessId
        columnName: ProcessID
  - entityType: CloudApplication
    fieldMappings:
      - identifier: Name
        columnName: SourceIdentifier
version: 3.5.09
