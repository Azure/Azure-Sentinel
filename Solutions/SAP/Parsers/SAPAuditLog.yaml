Contentkind: Function
Description: SAPAuditLog
Function:
  Title: SAPAuditLog
  Version: 3.4.06
  LastUpdated: '2025-11-04'
Category: SAPFunctions
FunctionName: SAPAuditLog
FunctionQuery: |
  //generated function structure for ABAPAuditLog
  let initialString= '';
  let initialDecimal= 0.0;
  let Now= now();
  // a warning for ABAPAuditLog_CL is expected if you are using the Agentless connector as this custom log was used by the deprecated agent data connector
  let AuditUnion= union isfuzzy= true ABAPAuditLog, ABAPAuditLog_CL
  | project
   SAL_DATE = coalesce(SalDateChar8, column_ifexists('SAL_DATE_s', ''), column_ifexists('MSCDATE_s', ''))
  ,SAL_TIME = coalesce(SalTimeChar6, column_ifexists('SAL_TIME_s', ''), column_ifexists('MSCTIME_s', ''))
  ,UpdatedOn_t = coalesce(UpdatedOn, column_ifexists('UpdatedOn_t', TimeGenerated))
  ,AuditClassID = coalesce(AuditClassId, column_ifexists('AuditClassID_d', initialDecimal))
  ,AlertSeverityText = coalesce(AlertSeverityText, column_ifexists('AlertSeverityText_s', initialString))
  ,SystemID = coalesce(SystemId, column_ifexists('SystemID_s', initialString))
  ,Instance = coalesce(Instance, column_ifexists('Instance_s', initialString))
  ,MonitoringObjectName =coalesce(MonitoringObjectName, column_ifexists('MonitoringObjectName_s', initialString))
  ,MonitorShortName = coalesce(MonitorShortName, column_ifexists('MonitorShortName_s', initialString))
  ,MessageText = coalesce(MessageText, column_ifexists('MessageText_s', initialString))
  ,MessageClass = coalesce(MessageClass, column_ifexists('MessageClass_s', initialString))
  ,MessageID = coalesce(MessageId, column_ifexists('MessageID_s', initialString))
  ,MessageContainerID = coalesce(MessageContainerId, column_ifexists('MessageContainerID_s', initialString))
  ,AlertValue = coalesce(AlertValue, column_ifexists('AlertValue_d', initialDecimal))
  ,AlertSeverity = coalesce(AlertSeverity, column_ifexists('AlertSeverity_d', initialDecimal))
  ,ClientID = coalesce(ClientId, column_ifexists('ClientID_s', initialString))
  ,User = coalesce(User, column_ifexists('User_s', initialString))
  ,Variable1 = coalesce(Variable1, column_ifexists('Variable1_s', initialString))
  ,Variable2 = coalesce(Variable2, column_ifexists('Variable2_s', initialString))
  ,Variable3 = coalesce(Variable3, column_ifexists('Variable3_s', initialString))
  ,Variable4 = coalesce(Variable4, column_ifexists('Variable4_s', initialString))
  ,TerminalIPv6 = coalesce(TerminalIpV6, column_ifexists('TerminalIPv6_s', initialString))
  ,TransactionCode = coalesce(TransactionCode, column_ifexists('TransactionCode_s', initialString))
  ,ABAPProgramName = coalesce(AbapProgramName, column_ifexists('ABAPProgramName_s', initialString))
  ,SAPProcesType = coalesce(SapProcessType, column_ifexists('SAPProcesType_s', initialString))
  ,SAPWPName = coalesce(SapWorkProcessName, column_ifexists('SAPWPName_s', initialString))
  ,Email = coalesce(Email, column_ifexists('Email_s', initialString))
  ,SystemNumber = coalesce(SystemNumber, column_ifexists('SystemNumber_s', initialString))
  ,Host = coalesce(Host, column_ifexists('Host_s', initialString))
  ,TERM_IPV6= coalesce(SalIpAddress, column_ifexists('TERM_IPV6_s', initialString))
  ,SidGuid = coalesce(SystemUniqueId, column_ifexists('SidGuid_g', ''), column_ifexists('SidGuid_s', ''))
  ,AgentGuid= coalesce(AgentId, column_ifexists('AgentGuid_g', initialString))
  ,ClientCategory= coalesce(SystemRole, column_ifexists('ClientCategory_s', initialString))
  ,RemoteIpCountry
  ,RemoteIpLatitude
  ,RemoteIpLongitude
  ,Type
  ,Computer
  ,TimeGenerated
  | extend Email = iff(isempty(Email), User, Email)
  | extend Host = iff(isempty(Host), TerminalIPv6, Host);
  AuditUnion
