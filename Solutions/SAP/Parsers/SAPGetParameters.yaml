Contentkind: Function
Description: SAPGetParameters
Function:
  Title: SAPGetParameters
  Version: 3.3.0
  LastUpdated: '2025-02-16'
Category: SAPFunctions
FunctionName: SAPGetParameters
FunctionParams:
  - Name: ParameterName
    Type: string
    Default: '*'
  - Name: ParameterType
    Type: string
    Default: '*'
FunctionQuery: "// let ParameterType= 'Static';\n// let ParameterName= 'UserMDLookBack';\n\
  let ParametersTable= datatable ( Parameter_Type: string, Parameter_Name: string,\
  \ \tValueLow: string, ValueHigh: string , ValueOPT:string, ValueSIGN:string, Tags:\
  \ dynamic )\n[ 'Static', 'UserMDLookBack', '1439m', '', '', '', ''\n,'Static', 'UserHeaderAuditLookBack',\
  \ '3d', '', '', '', ''\n,'Static', 'HearbeatTimeAgo', '1d', '', '', '', ''\n,'Static',\
  \ 'SolutionVersion', '3.0.4', '', '', '', ''\n];\nParametersTable\n| where Parameter_Type==ParameterType\
  \ or ParameterType == '*'\n| where  Parameter_Name== ParameterName or ParameterName\
  \ == '*'\n| project-rename ParameterName=Parameter_Name, ParameterType= Parameter_Type;\n"
