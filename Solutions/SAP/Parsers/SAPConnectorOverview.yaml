Contentkind: Function
Description: SAPConnectorOverview
Function:
  Title: SAPConnectorOverview
  Version: 3.0.0
  LastUpdated: '2023-11-17'
Category: SAPFunctions
FunctionName: SAPConnectorOverview
FunctionParams:
  - Name: DaysAgo
    Type: timespan
    Default: 14d
FunctionQuery: |
  union isfuzzy=true
  ABAPAppLog_CL,
  ABAPAuditLog_CL,
  ABAPCRLogHeader_CL,
  ABAPCRLogLine_CL,
  ABAPCRLog_CL,
  ABAPChangeDocsLog_CL,
  ABAPFilesLogs_CL,
  ABAPJobLog_CL,
  ABAPOS_GW_CL,
  ABAPOS_ICM_CL,
  ABAPOS_Syslog_CL,
  ABAPOS_WP_CL,
  ABAPSpoolLog_CL,
  ABAPSpoolOutputLog_CL,
  ABAPTableDataLog_CL,
  ABAPWorkflowLog_CL,
  ABAP_ADCP_CL,
  ABAP_ADR6_CL,
  ABAP_AGR_1251_CL,
  ABAP_AGR_AGRS_CL,
  ABAP_AGR_DEFINE_CL,
  ABAP_AGR_FLAGS_CL,
  ABAP_AGR_PROF_CL,
  ABAP_AGR_TCODES_CL,
  ABAP_AGR_USERS_CL,
  ABAP_DEVACCESS_CL,
  ABAP_PAHI_CL,
  ABAP_USGRP_USER_CL,
  ABAP_USR01_CL,
  ABAP_USR02_CL,
  ABAP_USR05_CL,
  ABAP_USR21_CL,
  ABAP_UST04_CL,
  SAP_HeartBeat_CL,
  SecurityAlert
  | where Type != 'SecurityAlert'
  | where TimeGenerated > ago(DaysAgo)
  | extend SystemID_s= column_ifexists('SystemID_s','No system found')
  | project TimeGenerated, SystemID_s, Type
