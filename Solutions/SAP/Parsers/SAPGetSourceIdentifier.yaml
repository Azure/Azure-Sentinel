Contentkind: Function
Description: SAPGetSourceIdentifier
Function:
  Title: SAPGetSourceIdentifier
  Version: 3.4.08
  LastUpdated: '2025-12-17'
Category: SAPFunctions
FunctionName: SAPGetSourceIdentifier
FunctionQuery: |
  SAPAuditLog()
  // get most frequent AgentId
  | top-hitters 1 of AgentGuid
  | extend AgendIdIsGUID= isnotnull(toguid(AgentGuid))
  | extend AgendIdIsURL= isnotempty(parse_url(AgentGuid)["Scheme"])
  // the SAP Solution can have either GUIDS, Blanks or URL for agentGuid. Antything other than that should be added to SourceIdentifier
  | project SourceIdentifier= iff(AgendIdIsGUID or AgendIdIsURL or isempty( AgentGuid), "", AgentGuid)
