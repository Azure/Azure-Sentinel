Contentkind: Function
Description: SAPChangeDocsLog
Function:
  Title: SAPChangeDocsLog
  Version: 3.4.06
  LastUpdated: '2025-11-04'
Category: SAPFunctions
FunctionName: SAPChangeDocsLog
FunctionQuery: |
  let initialString= '';
  // a warning for ABAPChangeDocsLog_CL is expected if you are using the Agentless connector as this custom log was used by the deprecated agent data connector
  union isfuzzy=true ABAPChangeDocsLog, ABAPChangeDocsLog_CL
  | project
  TimeGenerated = coalesce(TimeGenerated, column_ifexists('TimeGenerated', todatetime('1000-01-01T00:00:00Z')))
  ,UDATE = column_ifexists('UDATE_s', initialString)
  ,UTIME = column_ifexists('UTIME_s', initialString)
  ,UpdatedOn_t = coalesce(UpdatedOn ,todatetime(column_ifexists('UpdatedOn_t', '1000-01-01T00:00:00Z')))
  ,SidGuid= coalesce(SystemUniqueId, column_ifexists('SidGuid_g',initialString))
  ,ClientID = coalesce(ClientId, column_ifexists('ClientID_s', initialString))
  ,ObjectClass = coalesce(ObjectClass, column_ifexists('ObjectClass_s', initialString))
  ,ObjectID = coalesce(ObjectId, column_ifexists('ObjectID_s', initialString))
  ,ChangeNumber = coalesce(ChangeNumber, column_ifexists('ChangeNumber_s', initialString))
  ,User = coalesce(User, column_ifexists('User_s', initialString))
  ,TransactionCode = coalesce(TransactionCode, column_ifexists('TransactionCode_s', initialString))
  ,PlannedChangeNum = coalesce(PlannedChangeNumber, column_ifexists('PlannedChangeNum_s', initialString))
  ,ActualChangeNum = coalesce(ActualChangeNumber, column_ifexists('ActualChangeNum_s', initialString))
  ,CreatedfromPlannedChange = coalesce(CreatedFromPlannedChange, column_ifexists('CreatedfromPlannedChange_s', initialString))
  ,TypeofChange_Header = coalesce(HeaderTypeOfChange, column_ifexists('TypeofChange_Header_s', initialString))
  ,Language = coalesce(Language, column_ifexists('Language_s', initialString))
  ,Version = coalesce(Version, column_ifexists('Version_s', initialString))
  ,TableName = coalesce(TableName, column_ifexists('TableName_s', initialString))
  ,ChangedTableKey = coalesce(ChangedTableKey, column_ifexists('ChangedTableKey_s', initialString))
  ,FieldName = coalesce(FieldName, column_ifexists('FieldName_s', initialString))
  ,TypeofChange_Item = coalesce(ItemTypeOfChange, column_ifexists('TypeofChange_Item_s', initialString))
  ,FlagText = coalesce(FlagText, column_ifexists('FlagText_s', initialString))
  ,UOMOld = coalesce(UOMOld, column_ifexists('UOMOld_s', initialString))
  ,UOMNew = coalesce(UOMNew, column_ifexists('UOMNew_s', initialString))
  ,CurrencyKeyOld = coalesce(CurrencyKeyOld, column_ifexists('CurrencyKeyOld_s', initialString))
  ,CurrencyKeyNew = coalesce(CurrencyKeyNew, column_ifexists('CurrencyKeyNew_s', initialString))
  ,ValueOld = coalesce(ValueOld, column_ifexists('ValueOld_s', initialString))
  ,ValueNew = coalesce(ValueNew, column_ifexists('ValueNew_s', initialString))
  ,SystemID = coalesce(SystemId, column_ifexists('SystemID_s', initialString))
  ,SystemNumber = coalesce(SystemNumber, column_ifexists('SystemNumber_s', initialString))
  ,Instance = coalesce(Instance, column_ifexists('Instance_s', initialString))
  ,Host = column_ifexists('Host_s', initialString)
  ,Type
