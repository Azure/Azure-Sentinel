Contentkind: Function
Description: SAPOS_SAPCONTROL
Function:
  Title: SAPOS_SAPCONTROL
  Version: 3.0.0
  LastUpdated: '2023-11-17'
Category: SAPFunctions
FunctionName: SAPOS_SAPCONTROL
FunctionQuery: |
  //generated function structure for custom log ABAPOS_SAPCONTROL_CL
  let D_ABAPOS_SAPCONTROL_CL = datatable(TimeGenerated:datetime
  ,System:string
  ,MessageText:string
  ,Type:string)[];
  let T_ABAPOS_SAPCONTROL_CL = (ABAPOS_SAPCONTROL_CL | project
  TimeGenerated = TimeGenerated
  ,System = System_s
  ,MessageText = MessageText_s
  ,Type = Type);
  T_ABAPOS_SAPCONTROL_CL | union isfuzzy= true D_ABAPOS_SAPCONTROL_CL
  | extend SplitMessage= split(MessageText, "\t")
  | extend Severity= SplitMessage[1]
  | extend LogType= SplitMessage[2]
  | extend SplitDateTime= split(tostring(SplitMessage[0]), " ")
  | extend UpdatedOn= todatetime(strcat(SplitDateTime[0],"-", SplitDateTime[1], "-", SplitDateTime[2]," ", substring(SplitDateTime[3],0,8), ".",substring(SplitDateTime[3],9,11)))
  | extend MessageText= strcat_array(array_slice(SplitMessage, 3, -1),"")
  | project-away SplitMessage, SplitDateTime
