    version: 1.1.5
    querySha256: ac7da7d8c114e0094deb9fa76da84e129777348e9acdeac514c516bf2a4d3ad0
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
