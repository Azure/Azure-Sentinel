properties:
  id: xdr-6bf42891-b54d-4b4e-8533-babc5b3ea4c5
  displayName: Jira - New site admin user
  status: disabled
  queryCondition:
    queryText: 'let priv_users = JiraAudit

      | where TimeGenerated > ago(14d)

      | where EventMessage =~ ''User added to group''

      | where ObjectItemName =~ ''site-admins''

      | extend user = todynamic(AssociatedItems)[0][''name'']

      | summarize makeset(user);

      JiraAudit

      | where EventMessage =~ "User''s password changed"

      | extend user = todynamic(AssociatedItems)[0][''name'']

      | where user in (priv_users)

      | extend AccountCustomEntity = user'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Jira - New site admin user
      description: '''Detects new site admin user.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
