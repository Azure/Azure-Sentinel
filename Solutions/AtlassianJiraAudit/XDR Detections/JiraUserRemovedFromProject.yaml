properties:
  id: xdr-5d3af0aa-833e-48ed-a29a-8cfd2705c953
  displayName: Jira - User removed from project
  status: disabled
  queryCondition:
    queryText: 'JiraAudit

      | where EventMessage =~ ''User removed from project''

      | extend user = todynamic(AssociatedItems)[0][''name'']

      | project EventCreationTime, ObjectItemName, user

      | extend AccountCustomEntity = user'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Jira - User removed from project
      description: '''Detects when a user was removed from project.'''
      severity: medium
      entityMappings:
