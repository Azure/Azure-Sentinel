      title: Jira - New site admin user
      description: '''Detects new site admin user.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
