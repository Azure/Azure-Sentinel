properties:
  id: xdr-398aa0ca-45a2-4f79-bc21-ee583bbb63bc
  displayName: Jira - Workflow scheme copied
  status: disabled
  queryCondition:
    queryText: 'JiraAudit

      | where EventMessage =~ ''Workflow scheme copied''

      | extend workflow = todynamic(AssociatedItems)[0][''name'']

      | project EventCreationTime, ObjectItemName, UserName, SrcIpAddr, workflow

      | extend AccountCustomEntity = UserName, IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Jira - Workflow scheme copied
      description: '''Detects when workflow scheme was copied.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1213
      customDetails:
        AccountName: AccountCustomEntity
