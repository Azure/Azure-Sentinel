properties:
  id: xdr-943176e8-b979-45c0-8ad3-58ba6cfd41f0
  displayName: Jira - User's password changed multiple times
  status: disabled
  queryCondition:
    queryText: 'JiraAudit

      | where EventMessage =~ "User''s password changed"

      | extend user = todynamic(AssociatedItems)[0][''name'']

      | summarize ip_list = makeset(SrcIpAddr) by tostring(user), bin(TimeGenerated,
      30m)

      | where array_length(ip_list) > 1

      | extend AccountCustomEntity = user, IPCustomEntity = ip_list'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Jira - User's password changed multiple times
      description: '''Detects when user''s password was changed multiple times from
        different IP addresses.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
