id: 5d2a8c1e-7b34-4f6a-9e0d-3c81a2b4f917
Function:
  Title: Parser for CensysRiskEvents
  Version: "1.0.0"
  LastUpdated: "2026-10-15"
Category: Microsoft Sentinel Parser
FunctionName: CensysRiskEvents
FunctionAlias: CensysRiskEvents
FunctionQuery: |
  let CensysRiskEvents_view = view () {
      // The empty datatable keeps the parser working (returning no rows) when the table does not exist yet
      union isfuzzy=true
          (datatable(
          TimeGenerated:datetime,
          EventId:string,
          InsertedAt:datetime,
          OccurredAt:datetime,
          ChangeType:string,
          RiskInstanceId:string,
          SupplyChainId:string,
          AssetType:string,
          RiskTypeId:string,
          CveId:string,
          RiskCategory:string,
          RiskName:string,
          Description:string,
          Remediations:dynamic,
          Severity:string,
          Score:real,
          Confidence:real,
          Status:string,
          ResolveTime:datetime,
          ResolveReason:string,
          SupplierId:string,
          SupplierDisplayName:string,
          Suppliers:dynamic,
          AssetIp:string,
          AssetHostname:string,
          AssetPort:int,
          ServiceTransportProtocol:string,
          ServicePort:int,
          ServiceProtocol:string,
          Tags:dynamic,
          RapidResponse:bool,
          Evidence:string,
          FirstDetectedAt:datetime,
          LastDetectedAt:datetime,
          CreatedAt:datetime,
          PlatformUrl:string,
          IngestedAt:datetime
          )[]),
          (CensysRiskEvents_CL | extend IngestedAt = ingestion_time())
      // Treat every field as optional: a column that is missing from the table becomes empty instead of failing the query
      | extend
          TimeGenerated = column_ifexists('TimeGenerated', datetime(null)),
          EventId = column_ifexists('EventId', ''),
          InsertedAt = column_ifexists('InsertedAt', datetime(null)),
          OccurredAt = column_ifexists('OccurredAt', datetime(null)),
          ChangeType = column_ifexists('ChangeType', ''),
          RiskInstanceId = column_ifexists('RiskInstanceId', ''),
          SupplyChainId = column_ifexists('SupplyChainId', ''),
          AssetType = column_ifexists('AssetType', ''),
          RiskTypeId = column_ifexists('RiskTypeId', ''),
          CveId = column_ifexists('CveId', ''),
          RiskCategory = column_ifexists('RiskCategory', ''),
          RiskName = column_ifexists('RiskName', ''),
          Description = column_ifexists('Description', ''),
          Remediations = column_ifexists('Remediations', dynamic(null)),
          Severity = column_ifexists('Severity', ''),
          Score = column_ifexists('Score', real(null)),
          Confidence = column_ifexists('Confidence', real(null)),
          Status = column_ifexists('Status', ''),
          ResolveTime = column_ifexists('ResolveTime', datetime(null)),
          ResolveReason = column_ifexists('ResolveReason', ''),
          SupplierId = column_ifexists('SupplierId', ''),
          SupplierDisplayName = column_ifexists('SupplierDisplayName', ''),
          Suppliers = column_ifexists('Suppliers', dynamic(null)),
          AssetIp = column_ifexists('AssetIp', ''),
          AssetHostname = column_ifexists('AssetHostname', ''),
          AssetPort = column_ifexists('AssetPort', int(null)),
          ServiceTransportProtocol = column_ifexists('ServiceTransportProtocol', ''),
          ServicePort = column_ifexists('ServicePort', int(null)),
          ServiceProtocol = column_ifexists('ServiceProtocol', ''),
          Tags = column_ifexists('Tags', dynamic(null)),
          RapidResponse = column_ifexists('RapidResponse', bool(null)),
          Evidence = column_ifexists('Evidence', ''),
          FirstDetectedAt = column_ifexists('FirstDetectedAt', datetime(null)),
          LastDetectedAt = column_ifexists('LastDetectedAt', datetime(null)),
          CreatedAt = column_ifexists('CreatedAt', datetime(null)),
          PlatformUrl = column_ifexists('PlatformUrl', '')
      // Delivery is at-least-once, so keep one row per event: the first copy that was ingested
      | summarize arg_min(IngestedAt, *) by EventId
      | extend
          EventVendor = "Censys",
          EventProduct = "Censys Supplier Risk Intelligence",
          ChangeType = tolower(ChangeType),
          Status = tolower(Status),
          Severity = toupper(Severity),
          SupplierId = coalesce(tostring(SupplierId), tostring(Suppliers[0].id)),
          SupplierDisplayName = coalesce(tostring(SupplierDisplayName), tostring(Suppliers[0].display_name)),
          AssetName = iff(isnotempty(AssetHostname), AssetHostname, AssetIp),
          IsOpen = tolower(Status) == "open",
          SeverityRank = case(
              toupper(Severity) == "CRITICAL", 4,
              toupper(Severity) == "HIGH", 3,
              toupper(Severity) == "MEDIUM", 2,
              toupper(Severity) == "LOW", 1,
              0)
      | project
          TimeGenerated,
          IngestedAt,
          EventId,
          InsertedAt,
          OccurredAt,
          ChangeType,
          RiskInstanceId,
          SupplyChainId,
          RiskTypeId,
          CveId,
          RiskCategory,
          RiskName,
          Description,
          Remediations,
          Severity,
          SeverityRank,
          Score,
          Confidence,
          Status,
          IsOpen,
          ResolveTime,
          ResolveReason,
          SupplierId,
          SupplierDisplayName,
          Suppliers,
          AssetType,
          AssetName,
          AssetIp,
          AssetHostname,
          AssetPort,
          ServiceTransportProtocol,
          ServicePort,
          ServiceProtocol,
          Tags,
          RapidResponse,
          Evidence,
          FirstDetectedAt,
          LastDetectedAt,
          CreatedAt,
          PlatformUrl,
          EventVendor,
          EventProduct
  };
  CensysRiskEvents_view
