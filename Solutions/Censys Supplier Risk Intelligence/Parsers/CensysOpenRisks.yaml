id: b9f24b18-06de-4e8b-b455-465fa9a50c66
Function:
  Title: Parser for Censys open risks
  Version: "1.0.0"
  LastUpdated: "2026-10-19"
Category: Microsoft Sentinel Parser
FunctionName: CensysOpenRisks
FunctionAlias: CensysOpenRisks
FunctionQuery: |
  // Current state of every supplier risk: the latest event of each risk instance, kept only when that event shows the risk as open
  let CensysOpenRisks_view = view () {
      CensysRiskEvents
      | summarize arg_max(InsertedAt, *) by RiskInstanceId
      | where IsOpen
  };
  CensysOpenRisks_view
