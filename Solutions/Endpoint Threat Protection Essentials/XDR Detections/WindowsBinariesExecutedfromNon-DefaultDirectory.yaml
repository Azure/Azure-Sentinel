properties:
  id: xdr-windows-binaries-executed-from-non-default-directory-15049017
  displayName: Windows Binaries Executed from Non-Default Directory
  status: disabled
  queryCondition:
    queryText: |-
      let procList = externaldata(Process:string) [@"https://raw.githubusercontent.com/Azure/Azure-Sentinel/master/Sample%20Data/Microsoft_Lolbas_Execution_Binaries.csv"] with (format="csv", ignoreFirstRecord=True);
      SecurityEvent
      | where EventID == 4688 and Process has_any (procList) and not (NewProcessName has ("C:\\Windows\\"))
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated) by EventID, Computer, SubjectUserName, NewProcessName, Process, CommandLine
      | extend Name=tostring(split(SubjectUserName, "@")[0]), UPNSuffix=tostring(split(SubjectUserName, "@")[1])
      | extend HostName = iif(Computer has '.',substring(Computer,0,indexof(Computer,'.')),Computer) , DnsDomain = iif(Computer has '.',substring(Computer,indexof(Computer,'.')+1),'')
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Windows Binaries Executed from Non-Default Directory
      description: "'The query detects Windows binaries, that can be executed from a non-default directory (e.g. C:\\Windows\\\
        , C:\\Windows\\System32 etc.). \nRef: https://lolbas-project.github.io/'"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1059
