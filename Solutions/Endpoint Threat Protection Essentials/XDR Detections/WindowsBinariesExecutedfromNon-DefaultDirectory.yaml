contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 15049017-527f-4d3b-b011-b0e99e68ef45
    path: Analytic Rules/WindowsBinariesExecutedfromNon-DefaultDirectory.yaml
    version: 1.0.4
    querySha256: fda4bf8db4520dfa60a3e61d96130c1e9c5e28f2a4b592ca6f7112a03b3d105b
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - externaldata availability must be verified by runtime validation
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
