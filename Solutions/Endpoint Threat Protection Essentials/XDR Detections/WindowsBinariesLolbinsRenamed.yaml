schemaVersion: 1.0.0
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: cbf6ad48-fa5c-4bf7-b205-28dbadb91255
    path: Analytic Rules/WindowsBinariesLolbinsRenamed.yaml
    version: 1.0.3
    querySha256: 047b42fc2e2a3e30bb561f092079315dcf2c1327cf84a75e422a678db52e9719
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - externaldata availability must be verified by runtime validation
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
    - Process has no supported Custom Detection mapping
    - Host.FullName has no supported Custom Detection field
