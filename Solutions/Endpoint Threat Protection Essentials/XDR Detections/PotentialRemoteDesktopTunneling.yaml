  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: d2e8fd50-8d66-11ec-b909-0242ac120002
    path: Analytic Rules/PotentialRemoteDesktopTunneling.yaml
    version: 1.0.4
    querySha256: 10ad6b35880a79f841264ced48e18eae1b8c19ccdff67d90a7f53c5eee514ca5
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
