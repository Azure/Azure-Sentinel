properties:
  id: xdr-registry-persistence-via-appcert-dll-modification-c61ad0ac
  displayName: Registry Persistence via AppCert DLL Modification
  status: disabled
  queryCondition:
    queryText: |-
      Event
      | where EventLog =~ "Microsoft-Windows-Sysmon/Operational" and EventID in (13)
      | parse EventData with * 'TargetObject">' TargetObject "<" * 'Details">' Details "<" *
      | where TargetObject has ("\\Control\\Session Manager\\AppCertDLLs\\")
      | summarize StartTimeUtc = min(TimeGenerated), EndTimeUtc = max(TimeGenerated) by EventID, Computer,  TargetObject, Details
      | extend HostName = iif(Computer has '.',substring(Computer,0,indexof(Computer,'.')),Computer) , DnsDomain = iif(Computer has '.',substring(Computer,indexof(Computer,'.')+1),'')
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Registry Persistence via AppCert DLL Modification
      description: "'Adversaries may establish persistence and/or elevate privileges by executing malicious content triggered\
        \ by AppCert DLLs loaded into processes. \nDynamic-link libraries (DLLs) that are specified in the AppCertDLLs Registry\
        \ key under HKEY_LOCAL_MACHINE\\System\\CurrentControlSet\\Control\\Session Manager\\ are loaded into every process\
        \ that calls the ubiquitously used application programming interface (API) functions CreateProcess, CreateProcessAsUser,\
        \ CreateProcessWithLoginW, CreateProcessWithTokenW, or WinExec.\nRef: https://attack.mitre.org/techniques/T1546/009/'"
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1546
          subTechniques:
          - T1546.009
