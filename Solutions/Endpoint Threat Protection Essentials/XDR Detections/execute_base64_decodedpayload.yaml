properties:
  id: xdr-d6190dde-8fd2-456a-ac5b-0a32400b0464
  displayName: Process executed from binary hidden in Base64 encoded file
  status: disabled
  queryCondition:
    queryText: |-
      let ProcessCreationEvents=(union isfuzzy=true
      (SecurityEvent
      | where EventID==4688
      | where isnotempty(CommandLine)
      | project TimeGenerated, Computer, Account = SubjectUserName, AccountDomain = SubjectDomainName, FileName = Process, CommandLine, ParentProcessName
      ),
      (WindowsEvent
      | where EventID==4688
      | where EventData has_any (".decode('base64')", "base64 --decode", ".decode64(" )
      | extend CommandLine = tostring(EventData.CommandLine)
      | where isnotempty(CommandLine)
      | extend SubjectUserName = tostring(EventData.SubjectUserName)
      | extend SubjectDomainName = tostring(EventData.SubjectDomainName)
      | extend NewProcessName = tostring(EventData.NewProcessName)
      | extend FileName=tostring(split(NewProcessName, '\\')[-1])
      | extend ParentProcessName = tostring(EventData.ParentProcessName)
      | project TimeGenerated, Computer, Account = SubjectUserName, AccountDomain = SubjectDomainName, CommandLine, ParentProcessName
      ));
      ProcessCreationEvents
      | where CommandLine contains ".decode('base64')"
              or CommandLine contains "base64 --decode"
              or CommandLine contains ".decode64("
      | summarize StartTimeUtc = min(TimeGenerated), EndTimeUtc = max(TimeGenerated), CountToday = count() by Computer, Account, AccountDomain, FileName, CommandLine, ParentProcessName
      | extend HostName = iif(Computer has '.',substring(Computer,0,indexof(Computer,'.')),Computer) , DnsDomain = iif(Computer has '.',substring(Computer,indexof(Computer,'.')+1),'')
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Process executed from binary hidden in Base64 encoded file
      description: "'Encoding malicious software is a technique used to obfuscate files from detection. \nThe first CommandLine\
        \ component is looking for Python decoding base64. \nThe second CommandLine component is looking for Bash/sh command\
        \ line base64 decoding.\nThe third one is looking for Ruby decoding base64.'"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Account
          dnsDomainColumn: DnsDomain
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1059
      - tactic: DefenseEvasion
        techniques:
        - technique: T1027
        - technique: T1140
      customDetails:
        HostFullName: Computer
