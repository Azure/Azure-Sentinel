id: 7caa1c03-d20b-42f2-ac95-5232f6e570da
name: PAC high severity
description: |
  'High severity PAC/pentest findings found by Prancer.'
severity: High
requiredDataConnectors:
- connectorId: PrancerLogData
  dataTypes:
    - PrancerFindings_CL
queryFrequency: 5h
queryPeriod: 5h
triggerOperator: gt
triggerThreshold: 0
eventGroupingSettings:
  aggregationKind: SingleAlert
status: Available
tactics:
  - Reconnaissance
relevantTechniques:
  - T1595
query: |
  // Pentest/PAC findings carry request/response and CVE/CVSS context under Payload.alert/Payload.message,
  // which PrancerFindings already derives - no per-rule parse_json/mv-expand needed here.
  PrancerFindings
  | where Severity == 'High'
  | project
      Finding_ID = FindingId,
      Name = Title,
      Severity,
      URL = ResourceUrl,
      Resource = ResourceID,
      Config_ID = ConfigId,
      Collection = ApplicationName,
      MITRE = MitreIds,
      Company = CompanyName,
      Solution = AlertSolution,
      CWE_ID = CweId,
      Evidence = AlertEvidence,
      Request_Header = RequestHeader,
      Request_Body = RequestBody,
      Response_Header = ResponseHeader,
      Response_Body = ResponseBody
customDetails:
  UniqueFindingId: Finding_ID
entityMappings:
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: Resource
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: URL
alertDetailsOverride:
  alertDisplayNameFormat: "{{Name}}"
  alertDescriptionFormat: "{{Name}} - {{Evidence}}"
  alertSeverityColumnName: Severity
  alertDynamicProperties:
    - alertProperty: RemediationSteps
      value: Solution
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails:
      - UniqueFindingId
version: 2.1.0
kind: Scheduled
