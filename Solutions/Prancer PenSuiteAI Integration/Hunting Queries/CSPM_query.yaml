id: 322591e4-5b68-4574-be00-2e1b618eab7c
name: Hunting query for failed CSPM scan items
description: |
  Finds all failed CSPM control evaluations ingested by Prancer, expanded to one row per affected Azure resource for triage.
requiredDataConnectors:
- connectorId: PrancerLogData
  dataTypes:
    - PrancerFindings_CL
tactics:
  - Collection
relevantTechniques:
  - T1595
query: |
  // PrancerFindings_CL only ingests actual findings (i.e. already-failed control evaluations), so the legacy
  // data_data_result_s == 'failed' filter no longer applies - isnotempty(Snapshots) selects CSPM/infra findings.
  PrancerFindings
  | where isnotempty(Snapshots)
  | mv-expand Snapshots
  | extend
      id = tostring(Snapshots.id),
      structure = tostring(Snapshots.structure),
      reference = tostring(Snapshots.reference),
      source = tostring(Snapshots.source),
      collection = tostring(Snapshots.collection),
      type = tostring(Snapshots.type),
      region = tostring(Snapshots.region),
      resourceTypes = tostring(Snapshots.resourceTypes),
      path = tostring(Snapshots.path)
  | summarize arg_min(id, *) by path, Title
  | project Alert = Title, Severity, Cloud_Type = structure, Resource = path, ResourceType = type, Region = region, Remediation = RemediationDescription
entityMappings:
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: Resource
customDetails:
  ResourceType: ResourceType
  Region: Region
version: 2.0.0
