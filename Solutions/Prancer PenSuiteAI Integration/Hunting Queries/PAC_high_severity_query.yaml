id: 37cb2dea-7a62-4a8d-923b-d588c6372608
name: Hunting query for high severity PAC findings
description: |
  Finds high and critical severity PenSuiteAI pentest findings from Prancer, with full request/response and remediation context, in one place.
requiredDataConnectors:
- connectorId: PrancerLogData
  dataTypes:
    - PrancerFindings_CL
tactics:
  - Collection
relevantTechniques:
  - T1595
query: |
  // Pentest/PAC findings carry request/response and CVE/CVSS context under Payload.alert/Payload.message,
  // which PrancerFindings already derives - no per-rule parse_json/mv-expand needed here.
  PrancerFindings
  | where Severity == 'High' or Severity == 'Critical'
  | project
      Alert = Title,
      Tenant = CompanyName,
      Collection = ApplicationName,
      MITRE = MitreIds,
      URL = ResourceUrl,
      Resource = ResourceID,
      Solution = AlertSolution,
      Evidence = AlertEvidence,
      Request_Header = RequestHeader,
      Request_Body = RequestBody,
      Response_Header = ResponseHeader,
      Response_Body = ResponseBody
entityMappings:
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: Resource
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: URL
customDetails:
  MITRE: MITRE
  Tenant: Tenant
version: 2.0.0
