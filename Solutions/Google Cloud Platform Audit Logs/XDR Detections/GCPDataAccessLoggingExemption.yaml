properties:
  id: xdr-b7da45ce-fcc8-43c7-a37c-c08454579d26
  displayName: GCP Audit Logs - Data Access Logging Exemption Added for Principal
  status: disabled
  queryCondition:
    queryText: "GCPAuditLogs\n | where ServiceName == \"cloudresourcemanager.googleapis.com\"\
      \n | where MethodName == \"SetIamPolicy\"\n | where GCPResourceType == \"project\"\
      \ and Severity == \"NOTICE\"\n | where isnotempty(ServiceData)\n | extend ServiceDataJson\
      \ = parse_json(ServiceData)\n | extend PolicyDelta = ServiceDataJson.policyDelta.auditConfigDeltas\n\
      \ | where isnotempty(PolicyDelta)\n | mv-expand ConfigDelta = PolicyDelta\n\
      \ | where ConfigDelta.action == \"ADD\"\n | extend LogType = tostring(ConfigDelta.logType)\n\
      \ | where LogType in (\"ADMIN_READ\", \"DATA_READ\", \"DATA_WRITE\")\n | extend\n\
      \     ExemptedMember = tostring(ConfigDelta.exemptedMember),\n     ServiceAffected\
      \ = tostring(ConfigDelta.service),\n     RequestMetadataJson = parse_json(RequestMetadata),\n\
      \     AuthInfoJson = parse_json(AuthenticationInfo)\n | where isnotempty(ExemptedMember)\n\
      \ | extend\n     CallerIpAddress = tostring(RequestMetadataJson.callerIp),\n\
      \     UserAgent = tostring(RequestMetadataJson.callerSuppliedUserAgent),\n \
      \    AuthEmail = tostring(AuthInfoJson.principalEmail),\n     ExemptedAccountName\
      \ = tostring(split(ExemptedMember, \":\")[1])\n | summarize\n     ExemptedLogTypes\
      \ = make_set(LogType, 10),\n     ExemptedServices = make_set(ServiceAffected,\
      \ 50),\n     FirstExemption = min(TimeGenerated),\n     LastExemption = max(TimeGenerated)\n\
      \     by PrincipalEmail, ProjectId, GCPResourceName, ExemptedMember,\n     \
      \   CallerIpAddress, UserAgent, LogName, ExemptedAccountName, MethodName, ServiceName,\
      \ AuthEmail\n | extend\n     AccountName = tostring(split(PrincipalEmail, \"\
      @\")[0]),\n     AccountUPNSuffix = tostring(split(PrincipalEmail, \"@\")[1])\n\
      \ | project TimeGenerated = LastExemption,\n     PrincipalEmail,\n     ProjectId,\n\
      \     ResourceName = GCPResourceName,\n     ExemptedMember,\n     ExemptedAccountName,\n\
      \     ExemptedLogTypes,\n     ExemptedServices,\n     FirstExemption,\n    \
      \ LastExemption,\n     CallerIpAddress,\n     UserAgent,\n     AuthEmail,\n\
      \     MethodName,\n     ServiceName,\n     LogName,\n     AccountName,\n   \
      \  AccountUPNSuffix"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GCP Audit Logs - Data Access Logging Exemption Added for Principal
      description: '''Detects when a principal (user or service account) is exempted
        from GCP data access audit logging.

        This is a critical security event as it reduces visibility into privileged
        operations and may indicate an attempt to hide malicious activity.

        Adversaries may exempt their accounts from audit logging to evade detection
        while performing reconnaissance, privilege escalation, or data exfiltration.

        This rule monitors SetIamPolicy operations that add audit log exemptions for
        ADMIN_READ, DATA_READ, or DATA_WRITE log types.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: CallerIpAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: ProjectId
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.008
        - technique: T1078
          subTechniques:
          - T1078.004
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      customDetails:
        ProjectId: ProjectId
        ExemptedMember: ExemptedMember
        ExemptedAccountName: ExemptedAccountName
        ExemptedLogTypes: ExemptedLogTypes
        ExemptedServices: ExemptedServices
        UserAgent: UserAgent
        AccountFullName: PrincipalEmail
        CloudApplicationInstanceName: ResourceName
status: Available
