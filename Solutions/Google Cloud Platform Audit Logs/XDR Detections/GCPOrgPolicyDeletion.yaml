properties:
  id: xdr-205e1c9f-faee-43f1-b3b8-1952ffbbeea4
  displayName: GCP Audit Logs - Detect Organization Policy Deletion or Updation
  status: disabled
  queryCondition:
    queryText: "GCPAuditLogs\n| where ServiceName == \"orgpolicy.googleapis.com\"\n\
      | where MethodName has_any (\"OrgPolicy.DeletePolicy\", \"OrgPolicy.UpdatePolicy\"\
      )\n| extend\n    RequestMetadataJson = parse_json(RequestMetadata),\n    AuthInfoJson\
      \ = parse_json(AuthenticationInfo),\n    AuthzInfoJson = parse_json(AuthorizationInfo)\n\
      | extend\n    PolicyName = split(GCPResourceName, \"/\")[-1],\n    CallerIpAddress\
      \ = tostring(RequestMetadataJson.callerIp),\n    UserAgent = tostring(RequestMetadataJson.callerSuppliedUserAgent),\n\
      \    AuthEmail = tostring(AuthInfoJson.principalEmail),\n    Permission = tostring(AuthzInfoJson[0].permission),\n\
      \    PermissionGranted = tostring(AuthzInfoJson[0].granted)\n| extend\n    AccountName\
      \ = tostring(split(PrincipalEmail, \"@\")[0]),\n    AccountUPNSuffix = tostring(split(PrincipalEmail,\
      \ \"@\")[1])\n| project TimeGenerated,\n          PrincipalEmail,\n        \
      \  AuthEmail,\n          ProjectId,\n          ResourceName = GCPResourceName,\n\
      \          PolicyName,\n          CallerIpAddress,\n          UserAgent,\n \
      \         MethodName,\n          ServiceName,\n          Severity,\n       \
      \   Permission,\n          PermissionGranted,\n          LogName,\n        \
      \  InsertId,\n          AccountName,\n          AccountUPNSuffix"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GCP Audit Logs - Detect Organization Policy Deletion or Updation
      description: "'Detects when a Google Cloud Platform organization policy is deleted\
        \ or updated. \nOrganization policies provide centralized control over your\
        \ organization's cloud resources and help ensure security and compliance.\n\
        Deletion or modification of org policies may indicate an attempt to bypass\
        \ security controls or weaken the security posture of GCP projects.\nAdversaries\
        \ may delete or update organization policies to disable security constraints\
        \ before performing malicious activities.'"
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: CallerIpAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: ProjectId
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.001
      customDetails:
        ProjectId: ProjectId
        PolicyName: PolicyName
        ResourceName: ResourceName
        UserAgent: UserAgent
        Permission: Permission
        MethodName: MethodName
        AccountFullName: PrincipalEmail
status: Available
