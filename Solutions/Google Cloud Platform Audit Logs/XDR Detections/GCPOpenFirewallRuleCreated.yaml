properties:
  id: xdr-8061c611-55f1-4ee5-a8f8-8f19f2c7aab2
  displayName: GCP Audit Logs - Open Firewall Rule Created or Modified
  status: disabled
  queryCondition:
    queryText: "GCPAuditLogs\n| where ServiceName == \"compute.googleapis.com\"\n\
      | where MethodName has_any (\"firewalls.insert\", \"firewalls.patch\")\n| where\
      \ GCPResourceType == \"gce_firewall_rule\"\n| where Severity == \"NOTICE\"\n\
      | extend\n    RequestJson = parse_json(Request),\n    RequestMetadataJson =\
      \ parse_json(RequestMetadata),\n    AuthInfoJson = parse_json(AuthenticationInfo)\n\
      | extend\n    SourceRanges = RequestJson.sourceRanges,\n    Alloweds = RequestJson.alloweds,\n\
      \    Direction = tostring(RequestJson.direction),\n    RuleName = tostring(RequestJson.name),\n\
      \    Network = tostring(RequestJson.network),\n    Priority = tostring(RequestJson.priority),\n\
      \    LogConfig = RequestJson.logConfig,\n    Disabled = tobool(RequestJson.disabled)\n\
      | mv-expand SourceRange = SourceRanges\n| extend SourceRangeStr = tostring(SourceRange)\n\
      | where SourceRangeStr in (\"0.0.0.0/0\", \"0.0.0.0\")\n| extend\n    FirewallRuleName\
      \ = extract(@\"firewalls/([^/]+)$\", 1, GCPResourceName),\n    CallerIpAddress\
      \ = tostring(RequestMetadataJson.callerIp),\n    UserAgent = tostring(RequestMetadataJson.callerSuppliedUserAgent),\n\
      \    AuthEmail = tostring(AuthInfoJson.principalEmail)\n| mv-expand Allowed\
      \ = Alloweds\n| extend\n    AllowedProtocol = tostring(Allowed.IPProtocol),\n\
      \    AllowedPorts = tostring(Allowed.ports),\n    OperationType = case(\n  \
      \      MethodName has \"insert\", \"Created\",\n        MethodName has \"patch\"\
      , \"Modified\",\n        \"Unknown\")\n| summarize\n    AllowedProtocols = make_set(AllowedProtocol,\
      \ 30),\n    AllowedPortsList = make_set(AllowedPorts, 100),\n    SourceRangesList\
      \ = make_set(SourceRangeStr, 100)\n    by TimeGenerated, PrincipalEmail, AuthEmail,\
      \ ProjectId, FirewallRuleName,\n       GCPResourceName, Direction, Priority,\
      \ Network, CallerIpAddress, UserAgent,\n       MethodName, ServiceName, Severity,\
      \ OperationType, LogName, InsertId\n| extend\n    AccountName = tostring(split(PrincipalEmail,\
      \ \"@\")[0]),\n    AccountUPNSuffix = tostring(split(PrincipalEmail, \"@\")[1])\n\
      | project TimeGenerated,\n          PrincipalEmail,\n          AuthEmail,\n\
      \          ProjectId,\n          FirewallRuleName,\n          ResourceName =\
      \ GCPResourceName,\n          OperationType,\n          Direction,\n       \
      \   SourceRangesList,\n          AllowedProtocols,\n          AllowedPortsList,\n\
      \          Priority,\n          Network,\n          CallerIpAddress,\n     \
      \     UserAgent,\n          MethodName,\n          ServiceName,\n          Severity,\n\
      \          LogName,\n          InsertId,\n          AccountName,\n         \
      \ AccountUPNSuffix"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GCP Audit Logs - Open Firewall Rule Created or Modified
      description: '''Detects when a Google Cloud Platform firewall rule is created
        or modified to allow traffic from any source (0.0.0.0/0 or 0.0.0.0).

        Open firewall rules expose resources to the internet and can significantly
        increase the attack surface of cloud infrastructure.

        This may indicate a misconfiguration, lack of security awareness, or malicious
        activity to create backdoor access.

        Adversaries may create or modify firewall rules to enable persistent access
        or facilitate lateral movement.

        This rule monitors firewall insert and patch operations where sourceRanges
        include unrestricted access patterns.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: CallerIpAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: ProjectId
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.001
          - T1562.004
      - tactic: Persistence
        techniques:
        - technique: T1133
      - tactic: InitialAccess
        techniques:
        - technique: T1133
      customDetails:
        ProjectId: ProjectId
        FirewallRuleName: FirewallRuleName
        ResourceName: ResourceName
        OperationType: OperationType
        Direction: Direction
        SourceRanges: SourceRangesList
        AllowedProtocols: AllowedProtocols
        AllowedPorts: AllowedPortsList
        Network: Network
        AccountFullName: PrincipalEmail
status: Available
