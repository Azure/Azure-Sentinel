properties:
  id: xdr-9129a43e-e204-4a9a-969e-d8861ce3437c
  displayName: GCP Audit Logs - DNSSEC Disabled on Managed DNS Zone
  status: disabled
  queryCondition:
    queryText: "GCPAuditLogs\n| where ServiceName == \"dns.googleapis.com\"\n| where\
      \ MethodName in (\"dns.managedZones.update\", \"dns.managedZones.patch\")\n\
      | where GCPResourceType == \"dns_managed_zone\" and Severity == \"NOTICE\"\n\
      | extend\n    ResponseJson = parse_json(Response),\n    RequestMetadataJson\
      \ = parse_json(RequestMetadata),\n    AuthInfoJson = parse_json(AuthenticationInfo)\n\
      | extend ZoneContext = ResponseJson.operation.zoneContext\n| where isnotempty(ZoneContext)\n\
      | extend\n    OldDnsSecState = tostring(ZoneContext.oldValue.dnssecConfig.state),\n\
      \    NewDnsSecState = tostring(ZoneContext.newValue.dnssecConfig.state)\n| where\
      \ OldDnsSecState == \"ON\" and NewDnsSecState == \"OFF\"\n| extend\n    ManagedZoneName\
      \ = extract(@\"managedZones/([^/]+)\", 1, GCPResourceName),\n    DnsName = tostring(ResponseJson.managedZone.dnsName),\n\
      \    ZoneId = tostring(ResponseJson.managedZone.id),\n    ZoneDescription =\
      \ tostring(ResponseJson.managedZone.description),\n    Visibility = tostring(ResponseJson.managedZone.visibility),\n\
      \    OperationId = tostring(ResponseJson.operation.id),\n    CallerIpAddress\
      \ = tostring(RequestMetadataJson.callerIp),\n    AuthEmail = tostring(AuthInfoJson.principalEmail)\n\
      | extend\n    AccountName = tostring(split(PrincipalEmail, \"@\")[0]),\n   \
      \ AccountUPNSuffix = tostring(split(PrincipalEmail, \"@\")[1])\n| project TimeGenerated,\n\
      \          PrincipalEmail,\n          AuthEmail,\n          ProjectId,\n   \
      \       ManagedZoneName,\n          DnsName,\n          ResourceName = GCPResourceName,\n\
      \          Visibility,\n          ZoneId,\n          ZoneDescription,\n    \
      \      OperationId,\n          CallerIpAddress,\n          MethodName,\n   \
      \       ServiceName,\n          Severity,\n          LogName,\n          InsertId,\n\
      \          AccountName,\n          AccountUPNSuffix"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GCP Audit Logs - DNSSEC Disabled on Managed DNS Zone
      description: '''Detects when DNSSEC (DNS Security Extensions) is disabled on
        a Google Cloud DNS managed zone.

        DNSSEC provides cryptographic authentication of DNS data, preventing DNS spoofing
        and cache poisoning attacks.

        Adversaries may disable DNSSEC to enable DNS-based command and control, phishing
        campaigns, or

        to redirect traffic to malicious infrastructure without cryptographic validation.

        This rule monitors DNS zone patch operations where DNSSEC state changes from
        ON to OFF.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: CallerIpAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: ProjectId
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.001
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
          subTechniques:
          - T1071.004
      - tactic: ResourceDevelopment
        techniques:
        - technique: T1584
          subTechniques:
          - T1584.002
      customDetails:
        ProjectId: ProjectId
        ManagedZoneName: ManagedZoneName
        DnsName: DnsName
        ResourceName: ResourceName
        Visibility: Visibility
        ZoneId: ZoneId
        AccountFullName: PrincipalEmail
status: Available
