properties:
  id: xdr-dfdffdc7-929f-4c7e-8f48-30e5ffddb067
  displayName: GCP Audit Logs - Detect Bulk VM Snapshot Deletion
  status: disabled
  queryCondition:
    queryText: "// Update these thresholds if noisy in your environment\nlet SnapshotDeletionThreshold\
      \ = 10;\nlet TimeWindow = 1m;\nGCPAuditLogs\n| where ServiceName == \"compute.googleapis.com\"\
      \n| where MethodName has \"compute.snapshots.delete\"\n| where GCPResourceType\
      \ == \"gce_snapshot\" and Severity == \"NOTICE\"\n| extend\n    AuthzInfoJson\
      \ = parse_json(AuthorizationInfo),\n    RequestMetadataJson = parse_json(RequestMetadata),\n\
      \    ResponseJson = parse_json(Response)\n| extend PermissionType = tostring(AuthzInfoJson[0].permissionType)\n\
      | where PermissionType == \"ADMIN_WRITE\"\n| extend\n    CallerIpAddress = tostring(RequestMetadataJson.callerIp),\n\
      \    UserAgent = tostring(RequestMetadataJson.callerSuppliedUserAgent),\n  \
      \  SnapshotName = extract(@\"snapshots/([^/]+)\", 1, GCPResourceName),\n   \
      \ OperationType = tostring(ResponseJson.operationType),\n    OperationId = tostring(ResponseJson.id)\n\
      | summarize\n    SnapshotCount = count(),\n    SnapshotList = make_set(SnapshotName,\
      \ 100),\n    FirstDeletion = min(TimeGenerated),\n    LastDeletion = max(TimeGenerated),\n\
      \    OperationIds = make_set(OperationId, 100),\n    CallerIPs = make_set(CallerIpAddress,\
      \ 10)\n    by PrincipalEmail, ProjectId, UserAgent\n| where SnapshotCount >=\
      \ SnapshotDeletionThreshold\n| extend DeletionTimeSpan = LastDeletion - FirstDeletion\n\
      | where DeletionTimeSpan <= TimeWindow\n| extend\n    AccountName = tostring(split(PrincipalEmail,\
      \ \"@\")[0]),\n    AccountUPNSuffix = tostring(split(PrincipalEmail, \"@\")[1])\n\
      | project\n    TimeGenerated = FirstDeletion,\n    PrincipalEmail,\n    ProjectId,\n\
      \    SnapshotCount,\n    SnapshotList,\n    FirstDeletion,\n    LastDeletion,\n\
      \    DeletionTimeSpan,\n    CallerIPs,\n    UserAgent,\n    OperationIds,\n\
      \    AccountName,\n    AccountUPNSuffix"
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: GCP Audit Logs - Detect Bulk VM Snapshot Deletion
      description: '''Detects bulk deletion of Google Cloud VM snapshots within a
        short time period, which may indicate data destruction or defense evasion
        activities.

        VM snapshots are critical for backup and disaster recovery. Bulk deletion
        of snapshots can prevent recovery from incidents and may indicate

        malicious activity such as ransomware, data destruction, or an attempt to
        cover tracks after a security breach.

        Adversaries may delete snapshots to maximize damage, prevent forensic investigation,
        or hinder recovery efforts.

        This rule triggers when multiple snapshots are deleted by the same user within
        a 1-minut'
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        cloudApplications:
        - id: cloudApplication1
          nameColumn: ProjectId
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1485
        - technique: T1490
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.001
      customDetails:
        ProjectId: ProjectId
        SnapshotCount: SnapshotCount
        SnapshotList: SnapshotList
        FirstDeletion: FirstDeletion
        LastDeletion: LastDeletion
        DeletionTimeSpan: DeletionTimeSpan
        CallerIPs: CallerIPs
        UserAgent: UserAgent
        AccountFullName: PrincipalEmail
status: Available
