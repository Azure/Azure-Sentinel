properties:
  id: xdr-8f3e9c2d-5b4a-4d6e-9a7c-2f8b5e1d3c9a
  displayName: GCP Audit Logs - VPC Flow Logs Disabled
  status: disabled
  queryCondition:
    queryText: "GCPAuditLogs\n| where ServiceName == \"networkmanagement.googleapis.com\"\
      \n| where MethodName has_any (\"VpcFlowLogsService.UpdateVpcFlowLogsConfig\"\
      , \"VpcFlowLogsService.DeleteVpcFlowLogsConfig\")\n| extend\n    RequestJson\
      \ = parse_json(Request),\n    RequestMetadataJson = parse_json(RequestMetadata),\n\
      \    AuthInfoJson = parse_json(AuthenticationInfo),\n    AuthzInfoJson = parse_json(AuthorizationInfo)\n\
      | extend\n    FlowLogsConfigName = split(GCPResourceName, \"/\")[-1],\n    ConfigState\
      \ = tostring(RequestJson.vpc_flow_logs_config.state),\n    CallerIpAddress =\
      \ tostring(RequestMetadataJson.callerIp),\n    AuthEmail = tostring(AuthInfoJson.principalEmail),\n\
      \    Permission = tostring(AuthzInfoJson[0].permission),\n    PermissionType\
      \ = tostring(AuthzInfoJson[0].permissionType),\n    PermissionGranted = tostring(AuthzInfoJson[0].granted)\n\
      | where PermissionType == \"ADMIN_WRITE\"\n| where MethodName has \"DeleteVpcFlowLogsConfig\"\
      \ or ConfigState == \"DISABLED\"\n| extend\n    Action = case(\n        MethodName\
      \ has \"DeleteVpcFlowLogsConfig\", \"Deleted\",\n        ConfigState == \"DISABLED\"\
      , \"Disabled\",\n        \"Modified\"),\n    AccountName = tostring(split(PrincipalEmail,\
      \ \"@\")[0]),\n    AccountUPNSuffix = tostring(split(PrincipalEmail, \"@\")[1])\n\
      | project TimeGenerated,\n          PrincipalEmail,\n          AuthEmail,\n\
      \          ProjectId,\n          ResourceName = GCPResourceName,\n         \
      \ FlowLogsConfigName,\n          Action,\n          CallerIpAddress,\n     \
      \     MethodName,\n          ServiceName,\n          Severity,\n          Permission,\n\
      \          PermissionGranted,\n          LogName,\n          InsertId,\n   \
      \       AccountName,\n          AccountUPNSuffix"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GCP Audit Logs - VPC Flow Logs Disabled
      description: '''Detects when Google Cloud Platform VPC Flow Logs configurations
        are disabled or deleted.

        VPC Flow Logs capture information about IP traffic going to and from network
        interfaces in VPC networks, providing critical visibility for security monitoring
        and forensic analysis.

        Disabling VPC Flow Logs reduces network visibility and may indicate an attempt
        to evade detection before performing malicious activities.

        Adversaries may disable flow logs to hide lateral movement, data exfiltration,
        or command and control traffic.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: CallerIpAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: ProjectId
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.001
      customDetails:
        ProjectId: ProjectId
        FlowLogsConfigName: FlowLogsConfigName
        ResourceName: ResourceName
        Action: Action
        Permission: Permission
        AccountFullName: PrincipalEmail
status: Available
