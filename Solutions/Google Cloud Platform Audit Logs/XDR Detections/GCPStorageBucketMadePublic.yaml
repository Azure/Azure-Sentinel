properties:
  id: xdr-3a8d7f9e-4b2c-4e5d-8c6b-9f1a3d5e8c7b
  displayName: GCP Audit Logs - Storage Bucket Made Public
  status: disabled
  queryCondition:
    queryText: "GCPAuditLogs\n| where ServiceName == \"storage.googleapis.com\"\n\
      | where MethodName == \"storage.setIamPermissions\"\n| where GCPResourceType\
      \ == \"gcs_bucket\"\n| extend\n    ServiceDataJson = parse_json(ServiceData),\n\
      \    RequestMetadataJson = parse_json(RequestMetadata),\n    AuthInfoJson =\
      \ parse_json(AuthenticationInfo),\n    AuthzInfoJson = parse_json(AuthorizationInfo)\n\
      | extend PolicyDelta = ServiceDataJson.policyDelta.bindingDeltas\n| mv-expand\
      \ PolicyDelta\n| extend\n    Action = tostring(PolicyDelta.action),\n    Member\
      \ = tostring(PolicyDelta.member),\n    Role = tostring(PolicyDelta.role)\n|\
      \ where Action == \"ADD\"\n| where Member in~ (\"allUsers\", \"allAuthenticatedUsers\"\
      )\n| extend\n    BucketName = extract(@\"buckets/([^/]+)\", 1, GCPResourceName),\n\
      \    CallerIpAddress = tostring(RequestMetadataJson.callerIp),\n    UserAgent\
      \ = tostring(RequestMetadataJson.callerSuppliedUserAgent),\n    AuthEmail =\
      \ tostring(AuthInfoJson.principalEmail),\n    Permission = tostring(AuthzInfoJson[0].permission),\n\
      \    PermissionGranted = tostring(AuthzInfoJson[0].granted)\n| extend\n    PublicAccessType\
      \ = case(\n        Member =~ \"allUsers\", \"Public to Everyone\",\n       \
      \ Member =~ \"allAuthenticatedUsers\", \"Public to All Authenticated Users\"\
      ,\n        \"Unknown\"),\n    AccountName = tostring(split(PrincipalEmail, \"\
      @\")[0]),\n    AccountUPNSuffix = tostring(split(PrincipalEmail, \"@\")[1])\n\
      | project TimeGenerated,\n          PrincipalEmail,\n          AuthEmail,\n\
      \          ProjectId,\n          BucketName,\n          ResourceName = GCPResourceName,\n\
      \          PublicAccessType,\n          Member,\n          Role,\n         \
      \ CallerIpAddress,\n          UserAgent,\n          MethodName,\n          ServiceName,\n\
      \          Severity,\n          Permission,\n          PermissionGranted,\n\
      \          LogName,\n          InsertId,\n          AccountName,\n         \
      \ AccountUPNSuffix"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GCP Audit Logs - Storage Bucket Made Public
      description: '''Detects when a Google Cloud Storage bucket is made publicly
        accessible by granting permissions to allUsers or allAuthenticatedUsers.

        Making buckets public can expose sensitive data to unauthorized access and
        may indicate a misconfiguration or malicious activity.

        Adversaries may make buckets public to exfiltrate data or as part of a data
        exposure attack.

        This rule monitors setIamPermissions operations that add public access roles
        to storage buckets.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: CallerIpAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: ProjectId
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1530
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      - tactic: Exfiltration
        techniques:
        - technique: T1567
          subTechniques:
          - T1567.002
      customDetails:
        ProjectId: ProjectId
        BucketName: BucketName
        ResourceName: ResourceName
        PublicAccessType: PublicAccessType
        RoleGranted: Role
        UserAgent: UserAgent
        Permission: Permission
        AccountFullName: PrincipalEmail
status: Available
