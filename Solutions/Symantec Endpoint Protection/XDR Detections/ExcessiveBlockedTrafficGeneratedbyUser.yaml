properties:
  id: xdr-fa0ab69c-7124-4f62-acdd-61017cf6ce89
  displayName: Excessive Blocked Traffic Events Generated by User
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 15;
      let NoteableEvents = SymantecEndpointProtection
      | where LogType == "Agent Traffic Logs"
      | where Action =~ "Blocked"
      | summarize TotalBlockedEvents = count() by UserName
      | where TotalBlockedEvents > threshold;
      SymantecEndpointProtection
      | where LogType =~ "Agent Traffic Logs"
      | where Action =~ "Blocked"
      | join kind=inner (NoteableEvents) on UserName
      | summarize StartTimeUtc = min(TimeGenerated), EndTimeUtc = max(TimeGenerated), Total = count() by UserName, RuleName, ServerName, LocalHostIpAddr, LocalPortNumber, TrafficDirection, RemoteHostIpAddr, RemotePortNumber, ApplicationName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Excessive Blocked Traffic Events Generated by User
      description: '''Creates an incident when a Symantec Endpoint Proection agent detects excessive amounts of blocked traffic
        generated by a single user.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: LocalHostIpAddr
        - id: ip2
          addressColumn: RemoteHostIpAddr
        hosts:
        - id: host1
          nameColumn: ServerName
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1041
      - tactic: CommandAndControl
        techniques:
        - technique: T1132
        - technique: T1001
      - tactic: LateralMovement
        techniques:
        - technique: T1021
      customDetails:
        AccountFullName: UserName
        HostFullName: ServerName
