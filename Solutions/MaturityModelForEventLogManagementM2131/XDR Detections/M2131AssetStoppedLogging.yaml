properties:
  id: xdr-4be5b645-1d08-49e4-b58d-07294ff19223
  displayName: M2131_AssetStoppedLogging
  status: disabled
  queryCondition:
    queryText: |-
      let LastHeartbeatTime = Heartbeat
      | summarize LastHeartbeat_Time = arg_max(TimeGenerated, *) by ResourceId;
      Heartbeat
      | where TimeGenerated > ago(14d)
      | summarize LastHeartbeat_Hours = datetime_diff("hour",now(), max(TimeGenerated)) by ResourceId
      | where ResourceId <> ""
      | where ResourceId <> "None"
      | join kind=inner (LastHeartbeatTime) on ResourceId
      | where LastHeartbeat_Hours > 24
      | project LastHeartbeat_Hours, LastHeartbeat_Time, Computer, ComputerIP, Category, OSType, OSName, ResourceId, SubscriptionId, ResourceGroup, RemoteIPCountry
      | sort by LastHeartbeat_Hours desc
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: M2131_AssetStoppedLogging
      description: '''This alert is designed to monitor assets within the Maturity Model for Event Log Management (M-21-31)
        standard. The alert triggers when a monitored asset fails to provide a heartbeat within 24 hours.'''
      severity: medium
      entityMappings:
        azureResources:
        - id: azureResource1
          resourceIdColumn: ResourceId
        hosts:
        - id: host1
          nameColumn: Computer
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1082
