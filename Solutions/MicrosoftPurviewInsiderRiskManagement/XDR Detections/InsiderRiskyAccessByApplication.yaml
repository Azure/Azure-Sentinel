properties:
  id: xdr-insider-risk-risky-user-access-by-application-15386bba
  displayName: Insider Risk_Risky User Access By Application
  status: disabled
  queryCondition:
    queryText: |-
      SigninLogs
      | where RiskState == "atRisk"
      | project UserPrincipalName, Location, AppDisplayName, RiskState
      | evaluate basket(0.01) // Adjust & Tune Thresholds within Organzational Requirements
      // | where Percent > 50 // Adjust & Tune Thresholds within Organzational Requirements
      | where UserPrincipalName <> ""
      | where AppDisplayName <> ""
      | project Percent, UserPrincipalName, Location, AppDisplayName, RiskState
      // | lookup kind=inner _GetWatchlist('<Your Watchlist Name>') on $left.UserPrincipalName == $right.SearchKey
      | sort by Percent desc
      | extend AccountName = tostring(split(UserPrincipalName, "@")[0]), AccountUPNSuffix = tostring(split(UserPrincipalName, "@")[1])
  schedule:
    frequency: PT6H
  detectionAction:
    alertTemplate:
      title: Insider Risk_Risky User Access By Application
      description: '''This alert evaluates Microsoft Entra ID Sign in risk via Machine Learning correlations in the basket
        operator. The basket threshold is adjustable, and the default is set to .01. There is an optional configuration to
        configure the percentage rates. The correlations are designed to leverage machine learning to identify patterns of
        risky user application access. There is an option for configuration of correlations against Microsoft Sentinel watchlists.
        For more information, see [Tutorial: Use risk detections for user sign-ins to trigger Microsoft Entra ID Multi-Factor
        Authentication or password '
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1204
