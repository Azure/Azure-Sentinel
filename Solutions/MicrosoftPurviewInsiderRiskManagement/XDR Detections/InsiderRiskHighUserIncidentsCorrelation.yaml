properties:
  id: xdr-28a75d10-9b75-4192-9863-e452c3ad24db
  displayName: Insider Risk_High User Security Incidents Correlation
  status: disabled
  queryCondition:
    queryText: "let UserAlerts = AlertInfo\n| where Timestamp > ago(7d)\n| join kind=inner (\n    AlertEvidence\n    | where Timestamp > ago(7d)\n    | where EntityType in~ (\"User\", \"Account\") or isnotempty(AccountUpn) or isnotempty(AccountName)\n    | extend ParsedFields = todynamic(AdditionalFields)\n    | extend Name = iff(isnotempty(AccountName), AccountName, tostring(ParsedFields.Name)),\n             UPNSuffix = iff(isnotempty(AccountDomain), AccountDomain, tostring(ParsedFields.UPNSuffix))\n    | extend UPN = iff(isnotempty(AccountUpn), AccountUpn, iff(isnotempty(Name) and isnotempty(UPNSuffix), strcat(Name, \"@\", UPNSuffix), \"\"))\n    | where isnotempty(UPN)\n    | project AlertId, Name, UPNSuffix, UPN\n) on AlertId;\nUserAlerts\n| where ServiceSource in~ (\"Microsoft 365 Insider Risk Management\", \"Microsoft Purview Insider Risk Management\")\n| join kind=inner (\n    UserAlerts\n    | summarize arg_max(Timestamp, *) by AlertId\n    | where Severity =~ \"High\"\n    | summarize\
      \ count() by UPN\n    | where count_ >= 2\n) on UPN\n| summarize arg_max(Timestamp, *) by AlertId\n| join kind=inner (\n    UserAlerts\n    | where ServiceSource !in~ (\"Microsoft 365 Insider Risk Management\", \"Microsoft Purview Insider Risk Management\")\n    | summarize arg_max(Timestamp, *) by AlertId\n    | where Severity =~ \"High\"\n    | project\n        UPN,\n        AlertName1 = Title,\n        ServiceSource,\n        AttackTechniques\n) on UPN\n| project\n    Timestamp,\n    AlertId,\n    Name,\n    UPNSuffix,\n    UPN,\n    AlertName1,\n    ServiceSource,\n    AttackTechniques,\n    Category,\n    DetectionSource"
  schedule:
    frequency: P7D
  detectionAction:
    alertTemplate:
      title: Insider Risk_High User Security Incidents Correlation
      description: '''This alert joins SecurityAlerts to SecurityIncidents to associate Security Alerts and Incidents with user accounts. This aligns all Microsoft Alerting Products with Microsoft Incident Generating Products (Microsoft Sentinel, M365 Defender) for a count of user security incidents over time. The default threshold is 5 security incidents, and this is customizable per the organization''s requirements. Results include UserPrincipalName (UPN), SecurityIncident, LastIncident, ProductName, LastObservedTime, and Previous Incidents. There is an option for configuration of correlations against Microsoft S'
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1204
      customDetails:
        AccountFullName: UPN
