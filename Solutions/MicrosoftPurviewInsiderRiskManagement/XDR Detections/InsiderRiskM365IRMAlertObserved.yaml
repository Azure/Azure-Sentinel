properties:
  id: xdr-69660e65-0e5c-4700-8b99-5caf59786606
  displayName: Insider Risk_Microsoft Purview Insider Risk Management Alert Observed
  status: disabled
  queryCondition:
    queryText: "let UserAlerts = AlertInfo\n| where Timestamp > ago(7d)\n| join kind=inner (\n    AlertEvidence\n    | where Timestamp > ago(7d)\n    | where EntityType in~ (\"User\", \"Account\") or isnotempty(AccountUpn) or isnotempty(AccountName)\n    | extend ParsedFields = todynamic(AdditionalFields)\n    | extend Name = iff(isnotempty(AccountName), AccountName, tostring(ParsedFields.Name)),\n             UPNSuffix = iff(isnotempty(AccountDomain), AccountDomain, tostring(ParsedFields.UPNSuffix))\n    | extend UserPrincipalName = iff(isnotempty(AccountUpn), AccountUpn, iff(isnotempty(Name) and isnotempty(UPNSuffix), strcat(Name, \"@\", UPNSuffix), \"\"))\n    | where isnotempty(UserPrincipalName)\n    | project AlertId, Name, UPNSuffix, UserPrincipalName\n) on AlertId;\nUserAlerts\n| where Timestamp > ago(6h)\n| where ServiceSource in~ (\"Microsoft 365 Insider Risk Management\", \"Microsoft Purview Insider Risk Management\")\n| summarize arg_max(Timestamp, *) by AlertId\n| join kind=inner\
      \ (\n    UserAlerts\n    | where ServiceSource !in~ (\"Microsoft 365 Insider Risk Management\", \"Microsoft Purview Insider Risk Management\")\n    | summarize arg_max(Timestamp, *) by AlertId\n    | project\n        UserPrincipalName,\n        AlertName1 = Title,\n        ServiceSource,\n        AttackTechniques\n) on UserPrincipalName\n| project\n    Timestamp,\n    AlertId,\n    Name,\n    UPNSuffix,\n    UserPrincipalName,\n    AlertName1,\n    ServiceSource,\n    AttackTechniques,\n    Category,\n    DetectionSource"
  schedule:
    frequency: PT6H
  detectionAction:
    alertTemplate:
      title: Insider Risk_Microsoft Purview Insider Risk Management Alert Observed
      description: '''This alert is triggered when a Microsoft Purview Insider Risk Management alert is recieved in Microsoft Sentinel via the Microsoft Purview Insider Risk Management Connector. The alert extracts usernames from security alerts to provide UserPrincipalName, Alert Name, Reporting Product Name, Status, Alert Link, Previous Alerts Links, Time Generated. There is an option for configuration of correlations against Microsoft Sentinel watchlists. For more information, see [Learn about insider risk management](https://docs.microsoft.com/microsoft-365/compliance/insider-risk-management)'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1204
      customDetails:
        AccountFullName: UserPrincipalName
