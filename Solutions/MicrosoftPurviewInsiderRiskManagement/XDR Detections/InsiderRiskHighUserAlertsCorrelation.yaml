properties:
  id: xdr-a4fb4255-f55b-4c24-b396-976ee075d406
  displayName: Insider Risk_High User Security Alert Correlations
  status: disabled
  queryCondition:
    queryText: "let UserAlerts = AlertInfo\n| where Timestamp > ago(7d)\n| join kind=inner (\n    AlertEvidence\n    | where Timestamp > ago(7d)\n    | where EntityType in~ (\"User\", \"Account\") or isnotempty(AccountUpn) or isnotempty(AccountName)\n    | extend ParsedFields = todynamic(AdditionalFields)\n    | extend Name = iff(isnotempty(AccountName), AccountName, tostring(ParsedFields.Name)),\n             UPNSuffix = iff(isnotempty(AccountDomain), AccountDomain, tostring(ParsedFields.UPNSuffix))\n    | extend UPN = iff(isnotempty(AccountUpn), AccountUpn, iff(isnotempty(Name) and isnotempty(UPNSuffix), strcat(Name, \"@\", UPNSuffix), \"\"))\n    | where isnotempty(UPN)\n    | project AlertId, Name, UPNSuffix, UPN\n) on AlertId;\nUserAlerts\n| where ServiceSource in~ (\"Microsoft 365 Insider Risk Management\", \"Microsoft Purview Insider Risk Management\")\n| join kind=inner (\n    UserAlerts\n    | summarize arg_max(Timestamp, *) by AlertId\n    | summarize count() by UPN\n    | where\
      \ count_ >= 5\n) on UPN\n| summarize arg_max(Timestamp, *) by AlertId\n| join kind=inner (\n    UserAlerts\n    | where ServiceSource !in~ (\"Microsoft 365 Insider Risk Management\", \"Microsoft Purview Insider Risk Management\")\n    | summarize arg_max(Timestamp, *) by AlertId\n    | project\n        UPN,\n        AlertName1 = Title,\n        ServiceSource,\n        AttackTechniques\n) on UPN\n| project\n    Timestamp,\n    AlertId,\n    Name,\n    UPNSuffix,\n    UPN,\n    AlertName1,\n    ServiceSource,\n    AttackTechniques,\n    Category,\n    DetectionSource"
  schedule:
    frequency: P7D
  detectionAction:
    alertTemplate:
      title: Insider Risk_High User Security Alert Correlations
      description: '''This alert joins SecurityAlerts from Microsoft Products with SecurityIncidents from Microsoft Sentinel and Microsoft Defender XDR. This join allows for identifying patterns in user principal names associated with respective security alerts. A machine learning function (Basket) is leveraged with a .001 threshold. Baset finds all frequent patterns of discrete attributes (dimensions) in the data. It returns the frequent patterns passed the frequency threshold. This query evaluates UserPrincipalName for patterns in SecurityAlerts and Reporting Security Tools. This query can be further tuned/confi'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1204
      customDetails:
        AccountFullName: UPN
