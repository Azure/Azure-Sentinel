id: 7ab54aed-f97e-4202-a624-3cbd496c3b68
name: Delinea - Bulk secret export / access
description: |
  Detects a single user accessing or exporting an unusually large number of distinct secrets in
  Delinea Secret Server within a short window. In addition to secret views, this rule also matches
  export / download / retrieve operations, which are a stronger signal of vault scraping prior to
  exfiltration ("secret hoarding"). Tune 'threshold' to your environment's normal access patterns.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: DelineaPlatformConnector
    dataTypes:
      - DelineaAuditEvents_CL
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
  - Exfiltration
relevantTechniques:
  - T1555
  - T1212
query: |
  let threshold = 10;
  // Must stay <= queryPeriod. Wider than queryFrequency so a burst that straddles two runs
  // still reaches the threshold.
  let lookback = 1h;
  // Must equal queryFrequency. A user is only evaluated when a secret event of theirs was
  // ingested since the previous run, so the next run does not re-alert on a burst it has
  // already counted - see 'Delinea - Failed authentication spike'.
  let newSince = 30m;
  let secretEventPattern = @"(?i)\.Secret\.(Viewed|Exported|Downloaded|Retrieved|Copied)";
  let secretEvents =
      DelineaAuditEvents_CL
      | where TimeGenerated > ago(lookback)
      | extend IngestedAt = ingestion_time()
      | extend d = parse_json(RawData)
      | extend EventName = tostring(d.eventType.name), SrcIP = tostring(d.source.host.network.ipAddress)
      | where EventName matches regex secretEventPattern;
  let recentUsers = secretEvents | where IngestedAt > ago(newSince) | distinct User;
  secretEvents
  | where User in (recentUsers)
  | extend IsExport = EventName has_any ("Exported", "Downloaded", "Retrieved", "Copied")
  | summarize DistinctSecrets = dcount(SecretId), Secrets = make_set(SecretId, 50),
              TotalOperations = count(), Exports = countif(IsExport), Secret = take_any(SecretId),
              StartTime = min(TimeGenerated), EndTime = max(TimeGenerated)
          by User, SrcIP
  | where DistinctSecrets >= threshold
  | sort by DistinctSecrets desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: User
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIP
customDetails:
  DistinctSecrets: DistinctSecrets
  TotalOperations: TotalOperations
  Exports: Exports
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: P1D
    matchingMethod: Selected
    groupByEntities:
      - Account
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.3.1
kind: Scheduled

