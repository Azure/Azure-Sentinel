properties:
  id: xdr-09690f9b-33d1-4372-a6aa-eb7d3b3cdebc
  displayName: Bitglass - Multiple files shared with external entity
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5;

      Bitglass

      | where EventType =~ ''cloudaudit''

      | where Action =~ ''Action  DLPScan''

      | where EventMessage has_all (''External'', ''Shared'', ''DLP'')

      | summarize f_cnt = makeset(SrcFileName) by User, bin(TimeGenerated, 10m)

      | where array_length(f_cnt) >= threshold

      | extend AccountCustomEntity = User'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Bitglass - Multiple files shared with external entity
      description: '''Detects when multiple files shared with external entity.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      customDetails:
        AccountName: AccountCustomEntity
