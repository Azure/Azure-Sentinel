properties:
  id: xdr-7c570bfc-9f20-490e-80e8-b898c7ce4bda
  displayName: Bitglass - Multiple failed logins
  status: disabled
  queryCondition:
    queryText: 'let threshold = 10;

      Bitglass

      | where EventType =~ ''access''

      | where EventResultDetails =~ ''Failed login attempt.''

      | summarize count() by User, bin(TimeGenerated, 10m)

      | where count_ >= threshold

      | extend AccountCustomEntity = User'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Bitglass - Multiple failed logins
      description: '''Detects multiple failed logins.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountName: AccountCustomEntity
