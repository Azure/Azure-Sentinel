properties:
  id: xdr-4b272e82-19f1-40d1-bfdf-74fbb6353e8b
  displayName: Bitglass - Suspicious file uploads
  status: disabled
  queryCondition:
    queryText: 'Bitglass

      | where EventType =~ ''swgwebdlp''

      | where HttpRequestMethod =~ ''POST''

      | where isnotempty(DlpPattern)

      | summarize count() by User, bin(TimeGenerated, 15m)

      | where count_ > 1

      | extend AccountCustomEntity = User'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Bitglass - Suspicious file uploads
      description: '''Detects suspicious file upload activity.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      customDetails:
        AccountName: AccountCustomEntity
