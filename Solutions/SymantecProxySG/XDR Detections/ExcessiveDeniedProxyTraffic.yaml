properties:
  id: xdr-7a58b253-0ef2-4248-b4e5-c350f15a8346
  displayName: Excessive Denied Proxy Traffic
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 100;
      SymantecProxySG
      | where sc_filter_result =~ "DENIED"
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), count() by c_ip, cs_host
      | where count_ > threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Excessive Denied Proxy Traffic
      description: '''This alert creates an incident when a client generates an excessive amounts of denied proxy traffic.'''
      severity: low
      entityMappings:
        hosts:
        - id: host1
          nameColumn: cs_host
        ips:
        - id: ip1
          addressColumn: c_ip
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
      - tactic: CommandAndControl
        techniques:
        - technique: T1090
      customDetails:
        HostFullName: cs_host
