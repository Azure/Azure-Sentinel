properties:
  id: xdr-fb0f4a93-d8ad-4b54-9931-85bdb7550f90
  displayName: User Accessed Suspicious URL Categories
  status: disabled
  queryCondition:
    queryText: |-
      SymantecProxySG
      | mv-expand cs_categories
      | where cs_categories has_any ("Suspicious","phishing", "hacking")
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), count() by sc_filter_result, cs_userdn, c_ip, cs_host, Computer,  tostring(cs_categories)
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: User Accessed Suspicious URL Categories
      description: '''Creates an incident in the event the requested URL accessed by the user has been identified as Suspicious,
        Phishing, or Hacking.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: Computer
        ips:
        - id: ip1
          addressColumn: c_ip
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        AccountFullName: cs_userdn
        HostFullName: Computer
