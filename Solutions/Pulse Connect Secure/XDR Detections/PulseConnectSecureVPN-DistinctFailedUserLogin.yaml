properties:
  id: xdr-1fa1528e-f746-4794-8a41-14827f4cb798
  displayName: PulseConnectSecure - Large Number of Distinct Failed User Logins
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 100;
      PulseConnectSecure
      | where Messages startswith "Login failed"
      | summarize dcount(User) by Computer, bin(TimeGenerated, 15m)
      | where dcount_User > threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: PulseConnectSecure - Large Number of Distinct Failed User Logins
      description: '''This query identifies evidence of failed login attempts from a large number of distinct users on a Pulse
        Connect Secure VPN server'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: Computer
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        HostFullName: Computer
