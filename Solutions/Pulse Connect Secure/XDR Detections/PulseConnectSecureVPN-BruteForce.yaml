properties:
  id: xdr-34663177-8abf-4db1-b0a4-5683ab273f44
  displayName: PulseConnectSecure - Potential Brute Force Attempts
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 20;
      PulseConnectSecure
      | where Messages contains "Login failed"
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), count() by User, Source_IP
      | where count_ > threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: PulseConnectSecure - Potential Brute Force Attempts
      description: '''This query identifies evidence of potential brute force attack by looking at multiple failed attempts
        to log into the VPN server'''
      severity: low
      entityMappings:
        ips:
        - id: ip1
          addressColumn: Source_IP
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountFullName: User
