id: 1399A2AA-F54D-4265-A405-3CCE11BE226C
name: KELA Identity Guard Unresolved Incident
description: |
  Identifies unresolved incidents ingested from the KELA Identity Guard API, regardless of their original severity.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: KELAIdentityGuardCCFConnector
    dataTypes:
      - KELA_IdentityGuard_Incidents_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
  - InitialAccess
relevantTechniques:
  - T1078
  - T1555
query: |
  KELA_IdentityGuard_Incidents_CL
  | summarize arg_max(TimeGenerated, *) by incidentId
  | where status =~ 'UNRESOLVED'
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: accountUserName
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: link
version: 1.0.0
kind: Scheduled