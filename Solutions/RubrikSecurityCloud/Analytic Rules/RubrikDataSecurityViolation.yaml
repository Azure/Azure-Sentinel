id: 5b70b78e-397c-474c-a556-f6c37fccbb18
name: Create Incident for Data Security Violation events for DSPM license users
version: 1.0.0
kind: Scheduled
description: |
  'Creates an incident for Data Security Violation events for DSPM license users.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: RubrikSecurityCloudAzureFunctions
    dataTypes:
      - RubrikViolationData
queryFrequency: 5m
queryPeriod: 5m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Exfiltration
relevantTechniques:
  - T1567
query: |
  Rubrik_Violation_Data_CL
  | where class_s == "SecurityViolation" and custom_details_eventName_s in ("CriticalSeverityDataViolationDetected",
  "CriticalSeverityDataViolationReOpen",
  "HighSeverityDataViolationDetected",
  "HighSeverityDataViolationReOpen",
  "LowOrMediumSeverityDataViolationDetected",
  "LowOrMediumSeverityDataViolationReOpen")
  | extend NewSeverity = case(severity_s=="info", "Low",
                              severity_s=="warning", "Medium",
                              severity_s=="critical", "High",
                              "Informational"),
           ObjectId = iff(isnotempty(custom_details_objectId_s), custom_details_objectId_s, tostring(custom_details_objectId_g)),
           ViolationId = iff(isnotempty(custom_details_seriesId_s), custom_details_seriesId_s, tostring(custom_details_seriesId_g))
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: P7D
    matchingMethod: Selected
    groupByCustomDetails:
      - ViolationId
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: '{{class_s}} event occurred for object {{custom_details_objectName_s}} with type {{custom_details_objectType_s}}'
  alertDescriptionFormat: '{{summary_s}}'
  alertSeverityColumnName: NewSeverity
customDetails:
  ObjectId: ObjectId
  ObjectName: custom_details_objectName_s
  ObjectType: custom_details_objectType_s
  EventType: class_s
  EventName: custom_details_eventName_s
  ViolationId: ViolationId
  Summary: summary_s
  EventTimestamp: timestamp_t
  Severity: severity_s
