properties:
  id: xdr-5b70b78e-397c-474c-a556-f6c37fccbb18
  displayName: Create Incident for Data Security Violation events for DSPM license users
  status: disabled
  queryCondition:
    queryText: |-
      Rubrik_Violation_Data_CL
      | where class_s == "SecurityViolation" and custom_details_eventName_s in ("CriticalSeverityDataViolationDetected",
      "CriticalSeverityDataViolationReOpen",
      "HighSeverityDataViolationDetected",
      "HighSeverityDataViolationReOpen",
      "LowOrMediumSeverityDataViolationDetected",
      "LowOrMediumSeverityDataViolationReOpen")
      | extend NewSeverity = case(severity_s=="info", "Low",
                                  severity_s=="warning", "Medium",
                                  severity_s=="critical", "High",
                                  "Informational"),
               ObjectId = iff(isnotempty(custom_details_objectId_s), custom_details_objectId_s, tostring(custom_details_objectId_g)),
               ViolationId = iff(isnotempty(custom_details_seriesId_s), custom_details_seriesId_s, tostring(custom_details_seriesId_g))
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Create Incident for Data Security Violation events for DSPM license users
      description: '''Creates an incident for Data Security Violation events for DSPM license users.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: custom_details_objectName_s
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      customDetails:
        ObjectId: ObjectId
        ObjectName: custom_details_objectName_s
        ObjectType: custom_details_objectType_s
        EventType: class_s
        EventName: custom_details_eventName_s
        ViolationId: ViolationId
        Summary: summary_s
        EventTimestamp: timestamp_t
        Severity: severity_s
