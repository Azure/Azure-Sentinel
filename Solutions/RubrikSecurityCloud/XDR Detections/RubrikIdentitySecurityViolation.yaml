properties:
  id: xdr-77e7519f-be7e-41fc-8f02-76bb0a7d5496
  displayName: Create Incident for Identity Security Violation and Identity Alerts events for IR violations
  status: disabled
  queryCondition:
    queryText: |-
      Rubrik_Violation_Data_CL
      | where (class_s == "IdentityViolation" and custom_details_eventName_s in ("CriticalSeverityDataViolationDetected",
      "CriticalSeverityDataViolationReOpen", "HighSeverityDataViolationDetected",
      "HighSeverityDataViolationReOpen", "LowOrMediumSeverityDataViolationDetected",
      "LowOrMediumSeverityDataViolationReOpen")) or
      (class_s == "IdentityAlerts" and custom_details_eventName_s in ("CriticalSeverityIdentityAlertDetected",
      "CriticalSeverityIdentityAlertReOpened", "HighSeverityIdentityAlertDetected",
      "HighSeverityIdentityAlertReOpened", "LowOrMediumSeverityIdentityAlertDetected",
      "LowOrMediumSeverityIdentityAlertReOpened"
      ))
      | extend NewSeverity = case(severity_s=="info", "Low",
                                  severity_s=="warning", "Medium",
                                  severity_s=="critical", "High",
                                  "Informational"),
               ObjectId = iff(isnotempty(custom_details_objectId_s), custom_details_objectId_s, tostring(custom_details_objectId_g)),
               ViolationId = iff(isnotempty(custom_details_seriesId_s), custom_details_seriesId_s, tostring(custom_details_seriesId_g))
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Create Incident for Identity Security Violation and Identity Alerts events for IR violations
      description: '''Creates an incident for Identity Security Violation and Identity Alerts events for IR violations.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: custom_details_objectName_s
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        ObjectId: ObjectId
        ObjectName: custom_details_objectName_s
        ObjectType: custom_details_objectType_s
        EventType: class_s
        EventName: custom_details_eventName_s
        ViolationId: ViolationId
        Summary: summary_s
        EventTimestamp: timestamp_t
        Severity: severity_s
