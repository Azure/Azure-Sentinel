properties:
  id: xdr-9563dc15-ea0a-438a-9d50-7ab243378241
  displayName: Create Incident for Classification events for non DSPM license users
  status: disabled
  queryCondition:
    queryText: |-
      Rubrik_Violation_Data_CL
      | where class_s == "Classification" and custom_details_eventName_s in ("ClassficationResultsAvailable", "ClassificationResultsAvailable")
      | extend NewSeverity = case(severity_s=="info", "Low",
                                  severity_s=="warning", "Medium",
                                  severity_s=="critical", "High",
                                  "Informational"),
               ObjectId = iff(isnotempty(custom_details_objectId_s), custom_details_objectId_s, tostring(custom_details_objectId_g)),
               SnapshotId = custom_details_snapshotId_s
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Create Incident for Classification events for non DSPM license users
      description: '''Creates an incident for Classification events (ClassficationResultsAvailable) for non DSPM license users.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: custom_details_objectName_s
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1213
      customDetails:
        ObjectId: ObjectId
        ObjectName: custom_details_objectName_s
        ObjectType: custom_details_objectType_s
        EventType: class_s
        EventName: custom_details_eventName_s
        Summary: summary_s
        EventTimestamp: timestamp_t
        Severity: severity_s
        SnapshotId: custom_details_snapshotId_s
