Function:
  Title: Parser for Check Point Email Security Anti-Phishing Exceptions
  Version: '1.0.0'
  LastUpdated: '2026-08-24'
Category: Microsoft Sentinel Parser
FunctionName: CheckPointEmailSecAntiPhishingExceptions
FunctionAlias: CheckPointEmailSecAntiPhishingExceptions
FunctionQuery: |
  union isfuzzy=true
      (
          CheckPointEmailSecAntiPhishingExceptions_CL
          | extend EntityId = tostring(column_ifexists('EntityId', ''))
          | summarize arg_max(TimeGenerated, *) by EntityId
      )
