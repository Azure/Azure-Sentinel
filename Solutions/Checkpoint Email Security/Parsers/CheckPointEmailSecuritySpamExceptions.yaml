Function:
  Title: Parser for Check Point Email Security Spam Exceptions
  Version: '1.0.0'
  LastUpdated: '2026-08-24'
Category: Microsoft Sentinel Parser
FunctionName: CheckPointEmailSecuritySpamExceptions
FunctionAlias: CheckPointEmailSecuritySpamExceptions
FunctionQuery: |
  union isfuzzy=true
      (
          CheckPointEmailSecuritySpamExceptions_CL
          | extend EntityId = tostring(column_ifexists('EntityId', ''))
          | summarize arg_max(TimeGenerated, *) by EntityId
      )
