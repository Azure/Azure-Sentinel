id: 5cba6723-ef08-4b4f-b971-71ffb16fc7e4
Function:
  Title: Parser for Mimecast Human Risk Individuals
  Version: '1.1.0'
  LastUpdated: '2026-10-21'
Category: Microsoft Sentinel Parser
FunctionName: MimecastHumanRiskIndividuals
FunctionAlias: MimecastHumanRiskIndividuals
FunctionQuery: |
    let dummy_table = datatable(TimeGenerated: datetime) [];
    let FactorLabel = (f: string) { case(f == 'veryLow', 'Very Low', f == 'low', 'Low', f == 'medium', 'Medium', f == 'high', 'High', f == 'veryHigh', 'Very High', 'Not Scored') };
    let MimecastHumanRiskIndividuals_view = view() {
    union isfuzzy=true
        dummy_table,
        MimecastHumanRisk_Individuals_CL
    | extend
        IndividualId = tostring(column_ifexists('IndividualId', '')),
        DisplayName = tostring(column_ifexists('DisplayName', '')),
        EmailAddress = tostring(column_ifexists('EmailAddress', '')),
        FirstName = tostring(column_ifexists('FirstName', '')),
        LastName = tostring(column_ifexists('LastName', '')),
        ManagerName = tostring(column_ifexists('ManagerName', '')),
        ManagerId = tostring(column_ifexists('ManagerId', '')),
        Department = tostring(column_ifexists('Department', '')),
        Location = tostring(column_ifexists('Location', '')),
        JobTitle = tostring(column_ifexists('JobTitle', '')),
        TenureMonths = toint(column_ifexists('TenureMonths', int(null))),
        TenureStatus = tostring(column_ifexists('TenureStatus', '')),
        StartDateTime = todatetime(column_ifexists('StartDateTime', datetime(null))),
        HumanRiskScore = toint(column_ifexists('HumanRiskScore', int(null))),
        HumanRiskFactor = tostring(column_ifexists('HumanRiskFactor', '')),
        AttackScore = toint(column_ifexists('AttackScore', int(null))),
        AttackFactor = tostring(column_ifexists('AttackFactor', '')),
        Behaviors = todynamic(column_ifexists('Behaviors', dynamic(null))),
        Attacks = todynamic(column_ifexists('Attacks', dynamic(null)))
    | extend
        BehaviorsSrc = iff(gettype(Behaviors) != 'array' or array_length(Behaviors) == 0, dynamic([{}]), Behaviors),
        AttacksSrc = iff(gettype(Attacks) != 'array' or array_length(Attacks) == 0, dynamic([{}]), Attacks)
    | mv-apply b = BehaviorsSrc on (summarize Bhv = make_bag(bag_pack(coalesce(tostring(b.type), 'none'), b)))
    | mv-apply a = AttacksSrc on (summarize Atk = make_bag(bag_pack(coalesce(tostring(a.type), 'none'), a)))
    | extend
        HumanRiskFactorLabel = FactorLabel(HumanRiskFactor),
        AttackFactorLabel = FactorLabel(AttackFactor),
        SimulatedPhishingScore = toint(Bhv.simulatedPhishing.score),
        SimulatedPhishingFactor = tostring(Bhv.simulatedPhishing.factor),
        SimulatedPhishingTrend = toint(Bhv.simulatedPhishing.trend),
        SimulatedPhishingEventCount = toint(Bhv.simulatedPhishing.eventCount),
        SimulatedPhishingEvents = Bhv.simulatedPhishing.events,
        ActualPhishingScore = toint(Bhv.actualPhishing.score),
        ActualPhishingFactor = tostring(Bhv.actualPhishing.factor),
        ActualPhishingTrend = toint(Bhv.actualPhishing.trend),
        ActualPhishingEventCount = toint(Bhv.actualPhishing.eventCount),
        ActualPhishingEvents = Bhv.actualPhishing.events,
        TrainingScore = toint(Bhv.training.score),
        TrainingFactor = tostring(Bhv.training.factor),
        TrainingTrend = toint(Bhv.training.trend),
        TrainingEventCount = toint(Bhv.training.eventCount),
        TrainingEvents = Bhv.training.events,
        MalwareScore = toint(Bhv.malware.score),
        MalwareFactor = tostring(Bhv.malware.factor),
        MalwareTrend = toint(Bhv.malware.trend),
        MalwareEventCount = toint(Bhv.malware.eventCount),
        MalwareEvents = Bhv.malware.events,
        SensitiveDataHandlingScore = toint(Bhv.sensitiveDataHandling.score),
        SensitiveDataHandlingFactor = tostring(Bhv.sensitiveDataHandling.factor),
        SensitiveDataHandlingTrend = toint(Bhv.sensitiveDataHandling.trend),
        SensitiveDataHandlingEventCount = toint(Bhv.sensitiveDataHandling.eventCount),
        SensitiveDataHandlingEvents = Bhv.sensitiveDataHandling.events,
        ActualPhishingAttackScore = toint(Atk.actualPhishing.score),
        ActualPhishingAttackFactor = tostring(Atk.actualPhishing.factor),
        ActualPhishingAttackTrend = toint(Atk.actualPhishing.trend),
        ActualPhishingAttackEventCount = toint(Atk.actualPhishing.eventCount),
        ActualPhishingAttackEvents = Atk.actualPhishing.events,
        MalwareAttackScore = toint(Atk.malware.score),
        MalwareAttackFactor = tostring(Atk.malware.factor),
        MalwareAttackTrend = toint(Atk.malware.trend),
        MalwareAttackEventCount = toint(Atk.malware.eventCount),
        MalwareAttackEvents = Atk.malware.events,
        IdentityAttackScore = toint(Atk.identity.score),
        IdentityAttackFactor = tostring(Atk.identity.factor),
        IdentityAttackTrend = toint(Atk.identity.trend),
        IdentityAttackEventCount = toint(Atk.identity.eventCount),
        IdentityAttackEvents = Atk.identity.events
    | project
        TimeGenerated,
        IndividualId,
        DisplayName,
        EmailAddress,
        FirstName,
        LastName,
        ManagerName,
        ManagerId,
        Department,
        Location,
        JobTitle,
        TenureMonths,
        TenureStatus,
        StartDateTime,
        HumanRiskScore,
        HumanRiskFactor,
        AttackScore,
        AttackFactor,
        HumanRiskFactorLabel,
        AttackFactorLabel,
        SimulatedPhishingScore,
        SimulatedPhishingFactor,
        SimulatedPhishingTrend,
        SimulatedPhishingEventCount,
        SimulatedPhishingEvents,
        ActualPhishingScore,
        ActualPhishingFactor,
        ActualPhishingTrend,
        ActualPhishingEventCount,
        ActualPhishingEvents,
        TrainingScore,
        TrainingFactor,
        TrainingTrend,
        TrainingEventCount,
        TrainingEvents,
        MalwareScore,
        MalwareFactor,
        MalwareTrend,
        MalwareEventCount,
        MalwareEvents,
        SensitiveDataHandlingScore,
        SensitiveDataHandlingFactor,
        SensitiveDataHandlingTrend,
        SensitiveDataHandlingEventCount,
        SensitiveDataHandlingEvents,
        ActualPhishingAttackScore,
        ActualPhishingAttackFactor,
        ActualPhishingAttackTrend,
        ActualPhishingAttackEventCount,
        ActualPhishingAttackEvents,
        MalwareAttackScore,
        MalwareAttackFactor,
        MalwareAttackTrend,
        MalwareAttackEventCount,
        MalwareAttackEvents,
        IdentityAttackScore,
        IdentityAttackFactor,
        IdentityAttackTrend,
        IdentityAttackEventCount,
        IdentityAttackEvents,
        Behaviors,
        Attacks
    };
    MimecastHumanRiskIndividuals_view
