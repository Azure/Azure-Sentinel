id: 2716f1d3-a1e7-4979-9c41-45941c12bdf8
Function:
  Title: Parser for Mimecast Human Risk Behaviors
  Version: '1.1.0'
  LastUpdated: '2026-10-21'
Category: Microsoft Sentinel Parser
FunctionName: MimecastHumanRiskBehaviors
FunctionAlias: MimecastHumanRiskBehaviors
FunctionQuery: |
    let dummy_table = datatable(TimeGenerated: datetime) [];
    let FactorLabel = (f: string) { case(f == 'veryLow', 'Very Low', f == 'low', 'Low', f == 'medium', 'Medium', f == 'high', 'High', f == 'veryHigh', 'Very High', 'Not Scored') };
    let MimecastHumanRiskBehaviors_view = view() {
    union isfuzzy=true
        dummy_table,
        MimecastHumanRisk_Behaviors_CL
    | extend
        BehaviorType = tostring(column_ifexists('BehaviorType', '')),
        Score = toint(column_ifexists('Score', int(null))),
        Factor = tostring(column_ifexists('Factor', '')),
        EventCount = toint(column_ifexists('EventCount', int(null))),
        Trend = toint(column_ifexists('Trend', int(null))),
        Events = todynamic(column_ifexists('Events', dynamic(null)))
    | extend
        BehaviorName = case(BehaviorType == 'training', 'Training', BehaviorType == 'simulatedPhishing', 'Simulated Phishing', BehaviorType == 'actualPhishing', 'Actual Phishing', BehaviorType == 'malware', 'Malware', BehaviorType == 'sensitiveDataHandling', 'Sensitive Data Handling', BehaviorType),
        FactorLabel = FactorLabel(Factor),
        EventAssigned = toint(Events.assigned),
        EventCompleted = toint(Events.completed),
        EventOverdue = toint(Events.overdue),
        EventDelivered = toint(Events.delivered),
        EventOpened = toint(Events.opened),
        EventClicked = toint(Events.clicked),
        EventReported = toint(Events.reported),
        EventSubmittedData = toint(Events.submittedData),
        EventAttachmentOpened = toint(Events.attachmentOpened),
        EventBlocked = toint(Events.blocked),
        EventRemediated = toint(Events.remediated),
        EventFalsePositiveRemediated = toint(Events.falsePositiveRemediated),
        EventAttachmentDownloaded = toint(Events.attachmentDownloaded),
        EventDownloadAttempted = toint(Events.downloadAttempted),
        EventDownloaded = toint(Events.downloaded),
        EventExecuted = toint(Events.executed),
        EventUnknown = toint(Events.unknown),
        EventProperlyHandled = toint(Events.properlyHandled),
        EventImproperlyHandled = toint(Events.improperlyHandled)
    | project
        TimeGenerated,
        BehaviorType,
        BehaviorName,
        Score,
        Factor,
        FactorLabel,
        EventCount,
        Trend,
        Events,
        EventAssigned,
        EventCompleted,
        EventOverdue,
        EventDelivered,
        EventOpened,
        EventClicked,
        EventReported,
        EventSubmittedData,
        EventAttachmentOpened,
        EventBlocked,
        EventRemediated,
        EventFalsePositiveRemediated,
        EventAttachmentDownloaded,
        EventDownloadAttempted,
        EventDownloaded,
        EventExecuted,
        EventUnknown,
        EventProperlyHandled,
        EventImproperlyHandled
    };
    MimecastHumanRiskBehaviors_view
