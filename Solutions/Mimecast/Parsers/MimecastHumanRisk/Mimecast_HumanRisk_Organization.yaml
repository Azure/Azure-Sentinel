id: 25194ae7-8559-4a86-aa1f-0081ca5189f5
Function:
  Title: Parser for Mimecast Human Risk Organization
  Version: '1.1.0'
  LastUpdated: '2026-10-21'
Category: Microsoft Sentinel Parser
FunctionName: MimecastHumanRiskOrganization
FunctionAlias: MimecastHumanRiskOrganization
FunctionQuery: |
    let dummy_table = datatable(TimeGenerated: datetime) [];
    let FactorLabel = (f: string) { case(f == 'veryLow', 'Very Low', f == 'low', 'Low', f == 'medium', 'Medium', f == 'high', 'High', f == 'veryHigh', 'Very High', 'Not Scored') };
    let MimecastHumanRiskOrganization_view = view() {
    union isfuzzy=true
        dummy_table,
        MimecastHumanRisk_Organization_CL
    | extend
        Month = tostring(column_ifexists('Month', '')),
        HumanRiskScore = toint(column_ifexists('HumanRiskScore', int(null))),
        HumanRiskFactor = tostring(column_ifexists('HumanRiskFactor', '')),
        HumanRiskScoreTrend = toint(column_ifexists('HumanRiskScoreTrend', int(null))),
        AttackScore = toint(column_ifexists('AttackScore', int(null))),
        AttackFactor = tostring(column_ifexists('AttackFactor', '')),
        AttackTrend = toint(column_ifexists('AttackTrend', int(null))),
        AttackTotal = toint(column_ifexists('AttackTotal', int(null))),
        RiskResponses = toint(column_ifexists('RiskResponses', int(null))),
        TotalActions = toint(column_ifexists('TotalActions', int(null))),
        Notifications = toint(column_ifexists('Notifications', int(null))),
        OutboundActions = toint(column_ifexists('OutboundActions', int(null))),
        GroupChanges = toint(column_ifexists('GroupChanges', int(null)))
    | extend
        RecordType = iff(isempty(Month), 'Totals', 'Monthly'),
        MonthStart = todatetime(strcat(Month, '-01')),
        HumanRiskFactorLabel = FactorLabel(HumanRiskFactor),
        AttackFactorLabel = FactorLabel(AttackFactor)
    | project
        TimeGenerated,
        RecordType,
        Month,
        MonthStart,
        HumanRiskScore,
        HumanRiskFactor,
        HumanRiskScoreTrend,
        AttackScore,
        AttackFactor,
        AttackTrend,
        AttackTotal,
        RiskResponses,
        TotalActions,
        Notifications,
        OutboundActions,
        GroupChanges,
        HumanRiskFactorLabel,
        AttackFactorLabel
    };
    MimecastHumanRiskOrganization_view
