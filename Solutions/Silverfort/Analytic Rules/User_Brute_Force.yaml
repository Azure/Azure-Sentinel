id: 46ff357b-9e98-465b-9e45-cd52fa4a7522
name: Silverfort - UserBruteForce Incident
description: |
  Identifies Silverfort incidents involving repeated attempts to authenticate to a user account. This behavior may indicate a brute-force attempt to gain unauthorized access.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SilverfortAma
    dataTypes:
      - CommonSecurityLog
tactics:
  - CredentialAccess
# The incident does not distinguish password guessing, spraying, or credential
# stuffing, so retain the parent Brute Force technique instead of inferring a subtype.
relevantTechniques:
  - T1110 #Brute Force
query: |-
  CommonSecurityLog 
  | where DeviceVendor has 'Silverfort'
  | where DeviceProduct has 'Admin Console'
  | where DeviceEventClassID == "NewIncident"
  | where Message has "UserBruteForce"
  | extend IncidentData = parse_json(replace('^""|""$', '', Message))
  | extend UserName = coalesce(
      tostring(IncidentData.data.users[0].samAccountName),
      tostring(IncidentData.data.users[0].upn),
      tostring(IncidentData.data.users[0].displayName),
      tostring(IncidentData.users[0].displayName)
  )
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: UserName
queryPeriod: 15m
queryFrequency: 15m
triggerOperator: gt
triggerThreshold: 0
version: 1.0.1
kind: Scheduled
