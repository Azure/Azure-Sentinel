properties:
  id: xdr-a19885c8-1e44-47e3-81df-d1d109f5c92d
  displayName: Digital Guardian - Exfiltration to external domain
  status: disabled
  queryCondition:
    queryText: |-
      let corp_domain = dynamic(['example.com']);     //add all corporate domains to this list
      DigitalGuardianDLPEvent
      | where NetworkApplicationProtocol =~ 'SMTP'
      | where isnotempty(inspected_document)
      | extend s_domain = extract(@'@(.*)', 1, SrcUserName)
      | extend d_domain = extract(@'@(.*)', 1, DstUserName)
      | where s_domain in~ (corp_domain)
      | where d_domain !in (corp_domain)
      | extend AccountCustomEntity = SrcUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Digital Guardian - Exfiltration to external domain
      description: '''Detects exfiltration to external domain.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1048
      customDetails:
        AccountName: AccountCustomEntity
