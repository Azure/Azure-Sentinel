properties:
  id: xdr-e8901dac-2549-4948-b793-5197a5ed697a
  displayName: Digital Guardian - Multiple incidents from user
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 2;
      DigitalGuardianDLPEvent
      | where isnotempty(MatchedPolicies)
      | summarize count() by SrcUserName, bin(TimeGenerated, 30m)
      | where count_ >= threshold
      | extend AccountCustomEntity = SrcUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Digital Guardian - Multiple incidents from user
      description: '''Detects multiple incidents from user.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1048
      customDetails:
        AccountName: AccountCustomEntity
