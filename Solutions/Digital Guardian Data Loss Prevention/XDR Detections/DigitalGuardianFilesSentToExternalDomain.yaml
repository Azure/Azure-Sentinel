properties:
  id: xdr-5f75a873-b524-4ba5-a3b8-2c20db517148
  displayName: Digital Guardian - Bulk exfiltration to external domain
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      let corp_domain = dynamic(['example.com']);
      DigitalGuardianDLPEvent
      | where NetworkApplicationProtocol =~ 'SMTP'
      | where isnotempty(inspected_document)
      | extend s_domain = extract(@'@(.*)', 1, SrcUserName)
      | extend d_domain = extract(@'@(.*)', 1, DstUserName)
      | where s_domain in~ (corp_domain)
      | where d_domain !in (corp_domain)
      | summarize f = dcount(inspected_document) by SrcUserName, DstUserName, bin(TimeGenerated, 30m)
      | where  f >= threshold
      | extend AccountCustomEntity = SrcUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Digital Guardian - Bulk exfiltration to external domain
      description: '''Detects bulk exfiltration to external domain.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1048
      customDetails:
        AccountName: AccountCustomEntity
