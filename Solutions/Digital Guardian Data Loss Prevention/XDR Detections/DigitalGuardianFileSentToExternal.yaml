properties:
  id: xdr-edead9b5-243a-466b-ae78-2dae32ab1117
  displayName: Digital Guardian - Exfiltration to private email
  status: disabled
  queryCondition:
    queryText: |-
      DigitalGuardianDLPEvent
      | where NetworkApplicationProtocol =~ 'SMTP'
      | where isnotempty(inspected_document)
      | extend s_user = substring(SrcUserName, 0, indexof(SrcUserName, '@'))
      | extend d_user = substring(DstUserName, 0, indexof(DstUserName, '@'))
      | extend s_domain = extract(@'@(.*)', 1, SrcUserName)
      | extend d_domain = extract(@'@(.*)', 1, DstUserName)
      | where s_domain != d_domain
      | where s_user == d_user
      | extend AccountCustomEntity = SrcUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Digital Guardian - Exfiltration to private email
      description: '''Detects exfiltration to private email.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1048
      customDetails:
        AccountName: AccountCustomEntity
