properties:
  id: xdr-07bca129-e7d6-4421-b489-32abade0b6a7
  displayName: Digital Guardian - Incident with not blocked action
  status: disabled
  queryCondition:
    queryText: |-
      DigitalGuardianDLPEvent
      | where isnotempty(IncidentStatus)
      | extend inc_act = split(IncidentStatus, ',')
      | where inc_act has 'New'
      | where inc_act !contains 'Block'
      | extend AccountCustomEntity = SrcUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Digital Guardian - Incident with not blocked action
      description: '''Detects when incident has not block action.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1048
      customDetails:
        AccountName: AccountCustomEntity
