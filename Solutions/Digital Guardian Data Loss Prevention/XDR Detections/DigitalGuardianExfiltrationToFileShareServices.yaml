properties:
  id: xdr-f7b6ddef-c1e9-46f0-8539-dbba7fb8a5b8
  displayName: Digital Guardian - Exfiltration to online fileshare
  status: disabled
  queryCondition:
    queryText: "// DigitalGuardianDLPEvent parser inlined: Defender XDR cannot resolve Sentinel workspace functions.\nlet\
      \ xdr_inline_DigitalGuardianDLPEvent = view () {\nSyslog\n| where SyslogMessage contains \"managed_device_id\" and SyslogMessage\
      \ contains \"number_of_incidents\"\n| mv-apply ExtractedFields = extract_all(@'\\s(?P<key>[a-zA-Z0-9-_]+)=\\\"?(?P<value>[a-zA-Z0-9-_:/@.,#{}><\
      \ ]+)\\\"?', dynamic([\"key\",\"value\"]), SyslogMessage) on (\n    project packed = pack(tostring(ExtractedFields[0]),\
      \ tostring(ExtractedFields[1]))\n    | summarize bag = make_bag(packed)\n)\n| evaluate bag_unpack(bag) : (*, timestamp:string,\
      \ action_taken:string, destination:string, destination_ip:string, destination_port:string, incident_id:string, incident_status:string,\
      \ incidents_url:string, matched_policies_by_severity:string, number_of_incidents:string, protocol:string, source:string,\
      \ source_ip:string, source_port:string, inspected_document:string, computer_name:string, file_name:string, classification:string,\
      \ was_classified:string, policy:string, severity:string, user:string, domain:string, dns_ParentDomain:string, application:string,\
      \ email_sender:string, email_subject:string, email_recipient:string, http_url:string)\n| extend EventEndTime=todatetime(timestamp)\n\
      | project-away timestamp\n| project-rename DvcAvtion=action_taken\n                , DstUserName=destination\n     \
      \           , DstIpAddr=destination_ip\n                , DstPortNumber=destination_port\n                , IncidentId=incident_id\n\
      \                , IncidentStatus=incident_status\n                , IncidentsUrl=incidents_url\n                , MatchedPolicies=matched_policies_by_severity\n\
      \                , EventCount=number_of_incidents\n                , NetworkApplicationProtocol=protocol\n         \
      \       , SrcUserName=source\n                , SrcIpAddr=source_ip\n                , SrcPortNumber=source_port\n};\n\
      let threshold = 10;\nxdr_inline_DigitalGuardianDLPEvent\n| where isnotempty(inspected_document)\n| where http_url contains\
      \ 'dropbox' or http_url contains 'mega.nz'\n| summarize f = dcount(inspected_document) by SrcUserName, bin(TimeGenerated,\
      \ 30m)\n| where f >= threshold\n| extend AccountCustomEntity = SrcUserName"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Digital Guardian - Exfiltration to online fileshare
      description: '''Detects exfiltration to online fileshare.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1048
      customDetails:
        AccountName: AccountCustomEntity
