id: f9ed5836-f370-4656-a996-3df1f91d9b0f
Function:
  Title: Parser for ArmisAuditLogs
  Version: '1.0.0'
  LastUpdated: '2026-10-29'
Category: Microsoft Sentinel Parser
FunctionName: ArmisAuditLogs
FunctionAlias: ArmisAuditLogs
FunctionQuery: |
    let ArmisAuditLogs_view  = view () {
        ArmisAuditLog_CL
        | extend
                    EventVendor="ArmisAuditLogs",
                    EventProduct="ArmisAuditLogs",
                    Action = column_ifexists('action', ''),
                    AdditionalInfo = column_ifexists('additionalInfo', ''),
                    EventTime = column_ifexists('eventTime', ''),
                    Id = column_ifexists('id', ''),
                    TimeUtc = column_ifexists('timeUtc', ''),
                    Trigger = column_ifexists('trigger', ''),
                    User = column_ifexists('user', ''),
                    UserIp = column_ifexists('userIp', '')
        | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    Action,
                    AdditionalInfo,
                    EventTime,
                    Id,
                    TimeUtc,
                    Trigger,
                    User,
                    UserIp
    };
    ArmisAuditLogs_view
