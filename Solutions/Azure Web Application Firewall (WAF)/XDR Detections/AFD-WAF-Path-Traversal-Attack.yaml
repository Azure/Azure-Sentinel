properties:
  id: xdr-a4d99328-e4e6-493d-b0d5-57e6f9ddae77
  displayName: AFD WAF - Path Traversal Attack
  status: disabled
  queryCondition:
    queryText: |-
      let Threshold = 3;
      AzureDiagnostics
      | where Category =~ "FrontDoorWebApplicationFirewallLog"
      | extend action_s = column_ifexists("action_s", ""), policy_s = column_ifexists("policy_s", ""), details_msg_s = column_ifexists("details_msg_s", ""), details_data_s = column_ifexists("details_data_s", ""), details_matches_s = column_ifexists("details_matches_s", ""), trackingReference_s = column_ifexists("trackingReference_s", "")
      | where action_s =~ "AnomalyScoring"
      | where details_msg_s has "Path Traversal Attack"
      | parse details_data_s with MessageText "Matched Data:" MatchedData "AND " * "table_name FROM " TableName " " *
      | project policy_s, trackingReference_s, host_s, requestUri_s, TimeGenerated, clientIP_s, details_matches_s, details_msg_s, details_data_s, TableName, MatchedData
      | join kind = inner(
      AzureDiagnostics
      | where Category =~ "FrontDoorWebApplicationFirewallLog"
      | extend action_s = column_ifexists("action_s", ""), policy_s = column_ifexists("policy_s", ""), policyMode_s = column_ifexists("policyMode_s", ""), ruleName_s = column_ifexists("ruleName_s", ""), trackingReference_s = column_ifexists("trackingReference_s", "")
      | where action_s =~ "Block"
      | where policyMode_s =~ "Prevention"
      | where ruleName_s contains "949110") on policy_s, trackingReference_s
      | summarize URI_s = make_set(requestUri_s,100), Table = make_set(TableName,100), StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), TrackingReference = make_set(trackingReference_s,100), Matched_Data = make_set(MatchedData,100), Detail_Data = make_set(details_data_s,100), Detail_Message = make_set(details_msg_s,100), Total_TrackingReference = dcount(trackingReference_s) by clientIP_s, host_s, action_s
      | where Total_TrackingReference >= Threshold
  schedule:
    frequency: PT6H
  detectionAction:
    alertTemplate:
      title: AFD WAF - Path Traversal Attack
      description: |-
        'Identifies a Path Traversal match on a request blocked by the managed anomaly-score threshold rule in Prevention mode. The match contributes to the aggregate anomaly score but does not establish that Path Traversal alone caused the block. The threshold value in the query can be changed as per your infrastructure's requirements.
        References: https://owasp.org/www-community/attacks/Path_Traversal'
      severity: high
      entityMappings:
        urls:
        - id: url1
          addressColumn: URI_s
        ips:
        - id: ip1
          addressColumn: clientIP_s
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1548
      - tactic: Execution
        techniques:
        - technique: T1203
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1548
      - tactic: Discovery
        techniques:
        - technique: T1087
