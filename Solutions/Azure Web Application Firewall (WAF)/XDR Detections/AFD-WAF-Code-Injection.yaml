    kind: AnalyticsRule
    id: ded8168e-c806-4772-af30-10576e0a7529
    path: Analytic Rules/AFD-WAF-Code-Injection.yaml
    version: 1.0.1
    querySha256: 3c29a01e4b85bb0f9ebe247500546c75aff021fd675f89ddba47f11fc4f228f9
    schedule:
      queryFrequency: 6h
      queryPeriod: 6h
  conversion:
    tool: sentinel-to-xdr-migration
