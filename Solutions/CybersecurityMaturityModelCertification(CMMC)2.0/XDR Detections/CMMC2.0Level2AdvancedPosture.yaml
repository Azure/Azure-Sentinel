    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified and the service drops all custom details if exceeded
    informational: []
    errors: []
    originalTactics:
    - Discovery
    originalTechniques:
    - T1082
    reviewScope:
      sourceDocumentSha256: 7bad6bfa5f820d73bc1d12015f74dff07739858a21cfeb64ec193a7009fc8333
      targetQuerySha256: cce77258856c09c93f80f3ddbf80a48cc355e2d04c438983969a1a75bbb56a73
properties:
  id: xdr-7bfe573b-3069-4e81-98fe-9a4cffbcbc24
  displayName: CMMC 2.0 Level 2 (Advanced) Readiness Posture
  status: disabled
  queryCondition:
    queryText: 'SecurityRegulatoryCompliance

      | where ComplianceStandard == "NIST-SP-800-171-R2"

      | extend Level=iff(ComplianceControl in ("3.1.1","3.1.2","3.1.20","3.1.22","3.4.1","3.5.2","3.5.2","3.8.3","3.13.1","3.13.5","3.14.1","3.14.2","3.14.4","3.14.5"), "Level 1: Foundational","Level 2: Advanced")

      | where Level == "Level 2: Advanced"

      | summarize arg_max(TimeGenerated, *) by RecommendationName, AssessedResourceId, Level

      | extend DeviceName = tostring(split(AssessedResourceId, "/")[-1])

      |summarize Failed=countif(State=="Failed"),Passed=countif(State=="Passed"),Total=countif(State=="Passed" or State == "Failed"), DeviceName=take_any(DeviceName) by Level

      |extend PassedControlsPercentage = (Passed/todouble(Total))*100

      | where PassedControlsPercentage < 70

      //Adjust Either Passed Thresholds within Organizational Needs

      | extend RemediationLink = strcat(''https://portal.azure.com/#blade/Microsoft_Azure_Security/SecurityMenuBlade/22'')

      | project Level, ComplianceStandard="CMMC 2.0", Total, PassedControlsPercentage, Passed, Failed, RemediationLink, DeviceName, LastObserved=now()

      | extend URLCustomEntity = RemediationLink'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: CMMC 2.0 Level 2 (Advanced) Readiness Posture
      description: '''CMMC 2.0 Level 2 (Advanced) assessments have deviated from configured threshold baselines. This alert is triggered when CMMC2.0 policy compliance is assessed below 70% compliance in 7 days.'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: URLCustomEntity
        hosts:
        - id: host1
          nameColumn: DeviceName
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1082
      customDetails:
        ComplianceStandard: ComplianceStandard
        MaturityLevel: Level
