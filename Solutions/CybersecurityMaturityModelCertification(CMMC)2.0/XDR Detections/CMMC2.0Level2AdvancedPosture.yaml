  dataTypes:
  - SecurityRegulatoryCompliance
contentProvenance:
  requiredWorkloads:
  - workload: mdc
    dataTypes:
    - SecurityRegulatoryCompliance
  requiredDataConnectors:
  - connectorId: AzureSecurityCenter
    dataTypes:
    - SecurityRegulatoryCompliance
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 7bfe573b-3069-4e81-98fe-9a4cffbcbc24
    path: Analytic Rules/CMMC2.0Level2AdvancedPosture.yaml
    version: 1.0.1
    querySha256: ad002f1df1e7f1a540dcd65b8208995bf6d788213452e4d150ad1f934af56a09
    schedule:
      queryFrequency: 1d
      queryPeriod: 7d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1d, lookback=7d; target frequency=P1D, native lookback=unknown/unconfigured; mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/defender-xdr/custom-detection-rules#lookback'
    - customDetails 'ComplianceStandard' column `ComplianceStandard` requires runtime output-schema binding verification
