    id: fb127436-e5c4-4e31-85a8-d3507128dd09
    path: Analytic Rules/CMMC2.0Level1FoundationalPosture.yaml
    version: 1.0.1
    querySha256: 5d1c7ed305a1457e45067b63f010a3235335ac6806eec941b6366ea70e71cfb3
    schedule:
      queryFrequency: 1d
      queryPeriod: 7d
  conversion:
