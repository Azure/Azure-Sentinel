  dataTypes:
  - vcenter_CL
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - vCenter
    - vcenter_CL
  requiredDataConnectors:
  - connectorId: CustomLogsAma
    dataTypes:
    - vCenter
    - vcenter_CL
  - connectorId: vCenter
    dataTypes:
    - vCenter
    - vcenter_CL
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 03e8a895-b5ba-49a0-aed3-f9a997d92fbe
    path: Analytic Rules/vCenterRootLogin.yaml
    version: 1.0.2
    querySha256: 7f6fc094b753a0bcfb5e89db1a2f0dd4b0e4f7374191401ed0154bde551302d0
    schedule:
      queryFrequency: 1h
      queryPeriod: 14d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1h, lookback=14d; target frequency=PT1H,
      native lookback=unknown/unconfigured; mixed, Sentinel-only, or unknown query
      surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    informational: []
    errors: []
    directGraphDeploymentReady: true
    originalTactics:
    - InitialAccess
    - PrivilegeEscalation
    originalTechniques:
    - T1078
    reviewScope:
      sourceDocumentSha256: 530ddbddaff90795e2de68ed426136eb2f0b198f940148998d950ecc7345f5c9
      targetQuerySha256: ce82e3ee1038323166823d5fb8efe858acfb6aeb7e7505cbd9774b39605db73c
properties:
  id: xdr-03e8a895-b5ba-49a0-aed3-f9a997d92fbe
  displayName: VMware vCenter - Root login
  status: disabled
  queryCondition:
    queryText: 'let p_lookback = 14d;

      let t_lookback = 1h;

      let root_ips = vCenter

      | where TimeGenerated between (ago(p_lookback) .. ago(t_lookback))

      | where EventType has_all (''UserLoginSessionEvent'', ''root'', ''logged in'')

      | summarize make_set(SourceIP,128);

      vCenter

      | where TimeGenerated > ago(t_lookback)

      | where EventType   has_all (''UserLoginSessionEvent'', ''root'', ''logged in'')

      | where SourceIP   !in (root_ips)

      | extend SourceIP = tostring(SourceIP)'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: VMware vCenter - Root login
      description: '''Detects when root user login from uncommon IP address.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SourceIP
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
