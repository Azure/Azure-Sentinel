properties:
  id: xdr-8a3b5c7d-9e1f-4a2b-8c6d-3e5f7a9b1c2d
  displayName: SAP BTP - Audit log service unavailable
  status: disabled
  queryCondition:
    queryText: "// Configure the detection threshold (in minutes) - adjust based on\
      \ your environment\nlet detection_threshold_in_minutes = 60;\n// Lookback period\
      \ to identify known subaccounts\nlet lookback = 7d;\n// Get all known subaccounts\
      \ and their last log time\nlet last_activity = SAPBTPAuditLog_CL\n    | where\
      \ TimeGenerated > ago(lookback)\n    | summarize LastLogTime = max(TimeGenerated)\
      \ by SubaccountName, Tenant;\n// Identify subaccounts with no recent activity\
      \ exceeding the threshold\nlast_activity\n| where datetime_diff('minute', now(),\
      \ LastLogTime) > detection_threshold_in_minutes\n| extend TimeSinceLastLog =\
      \ datetime_diff('minute', now(), LastLogTime)\n| project\n    SubaccountName,\n\
      \    Tenant,\n    LastLogTime,\n    TimeSinceLastLog,\n    CloudApp = \"SAP\
      \ BTP\"\n| extend AccountName = SubaccountName, UPNSuffix = Tenant"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: SAP BTP - Audit log service unavailable
      description: 'Identifies SAP BTP subaccounts that have not reported audit logs
        for an unusual period.

        This could indicate that the audit log service has been disabled or tampered
        with,

        potentially by an attacker attempting to hide malicious activity. It may also
        indicate

        service key expiry or SAP BTP service availability problems.'
      severity: high
      entityMappings:
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.008
      customDetails:
        SubaccountName: SubaccountName
        Tenant: Tenant
        LastLogTime: LastLogTime
        TimeSinceLastLog: TimeSinceLastLog
