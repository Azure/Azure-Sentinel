properties:
  id: xdr-74b243a6-3046-48aa-8b03-e43b3c529cc1
  displayName: SAP BTP - Failed access attempts across multiple BAS subaccounts
  status: disabled
  queryCondition:
    queryText: 'let subaccount_detection_threshold = 3;

      SAPBTPAuditLog_CL

      | where Category == "audit.security-events" and Message has "Unauthorized access
      attempt"

      | summarize Start=min(UpdatedOn), End=max(UpdatedOn), Tenants = make_set(Tenant,
      100) by UserName

      | where array_length(Tenants) > subaccount_detection_threshold

      | project Start, End, UserName, Tenants, CloudApp = "SAP BTP"

      | extend AccountName = split(UserName, "@")[0], UPNSuffix = split(UserName,
      "@")[1]'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: SAP BTP - Failed access attempts across multiple BAS subaccounts
      description: Identifies failed Business Application Studio access attempts over
        a predefined number of subaccounts.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
      tactics:
      - tactic: Reconnaissance
        techniques:
        - technique: T1595
