properties:
  id: xdr-9e6f4b2c-0d3e-5a8f-c9b7-2f5d8a1e4c6b
  displayName: SAP BTP - Cloud Integration access policy tampering
  status: disabled
  queryCondition:
    queryText: "let accessPolicyTypes = dynamic([\"Access Policy\", \"Artifact Reference\"\
      ]);\nlet monitoredActions = dynamic([\"Create\", \"Change\", \"Delete\"]);\n\
      SAPBTPAuditLog_CL\n| where Category == \"audit.security-events\"\n| extend data_s\
      \ = tostring(Message.data),\n         ipAddress = tostring(Message.ip)\n| extend\
      \ parsedData = parse_json(data_s)\n| extend action = tostring(parsedData.action),\n\
      \         objectType = tostring(parsedData.objectType),\n         objectId =\
      \ tostring(parsedData.objectId),\n         policyMessage = tostring(parsedData.attributes.message)\n\
      | where objectType in (accessPolicyTypes)\n| where action in (monitoredActions)\n\
      | extend normalizedAction = case(\n    action == \"Create\", \"created\",\n\
      \    action == \"Change\", \"modified\",\n    action == \"Delete\", \"deleted\"\
      ,\n    action\n)\n| extend MessageText = case(\n    objectType == \"Access Policy\"\
      , strcat(\"Access policy '\", objectId, \"' was \", normalizedAction),\n   \
      \ objectType == \"Artifact Reference\", strcat(\"Artifact reference '\", objectId,\
      \ \"' was \", normalizedAction),\n    strcat(objectType, \" '\", objectId, \"\
      ' was \", normalizedAction)\n)\n| project\n    UpdatedOn,\n    UserName,\n \
      \   MessageText,\n    ObjectType = objectType,\n    ObjectId = objectId,\n \
      \   Action = action,\n    PolicyMessage = policyMessage,\n    Tenant,\n    ipAddress,\n\
      \    CloudApp = \"SAP Cloud Integration\"\n| extend AccountName = split(UserName,\
      \ \"@\")[0], UPNSuffix = split(UserName, \"@\")[1]"
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: SAP BTP - Cloud Integration access policy tampering
      description: 'Identifies changes to access policies in SAP Cloud Integration.
        Access policies control

        authorization for integration artifacts, defining which users and roles can
        access specific

        integration flows and related content.


        Unauthorized access policy manipulation could indicate:

        - Attacker granting themselves access to sensitive integration artifacts

        - Removal of security controls to enable further malicious activity

        - Defense evasion by modifying artifact references to hide unauthorized access'
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ipAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1548
        - technique: T1222
      customDetails:
        ObjectType: ObjectType
        ObjectId: ObjectId
        Action: Action
        PolicyMessage: PolicyMessage
        SourceIP: ipAddress
