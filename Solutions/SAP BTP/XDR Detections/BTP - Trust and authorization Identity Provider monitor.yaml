properties:
  id: xdr-62357c23-ecdc-4edc-9349-8338063af1ef
  displayName: SAP BTP - Trust and authorization Identity Provider monitor
  status: disabled
  queryCondition:
    queryText: "SAPBTPAuditLog_CL\n| where isnotnull(Message.object)\n| extend Object\
      \ = Message.object, Attributes = Message.attributes\n| where Object.type ==\
      \ \"IdentityProvider\"\n| extend CrudType = tostring(parse_json(tostring(Object.id)).crudType)\n\
      | mv-expand Attributes\n| extend MessageText = case(\n                     \
      \      CrudType == \"CREATE\",\n                           \"An identity provider\
      \ was created\",\n                           CrudType == \"UPDATE\",\n     \
      \                      \"An identity provider was updated\",\n             \
      \              CrudType == \"DELETE\",\n                           \"An identity\
      \ provider was deleted\",\n                           \"Unclassified CRUD operation\
      \ encountered\"\n                       )\n| extend NewAttributes = parse_json(replace_regex(tostring(Attributes.new),\
      \ \"\\\\r\", \"\"))\n| extend OldAttributes = parse_json(replace_regex(tostring(Attributes.old),\
      \ \"\\\\r\", \"\"))\n| extend IdentityProviderName = case(\n               \
      \                     CrudType == \"CREATE\" or CrudType == \"UPDATE\",\n  \
      \                                  NewAttributes.name,\n                   \
      \                 CrudType == \"DELETE\",\n                                \
      \    OldAttributes.name,\n                                    \"Unknown\"\n\
      \                                )\n| project\n    UpdatedOn,\n    UserName,\n\
      \    MessageText,\n    IdentityProviderName,\n    Tenant,\n    SpaceId,\n  \
      \  CloudApp = \"SAP BTP\"\n| extend AccountName = split(UserName, \"@\")[0],\
      \ UPNSuffix = split(UserName, \"@\")[1]"
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: SAP BTP - Trust and authorization Identity Provider monitor
      description: Identifies CRUD operations on Identity Provider settings within
        a sub account.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1606
        - technique: T1556
