properties:
  id: xdr-3f8a2c5e-7b9d-4e1a-8f6c-2d4b9a1e3c7f
  displayName: SAP BTP - Cloud Identity Service application configuration monitor
  status: disabled
  queryCondition:
    queryText: "SAPBTPAuditLog_CL\n| extend data_s = tostring(Message.data)\n| extend\n\
      \    action = extract(@\"action=\"\"([^\"\"]+)\"\"\", 1, data_s),\n    state\
      \ = extract(@\"state=\"\"([^\"\"]+)\"\"\", 1, data_s),\n    objectType = extract(@\"\
      objectType=\"\"([^\"\"]+)\"\"\", 1, data_s),\n    serviceProviderName = extract(@\"\
      serviceProviderName=\"\"([^\"\"]+)\"\"\", 1, data_s),\n    ipAddress = extract(@\"\
      ipAddress=\"\"([^\"\"]+)\"\"\", 1, data_s),\n    // Extract payload JSON for\
      \ federation type\n    payloadJson = extract(@\"\\{\"\"payload\"\":\\{([^}]+)\\\
      }\\}\", 1, data_s)\n| extend federationType = extract(@\"\"\"type\"\":\"\"([^\"\
      \"]+)\"\"\", 1, payloadJson)\n| where objectType == \"ssoDomain\"\n| where state\
      \ == \"successful\"\n| where action in (\"create\", \"update\", \"delete\")\n\
      | extend MessageText = case(\n    action == \"create\", strcat(\"Application\
      \ '\", serviceProviderName, \"' (\", federationType, \") was created\"),\n \
      \   action == \"update\", strcat(\"Application '\", serviceProviderName, \"\
      ' (\", federationType, \") was updated\"),\n    action == \"delete\", strcat(\"\
      Application '\", serviceProviderName, \"' was deleted\"),\n    \"Unclassified\
      \ operation on application\"\n)\n| project\n    UpdatedOn,\n    UserName,\n\
      \    MessageText,\n    ServiceProviderName = serviceProviderName,\n    FederationType\
      \ = federationType,\n    Action = action,\n    Tenant,\n    ipAddress,\n   \
      \ CloudApp = \"SAP Cloud Identity Service\"\n| extend AccountName = split(UserName,\
      \ \"@\")[0], UPNSuffix = split(UserName, \"@\")[1]"
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: SAP BTP - Cloud Identity Service application configuration monitor
      description: 'Identifies CRUD operations on Application (SSO Domain/Service
        Provider) configurations

        within SAP Cloud Identity Service. This includes both SAML 2.0 and OpenID
        Connect applications.

        Unauthorized application creation could indicate an attacker establishing
        persistent access

        through a rogue federated application.'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ipAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1606
        - technique: T1556
      customDetails:
        ServiceProviderName: ServiceProviderName
        FederationType: FederationType
        Action: Action
        SourceIP: ipAddress
