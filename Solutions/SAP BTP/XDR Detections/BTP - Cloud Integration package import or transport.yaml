properties:
  id: xdr-c3d4e5f6-7a8b-9c0d-1e2f-3a4b5c6d7e8f
  displayName: SAP BTP - Cloud Integration package import or transport
  status: disabled
  queryCondition:
    queryText: "let packageActions = dynamic([\"Package_Import_Started\", \"Package_Import_Completed\"\
      , \"Package_Transport_Started\", \"Package_Transport_Completed\", \"Artifact_Transport_Started\"\
      , \"Artifact_Transport_Completed\"]);\nSAPBTPAuditLog_CL\n| where Category ==\
      \ \"audit.security-events\"\n| extend data_s = tostring(Message.data),\n   \
      \      ipAddress = tostring(Message.ip)\n| extend parsedData = parse_json(data_s)\n\
      | extend action = tostring(parsedData.action),\n         objectType = tostring(parsedData.objectType),\n\
      \         objectId = tostring(parsedData.objectId)\n| where action in (packageActions)\n\
      | extend operationType = case(\n    action contains \"Import\", \"Import\",\n\
      \    action contains \"Transport\", \"Transport\",\n    \"Unknown\"\n),\noperationStatus\
      \ = case(\n    action endswith \"Started\", \"Started\",\n    action endswith\
      \ \"Completed\", \"Completed\",\n    \"Unknown\"\n)\n| extend MessageText =\
      \ strcat(objectType, \" '\", objectId, \"' \", tolower(operationType), \" \"\
      , tolower(operationStatus))\n| project\n    UpdatedOn,\n    UserName,\n    MessageText,\n\
      \    ObjectType = objectType,\n    ObjectId = objectId,\n    Action = action,\n\
      \    OperationType = operationType,\n    OperationStatus = operationStatus,\n\
      \    Tenant,\n    ipAddress,\n    CloudApp = \"SAP Cloud Integration\"\n| extend\
      \ AccountName = split(UserName, \"@\")[0], UPNSuffix = split(UserName, \"@\"\
      )[1]"
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: SAP BTP - Cloud Integration package import or transport
      description: 'Identifies import and transport operations for integration packages
        and artifacts in

        SAP Cloud Integration. Packages contain integration flows, mappings, scripts,
        and other

        artifacts that can be imported from external sources or transported between
        tenants.


        Unauthorized package operations could indicate:

        - Supply chain attack through malicious package import

        - Lateral movement between environments via artifact transport

        - Introduction of backdoors or rogue integration logic'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ipAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1195
      customDetails:
        ObjectType: ObjectType
        ObjectId: ObjectId
        Action: Action
        OperationType: OperationType
        OperationStatus: OperationStatus
        SourceIP: ipAddress
