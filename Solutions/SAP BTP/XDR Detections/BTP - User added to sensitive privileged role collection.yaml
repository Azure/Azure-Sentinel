properties:
  id: xdr-5acbe4cb-a379-4acc-9ad3-28dc48ad33d3
  displayName: SAP BTP - User added to sensitive privileged role collection
  status: disabled
  queryCondition:
    queryText: 'let monitored_rolecollections = dynamic(["Subaccount Service Administrator",
      "Subaccount Administrator", "Connectivity and Destination Administrator", "Destination
      Administrator", "Cloud Connector Administrator"]);

      SAPBTPAuditLog_CL

      | where Message.object has "xs_rolecollection2user"

      | extend ObjectId = parse_json((Message.object).id)

      | where ObjectId.crudType == "CREATE"

      | extend RoleCollection = ObjectId.rolecollection_name, TargetUserId = ObjectId.user_id

      | where RoleCollection in (monitored_rolecollections)

      | project UpdatedOn, UserName, RoleCollection, TargetUserId, Tenant, SpaceId,
      CloudApp = "SAP BTP"

      | extend AccountName = split(UserName, "@")[0], UPNSuffix = split(UserName,
      "@")[1]'
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: SAP BTP - User added to sensitive privileged role collection
      description: Identifies identity management actions whereby a user is added
        to a set of monitored privileged role collections.
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
      tactics:
      - tactic: LateralMovement
        techniques:
        - technique: T0859
