properties:
  id: xdr-a3b8e7c4-5f2d-4a1e-9c6b-8d7f3e2a1b0c
  displayName: SAP BTP - Mass user deletion in Cloud Identity Service
  status: disabled
  queryCondition:
    queryText: |-
      let bulk_delete_threshold = 10;
      SAPBTPAuditLog_CL
      | extend data_s = tostring(Message.data)
      | extend action = extract(@"action=""([^""]+)""", 1, data_s),
               objectType = extract(@"objectType=""([^""]+)""", 1, data_s),
               impactedUser = extract(@"serviceProviderName=""([^""]+)""", 1, data_s)
      | where action == "delete"
      | where objectType == "authorization"
      | where isnotempty(impactedUser)
      | summarize
          Start = min(UpdatedOn),
          End = max(UpdatedOn),
          DeleteCount = count(),
          DeletedUsers = make_set(impactedUser, 100)
          by UserName, Tenant, SpaceId
      | where array_length(DeletedUsers) > bulk_delete_threshold
      | project Start, End, UserName, DeletedUsers, DeleteCount, Tenant, SpaceId, CloudApp = "SAP BTP"
      | extend AccountName = split(UserName, "@")[0], UPNSuffix = split(UserName, "@")[1]
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: SAP BTP - Mass user deletion in Cloud Identity Service
      description: Identifies mass user deletion activity in SAP Cloud Identity Service where the amount of deleted users
        exceeds a predefined threshold.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1531
        - technique: T1485
        - technique: T1489
        - technique: T0813
        - technique: T0826
        - technique: T0827
