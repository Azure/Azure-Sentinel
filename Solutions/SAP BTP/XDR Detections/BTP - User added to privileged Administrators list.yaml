properties:
  id: xdr-7d4e9f2a-8b1c-4a5d-9e3f-6c2b1a0d8e7f
  displayName: SAP BTP - User added to Cloud Identity Service privileged Administrators
    list
  status: disabled
  queryCondition:
    queryText: "let monitored_permissions = dynamic([\"ManageIdP\", \"ManageSP\",\
      \ \"ManageUsers\", \"ReadUsers\", \"ManageAccess\", \"ManageGroups\"]);\nSAPBTPAuditLog_CL\n\
      | extend data_s = tostring(Message.data)\n| extend action = extract(@\"action=\"\
      \"([^\"\"]+)\"\"\", 1, data_s),\n         state = extract(@\"state=\"\"([^\"\
      \"]+)\"\"\", 1, data_s),\n         changedAttribute = extract(@\"changedAttribute=\"\
      \"([^\"\"]+)\"\"\", 1, data_s),\n         newValue = extract(@\"newValue=\"\"\
      ([^\"\"]+)\"\"\", 1, data_s),\n         targetUser = extract(@\"userIdentifier=\"\
      \"([^\"\"]+)\"\"\", 1, data_s),\n         callerMail = extract(@\"callerMail=\"\
      \"([^\"\"]+)\"\"\", 1, data_s),\n         ipAddress = extract(@\"ipAddress=\"\
      \"([^\"\"]+)\"\"\", 1, data_s)\n| where action == \"grantPermissions\"\n| where\
      \ state == \"successful\"\n| where changedAttribute == \"authorizations\"\n\
      | where isnotempty(newValue)\n| mv-expand permission = monitored_permissions\n\
      | where newValue contains tostring(permission)\n| summarize\n    GrantedPermissions\
      \ = make_set(newValue, 10),\n    MatchedPermissions = make_set(tostring(permission),\
      \ 10)\n    by UpdatedOn, UserName, callerMail, targetUser, Tenant, ipAddress\n\
      | project UpdatedOn, UserName, callerMail, targetUser, GrantedPermissions, MatchedPermissions,\
      \ Tenant, ipAddress, CloudApp = \"SAP Cloud Identity Service\"\n| extend AccountName\
      \ = split(UserName, \"@\")[0], UPNSuffix = split(UserName, \"@\")[1]"
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: SAP BTP - User added to Cloud Identity Service privileged Administrators
        list
      description: Identifies when a user is granted privileged administrator permissions
        in SAP Cloud Identity Service. These permissions include managing Identity
        Providers, Service Providers, Users, Groups, and Access controls.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
        ips:
        - id: ip1
          addressColumn: ipAddress
      tactics:
      - tactic: LateralMovement
        techniques:
        - technique: T0859
