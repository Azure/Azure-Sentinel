properties:
  id: xdr-8d5f3a1b-9c2e-4f7d-b8a6-1e4c7f9d2b5a
  displayName: SAP BTP - Cloud Integration tampering with security material
  status: disabled
  queryCondition:
    queryText: "let securityMaterialTypes = dynamic([\"Credential\", \"X.509 Certificate\"\
      , \"X.509 Key-Pair\", \"PGP Public Keys\", \"PGP Secret Keys\"]);\nlet keystoreActions\
      \ = dynamic([\"Create\", \"Update\", \"Change\", \"Delete\"]);\nSAPBTPAuditLog_CL\n\
      | where Category == \"audit.security-events\"\n| extend data_s = tostring(Message.data),\n\
      \         ipAddress = tostring(Message.ip)\n| extend parsedData = parse_json(data_s)\n\
      | extend action = tostring(parsedData.action),\n         objectType = tostring(parsedData.objectType),\n\
      \         objectId = tostring(parsedData.objectId),\n         keystoreName =\
      \ tostring(parsedData.attributes[\"Keystore Name\"])\n| where objectType in\
      \ (securityMaterialTypes)\n| where\n    (objectType == \"Credential\" and action\
      \ in (\"PasswordStore\", \"PasswordUpdate\", \"PasswordDelete\"))\n    or\n\
      \    (objectType != \"Credential\" and action in (keystoreActions))\n| extend\
      \ normalizedAction = case(\n    action == \"PasswordStore\", \"created\",\n\
      \    action == \"PasswordUpdate\", \"updated\",\n    action == \"PasswordDelete\"\
      , \"deleted\",\n    action == \"Create\", \"created\",\n    action == \"Update\"\
      , \"updated\",\n    action == \"Change\", \"changed\",\n    action == \"Delete\"\
      , \"deleted\",\n    action\n)\n| extend MessageText = case(\n    objectType\
      \ == \"Credential\", strcat(\"Security credential '\", objectId, \"' was \"\
      , normalizedAction),\n    isnotempty(keystoreName), strcat(objectType, \" '\"\
      , objectId, \"' was \", normalizedAction, \" in keystore '\", keystoreName,\
      \ \"'\"),\n    strcat(objectType, \" '\", objectId, \"' was \", normalizedAction)\n\
      )\n| project\n    UpdatedOn,\n    UserName,\n    MessageText,\n    ObjectType\
      \ = objectType,\n    ObjectId = objectId,\n    Action = action,\n    NormalizedAction\
      \ = normalizedAction,\n    KeystoreName = keystoreName,\n    Tenant,\n    ipAddress,\n\
      \    CloudApp = \"SAP Cloud Integration\"\n| extend AccountName = split(UserName,\
      \ \"@\")[0], UPNSuffix = split(UserName, \"@\")[1]"
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: SAP BTP - Cloud Integration tampering with security material
      description: 'Identifies operations on security material (credentials, certificates,
        and keys) within SAP Cloud Integration.

        This includes credentials (passwords/secrets), X.509 certificates and key
        pairs, and PGP keys.

        Unauthorized manipulation of security material could indicate an attacker
        attempting to:

        - Gain access to external systems using stored credentials

        - Intercept or tamper with encrypted communications

        - Establish persistence through certificate manipulation

        - Cover tracks by deleting security artifacts'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: ipAddress
        cloudApplications:
        - id: cloudApplication1
          nameColumn: CloudApp
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1552
      customDetails:
        ObjectType: ObjectType
        ObjectId: ObjectId
        Action: Action
        KeystoreName: KeystoreName
        SourceIP: ipAddress
