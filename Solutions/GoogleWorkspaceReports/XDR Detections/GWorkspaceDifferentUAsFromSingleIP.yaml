properties:
  id: xdr-6ff0e16e-5999-11ec-bf63-0242ac130002
  displayName: GWorkspace - Multiple user agents for single source
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 5;
      GWorkspaceActivityReports
      | where isnotempty(UserAgentOriginal)
      | summarize user_ua = makeset(UserAgentOriginal) by SrcIpAddr, bin(TimeGenerated, 5m)
      | where array_length(user_ua) > threshold
      | extend IPCustomEntity = SrcIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GWorkspace - Multiple user agents for single source
      description: '''Detects requests with different user agents from one source in short timeframe.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1176
      - tactic: Collection
        techniques:
        - technique: T1185
