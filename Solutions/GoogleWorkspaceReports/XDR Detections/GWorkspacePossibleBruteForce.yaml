properties:
  id: xdr-8f6cd9a4-5e57-11ec-bf63-0242ac130002
  displayName: GWorkspace - Possible brute force attack
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 5;
      GWorkspaceActivityReports
      | where EventMessage has "login_failure"
      | summarize login_attempts = count() by ActorEmail, bin(TimeGenerated, 5m)
      | where login_attempts > threshold
      | extend AccountCustomEntity = ActorEmail
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GWorkspace - Possible brute force attack
      description: '''Detects possible brute force attack.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountName: AccountCustomEntity
