properties:
  id: xdr-3d645a88-2724-41a7-adea-db74c439cf79
  displayName: Excessive Amount of Denied Connections from a Single Source
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 5000;
      let forwarder_host_names = dynamic(["hostname1", "hostname2"]);
      // SophosXGFirewall parser inlined: Defender XDR Custom Detections cannot be enabled when the query calls a workspace function.
      Syslog
      | where Facility == "local0"
      | where CollectorHostName in (forwarder_host_names) or Computer in (forwarder_host_names)
      | extend Log_Type = extract(@'log_type=\"?([\w\s]+)\"?', 1, SyslogMessage),
          Status = extract(@'status=\"?(\w+)\"?', 1, SyslogMessage),
          Src_IP = extract(@'src_ip=\"?([\w\.]+)\"?', 1, SyslogMessage)
      | where Log_Type =~ "Firewall" and Status =~ "Deny"
      | summarize count() by Src_IP, bin(TimeGenerated,5m)
      | where count_ > threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Excessive Amount of Denied Connections from a Single Source
      description: '''This creates an incident in the event that a single source IP address generates a excessive amount of
        denied connections.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: Src_IP
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1499
