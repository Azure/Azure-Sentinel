properties:
  id: xdr-427e4c9e-8cf4-4094-a684-a2d060dbca38
  displayName: Port Scan Detected
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 50;
      SophosXGFirewall
      | where Log_Type =~ "Firewall"
      | where not(ipv4_is_match("10.0.0.0",Src_IP,8) or ipv4_is_match("172.16.0.0",Src_IP,12) or ipv4_is_match("192.168.0.0",Src_IP,16))
      | summarize dcount(Dst_Port) by Src_IP, bin(TimeGenerated, 5m)
      | where dcount_Dst_Port > threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Port Scan Detected
      description: '''This alert creates an incident when a source IP addresses attempt to communicate with a large amount
        of distinct ports within a short period.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: Src_IP
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1046
