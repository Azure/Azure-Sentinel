id: 8da040d4-bd02-47ae-86b5-db527a8b4f18
name: Netcraft DDW Intelligence - Takedown eligible match
description: |
  Identifies Deep & Dark Web intelligence matches that are takedown eligible.
  Uses NetcraftDdwIntelligence_Latest so the same MatchUuid alerts once per window.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftDdwIntelligence_CL
queryFrequency: 15m
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Reconnaissance
  - ResourceDevelopment
relevantTechniques:
  - T1597
  - T1583
query: |
  NetcraftDdwIntelligence_Latest
  | where IngestedAt > ago(15m)
  | where TakedownEligible == true
  | project
      TimeGenerated,
      EventId,
      MatchUuid,
      GroupUuid,
      Subject,
      IntelligenceType,
      DisplayValue,
      Priority,
      Acknowledged,
      TakedownEligible,
      MatchSource,
      Url,
      DdwUrl,
      Rule
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
customDetails:
  MatchUuid: MatchUuid
  GroupUuid: GroupUuid
  Acknowledged: Acknowledged
  TakedownEligible: TakedownEligible
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Netcraft DDW - takedown eligible {{IntelligenceType}} ({{DisplayValue}})"
  alertDescriptionFormat: "Match {{DisplayValue}} ({{MatchUuid}}) is takedown eligible with priority {{Priority}}."
kind: Scheduled
version: 1.0.0
