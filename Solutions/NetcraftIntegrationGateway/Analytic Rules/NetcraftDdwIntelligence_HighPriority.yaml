id: 114e0c34-5e32-42a8-a0fc-3e3c8291bee9
name: Netcraft DDW Intelligence - High priority match
description: |
  Identifies Deep & Dark Web intelligence matches with Priority of high.
  Uses NetcraftDdwIntelligence_Latest so the same MatchUuid alerts once per window.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftDdwIntelligence_CL
queryFrequency: 15m
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Collection
  - CredentialAccess
relevantTechniques:
  - T1597
  - T1552
query: |
  NetcraftDdwIntelligence_Latest
  | where IngestedAt > ago(15m)
  | where Priority == "high"
  | project
      TimeGenerated,
      EventId,
      MatchUuid,
      GroupUuid,
      Subject,
      IntelligenceType,
      DisplayValue,
      Priority,
      Acknowledged,
      TakedownEligible,
      MatchSource,
      Url,
      DdwUrl,
      Rule
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
customDetails:
  MatchUuid: MatchUuid
  GroupUuid: GroupUuid
  Acknowledged: Acknowledged
  TakedownEligible: TakedownEligible
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Netcraft DDW - {{Priority}} {{IntelligenceType}} ({{DisplayValue}})"
  alertDescriptionFormat: "High-priority {{IntelligenceType}} match {{MatchUuid}} for {{DisplayValue}}. See custom details for group and acknowledgement."
kind: Scheduled
version: 1.0.0
