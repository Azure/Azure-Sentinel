id: a4b5c6d7-e8f9-4012-abcd-ef1234567e03
name: Netcraft Advert - High risk result
description: |
  Identifies newly reported Advert results (`ChangeType == "new"`) with `Risk.category` of highest or high.
  Uses NetcraftAdvertResult_Latest so updates for the same ResultUuid do not re-alert unless
  they appear as a new result in the window.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftAdvertResult_CL
queryFrequency: 15m
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
  - InitialAccess
relevantTechniques:
  - T1583
  - T1566
query: |
  NetcraftAdvertResult_Latest
  | where IngestedAt > ago(15m)
  | where ChangeType == "new"
  | extend RiskCategory = tostring(Risk.category)
  | where RiskCategory in ("highest", "high")
  | extend Url = DisplayUrl
  | project
      TimeGenerated,
      EventId,
      ResultUuid,
      Subject,
      Platform,
      AdvertiserName,
      AdvertiserId,
      AdvertTitle,
      DisplayUrl,
      Url,
      Risk,
      RiskCategory,
      ChangeType,
      CloudEventType
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
customDetails:
  ResultUuid: ResultUuid
  AdvertiserName: AdvertiserName
  AdvertTitle: AdvertTitle
  Platform: Platform
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Netcraft Advert - {{RiskCategory}} risk ({{AdvertiserName}})"
  alertDescriptionFormat: "New advert result {{ResultUuid}} from {{AdvertiserName}} reported risk {{RiskCategory}}."
kind: Scheduled
version: 1.0.0
