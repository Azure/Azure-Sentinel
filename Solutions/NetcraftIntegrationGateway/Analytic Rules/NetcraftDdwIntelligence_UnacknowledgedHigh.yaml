id: f788b740-86af-46b2-b986-c059c5e5b908
name: Netcraft DDW Intelligence - Unacknowledged high priority
description: |
  Identifies high-priority Deep & Dark Web intelligence matches that are still unacknowledged (`Acknowledged == false`).
  Uses NetcraftDdwIntelligence_Latest so the same MatchUuid alerts once per window.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftDdwIntelligence_CL
queryFrequency: 15m
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Collection
  - CredentialAccess
relevantTechniques:
  - T1597
  - T1552
query: |
  NetcraftDdwIntelligence_Latest
  | where IngestedAt > ago(15m)
  | where Priority == "high"
  | where Acknowledged == false
  | project
      TimeGenerated,
      EventId,
      MatchUuid,
      GroupUuid,
      Subject,
      IntelligenceType,
      DisplayValue,
      Priority,
      Acknowledged,
      TakedownEligible,
      MatchSource,
      Url,
      DdwUrl,
      Rule
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
customDetails:
  MatchUuid: MatchUuid
  GroupUuid: GroupUuid
  Acknowledged: Acknowledged
  TakedownEligible: TakedownEligible
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Netcraft DDW - unacknowledged high {{IntelligenceType}} ({{DisplayValue}})"
  alertDescriptionFormat: "High-priority {{IntelligenceType}} match {{MatchUuid}} for {{DisplayValue}} is unacknowledged."
kind: Scheduled
version: 1.0.0
