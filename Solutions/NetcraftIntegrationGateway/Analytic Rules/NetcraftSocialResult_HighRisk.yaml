id: a4b5c6d7-e8f9-4012-abcd-ef1234567e01
name: Netcraft Social - High risk result
description: |
  Identifies newly reported Social results (`ChangeType == "new"`) with `Risk.category` of highest or high.
  Uses NetcraftSocialResult_Latest so updates for the same ResultUuid do not re-alert unless
  they appear as a new result in the window.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftSocialResult_CL
queryFrequency: 15m
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
  - InitialAccess
relevantTechniques:
  - T1585
  - T1566
query: |
  NetcraftSocialResult_Latest
  | where IngestedAt > ago(15m)
  | where ChangeType == "new"
  | extend RiskCategory = tostring(Risk.category)
  | where RiskCategory in ("highest", "high")
  | project
      TimeGenerated,
      EventId,
      ResultUuid,
      Subject,
      Platform,
      SocialType,
      Username,
      DisplayName,
      Url,
      Verified,
      Risk,
      RiskCategory,
      ChangeType,
      CloudEventType
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
customDetails:
  ResultUuid: ResultUuid
  SocialType: SocialType
  Username: Username
  Verified: Verified
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Netcraft Social - {{RiskCategory}} risk ({{Platform}})"
  alertDescriptionFormat: "New social result {{ResultUuid}} on {{Platform}} reported risk {{RiskCategory}}."
kind: Scheduled
version: 1.0.0
