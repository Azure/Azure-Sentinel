id: 9284825d-3f0f-4ca2-a2f3-44a2a229909e
name: Netcraft Domain Detection - Preemptive disruption
description: |
  Identifies Domain Detection results whose tag `display_name` is `Preemptive Disruption`.
  Uses NetcraftDomainDetection_Latest so the same DomainResultId alerts once per window.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftDomainDetection_CL
queryFrequency: 15m
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
  - InitialAccess
relevantTechniques:
  - T1583
  - T1566
query: |
  NetcraftDomainDetection_Latest
  | where IngestedAt > ago(15m)
  | where tostring(Tags) contains "Preemptive Disruption"
  | extend
      DNSDomain = Hostname,
      RiskCategory = tostring(Risk.category)
  | project
      TimeGenerated,
      EventId,
      DomainResultId,
      Subject,
      Hostname,
      DNSDomain,
      Risk,
      RiskCategory,
      ChangeType,
      CloudEventType,
      Tags,
      IpAddresses,
      Registrar,
      Domain,
      AreaId
entityMappings:
  - entityType: DNS
    fieldMappings:
      - identifier: DomainName
        columnName: DNSDomain
customDetails:
  DomainResultId: DomainResultId
  RiskCategory: RiskCategory
  ChangeType: ChangeType
  Registrar: Registrar
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Netcraft Domain Detection - Preemptive Disruption ({{Hostname}})"
  alertDescriptionFormat: "Domain {{Hostname}} ({{DomainResultId}}) is tagged Preemptive Disruption with risk {{RiskCategory}}. See the ChangeType custom detail for the change that triggered it."
kind: Scheduled
version: 1.0.0
