id: 56ea5c80-8dd5-4c7c-a656-5f7af0c64429
name: Netcraft Domain Detection - Newly registered high risk
description: |
  Identifies Domain Detection results whose tag `display_name` is `Newly Registered (24h)` with `Risk.category` of highest or high.
  Uses NetcraftDomainDetection_Latest so the same DomainResultId alerts once per window.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftDomainDetection_CL
queryFrequency: 15m
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
  - InitialAccess
relevantTechniques:
  - T1583
  - T1566
query: |
  NetcraftDomainDetection_Latest
  | where IngestedAt > ago(15m)
  | where tostring(Tags) contains "Newly Registered (24h)"
  | extend
      DNSDomain = Hostname,
      RiskCategory = tostring(Risk.category)
  | where RiskCategory in ("highest", "high")
  | project
      TimeGenerated,
      EventId,
      DomainResultId,
      Subject,
      Hostname,
      DNSDomain,
      Risk,
      RiskCategory,
      ChangeType,
      CloudEventType,
      Tags,
      IpAddresses,
      Registrar,
      Domain,
      AreaId
entityMappings:
  - entityType: DNS
    fieldMappings:
      - identifier: DomainName
        columnName: DNSDomain
customDetails:
  DomainResultId: DomainResultId
  RiskCategory: RiskCategory
  ChangeType: ChangeType
  Registrar: Registrar
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Netcraft Domain Detection - Newly Registered (24h) {{RiskCategory}} ({{Hostname}})"
  alertDescriptionFormat: "Domain {{Hostname}} ({{DomainResultId}}) is tagged Newly Registered (24h) with risk {{RiskCategory}}."
kind: Scheduled
version: 1.0.0
