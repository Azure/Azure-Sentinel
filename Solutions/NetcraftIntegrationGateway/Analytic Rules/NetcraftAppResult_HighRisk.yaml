id: a4b5c6d7-e8f9-4012-abcd-ef1234567e02
name: Netcraft App - High risk result
description: |
  Identifies newly reported App results (`ChangeType == "new"`) with `Risk.category` of highest or high.
  Uses NetcraftAppResult_Latest so updates for the same ResultUuid do not re-alert unless
  they appear as a new result in the window.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftAppResult_CL
queryFrequency: 15m
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
  - InitialAccess
relevantTechniques:
  - T1583
  - T1566
query: |
  NetcraftAppResult_Latest
  | where IngestedAt > ago(15m)
  | where ChangeType == "new"
  | extend RiskCategory = tostring(Risk.category)
  | where RiskCategory in ("highest", "high")
  | project
      TimeGenerated,
      EventId,
      ResultUuid,
      Subject,
      Platform,
      Name,
      Developer,
      AppId,
      Url,
      Risk,
      RiskCategory,
      ChangeType,
      CloudEventType
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
customDetails:
  ResultUuid: ResultUuid
  Name: Name
  Platform: Platform
  Developer: Developer
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Netcraft App - {{RiskCategory}} risk ({{Name}})"
  alertDescriptionFormat: "New app result {{ResultUuid}} for {{Name}} reported risk {{RiskCategory}}."
kind: Scheduled
version: 1.0.0
