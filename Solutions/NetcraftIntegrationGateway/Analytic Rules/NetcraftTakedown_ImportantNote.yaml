id: 0a0416c5-277a-4a2b-9815-7b457fdffd81
name: Netcraft Takedown - Important note changed
description: |
  Identifies important notes added, updated, or deleted on Netcraft takedowns or takedown groups.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftTakedown_CL
queryFrequency: 15m
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
relevantTechniques:
  - T1583
query: |
  NetcraftTakedown_Unique
  | where IngestedAt > ago(15m)
  | where EventType in ("takedown-important-note", "takedown-important-note-updated", "takedown-important-note-deleted", "group-important-note", "group-important-note-updated", "group-important-note-deleted")
  | project
      TimeGenerated,
      EventId,
      EventType,
      Subject,
      EntityType,
      TakedownId,
      GroupId,
      NoteId,
      NoteBody
customDetails:
  EventType: EventType
  EntityType: EntityType
  TakedownId: TakedownId
  GroupId: GroupId
  NoteId: NoteId
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Netcraft Takedown note - {{Subject}}"
  alertDescriptionFormat: "Important note ({{NoteId}}) on {{Subject}}: {{NoteBody}}"
kind: Scheduled
version: 1.0.0
