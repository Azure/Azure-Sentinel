id: 6279f7fe-3bfc-4973-955c-2092bb1160b2
Function:
  Title: Latest Netcraft Domain Detection result per result_uuid
  Version: '1.0.0'
  LastUpdated: '2026-10-02'
Category: Microsoft Sentinel Parser
FunctionName: NetcraftDomainDetection_Latest
FunctionAlias: NetcraftDomainDetection_Latest
FunctionQuery: |
  NetcraftDomainDetection_CL
  | extend IngestedAt = ingestion_time() // arrival time; TimeGenerated stays the gateway event time
  | summarize arg_min(IngestedAt, *) by EventId
  | summarize arg_max(TimeGenerated, *) by DomainResultId
