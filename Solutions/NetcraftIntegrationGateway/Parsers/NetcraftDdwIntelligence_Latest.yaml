id: fc81c2b3-1af4-470a-9fc4-4cb1bd0bc989
Function:
  Title: Latest Netcraft DDW intelligence match per match_uuid
  Version: '1.0.0'
  LastUpdated: '2026-10-02'
Category: Microsoft Sentinel Parser
FunctionName: NetcraftDdwIntelligence_Latest
FunctionAlias: NetcraftDdwIntelligence_Latest
FunctionQuery: |
  NetcraftDdwIntelligence_CL
  | extend IngestedAt = ingestion_time() // arrival time; TimeGenerated stays the gateway event time
  | summarize arg_min(IngestedAt, *) by EventId
  | summarize arg_max(TimeGenerated, *) by MatchUuid
  // Entities is a dynamic array of {uuid, display_name}.
