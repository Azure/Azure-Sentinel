id: ede89c9b-adaf-4895-87ca-f5a808d75897
Function:
  Title: Latest Netcraft search task per product and result_uuid
  Version: '1.0.0'
  LastUpdated: '2026-10-02'
Category: Microsoft Sentinel Parser
FunctionName: NetcraftSearchTask_Latest
FunctionAlias: NetcraftSearchTask_Latest
FunctionQuery: |
  NetcraftSearchTask_CL
  | extend IngestedAt = ingestion_time() // arrival time; TimeGenerated stays the gateway event time
  | summarize arg_min(IngestedAt, *) by EventId
  | summarize arg_max(TimeGenerated, *) by Product, ResultUuid
  // DisplayName/Url are derived at ingest. Social tasks may be task.new or task.updated; app and advert tasks are task.new only.
