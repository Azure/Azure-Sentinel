id: f1a02878-154a-48cb-a517-fc65c64f537a
Function:
  Title: Latest Netcraft Takedown record (new or updated) per subject
  Version: '1.0.0'
  LastUpdated: '2026-10-02'
Category: Microsoft Sentinel Parser
FunctionName: NetcraftTakedown_Latest
FunctionAlias: NetcraftTakedown_Latest
FunctionQuery: |
  NetcraftTakedown_CL
  | extend IngestedAt = ingestion_time() // arrival time; TimeGenerated stays the gateway event time
  | summarize arg_min(IngestedAt, *) by EventId
  | where EventType == "takedown" // com.netcraft.takedown.new and .updated
  | summarize arg_max(TimeGenerated, *) by Subject
  // Gateway fields: threat, is_authorized, is_escalated, is_malicious_domain, is_malicious_hostname, action_required.
