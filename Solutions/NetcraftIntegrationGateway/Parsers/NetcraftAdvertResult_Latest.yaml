id: b14695bb-13ce-4f0a-af7a-d357d5e70b8b
Function:
  Title: Latest Netcraft Advert result per result_uuid
  Version: '1.0.0'
  LastUpdated: '2026-10-02'
Category: Microsoft Sentinel Parser
FunctionName: NetcraftAdvertResult_Latest
FunctionAlias: NetcraftAdvertResult_Latest
FunctionQuery: |
  NetcraftAdvertResult_CL
  | extend IngestedAt = ingestion_time() // arrival time; TimeGenerated stays the gateway event time
  | summarize arg_min(IngestedAt, *) by EventId
  | summarize arg_max(TimeGenerated, *) by ResultUuid
