Function:
  Title: Deduplicated Netcraft Social result events
  Version: '1.0.0'
  LastUpdated: '2026-10-02'
Category: Microsoft Sentinel Parser
FunctionName: NetcraftSocialResult_Unique
FunctionAlias: NetcraftSocialResult_Unique
FunctionQuery: |
  NetcraftSocialResult_CL
  | extend IngestedAt = ingestion_time() // arrival time; TimeGenerated stays the gateway event time
  | summarize arg_min(IngestedAt, *) by EventId
