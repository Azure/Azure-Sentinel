id: 0adf7b08-9b9a-4054-b969-14d9f99e17b6
Function:
  Title: Deduplicated Netcraft App result events
  Version: '1.0.0'
  LastUpdated: '2026-10-02'
Category: Microsoft Sentinel Parser
FunctionName: NetcraftAppResult_Unique
FunctionAlias: NetcraftAppResult_Unique
FunctionQuery: |
  NetcraftAppResult_CL
  | extend IngestedAt = ingestion_time() // arrival time; TimeGenerated stays the gateway event time
  | summarize arg_min(IngestedAt, *) by EventId
