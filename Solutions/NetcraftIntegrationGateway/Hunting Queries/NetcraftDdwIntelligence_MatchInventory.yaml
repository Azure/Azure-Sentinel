id: 51b52e04-30b4-4ff1-b5ea-e875a5c5808b
name: Netcraft DDW Intelligence - Match inventory
description: |
  7-day inventory of latest Deep & Dark Web intelligence matches (`match.discovered`) with priority, type, and source fields.
  Collapses deliveries to one row per MatchUuid via NetcraftDdwIntelligence_Latest.
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftDdwIntelligence_Latest
tactics:
  - Collection
  - Reconnaissance
relevantTechniques:
  - T1597
  - T1593
query: |
  NetcraftDdwIntelligence_Latest
  | where TimeGenerated > ago(7d)
  | extend
      IsHighPriority = Priority == "high",
      IsTakedownEligible = TakedownEligible == true,
      IsUnacknowledged = Acknowledged == false
  | project
      TimeGenerated,
      MatchUuid,
      GroupUuid,
      IntelligenceType,
      DisplayValue,
      Priority,
      Acknowledged,
      TakedownEligible,
      IsHighPriority,
      IsTakedownEligible,
      IsUnacknowledged,
      MatchSource,
      Url,
      DdwUrl,
      Rule,
      Snippet,
      MatchCreated,
      CloudEventType
  | sort by TimeGenerated desc
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
version: 1.0.0
