id: b5c6d7e8-f9a0-4123-bcde-f12345678903
name: Netcraft Advert - Result inventory
description: |
  7-day inventory of latest Advert results with advertiser, title, and risk.
  Collapses deliveries to one row per ResultUuid via NetcraftAdvertResult_Latest.
  Payload title is stored as AdvertTitle.
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftAdvertResult_Latest
tactics:
  - ResourceDevelopment
  - Reconnaissance
relevantTechniques:
  - T1583
  - T1593
query: |
  NetcraftAdvertResult_Latest
  | where TimeGenerated > ago(7d)
  | extend
      RiskCategory = tostring(Risk.category),
      Url = DisplayUrl
  | project
      TimeGenerated,
      ResultUuid,
      Platform,
      AdvertiserId,
      AdvertiserName,
      AdvertTitle,
      Description,
      DisplayUrl,
      Url,
      DestinationUrls,
      ReferralUrl,
      CountryCodes,
      AdLibraryId,
      Risk,
      RiskCategory,
      ChangeType,
      CloudEventType,
      Tags,
      FirstSeen,
      LastSeen
  | sort by TimeGenerated desc
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
version: 1.0.0
