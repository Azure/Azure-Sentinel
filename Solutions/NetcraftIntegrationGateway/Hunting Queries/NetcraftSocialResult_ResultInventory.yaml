id: b5c6d7e8-f9a0-4123-bcde-f12345678901
name: Netcraft Social - Result inventory
description: |
  7-day inventory of latest Social results with platform, social type, and risk.
  Collapses deliveries to one row per ResultUuid via NetcraftSocialResult_Latest.
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftSocialResult_Latest
tactics:
  - ResourceDevelopment
  - Reconnaissance
relevantTechniques:
  - T1585
  - T1593
query: |
  NetcraftSocialResult_Latest
  | where TimeGenerated > ago(7d)
  | extend RiskCategory = tostring(Risk.category)
  | project
      TimeGenerated,
      ResultUuid,
      SocialType,
      Platform,
      PlatformVariant,
      Username,
      DisplayName,
      Url,
      ProfileId,
      Verified,
      Risk,
      RiskCategory,
      ChangeType,
      CloudEventType,
      Tags,
      Links,
      FirstSeen,
      LastSeen
  | sort by TimeGenerated desc
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
version: 1.0.0
