id: 21a97101-ac38-43fc-874c-36d8e6b96169
name: Netcraft Domain Detection - Result inventory
description: |
  7-day inventory of latest Domain Detection results with risk, tag display_name flags, and infrastructure fields.
  Collapses deliveries to one row per DomainResultId via NetcraftDomainDetection_Latest.
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftDomainDetection_Latest
tactics:
  - ResourceDevelopment
  - Reconnaissance
relevantTechniques:
  - T1583
  - T1590
query: |
  NetcraftDomainDetection_Latest
  | where TimeGenerated > ago(7d)
  | extend
      HasNewlyRegistered = tostring(Tags) contains "Newly Registered",
      HasPreemptiveDisruption = tostring(Tags) contains "Preemptive Disruption",
      DNSDomain = Hostname
  | project
      TimeGenerated,
      DomainResultId,
      Hostname,
      Domain,
      DNSDomain,
      Risk,
      ChangeType,
      CloudEventType,
      Tags,
      HasNewlyRegistered,
      HasPreemptiveDisruption,
      AreaId,
      Registrar,
      HostingProviders,
      IpAddresses,
      ASNs,
      TrancoRank,
      ScreenshotId,
      FirstSeen,
      LastSeen,
      DetectedAt,
      UpdatedAt,
      DomainRegisteredAt
  | sort by TimeGenerated desc
entityMappings:
  - entityType: DNS
    fieldMappings:
      - identifier: DomainName
        columnName: DNSDomain
version: 1.0.0
