id: b5c6d7e8-f9a0-4123-bcde-f12345678902
name: Netcraft App - Result inventory
description: |
  7-day inventory of latest App results with platform, developer, and risk.
  Collapses deliveries to one row per ResultUuid via NetcraftAppResult_Latest.
requiredDataConnectors:
  - connectorId: NetcraftIntegrationGatewayDefinition
    dataTypes:
      - NetcraftAppResult_Latest
tactics:
  - ResourceDevelopment
  - Reconnaissance
relevantTechniques:
  - T1583
  - T1593
query: |
  NetcraftAppResult_Latest
  | where TimeGenerated > ago(7d)
  | extend RiskCategory = tostring(Risk.category)
  | project
      TimeGenerated,
      ResultUuid,
      Platform,
      AppId,
      Name,
      Developer,
      Url,
      Description,
      CountryCodes,
      Risk,
      RiskCategory,
      ChangeType,
      CloudEventType,
      Tags,
      FirstSeen,
      LastSeen
  | sort by TimeGenerated desc
entityMappings:
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: Url
version: 1.0.0
