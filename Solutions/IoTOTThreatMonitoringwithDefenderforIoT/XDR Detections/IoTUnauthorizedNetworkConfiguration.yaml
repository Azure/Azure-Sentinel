properties:
  id: xdr-c52ec521-9188-4a9e-a4cd-34a3dfbc3d27
  displayName: Unauthorized DHCP configuration in the network (Microsoft Defender for IoT)
  status: disabled
  queryCondition:
    queryText: |-
      AlertInfo
      | join kind=leftouter AlertEvidence on AlertId
      | extend AlertName = Title, AlertSeverity = Severity, ProviderName = DetectionSource, ProductName = ServiceSource, Tactics = AttackTechniques, Description = Title, Entities = AdditionalFields, ExtendedProperties = AdditionalFields, RemediationSteps = "[]", ProductComponentName = ServiceSource, VendorOriginalId = AlertId, AlertLink = "", Techniques = AttackTechniques
      | where DetectionSource == "IoTSecurity"
      | where Title == "Device Failed to Receive a Dynamic IP Address"
      | extend ExtendedProperties = parse_json(ExtendedProperties)
      | where tostring(ExtendedProperties.isNew) == "True"
      | extend DeviceId = tostring(ExtendedProperties.DeviceId),
               SourceDeviceAddress = tostring(ExtendedProperties.SourceDeviceAddress),
               DestDeviceAddress = tostring(ExtendedProperties.DestinationDeviceAddress),
               RemediationSteps = tostring(parse_json(RemediationSteps)[0]),
               Protocol = tostring(ExtendedProperties.Protocol),
               AlertManagementUri = tostring(ExtendedProperties.AlertManagementUri)
      | project
        Timestamp,
        DeviceId,
        ProductName,
        ProductComponentName,
        AlertSeverity,
        AlertName,
        Description,
        Protocol,
        SourceDeviceAddress,
        DestDeviceAddress,
        RemediationSteps,
        Tactics,
        Entities,
        VendorOriginalId,
        AlertLink,
        AlertManagementUri,
        Techniques, Title, Severity, ServiceSource, AttackTechniques, AdditionalFields
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Unauthorized DHCP configuration in the network (Microsoft Defender for IoT)
      description: '''This alert leverages Defender for IoT to detect an unauthorized DHCP configuration indicating a possible
        unauthorized device configuration.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          deviceIdColumn: DeviceId
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T0842
      customDetails:
        Sensor: DeviceId
        Protocol: Protocol
        VendorOriginalKey: VendorOriginalId
        AlertManagementUri: AlertManagementUri
