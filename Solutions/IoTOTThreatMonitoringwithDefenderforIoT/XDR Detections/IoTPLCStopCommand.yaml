properties:
  id: xdr-a7d3f642-15d8-4e83-99ee-83ca3352525d
  displayName: PLC Stop Command (Microsoft Defender for IoT)
  status: disabled
  queryCondition:
    queryText: |-
      let alertList = dynamic(["Controller Reset", "An S7 Stop PLC Command was Sent", "Controller Stop", "Excessive Restart Rate of an Outstation", "GE SRTP Stop PLC Command was Sent", "Outstation Restarted", "Outstation Restarts Frequently", "Profinet Device Factory Reset", "Slave Device Unrecoverable Failure", "Suspicion of Hardware Problems in Outstation"]);
      AlertInfo
      | join kind=leftouter AlertEvidence on AlertId
      | extend AlertName = Title, AlertSeverity = Severity, ProviderName = DetectionSource, ProductName = ServiceSource, Tactics = AttackTechniques, Description = Title, Entities = AdditionalFields, ExtendedProperties = AdditionalFields, RemediationSteps = "[]", ProductComponentName = ServiceSource, VendorOriginalId = AlertId, AlertLink = "", Techniques = AttackTechniques
      | where DetectionSource == "IoTSecurity"
      | where Title has_any (alertList)
      | extend ExtendedProperties = parse_json(ExtendedProperties)
      | where tostring(ExtendedProperties.isNew) == "True"
      | extend DeviceId = tostring(ExtendedProperties.DeviceId),
               SourceDeviceAddress = tostring(ExtendedProperties.SourceDeviceAddress),
               DestDeviceAddress = tostring(ExtendedProperties.DestinationDeviceAddress),
               RemediationSteps = tostring(parse_json(RemediationSteps)[0]),
               Protocol = tostring(ExtendedProperties.Protocol),
               AlertManagementUri = tostring(ExtendedProperties.AlertManagementUri)
      | project
        Timestamp,
        DeviceId,
        ServiceSource,
        ProductComponentName,
        Severity,
        Title,
        Description,
        Protocol,
        SourceDeviceAddress,
        DestDeviceAddress,
        RemediationSteps,
        AttackTechniques,
        AdditionalFields,
        VendorOriginalId,
        AlertLink,
        AlertManagementUri,
        Techniques
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: PLC Stop Command (Microsoft Defender for IoT)
      description: '''This alert leverages Defender for IoT to detect PLC stop commands which could indicate improper configuration
        or malicious activity on the network such as a threat manipulating PLC programming to affect the function of the network.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          deviceIdColumn: DeviceId
      tactics:
      - tactic: Evasion
        techniques:
        - technique: T0858
      customDetails:
        Sensor: DeviceId
        Protocol: Protocol
        VendorOriginalKey: VendorOriginalId
        AlertManagementUri: AlertManagementUri
