    querySha256: efd5619d720fd17ce43e2a7f59119e6a009bada7e08cc3fa9e9b58e5236d5c8d
    schedule:
      queryFrequency: 6h
      queryPeriod: 6h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
