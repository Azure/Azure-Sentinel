properties:
  id: xdr-user-login-from-different-countries-within-3-hours-2954d424
  displayName: User Login from Different Countries within 3 hours
  status: disabled
  queryCondition:
    queryText: |-
      let timeframe = ago(3h);
      let threshold = 2;
      OktaSSO
      | where column_ifexists('published_t', now()) >= timeframe
      | where eventType_s =~ "user.session.start"
      | where outcome_result_s =~ "SUCCESS"
      | where isnotempty(column_ifexists('client_geographicalContext_country_s', ''))
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), NumOfCountries = dcount(tostring(column_ifexists('client_geographicalContext_country_s', ''))) by actor_alternateId_s
      | where NumOfCountries >= threshold
      | extend AccountName = tostring(split(actor_alternateId_s, "@")[0]), AccountUPNSuffix = tostring(split(actor_alternateId_s, "@")[1])
  schedule:
    frequency: PT3H
  detectionAction:
    alertTemplate:
      title: User Login from Different Countries within 3 hours
      description: This rule detects successful user logins to the Okta Console from different countries within 3 hours. This
        may indicate a compromised account or an account being used by multiple individuals in different locations.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
