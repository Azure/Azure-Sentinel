    id: 2954d424-f786-4677-9ffc-c24c44c6e7d5
    path: Analytic Rules/LoginfromUsersfromDifferentCountrieswithin3hours.yaml
    version: 1.1.2
    querySha256: 18d1aeece1501b50b623b13ffb2ba7e9521fc52424a450af40697454385be8c9
    schedule:
      queryFrequency: 3h
      queryPeriod: 3h
  conversion:
    tool: sentinel-to-xdr-migration
