    warnings:
    - 'Schedule assessment: source frequency=3h, lookback=3h; target frequency=PT3H, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - customDetails 'StartTime' column `StartTime` requires runtime output-schema binding verification
    - customDetails 'EndTime' column `EndTime` requires runtime output-schema binding verification
    - customDetails 'NumOfCountries' column `NumOfCountries` requires runtime output-schema binding verification
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified
      and the service drops all custom details if exceeded
    informational: []
