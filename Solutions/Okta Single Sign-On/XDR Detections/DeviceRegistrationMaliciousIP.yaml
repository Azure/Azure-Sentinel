    querySha256: 738cd0e5e5ed2887dd8251fb4ab7d475b9507c7e46e5bc006cae2b998956d3c0
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
