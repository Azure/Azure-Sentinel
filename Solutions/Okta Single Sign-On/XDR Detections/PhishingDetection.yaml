    querySha256: 3690e123024638c1c25c52e9834c24acb21e4985b695a3c5511ce92d18dac3f4
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
