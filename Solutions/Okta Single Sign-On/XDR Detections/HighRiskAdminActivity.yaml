schemaVersion: 1.0.0
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 9f82a735-ae43-4c03-afb4-d5d153e1ace1
    path: Analytic Rules/HighRiskAdminActivity.yaml
    version: 1.1.3
    querySha256: c39c728e9618e7b6ee95b1f0ba3003317bcd45da446d8b4f72a18525b981c2c5
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - source queryPeriod has no direct Custom Detection schedule field; verify the KQL lookback
    - Custom Detections support one tactic; only the first tactic was retained
