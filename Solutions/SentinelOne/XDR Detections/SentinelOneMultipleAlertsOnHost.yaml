properties:
  id: xdr-47e427e6-61bc-4e24-8d16-a12871b9f939
  displayName: Sentinel One - Multiple alerts on host
  status: disabled
  queryCondition:
    queryText: 'SentinelOne

      | where ActivityType == 3608

      | extend RuleName = extract(@''Custom Rule:\s(.*?)\sin Group'', 1, EventOriginalMessage)

      | extend DstHostname = extract(@''detected on\s(\S+)\.'', 1, EventOriginalMessage)

      | summarize count() by DstHostname, bin(TimeGenerated, 15m)

      | where count_ > 1

      | extend HostCustomEntity = DstHostname'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Sentinel One - Multiple alerts on host
      description: '''Detects when multiple alerts received from same host.'''
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
