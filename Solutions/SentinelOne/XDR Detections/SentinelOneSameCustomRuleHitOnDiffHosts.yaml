properties:
  id: xdr-5586d378-1bce-4d9b-9ac8-e7271c9d5a9a
  displayName: Sentinel One - Same custom rule triggered on different hosts
  status: disabled
  queryCondition:
    queryText: 'SentinelOne

      | where ActivityType == 3608

      | extend RuleName = extract(@''Custom Rule:\s(.*?)\sin Group'', 1, EventOriginalMessage)

      | extend DstHostname = extract(@''detected on\s(\S+)\.'', 1, EventOriginalMessage)

      | summarize hosts = makeset(DstHostname) by RuleName, bin(TimeGenerated, 15m)

      | where array_length(hosts) > 1

      | extend HostCustomEntity = tostring(hosts[0])'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Sentinel One - Same custom rule triggered on different hosts
      description: '''Detects when same custom rule was triggered on different hosts.'''
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
