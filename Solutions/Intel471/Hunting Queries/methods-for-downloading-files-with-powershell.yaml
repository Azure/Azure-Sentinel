id: c7b320fb-ac67-45b0-92c4-b0f1e10b4e46
name: Methods for Downloading Files with PowerShell
description: |
  Identifies PowerShell downloading files from external sources, a common malware delivery technique. Covers Invoke-WebRequest, Invoke-RestMethod and Start-BitsTransfer, the curl and wget aliases, and .NET classes System.Net.WebClient and HttpClient.
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
tactics:
  - CommandAndControl
  - Execution
relevantTechniques:
  - T1059.001
  - T1105
query: |
  SecurityEvent
  | where TimeGenerated >= ago(7d)
  | project TimeGenerated, Computer, Activity, tostring(EventID), CommandLine, NewProcessName, processId = tolong(NewProcessId), ParentProcessName, parentProcessId = tolong(ProcessId), SubjectUserName, SubjectLogonId, SubjectUserSid, SourceComputerId
  | where NewProcessName has_any (
    "powershell.exe",
    "pwsh.exe",
    "powershell_ise.exe",
    "pwsh-preview.exe"
  )
  | where CommandLine has_any (
    "Invoke-WebRequest",
    " iwr",
    "curl",
    "wget",
    "Invoke-RestMethod",
    " irm",
    "Start-BitsTransfer",
    " sbt",
    "System.Net.WebClient",
    "System.Net.Http.HttpClient"
  )
  | order by TimeGenerated
version: 1.0.0
