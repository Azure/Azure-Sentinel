id: 93f71607-f35d-4aa6-aec9-c2f8a62cbd8a
name: AnyDesk Execution from Abnormal Folder - Potential Malicious Use of RMM Tool
description: |
  AnyDesk is a legitimate remote control tool widely abused by actors to access victim machines and deploy malware or ransomware. This hunt excludes common AnyDesk install paths, surfacing execution from directories such as Temp, ProgramData or System32.
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
tactics:
  - CommandAndControl
relevantTechniques:
  - T1219
query: |
  SecurityEvent
  | where Activity has "Process"
  | where NewProcessName endswith "AnyDesk.exe"
  | where not(NewProcessName has_any (
    "\\AppData\\",
    "\\Downloads\\",
    "Program Files (x86)\\anydesk",
    "Program Files\\anydesk"
    )
  )
  | project TimeGenerated, Computer, tostring(EventID), ParentProcessName, NewProcessName, CommandLine, SubjectUserName, SourceComputerId, processID=tolong(NewProcessId), parentProcessID=tolong(ProcessId), EventData 
  | order by TimeGenerated
version: 1.0.0
