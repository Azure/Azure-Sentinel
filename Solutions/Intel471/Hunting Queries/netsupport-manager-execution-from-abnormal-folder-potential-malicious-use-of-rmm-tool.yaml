id: 3f329a8c-0102-4a61-8cf3-63948aab5ef4
name: NetSupport Manager Execution from Abnormal Folder - Potential Malicious Use of RMM Tool
description: |
  NetSupport is a legitimate remote control tool, and the base of the NetSupport RAT, abused to access victim machines and deploy malware. This hunt excludes common install paths, surfacing execution from directories such as Temp or System32.
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
tactics:
  - CommandAndControl
relevantTechniques:
  - T1219
query: |
  SecurityEvent
  | where NewProcessName endswith "client32.exe"
  | where not(NewProcessName has_any (
    "Program Files (x86)\\NetSupport",
    "Program Files\\NetSupport",
    "\\ProgramData\\NetSupport\\",
    "\\AppData\\Local\\NetSupport\\"
    )
  )
  | project TimeGenerated, Computer, tostring(EventID), ParentProcessName, NewProcessName, CommandLine, SubjectUserName, SourceComputerId, processID=tolong(NewProcessId), parentProcessID=tolong(ProcessId), EventData 
  | order by TimeGenerated
version: 1.0.0
