id: 6FBB40C8-2A65-460C-9E3E-2DDEC6BBCE54
name: KELA Brand Control Unresolved Incident
description: |
  Identifies unresolved incidents ingested from the KELA Brand Control API, regardless of their original severity.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: KELABrandControlCCFConnector
    dataTypes:
      - KELA_BrandControl_Incidents_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
  - InitialAccess
  - CredentialAccess
relevantTechniques:
  - T1583
  - T1566
query: |
  KELA_BrandControl_Incidents_CL
  | summarize arg_max(TimeGenerated, *) by incidentId
  | where status =~ 'in_review'
entityMappings:
  - entityType: DNS
    fieldMappings:
      - identifier: DomainName
        columnName: domainName
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: domainName
version: 1.0.0
kind: Scheduled