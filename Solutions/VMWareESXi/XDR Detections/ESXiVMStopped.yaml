properties:
  id: xdr-43889f30-7bce-4d8a-93bb-29c9615ca8dd
  displayName: VMware ESXi - VM stopped
  status: disabled
  queryCondition:
    queryText: 'VMwareESXi

      | where SyslogMessage has (''VmPoweredOffEvent'')

      | extend SrcUsername = extract(@''\[info\]\s+\[(.*?)\]'', 1, SyslogMessage)

      | extend DstHostname = extract(@''\[\d+\]\s+\[(.*?)\s+on'', 1, SyslogMessage)

      | extend HostCustomEntity = DstHostname, AccountCustomEntity = SrcUsername'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: VMware ESXi - VM stopped
      description: '''Detects when VM was stopped.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1529
      customDetails:
        HostFullName: HostCustomEntity
        AccountName: AccountCustomEntity
