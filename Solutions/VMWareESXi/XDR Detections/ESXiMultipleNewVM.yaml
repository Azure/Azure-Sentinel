properties:
  id: xdr-bdea247f-7d17-498c-ac0e-c7e764cbdbbe
  displayName: VMware ESXi - Multiple new VMs started
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5;

      let a_vm =

      VMwareESXi

      | where SyslogMessage has (''VmPoweredOnEvent'')

      | extend DstHostname = extract(@''\[\d+\]\s+\[(.*?)\s+on'', 1, SyslogMessage)

      | summarize vm_l = make_set(DstHostname,200)

      | extend k=1;

      VMwareESXi

      | where SyslogMessage has (''VmPoweredOnEvent'')

      | extend DstHostname = extract(@''\[\d+\]\s+\[(.*?)\s+on'', 1, SyslogMessage)

      | extend SrcUsername = extract(@''\[info\]\s+\[(.*?)\]'', 1, SyslogMessage)

      | extend k = 1

      | join (a_vm) on k

      | where vm_l !has DstHostname

      | summarize n_vm = make_set(DstHostname,200) by SrcUsername, bin(TimeGenerated,
      10m)

      | where array_length(n_vm) >= threshold

      | extend hostname = iff(array_length(n_vm) > 0, n_vm[0], "")

      | extend NTDomain = tostring(split(hostname, ''\\'', 1)[0]), HostName = tostring(split(hostname,
      ''.'', 0)[0])

      | project-away n_vm, hostname'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: VMware ESXi - Multiple new VMs started
      description: '''Detects when multiple new VMs were started.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          ntDomainColumn: NTDomain
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
