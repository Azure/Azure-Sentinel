properties:
  id: xdr-0f4a80de-344f-47c0-bc19-cb120c59b6f0
  displayName: VMware ESXi - New VM started
  status: disabled
  queryCondition:
    queryText: 'let a_vm =

      VMwareESXi

      | where SyslogMessage has (''VmPoweredOnEvent'')

      | extend DstHostname = extract(@''\[\d+\]\s+\[(.*?)\s+on'', 1, SyslogMessage)

      | summarize vm_l = makeset(DstHostname)

      | extend k=1;

      VMwareESXi

      | where SyslogMessage has (''VmPoweredOnEvent'')

      | extend DstHostname = extract(@''\[\d+\]\s+\[(.*?)\s+on'', 1, SyslogMessage)

      | extend k = 1

      | join (a_vm) on k

      | where vm_l !has DstHostname

      | extend HostCustomEntity = DstHostname'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: VMware ESXi - New VM started
      description: '''Detects when new VM was started.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        HostFullName: HostCustomEntity
