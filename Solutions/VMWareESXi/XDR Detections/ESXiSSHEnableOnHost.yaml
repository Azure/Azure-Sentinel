properties:
  id: xdr-4f5b5d79-ff4e-4edd-ae3e-9e1187f0b924
  displayName: VMware ESXi - SSH Enable on ESXi Host
  status: disabled
  queryCondition:
    queryText: 'VMwareESXi

      | where SyslogMessage has_all ("vim-cmd","hostsvc/enable_ssh")

      | extend SrcUsername = extract(@''\[info\]\s+\[(.*?)\]'', 1, SyslogMessage)

      | extend DstHostname = extract(@''\[\d+\]\s+\[(.*?)\s+on'', 1, SyslogMessage)'
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: VMware ESXi - SSH Enable on ESXi Host
      description: '''Detects when vim-cmd is used to enable SSH on an ESXi host'''
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: DstHostname
      tactics:
      - tactic: LateralMovement
        techniques:
        - technique: T1021
      customDetails:
        HostFullName: DstHostname
        AccountName: SrcUsername
