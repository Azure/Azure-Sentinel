properties:
  id: xdr-2ee727f7-b7c2-4034-b6c9-d245d5a29343
  displayName: VMware ESXi - Low temp directory space
  status: disabled
  queryCondition:
    queryText: 'let threshold = 10;

      VMwareESXi

      | where SyslogMessage has_all (''Temp directory'', ''free space'')

      | extend sp = toreal(extract(@''free space is:\s(\d+)'', 1, SyslogMessage))
      / 1000000000

      | where sp < threshold

      | extend h = ''Hypervisor''

      | extend HostCustomEntity = h'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: VMware ESXi - Low temp directory space
      description: '''This rule is triggered when temp directory space is detected.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1529
      customDetails:
        HostFullName: HostCustomEntity
