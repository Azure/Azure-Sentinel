properties:
  id: xdr-395c5560-ddc2-45b2-aafe-2e3f64528d3d
  displayName: VMware ESXi - Unexpected disk image
  status: disabled
  queryCondition:
    queryText: 'let img_ =

      VMwareESXi

      | where SyslogMessage has (''Matched discovered VM'')

      | extend DstHostname = extract(@''vim.VirtualMachine\S+,(.*?)\]'', 1, SyslogMessage)

      | extend kImageName = extract(@''ds:///vmfs/volumes/(.*)/(.*?),'', 2, SyslogMessage)

      | summarize img_lst = makeset(kImageName) by DstHostname;

      VMwareESXi

      | where SyslogMessage has (''Matched discovered VM'')

      | extend DstHostname = extract(@''vim.VirtualMachine\S+,(.*?)\]'', 1, SyslogMessage)

      | extend ImageName = extract(@''ds:///vmfs/volumes/(.*)/(.*?),'', 2, SyslogMessage)

      | join (img_) on DstHostname

      | where img_lst !has ImageName

      | extend HostCustomEntity = DstHostname'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: VMware ESXi - Unexpected disk image
      description: '''Detects unexpected disk image for VM.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1496
      customDetails:
        HostFullName: HostCustomEntity
