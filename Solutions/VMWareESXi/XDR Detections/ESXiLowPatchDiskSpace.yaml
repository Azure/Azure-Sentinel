properties:
  id: xdr-48d992ba-d404-4159-a8c6-46f51d1325c7
  displayName: VMware ESXi - Low patch disk space
  status: disabled
  queryCondition:
    queryText: 'let threshold = 100;

      VMwareESXi

      | where SyslogMessage has (''Patch store disk'')

      | extend sp = toreal(extract(@''free space is:\s(\d+)'', 1, SyslogMessage))
      / 1000000000

      | where sp < threshold

      | extend h = ''Hypervisor''

      | extend HostCustomEntity = h'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: VMware ESXi - Low patch disk space
      description: '''This rule is triggered when low patch disk store space is detected.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1529
      customDetails:
        HostFullName: HostCustomEntity
