properties:
  id: xdr-5fe1af14-cd40-48ff-b581-3a12a1f90785
  displayName: VMware ESXi - Multiple VMs stopped
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5;

      VMwareESXi

      | where SyslogMessage has (''VmPoweredOffEvent'')

      | extend SrcUsername = extract(@''\[info\]\s+\[(.*?)\]'', 1, SyslogMessage)

      | extend DstHostname = extract(@''\[\d+\]\s+\[(.*?)\s+on'', 1, SyslogMessage)

      | summarize st_vm = make_set(DstHostname,200) by SrcUsername, bin(TimeGenerated,
      5m)

      | where array_length(st_vm) > threshold

      | extend hostname = iff(array_length(st_vm) > 0, st_vm[0], "")

      | extend NTDomain = tostring(split(hostname, ''\\'', 0)[0]), Name = tostring(split(SrcUsername,
      ''\\'', 1)[0]), HostName = tostring(split(hostname, ''.'', 0)[0]), DnsDomain
      = tostring(split(SrcUsername, ''\\'', 1)[0])

      | project-away st_vm, hostname'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: VMware ESXi - Multiple VMs stopped
      description: '''Detects when multiple VMs were stopped by user.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          dnsDomainColumn: DnsDomain
        hosts:
        - id: host1
          nameColumn: HostName
          ntDomainColumn: NTDomain
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1529
