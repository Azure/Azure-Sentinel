id: bc489413-747f-41c7-bfe7-0ab66ded788e
name: Pulumi Cloud - Stack Deleted
description: |
  'Detects when a Pulumi stack is deleted. Stack deletion is a destructive operation that removes all infrastructure state. This may be legitimate maintenance or could indicate unauthorized activity.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: PulumiAuditLogsDefinition
    dataTypes:
      - PulumiAuditLogs_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
relevantTechniques:
  - T1485
query: |
    PulumiAuditLogs_CL
    | where Event_s == "stack-deleted"
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: UserLogin_s
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIP_s
version: 1.0.0
kind: Scheduled
