id: b5e805a7-a6b5-4af5-9a23-a5ea92b744f5
name: Pulumi Cloud - Organization membership change
description: |
  Identifies changes to Pulumi Cloud organization membership, including members being added, removed, or having their roles changed. These events track access control changes to the infrastructure management platform and should correspond to expected administrative activity.
severity: Low
status: Available
requiredDataConnectors:
  - connectorId: PulumiAuditLogsDefinition
    dataTypes:
      - PulumiAuditLogs_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
relevantTechniques:
  - T1098
query: |
    PulumiAuditLogs_CL
    | where Event_s in ("member-added", "member-removed", "member-role-changed")
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: UserLogin_s
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIP_s
version: 1.0.0
kind: Scheduled
