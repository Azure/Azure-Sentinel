id: 0199390c-e96d-4119-b25c-83257f3c4738
name: Pulumi Cloud - Excessive Authentication Failures
description: |
  'Detects when there are more than 5 failed Pulumi Cloud login attempts (user-login-failed events) from a single IP address within a 1-hour window. This may indicate a brute force attack or compromised credentials.'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: PulumiAuditLogsDefinition
    dataTypes:
      - PulumiAuditLogs_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
  - InitialAccess
relevantTechniques:
  - T1110
query: |
    PulumiAuditLogs_CL
    | where Event_s == "user-login-failed"
    | summarize FailCount = count(), StartTime = min(TimeGenerated), EndTime = max(TimeGenerated) by SourceIP_s
    | where FailCount > 5
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIP_s
version: 1.0.0
kind: Scheduled
