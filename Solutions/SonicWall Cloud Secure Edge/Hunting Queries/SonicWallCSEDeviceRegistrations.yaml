id: 4dbfdb29-3b0d-4d65-8c9f-108d5b2e6c87
name: SonicWall CSE - Device registrations
description: |
  'This query searches for devices registered with SonicWall Cloud Secure Edge (CSE), with the user, platform, and ownership of each device.'
requiredDataConnectors:
  - connectorId: SonicWallCSEEvents
    dataTypes:
      - CSEEvents_CL
tactics:
  - Persistence
relevantTechniques:
  - T1098
query: |
  CSEEvents
  | where EventType == "Registration"
  | project EventTime, Action, Message, UserEmail, DeviceName, DeviceSerialNumber, DevicePlatform, DeviceOwnership, ClientIp, EventId
  | extend
      AccountName = tostring(split(UserEmail, "@")[0]),
      UPNSuffix = tostring(split(UserEmail, "@")[1]),
      HostName = coalesce(DeviceName, DeviceSerialNumber)
  | order by EventTime desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserEmail
      - identifier: Name
        columnName: AccountName
      - identifier: UPNSuffix
        columnName: UPNSuffix
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostName
version: 1.0.0
