properties:
  id: xdr-f258fa0c-e26c-4e2b-94fb-88b6cef0ca6e
  displayName: Snowflake - Query on sensitive or restricted table
  status: disabled
  queryCondition:
    queryText: |-
      let r_tbl = dynamic(['table_name']);
      Snowflake
      | where QueryType =~ 'SELECT'
      | where QueryExecutionStatus =~ 'SUCCESS'
      | extend tbl = extract(@'(FROM|from)\s(\S+)\s', 2, QueryText)
      | where tbl in~ (r_tbl)
      | extend AccountCustomEntity = TargetUsername
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Snowflake - Query on sensitive or restricted table
      description: '''Detects query on sensitive or restricted table.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1119
      customDetails:
        AccountName: AccountCustomEntity
