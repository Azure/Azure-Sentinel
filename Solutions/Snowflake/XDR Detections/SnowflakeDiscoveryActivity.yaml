properties:
  id: xdr-09b8dfc7-87b0-4215-b34b-bab363d685cb
  displayName: Snowflake - Possible discovery activity
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 20;
      Snowflake
      | where QueryType =~ 'SHOW'
      | where QueryExecutionStatus =~ 'SUCCESS'
      | summarize count() by TargetUsername, bin(TimeGenerated, 5m)
      | where count_ > threshold
      | extend AccountCustomEntity = TargetUsername
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Snowflake - Possible discovery activity
      description: '''Detects possible discovery activity.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1526
      customDetails:
        AccountName: AccountCustomEntity
