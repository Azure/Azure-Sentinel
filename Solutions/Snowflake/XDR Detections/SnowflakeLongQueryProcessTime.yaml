properties:
  id: xdr-1376f5e5-855a-4f88-8591-19eba4575a0f
  displayName: Snowflake - Abnormal query process time
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10000;
      Snowflake
      | where QueryTotalElapsedTime > threshold
      | extend AccountCustomEntity = TargetUsername
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Snowflake - Abnormal query process time
      description: '''Detects query with abnormal proccess time.'''
      severity: medium
      entityMappings:
