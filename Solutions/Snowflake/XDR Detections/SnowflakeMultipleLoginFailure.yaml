properties:
  id: xdr-e05cc333-d499-430f-907c-7f28a9e4d1b5
  displayName: Snowflake - Multiple login failures by user
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      Snowflake
      | where LoginEventType =~ 'LOGIN'
      | where LoginIsSuccess =~ 'No'
      | summarize count() by TargetUsername, bin(TimeGenerated, 5m)
      | where count_ > threshold
      | extend AccountCustomEntity = TargetUsername
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Snowflake - Multiple login failures by user
      description: '''Detects multiple login failures by user.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
