properties:
  id: xdr-b7d22407-1391-4256-b09a-414a9719443c
  displayName: Snowflake - Multiple login failures from single IP
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      Snowflake
      | where LoginEventType =~ 'LOGIN'
      | where LoginIsSuccess =~ 'No'
      | summarize count() by SrcDvcIpAddr, bin(TimeGenerated, 5m)
      | where count_ > threshold
      | extend IPCustomEntity = SrcDvcIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Snowflake - Multiple login failures from single IP
      description: '''Detects Mmltiple login failures from single IP.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
