properties:
  id: xdr-1dd1d9e5-3ebf-43cb-be07-6082d5eabe79
  displayName: Snowflake - Unusual query
  status: disabled
  queryCondition:
    queryText: |-
      Snowflake
      | where QueryType =~ 'SELECT'
      | where QueryExecutionStatus =~ 'SUCCESS'
      | where QueryText startswith @'SELECT *'
      | extend AccountCustomEntity = TargetUsername
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Snowflake - Unusual query
      description: '''Detects unusual query.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1119
      customDetails:
        AccountName: AccountCustomEntity
