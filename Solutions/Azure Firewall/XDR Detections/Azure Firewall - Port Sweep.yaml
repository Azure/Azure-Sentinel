  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 720335f4-ee8c-4270-9424-d0859222168c
    path: Analytic Rules/Azure Firewall - Port Sweep.yaml
    version: 1.2.3
    querySha256: bd895ee6b87a35922c629b2725f6c345073c36c10eaeffcf29dafac19f8bec17
    schedule:
      queryFrequency: 1h
      queryPeriod: 1d
  conversion:
