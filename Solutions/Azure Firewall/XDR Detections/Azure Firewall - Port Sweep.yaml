    - T1046
    - T1595.001
    reviewScope:
      sourceDocumentSha256: b7228d22346b570976191d65d2219039c8e745616354b5c3fcc3c1b420b626b5
      targetQuerySha256: 572169cb89f1230f2af9c1d2f8bcf4468dd9bd04752734fd69d44a702d00927c
properties:
  id: xdr-720335f4-ee8c-4270-9424-d0859222168c
  displayName: Port Sweep
  status: disabled
  queryCondition:
    queryText: 'let MinimumDifferentHostsThreshold = 200;

      let ExcludedPorts = dynamic([80 , 443]);

      let BinTime = 30s;

      union isfuzzy=true(

      AZFWApplicationRule

      | where DestinationPort !in (ExcludedPorts)

      | summarize AlertTimedCountHostsInBinTime = make_set(Fqdn) by SourceIp, bin(TimeGenerated,
      BinTime), DestinationPort

      | where array_length(AlertTimedCountHostsInBinTime) > MinimumDifferentHostsThreshold

      | mv-expand Fqdn = AlertTimedCountHostsInBinTime),

      (AZFWNetworkRule

      | extend Fqdn = DestinationIp

      | where DestinationPort !in (ExcludedPorts)

      | summarize AlertTimedCountHostsInBinTime = make_set(Fqdn) by SourceIp, bin(TimeGenerated,
      BinTime), DestinationPort

      | where array_length(AlertTimedCountHostsInBinTime) > MinimumDifferentHostsThreshold

      | mv-expand Fqdn = AlertTimedCountHostsInBinTime),

      (AzureDiagnostics

      | where OperationName == "AzureFirewallApplicationRuleLog" or OperationName
      == "AzureFirewallNetworkRuleLog"

      | parse msg_s with * "from " SourceIp ":" SourcePort:int " to " Fqdn ":" DestinationPort:int
      ". " * "Action: " Action "." *

      | where DestinationPort !in (ExcludedPorts)

      | where isnotempty(Fqdn) and isnotempty(SourceIp) and isnotempty(DestinationPort)

      | summarize AlertTimedCountHostsInBinTime = make_set(Fqdn) by SourceIp, bin(TimeGenerated,
      BinTime), DestinationPort

      | where array_length(AlertTimedCountHostsInBinTime) > MinimumDifferentHostsThreshold

      | mv-expand Fqdn = AlertTimedCountHostsInBinTime)

      | project bin(TimeGenerated, BinTime), SourceIp, DestinationPort, AlertTimedCountHostsInBinTime,
      Fqdn'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Port Sweep
      description: '''Identifies a source IP scanning same open ports on the Azure
        Firewall IPs. This can indicate malicious scanning of port by an attacker,
        trying to reveal IPs with specific ports open in the organization. The ports
        can be compromised by attackers for initial access, most often by exploiting
        vulnerability.


        Configurable Parameters:


        - Port sweep time - the time range to look for multiple hosts scanned. Default
        is set to 30 seconds.

        - Minimum different hosts threshold - alert only if more than this number
        of hosts scanned. Default is set to 200.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SourceIp
        urls:
        - id: url1
          addressColumn: Fqdn
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1046
      - tactic: Reconnaissance
        techniques:
        - technique: T1595
          subTechniques:
          - T1595.001
      customDetails:
        DestinationPort: DestinationPort
