properties:
  id: xdr-d36bb1e3-5abc-4037-ad9a-24ba3469819e
  displayName: Abnormal Deny Rate for Source IP
  status: disabled
  queryCondition:
    queryText: 'let LearningPeriod = 1d;

      let RunTime = 1h;

      let StartLearningPeriod = LearningPeriod + RunTime;

      let EndRunTime = RunTime - 1h;

      let BinTime = 1h;

      let NumOfStdsThreshold = 3;

      let MinThreshold = 5.0;

      let MinLearningBuckets = 5;

      // Restrict unioned tables to the full analysis window to avoid full-table scans

      let FullWindowStart = ago(StartLearningPeriod);

      let FullWindowEnd = now();

      let TrafficLogs = (union isfuzzy=true

      (AzureDiagnostics

      | where TimeGenerated between (FullWindowStart .. FullWindowEnd)

      | where OperationName == "AzureFirewallApplicationRuleLog" or OperationName
      == "AzureFirewallNetworkRuleLog"

      | parse msg_s with * "from " SourceIp ":" SourcePort:int " to " Fqdn ":" DestinationPort:int
      ". " * "Action: " Action "." *

      | where Action == "Deny"

      | where isnotempty(Fqdn) and isnotempty(SourceIp)),

      (AZFWNetworkRule

      | where TimeGenerated between (FullWindowStart .. FullWindowEnd)

      | extend Fqdn = DestinationIp

      | where Action == "Deny"

      | where isnotempty(Fqdn) and isnotempty(SourceIp)),

      (AZFWFlowTrace

      | where TimeGenerated between (FullWindowStart .. FullWindowEnd)

      | extend Fqdn = DestinationIp

      | where Action == "Deny"

      | where isnotempty(Fqdn) and isnotempty(SourceIp)),

      (AZFWIdpsSignature

      | where TimeGenerated between (FullWindowStart .. FullWindowEnd)

      | extend Fqdn = DestinationIp

      | where Action == "Deny"

      | where isnotempty(Fqdn) and isnotempty(SourceIp)),

      (AZFWApplicationRule

      | where TimeGenerated between (FullWindowStart .. FullWindowEnd)

      | where Action == "Deny"

      | where isnotempty(Fqdn) and isnotempty(SourceIp)));

      let LearningSrcIpDenyRate = (TrafficLogs

      | where TimeGenerated between (ago(StartLearningPeriod) .. ago(RunTime))

      | summarize count() by SourceIp, bin(TimeGenerated, BinTime), Fqdn

      | summarize LearningTimeSrcIpDenyRateAvg = avg(count_), LearningTimeSrcIpDenyRateStd
      = stdev(count_), LearningTimeBuckets = count() by SourceIp, Fqdn

      | where LearningTimeBuckets > MinLearningBuckets);

      let AlertTimeSrcIpDenyRate = (TrafficLogs

      | where TimeGenerated between (ago(RunTime) .. ago(EndRunTime))

      | summarize AlertTimeSrcIpDenyRateCount = count() by SourceIp, Fqdn);

      AlertTimeSrcIpDenyRate

      | join kind=leftouter (LearningSrcIpDenyRate) on SourceIp, Fqdn

      | extend LearningThreshold = max_of(LearningTimeSrcIpDenyRateAvg + NumOfStdsThreshold
      * LearningTimeSrcIpDenyRateStd, MinThreshold)

      | where AlertTimeSrcIpDenyRateCount > LearningThreshold

      | project SourceIp, Fqdn, AlertTimeSrcIpDenyRateCount, LearningTimeBuckets,
      LearningThreshold'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Abnormal Deny Rate for Source IP
      description: '''Identifies abnormal deny rate for specific source IP to destination
        IP based on the normal average and standard deviation learned during a configured
        period. This can indicate potential exfiltration, initial access or C2, where
        attacker tries to exploit the same vulnerability on machines in the organization,
        but is being blocked by firewall rules.


        Configurable Parameters:


        - Minimum of stds threshold - the number of stds to use in the threshold calculation.
        Default is set to 3.

        - Learning period time - learning period for threshold calculation in days.
        Default is set to 5.

        - Bin time - learn'
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SourceIp
        urls:
        - id: url1
          addressColumn: Fqdn
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      - tactic: Exfiltration
        techniques:
        - technique: T1041
      - tactic: CommandAndControl
        techniques:
        - technique: T1568
          subTechniques:
          - T1568.001
          - T1568.002
      - tactic: Discovery
        techniques:
        - technique: T1046
      customDetails:
        AlertCount: AlertTimeSrcIpDenyRateCount
        Threshold: LearningThreshold
