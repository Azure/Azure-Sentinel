properties:
  id: xdr-8159a8d2-13a5-49af-847b-e062c45ab92b
  displayName: Web Application attack detected
  status: disabled
  queryCondition:
    queryText: "let TimeWindow   = 90d;\nlet HitThreshold = 10;\nlet MinSeverity \
      \ = 2;\nlet EnableCategoryFilter    = true;\nlet EnableDescriptionFilter = false;\n\
      let EnableActionFilter      = false;\nlet CategoriesOfInterest = dynamic([\n\
      \    \"access to a potentially vulnerable web application\",\n    \"Web Application\
      \ Attack\"\n]);\nlet DescriptionsOfInterest = dynamic([\n    \"web-application-activity\"\
      ,\n    \"web-application-attack\"\n]);\nlet MatchActions = dynamic([\"Deny\"\
      , \"alert\"]);\nAZFWIdpsSignature\n| where TimeGenerated >= ago(TimeWindow)\n\
      | where Severity >= MinSeverity\n| where (EnableCategoryFilter == false) or\
      \ (Category has_any (CategoriesOfInterest))\n| where (EnableDescriptionFilter\
      \ == false) or (Description has_any (DescriptionsOfInterest))\n| where (EnableActionFilter\
      \ == false) or (Action in~ (MatchActions))\n| summarize\n    StartTime   = min(TimeGenerated),\n\
      \    EndTime     = max(TimeGenerated),\n    TotalHits   = count(),\n    MaxSeverity\
      \ = max(Severity),\n    Actions     = make_set(Action, 5),\n    Signatures \
      \ = make_set(SignatureId, 20),\n    Description = make_set(substring(tostring(Description),\
      \ 0, 120), 3)\n    by SourceIp, ThreatCategory = Category\n| where TotalHits\
      \ >= HitThreshold\n| project\n    StartTime,\n    EndTime,\n    SourceIp,\n\
      \    ThreatCategory,\n    TotalHits,\n    MaxSeverity,\n    Actions,\n    Signatures,\n\
      \    Description\n| order by MaxSeverity desc, TotalHits desc"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Web Application attack detected
      description: Identifies Web application attack in Azure Firewall IDPS logs.
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SourceIp
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
