  dataTypes:
  - AzureDiagnostics
  - AZFWApplicationRule
  - AZFWNetworkRule
  - AZFWFlowTrace
  - AZFWIdpsSignature
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes: []
  requiredDataConnectors:
  - connectorId: AzureFirewall
    dataTypes:
    - AZFWApplicationRule
    - AZFWFlowTrace
    - AZFWIdpsSignature
    - AZFWNetworkRule
    - AzureDiagnostics
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: f8dad4e9-3f19-4d70-ab7f-8f19ccd43a3e
    path: Analytic Rules/SeveralDenyActionsRegistered.yaml
    version: 1.1.3
    querySha256: 3eef65d6db7877e1cf4e0e6991946417507db14858d9b54812044f36ea33159e
    schedule:
      queryFrequency: 1h
      queryPeriod: 1h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons:
    - isfuzzy unions can still fail semantic binding in Advanced Hunting
    requiredWorkloads:
