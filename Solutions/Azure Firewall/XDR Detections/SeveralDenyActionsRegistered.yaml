    - T1071
    - T1210
    reviewScope:
      sourceDocumentSha256: 2bfe68333f483fee4bb8abbeb32a4ddf5b4e93ac70312be0d723f10492f51a9e
      targetQuerySha256: e2e93141cbd07e0e0ed143e90b068d0b7454e8151bb95a398d47d79921016a1e
    eventTimeWindow:
      status: default-native-lookback
      appliedDefault: hourly-1h-to-native-4h-lookback
      queryFrequency: 1h
      queryPeriod: 1h
      targetFrequency: PT1H
      effectiveLookback: PT4H
      originalSentinelLookbackSeconds: 3600
      effectiveEventWindowSeconds: 14400
      xdrServiceWindowSeconds: 14400
      filterInjected: false
      parityClaimed: false
      hasAggregation: true
      aggregationWindowDifference: true
      timingDifference: Four hours (PT4H / 14400s) is the native XDR ingestion-based
        lookback window for PT1H execution frequency, not the execution frequency;
        original Sentinel queryPeriod was 1h (3600s).
      aggregationDifference: Query contains summarize/make-series aggregation; evaluating
        over the native 4-hour XDR lookback window without an injected 1h event-time
        filter may aggregate up to 4 hours of events per hourly run instead of 1 hour.
      sourceDocumentSha256: 2bfe68333f483fee4bb8abbeb32a4ddf5b4e93ac70312be0d723f10492f51a9e
      targetQuerySha256: e2e93141cbd07e0e0ed143e90b068d0b7454e8151bb95a398d47d79921016a1e
properties:
  id: xdr-f8dad4e9-3f19-4d70-ab7f-8f19ccd43a3e
  displayName: Several deny actions registered
  status: disabled
  queryCondition:
    queryText: 'let threshold = 2;

      union isfuzzy=true(

      AZFWApplicationRule

      | where Action == "Deny"

      | summarize StartTime = min(TimeGenerated), count() by SourceIp, Fqdn, Action,
      Protocol

      | where count_ >= threshold),

      (AZFWNetworkRule

      | where Action == "Deny"

      | extend Fqdn = DestinationIp

      | summarize StartTime = min(TimeGenerated), count_ = dcount(DestinationPort),
      Protocols = make_set(Protocol) by SourceIp, Fqdn, Action

      | where count_ >= threshold

      | extend Protocol = strcat_array(Protocols, "/")),

      (AZFWFlowTrace

      | where Action == "Deny"

      | extend Fqdn = DestinationIp

      | summarize StartTime = min(TimeGenerated), count() by SourceIp, Fqdn, Action,
      Protocol

      | where count_ >= threshold),

      (AZFWIdpsSignature

      | where Action == "Deny"

      | extend Fqdn = DestinationIp

      | summarize StartTime = min(TimeGenerated), count() by SourceIp, Fqdn, Action,
      Protocol

      | where count_ >= threshold),

      (AzureDiagnostics

      | where OperationName in ("AzureFirewallApplicationRuleLog","AzureFirewallNetworkRuleLog")

      | extend msg_s_replaced0 = replace(@"\s\s",@" ",msg_s)

      | extend msg_s_replaced1 = replace(@"\.\s",@" ",msg_s_replaced0)

      | extend msg_a = split(msg_s_replaced1," ")

      | extend srcAddr_a = split(msg_a[3],":") , destAddr_a = split(msg_a[5],":")

      | extend Protocol = tostring(msg_a[0]), SourceIp = tostring(srcAddr_a[0]), srcPort
      = tostring(srcAddr_a[1]), DestinationIp = tostring(destAddr_a[0]), destPort
      = tostring(destAddr_a[1]), Action = tostring(msg_a[7])

      | where Action == "Deny"

      | extend Fqdn = iff(DestinationIp matches regex "\\d+\\.\\d+\\.\\d+\\.\\d+","",DestinationIp)

      | summarize StartTime = min(TimeGenerated), count() by SourceIp, Fqdn, Action,
      Protocol

      | where count_ >= threshold)'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Several deny actions registered
      description: '''Identifies attack pattern when attacker tries to move, or scan,
        from resource to resource on the network and creates an incident when a source
        has more than 1 registered deny action in Azure Firewall.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SourceIp
        urls:
        - id: url1
          addressColumn: Fqdn
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1046
      - tactic: LateralMovement
        techniques:
        - technique: T1210
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        NetworkProtocol: Protocol
