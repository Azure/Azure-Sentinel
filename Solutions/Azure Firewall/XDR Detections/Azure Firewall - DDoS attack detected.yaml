resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: c3ffdbe6-2e62-4984-9e80-933ed90b2f6a
    path: Analytic Rules/Azure Firewall - DDoS attack detected.yaml
    version: 1.0.1
    querySha256: 2dd117489fa033963e0581f815d31dd3a86a6e3208732ff3e50f0c4321267665
    schedule:
      queryFrequency: 1h
      queryPeriod: 24h
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
