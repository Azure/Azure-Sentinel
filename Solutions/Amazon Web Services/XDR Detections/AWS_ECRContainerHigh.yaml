properties:
  id: xdr-f6928301-56da-4d2c-aabe-e1a552bc8892
  displayName: AWSCloudTrail - ECR image scan findings high or critical
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where EventName == "DescribeImageScanFindings" and isempty(ErrorCode) and isempty(ErrorMessage)
      | extend repoName = tostring(parse_json(ResponseElements).repositoryName)
      | extend imageId = tostring(parse_json(ResponseElements).imageId.imageDigest)
      | extend Critical = toint(parse_json(ResponseElements).imageScanFindings.findingSeverityCounts.CRITICAL)
      | extend High = toint(parse_json(ResponseElements).imageScanFindings.findingSeverityCounts.HIGH)
      | where Critical > 0 or High > 0
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - ECR image scan findings high or critical
      description: Identifies Amazon ECR image scan findings that report high or critical severity vulnerabilities. These
        findings indicate container images that should be reviewed and remediated before deployment or continued use.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1083
      customDetails:
        Repository: repoName
        ImageDigest: imageId
        CriticalFindings: Critical
        HighFindings: High
        AccountCloudAppAccountId: RecipientAccountId
