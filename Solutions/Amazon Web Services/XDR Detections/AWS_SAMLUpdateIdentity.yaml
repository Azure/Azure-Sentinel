properties:
  id: xdr-bce1dcba-4948-414d-8838-6385afb9d496
  displayName: AWSCloudTrail - SAML update identity provider
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where EventName == "UpdateSAMLProvider" and isempty(ErrorCode) and isempty(ErrorMessage)
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - SAML update identity provider
      description: |-
        Detects updates to AWS SAML identity provider configuration. Unauthorized changes can allow adversaries to
        issue trusted federation tokens and gain persistent or privileged access.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1078
      customDetails:
        EventName: EventName
        EventSource: EventSource
        AWSRegion: AWSRegion
        UserIdentityArn: UserIdentityArn
        AccountCloudAppAccountId: RecipientAccountId
