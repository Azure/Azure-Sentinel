    reviewScope:
      sourceDocumentSha256: d0f73d248c2115161a74ff2d65978d56515ab3714a5688d0d6df5dfca9db2294
      targetQuerySha256: e4ad1ff146853f0f4f924d8502500026165ad41f055234cf00fa77bb50fd773d
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 1
