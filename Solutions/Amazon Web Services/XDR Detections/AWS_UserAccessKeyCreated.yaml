properties:
  id: xdr-9a6554e6-63d9-4f94-9b32-64d1d40628f2
  displayName: AWSCloudTrail - Creation of Access Key for IAM User
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where EventName == "CreateAccessKey"
      | project-away SourceSystem,Category,Type,TenantId,EventVersion,SessionIssuerAccountId
      | extend UserName = substring(UserIdentityPrincipalid, indexof_regex(UserIdentityPrincipalid, ":") + 1)
      | extend Name = split(UserName,'@')[0],UpnSuffix = split(UserName,'@')[1]
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - Creation of Access Key for IAM User
      description: 'Detects creation of a new IAM access key on an existing user account, which could be used to establish
        persistence. This action should be validated by the AWS account administrator. Reference: https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-backdoor-user/'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UpnSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1098
          subTechniques:
          - T1098.001
      customDetails:
        EventName: EventName
        AWSRegion: AWSRegion
        UserAgent: UserAgent
