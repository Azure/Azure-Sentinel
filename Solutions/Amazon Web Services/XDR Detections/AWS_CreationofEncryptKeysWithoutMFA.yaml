properties:
  id: xdr-454133a7-5427-4a7c-bdc4-0adfa84dda16
  displayName: AWSCloudTrail - Creating keys with encrypt policy without MFA
  status: disabled
  queryCondition:
    queryText: |-
      let check_actions = AWSCloudTrail
      | where EventName in ("CreateKey", "PutKeyPolicy") and isempty(ErrorCode) and isempty(ErrorMessage)
      | extend state=parse_json(parse_json(replace_string(tostring(parse_json(RequestParameters)['policy']),'\\"','"')).['Statement'])
      | mv-expand state
      | extend Action= tostring(parse_json(state.['Action'][0])), Effect=tostring(parse_json(state.['Effect'])),
               Principal=tostring(parse_json(state.['Principal']))
      | where Action in ("kms:Encrypt", "kms:*") and (Effect == 'Allow') and (Principal has "*")
      | distinct AwsEventId;
      AWSCloudTrail
      | where EventName in ("CreateKey", "PutKeyPolicy") and isempty(ErrorCode) and isempty(ErrorMessage)
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
      | join kind=inner (check_actions) on AwsEventId
      | extend timestamp = TimeGenerated
      | project-away AwsEventId1
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - Creating keys with encrypt policy without MFA
      description: Identifies AWS KMS key creation or policy changes that allow `kms:Encrypt` or `kms:*` to any principal.
        This configuration can expose encryption capability outside approved boundaries and should be investigated as overly
        permissive or malicious.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1485
      customDetails:
        AwsEventId: AwsEventId
        EventName: EventName
        UserIdentityArn: UserIdentityArn
