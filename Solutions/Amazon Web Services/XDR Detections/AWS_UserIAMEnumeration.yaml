  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: cfaaf0bc-16d1-48df-ac8b-9d901bbd516a
    path: Analytic Rules/AWS_UserIAMEnumeration.yaml
    version: 1.0.1
    querySha256: 516d4c9e8418a9b61a56584334bce043714f5954ac32136657009af2afaa2b7f
    schedule:
      queryFrequency: 10m
      queryPeriod: 10m
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: needsReview
    reviewRequired: true
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=10m, lookback=10m; target frequency=PT10M, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - customDetails 'AWSAccountId' column `UserIdentityAccountId` requires runtime output-schema binding verification
    - customDetails 'PrincipalId' column `UserIdentityPrincipalid` requires runtime output-schema binding verification
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified
      and the service drops all custom details if exceeded
    informational: []
    errors:
