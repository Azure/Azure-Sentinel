    reviewScope:
      sourceDocumentSha256: e8ea2d23053916d3c2a91b004a3c7e4ff8ff9c511d846d69e27a95cd35caf03c
      targetQuerySha256: 09c0aeeba2267d271b4d5a4b394eb9a283858aee514e33f0671a669b5a660195
properties:
  id: xdr-cfaaf0bc-16d1-48df-ac8b-9d901bbd516a
  displayName: AWSCloudTrail - User IAM Enumeration
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 50;
      AWSCloudTrail
      | where EventName in ("ListAttachedRolePolicies","ListRoles","ListGroupsForUser","ListAttachedUserPolicies","ListAccessKeys","ListUsers")
      | summarize
          count(),
          make_set(AWSRegion),
          make_set(UserAgent),
          make_set(SourceIpAddress),
          make_set(ErrorCode),
          make_set(ErrorMessage),
          make_set(EventName)
          by bin(TimeGenerated, 10m), UserIdentityPrincipalid, UserIdentityArn, UserIdentityAccountId
      | where count_ > threshold
      | mv-expand set_SourceIpAddress
      | extend UserName = substring(UserIdentityPrincipalid, indexof_regex(UserIdentityPrincipalid, ":") + 1)
      | extend Name = split(UserName,'@')[0],UpnSuffix = split(UserName,'@')[1]
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - User IAM Enumeration
      description: Detects enumeration of IAM account configuration via repeated API calls to list roles, users, groups, and
        policies within a short time period. The threshold can be adjusted to reduce false positives from authorized cloud
        scanners such as Wiz.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UpnSuffix
        ips:
        - id: ip1
          addressColumn: set_SourceIpAddress
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1580
      customDetails:
        EventCount: count_
        AWSAccountId: UserIdentityAccountId
        PrincipalId: UserIdentityPrincipalid
