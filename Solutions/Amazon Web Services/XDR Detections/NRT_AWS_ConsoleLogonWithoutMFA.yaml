properties:
  id: xdr-0ee2aafb-4500-4e36-bcb1-e90eec2f0b9b
  displayName: AWSCloudTrail - NRT Login to AWS Management Console without MFA
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where EventName =~ "ConsoleLogin"
      | extend MFAUsed = tostring(parse_json(AdditionalEventData).MFAUsed), LoginResult = tostring(parse_json(ResponseElements).ConsoleLogin)
      | where MFAUsed !~ "Yes" and LoginResult !~ "Failure"
      | where SessionIssuerUserName !contains "AWSReservedSSO"
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
      | extend StartTimeUtc = TimeGenerated, EndTimeUtc = TimeGenerated
      | project StartTimeUtc, EndTimeUtc, EventName, EventTypeName, LoginResult, MFAUsed, RecipientAccountId, AccountName, AccountUPNSuffix, UserIdentityAccountId, UserIdentityPrincipalid, UserAgent, UserIdentityUserName, SessionMfaAuthenticated, SourceIpAddress, AWSRegion
  schedule:
    frequency: PT0S
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - NRT Login to AWS Management Console without MFA
      description: |-
        'Multi-Factor Authentication (MFA) helps you to prevent credential compromise. This alert identifies logins to the AWS Management Console without MFA.
        You can limit this detection to trigger for administrative accounts if you do not have MFA enabled on all accounts.
        This is done by looking at the eventName ConsoleLogin and if the AdditionalEventData field indicates MFA was NOT used and the ResponseElements field indicates NOT a Failure. Thereby indicating that a non-MFA login was successful.'
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1078
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
      - tactic: Persistence
        techniques:
        - technique: T1078
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountCloudAppAccountId: RecipientAccountId
