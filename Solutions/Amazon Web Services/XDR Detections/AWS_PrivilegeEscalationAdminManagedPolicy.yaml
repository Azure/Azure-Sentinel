kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
requiredDataConnectors:
- connectorId: AWS
  dataTypes:
  - AWSCloudTrail
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - AWSCloudTrail
  requiredDataConnectors:
  - connectorId: AWS
    dataTypes:
    - AWSCloudTrail
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 49ce5322-60d7-4b02-ad79-99f650aa5790
    path: Analytic Rules/AWS_PrivilegeEscalationAdminManagedPolicy.yaml
    version: 1.0.2
    querySha256: 6a491707eeb010ffce195a886b80f7f939e7307bc9fcf57f17af26a820616a97
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1d, lookback=1d; target frequency=P1D, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified
      and the service drops all custom details if exceeded
    informational:
    - Account.CloudAppAccountId mismatch is informational because its original value is preserved as customDetails.AccountCloudAppAccountId
      from query column `RecipientAccountId`; supplemental details do not restore entity identity, correlation, or alert parity
    - All source MITRE tactics are preserved in source order in authored YAML. V3.1 ARM packaging carries only the first tactic
      and its compatible techniques; this classification loss is not validated parity. Direct Graph deployment requires a
      single tactic.
    errors: []
    originalTactics:
    - PrivilegeEscalation
    - Persistence
    originalTechniques:
    - T1098.003
    reviewScope:
      sourceDocumentSha256: cf2c0ac9ea5fd96efb9260a8252797843bc027249e4c6b89b8c71ffebc8e54e1
      targetQuerySha256: a71c7c1d346e5a873e32a85321714a08fc0fbf336895efb57d07fafde5ffe9a2
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 1
      identifier: CloudAppAccountId
      sourceColumn: RecipientAccountId
      column: RecipientAccountId
      status: available
      customDetailKey: AccountCloudAppAccountId
properties:
  id: xdr-49ce5322-60d7-4b02-ad79-99f650aa5790
  displayName: AWSCloudTrail - Privilege escalation with admin managed policy
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where  EventName in ("AttachUserPolicy","AttachRolePolicy","AttachGroupPolicy") and isempty(ErrorCode) and isempty(ErrorMessage)
      | where tostring(parse_json(RequestParameters).policyArn) contains "Admin" and tostring(parse_json(RequestParameters).policyArn) !contains "FullAccess" and tostring(parse_json(RequestParameters).policyArn) !startswith "arn:aws:iam::aws:policy/AdministratorAccess"
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
      | project TimeGenerated, EventName, EventTypeName, UserIdentityAccountId, UserIdentityPrincipalid, UserAgent, RecipientAccountId, AccountName, AccountUPNSuffix, UserIdentityUserName, SessionMfaAuthenticated, SourceIpAddress, AWSRegion, EventSource, AdditionalEventData, RequestParameters, ResponseElements, UserIdentityArn
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - Privilege escalation with admin managed policy
      description: |-
        Detects successful attachment of admin-related managed IAM policies to users, roles, or groups, excluding
        the dedicated AdministratorAccess and FullAccess patterns handled by other detections. This behavior may indicate
        unauthorized privilege escalation and should be validated against approved administrative changes.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1098
          subTechniques:
          - T1098.003
      - tactic: Persistence
        techniques:
        - technique: T1098
          subTechniques:
          - T1098.003
      customDetails:
        EventName: EventName
        EventSource: EventSource
        AWSRegion: AWSRegion
        UserIdentityArn: UserIdentityArn
        AccountCloudAppAccountId: RecipientAccountId
