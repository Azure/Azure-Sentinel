properties:
  id: xdr-8f1630c2-2e45-4df2-be43-50fba90f601d
  displayName: AWSCloudTrail - RDS instance publicly exposed
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where  EventName in ("CreateDBInstance", "ModifyDBInstance") and isempty(ErrorCode) and isempty(ErrorMessage)
      | where tostring(parse_json(RequestParameters).publiclyAccessible) == "true"
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - RDS instance publicly exposed
      description: |-
        Detects RDS instance creation or modification events where the database is configured as publicly accessible.
        Public exposure of database instances can increase the risk of unauthorized access and data leakage.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1537
      customDetails:
        EventName: EventName
        AWSRegion: AWSRegion
        UserIdentityArn: UserIdentityArn
        RecipientAccountId: RecipientAccountId
