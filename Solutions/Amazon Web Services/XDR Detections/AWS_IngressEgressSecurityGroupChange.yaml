properties:
  id: xdr-4f19d4e3-ec5f-4abc-9e61-819eb131758c
  displayName: AWSCloudTrail - Changes to AWS Security Group ingress and egress settings
  status: disabled
  queryCondition:
    queryText: |-
      let EventNameList = dynamic([ "AuthorizeSecurityGroupEgress", "AuthorizeSecurityGroupIngress", "RevokeSecurityGroupEgress", "RevokeSecurityGroupIngress"]);
      AWSCloudTrail
      | where EventName in~ (EventNameList)
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
      | summarize EventCount=count(), StartTimeUtc = min(TimeGenerated), EndTimeUtc = max(TimeGenerated)
      by EventSource, EventName, UserIdentityArn, UserIdentityUserName, UserIdentityType, RecipientAccountId, AccountName, AccountUPNSuffix, SourceIpAddress, UserAgent, SessionMfaAuthenticated, AWSRegion,
      AdditionalEventData, UserIdentityAccountId, UserIdentityPrincipalid, ResponseElements
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - Changes to AWS Security Group ingress and egress settings
      description: |-
        A Security Group acts as a virtual firewall for an AWS instance to control inbound and outbound traffic. This rule detects AWS CloudTrail events for changes to Security Group ingress and egress settings.
        Investigate to validate the legitimacy of the activity and identify potential malicious activity.
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.007
      customDetails:
        UserIdentityArn: UserIdentityArn
        UserIdentityUserName: UserIdentityUserName
        UserIdentityType: UserIdentityType
        EventName: EventName
        AWSRegion: AWSRegion
        UserAgent: UserAgent
        AccountCloudAppAccountId: RecipientAccountId
