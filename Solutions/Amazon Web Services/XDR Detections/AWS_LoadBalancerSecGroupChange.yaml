  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: c7bfadd4-34a6-4fa5-82f8-3691a32261e8
    path: Analytic Rules/AWS_LoadBalancerSecGroupChange.yaml
    version: 1.0.5
    querySha256: 427e11bd2888976ef47739d44aa3d828c32b214a8e95b963b8df40ce918911aa
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1d, lookback=1d; target frequency=P1D, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - customDetails 'EventName' column `EventName` requires runtime output-schema binding verification
    - customDetails 'EventSource' column `EventSource` requires runtime output-schema binding verification
    - customDetails 'AWSRegion' column `AWSRegion` requires runtime output-schema binding verification
    - customDetails 'UserAgent' column `UserAgent` requires runtime output-schema binding verification
