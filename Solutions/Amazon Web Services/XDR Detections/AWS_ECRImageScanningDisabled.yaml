properties:
  id: xdr-19602494-94af-43c8-90ba-eb0e14999612
  displayName: AWSCloudTrail - Amazon ECR image scanning disabled
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where EventName == "PutImageScanningConfiguration" and isempty(ErrorCode) and isempty(ErrorMessage)
      | extend scanOnPush = parse_json(tostring((parse_json(RequestParameters).imageScanningConfiguration))).scanOnPush
      | where scanOnPush == false
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
      | distinct TimeGenerated, EventName, SourceIpAddress, UserIdentityArn, UserIdentityUserName, RecipientAccountId, AccountName, AccountUPNSuffix
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - Amazon ECR image scanning disabled
      description: Identifies Amazon ECR image scanning being disabled. This change can reduce visibility into vulnerable
        container images and may indicate defense evasion or weakening of container security controls.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
          subTechniques:
          - T1562.001
      customDetails:
        EventName: EventName
        UserIdentityArn: UserIdentityArn
        UserIdentityUserName: UserIdentityUserName
        RecipientAccountId: RecipientAccountId
