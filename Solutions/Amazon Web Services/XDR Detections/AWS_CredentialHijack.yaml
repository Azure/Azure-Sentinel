properties:
  id: xdr-32555639-b639-4c2b-afda-c0ae0abefa55
  displayName: AWSCloudTrail - Monitor AWS Credential abuse or hijacking
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where EventName =~ "GetCallerIdentity" and UserIdentityType =~ "AssumedRole"
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case(UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated) by SourceIpAddress, EventName, EventTypeName, UserIdentityType, RecipientAccountId, AccountName, AccountUPNSuffix, UserIdentityAccountId, UserIdentityPrincipalid,
        UserAgent, UserIdentityUserName, SessionMfaAuthenticated, AWSRegion, EventSource, AdditionalEventData, ResponseElements
      | extend timestamp = StartTime
      | sort by EndTime desc nulls last
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - Monitor AWS Credential abuse or hijacking
      description: "Identifies AWS STS `GetCallerIdentity` calls made by assumed-role sessions.\nAn attacker who has assumed\
        \ the role of a legitimate account can call the GetCallerIdentity function to determine what account they are using.\n\
        A legitimate user using legitimate credentials would not need to call GetCallerIdentity since they should already\
        \ know what account they are using.\nMore Information: https://duo.com/decipher/trailblazer-hunts-compromised-credentials-in-aws\
        \ \nAWS STS GetCallerIdentity API: https://docs.aws.amazon.com/STS/latest/APIReference/API_GetCallerIdentity.html"
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1580
      customDetails:
        AWSRegion: AWSRegion
        EventName: EventName
        EventSource: EventSource
        EventType: EventTypeName
        AccountCloudAppAccountId: RecipientAccountId
