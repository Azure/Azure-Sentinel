contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - AWSCloudTrail
  requiredDataConnectors:
  - connectorId: AWS
    dataTypes:
    - AWSCloudTrail
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: f7210a45-12a4-4d02-b59e-f23476827a4b
    path: Analytic Rules/AWS_UnauthorizedInstanceSetUpAttempt.yaml
    version: 1.0.1
    querySha256: be7ceff2654b77b5f46ec0565162581ea93626ec55059a7d8f131a691ead68a2
    schedule:
      queryFrequency: 10m
      queryPeriod: 10m
  conversion:
    tool: sentinel-to-xdr-migration
