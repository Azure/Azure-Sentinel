properties:
  id: xdr-874a1762-3fd7-4489-b411-6d4a9e9e8a59
  displayName: AWSCloudTrail - Policy version set to default
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where EventName == "SetDefaultPolicyVersion" and isempty(ErrorCode) and isempty(ErrorMessage)
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - Policy version set to default
      description: |-
        Detects SetDefaultPolicyVersion activity that makes a different IAM policy version active.
        Attackers can use this to activate previously created permissive versions and escalate access.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1098
          subTechniques:
          - T1098.003
      customDetails:
        EventName: EventName
        EventSource: EventSource
        AWSRegion: AWSRegion
        UserIdentityArn: UserIdentityArn
        AccountCloudAppAccountId: RecipientAccountId
