kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
requiredDataConnectors:
- connectorId: AWS
  dataTypes:
  - AWSCloudTrail
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - AWSCloudTrail
  requiredDataConnectors:
  - connectorId: AWS
    dataTypes:
    - AWSCloudTrail
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 139e7116-3884-4246-9978-c8f740770bdf
    path: Analytic Rules/AWS_PrivilegeEscalationAdministratorAccessManagedPolicy.yaml
    version: 1.0.2
    querySha256: 607fbad2530602e069f44630dc7be841e8035c86e2b17df56dce6651eae0334a
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1d, lookback=1d; target frequency=P1D, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified
      and the service drops all custom details if exceeded
    informational:
    - Account.CloudAppAccountId mismatch is informational because its original value is preserved as customDetails.AccountCloudAppAccountId
      from query column `RecipientAccountId`; supplemental details do not restore entity identity, correlation, or alert parity
    - All source MITRE tactics are preserved in source order in authored YAML. V3.1 ARM packaging carries only the first tactic
      and its compatible techniques; this classification loss is not validated parity. Direct Graph deployment requires a
      single tactic.
    errors: []
    originalTactics:
    - PrivilegeEscalation
    - Persistence
    originalTechniques:
    - T1098.003
    reviewScope:
      sourceDocumentSha256: 459217a29095f60ef297d2f818e8f47304a610e2be26d24c6df38be779230eaf
      targetQuerySha256: dd4b16442069cf3f422794923d41e62bc1d13f2c8e5ace9490725ac97afe96cb
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 1
      identifier: CloudAppAccountId
      sourceColumn: RecipientAccountId
      column: RecipientAccountId
      status: available
      customDetailKey: AccountCloudAppAccountId
properties:
  id: xdr-139e7116-3884-4246-9978-c8f740770bdf
  displayName: AWSCloudTrail - Privilege escalation with AdministratorAccess managed policy
  status: disabled
  queryCondition:
    queryText: |-
      AWSCloudTrail
      | where  EventName in ("AttachUserPolicy","AttachRolePolicy","AttachGroupPolicy") and isempty(ErrorCode) and isempty(ErrorMessage)
      | where tostring(parse_json(RequestParameters).policyArn) startswith "arn:aws:iam::aws:policy/AdministratorAccess"
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
      | project TimeGenerated, EventName, EventTypeName, UserIdentityAccountId, UserIdentityPrincipalid, UserAgent,UserIdentityUserName, SessionMfaAuthenticated, SourceIpAddress, AWSRegion, EventSource, AdditionalEventData, RequestParameters, UserIdentityArn, ResponseElements, RecipientAccountId, AccountName, AccountUPNSuffix
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - Privilege escalation with AdministratorAccess managed policy
      description: |-
        Detects successful attachment of the AWS managed AdministratorAccess policy to users, roles, or groups.
        This action can immediately grant full administrative permissions and is a high-risk privilege escalation pattern
        that should be validated against approved administrative activity.
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1098
          subTechniques:
          - T1098.003
      - tactic: Persistence
        techniques:
        - technique: T1098
          subTechniques:
          - T1098.003
      customDetails:
        EventName: EventName
        EventSource: EventSource
        AWSRegion: AWSRegion
        UserIdentityArn: UserIdentityArn
        AccountCloudAppAccountId: RecipientAccountId
