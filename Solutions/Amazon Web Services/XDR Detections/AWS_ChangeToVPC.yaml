properties:
  id: xdr-65360bb0-8986-4ade-a89d-af3cf44d28aa
  displayName: AWSCloudTrail - Changes to Amazon VPC settings
  status: disabled
  queryCondition:
    queryText: |-
      let EventNameList = dynamic(["CreateNetworkAclEntry","CreateRoute","CreateRouteTable","CreateInternetGateway","CreateNatGateway"]);
      AWSCloudTrail
      | where EventName in~ (EventNameList)
      | where EventSource != "apigateway.amazonaws.com"
      | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
      | extend UserName = tostring(split(UserIdentityArn, '/')[-1])
      | extend AccountName = case( UserIdentityPrincipalid == "Anonymous", "Anonymous", isempty(UserIdentityUserName), UserName, UserIdentityUserName)
      | extend AccountName = iif(AccountName contains "@", tostring(split(AccountName, '@', 0)[0]), AccountName),
        AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, '@', 1)[0]), "")
      | summarize StartTimeUtc = min(TimeGenerated), EndTimeUtc = max(TimeGenerated) by EventName, EventTypeName, RecipientAccountId, AccountName, AccountUPNSuffix, UserIdentityAccountId, UserIdentityPrincipalid, UserAgent,
      UserIdentityUserName, SessionMfaAuthenticated, SourceIpAddress, AWSRegion, EventSource, AdditionalEventData, ResponseElements
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AWSCloudTrail - Changes to Amazon VPC settings
      description: "Identifies changes to Amazon VPC(Virtual Private Cloud) settings that can alter network exposure, routing,\
        \ or access controls.\nThis rule identifies changes to Amazon VPC (Virtual Private Cloud) settings such as new ACL\
        \ entries, routes, routetable or Gateways. \nAWS VPC API Docs: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/OperationList-query-vpc.html'"
      severity: low
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        ips:
        - id: ip1
          addressColumn: SourceIpAddress
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1078
      - tactic: DefenseEvasion
        techniques:
        - technique: T1078
        - technique: T1562
          subTechniques:
          - T1562.007
      customDetails:
        AWSRegion: AWSRegion
        RecipientAccountId: RecipientAccountId
        EventName: EventName
        EventSource: EventSource
