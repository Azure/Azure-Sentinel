    id: d25b1998-a592-4bc5-8a3a-92b39eedb1bc
    path: Analytic Rules/AWS_ConsoleLogonWithoutMFA.yaml
    version: 1.0.6
    querySha256: 77b5657366b5ab8fe173d90083d88305781bbba7da0d5dd6f68aa2f2c02b6a81
    schedule:
      queryFrequency: 1d
