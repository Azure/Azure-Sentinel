id: 800314a6-759a-4575-93e2-1e080b1d33f9
name: NordPass - Activity token revoked
kind: Scheduled
version: 1.1.0
displayName: Activity token revoked
description: This will alert you when the event reporting token is revoked, posing the risk of active integration being blocked.
severity: Medium
query: |
  NordPassActivities
  | where event_type == "integrations" and action == "activities_token_revoked"
  | extend TargetEmail = user_email
requiredDataConnectors:
  - connectorId: NordPass
    dataTypes:
      - NordPassEventLogs_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1134
incidentConfiguration:
  createIncident: false
entityMappings:
  - entityType: Mailbox
    fieldMappings:
      - identifier: MailboxPrimaryAddress
        columnName: TargetEmail
