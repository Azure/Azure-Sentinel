properties:
  id: xdr-9392a06f-63a4-4a5d-8ca3-647064b13c28
  displayName: Darktrace Model Alert
  status: disabled
  queryCondition:
    queryText: |-
      DarktraceModelAlerts_CL
      | where TimeGenerated >= ago(5m)
      | extend SentinelSeverity = case(
      compliance == true, "Informational",
      category == "Informational", "Low",
      category == "Suspicious", "Medium",
      category == "Critical", "High",
      "Informational")
      | extend ProviderName = "Darktrace"
      | mv-apply item = mitreTechniques on (
          extend techniqueId = tostring(item.techniqueId)
          | summarize techniqueIdArray = make_list(techniqueId, 5)
      )
      | extend accountName = accountName, sourceIp = sourceIp, destIp = destIp, destHost = destHost, sourceHost = sourceHost, deviceHostname = deviceHostname, deviceCredentials = deviceCredentials, compliance = compliance, score = score, customLabel = customLabel, category = category
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Darktrace Model Alert
      description: |-
        This query searches for Darktrace model alerts and creates a Microsoft Sentinel alert
        from each matching event. Edit this analytic rule if you would like it to create
        Microsoft Sentinel incidents.
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: sourceIp
        - id: ip2
          addressColumn: destIp
        hosts:
        - id: host1
          nameColumn: destHost
        - id: host2
          nameColumn: sourceHost
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      - tactic: Execution
        techniques:
        - technique: T1059
      - tactic: LateralMovement
        techniques:
        - technique: T1021
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        DeviceHostname: deviceHostname
        DeviceCredentials: deviceCredentials
        Compliance: compliance
        Score: score
        CustomLabel: customLabel
        Category: category
        AccountFullName: accountName
