properties:
  id: xdr-05de0eaf-01bc-4615-99fc-2ec769864b34
  displayName: Darktrace Incident Event
  status: disabled
  queryCondition:
    queryText: |-
      DarktraceIncidents_CL
      | where TimeGenerated >= ago(5m)
      | extend SentinelSeverity = case(groupCategory == "suspicious", "Medium",
      groupCategory == "critical", "High", "Informational")
      | extend ProviderName = "Darktrace"
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Darktrace Incident Event
      description: This query searches for Darktrace incident events and creates a Microsoft Sentinel incident for each matching
        result.
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: deviceIp
        hosts:
        - id: host1
          nameColumn: deviceHostname
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      - tactic: Execution
        techniques:
        - technique: T1059
      - tactic: LateralMovement
        techniques:
        - technique: T1021
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        Asset: bestAssetName
        IncidentEventScore: aiaScore
        IncidentScore: groupScore
        CurrentGroup: currentGroup
        PreviousGroups: groupPreviousGroups
        StartTime: startTime
        EndTime: endTime
        CustomLabel: customLabel
        AssetDetails: devices
        ModelBreaches: modelBreaches
        AccountFullName: accountName
