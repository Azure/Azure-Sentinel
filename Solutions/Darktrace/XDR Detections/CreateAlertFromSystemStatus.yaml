properties:
  id: xdr-2e629769-60eb-4a14-8bfc-bde9be66ebeb
  displayName: Darktrace System Status (Legacy)
  status: disabled
  queryCondition:
    queryText: |-
      darktrace_model_alerts_CL
      | where dtProduct_s =~ "system alert"
      | extend EventVendor="Darktrace", EventProduct="Darktrace DETECT"
      | project-rename ThreatCategory=dtProduct_s, EventStartTime=time_s, NetworkRuleName=friendlyName_s, SrcIpAddr=deviceIP_s, SrcHostname=hostname_s, ThreatRiskLevel=priority_code_d, ThreatRiskCategory=priority_s, DtSeverity=Severity, DtName=name_s, DtStatus=status_s, DtMessage=Message, DtURL=url_s, DtUUID=uuid_g
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: Darktrace System Status (Legacy)
      description: '''This rule creates Microsoft Sentinel Alerts based on Darktrace system status alerts for health monitoring,
        fetched every 5 minutes.'''
      severity: informational
      entityMappings:
        hosts:
        - id: host1
          nameColumn: SrcHostname
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1082
      - tactic: Impact
        techniques:
        - technique: T1498
      customDetails:
        EventStartTime: EventStartTime
        NetworkRuleName: NetworkRuleName
        ThreatRiskLevel: ThreatRiskLevel
        ThreatRiskCategory: ThreatRiskCategory
        DtName: DtName
        DtStatus: DtStatus
        DtMessage: DtMessage
        DtSeverity: DtSeverity
