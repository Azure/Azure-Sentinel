id: 0eb4df70-418e-4f7d-9b5a-cfe35034ec11
name: WhoisFreaks - high confidence threat domains
description: |
  Identifies high-confidence malware, phishing, and spam domains from WhoisFreaks threat feeds.
severity: High
status: Available
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - CommandAndControl
relevantTechniques:
  - T1566
  - T1071
query: |
  WhoisFreaksThreat_CL
  | where toint(confidence) >= 80 or confidence =~ "high"
  | summarize arg_max(TimeGenerated, *) by domain, threat_type
  | project TimeGenerated, domain, threat_type, confidence, first_seen, last_seen, is_parked, matched_pivots
entityMappings:
  - entityType: DNS
    fieldMappings:
      - identifier: DomainName
        columnName: domain
eventGroupingSettings:
  aggregationKind: SingleAlert
version: 1.0.0
kind: Scheduled
