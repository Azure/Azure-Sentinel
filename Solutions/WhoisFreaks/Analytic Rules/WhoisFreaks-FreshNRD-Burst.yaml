id: 9d79f28f-5d1d-4ca8-b3d3-4ab5f5513e8d
name: WhoisFreaks - Burst of Newly Registered Domains
description: |
  Detects unusually large NRD ingest volume which may indicate bulk registration campaigns.
severity: Low
status: Available
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
relevantTechniques:
  - T1583
query: |
  union WhoisFreaksNRD_CL, WhoisFreaksNRDNoWhois_CL
  | where TimeGenerated > ago(1h)
  | summarize DomainCount=dcount(domain_name) by bin(TimeGenerated, 1h)
  | where DomainCount > 5000
  | project TimeGenerated, DomainCount
eventGroupingSettings:
  aggregationKind: SingleAlert
version: 1.0.0
kind: Scheduled
