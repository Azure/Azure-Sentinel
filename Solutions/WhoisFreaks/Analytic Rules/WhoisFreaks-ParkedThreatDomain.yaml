id: 3c6be532-dfa0-42ee-87ea-cf3d9e6772bb
name: WhoisFreaks - parked threat domains
description: |
  Identifies threat-listed domains that are currently parked and may be used for staging.
severity: Medium
status: Available
queryFrequency: 6h
queryPeriod: 6h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
relevantTechniques:
  - T1583
query: |
  WhoisFreaksThreat_CL
  | where tostring(is_parked) =~ "true" or tostring(is_parked) == "1"
  | summarize arg_max(TimeGenerated, *) by domain
  | project TimeGenerated, domain, threat_type, confidence, parked_reason, matched_pivots
entityMappings:
  - entityType: DNS
    fieldMappings:
      - identifier: DomainName
        columnName: domain
eventGroupingSettings:
  aggregationKind: SingleAlert
version: 1.0.0
kind: Scheduled
