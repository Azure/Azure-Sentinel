id: fc6d1ab7-a088-4b9e-8ea1-b95584172c33
Function:
  Title: Parser for DynatraceAttacks
  Version: '3.0.0'
  LastUpdated: '2026-06-30'
Category: Microsoft Sentinel Parser
FunctionName: DynatraceAttacks
FunctionAlias: DynatraceAttacks
FunctionQuery: |
    let DynatraceAttacksV1 = view() {
        DynatraceAttacks_CL
        | extend request_host_s = column_ifexists('request_host_s', '')
        | project
            TimeGenerated,
            EventVendor = 'Dynatrace',
            EventProduct = 'Application Security',
            Severity = 'High',
            AttackId = attackId_s,
            AttackType = attackType_s,
            DisplayId = displayId_s,
            DisplayName = displayName_s,
            State = state_s,
            TimeStamp = unixtime_milliseconds_todatetime(timestamp_d),
            url = request_url_s,
            host = request_host_s,
            sourceIp = attacker_sourceIp_s,
            managementZones = managementZones_s
    };
    let DynatraceAttacksV2 = view() {
        DynatraceAttacksV2_CL
        | project
            TimeGenerated,
            EventVendor = 'Dynatrace',
            EventProduct = 'Application Security',
            Severity = 'High',
            AttackId = attackId,
            AttackType = attackType,
            DisplayId = displayId,
            DisplayName = displayName,
            State = state,
            TimeStamp = TimeGenerated,
            url = tostring(request['url']),
            host = tostring(request['host']),
            sourceIp = tostring(attacker['sourceIp']),
            managementZones = tostring(managementZones)
    };
    let DynatraceAttacksV3 = view() {
        DynatraceAttacksV3_CL
        | project
            TimeGenerated,
            EventVendor = 'Dynatrace',
            EventProduct = 'Application Security',
            Severity = case(dt_security_risk_level == 'CRITICAL', 'High',
                           dt_security_risk_level == 'HIGH', 'Medium',
                           dt_security_risk_level == 'MEDIUM', 'Low',
                           'Informational'),
            AttackId = event_id,
            AttackType = finding_type,
            DisplayId = finding_id,
            DisplayName = finding_title,
            State = '',
            TimeStamp = finding_time_created,
            url = '',
            host = object_name,
            sourceIp = tostring(actor_ips),
            managementZones = ''
    };
    union isfuzzy=true DynatraceAttacksV1, DynatraceAttacksV2, DynatraceAttacksV3
