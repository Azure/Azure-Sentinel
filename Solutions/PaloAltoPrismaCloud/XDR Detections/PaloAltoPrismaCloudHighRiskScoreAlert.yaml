properties:
  id: xdr-617b02d8-0f47-4f3c-afed-1926a45e7b28
  displayName: Palo Alto Prisma Cloud - High risk score alert
  status: disabled
  queryCondition:
    queryText: |-
      PaloAltoPrismaCloud
      | where Reason =~ 'NEW_ALERT'
      | where Status =~ 'open'
      | extend r_score = 0.85 * toint(RiskDetailRiskScoreMaxScore)
      | extend i_RiskDetailRiskScoreScore = toint(RiskDetailRiskScoreScore)
      | where i_RiskDetailRiskScoreScore > r_score
      | extend AccountCustomEntity = UserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Palo Alto Prisma Cloud - High risk score alert
      description: '''Detects alerts with high risk score value.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1133
      customDetails:
        AccountName: AccountCustomEntity
