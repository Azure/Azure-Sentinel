properties:
  id: xdr-c5bf680f-fa37-47c3-9f38-e839a9b99c05
  displayName: Palo Alto Prisma Cloud - High severity alert opened for several days
  status: disabled
  queryCondition:
    queryText: |-
      let ResolvedAlerts = PaloAltoPrismaCloud
      | summarize result = make_set(Status) by AlertId
      | where result has 'resolved'
      | project AlertId;
      PaloAltoPrismaCloud
      | where Reason =~ 'NEW_ALERT'
      | where AlertSeverity =~ 'high'
      | where Status =~ 'open'
      | where AlertId !in (ResolvedAlerts)
      | extend alert_time = now() - TimeGenerated
      | where alert_time > 1d
      | extend ['Opened Days'] = strcat('Alert opened for ', strcat(toint(alert_time / 1d), ' days'))
      | distinct AlertId, AlertMessage, AlertSeverity, ['Opened Days'], ResourceId, UserName
      | extend AccountCustomEntity = UserName
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Palo Alto Prisma Cloud - High severity alert opened for several days
      description: '''Detects high severity alert which is opened for several days.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1133
      customDetails:
        AccountName: AccountCustomEntity
