properties:
  id: xdr-4f688252-bf9b-4136-87bf-d540b5be1050
  displayName: Palo Alto Prisma Cloud - Multiple failed logins for user
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      PaloAltoPrismaCloud
      | where ResourceType =~ 'Login'
      | where EventResult =~ 'Failed'
      | where EventMessage !has 'access key'
      | summarize count() by UserName, bin(TimeGenerated, 5m)
      | where count_ > threshold
      | extend AccountCustomEntity = UserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Palo Alto Prisma Cloud - Multiple failed logins for user
      description: '''Detects multiple failed logins for the same user account.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountName: AccountCustomEntity
