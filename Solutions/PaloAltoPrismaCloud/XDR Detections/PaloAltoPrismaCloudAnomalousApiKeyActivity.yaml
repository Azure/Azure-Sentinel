properties:
  id: xdr-bd602b90-f7f9-4ae9-bf8c-3672a24deb39
  displayName: Palo Alto Prisma Cloud - Anomalous access key usage
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      PaloAltoPrismaCloud
      | where ResourceType =~ 'Login'
      | where EventResult =~ 'Failed'
      | where EventMessage has 'access key'
      | summarize count() by UserName, bin(TimeGenerated, 5m)
      | where count_ > threshold
      | extend AccountCustomEntity = UserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Palo Alto Prisma Cloud - Anomalous access key usage
      description: '''Detects anomalous API key usage activity.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
