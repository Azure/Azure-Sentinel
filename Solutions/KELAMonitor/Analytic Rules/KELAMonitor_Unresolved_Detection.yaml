id: f160411a-0351-41d5-bc44-53fc6b0ffc13
name: KELA Monitor Unresolved Incident
description: |
  Identifies unresolved incidents ingested from the KELA Monitor API, regardless of their original severity.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: KELAMonitorCCFConnector
    dataTypes:
      - KELA_Monitor_Incidents_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - ResourceDevelopment
  - InitialAccess
  - CredentialAccess
relevantTechniques:
  - T1566
  - T1586
  - T1078
query: |
  KELA_Monitor_Incidents_CL
  | summarize arg_max(TimeGenerated, *) by id
  | where severity >= 1
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: email
      - identifier: Name
        columnName: username
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: ip
  - entityType: DNS
    fieldMappings:
      - identifier: DomainName
        columnName: domain
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: source_url
  - entityType: FileHash
    fieldMappings:
      - identifier: Value
        columnName: file_hash
customDetails:
  IncidentType: incidentType
  SubType: sub_type_description
  Actor: author
  Service: service
  BotID: bot_id
alertDetailsOverride:
  alertDisplayNameFormat: "KELA Monitor: {{sub_type_description}} (Severity {{severity}})"
  alertDescriptionFormat: "Incident ID {{id}} detected for category '{{incidentType}}'."
version: 1.0.0
kind: Scheduled