properties:
  id: xdr-4eddd44a-25e4-41af-930d-0c17218bec74
  displayName: CiscoISE - Backup failed
  status: disabled
  queryCondition:
    queryText: |-
      let lbtime = 6h;
      CiscoISEEvent
      | where TimeGenerated > ago(lbtime)
      | where EventId in ('60095', '60098')
      | project TimeGenerated, DvcHostname, DvcIpAddr
      | extend HostCustomEntity = DvcHostname
      | extend IPCustomEntity = DvcIpAddr
  schedule:
    frequency: PT6H
  detectionAction:
    alertTemplate:
      title: CiscoISE - Backup failed
      description: '''Detects when backup activity failed.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1490
      customDetails:
        HostFullName: HostCustomEntity
