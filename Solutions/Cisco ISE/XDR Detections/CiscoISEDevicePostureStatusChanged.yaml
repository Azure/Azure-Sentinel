properties:
  id: xdr-548a2eda-d3eb-46cc-8d4b-1601551629e4
  displayName: CiscoISE - Device PostureStatus changed to non-compliant
  status: disabled
  queryCondition:
    queryText: |-
      let lbtime_48h = 48h;
      let lbtime_24h = 24h;
      let lbtime_now = now();
      let compliantIPs = CiscoISEEvent
      | where TimeGenerated between (ago(lbtime_48h) .. ago(lbtime_24h))
      | where PostureStatus == 'Compliant'
      | summarize makelist(DstIpAddr)
      ;
      CiscoISEEvent
      | where TimeGenerated between (ago(lbtime_24h) .. lbtime_now)
      | where PostureStatus != 'Compliant'
      | where DstIpAddr in (compliantIPs)
      | project DstIpAddr
      | extend IPCustomEntity = DstIpAddr
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: CiscoISE - Device PostureStatus changed to non-compliant
      description: '''Detects when device changes PostureStatus from "Compliant".'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1098
      - tactic: Persistence
        techniques:
        - technique: T1098
