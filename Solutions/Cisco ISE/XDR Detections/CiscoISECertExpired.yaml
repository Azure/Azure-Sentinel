properties:
  id: xdr-6107cba5-2974-4c22-8222-2a6f7bbea664
  displayName: CiscoISE - Certificate has expired
  status: disabled
  queryCondition:
    queryText: |-
      let lbtime = 1h;
      CiscoISEEvent
      | where TimeGenerated > ago(lbtime)
      | where EventId == '60167'
      | project SrcIpAddr, DvcIpAddr, DvcHostname, DstUserName
      | extend HostCustomEntity = DvcHostname
      | extend IPCustomEntity = SrcIpAddr
      | extend AccountCustomEntity = DstUserName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: CiscoISE - Certificate has expired
      description: '''Detects certificate expiration.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1552
      customDetails:
        AccountFullName: AccountCustomEntity
        HostFullName: HostCustomEntity
