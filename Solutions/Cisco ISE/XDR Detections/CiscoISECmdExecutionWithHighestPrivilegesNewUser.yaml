properties:
  id: xdr-e71890a2-5f61-4790-b1ed-cf1d92d3e398
  displayName: CiscoISE - Command executed with the highest privileges by new user
  status: disabled
  queryCondition:
    queryText: |-
      let lbperiod = 14d;
      let lbtime = 15m;
      let knownPrivUsers =
      CiscoISEEvent
      | where TimeGenerated between (ago(lbperiod) .. ago(lbtime))
      | where PrivilegeLevel == '15'
      | summarize makelist(DstUserName)
      ;
      CiscoISEEvent
      | where TimeGenerated > ago(lbtime)
      | where PrivilegeLevel == '15'
      | where DstUserName !in (knownPrivUsers)
      | project TimeGenerated, SrcIpAddr, DstIpAddr, DstUserName, CmdSet
      | extend AccountCustomEntity = DstUserName
      | extend IPCustomEntity = SrcIpAddr
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: CiscoISE - Command executed with the highest privileges by new user
      description: '''Detects command execution with PrivilegeLevel - 15 by user for which there was no such activity detected
        earlier.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1133
      - tactic: Persistence
        techniques:
        - technique: T1133
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1548
      - tactic: DefenseEvasion
        techniques:
        - technique: T1548
      - tactic: Execution
        techniques:
        - technique: T1059
      customDetails:
        AccountFullName: AccountCustomEntity
