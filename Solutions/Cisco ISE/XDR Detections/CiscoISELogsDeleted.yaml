properties:
  id: xdr-21d3be4c-6088-4e76-b6eb-d25479019cb9
  displayName: CiscoISE - Log files deleted
  status: disabled
  queryCondition:
    queryText: |-
      let lbtime = 5m;
      CiscoISEEvent
      | where TimeGenerated > ago(lbtime)
      | where EventId in ('58015', '59101', '59102')
      | project TimeGenerated, DvcHostname, DvcIpAddr, DstUserName
      | extend HostCustomEntity = DvcHostname
      | extend IPCustomEntity = DvcIpAddr
      | extend AccountCustomEntity = DstUserName
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: CiscoISE - Log files deleted
      description: '''Detects log file deleting activity.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1070
          subTechniques:
          - T1070.004
      customDetails:
        AccountFullName: AccountCustomEntity
        HostFullName: HostCustomEntity
