properties:
  id: xdr-b6549a28-d61c-476e-b350-4404352ee427
  displayName: CiscoISE - Attempt to delete local store logs
  status: disabled
  queryCondition:
    queryText: |-
      let lbtime = 5m;
      CiscoISEEvent
      | where TimeGenerated > ago(lbtime)
      | where EventId == '59103'
      | project TimeGenerated, DvcHostname, DvcIpAddr, DstUserName
      | extend HostCustomEntity = DvcHostname
      | extend IPCustomEntity = DvcIpAddr
      | extend AccountCustomEntity = DstUserName
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: CiscoISE - Attempt to delete local store logs
      description: '''Detects when attempt to delete local store logs failed.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1070
      customDetails:
        AccountFullName: AccountCustomEntity
        HostFullName: HostCustomEntity
