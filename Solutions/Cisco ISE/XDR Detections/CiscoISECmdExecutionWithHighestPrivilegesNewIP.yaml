properties:
  id: xdr-1fa0da3e-ec99-484f-aadb-93f59764e158
  displayName: CiscoISE -  Command executed with the highest privileges from new IP
  status: disabled
  queryCondition:
    queryText: |-
      let lbperiod = 14d;
      let lbtime = 15m;
      let knownAdminIpList =
      CiscoISEEvent
      | where TimeGenerated between (ago(lbperiod) .. ago(lbtime))
      | where PrivilegeLevel == '15'
      | summarize makelist(SrcIpAddr)
      ;
      CiscoISEEvent
      | where TimeGenerated > ago(lbtime)
      | where PrivilegeLevel == '15'
      | where SrcIpAddr !in (knownAdminIpList)
      | project TimeGenerated, SrcIpAddr, DstIpAddr, DstUserName, CmdSet
      | extend AccountCustomEntity = DstUserName
      | extend IPCustomEntity = SrcIpAddr
  schedule:
    frequency: PT5M
  detectionAction:
    alertTemplate:
      title: CiscoISE -  Command executed with the highest privileges from new IP
      description: '''Detects command execution with PrivilegeLevel - 15 from new source.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1133
      - tactic: Persistence
        techniques:
        - technique: T1133
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1548
      - tactic: DefenseEvasion
        techniques:
        - technique: T1548
      - tactic: Execution
        techniques:
        - technique: T1059
      customDetails:
        AccountFullName: AccountCustomEntity
