properties:
  id: xdr-4c9f0a9e-44d7-4c9b-b7f0-f6a6e0d8f8fa
  displayName: GSA - Detect Connections Outside Operational Hours
  status: disabled
  queryCondition:
    queryText: |-
      let endtime = now();
      let starttime = endtime - 1d;
      let operational_start_hour = 8; // Start of operational hours (8 AM)
      let operational_end_hour = 18; // End of operational hours (6 PM)
      NetworkAccessTraffic
      | where TimeGenerated between (starttime .. endtime)
      | extend HourOfDay = datetime_part('hour', TimeGenerated)
      | where HourOfDay < operational_start_hour or HourOfDay >= operational_end_hour
      | project TimeGenerated, UserPrincipalName, SourceIp, DestinationIp, DestinationPort, Action, DeviceId, DeviceOperatingSystem, ConnectionId
      | extend IPCustomEntity = SourceIp, AccountCustomEntity = UserPrincipalName
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: GSA - Detect Connections Outside Operational Hours
      description: This query identifies connections that occur outside of the defined operational hours. It helps in monitoring
        and flagging any unusual activity that may occur during non-business hours, indicating potential security concerns
        or policy violations.
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: UserPrincipalName
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
        - technique: T1133
      customDetails:
        AccountName: AccountCustomEntity
