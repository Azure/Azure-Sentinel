id: e92e447e-d84e-4655-93f0-29a16ac17958
Function:
  Title: Custom Parser for Network Session Essentials
  Version: '1.0.1'
  LastUpdated: '2026-11-09'
Category: Microsoft Sentinel Parser
FunctionName: NetworkSessionEssentialsCustomParser
FunctionAlias: NetworkSessionEssentialsCustomParser
FunctionQuery: |
  union isfuzzy=true
      (datatable(
          TimeGenerated: datetime,
          EventTime_t: datetime,
          SrcIpAddr_s: string,
          DstIpAddr_s: string,
          NetworkDirection_s: string,
          DvcAction_s: string,
          SrcGeoCountry_s: string,
          DstGeoCountry_s: string,
          EventResult_s: string,
          EventSeverity_s: string,
          NetworkProtocol_s: string,
          DstAppName_s: string,
          EventProduct_s: string,
          DvcHostname_s: string,
          Threat_s: string,
          ThreatCategory_s: string,
          SrcHostname_s: string,
          DstHostname_s: string,
          Rule_s: string,
          Type: string
      )[]),
      NetworkCustomAnalytics_ip_CL,
      NetworkCustomAnalytics_ipV1_CL,
      NetworkCustomAnalytics_source_port_CL,
      NetworkCustomAnalytics_source_portV1_CL,
      NetworkCustomAnalytics_country_CL,
      NetworkCustomAnalytics_countryV1_CL,
      NetworkCustomAnalytics_CL,
      NetworkCustomAnalyticsV1_CL,
      NetworkCustomAnalytics_protocol_CL,
      NetworkCustomAnalytics_protocolV1_CL,
      NetworkCustomAnalytics_sourceInfo_CL,
      NetworkCustomAnalytics_sourceInfoV1_CL,
      NetworkCustomAnalytics_threat_CL,
      NetworkCustomAnalytics_threatV1_CL,
      NetworkCustomAnalytics_threat_ioc_CL,
      NetworkCustomAnalytics_threat_iocV1_CL,
      NetworkCustomAnalytics_rule_CL,
      NetworkCustomAnalytics_ruleV1_CL
  | extend
      count__d = coalesce(tolong(column_ifexists("count__d", long(null))), tolong(column_ifexists("count__d_real", real(null))), tolong(column_ifexists("count__d_long", long(null)))),
      DstPortNumber_d = coalesce(tolong(column_ifexists("DstPortNumber_d", long(null))), tolong(column_ifexists("DstPortNumber_d_real", real(null))), tolong(column_ifexists("DstPortNumber_d_long", long(null)))),
      SrcPortNumber_d = coalesce(tolong(column_ifexists("SrcPortNumber_d", long(null))), tolong(column_ifexists("SrcPortNumber_d_real", real(null))), tolong(column_ifexists("SrcPortNumber_d_long", long(null))))