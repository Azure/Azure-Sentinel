properties:
  id: xdr-cd8faa84-4464-4b4e-96dc-b22f50c27541
  displayName: Network Port Sweep from External Network (ASIM Network Session schema)
  status: disabled
  queryCondition:
    queryText: 'let lookback = 1h;

      let threshold = 20;

      _Im_NetworkSession(starttime=ago(lookback),endtime=now())

      | where NetworkDirection == "Inbound"

      | summarize set_DstIpAddr = make_set(DstIpAddr,100) by SrcIpAddr, DstPortNumber

      | where array_length(set_DstIpAddr) > threshold'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Network Port Sweep from External Network (ASIM Network Session schema)
      description: '''This detection rule detects scenarios when a particular port
        is being scanned by multiple external sources. The rule utilize [ASIM](https://aka.ms/AboutASIM)
        normalization, and is applied to any source which supports the ASIM Network
        Session schema.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Reconnaissance
        techniques:
        - technique: T1590
      - tactic: Discovery
        techniques:
        - technique: T1046
      customDetails:
        AllDstIpAddr: set_DstIpAddr
