properties:
  id: xdr-network-port-sweep-from-external-network-asim-network-session-schema-cd8faa84
  displayName: Network Port Sweep from External Network (ASIM Network Session schema)
  status: disabled
  queryCondition:
    queryText: |-
      let lookback = 1h;
      let threshold = 20;
      _Im_NetworkSession(starttime=ago(lookback),endtime=now())
      | where NetworkDirection == "Inbound"
      | summarize make_set(DstIpAddr,100) by SrcIpAddr, DstPortNumber
      | where array_length(set_DstIpAddr) > threshold
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Network Port Sweep from External Network (ASIM Network Session schema)
      description: '''This detection rule detects scenarios when a particular port is being scanned by multiple external sources.
        The rule utilize [ASIM](https://aka.ms/AboutASIM) normalization, and is applied to any source which supports the ASIM
        Network Session schema.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Reconnaissance
        techniques:
        - technique: T1590
