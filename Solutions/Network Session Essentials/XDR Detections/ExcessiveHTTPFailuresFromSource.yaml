properties:
  id: xdr-4902eddb-34f7-44a8-ac94-8486366e9494
  displayName: Excessive number of failed connections from a single source (ASIM Network
    Session schema)
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5000;

      _Im_NetworkSession(eventresult=''Failure'')

      | summarize Count=count() by SrcIpAddr, bin(TimeGenerated,5m)

      | where Count > threshold

      | extend timestamp = TimeGenerated, threshold'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Excessive number of failed connections from a single source (ASIM Network
        Session schema)
      description: "'This rule identifies a single source that generates an excessive\
        \ amount of failed connections. Modify the threshold to change the sensitivity\
        \ of the rule: the higher the threshold, the less sensitive is the rule and\
        \ less incidents will be generated.\n This analytic rule uses [ASIM](https://aka.ms/AboutASIM)\
        \ and supports any built-in or custom source that supports the ASIM NetworkSession\
        \ schema'"
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1499
      customDetails:
        NumberOfDenies: Count
