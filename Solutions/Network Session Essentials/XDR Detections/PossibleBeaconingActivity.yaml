properties:
  id: xdr-fcb9d75c-c3c1-4910-8697-f136bfef2363
  displayName: Potential beaconing activity (ASIM Network Session schema)
  status: disabled
  queryCondition:
    queryText: "let querystarttime = 2d;\nlet queryendtime = 1d;\nlet TimeDeltaThreshold\
      \ = 10;\nlet TotalEventsThreshold = 15;\nlet PercentBeaconThreshold = 80;\n\
      let LocalNetworks=dynamic([\"169.254.0.0/16\",\"127.0.0.0/8\"]);\n_Im_NetworkSession(starttime=ago(querystarttime),\
      \ endtime=ago(queryendtime))\n| where not(ipv4_is_private(DstIpAddr))\n| where\
      \ not (ipv4_is_in_any_range(DstIpAddr, LocalNetworks))\n| project\n    TimeGenerated\n\
      \    , SrcIpAddr\n    , SrcPortNumber\n    , DstIpAddr\n    , DstPortNumber\n\
      \    , DstBytes\n    , SrcBytes\n| sort by\n    SrcIpAddr asc\n    , TimeGenerated\
      \ asc\n    , DstIpAddr asc\n    , DstPortNumber asc\n| serialize\n| extend\n\
      \    nextTimeGenerated = next(TimeGenerated, 1)\n    , nextSrcIpAddr = next(SrcIpAddr,\
      \ 1)\n| extend\n    TimeDeltainSeconds = datetime_diff('second', nextTimeGenerated,\
      \ TimeGenerated)\n| where SrcIpAddr == nextSrcIpAddr\n//Whitelisting criteria/\
      \ threshold criteria\n| where TimeDeltainSeconds > TimeDeltaThreshold\n| project\n\
      \    TimeGenerated\n    , TimeDeltainSeconds\n    , SrcIpAddr\n    , SrcPortNumber\n\
      \    , DstIpAddr\n    , DstPortNumber\n    , DstBytes\n    , SrcBytes\n| summarize\n\
      \    count()\n    , sum(DstBytes)\n    , sum(SrcBytes)\n    , make_list(TimeDeltainSeconds)\n\
      \    by TimeDeltainSeconds\n        , bin(TimeGenerated, 1h)\n        , SrcIpAddr\n\
      \        , DstIpAddr\n        , DstPortNumber\n| summarize\n    (MostFrequentTimeDeltaCount,\
      \ MostFrequentTimeDeltainSeconds) = arg_max(count_, TimeDeltainSeconds)\n  \
      \  , TotalEvents=sum(count_)\n    , TotalSrcBytes = sum(sum_SrcBytes)\n    ,\
      \ TotalDstBytes = sum(sum_DstBytes)\n    by bin(TimeGenerated, 1h)\n       \
      \ , SrcIpAddr\n        , DstIpAddr\n        , DstPortNumber\n| where TotalEvents\
      \ > TotalEventsThreshold\n| extend BeaconPercent = MostFrequentTimeDeltaCount/toreal(TotalEvents)\
      \ * 100\n| where BeaconPercent > PercentBeaconThreshold"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Potential beaconing activity (ASIM Network Session schema)
      description: "This rule identifies beaconing patterns from Network traffic logs\
        \ based on recurrent frequency patterns. \nSuch potential outbound beaconing\
        \ patterns to untrusted public networks should be investigated for any malware\
        \ callbacks or data exfiltration attempts as discussed in this [Blog](https://medium.com/@HuntOperator/detect-beaconing-with-flare-elastic-stack-and-intrusion-detection-systems-110dc74e0c56).\n\
        This analytic rule uses [ASIM](https://aka.ms/AboutASIM) and supports any\
        \ built-in or custom source that supports the ASIM NetworkSession schema'"
      severity: low
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
        - id: ip2
          addressColumn: DstIpAddr
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
        - technique: T1571
      customDetails:
        DstPortNumber: DstPortNumber
        FrequencyCount: TotalSrcBytes
        FrequencyTime: MostFrequentTimeDeltaCount
        TotalDstBytes: TotalDstBytes
