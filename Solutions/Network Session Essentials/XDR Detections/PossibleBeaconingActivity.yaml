properties:
  id: xdr-potential-beaconing-activity-asim-network-session-schema-fcb9d75c
  displayName: Potential beaconing activity (ASIM Network Session schema)
  status: disabled
  queryCondition:
    queryText: |-
      let querystarttime = 2d;
      let queryendtime = 1d;
      let TimeDeltaThreshold = 10;
      let TotalEventsThreshold = 15;
      let PercentBeaconThreshold = 80;
      let LocalNetworks=dynamic(["169.254.0.0/16","127.0.0.0/8"]);
      _Im_NetworkSession(starttime=ago(querystarttime), endtime=ago(queryendtime))
      | where not(ipv4_is_private(DstIpAddr))
      | where not (ipv4_is_in_any_range(DstIpAddr, LocalNetworks))
      | project
          TimeGenerated
          , SrcIpAddr
          , SrcPortNumber
          , DstIpAddr
          , DstPortNumber
          , DstBytes
          , SrcBytes
      | sort by
          SrcIpAddr asc
          , TimeGenerated asc
          , DstIpAddr asc
          , DstPortNumber asc
      | serialize
      | extend
          nextTimeGenerated = next(TimeGenerated, 1)
          , nextSrcIpAddr = next(SrcIpAddr, 1)
      | extend
          TimeDeltainSeconds = datetime_diff('second', nextTimeGenerated, TimeGenerated)
      | where SrcIpAddr == nextSrcIpAddr
      //Whitelisting criteria/ threshold criteria
      | where TimeDeltainSeconds > TimeDeltaThreshold
      | project
          TimeGenerated
          , TimeDeltainSeconds
          , SrcIpAddr
          , SrcPortNumber
          , DstIpAddr
          , DstPortNumber
          , DstBytes
          , SrcBytes
      | summarize
          count()
          , sum(DstBytes)
          , sum(SrcBytes)
          , make_list(TimeDeltainSeconds)
          by TimeDeltainSeconds
              , bin(TimeGenerated, 1h)
              , SrcIpAddr
              , DstIpAddr
              , DstPortNumber
      | summarize
          (MostFrequentTimeDeltaCount, MostFrequentTimeDeltainSeconds) = arg_max(count_, TimeDeltainSeconds)
          , TotalEvents=sum(count_)
          , TotalSrcBytes = sum(sum_SrcBytes)
          , TotalDstBytes = sum(sum_DstBytes)
          by bin(TimeGenerated, 1h)
              , SrcIpAddr
              , DstIpAddr
              , DstPortNumber
      | where TotalEvents > TotalEventsThreshold
      | extend BeaconPercent = MostFrequentTimeDeltaCount/toreal(TotalEvents) * 100
      | where BeaconPercent > PercentBeaconThreshold
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Potential beaconing activity (ASIM Network Session schema)
      description: "This rule identifies beaconing patterns from Network traffic logs based on recurrent frequency patterns.\
        \ \nSuch potential outbound beaconing patterns to untrusted public networks should be investigated for any malware\
        \ callbacks or data exfiltration attempts as discussed in this [Blog](https://medium.com/@HuntOperator/detect-beaconing-with-flare-elastic-stack-and-intrusion-detection-systems-110dc74e0c56).\n\
        This analytic rule uses [ASIM](https://aka.ms/AboutASIM) and supports any built-in or custom source that supports\
        \ the ASIM NetworkSession schema'"
      severity: low
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
        - id: ip2
          addressColumn: DstIpAddr
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
        - technique: T1571
