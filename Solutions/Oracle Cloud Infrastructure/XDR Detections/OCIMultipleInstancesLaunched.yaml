properties:
  id: xdr-a79cf2b9-a511-4282-ba5d-812e14b07831
  displayName: OCI - Multiple instances launched
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5;

      OCILogs

      | where data_eventName_s =~ ''LaunchInstance''

      | summarize count() by SrcIpAddr, bin(TimeGenerated, 10m)

      | where count_ >= threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OCI - Multiple instances launched
      description: '''Detects when multiple instances were launched.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1496
