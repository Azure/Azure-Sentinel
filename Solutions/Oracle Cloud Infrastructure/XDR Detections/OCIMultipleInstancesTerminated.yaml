properties:
  id: xdr-252e651d-d825-480c-bdeb-8b239354577d
  displayName: OCI - Multiple instances terminated
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5;

      OCILogs

      | where data_eventName_s =~ ''TerminateInstance''

      | summarize count() by SrcIpAddr, bin(TimeGenerated, 10m)

      | where count_ >= threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
