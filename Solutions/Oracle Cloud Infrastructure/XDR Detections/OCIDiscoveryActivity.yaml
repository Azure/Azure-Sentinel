properties:
  id: xdr-61f995d7-8038-4ff0-ad2b-eccfd18fcc8c
  displayName: OCI - Discovery activity
  status: disabled
  queryCondition:
    queryText: 'let threshold = 20;

      OCILogs

      | where data_eventName_s startswith ''List'' or data_eventName_s startswith
      ''Get''

      | summarize count() by data_definedTags_Oracle_Tags_CreatedBy_s, bin(TimeGenerated,
      10m)

      | where count_ > threshold

      | extend AccountCustomEntity = data_definedTags_Oracle_Tags_CreatedBy_s'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OCI - Discovery activity
      description: '''Detects possible discovery activity.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1580
      customDetails:
        AccountName: AccountCustomEntity
