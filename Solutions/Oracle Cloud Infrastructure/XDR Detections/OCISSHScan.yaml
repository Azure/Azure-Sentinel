properties:
  id: xdr-e087d4fb-af0b-4e08-a067-b9ba9e5f8840
  displayName: OCI - SSH scanner
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5;

      OCILogs

      | where EventType contains ''vcn.flowlogs''

      | where data_action_s =~ ''REJECT''

      | where ipv4_is_private(DstIpAddr)

      | where ipv4_is_private(SrcIpAddr) == False

      | where DstPortNumber == 22

      | summarize p_count = dcount(DstIpAddr) by SrcIpAddr, bin(TimeGenerated, 5m)

      | where p_count > threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OCI - SSH scanner
      description: '''Detects possible SSH scanning activity.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Reconnaissance
        techniques:
        - technique: T1595
