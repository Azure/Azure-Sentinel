  displayName: Cisco SE - Connection to known C2 server
  status: disabled
  queryCondition:
    queryText: |-
      CiscoSecureEndpoint
      | where EventMessage has 'Suspected botnet connection'
      | extend HostCustomEntity = DstHostname, MalwareCustomEntity = ThreatName, IPCustomEntity = DstIpAddr
