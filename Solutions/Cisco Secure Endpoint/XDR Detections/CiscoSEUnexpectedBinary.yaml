properties:
  id: xdr-eabb9c20-7b0b-4a77-81e8-b06944f351c6
  displayName: Cisco SE - Unexpected binary file
  status: disabled
  queryCondition:
    queryText: |-
      CiscoSecureEndpoint
      | where isnotempty(SrcFileName)
      | where SrcFilePath contains @'AppData\Local\Temp' or SrcFilePath contains @'OUTLOOK_TEMP'
      | extend ext = extract(@"(.*\/)?(.*)", 2, tostring(SrcFilePath))
      | where ext contains 'dll' or ext contains @'ps1' or ext contains @'exe'
      | extend HostCustomEntity = DstHostname, IPCustomEntity = DstIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco SE - Unexpected binary file
      description: '''Detects binary files in uncommon locations.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
