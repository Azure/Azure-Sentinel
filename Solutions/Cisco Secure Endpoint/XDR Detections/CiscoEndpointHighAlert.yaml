properties:
  id: xdr-4683ebce-07ad-4089-89e3-39d8fe83c011
  displayName: Cisco SE High Events Last Hour
  status: disabled
  queryCondition:
    queryText: |-
      let endtime = 1h;
      CiscoSecureEndpoint_CL
      | where TimeGenerated >= ago(endtime)
      | where severity_s == "High"
      | project TimeGenerated, NetworkAddresses = parse_json(computer_network_addresses_s), computer_hostname_s, date_t, event_type_s, computer_links_trajectory_s
      | summarize CountInLastHour = count(), TimeGenerated = max(TimeGenerated) by computer_hostname_s, date_t, event_type_s, NetworkAddresses_ip = tostring(NetworkAddresses.ip), computer_links_trajectory_s
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco SE High Events Last Hour
      description: '''Find events from Cisco Secure Endpoint that are of High severity in the last hour.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: NetworkAddresses_ip
        hosts:
        - id: host1
          nameColumn: computer_hostname_s
        urls:
        - id: url1
          addressColumn: computer_links_trajectory_s
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1204
          subTechniques:
          - T1204.002
      - tactic: InitialAccess
        techniques:
        - technique: T1190
