id: 64fece0a-44db-4bab-844d-fd503dc0aaba
name: Cisco SE - Policy update failure
description: |
  'Detects policy updates failures.'
severity: Medium
requiredDataConnectors:
  - connectorId: CiscoSecureEndpointLogsCCPDefinition
    dataTypes:
      - CiscoSecureEndpointAuditLogsV2_CL
      - CiscoSecureEndpointEventsV2_CL
  - connectorId: CiscoSecureEndpoint
    dataTypes:
      - CiscoSecureEndpoint_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
status: Available
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562
query: |
  CiscoSecureEndpoint
  | where EventMessage =~ 'Policy Update Failure'
  | extend HostCustomEntity = DstHostname, IPCustomEntity = DstIpAddr
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.0
kind: Scheduled