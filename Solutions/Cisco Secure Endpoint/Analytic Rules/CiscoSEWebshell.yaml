id: d2c97cc9-1ccc-494d-bad4-564700451a2b
name: Cisco SE - Possible webshell
description: |
  'Detects possible webshell on host.'
severity: High
requiredDataConnectors:
  - connectorId: CiscoSecureEndpointLogsCCPDefinition
    dataTypes:
      - CiscoSecureEndpointAuditLogsV2_CL
      - CiscoSecureEndpointEventsV2_CL
  - connectorId: CiscoSecureEndpoint
    dataTypes:
      - CiscoSecureEndpoint_CL
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
status: Available
tactics:
  - CommandAndControl
relevantTechniques:
  - T1102
query: |
  CiscoSecureEndpoint
  | where EventMessage has 'Possible webshell'
  | extend HostCustomEntity = DstHostname, MalwareCustomEntity = ThreatName, IPCustomEntity = DstIpAddr
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostCustomEntity
  - entityType: Malware
    fieldMappings:
      - identifier: Name
        columnName: MalwareCustomEntity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.0
kind: Scheduled