properties:
  id: xdr-27cc2cdc-ba67-4906-a6ef-ecbc9c284f4e
  displayName: OracleDBAudit - Shutdown Server
  status: disabled
  queryCondition:
    queryText: 'OracleDatabaseAuditEvent

      | where isnotempty(SrcIpAddr)

      | where DbAction =~ ''SHUTDOWN''

      | project SrcIpAddr, DstUserName

      | extend AccountCustomEntity = DstUserName

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - Shutdown Server
      description: '''Detects when "SHUTDOWN" command was sent to server.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1529
      customDetails:
        AccountFullName: AccountCustomEntity
