properties:
  id: xdr-cca7b348-e904-4a7a-8f26-d22d4d477119
  displayName: OracleDBAudit - New user account
  status: disabled
  queryCondition:
    queryText: 'let lbtime_d = 14d;

      let lbtime_24h = 24h;

      let known_users = OracleDatabaseAuditEvent

      | where TimeGenerated between (ago(lbtime_d) .. ago(lbtime_24h))

      | where isnotempty(DstUserName)

      | where isnotempty(Action)

      | summarize makeset(DstUserName);

      OracleDatabaseAuditEvent

      | where isnotempty(DstUserName)

      | where isnotempty(Action)

      | where DstUserName !in (known_users)

      | project DstUserName, SrcIpAddr

      | extend AccountCustomEntity = DstUserName, IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT3H
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - New user account
      description: '''Detects when an action was made by new user.'''
      severity: low
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      - tactic: Persistence
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: AccountCustomEntity
