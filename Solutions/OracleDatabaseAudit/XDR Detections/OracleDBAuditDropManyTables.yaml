properties:
  id: xdr-b3aa0e5a-75a2-4613-80ec-93a1be3aeb8f
  displayName: OracleDBAudit - Multiple tables dropped in short time
  status: disabled
  queryCondition:
    queryText: 'let tbl_threshold = 10;

      OracleDatabaseAuditEvent

      | where isnotempty(DstUserName)

      | where DbAction =~ ''DROP''

      | extend TableName = replace(@''[,\(\)]'', '''', extract(@''(?i)SELECT(.*?)FROM\s(.*?)\s'',
      2, Action))

      | where isnotempty(TableName)

      | where TableName !~ ''SELECT''

      | summarize tbl_count = dcount(TableName) by DstUserName, SrcIpAddr

      | where tbl_count > tbl_threshold

      | extend AccountCustomEntity = DstUserName, IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT30M
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - Multiple tables dropped in short time
      description: '''Detects when user drops many tables in short period of time.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1485
      customDetails:
        AccountFullName: AccountCustomEntity
