properties:
  id: xdr-80b1dd6d-1aea-471e-be7a-a4a0afdeec80
  displayName: OracleDBAudit - Connection to database from unknown IP
  status: disabled
  queryCondition:
    queryText: 'let ip_allowlist = dynamic([''127.0.0.2'']);

      OracleDatabaseAuditEvent

      | where isnotempty(SrcIpAddr)

      | where DbAction =~ ''CONNECT''

      | where SrcIpAddr !in (ip_allowlist)

      | project SrcIpAddr, DstUserName

      | extend AccountCustomEntity = DstUserName

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - Connection to database from unknown IP
      description: '''Detects when user connects to a database from IP address which
        is not present in AllowList.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: AccountCustomEntity
