properties:
  id: xdr-ab352f0d-7c55-4ab2-a22e-b1c2d995e193
  displayName: OracleDBAudit - SQL injection patterns
  status: disabled
  queryCondition:
    queryText: 'OracleDatabaseAuditEvent

      | where isnotempty(DstUserName)

      | where Action has_any ("admin'' --" ,"admin'' #", "admin''/*", "0=1", "1=0",
      "1=1", "1=2", "'' or 1=1--", "'' or 1=1#", "'' or 1=1/*", "'') or ''1''=''1--",
      "'') or (''1''=''1--")

      | project SrcIpAddr, DstUserName, Action

      | extend AccountCustomEntity = DstUserName

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - SQL injection patterns
      description: '''Detects common known SQL injection patterns used in automated
        scripts.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      customDetails:
        AccountFullName: AccountCustomEntity
