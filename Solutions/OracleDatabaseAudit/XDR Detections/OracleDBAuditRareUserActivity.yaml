properties:
  id: xdr-5e93a535-036b-4570-9e58-d8992f30e1ae
  displayName: OracleDBAudit - User activity after long inactivity time
  status: disabled
  queryCondition:
    queryText: 'let lbtime_14d = 14d;

      let lbtime_7d = 7d;

      let lbtime_24h = 24h;

      let known_users_14d = OracleDatabaseAuditEvent

      | where TimeGenerated between (ago(lbtime_14d) .. ago(lbtime_7d))

      | where isnotempty(DstUserName)

      | where isnotempty(Action)

      | summarize makeset(DstUserName);

      let known_users_7d = OracleDatabaseAuditEvent

      | where TimeGenerated between (ago(lbtime_7d) .. ago(lbtime_24h))

      | where isnotempty(DstUserName)

      | where isnotempty(Action)

      | summarize makeset(DstUserName);

      OracleDatabaseAuditEvent

      | where isnotempty(DstUserName)

      | where isnotempty(Action)

      | where DstUserName !in (known_users_7d)

      | where DstUserName in (known_users_14d)

      | project DstUserName, SrcIpAddr

      | extend AccountCustomEntity = DstUserName, IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - User activity after long inactivity time
      description: '''Detects when an action was made by a user which last activity
        was observed more than 30 days ago.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      - tactic: Persistence
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: AccountCustomEntity
