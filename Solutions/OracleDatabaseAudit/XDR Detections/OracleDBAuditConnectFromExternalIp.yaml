properties:
  id: xdr-54aa2c17-acfd-4e3a-a1c4-99c88cf34ebe
  displayName: OracleDBAudit - Connection to database from external IP
  status: disabled
  queryCondition:
    queryText: 'OracleDatabaseAuditEvent

      | where isnotempty(SrcIpAddr)

      | where isnotempty(Action)

      | where DbAction =~ ''connect''

      | where ipv4_is_private(SrcIpAddr) == ''false''

      | extend AccountCustomEntity = DstUserName

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT30M
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - Connection to database from external IP
      description: '''Detects when connection to database is from external IP source.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
        - technique: T1078
      - tactic: Collection
        techniques:
        - technique: T1119
      - tactic: Exfiltration
        techniques:
        - technique: T1029
      customDetails:
        AccountFullName: AccountCustomEntity
