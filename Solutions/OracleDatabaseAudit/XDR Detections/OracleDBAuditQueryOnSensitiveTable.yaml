properties:
  id: xdr-d7fdcad5-ce96-4db6-9a5e-4a86a5166e5e
  displayName: OracleDBAudit - Query on Sensitive Table
  status: disabled
  queryCondition:
    queryText: 'let sensitive_tbls = dynamic([''table_name1'', ''table_name2'']);

      OracleDatabaseAuditEvent

      | where isnotempty(DstUserName)

      | where isnotempty(Action)

      | extend TableName = replace(@''[,\(\)]'', '''', extract(@''(?i)SELECT(.*?)FROM\s(.*?)\s'',
      2, Action))

      | where isnotempty(TableName)

      | where TableName in (sensitive_tbls)

      | project TableName, DstUserName, DbAction, SrcIpAddr

      | extend AccountCustomEntity = DstUserName, IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT30M
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - Query on Sensitive Table
      description: '''Detects when user queries sensitive tables.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1005
      customDetails:
        AccountFullName: AccountCustomEntity
