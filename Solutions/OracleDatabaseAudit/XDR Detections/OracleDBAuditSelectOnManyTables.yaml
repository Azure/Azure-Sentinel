properties:
  id: xdr-75024e1c-26e7-4e73-821d-95e5decdd8db
  displayName: OracleDBAudit - Unusual user activity on multiple tables
  status: disabled
  queryCondition:
    queryText: "// OracleDatabaseAuditEvent parser inlined: Defender XDR cannot resolve\
      \ Sentinel workspace functions.\nlet xdr_inline_OracleDatabaseAuditEvent = view\
      \ () {\nlet ActionMappingTable = datatable(ACTION:string ,ActionName:string)\
      \ [ 1, 'CREATE TABLE',\n                         2, 'INSERT',\n            \
      \             3, 'SELECT',\n                         4, 'CREATE CLUSTER',\n\
      \                         5, 'ALTER CLUSTER',\n                         6, 'UPDATE',\n\
      \                         7, 'DELETE',\n                         8, 'DROP CLUSTER',\n\
      \                         9, 'CREATE INDEX',\n                         10, 'DROP\
      \ INDEX',\n                         11, 'ALTER INDEX',\n                   \
      \      12, 'DROP TABLE',\n                         13, 'CREATE SEQUENCE',\n\
      \                         14, 'ALTER SEQUENCE',\n                         15,\
      \ 'ALTER TABLE',\n                         16, 'DROP SEQUENCE',\n          \
      \               17, 'GRANT OBJECT',\n                         18, 'REVOKE OBJECT',\n\
      \                         19, 'CREATE SYNONYM',\n                         20,\
      \ 'DROP SYNONYM',\n                         21, 'CREATE VIEW',\n           \
      \              22, 'DROP VIEW',\n                         23, 'VALIDATE INDEX',\n\
      \                         24, 'CREATE PROCEDURE',\n                        \
      \ 25, 'ALTER PROCEDURE',\n                         26, 'LOCK',\n           \
      \              27, 'NO-OP',\n                         28, 'RENAME',\n      \
      \                   29, 'COMMENT',\n                         30, 'AUDIT OBJECT',\n\
      \                         31, 'NOAUDIT OBJECT',\n                         32,\
      \ 'CREATE DATABASE LINK',\n                         33, 'DROP DATABASE LINK',\n\
      \                         34, 'CREATE DATABASE',\n                         35,\
      \ 'ALTER DATABASE',\n                         36, 'CREATE ROLLBACK SEG',\n \
      \                        37, 'ALTER ROLLBACK SEG',\n                       \
      \  38, 'DROP ROLLBACK SEG',\n                         39, 'CREATE TABLESPACE',\n\
      \                         40, 'ALTER TABLESPACE',\n                        \
      \ 41, 'DROP TABLESPACE',\n                         42, 'ALTER SESSION',\n  \
      \                       43, 'ALTER USER',\n                         44, 'COMMIT',\n\
      \                         45, 'ROLLBACK',\n                         46, 'SAVEPOINT',\n\
      \                         47, 'PL/SQL EXECUTE',\n                         48,\
      \ 'SET TRANSACTION',\n                         49, 'ALTER SYSTEM',\n       \
      \                  50, 'EXPLAIN',\n                         51, 'CREATE USER',\n\
      \                         52, 'CREATE ROLE',\n                         53, 'DROP\
      \ USER',\n                         54, 'DROP ROLE',\n                      \
      \   55, 'SET ROLE',\n                         56, 'CREATE SCHEMA',\n       \
      \                  57, 'CREATE CONTROL FILE',\n                         59,\
      \ 'CREATE TRIGGER',\n                         60, 'ALTER TRIGGER',\n       \
      \                  61, 'DROP TRIGGER',\n                         62, 'ANALYZE\
      \ TABLE',\n                         63, 'ANALYZE INDEX',\n                 \
      \        64, 'ANALYZE CLUSTER',\n                         65, 'CREATE PROFILE',\n\
      \                         66, 'DROP PROFILE',\n                         67,\
      \ 'ALTER PROFILE',\n                         68, 'DROP PROCEDURE',\n       \
      \                  70, 'ALTER RESOURCE COST',\n                         71,\
      \ 'CREATE MATERIALIZED VIEW LOG',\n                         72, 'ALTER MATERIALIZED\
      \ VIEW LOG',\n                         73, 'DROP MATERIALIZED VIEW LOG',\n \
      \                        74, 'CREATE MATERIALIZED VIEW',\n                 \
      \        75, 'ALTER MATERIALIZED VIEW',\n                         76, 'DROP\
      \ MATERIALIZED VIEW',\n                         77, 'CREATE TYPE',\n       \
      \                  78, 'DROP TYPE',\n                         79, 'ALTER ROLE',\n\
      \                         80, 'ALTER TYPE',\n                         81, 'CREATE\
      \ TYPE BODY',\n                         82, 'ALTER TYPE BODY',\n           \
      \              83, 'DROP TYPE BODY',\n                         84, 'DROP LIBRARY',\n\
      \                         85, 'TRUNCATE TABLE',\n                         86,\
      \ 'TRUNCATE CLUSTER',\n                         91, 'CREATE FUNCTION',\n   \
      \                      92, 'ALTER FUNCTION',\n                         93, 'DROP\
      \ FUNCTION',\n                         94, 'CREATE PACKAGE',\n             \
      \            95, 'ALTER PACKAGE',\n                         96, 'DROP PACKAGE',\n\
      \                         97, 'CREATE PACKAGE BODY',\n                     \
      \    98, 'ALTER PACKAGE BODY',\n                         99, 'DROP PACKAGE BODY',\n\
      \                         100, 'LOGON',\n                         101, 'LOGOFF',\n\
      \                         102, 'LOGOFF BY CLEANUP',\n                      \
      \   103, 'SESSION REC',\n                         104, 'SYSTEM AUDIT',\n   \
      \                      105, 'SYSTEM NOAUDIT',\n                         106,\
      \ 'AUDIT DEFAULT',\n                         107, 'NOAUDIT DEFAULT',\n     \
      \                    108, 'SYSTEM GRANT',\n                         109, 'SYSTEM\
      \ REVOKE',\n                         110, 'CREATE PUBLIC SYNONYM',\n       \
      \                  111, 'DROP PUBLIC SYNONYM',\n                         112,\
      \ 'CREATE PUBLIC DATABASE LINK',\n                         113, 'DROP PUBLIC\
      \ DATABASE LINK',\n                         114, 'GRANT ROLE',\n           \
      \              115, 'REVOKE ROLE',\n                         116, 'EXECUTE PROCEDURE',\n\
      \                         117, 'USER COMMENT',\n                         118,\
      \ 'ENABLE TRIGGER',\n                         119, 'DISABLE TRIGGER',\n    \
      \                     120, 'ENABLE ALL TRIGGERS',\n                        \
      \ 121, 'DISABLE ALL TRIGGERS',\n                         122, 'NETWORK ERROR',\n\
      \                         123, 'EXECUTE TYPE',\n                         128,\
      \ 'FLASHBACK',\n                         129, 'CREATE SESSION',\n          \
      \               157, 'CREATE DIRECTORY',\n                         158, 'DROP\
      \ DIRECTORY',\n                         159, 'CREATE LIBRARY',\n           \
      \              160, 'CREATE JAVA',\n                         161, 'ALTER JAVA',\n\
      \                         162, 'DROP JAVA',\n                         163, 'CREATE\
      \ OPERATOR',\n                         164, 'CREATE INDEXTYPE',\n          \
      \               165, 'DROP INDEXTYPE',\n                         167, 'DROP\
      \ OPERATOR',\n                         168, 'ASSOCIATE STATISTICS',\n      \
      \                   169, 'DISASSOCIATE STATISTICS',\n                      \
      \   170, 'CALL METHOD',\n                         171, 'CREATE SUMMARY',\n \
      \                        172, 'ALTER SUMMARY',\n                         173,\
      \ 'DROP SUMMARY',\n                         174, 'CREATE DIMENSION',\n     \
      \                    175, 'ALTER DIMENSION',\n                         176,\
      \ 'DROP DIMENSION',\n                         177, 'CREATE CONTEXT',\n     \
      \                    178, 'DROP CONTEXT',\n                         179, 'ALTER\
      \ OUTLINE',\n                         180, 'CREATE OUTLINE',\n             \
      \            181, 'DROP OUTLINE',\n                         182, 'UPDATE INDEXES',\n\
      \                         183, 'ALTER OPERATOR',\n                         197,\
      \ 'PURGE USER_RECYCLEBIN',\n                         198, 'PURGE DBA_RECYCLEBIN',\n\
      \                         199, 'PURGE TABLESAPCE',\n                       \
      \  200, 'PURGE TABLE',\n                         201, 'PURGE INDEX',\n     \
      \                    202, 'UNDROP OBJECT',\n                         204, 'FLASHBACK\
      \ DATABASE',\n                         205, 'FLASHBACK TABLE',\n           \
      \              206, 'CREATE RESTORE POINT',\n                         207, 'DROP\
      \ RESTORE POINT',\n                         208, 'PROXY AUTHENTICATION ONLY',\n\
      \                         209, 'DECLARE REWRITE EQUIVALENCE',\n            \
      \             210, 'ALTER REWRITE EQUIVALENCE',\n                         211,\
      \ 'DROP REWRITE EQUIVALENCE'];\nSyslog\n| where SyslogMessage contains \"Oracle\
      \ Unified Audit\"\n| extend MessageLength = strlen(SyslogMessage)\n\t   , Privilege\
      \ = column_ifexists(\"PRIVILEGE\",\"\")\n\t   , ClientTerminal = column_ifexists(\"\
      CLIENT TERMINAL\",\"\")\n\t   , Status = column_ifexists(\"STATUS\",\"\")\n\t\
      \   , Statement = column_ifexists(\"STATEMENT\",\"\")\n\t   , SrcDvcHostname\
      \ = column_ifexists(\"HostName\",\"\")\n\t   , SrcIpAddr = column_ifexists(\"\
      HostIP\",\"\")\n\t   , SrcPortNumber = column_ifexists(\"PORT\",\"\")\n| parse\
      \ SyslogMessage with * \"LENGTH: '\" LENGTH \"'\" *\n| parse-kv SyslogMessage\
      \ as (TYPE:string, DBID:string, SESID:string, CLIENTID:string, ENTRYID:int,\
      \ STMTID:int, DBUSER:string, CURUSER:string, ACTION:string, RETCODE:int, SCHEMA:string,\
      \ OBJNAME:string) with (pair_delimiter=' ', kv_delimiter=':', quote='\"')\n\
      | lookup ActionMappingTable on ACTION\n| extend DbAction = case(isnotempty(ActionName),\
      \ ActionName, \"UNKNOWN ACTION\")\n| extend EventVendor = 'Oracle'\n| extend\
      \ EventProduct = \"Oracle Audit\"\n|project-rename  DbAction = DbAction\n  \
      \              , DstUserName = DBUSER\n                , SrcUserName = CURUSER\n\
      \                , DbId = DBID\n                , SessionId = SESID\n      \
      \          , EntryId = ENTRYID\n                , ReturnCode = RETCODE\n   \
      \             , ObjName = OBJNAME\n                , Action = ACTION\n\t\t\t\
      \t,ActionLength = LENGTH\n| project TimeGenerated\n        , EventVendor\n \
      \       , EventProduct\n        , SeverityLevel\n        , MessageLength\n \
      \       , Action\n        , ActionLength\n        , DbAction\n        , DstUserName\n\
      \        , Privilege\n        , SrcUserName\n        , ClientTerminal\n    \
      \    , Status\n        , DbId\n        , SessionId\n        , EntryId\n    \
      \    , Statement\n        , SrcDvcHostname\n        , SrcIpAddr\n        , SrcPortNumber\n\
      \        , ReturnCode\n       // , ObjCreator\n        , ObjName\n\t\t, CLIENTID\n\
      \t\t, STMTID\n\t\t, SCHEMA\n        //, OsUserId\n};\nlet tbl_threshold = 10;\n\
      xdr_inline_OracleDatabaseAuditEvent\n| where isnotempty(DstUserName)\n| where\
      \ DbAction =~ 'SELECT'\n| extend TableName = replace(@'[,\\(\\)]', '', extract(@'(?i)SELECT(.*?)FROM\\\
      s(.*?)\\s', 2, Action))\n| where isnotempty(TableName)\n| where TableName !~\
      \ 'SELECT'\n| summarize tbl_count = dcount(TableName) by DstUserName, SrcIpAddr,\
      \ bucket = bin(TimeGenerated, 5m)\n| where tbl_count > tbl_threshold\n| extend\
      \ AccountCustomEntity = DstUserName, IPCustomEntity = SrcIpAddr"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - Unusual user activity on multiple tables
      description: '''Detects when user queries many tables in short period of time.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1119
      customDetails:
        AccountFullName: AccountCustomEntity
