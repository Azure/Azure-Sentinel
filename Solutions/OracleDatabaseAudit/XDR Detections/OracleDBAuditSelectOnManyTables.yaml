properties:
  id: xdr-75024e1c-26e7-4e73-821d-95e5decdd8db
  displayName: OracleDBAudit - Unusual user activity on multiple tables
  status: disabled
  queryCondition:
    queryText: 'let tbl_threshold = 10;

      OracleDatabaseAuditEvent

      | where isnotempty(DstUserName)

      | where DbAction =~ ''SELECT''

      | extend TableName = replace(@''[,\(\)]'', '''', extract(@''(?i)SELECT(.*?)FROM\s(.*?)\s'',
      2, Action))

      | where isnotempty(TableName)

      | where TableName !~ ''SELECT''

      | summarize tbl_count = dcount(TableName) by DstUserName, SrcIpAddr, bucket
      = bin(TimeGenerated, 5m)

      | where tbl_count > tbl_threshold

      | extend AccountCustomEntity = DstUserName, IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - Unusual user activity on multiple tables
      description: '''Detects when user queries many tables in short period of time.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Collection
        techniques:
        - technique: T1119
      customDetails:
        AccountFullName: AccountCustomEntity
