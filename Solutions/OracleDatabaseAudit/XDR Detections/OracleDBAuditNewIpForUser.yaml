properties:
  id: xdr-39a0995e-f4a9-4869-a0ae-36d6d9049bfd
  displayName: OracleDBAudit - User connected to database from new IP
  status: disabled
  queryCondition:
    queryText: "let lbtime_d = 14d;\nlet lbtime_24h = 24h;\nOracleDatabaseAuditEvent\n\
      | where TimeGenerated between (ago(lbtime_d) .. ago(lbtime_24h))\n| where isnotempty(SrcIpAddr)\n\
      | where isnotempty(DstUserName)\n| summarize knownIPs = make_set(SrcIpAddr)\
      \ by DstUserName\n| join (OracleDatabaseAuditEvent\n      | where isnotempty(SrcIpAddr)\n\
      \      | where isnotempty(DstUserName)\n      | where DbAction =~ 'connect'\n\
      \      ) on DstUserName\n| where knownIPs !contains SrcIpAddr\n| project DstUserName,\
      \ SrcIpAddr\n| extend AccountCustomEntity = DstUserName\n| extend IPCustomEntity\
      \ = SrcIpAddr"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: OracleDBAudit - User connected to database from new IP
      description: '''Detects when a user connects to database from new IP address.'''
      severity: low
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: AccountCustomEntity
