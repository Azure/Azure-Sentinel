properties:
  id: xdr-01f64465-b1ef-41ea-a7f5-31553a11ad43
  displayName: Network endpoint to host executable correlation
  status: disabled
  queryCondition:
    queryText: |-
      let endpointData =
      (union isfuzzy=true
      (SecurityEvent
        | where EventID == 4688
        | extend shortFileName = tolower(tostring(split(NewProcessName, '\\')[-1]))
        ),
        (WindowsEvent
        | where EventID == 4688
        | extend  NewProcessName = tostring(EventData.NewProcessName)
        | extend shortFileName = tolower(tostring(split(NewProcessName, '\\')[-1]))
        | extend TargetUserName = tostring(EventData.TargetUserName)
        ));
      // Correlate suspect executables seen in TrendMicro rule updates with similar activity on endpoints
      CommonSecurityLog
      | where DeviceVendor =~ "Trend Micro"
      | where Activity =~ "Deny List updated"
      | where RequestURL endswith ".exe"
      | project TimeGenerated, Activity , RequestURL , SourceIP, DestinationIP
      | extend suspectExeName = tolower(tostring(split(RequestURL, '/')[-1]))
      | join kind=innerunique (endpointData) on $left.suspectExeName == $right.shortFileName
      | extend HostName = tostring(split(Computer, '.', 0)[0]), DnsDomain = tostring(strcat_array(array_slice(split(Computer, '.'), 1, -1), '.'))
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Network endpoint to host executable correlation
      description: '''Correlates blocked URLs hosting [malicious] executables with host endpoint data to identify potential
        instances of executables of the same name having been recently run.'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: TargetUserName
          dnsDomainColumn: DnsDomain
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
        ips:
        - id: ip1
          addressColumn: DestinationIP
        urls:
        - id: url1
          addressColumn: RequestURL
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1204
