properties:
  id: xdr-2acc91c3-17c2-4388-938e-4eac2d5894e8
  displayName: SUPERNOVA webshell
  status: disabled
  queryCondition:
    queryText: |-
      W3CIISLog
      | where csMethod == 'GET'
      | where isnotempty(csUriStem) and isnotempty(csUriQuery)
      | where csUriStem contains "logoimagehandler.ashx"
      | where csUriQuery contains "codes" and csUriQuery contains "clazz" and csUriQuery contains "method" and csUriQuery contains "args"
      | extend timestamp = TimeGenerated
      | extend HostName = tostring(split(Computer, ".")[0]), DomainIndex = toint(indexof(Computer, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(Computer, DomainIndex + 1), Computer)
      | extend AccountName = tostring(split(csUserName, "@")[0]), AccountUPNSuffix = tostring(split(csUserName, "@")[1])
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: SUPERNOVA webshell
      description: |-
        'Identifies SUPERNOVA webshell based on W3CIISLog data.
         References:
         - https://unit42.paloaltonetworks.com/solarstorm-supernova/'
      severity: high
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
        ips:
        - id: ip1
          addressColumn: cIP
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1505
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        AccountFullName: csUserName
        HostFullName: Computer
