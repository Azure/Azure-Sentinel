properties:
  id: xdr-4e8032eb-f04d-4a30-85d3-b74bf2c8f204
  displayName: Imperva - Multiple user agents from same source
  status: disabled
  queryCondition:
    queryText: 'let threshold = 10;

      ImpervaWAFCloud

      | summarize d_uas = dcount(HttpUserAgentOriginal) by SrcIpAddr, bin(TimeGenerated,
      5m)

      | where d_uas >= threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Imperva - Multiple user agents from same source
      description: '''''Detects suspicious number of user agents from the same IP
        address.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
