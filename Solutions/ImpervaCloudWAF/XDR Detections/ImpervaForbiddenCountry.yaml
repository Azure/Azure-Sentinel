properties:
  id: xdr-58300723-22e0-4096-b33a-aa9b992c3564
  displayName: Imperva - Request from unexpected countries
  status: disabled
  queryCondition:
    queryText: 'let bl_country = dynamic([''CH'', ''KR'']);

      ImpervaWAFCloud

      | where Country in (bl_country)

      | where DvcAction !startswith ''REQ_BLOCKED'' or DvcAction !startswith ''REQ_BAD_''

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Imperva - Request from unexpected countries
      description: '''Detects request attempts from unexpected countries.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
