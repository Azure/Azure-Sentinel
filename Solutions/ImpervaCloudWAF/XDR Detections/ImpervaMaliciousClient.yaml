  displayName: Imperva - Malicious Client
  status: disabled
  queryCondition:
    queryText: 'ImpervaWAFCloud

      | where ClientApp in~ (''VulnerabilityScanner'', ''DDoSBot'', ''ClickBot'',''CommentSpamBot'',''HackingTool'',
      ''SpamBot'', ''Worm'')

      | where DvcAction !startswith ''REQ_BLOCKED'' or DvcAction !startswith ''REQ_BAD_''

      | extend IPCustomEntity = SrcIpAddr, UrlCustomEntity = QueryString'
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: Imperva - Malicious Client
      description: '''Detects connections from known malicious clients.'''
      severity: high
      entityMappings:
