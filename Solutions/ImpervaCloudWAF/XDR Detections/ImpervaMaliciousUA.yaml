properties:
  id: xdr-905794a9-bc46-42b9-974d-5a2dd58110c5
  displayName: Imperva - Malicious user agent
  status: disabled
  queryCondition:
    queryText: 'ImpervaWAFCloud

      | where HttpUserAgentOriginal has_any (''Nikto'', ''hydra'', ''advanced email
      extractor'', ''BFAC'', ''brutus'', ''cgichk'', ''cisco-torch'', ''scanner'',
      ''datacha0s'', ''dirbuster'', ''grabber'', ''havij'', ''internet ninja'', ''masscan'',
      ''morfeus'', ''mysqloit'', ''n-stealth'', ''nessus'', ''netsparker'', ''nmap
      nse'', ''nmap scripting engine'', ''nmap-nse'', ''nsauditor'', ''openvas'',
      ''pangolin'', ''qualys was'', ''security scan'', ''springenwerk'', ''sql power
      injector'', ''sqlmap'', ''sqlninja'', ''w3af.sf.net'', ''w3af.sourceforge.net'',
      ''w3af.org'', ''webbandit'', ''webinspect'', ''webvulnscan'', ''xmlrpc exploit'',
      ''WPScan'', ''XSpider'', ''Webster'', ''fantomCrew'', ''fantomBrowser'')

      | summarize count() by SrcIpAddr, bin(TimeGenerated, 5m)

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: Imperva - Malicious user agent
      description: '''Detects requests containing known malicious user agent strings.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
