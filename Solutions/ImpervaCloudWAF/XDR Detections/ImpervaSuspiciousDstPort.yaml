properties:
  id: xdr-0ba78922-033c-468c-82de-2974d7b1797d
  displayName: Imperva - Request to unexpected destination port
  status: disabled
  queryCondition:
    queryText: 'let bl_ports = dynamic([''22'', ''3389'']);

      ImpervaWAFCloud

      | where DvcAction !startswith ''REQ_BLOCKED'' or DvcAction !startswith ''REQ_BAD_''

      | where DstPortNumber in (bl_ports)

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: Imperva - Request to unexpected destination port
      description: '''Detects request attempts to unexpected destination ports.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
        - technique: T1133
