id: 5eec737b-2efd-4aa4-b2a7-3be10b62ddc2
name: Filewall - Original of a file Filewall sanitized seen on a device
description: |
  'Finds devices holding the original, unsanitized copy of a file that Filewall for Microsoft 365 sanitized, in inbound email or in SharePoint, OneDrive and Teams.
  Filewall removed active content from these files before delivering them, so a device with the original hash got the file another way: a direct download, a removable drive, another mail flow or a copy released from Filewall.
  Sanitizing is a policy action, not a malware verdict, so this is a hunting query rather than an alert. The sanitized hash is shown next to the original, and the report link opens the item in the Filewall console. Requires the Microsoft Defender XDR connector to stream DeviceFileEvents into the workspace.'
requiredDataConnectors:
  - connectorId: FilewallM365
    dataTypes:
      - FilewallExchange_CL
      - FilewallFile_CL
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceFileEvents
tactics:
  - Execution
relevantTechniques:
  - T1204.002
query: |
  let lookback = 14d;
  // only files whose content Filewall changed: the original and the sanitized hash differ.
  // The original hashes are matched by SHA1 (always set in DeviceFileEvents) or SHA256; the sanitized
  // copy Filewall delivered is never matched, so a hit is always the unsanitized original.
  let FilewallSanitized = materialize(union
      (FilewallM365EmailAttachmentEvent()
      | where TimeGenerated > ago(lookback)
      | where ThreatVerdict == "Sanitized" and EmailDirection != "Outbound"
      | project FilewallTime = TimeGenerated, OriginalSHA256 = OriginalFileSha256, OriginalSHA1 = OriginalFileSha1, SanitizedSHA256 = SanitizedFileSha256, SanitizedSHA1 = SanitizedFileSha1, FilewallFileName = AttachmentName, FilewallUser = EmailRecipientTo, FilewallSource = "exchange", Sender = EmailSenderFrom, EventReportUrl),
      (FilewallM365FileEvent()
      | where TimeGenerated > ago(lookback)
      | where ThreatVerdict == "Sanitized"
      | project FilewallTime = TimeGenerated, OriginalSHA256 = OriginalFileSha256, OriginalSHA1 = OriginalFileSha1, SanitizedSHA256 = SanitizedFileSha256, SanitizedSHA1 = SanitizedFileSha1, FilewallFileName = TargetFileName, FilewallUser = ActorUsername, FilewallSource = TargetFilePathType, Sender = "", EventReportUrl)
    | where (isnotempty(OriginalSHA256) and isnotempty(SanitizedSHA256) and OriginalSHA256 != SanitizedSHA256)
        or (isnotempty(OriginalSHA1) and isnotempty(SanitizedSHA1) and OriginalSHA1 != SanitizedSHA1)
    | summarize arg_min(FilewallTime, *) by OriginalSHA256, OriginalSHA1);
  let Sha256Set = FilewallSanitized | where isnotempty(OriginalSHA256) | distinct OriginalSHA256;
  let Sha1Set = FilewallSanitized | where isnotempty(OriginalSHA1) | distinct OriginalSHA1;
  let DeviceSeen = materialize(DeviceFileEvents
    | where TimeGenerated > ago(lookback)
    | extend SHA1 = tolower(SHA1), SHA256 = tolower(SHA256)
    | where SHA256 in (Sha256Set) or SHA1 in (Sha1Set)
    | project TimeGenerated, DeviceId, DeviceName, ActionType, FileName, FolderPath, SHA1, SHA256, InitiatingProcessFileName, InitiatingProcessAccountUpn);
  union
      (DeviceSeen | where isnotempty(SHA256) | join kind=inner (FilewallSanitized | where isnotempty(OriginalSHA256)) on $left.SHA256 == $right.OriginalSHA256),
      (DeviceSeen | where isnotempty(SHA1) | join kind=inner (FilewallSanitized | where isnotempty(OriginalSHA1)) on $left.SHA1 == $right.OriginalSHA1)
  | where TimeGenerated > FilewallTime
  | summarize FirstSeenOnDevice = min(TimeGenerated), LastSeenOnDevice = max(TimeGenerated), DeviceActions = make_set(ActionType), arg_min(TimeGenerated, DeviceName, FileName, FolderPath, InitiatingProcessFileName, InitiatingProcessAccountUpn, FilewallTime, FilewallFileName, FilewallUser, FilewallSource, Sender, SanitizedSHA256, EventReportUrl) by OriginalSHA256, OriginalSHA1, DeviceId
  | extend
      DeviceAccountName = tostring(split(InitiatingProcessAccountUpn, "@")[0]),
      DeviceAccountUPNSuffix = tostring(split(InitiatingProcessAccountUpn, "@")[1]),
      FileDirectory = iff(FolderPath endswith FileName, substring(FolderPath, 0, strlen(FolderPath) - strlen(FileName) - 1), FolderPath),
      SHA256 = OriginalSHA256,
      SHA1 = OriginalSHA1,
      Sha256Algorithm = iff(isnotempty(OriginalSHA256), "SHA256", ""),
      Sha1Algorithm = iff(isnotempty(OriginalSHA1), "SHA1", "")
  | project FirstSeenOnDevice, LastSeenOnDevice, DeviceId, DeviceName, DeviceActions, FileName, FileDirectory, SHA256, Sha256Algorithm, SHA1, Sha1Algorithm, SanitizedSHA256, InitiatingProcessFileName, DeviceAccountName, DeviceAccountUPNSuffix, FilewallTime, FilewallFileName, FilewallUser, FilewallSource, Sender, EventReportUrl
  | order by FirstSeenOnDevice desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: DeviceAccountName
      - identifier: UPNSuffix
        columnName: DeviceAccountUPNSuffix
  - entityType: File
    fieldMappings:
      - identifier: Name
        columnName: FileName
      - identifier: Directory
        columnName: FileDirectory
  - entityType: FileHash
    fieldMappings:
      - identifier: Algorithm
        columnName: Sha256Algorithm
      - identifier: Value
        columnName: SHA256
  - entityType: FileHash
    fieldMappings:
      - identifier: Algorithm
        columnName: Sha1Algorithm
      - identifier: Value
        columnName: SHA1
version: 1.0.0
