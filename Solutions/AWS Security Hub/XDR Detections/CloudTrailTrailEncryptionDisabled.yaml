properties:
  id: xdr-9c2f6c3b-7fd8-4c5a-9d9d-3c4f9e6a7b21
  displayName: AWS Security Hub - Detect CloudTrail trails lacking KMS encryption
  status: disabled
  queryCondition:
    queryText: |-
      AWSSecurityHubFindings
      | where RecordState == "ACTIVE" and ComplianceStatus == "FAILED"
      | where tostring(AwsSecurityFindingGeneratorId) == "security-control/CloudTrail.2"
        or tostring(ComplianceSecurityControlId) == "CloudTrail.2"
      | mv-expand Resource = Resources
      | where tostring(Resource.Type) == "AwsCloudTrailTrail"
      | extend TrailId = tostring(Resource.Id)
      | summarize TimeGenerated = max(TimeGenerated)
          by AwsAccountId, AwsRegion, AwsSecurityFindingTitle, AwsSecurityFindingDescription,
             AwsSecurityFindingId, ComplianceSecurityControlId, TrailId
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: AWS Security Hub - Detect CloudTrail trails lacking KMS encryption
      description: "This query detects AWS CloudTrail trails that are not configured to use server-side encryption with a\
        \ customer managed KMS key using AWS Security Hub control CloudTrail.2 findings. \nUnencrypted CloudTrail logs increase\
        \ the risk of unauthorized access to sensitive audit data at rest."
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AwsAccountId
        cloudApplications:
        - id: cloudApplication1
          nameColumn: TrailId
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1565
          subTechniques:
          - T1565.001
      customDetails:
        ComplianceControlId: ComplianceSecurityControlId
        Region: AwsRegion
        FindingId: AwsSecurityFindingId
        AccountName: AwsAccountId
