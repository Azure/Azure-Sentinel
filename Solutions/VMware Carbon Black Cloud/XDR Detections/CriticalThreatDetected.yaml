properties:
  id: xdr-2ca4e7fc-c61a-49e5-9736-5da8035c47e0
  displayName: Critical Threat Detected
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 8;
      CarbonBlackNotifications_CL
      | where column_ifexists('threatHunterInfo_score_d', real(null)) >= threshold
      | extend eventTime = datetime(1970-01-01) + tolong(column_ifexists('threatHunterInfo_time_d', real(null))/1000) * 1sec
      | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), count() by eventTime, Threat_Name = column_ifexists('threatHunterInfo_reportName_s', ''), Device_Name = column_ifexists('deviceInfo_deviceName_s', ''), Internal_IP = column_ifexists('deviceInfo_internalIpAddress_s', ''), External_IP = column_ifexists('deviceInfo_externalIpAddress_s', ''), Threat_Score = column_ifexists('threatHunterInfo_score_d', real(null))
      | project-away count_
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Critical Threat Detected
      description: '''This creates an incident in the event a critical threat was identified on a Carbon Black managed endpoint.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: Device_Name
        ips:
        - id: ip1
          addressColumn: Internal_IP
      tactics:
      - tactic: LateralMovement
        techniques:
        - technique: T1210
