properties:
  id: xdr-46b6c6fc-2c1a-4270-be10-9d444d83f027
  displayName: Cisco WSA - Multiple attempts to download unwanted file
  status: disabled
  queryCondition:
    queryText: 'let threshold = 2;

      CiscoWSAEvent

      | where DvcAction =~ ''BLOCK_ADMIN_FILE_TYPE''

      | summarize i_src = makeset(SrcIpAddr) by UrlOriginal, bin(TimeGenerated, 15m)

      | where array_length(i_src) >= threshold

      | extend IPCustomEntity = i_src, UrlCustomEntity = UrlOriginal'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco WSA - Multiple attempts to download unwanted file
      description: '''Detects when multiple attempts to download unwanted file occur.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
        urls:
        - id: url1
          addressColumn: UrlCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1189
