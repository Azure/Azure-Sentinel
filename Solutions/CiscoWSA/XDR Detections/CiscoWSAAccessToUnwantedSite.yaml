properties:
  id: xdr-38029e86-030c-46c4-8a91-a2be7c74d74c
  displayName: Cisco WSA - Access to unwanted site
  status: disabled
  queryCondition:
    queryText: 'let risky_sites = dynamic([''IW_adlt'', ''IW_hack'', ''IW_porn'']);

      CiscoWSAEvent

      | where UrlCategory in~ (risky_sites)

      | where DvcAction =~ ''DEFAULT_CASE''

      | extend AccountCustomEntity = SrcUserName'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco WSA - Access to unwanted site
      description: '''Detects when users attempting to access sites from high risk
        category.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
      customDetails:
        AccountName: AccountCustomEntity
