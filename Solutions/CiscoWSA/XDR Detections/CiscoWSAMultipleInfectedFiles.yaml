properties:
  id: xdr-93186e3d-5dc2-4a00-a993-fa1448db8734
  displayName: Cisco WSA - Multiple infected files
  status: disabled
  queryCondition:
    queryText: 'CiscoWSAEvent

      | where isnotempty(AmpFileName)

      | where isnotempty(ThreatName)

      | summarize count() by SrcIpAddr, SrcUserName, bin(TimeGenerated, 15m)

      | where count_ > 1

      | extend IPCustomEntity = SrcIpAddr, AccountCustomEntity = SrcUserName'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco WSA - Multiple infected files
      description: '''Detects multiple infected files on same source.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1189
      customDetails:
        AccountName: AccountCustomEntity
