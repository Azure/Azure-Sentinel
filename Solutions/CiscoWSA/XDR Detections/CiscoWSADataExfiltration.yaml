properties:
  id: xdr-32c460ad-2d40-43e9-8ead-5cdd1d7a3163
  displayName: Cisco WSA - Unexpected uploads
  status: disabled
  queryCondition:
    queryText: 'let f_cnt_upload_threshold = 5;

      let f_upload_size_threshold = 5000000;

      CiscoWSAEvent

      | where HttpRequestMethod in~ (''POST'', ''PUT'')

      | where isnotempty(AmpFileName)

      | where UrlCategory in~ (''IW_fts'', ''IW_osb'')

      | where DstBytes > f_upload_size_threshold

      | summarize count() by AmpFileName, SrcUserName, bin(TimeGenerated, 10m)

      | where count_ >= f_cnt_upload_threshold

      | extend AccountCustomEntity = SrcUserName'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco WSA - Unexpected uploads
      description: '''Detects unexpected file uploads.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1567
      customDetails:
        AccountName: AccountCustomEntity
