properties:
  id: xdr-1db49647-435c-41ad-bf8c-7130ba75429d
  displayName: Cisco WSA - Multiple errors to URL
  status: disabled
  queryCondition:
    queryText: 'let threshold = 5;

      CiscoWSAEvent

      | where DvcAction =~ ''NONE''

      | summarize count() by SrcUserName, UrlOriginal, bin(TimeGenerated, 5m)

      | where count_ >= threshold

      | extend URLCustomEntity = UrlOriginal, AccountCustomEntity = SrcUserName'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco WSA - Multiple errors to URL
      description: '''Detects multiple connection errors to URL.'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: URLCustomEntity
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1102
      customDetails:
        AccountName: AccountCustomEntity
