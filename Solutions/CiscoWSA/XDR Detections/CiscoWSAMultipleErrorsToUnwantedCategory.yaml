properties:
  id: xdr-ebf9db0c-ba7b-4249-b9ec-50a05fa7c7c9
  displayName: Cisco WSA - Multiple errors to resource from risky category
  status: disabled
  queryCondition:
    queryText: 'let threshold = 10;

      let risky_sites = dynamic([''IW_adlt'', ''IW_hack'', ''IW_porn'']);

      CiscoWSAEvent

      | where DvcAction startswith ''BLOCK_''

      | where UrlCategory in~ (risky_sites)

      | summarize count() by SrcUserName, UrlOriginal, bin(TimeGenerated, 5m)

      | where count_ >= threshold

      | extend URLCustomEntity = UrlOriginal, AccountCustomEntity = SrcUserName'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Cisco WSA - Multiple errors to resource from risky category
      description: '''Detects multiple connection errors to resource from risky category.'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: URLCustomEntity
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1189
      - tactic: CommandAndControl
        techniques:
        - technique: T1102
      customDetails:
        AccountName: AccountCustomEntity
