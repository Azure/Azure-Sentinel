properties:
  id: xdr-432996e9-8a93-4407-985f-13707b318a0b
  displayName: TI Map File Hash to CommonSecurityLog Event
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet fileHashIndicators\
      \ = ThreatIntelIndicators\n//extract key part of kv pair\n| extend IndicatorType\
      \ = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\",\
      \ 0)))\n| where IndicatorType == \"file\"\n| extend FileHashType = replace(\"\
      '\", \"\", substring(ObservableKey, indexof(ObservableKey, \"hashes.\") + 7,\
      \ strlen(ObservableKey) - indexof(ObservableKey, \"hashes.\") - 7))\n| extend\
      \ FileHashValue = toupper(ObservableValue)\n| extend IndicatorId = tostring(split(Id,\
      \ \"--\")[2])\n| extend Url = iff(ObservableKey == \"url:value\", ObservableValue,\
      \ \"\")\n| where TimeGenerated >= ago(ioc_lookBack)\n| summarize LatestIndicatorTime\
      \ = arg_max(TimeGenerated, *) by Id, ObservableValue\n| where IsActive and (ValidUntil\
      \ > now() or isempty(ValidUntil));\n// Handle matches against both lower case\
      \ and uppercase versions of the hash:\n(fileHashIndicators | extend  FileHashValue\
      \ = tolower(FileHashValue)\n| union (fileHashIndicators | extend FileHashValue\
      \ = toupper(FileHashValue)))\n| project-reorder *, FileHashType, FileHashValue,\
      \ Type\n// using innerunique to keep perf fast and result set low, we only need\
      \ one match to indicate potential malicious activity that needs to be investigated\n\
      |  join kind=innerunique (\n  CommonSecurityLog | where TimeGenerated >= ago(dt_lookBack)\n\
      \  | extend CommonSecurityLog_TimeGenerated = TimeGenerated\n  )\non $left.FileHashValue\
      \ == $right.FileHash\n| where CommonSecurityLog_TimeGenerated < ValidUntil\n\
      | summarize CommonSecurityLog_TimeGenerated = arg_max(CommonSecurityLog_TimeGenerated,\
      \ *) by IndicatorId, FileHashValue\n| extend Description = tostring(parse_json(Data).description)\n\
      | extend ActivityGroupNames = extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      | extend Description = tostring(parse_json(Data).description)\n| extend ActivityGroupNames\
      \ = extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      | project CommonSecurityLog_TimeGenerated, Description, ActivityGroupNames,\
      \ Id, ValidUntil, Confidence,\nSourceIP, SourcePort, DestinationIP, DestinationPort,\
      \ SourceUserID, SourceUserName, DeviceName, DeviceAction,\nRequestURL, DestinationUserName,\
      \ DestinationUserID, ApplicationProtocol, Activity, FileHashValue, FileHashType,\
      \ Url\n| extend HostName = tostring(split(DeviceName, '.', 0)[0]), DnsDomain\
      \ = tostring(strcat_array(array_slice(split(DeviceName, '.'), 1, -1), '.'))\n\
      | extend Name = tostring(split(SourceUserName, '@', 0)[0]), UPNSuffix = tostring(split(SourceUserName,\
      \ '@', 1)[0])\n| extend timestamp = CommonSecurityLog_TimeGenerated"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map File Hash to CommonSecurityLog Event
      description: '''Identifies a match in CommonSecurityLog Event data from any
        FileHash IOC from TI'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
        ips:
        - id: ip1
          addressColumn: SourceIP
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        AccountFullName: SourceUserName
        HostFullName: DeviceName
        FileHashValue: FileHashValue
        FileHashAlgorithm: FileHashType
