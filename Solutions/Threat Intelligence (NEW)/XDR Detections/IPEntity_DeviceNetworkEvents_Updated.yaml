properties:
  id: xdr-2474343c-9135-42ec-9c40-a1bace43da5c
  displayName: TI Map IP Entity to DeviceNetworkEvents
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet DeviceNetworkEvents_\
      \ = DeviceNetworkEvents\n| where isnotempty(RemoteIP)\n| where TimeGenerated\
      \ > ago(dt_lookBack)\n| where ActionType !has \"ConnectionFailed\"\n| extend\
      \ isPrivate = ipv4_is_private(RemoteIP)\n| where isPrivate != true;\nlet IPs\
      \ = DeviceNetworkEvents_ | distinct RemoteIP | summarize make_list(RemoteIP);\n\
      ThreatIntelIndicators\n//extract key part of kv pair\n     | extend IndicatorType\
      \ = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\",\
      \ 0)))\n     | where IndicatorType in (\"ipv4-addr\", \"ipv6-addr\", \"network-traffic\"\
      )\n     | extend NetworkSourceIP = toupper(ObservableValue)\n     | extend TrafficLightProtocolLevel\
      \ = tostring(parse_json(AdditionalFields).TLPLevel)\n| where TimeGenerated >=\
      \ ago(ioc_lookBack)\n| extend TI_ipEntity = NetworkSourceIP\n| where TI_ipEntity\
      \ in (IPs)\n| summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id,\
      \ ObservableValue\n| where IsActive and (ValidUntil > now() or isempty(ValidUntil))\n\
      | extend Description = tostring(parse_json(Data).description)\n| where Description\
      \ !contains_cs \"State: inactive;\" and Description !contains_cs \"State: falsepos;\"\
      \n| join kind=innerunique (DeviceNetworkEvents_) on $left.TI_ipEntity == $right.RemoteIP\n\
      | summarize TimeGenerated = arg_max(TimeGenerated, *) by Id, TI_ipEntity, DeviceName\n\
      | extend timestamp = TimeGenerated, Name = tostring(split(InitiatingProcessAccountUpn,\
      \ '@', 0)[0]), UPNSuffix = tostring(split(InitiatingProcessAccountUpn, '@',\
      \ 1)[0])\n| project-reorder *, Tags, TrafficLightProtocolLevel, NetworkSourceIP,\
      \ Type, TI_ipEntity"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map IP Entity to DeviceNetworkEvents
      description: '''Identifies a match in DeviceNetworkEvents Event data from any
        IP Indicator from TI.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: TI_ipEntity
        hosts:
        - id: host1
          nameColumn: DeviceName
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        URLUrl: RemoteUrl
