properties:
  id: xdr-ad4fa1f2-2189-459c-9458-f77d2039d2f5
  displayName: TI Map URL Entity to UrlClickEvents
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet UrlClickEvents_\
      \ = materialize(UrlClickEvents\n    | where TimeGenerated >= ago(dt_lookBack)\n\
      \    | extend UrlClickEvents_TimeGenerated = TimeGenerated);\nlet ChainReportID\
      \ = UrlClickEvents_\n    | mv-expand todynamic(UrlChain)\n    | extend UrlChain\
      \ = tolower(UrlChain)\n    | project ReportId, Url, UrlChain;\n// Url is not\
      \ always in UrlChain, so we need to check both\nlet ClickedUrls =\n  (union\
      \ isfuzzy=false (ChainReportID), (ChainReportID | project Url = UrlChain))\n\
      \  | distinct Url\n  | summarize make_list(Url);\nlet TI = materialize(ThreatIntelIndicators\n\
      //extract key part of kv pair\n| extend IndicatorType = replace(@\"\\[|\\]|\\\
      \"\"\", \"\", tostring(split(ObservableKey, \":\", 0)))\n| where IndicatorType\
      \ == \"url\"\n| extend Url = ObservableValue\n  | extend TrafficLightProtocolLevel\
      \ = tostring(parse_json(AdditionalFields).TLPLevel)\n  | where TimeGenerated\
      \ >= ago(ioc_lookBack)\n  | where tolower(Url) in (ClickedUrls)\n  | summarize\
      \ LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue\n \
      \ | where IsActive and (ValidUntil > now() or isempty(ValidUntil))\n  | project-rename\
      \ TI_Url = Url, TI_Type = Type\n  );\n(union isfuzzy=false (TI | join kind=innerunique\
      \ (ChainReportID) on $left.TI_Url == $right.UrlChain),\n  (TI | join kind=innerunique\
      \ (ChainReportID) on $left.TI_Url == $right.Url))\n| project-away UrlChain\n\
      | join kind=innerunique (UrlClickEvents_) on ReportId\n| where UrlClickEvents_TimeGenerated\
      \ < ValidUntil\n| summarize UrlClickEvents_TimeGenerated = arg_max(UrlClickEvents_TimeGenerated,\
      \ *) by Id\n| extend Description = tostring(parse_json(Data).description)\n\
      | extend ActivityGroupNames = extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      | project UrlClickEvents_TimeGenerated, AccountUpn, Description, ActivityGroupNames,\
      \ Id, Type, ValidUntil, Confidence, Url, NetworkMessageId\n| extend timestamp\
      \ = UrlClickEvents_TimeGenerated\n| extend timestamp = UrlClickEvents_TimeGenerated,\
      \ Name = tostring(split(AccountUpn, '@', 0)), UPNSuffix = tostring(split(AccountUpn,\
      \ '@', 1))"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map URL Entity to UrlClickEvents
      description: '''This query identifies any URL indicators of compromise (IOCs)
        from threat intelligence (TI) by searching for matches in UrlClickEvents.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
