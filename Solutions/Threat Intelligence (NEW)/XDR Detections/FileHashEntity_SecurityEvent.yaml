properties:
  id: xdr-9f7dc779-1e51-4925-ae4a-db1db933077f
  displayName: TI Map File Hash to Security Event
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nThreatIntelIndicators\n\
      //extract key part of kv pair\n      | extend IndicatorType = replace(@\"\\\
      [|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\", 0)))\n      | where\
      \ IndicatorType == \"file\"\n      | extend FileHashType = replace(\"'\", \"\
      \", substring(ObservableKey, indexof(ObservableKey, \"hashes.\") + 7, strlen(ObservableKey)\
      \ - indexof(ObservableKey, \"hashes.\") - 7))\n      | extend FileHashValue\
      \ = toupper(ObservableValue)\n| where TimeGenerated >= ago(ioc_lookBack)\n|\
      \ extend FileHashValue = toupper(FileHashValue)\n| extend IndicatorId = tostring(split(Id,\
      \ \"--\")[2])\n| extend Url = iff(ObservableKey == \"url:value\", ObservableValue,\
      \ \"\")\n| summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id,\
      \ ObservableValue\n| where IsActive and (ValidUntil > now() or isempty(ValidUntil))\n\
      \  | project-reorder *, FileHashType, FileHashValue, Type\n// using innerunique\
      \ to keep perf fast and result set low, we only need one match to indicate potential\
      \ malicious activity that needs to be investigated\n| join kind=innerunique\
      \ ( union isfuzzy=true\n  (SecurityEvent | where TimeGenerated >= ago(dt_lookBack)\n\
      \      | where EventID in (\"8003\",\"8002\",\"8005\")\n      | extend SecurityEvent_TimeGenerated\
      \ = TimeGenerated, Event = EventID, FileHash = toupper(FileHash)\n  ),\n  (WindowsEvent\
      \ | where TimeGenerated >= ago(dt_lookBack)\n      | where EventID in (\"8003\"\
      ,\"8002\",\"8005\")\n      | extend SecurityEvent_TimeGenerated = TimeGenerated,\
      \ Event = EventID, FileHash = toupper(EventData.FileHash)\n  )\n)\non $left.FileHashValue\
      \ == $right.FileHash\n| where SecurityEvent_TimeGenerated < ValidUntil\n| extend\
      \ Description = tostring(parse_json(Data).description)\n| extend ActivityGroupNames\
      \ = extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      | summarize SecurityEvent_TimeGenerated = arg_max(SecurityEvent_TimeGenerated,\
      \ *) by IndicatorId, FileHash\n| project SecurityEvent_TimeGenerated, Description,\
      \ ActivityGroupNames, IndicatorId, ValidUntil, Confidence,\nProcess, FileHash,\
      \ Computer, Account, Event, FileHashValue, FileHashType, Url\n| extend NTDomain\
      \ = tostring(split(Account, '\\\\', 0)[0]), Name = tostring(split(Account, '\\\
      \\', 1)[0])\n| extend HostName = tostring(split(Computer, '.', 0)[0]), DnsDomain\
      \ = tostring(strcat_array(array_slice(split(Computer, '.'), 1, -1), '.'))\n\
      | extend timestamp = SecurityEvent_TimeGenerated"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map File Hash to Security Event
      description: '''Identifies a match in Security Event data from any File Hash
        IOC from TI'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          ntDomainColumn: NTDomain
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        AccountFullName: Account
        HostFullName: Computer
        FileHashValue: FileHashValue
        FileHashAlgorithm: FileHashType
