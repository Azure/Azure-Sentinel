properties:
  id: xdr-6418fd33-92f2-407b-bd61-91c0d4bbcb8a
  displayName: TI Map IP Entity to DnsEvents
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h; // Look back 1 hour for DNS events\nlet ioc_lookBack\
      \ = 14d; // Look back 14 days for threat intelligence indicators\n// Fetch threat\
      \ intelligence indicators related to IP addresses\nlet IP_Indicators = ThreatIntelIndicators\n\
      //extract key part of kv pair\n| extend IndicatorType = replace(@\"\\[|\\]|\\\
      \"\"\", \"\", tostring(split(ObservableKey, \":\", 0)))\n     | where IndicatorType\
      \ in (\"ipv4-addr\", \"ipv6-addr\", \"network-traffic\")\n     | extend NetworkSourceIP\
      \ = toupper(ObservableValue)\n     | extend TrafficLightProtocolLevel = tostring(parse_json(AdditionalFields).TLPLevel)\n\
      \  | where TimeGenerated >= ago(ioc_lookBack)\n  | extend TI_ipEntity = iff(isnotempty(NetworkSourceIP),\
      \ NetworkSourceIP, NetworkSourceIP)\n  | extend TI_ipEntity = iff(isempty(TI_ipEntity)\
      \ and isnotempty(NetworkSourceIP), NetworkSourceIP, TI_ipEntity)\n  | extend\
      \ Url = iff(ObservableKey == \"url:value\", ObservableValue, \"\")\n  | where\
      \ ipv4_is_private(TI_ipEntity) == false and  TI_ipEntity !startswith \"fe80\"\
      \ and TI_ipEntity !startswith \"::\" and TI_ipEntity !startswith \"127.\"\n\
      \  | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue\n\
      \  | where IsActive and (ValidUntil > now() or isempty(ValidUntil));\n// Perform\
      \ a join between IP indicators and DNS events\nIP_Indicators\n   | project-reorder\
      \ *, Tags, TrafficLightProtocolLevel, NetworkSourceIP, Type, TI_ipEntity\n \
      \ // Use innerunique to keep performance fast and result set low, as we only\
      \ need one match to indicate potential malicious activity that needs investigation\n\
      \  | join kind=innerunique (\n      DnsEvents\n      | where TimeGenerated >=\
      \ ago(dt_lookBack)\n      | where SubType =~ \"LookupQuery\" and isnotempty(IPAddresses)\n\
      \      | mv-expand SingleIP = split(IPAddresses, \", \") to typeof(string)\n\
      \      | extend DNS_TimeGenerated = TimeGenerated\n  )\n  on $left.TI_ipEntity\
      \ == $right.SingleIP\n  // Filter out DNS events that occurred after the expiration\
      \ of the corresponding indicator\n  | where DNS_TimeGenerated < ValidUntil\n\
      \  // Group the results by IndicatorId and SingleIP, and keep the DNS event\
      \ with the latest timestamp\n  | summarize DNS_TimeGenerated = arg_max(DNS_TimeGenerated,\
      \ *) by Id, SingleIP\n  // Select the desired output fields\n  | extend Description\
      \ = tostring(parse_json(Data).description)\n  | extend ActivityGroupNames =\
      \ extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      \  | project DNS_TimeGenerated, Description, ActivityGroupNames, Id, ValidUntil,\
      \ Confidence, TI_ipEntity, Computer, EventId, SubType, ClientIP, Name, IPAddresses,\
      \ NetworkSourceIP, Type, Url\n  | extend timestamp = DNS_TimeGenerated, HostName\
      \ = tostring(split(Computer, '.', 0)[0]), DnsDomain = tostring(strcat_array(array_slice(split(Computer,\
      \ '.'), 1, -1), '.'))"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map IP Entity to DnsEvents
      description: This query maps any IP indicators of compromise (IOCs) from threat
        intelligence (TI), by searching for matches in DnsEvents.
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
        ips:
        - id: ip1
          addressColumn: ClientIP
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        HostFullName: Computer
