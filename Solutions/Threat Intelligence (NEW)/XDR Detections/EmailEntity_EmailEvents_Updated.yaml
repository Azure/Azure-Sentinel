properties:
  id: xdr-18b61c3f-55fa-4eb9-8721-72dabd1eb3cb
  displayName: TI Map Email entity to EmailEvents
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet EmailEvents_ =\
      \ materialize(EmailEvents | where isnotempty(RecipientEmailAddress) and isnotempty(SenderFromAddress)\
      \ and TimeGenerated >= ago(dt_lookBack) and DeliveryAction !has \"Blocked\"\
      \ | project-rename  EmailEvents_TimeGenerated = TimeGenerated | extend SenderFromAddress\
      \ = tolower(SenderFromAddress) | extend RecipientEmailAddress = tolower(RecipientEmailAddress));\n\
      let SenderAddresses = EmailEvents_ | distinct  SenderFromAddress | summarize\
      \ make_list(SenderFromAddress);\nlet RecipientAddresses = EmailEvents_ | distinct\
      \  RecipientEmailAddress | summarize make_list(RecipientEmailAddress);\nlet\
      \ TI = materialize(ThreatIntelIndicators\n| where TimeGenerated >= ago(ioc_lookBack)\n\
      | extend IndicatorType = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey,\
      \ \":\", 0)))\n| where IndicatorType == \"email-addr\"\n| extend EmailSenderAddress\
      \ = ObservableValue\n| extend EmailSourceDomain = substring(EmailSenderAddress,\
      \ indexof(EmailSenderAddress, \"@\") + 1, strlen(EmailSenderAddress) - indexof(EmailSenderAddress,\
      \ \"@\") - 1)\n| extend TrafficLightProtocolLevel = tostring(parse_json(AdditionalFields).TLPLevel)\n\
      | extend TI_EmailAddress = tolower(EmailSenderAddress)\n| where TI_EmailAddress\
      \ in (SenderAddresses) or TI_EmailAddress in (RecipientAddresses)\n| summarize\
      \ LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue\n|\
      \ where IsActive and (ValidUntil > now() or isempty(ValidUntil)));\n(union\n\
      \  (TI | join kind=innerunique (EmailEvents_) on $left.TI_EmailAddress == $right.SenderFromAddress),\n\
      \  (TI | join kind=innerunique (EmailEvents_) on $left.TI_EmailAddress == $right.RecipientEmailAddress))\n\
      | where EmailEvents_TimeGenerated < ValidUntil\n| extend Description = tostring(parse_json(Data).description)\n\
      | extend ActivityGroupNames = extract(\"ActivityGroup:([^,]+)\", 1, tostring(parse_json(Data).labels))\n\
      | summarize EmailEvents_TimeGenerated = arg_max(EmailEvents_TimeGenerated, *)\
      \ by Id, TI_EmailAddress\n| extend DomainName = EmailSourceDomain\n| extend\
      \ Url = DomainName\n| project EmailEvents_TimeGenerated, Description, ActivityGroupNames,\
      \ Id, ValidUntil, Confidence, DomainName, RecipientEmailAddress, SenderFromAddress,\
      \ Subject, ConfidenceLevel, Url, Type, TI_EmailAddress, TrafficLightProtocolLevel,\
      \ DeliveryAction, DeliveryLocation, EmailDirection\n| extend Name = tostring(split(RecipientEmailAddress,\
      \ '@', 0)[0]), UPNSuffix = tostring(split(RecipientEmailAddress, '@', 1)[0])\n\
      | extend timestamp = EmailEvents_TimeGenerated\n| project-reorder *, TrafficLightProtocolLevel,\
      \ DomainName, Type, TI_EmailAddress"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map Email entity to EmailEvents
      description: '''Identifies a match in EmailEvents table from any Email IOC from
        TI'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
