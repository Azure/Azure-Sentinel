properties:
  id: xdr-cdd1933b-ef94-48a4-b94a-18d45b902751
  displayName: TI Map IP Entity to CommonSecurityLog
  status: disabled
  queryCondition:
    queryText: "let IPRegex = '[0-9]{1,3}\\\\.[0-9]{1,3}\\\\.[0-9]{1,3}\\\\.[0-9]{1,3}';\n\
      let dt_lookBack = 1h; // Look back 1 hour for CommonSecurityLog events\nlet\
      \ ioc_lookBack = 14d; // Look back 14 days for threat intelligence indicators\n\
      // Fetch threat intelligence indicators related to IP addresses\nlet IP_Indicators\
      \ = ThreatIntelIndicators\n//extract key part of kv pair\n     | extend IndicatorType\
      \ = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\",\
      \ 0)))\n     | where IndicatorType in (\"ipv4-addr\", \"ipv6-addr\", \"network-traffic\"\
      )\n     | extend NetworkSourceIP = toupper(ObservableValue)\n     | extend TrafficLightProtocolLevel\
      \ = tostring(parse_json(AdditionalFields).TLPLevel)\n  | where TimeGenerated\
      \ >= ago(ioc_lookBack)\n  | extend TI_ipEntity = iff(isnotempty(NetworkSourceIP),\
      \ NetworkSourceIP, NetworkSourceIP)\n  | extend TI_ipEntity = iff(isempty(TI_ipEntity)\
      \ and isnotempty(NetworkSourceIP), NetworkSourceIP, TI_ipEntity)\n  | where\
      \ ipv4_is_private(TI_ipEntity) == false and  TI_ipEntity !startswith \"fe80\"\
      \ and TI_ipEntity !startswith \"::\" and TI_ipEntity !startswith \"127.\"\n\
      \  | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue\n\
      \  | where IsActive and (ValidUntil > now() or isempty(ValidUntil));\n// Perform\
      \ a join between IP indicators and CommonSecurityLog events\nIP_Indicators\n\
      \   | project-reorder *, Tags, TrafficLightProtocolLevel, NetworkSourceIP, Type,\
      \ TI_ipEntity\n  // Use innerunique to keep performance fast and result set\
      \ low, as we only need one match to indicate potential malicious activity that\
      \ needs investigation\n  | join kind=innerunique (\n      CommonSecurityLog\n\
      \      | where TimeGenerated >= ago(dt_lookBack)\n      | extend MessageIP =\
      \ extract(IPRegex, 0, Message)\n      | extend CS_ipEntity = iff((not(ipv4_is_private(SourceIP))\
      \ and isnotempty(SourceIP)), SourceIP, DestinationIP)\n      | extend CS_ipEntity\
      \ = iff(isempty(CS_ipEntity) and isnotempty(MessageIP), MessageIP, CS_ipEntity)\n\
      \      | extend CommonSecurityLog_TimeGenerated = TimeGenerated\n  )\n  on $left.TI_ipEntity\
      \ == $right.CS_ipEntity\n  // Filter out logs that occurred after the expiration\
      \ of the corresponding indicator\n  | where CommonSecurityLog_TimeGenerated\
      \ < ValidUntil\n  // Group the results by IndicatorId and CS_ipEntity, and keep\
      \ the log entry with the latest timestamp\n  | summarize CommonSecurityLog_TimeGenerated\
      \ = arg_max(CommonSecurityLog_TimeGenerated, *) by Id, CS_ipEntity\n  // Select\
      \ the desired output fields\n  | project timestamp = CommonSecurityLog_TimeGenerated,\
      \ SourceIP, DestinationIP, MessageIP, Message, DeviceVendor, DeviceProduct,\
      \ Id, ValidUntil, Confidence, TI_ipEntity, CS_ipEntity, LogSeverity, DeviceAction,\
      \ Type"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map IP Entity to CommonSecurityLog
      description: This query maps any IP indicators of compromise (IOCs) from threat
        intelligence (TI), by searching for matches in CommonSecurityLog.
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: CS_ipEntity
        - id: ip2
          addressColumn: SourceIP
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
