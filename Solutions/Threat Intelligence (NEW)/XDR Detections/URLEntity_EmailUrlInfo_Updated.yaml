properties:
  id: xdr-9e32e545-e60c-47de-9941-f9ca1ada0a42
  displayName: TI Map URL Entity to EmailUrlInfo
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet EmailUrlInfo_\
      \ = materialize(EmailUrlInfo\n    | where TimeGenerated >= ago(dt_lookBack)\n\
      \    | extend EmailUrlInfo_TimeGenerated = TimeGenerated);\nlet EmailUrls =\
      \ EmailUrlInfo_ | distinct Url | summarize make_list(Url);\nlet EmailUrlDomains\
      \ = EmailUrlInfo_ | distinct UrlDomain | summarize make_list(UrlDomain);\nlet\
      \ EmailEvents_ = materialize(EmailEvents\n    | where TimeGenerated >= ago(dt_lookBack));\n\
      let TI = materialize(ThreatIntelIndicators\n   //extract key part of kv pair\n\
      | extend IndicatorType = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey,\
      \ \":\", 0)))\n| where IndicatorType == \"url\"\n| extend Url = ObservableValue\n\
      | extend TrafficLightProtocolLevel = tostring(parse_json(AdditionalFields).TLPLevel)\n\
      | extend IndicatorId = tostring(split(Id, \"--\")[2])\n    | where TimeGenerated\
      \ >= ago(ioc_lookBack)\n    | where tolower(Url) in (EmailUrls) or tolower(Url)\
      \ in (EmailUrlDomains)\n    | summarize LatestIndicatorTime = arg_max(TimeGenerated,\
      \ *) by Id, ObservableValue\n    | where IsActive and (ValidUntil > now() or\
      \ isempty(ValidUntil)));\n(union\n    (TI | join kind=innerunique (EmailUrlInfo_)\
      \ on Url),\n    (TI | join kind=innerunique (EmailUrlInfo_) on $left.Url ==\
      \ $right.UrlDomain))\n| where EmailUrlInfo_TimeGenerated < ValidUntil\n| summarize\
      \ EmailUrlInfo_TimeGenerated = arg_max(EmailUrlInfo_TimeGenerated, *) by IndicatorId,\
      \ Url\n| extend Description = tostring(parse_json(Data).description)\n| extend\
      \ ActivityGroupNames = extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      | project EmailUrlInfo_TimeGenerated, Description, ActivityGroupNames, IndicatorId,\
      \ Type, ValidUntil, Confidence, Url, UrlDomain, UrlLocation, NetworkMessageId\n\
      | extend timestamp = EmailUrlInfo_TimeGenerated\n| join kind=inner (EmailEvents_)\
      \ on NetworkMessageId\n| where DeliveryAction !has \"Blocked\"\n| extend Name\
      \ = tostring(split(RecipientEmailAddress, '@', 0)[0]), UPNSuffix = tostring(split(RecipientEmailAddress,\
      \ '@', 1)[0])"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map URL Entity to EmailUrlInfo
      description: '''This query identifies any URL indicators of compromise (IOCs)
        from threat intelligence (TI) by searching for matches in EmailUrlInfo.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        AccountFullName: RecipientEmailAddress
