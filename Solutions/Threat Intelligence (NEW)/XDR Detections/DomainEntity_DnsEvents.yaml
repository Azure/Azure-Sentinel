properties:
  id: xdr-03a8e294-3fc7-4d65-9da2-cff91fb5b6dc
  displayName: TI Map Domain entity to DnsEvents
  status: disabled
  queryCondition:
    queryText: "// Define the lookback periods for time-based filters\nlet dt_lookBack\
      \ = 1h; // Look back 1 hour for DNS events\nlet ioc_lookBack = 14d; // Look\
      \ back 14 days for threat intelligence indicators\n// Fetch threat intelligence\
      \ indicators related to domains\nlet Domain_Indicators = ThreatIntelIndicators\n\
      \  // Filter out indicators without domain names\n  | extend IndicatorType =\
      \ replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\", 0)))\n\
      \  | where IndicatorType == \"domain-name\"\n  | extend DomainName = tolower(ObservableValue)\n\
      \  | extend TrafficLightProtocolLevel = tostring(parse_json(AdditionalFields).TLPLevel)\n\
      \  | extend Url = iff(ObservableKey == \"url:value\", ObservableValue, \"\"\
      )\n  | where TimeGenerated >= ago(ioc_lookBack)\n  | summarize LatestIndicatorTime\
      \ = arg_max(TimeGenerated, *) by Id, ObservableValue\n  | where IsActive and\
      \ (ValidUntil > now() or isempty(ValidUntil));\n// Create a list of TLDs in\
      \ our threat feed for later validation\nlet maxListSize = 100000; // Define\
      \ the maximum allowed size for each list\nlet list_tlds = Domain_Indicators\n\
      \  | extend parts = split(DomainName, '.')\n  | extend tld = parts[(array_length(parts)-1)]\n\
      \  | extend IndicatorId = tostring(split(Id, \"--\")[2])\n  | summarize count()\
      \ by tostring(tld)\n  | project tld\n  | summarize make_list(tld, maxListSize);\n\
      // Perform a join between domain indicators and DNS events to identify potential\
      \ malicious activity\nDomain_Indicators\n | project-reorder *, IsActive, Tags,\
      \ TrafficLightProtocolLevel, DomainName, Type\n  // Use innerunique to keep\
      \ performance fast and result set low, as we only need one match to indicate\
      \ potential malicious activity that needs investigation\n  | join kind=innerunique\
      \ (\n    DnsEvents\n    | where TimeGenerated > ago(dt_lookBack)\n    // Extract\
      \ domain patterns from syslog message\n    | where isnotempty(Name)\n    | extend\
      \ parts = split(Name, '.')\n    | extend tld = parts[(array_length(parts)-1)]\n\
      \    // Validate parsed domain by checking if the TLD is in the list of TLDs\
      \ in our threat feed\n    | where tld in~ (list_tlds)\n    | extend DNS_TimeGenerated\
      \ = TimeGenerated\n  ) on $left.DomainName==$right.Name\n  // Filter out DNS\
      \ events that occurred after the expiration of the corresponding indicator\n\
      \  | where DNS_TimeGenerated < ValidUntil\n  // Group the results by IndicatorId\
      \ and Name, and keep the DNS event with the latest timestamp\n  | summarize\
      \ DNS_TimeGenerated = arg_max(DNS_TimeGenerated, *) by Id, Name\n  // Select\
      \ the desired output fields\n  | extend ActivityGroupNames = extract(@\"ActivityGroup:(\\\
      S+)\", 1, tostring(parse_json(Data).labels))\n  | project DNS_TimeGenerated,\
      \ Description, ActivityGroupNames, Id, ValidUntil, Confidence, Url, Computer,\
      \ ClientIP//, Name, QueryType, Type, DomainName\n  // Extract hostname and DNS\
      \ domain from the Computer field\n  | extend HostName = tostring(split(Computer,\
      \ '.', 0)[0]), DnsDomain = tostring(strcat_array(array_slice(split(Computer,\
      \ '.'), 1, -1), '.'))\n  // Rename the timestamp field\n  | extend timestamp\
      \ = DNS_TimeGenerated"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map Domain entity to DnsEvents
      description: Identifies a match in DnsEvents from any Domain IOC from TI
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
        ips:
        - id: ip1
          addressColumn: ClientIP
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        HostFullName: Computer
