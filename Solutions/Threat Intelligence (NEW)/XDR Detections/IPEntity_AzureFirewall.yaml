properties:
  id: xdr-4992d2f3-d6c0-4271-adac-b23532ba4492
  displayName: TI Map IP entity to AzureFirewall
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h; // Look back 1 hour for AzureDiagnostics logs\n\
      let ioc_lookBack = 14d; // Look back 14 days for threat intelligence indicators\n\
      // Fetch threat intelligence indicators related to IP addresses\nlet IP_Indicators\
      \ = ThreatIntelIndicators\n//extract key part of kv pair\n     | extend IndicatorType\
      \ = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\",\
      \ 0)))\n     | where IndicatorType in (\"ipv4-addr\", \"ipv6-addr\", \"network-traffic\"\
      )\n     | extend NetworkSourceIP = toupper(ObservableValue)\n     | extend TrafficLightProtocolLevel\
      \ = tostring(parse_json(AdditionalFields).TLPLevel)\n  // Filter out indicators\
      \ without relevant IP address fields\n  | where TimeGenerated >= ago(ioc_lookBack)\n\
      \  // Select the IP entity based on availability of different IP fields\n  |\
      \ extend TI_ipEntity = iff(isnotempty(NetworkSourceIP), NetworkSourceIP, NetworkSourceIP)\n\
      \  | extend TI_ipEntity = iff(isempty(TI_ipEntity) and isnotempty(NetworkSourceIP),\
      \ NetworkSourceIP, TI_ipEntity)\n  // Exclude local addresses using the ipv4_is_private\
      \ operator and filtering out specific address prefixes\n  | where ipv4_is_private(TI_ipEntity)\
      \ == false and  TI_ipEntity !startswith \"fe80\" and TI_ipEntity !startswith\
      \ \"::\" and TI_ipEntity !startswith \"127.\"\n  | summarize LatestIndicatorTime\
      \ = arg_max(TimeGenerated, *) by Id, ObservableValue\n  | where IsActive and\
      \ (ValidUntil > now() or isempty(ValidUntil));\n// Perform a join between IP\
      \ indicators and AzureDiagnostics logs to identify potential malicious activity\n\
      IP_Indicators\n   | project-reorder *, Tags, TrafficLightProtocolLevel, NetworkSourceIP,\
      \ Type, TI_ipEntity\n  // Use innerunique to keep performance fast and result\
      \ set low, as we only need one match to indicate potential malicious activity\
      \ that needs investigation\n  | join kind=innerunique (\n      union AZFWApplicationRule,\
      \ AZFWNetworkRule\n      | where TimeGenerated >= ago(dt_lookBack)\n      //|\
      \ where OperationName in (\"AzureFirewallApplicationRuleLog\", \"AzureFirewallNetworkRuleLog\"\
      )\n      | parse kind=regex flags=U ActionReason with Protocol 'request from\
      \ ' SourceHost 'to ' DestinationHost @'\\.? Action: ' Firewall_Action @'\\.'\
      \ Rest_msg\n      | extend SourceAddress = SourceIp\n      | extend DestinationAddress\
      \ = DestinationIp\n      | extend RemoteIP = case(not(ipv4_is_private(DestinationAddress)),\
      \ DestinationAddress, not(ipv4_is_private(SourceAddress)), SourceAddress, \"\
      \")\n      | where isnotempty(RemoteIP) // Filter out traffic involving public\
      \ addresses only\n      | extend Firewall_Action = Action\n      | project-rename\
      \ AzureFirewall_TimeGenerated = TimeGenerated\n  )\n  on $left.TI_ipEntity ==\
      \ $right.RemoteIP\n  // Filter out logs that occurred after the expiration of\
      \ the corresponding indicator\n  | where AzureFirewall_TimeGenerated < ValidUntil\n\
      \  // Group the results by IndicatorId and RemoteIP, and keep the log entry\
      \ with the latest timestamp\n  | summarize AzureFirewall_TimeGenerated = arg_max(AzureFirewall_TimeGenerated,\
      \ *) by Id, RemoteIP\n  // Select the desired output fields\n  | extend Description\
      \ = tostring(parse_json(Data).description)\n  | extend ActivityGroupNames =\
      \ extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      \  | project LatestIndicatorTime, Description, ActivityGroupNames, Id, ValidUntil,\
      \ Confidence,\n    AzureFirewall_TimeGenerated, TI_ipEntity, ActionReason, SourceAddress,\
      \ DestinationAddress, Firewall_Action, Protocol,\n    NetworkSourceIP, Type,\
      \ TargetUrl"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map IP entity to AzureFirewall
      description: Identifies a match in AzureFirewall (NetworkRule & ApplicationRule
        Logs) from any IP IOC from TI
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: TI_ipEntity
        urls:
        - id: url1
          addressColumn: TargetUrl
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
