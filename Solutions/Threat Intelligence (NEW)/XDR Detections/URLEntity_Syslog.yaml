properties:
  id: xdr-4de24a28-dcd0-4a0d-bf14-96d8483dc05a
  displayName: TI Map URL Entity to Syslog Data
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nThreatIntelIndicators\n\
      // Picking up only IOC's that contain the entities we want\n//extract key part\
      \ of kv pair\n| extend IndicatorType = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey,\
      \ \":\", 0)))\n| where IndicatorType == \"url\"\n| extend Url = ObservableValue\n\
      | extend TrafficLightProtocolLevel = tostring(parse_json(AdditionalFields).TLPLevel)\n\
      | where TimeGenerated >= ago(ioc_lookBack)\n| summarize LatestIndicatorTime\
      \ = arg_max(TimeGenerated, *) by Id, ObservableValue\n| where IsActive and (ValidUntil\
      \ > now() or isempty(ValidUntil))\n   | project-reorder *, Tags, TrafficLightProtocolLevel,\
      \ Url, Type\n// using innerunique to keep perf fast and result set low, we only\
      \ need one match to indicate potential malicious activity that needs to be investigated\n\
      | join kind=innerunique (\n  Syslog\n  | where TimeGenerated >= ago(dt_lookBack)\n\
      \  // Extract URL from the Syslog message but only take messages that include\
      \ URLs\n  | extend Url = extract(\"(http[s]?://(?:[a-zA-Z]|[0-9]|[$-_@.&+]|[!*\\\
      \\(\\\\),]|(?:%[0-9a-fA-F][0-9a-fA-F]))+)\", 1,SyslogMessage)\n  | extend Syslog_TimeGenerated\
      \ = TimeGenerated\n) on Url\n| where Syslog_TimeGenerated < ValidUntil\n| summarize\
      \ Syslog_TimeGenerated  = arg_max(Syslog_TimeGenerated , *) by Id, Url\n| extend\
      \ Description = tostring(parse_json(Data).description)\n| extend ActivityGroupNames\
      \ = extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      | project timestamp = Syslog_TimeGenerated, Description, ActivityGroupNames,\
      \ Id, Type, ValidUntil, Confidence, SyslogMessage, Computer, ProcessName, Url,\
      \ HostIP"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map URL Entity to Syslog Data
      description: '''This query identifies any URL indicators of compromise (IOCs)
        from threat intelligence (TI) by searching for matches in Syslog data.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: Computer
        ips:
        - id: ip1
          addressColumn: HostIP
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
