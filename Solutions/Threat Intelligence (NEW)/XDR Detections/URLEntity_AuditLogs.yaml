properties:
  id: xdr-9991c277-e0a1-4079-8c40-fbfca2705615
  displayName: TI Map URL Entity to AuditLogs
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet AuditEvents =\
      \ materialize(AuditLogs\n  | where TimeGenerated >= ago(dt_lookBack)\n  // Extract\
      \ the URL that is contained within the JSON data\n  | extend Url = tolower(extract(\"\
      (http[s]?://[^\\\\s\\\\\\\"\\\\\\\\]+)\", 1, tostring(TargetResources)))\n \
      \ | extend userPrincipalName = tostring(parse_json(tostring(InitiatedBy.user)).userPrincipalName)\n\
      \  | extend TargetResourceDisplayName = tostring(TargetResources[0].displayName));\n\
      let AuditUrls = AuditEvents | distinct Url = tolower(Url) | summarize make_list(Url);\n\
      ThreatIntelIndicators\n//extract key part of kv pair\n     | extend IndicatorType\
      \ = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\",\
      \ 0)))\n     | where IndicatorType == \"url\"\n     | extend Url = tolower(ObservableValue)\n\
      \     | extend TrafficLightProtocolLevel = tostring(parse_json(AdditionalFields).TLPLevel)\n\
      | where TimeGenerated >= ago(ioc_lookBack)\n| where tolower(Url) in (AuditUrls)\n\
      | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue\n\
      | where IsActive and (ValidUntil > now() or isempty(ValidUntil))\n| extend Description\
      \ = tostring(parse_json(Data).description)\n| where Description !contains_cs\
      \ \"State: inactive;\" and Description !contains_cs \"State: falsepos;\"\n//\
      \ using innerunique to keep perf fast and result set low, we only need one match\
      \ to indicate potential malicious activity that needs to be investigated\n|\
      \ join kind=innerunique (AuditEvents) on Url\n| where TimeGenerated < ValidUntil\n\
      | summarize TimeGenerated = arg_max(TimeGenerated, *) by Id, Url\n| extend Description\
      \ = tostring(parse_json(Data).description)\n| extend ActivityGroupNames = extract(@\"\
      ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n| project TimeGenerated,\
      \ Description, ActivityGroupNames, Id, Type, ValidUntil, Confidence,\nOperationName,\
      \ Identity, userPrincipalName, TargetResourceDisplayName, Url\n| extend AccountName\
      \ = tostring(split(userPrincipalName, \"@\")[0]), AccountUPNSuffix = tostring(split(userPrincipalName,\
      \ \"@\")[1])\n| extend HostName = tostring(split(TargetResourceDisplayName,\
      \ \".\")[0]), DomainIndex = toint(indexof(TargetResourceDisplayName, '.'))\n\
      | extend HostNameDomain = iff(DomainIndex != -1, substring(TargetResourceDisplayName,\
      \ DomainIndex + 1), TargetResourceDisplayName)"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map URL Entity to AuditLogs
      description: '''This query identifies any URL indicators of compromise (IOCs)
        from threat intelligence (TI) by searching for matches in AuditLogs.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        AccountFullName: userPrincipalName
        HostFullName: TargetResourceDisplayName
