properties:
  id: xdr-bc3bb047-70b8-4a4b-ac21-e3b1172881a4
  displayName: TI Map Domain entity to EmailEvents
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet EmailEvents_ =\
      \ materialize(EmailEvents | where isnotempty(RecipientEmailAddress) and isnotempty(SenderFromAddress)\
      \ and TimeGenerated >= ago(dt_lookBack) and DeliveryAction !has \"Blocked\"\
      \ | project-rename  EmailEvents_TimeGenerated = TimeGenerated | extend SenderFromDomain\
      \ = tolower(SenderFromDomain) | extend RecipientEmailDomain = tolower(tostring(split(RecipientEmailAddress,\
      \ '@', 1))));\nlet SenderDomains = EmailEvents_ | distinct  SenderFromDomain\
      \ | summarize make_list(SenderFromDomain);\nlet RecipientDomains = EmailEvents_\
      \ | distinct  RecipientEmailDomain | summarize make_list(RecipientEmailDomain);\n\
      let TI = materialize(ThreatIntelIndicators\n| where TimeGenerated >= ago(ioc_lookBack)\n\
      | extend IndicatorType = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey,\
      \ \":\", 0)))\n| where IndicatorType == \"domain-name\"\n| extend DomainName\
      \ = tolower(ObservableValue)\n| extend TrafficLightProtocolLevel = tostring(parse_json(AdditionalFields).TLPLevel)\n\
      | extend IndicatorId = tostring(split(Id, \"--\")[2])\n| where DomainName in\
      \ (SenderDomains) or DomainName in (RecipientDomains)\n| summarize LatestIndicatorTime\
      \ = arg_max(TimeGenerated, *) by Id, ObservableValue\n| where IsActive and (ValidUntil\
      \ > now() or isempty(ValidUntil))\n| extend Description = tostring(parse_json(Data).description)\n\
      | where Description !contains_cs \"State: inactive;\" and Description !contains_cs\
      \ \"State: falsepos;\");\n(union\n  (TI | join kind=innerunique (EmailEvents_)\
      \ on $left.DomainName == $right.SenderFromDomain),\n  (TI | join kind=innerunique\
      \ (EmailEvents_) on $left.DomainName == $right.RecipientEmailDomain))\n| where\
      \ EmailEvents_TimeGenerated < ValidUntil\n| extend ActivityGroupNames = extract(\"\
      ActivityGroup:([^,]+)\", 1, tostring(parse_json(Data).labels))\n| summarize\
      \ EmailEvents_TimeGenerated = arg_max(EmailEvents_TimeGenerated, *) by Id, RecipientEmailAddress\n\
      | project EmailEvents_TimeGenerated, Description, ActivityGroupNames, Id, ValidUntil,\
      \ Confidence, DomainName, RecipientEmailAddress, SenderFromAddress, Subject,\
      \ ConfidenceLevel, Type, TrafficLightProtocolLevel, DeliveryAction, DeliveryLocation,\
      \ EmailDirection\n| extend Name = tostring(split(RecipientEmailAddress, '@',\
      \ 0)[0]), UPNSuffix = tostring(split(RecipientEmailAddress, '@', 1)[0])\n| extend\
      \ timestamp = EmailEvents_TimeGenerated"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map Domain entity to EmailEvents
      description: Identifies a match in EmailEvents table from any Domain IOC from
        TI
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1566
