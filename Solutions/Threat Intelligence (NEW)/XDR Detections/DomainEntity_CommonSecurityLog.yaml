properties:
  id: xdr-094a4e6e-1a0d-4d49-9d64-cfc3b01a0be1
  displayName: TI Map Domain entity to PaloAlto CommonSecurityLog
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h; // Look back 1 hour\nlet ioc_lookBack = 14d;\
      \ // Look back 14 days\n// Create a list of top-level domains (TLDs) from the\
      \ threat feed data for later validation\nlet SecurityLog = materialize(\n  CommonSecurityLog\n\
      \    // Filter common security logs based on the specified time range\n    |\
      \ extend IngestionTime = ingestion_time()\n    | where IngestionTime > ago(dt_lookBack)\n\
      \    | where DeviceEventClassID =~ 'url'\n    // Uncomment the line below to\
      \ only alert on allowed connections\n    //| where DeviceAction !~ \"block-url\"\
      \n    // Extract the domain from RequestURL, if not present, extract it from\
      \ AdditionalExtensions\n    | extend PA_Url = column_ifexists(\"RequestURL\"\
      , \"None\")\n    | extend PA_Url = iif(isempty(PA_Url) and AdditionalExtensions\
      \ !startswith \"PanOS\", extract(\"([^\\\\\\\"]+)\", 1, tolower(AdditionalExtensions)),\
      \ trim('\"', PA_Url))\n    | extend PA_Url = iif(PA_Url !startswith 'http://'\
      \ and ApplicationProtocol !~ \"ssl\", strcat('http://', PA_Url), iif(PA_Url\
      \ !startswith 'https://' and ApplicationProtocol =~ \"ssl\", strcat('https://',\
      \ PA_Url), PA_Url))\n    | extend Domain = trim('\"', tostring(parse_url(PA_Url).Host))\n\
      \    | where isnotempty(Domain)\n    | extend Domain = tolower(Domain)\n   \
      \ | extend CommonSecurityLog_TimeGenerated = TimeGenerated\n);\nlet LogDomains\
      \ = SecurityLog | distinct Domain | summarize make_list(Domain);\n// Retrieve\
      \ threat intelligence indicators within the specified time range\nlet Domain_Indicators\
      \ = materialize(\n    ThreatIntelIndicators\n    | extend IndicatorType = replace(@\"\
      \\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\", 0)))\n    | where\
      \ IndicatorType == \"domain-name\"\n    | extend DomainName = tolower(ObservableValue)\n\
      \    | where TimeGenerated >= ago(ioc_lookBack)\n    | summarize LatestIndicatorTime\
      \ = arg_max(TimeGenerated, *) by Id, ObservableValue\n    | where IsActive and\
      \ (ValidUntil > now() or isempty(ValidUntil)));\n// Join threat intelligence\
      \ indicators with common security logs\nDomain_Indicators | join kind=innerunique\
      \ (SecurityLog) on $left.DomainName == $right.Domain\n| where CommonSecurityLog_TimeGenerated\
      \ < ValidUntil\n| summarize CommonSecurityLog_TimeGenerated = arg_max(CommonSecurityLog_TimeGenerated,\
      \ *) by Id\n| extend Description = tostring(parse_json(Data).description), ActivityGroupNames\
      \ = tostring(parse_json(Data).activitygroupnames)\n| project CommonSecurityLog_TimeGenerated,\
      \ Description, ActivityGroupNames, PA_Url, Domain, Id, ValidUntil, Confidence,\
      \ DeviceAction, DestinationIP, DestinationPort, DeviceName, SourceIP, SourcePort,\
      \ ApplicationProtocol, RequestMethod, Type\n| extend timestamp = CommonSecurityLog_TimeGenerated"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map Domain entity to PaloAlto CommonSecurityLog
      description: Identifies a match in PaloAlto CommonSecurityLog table from any
        Domain IOC from TI
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: DeviceName
        ips:
        - id: ip1
          addressColumn: SourceIP
        urls:
        - id: url1
          addressColumn: PA_Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
