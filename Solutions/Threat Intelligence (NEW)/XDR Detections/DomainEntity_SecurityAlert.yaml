properties:
  id: xdr-df88b403-1cb9-49ea-a43d-b6613051cf7f
  displayName: TI Map Domain entity to SecurityAlert
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet SecurityAlerts\
      \ = SecurityAlert\n| where TimeGenerated > ago(dt_lookBack)\n| where AlertName\
      \ != \"TI map Domain entity to SecurityAlert\"\n| extend domain = todynamic(dynamic_to_json(extract_all(@\"\
      (((xn--)?[a-z0-9\\-]+\\.)+([a-z]+|(xn--[a-z0-9]+)))\", dynamic([1]), tolower(Entities))))\n\
      | where isnotempty(domain)\n| mv-expand domain\n| extend domain = tostring(domain)\n\
      | extend EntitiesDynamicArray = parse_json(Entities)\n| mv-apply EntitiesDynamicArray\
      \ on\n    (summarize\n        HostName = take_anyif(tostring(EntitiesDynamicArray.HostName),\
      \ EntitiesDynamicArray.Type == \"host\"),\n        IP_addr = take_anyif(tostring(EntitiesDynamicArray.Address),\
      \ EntitiesDynamicArray.Type == \"ip\")\n    )\n| extend Alert_TimeGenerated\
      \ = TimeGenerated\n| extend Alert_Description = Description;\nlet AlertDomains\
      \ = SecurityAlerts\n| distinct domain\n| summarize make_list(domain);\nlet Domain_Indicators\
      \ = materialize(ThreatIntelIndicators\n| extend IndicatorType = replace(@\"\\\
      [|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\", 0)))\n| where IndicatorType\
      \ == \"domain-name\"\n| extend DomainName = tolower(ObservableValue)\n| where\
      \ TimeGenerated >= ago(ioc_lookBack)\n| where DomainName in (AlertDomains)\n\
      | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue\n\
      | where IsActive and (ValidUntil > now() or isempty(ValidUntil))\n| extend Description\
      \ = tostring(parse_json(Data).description)\n| where Description !contains_cs\
      \ \"State: inactive;\" and Description !contains_cs \"State: falsepos;\");\n\
      Domain_Indicators\n// Using innerunique to keep performance fast and result\
      \ set low, we only need one match to indicate potential malicious activity that\
      \ needs to be investigated\n| join kind=innerunique (SecurityAlerts) on $left.DomainName\
      \ == $right.domain\n| where Alert_TimeGenerated < ValidUntil\n| summarize Alert_TimeGenerated\
      \ = arg_max(Alert_TimeGenerated, *) by Id, AlertName\n| extend ActivityGroupNames\
      \ = extract(\"ActivityGroup:([^,]+)\", 1, tostring(parse_json(Data).labels))\n\
      | extend Url = DomainName\n| project Alert_TimeGenerated, Description, ActivityGroupNames,\
      \ Id, ValidUntil, ConfidenceScore, DomainName, AlertName, Alert_Description,\
      \ ProviderName, AlertSeverity, ConfidenceLevel, HostName, IP_addr, Url, Entities,\
      \ Type\n| extend timestamp = Alert_TimeGenerated\n| project-reorder *, ConfidenceScore,\
      \ DomainName, AlertName, Alert_TimeGenerated, ProviderName, AlertSeverity, Entities,\
      \ Type, timestamp"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map Domain entity to SecurityAlert
      description: '''Identifies a match in SecurityAlert table from any Domain IOC
        from TI'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
        ips:
        - id: ip1
          addressColumn: IP_addr
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
