properties:
  id: xdr-1546f3b3-de8a-4e62-bfea-815422154981
  displayName: TI Map Domain Entity to DeviceNetworkEvents
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet DeviceNetworkEvents_\
      \ = DeviceNetworkEvents\n  | where isnotempty(RemoteUrl)\n  | where TimeGenerated\
      \ >= ago(dt_lookBack)\n  | where ActionType !has \"ConnectionFailed\"\n  | extend\
      \ Domain = tostring(parse_url(tolower(RemoteUrl)).Host)\n  | where isnotempty(Domain)\n\
      \  | project-rename DeviceNetworkEvents_TimeGenerated = TimeGenerated;\nlet\
      \ DeviceNetworkEventDomains = DeviceNetworkEvents_\n  | distinct Domain\n  |\
      \ summarize make_list(Domain);\nThreatIntelIndicators\n| extend IndicatorType\
      \ = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\",\
      \ 0)))\n| where IndicatorType == \"domain-name\"\n| extend DomainName = tolower(ObservableValue)\n\
      | where TimeGenerated >= ago(ioc_lookBack)\n| extend IndicatorId = tostring(split(Id,\
      \ \"--\")[2])\n| where DomainName in (DeviceNetworkEventDomains)\n| summarize\
      \ LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue\n|\
      \ where IsActive and (ValidUntil > now() or isempty(ValidUntil))\n| extend Description\
      \ = tostring(parse_json(Data).description)\n| extend TrafficLightProtocolLevel\
      \ = tostring(parse_json(AdditionalFields).TLPLevel)\n| where Description !contains_cs\
      \ \"State: inactive;\" and Description !contains_cs \"State: falsepos;\"\n|\
      \ project-reorder *, IsActive, Tags, TrafficLightProtocolLevel, DomainName,\
      \ Type\n| join kind=innerunique (DeviceNetworkEvents_) on $left.DomainName ==\
      \ $right.Domain\n| where DeviceNetworkEvents_TimeGenerated < ValidUntil\n| summarize\
      \ DeviceNetworkEvents_TimeGenerated = arg_max(DeviceNetworkEvents_TimeGenerated,\
      \ *) by IndicatorId\n| project DeviceNetworkEvents_TimeGenerated, IndicatorId,\
      \ Url = RemoteUrl, Confidence, Description, Tags, TrafficLightProtocolLevel,\
      \ ActionType, DeviceId, DeviceName, InitiatingProcessAccountUpn, InitiatingProcessCommandLine,\
      \ RemoteIP, RemotePort\n| extend Name = tostring(split(InitiatingProcessAccountUpn,\
      \ '@', 0)[0]), UPNSuffix = tostring(split(InitiatingProcessAccountUpn, '@',\
      \ 1)[0])\n| extend timestamp = DeviceNetworkEvents_TimeGenerated, UserPrincipalName\
      \ = InitiatingProcessAccountUpn"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map Domain Entity to DeviceNetworkEvents
      description: '''This query identifies any Domain indicators of compromise (IOCs)
        from threat intelligence (TI) by searching for matches in DeviceNetworkEvents.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        hosts:
        - id: host1
          nameColumn: DeviceName
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
