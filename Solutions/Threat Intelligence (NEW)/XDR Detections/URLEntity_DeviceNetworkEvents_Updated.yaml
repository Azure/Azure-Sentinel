properties:
  id: xdr-4f0356b2-d344-4c19-9375-31b9575d80cb
  displayName: TI Map URL Entity to DeviceNetworkEvents
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nlet DeviceNetworkEvents_\
      \ = DeviceNetworkEvents\n  | where TimeGenerated >= ago(dt_lookBack)\n  | where\
      \ ActionType !has \"ConnectionFailed\"\n  | project-rename DeviceNetworkEvents_TimeGenerated\
      \ = TimeGenerated;\nlet DeviceNetworkEventUrls = DeviceNetworkEvents_\n  | distinct\
      \ Url = RemoteUrl\n  | summarize make_list(Url);\nThreatIntelIndicators\n//extract\
      \ key part of kv pair\n| extend IndicatorType = replace(@\"\\[|\\]|\\\"\"\"\
      , \"\", tostring(split(ObservableKey, \":\", 0)))\n| where IndicatorType ==\
      \ \"url\"\n| extend Url = ObservableValue\n| extend TrafficLightProtocolLevel\
      \ = tostring(parse_json(AdditionalFields).TLPLevel)\n| where TimeGenerated >=\
      \ ago(ioc_lookBack)\n| extend Url = tolower(Url)\n| where Url in (DeviceNetworkEventUrls)\n\
      | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue\n\
      | where IsActive and (ValidUntil > now() or isempty(ValidUntil))\n| extend Description\
      \ = tostring(parse_json(Data).description)\n| where Description !contains_cs\
      \ \"State: inactive;\" and Description !contains_cs \"State: falsepos;\"\n \
      \  | project-reorder *, Tags, TrafficLightProtocolLevel, Url, Type\n| join kind=innerunique\
      \ (DeviceNetworkEvents_) on $left.Url == $right.RemoteUrl\n| where DeviceNetworkEvents_TimeGenerated\
      \ < ValidUntil\n| summarize DeviceNetworkEvents_TimeGenerated = arg_max(DeviceNetworkEvents_TimeGenerated,\
      \ *) by Id, Url\n| extend Description = tostring(parse_json(Data).description)\n\
      | extend ActivityGroupNames = extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      | project DeviceNetworkEvents_TimeGenerated, Id, Url, Confidence, Description,\
      \ Type, Tags, TrafficLightProtocolLevel, ActionType, DeviceId, DeviceName, InitiatingProcessAccountUpn,\
      \ InitiatingProcessCommandLine, RemoteIP, RemotePort\n| extend Name = tostring(split(InitiatingProcessAccountUpn,\
      \ '@', 0)[0]), UPNSuffix = tostring(split(InitiatingProcessAccountUpn, '@',\
      \ 1)[0])\n| extend timestamp = DeviceNetworkEvents_TimeGenerated, UserPrincipalName\
      \ = InitiatingProcessAccountUpn"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map URL Entity to DeviceNetworkEvents
      description: '''This query identifies any URL indicators of compromise (IOCs)
        from threat intelligence (TI) by searching for matches in DeviceNetworkEvents.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        hosts:
        - id: host1
          nameColumn: DeviceName
        urls:
        - id: url1
          addressColumn: Url
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
