properties:
  id: xdr-7c8051a7-3d29-4c0d-a340-893423f7b0a5
  displayName: TI Map IP entity to Azure Key Vault logs
  status: disabled
  queryCondition:
    queryText: "let dt_lookBack = 1h; // Look back 1 hour for AzureDiagnostics logs\n\
      let ioc_lookBack = 14d; // Look back 14 days for threat intelligence indicators\n\
      // Fetch threat intelligence indicators related to IP addresses\nlet IP_Indicators\
      \ = ThreatIntelIndicators\n//extract key part of kv pair\n     | extend IndicatorType\
      \ = replace(@\"\\[|\\]|\\\"\"\", \"\", tostring(split(ObservableKey, \":\",\
      \ 0)))\n     | where IndicatorType in (\"ipv4-addr\", \"ipv6-addr\", \"network-traffic\"\
      )\n     | extend NetworkSourceIP = toupper(ObservableValue)\n     | extend TrafficLightProtocolLevel\
      \ = tostring(parse_json(AdditionalFields).TLPLevel)\n  | where TimeGenerated\
      \ >= ago(ioc_lookBack)\n  | extend TI_ipEntity = iff(isnotempty(NetworkSourceIP),\
      \ NetworkSourceIP, NetworkSourceIP)\n  | extend TI_ipEntity = iff(isempty(TI_ipEntity)\
      \ and isnotempty(NetworkSourceIP), NetworkSourceIP, TI_ipEntity)\n  | where\
      \ ipv4_is_private(TI_ipEntity) == false and  TI_ipEntity !startswith \"fe80\"\
      \ and TI_ipEntity !startswith \"::\" and TI_ipEntity !startswith \"127.\"\n\
      \  | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue\n\
      \  | where IsActive and (ValidUntil > now() or isempty(ValidUntil));\n// Perform\
      \ a join between IP indicators and AzureDiagnostics logs for Key Vault events\n\
      IP_Indicators\n   | project-reorder *, Tags, TrafficLightProtocolLevel, NetworkSourceIP,\
      \ Type, TI_ipEntity\n  // Use innerunique to keep performance fast and result\
      \ set low, as we only need one match to indicate potential malicious activity\
      \ that needs investigation\n  | join kind=innerunique (\n      AzureDiagnostics\n\
      \      | where ResourceType =~ \"VAULTS\"\n      | where TimeGenerated >= ago(dt_lookBack)\n\
      \      | extend KeyVaultEvents_TimeGenerated = TimeGenerated, ClientIP = CallerIPAddress\n\
      \  )\n  on $left.TI_ipEntity == $right.ClientIP\n  // Filter out logs that occurred\
      \ after the expiration of the corresponding indicator\n  | where KeyVaultEvents_TimeGenerated\
      \ < ValidUntil\n  // Group the results by IndicatorId and ClientIP, and keep\
      \ the log entry with the latest timestamp\n  | summarize KeyVaultEvents_TimeGenerated\
      \ = arg_max(KeyVaultEvents_TimeGenerated, *) by Id, ClientIP\n  // Select the\
      \ desired output fields\n  | extend Description = tostring(parse_json(Data).description)\n\
      \  | extend ActivityGroupNames = extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      \  | project KeyVaultEvents_TimeGenerated, Description, ActivityGroupNames,\
      \ Id, ValidUntil, Confidence,\n    TI_ipEntity, ClientIP, ResourceId, SubscriptionId,\
      \ OperationName, ResultType, CorrelationId, id_s, clientInfo_s, httpStatusCode_d,\n\
      \    identity_claim_appid_g, identity_claim_http_schemas_microsoft_com_identity_claims_objectidentifier_g,\
      \ Type\n  // Rename the timestamp field\n  | extend timestamp = KeyVaultEvents_TimeGenerated"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map IP entity to Azure Key Vault logs
      description: Identifies a match in Azure Key Vault logs from any IP IOC from
        TI
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: ClientIP
        azureResources:
        - id: azureResource1
          resourceIdColumn: ResourceId
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
