properties:
  id: xdr-43d6c173-64c8-4416-b32e-636a9f318d15
  displayName: TI Map IP entity to GitHub_CL
  status: disabled
  queryCondition:
    queryText: |-
      let dt_lookBack = 1h; // Look back 1 hour for VMConnection events
      let ioc_lookBack = 14d; // Look back 14 days for threat intelligence indicators
      ThreatIntelIndicators
      //extract key part of kv pair
           | extend IndicatorType = replace(@"\[|\]|\""", "", tostring(split(ObservableKey, ":", 0)))
           | where IndicatorType in ("ipv4-addr", "ipv6-addr", "network-traffic")
           | extend NetworkSourceIP = toupper(ObservableValue)
           | extend TrafficLightProtocolLevel = tostring(parse_json(AdditionalFields).TLPLevel)
      // Picking up only IOC's that contain the entities we want
      // | where Action == true
      | where TimeGenerated >= ago(ioc_lookBack)
      // Taking the first non-empty value based on potential IOC match availability
      | extend TI_ipEntity = iff(isnotempty(NetworkSourceIP), NetworkSourceIP, NetworkSourceIP)
      | extend TI_ipEntity = iff(isempty(TI_ipEntity) and isnotempty(NetworkSourceIP), NetworkSourceIP, TI_ipEntity)
      | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id, ObservableValue
      | where IsActive and (ValidUntil > now() or isempty(ValidUntil))
        | project-reorder *, Tags, TrafficLightProtocolLevel, NetworkSourceIP, Type, TI_ipEntity
      | join (
        GitHubAudit
        | where TimeGenerated >= ago(dt_lookBack)
        | extend GitHubAudit_TimeGenerated = TimeGenerated
      )
      on $left.TI_ipEntity == $right.IPaddress
      | extend Description = tostring(parse_json(Data).description)
      | extend ActivityGroupNames = extract(@"ActivityGroup:(\S+)", 1, tostring(parse_json(Data).labels))
      | project LatestIndicatorTime, Description, ActivityGroupNames, Id, ValidUntil, Confidence, GitHubAudit_TimeGenerated, TI_ipEntity, IPaddress, Actor, Action, Country, OperationType, NetworkSourceIP
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map IP entity to GitHub_CL
      description: '''Identifies a match in GitHub_CL table from any IP IOC from TI'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPaddress
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        AccountFullName: Actor
