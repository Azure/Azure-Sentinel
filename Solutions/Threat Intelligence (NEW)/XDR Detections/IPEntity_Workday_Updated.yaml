properties:
  id: xdr-92e8e945-6e99-4e4b-bef8-468b4c19fc3a
  displayName: TI Map IP entity to Workday(ASimAuditEventLogs)
  status: disabled
  queryCondition:
    queryText: "let dtLookBack = 1h; // Define the lookback period for audit events\n\
      let ioc_lookBack = 14d; // Define the lookback period for threat intelligence\
      \ indicators\nThreatIntelIndicators\n| where TimeGenerated >= ago(ioc_lookBack)\
      \ // Filter threat intelligence indicators within the lookback period\n//extract\
      \ key part of kv pair\n     | extend IndicatorType = replace(@\"\\[|\\]|\\\"\
      \"\", \"\", tostring(split(ObservableKey, \":\", 0)))\n     | where IndicatorType\
      \ in (\"ipv4-addr\", \"ipv6-addr\", \"network-traffic\")\n     | extend NetworkSourceIP\
      \ = toupper(ObservableValue)\n     | extend TrafficLightProtocolLevel = tostring(parse_json(AdditionalFields).TLPLevel)\n\
      \     | where isnotempty(NetworkSourceIP)\n| summarize LatestIndicatorTime =\
      \ arg_max(TimeGenerated, *) by Id, ObservableValue // Get the latest indicator\
      \ time for each IndicatorId\n  | extend TI_ipEntity = coalesce(NetworkSourceIP,\
      \ NetworkSourceIP, NetworkSourceIP, NetworkSourceIP) // Combine IP fields into\
      \ a single entity\n  | where IsActive and (ValidUntil > now() or isempty(ValidUntil))\
      \ // Filter for active indicators that have not expired\n  | project-reorder\
      \ *, Tags, TrafficLightProtocolLevel, NetworkSourceIP, Type, TI_ipEntity\n \
      \ | join kind=inner (\n      ASimAuditEventLogs\n      | where EventVendor ==\
      \ \"Workday\" // Filter for Workday events\n      | where TimeGenerated >= ago(dtLookBack)\
      \ // Filter events within the lookback period\n      | where isnotempty(DvcIpAddr)\
      \ // Filter for events with a device IP address\n      | extend WD_TimeGenerated\
      \ = EventStartTime // Rename the event start time column\n      | project WD_TimeGenerated,\
      \ ActorUsername, DvcIpAddr, Operation, Object // Select relevant columns\n \
      \     )\n      on $left.TI_ipEntity == $right.DvcIpAddr // Join on the IP entity\n\
      \      | extend Description = tostring(parse_json(Data).description)\n     \
      \ | extend ActivityGroupNames = extract(@\"ActivityGroup:(\\S+)\", 1, tostring(parse_json(Data).labels))\n\
      \  | project\n      LatestIndicatorTime,\n      Description,\n      ActivityGroupNames,\n\
      \      Id,\n      ValidUntil,\n      Confidence,\n      WD_TimeGenerated,\n\
      \      ActorUsername,\n      DvcIpAddr,\n      Operation,\n      Object // Select\
      \ relevant columns after the join\n  | extend\n      timestamp = WD_TimeGenerated,\n\
      \      Name = tostring(split(ActorUsername, '@', 0)),\n      UPNSuffix = tostring(split(ActorUsername,\
      \ '@', 1)) // Add additional fields for timestamp, name, and UPN suffix"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: TI Map IP entity to Workday(ASimAuditEventLogs)
      description: Detects a match in Workday activity from any IP Indicator of Compromise
        (IOC) provided by Threat Intelligence (TI).
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        ips:
        - id: ip1
          addressColumn: DvcIpAddr
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
      customDetails:
        AccountFullName: ActorUsername
