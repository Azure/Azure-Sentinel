properties:
  id: xdr-2b328487-162d-4034-b472-59f1d53684a1
  displayName: Cisco Cloud Security - Empty User Agent Detected
  status: disabled
  queryCondition:
    queryText: |-
      Cisco_Umbrella
      | where EventType == "proxylogs"
      | where HttpUserAgentOriginal == ''
      | extend Message = "Empty User Agent"
      | project TimeGenerated, Message, SrcIpAddr, DstIpAddr, UrlOriginal
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: Cisco Cloud Security - Empty User Agent Detected
      description: '''Rule helps to detect empty and unusual user agent indicating web browsing activity by an unusual process
        other than a web browser.'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlOriginal
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1001
          subTechniques:
          - T1001.003
