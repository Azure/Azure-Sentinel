properties:
  id: xdr-75297f62-10a8-4fc1-9b2a-12f25c6f05a7
  displayName: Cisco Cloud Security - Connection to Unpopular Website Detected
  status: disabled
  queryCondition:
    queryText: |-
      let top_million_list = Cisco_Umbrella
      | where EventType == "proxylogs"
      | extend Hostname = parse_url(UrlOriginal)["Host"]
      | summarize count() by tostring(Hostname)
      | top 1000000 by count_
      | summarize make_list(Hostname);
      Cisco_Umbrella
      | where EventType == "proxylogs"
      | extend Hostname = parse_url(UrlOriginal)["Host"]
      | where Hostname !in (top_million_list)
      | extend Message = "Connect to unpopular website (possible malicious payload delivery)"
      | project TimeGenerated, Message, SrcIpAddr, DstIpAddr, UrlOriginal
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Cisco Cloud Security - Connection to Unpopular Website Detected
      description: '''Detects first connection to an unpopular website (possible malicious payload delivery).'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlOriginal
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
          subTechniques:
          - T1071.001
      - tactic: Exfiltration
        techniques:
        - technique: T1041
