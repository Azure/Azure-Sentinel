properties:
  id: xdr-b12b3dab-d973-45af-b07e-e29bb34d8db9
  displayName: Cisco Cloud Security - Windows PowerShell User-Agent Detected
  status: disabled
  queryCondition:
    queryText: |-
      Cisco_Umbrella
      | where EventType == "proxylogs"
      | where HttpUserAgentOriginal contains "WindowsPowerShell"
      | extend Message = "Windows PowerShell User Agent"
      | project TimeGenerated, Message, SrcIpAddr, DstIpAddr, UrlOriginal, HttpUserAgentOriginal
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: Cisco Cloud Security - Windows PowerShell User-Agent Detected
      description: '''Rule helps to detect Powershell user-agent activity by an unusual process other than a web browser.'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlOriginal
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1132
      - tactic: DefenseEvasion
        techniques:
        - technique: T1027
      - tactic: Execution
        techniques:
        - technique: T1059
          subTechniques:
          - T1059.001
