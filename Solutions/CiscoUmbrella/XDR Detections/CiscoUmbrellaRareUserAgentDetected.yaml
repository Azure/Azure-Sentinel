properties:
  id: xdr-8c8de3fa-6425-4623-9cd9-45de1dd0569a
  displayName: Cisco Cloud Security - Rare User Agent Detected
  status: disabled
  queryCondition:
    queryText: |-
      let user_agents_list = Cisco_Umbrella
      | where EventType == "proxylogs"
      | summarize count() by HttpUserAgentOriginal
      | summarize make_list(HttpUserAgentOriginal);
      Cisco_Umbrella
      | where EventType == "proxylogs"
      | where HttpUserAgentOriginal !in (user_agents_list)
      | extend Message = "Rare User Agent"
      | project TimeGenerated, Message, SrcIpAddr, DstIpAddr, UrlOriginal, HttpUserAgentOriginal
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Cisco Cloud Security - Rare User Agent Detected
      description: '''Rule helps to detect a rare user-agents indicating web browsing activity by an unusual process other
        than a web browser.'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlOriginal
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
          subTechniques:
          - T1071.001
      - tactic: Exfiltration
        techniques:
        - technique: T1041
