                                'Mozilla/5.0 (Windows; U; Windows NT 5.1; pt-PT; rv:1.9.1.2) Gecko/20090729 Firefox/3.5.2 (.NET CLR 3.5.30729)'
                                ]);
      Cisco_Umbrella
      | where EventType == "proxylogs"
      | where HttpUserAgentOriginal has_any (user_agents)
      | extend Message = "Hack Tool User Agent"
      | project TimeGenerated, Message, SrcIpAddr, DstIpAddr, UrlOriginal, HttpUserAgentOriginal
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: Cisco Cloud Security - Hack Tool User-Agent Detected
      description: '''Detects suspicious user agent strings used by known hack tools'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlOriginal
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
