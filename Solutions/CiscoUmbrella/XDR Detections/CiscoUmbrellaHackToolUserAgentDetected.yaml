  displayName: Cisco Cloud Security - Hack Tool User-Agent Detected
  status: disabled
  queryCondition:
    queryText: |-
      let user_agents=dynamic([
                                '(hydra)',
                                ' arachni/',
                                ' BFAC ',
                                ' brutus ',
                                ' cgichk ',
                                'core-project/1.0',
                                ' crimscanner/',
                                'datacha0s',
                                'dirbuster',
                                'domino hunter',
                                'dotdotpwn',
                                'FHScan Core',
                                'floodgate',
                                'get-minimal',
                                'gootkit auto-rooter scanner',
                                'grendel-scan',
                                ' inspath ',
                                'internet ninja',
                                'jaascois',
                                ' zmeu ',
                                'masscan',
                                ' metis ',
                                'morfeus fucking scanner',
                                'n-stealth',
                                'nsauditor',
                                'pmafind',
                                'security scan',
                                'springenwerk',
                                'teh forest lobster',
                                'toata dragostea',
                                ' vega/',
                                'voideye',
                                'webshag',
                                'webvulnscan',
                                ' whcc/',
                                ' Havij',
                                'absinthe',
                                'bsqlbf',
                                'mysqloit',
                                'pangolin',
                                'sql power injector',
                                'sqlmap',
                                'sqlninja',
                                'uil2pn',
