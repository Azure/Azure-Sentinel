properties:
  id: xdr-de58ee9e-b229-4252-8537-41a4c2f4045e
  displayName: Cisco Cloud Security - Request to blocklisted file type
  status: disabled
  queryCondition:
    queryText: |-
      let file_ext_blocklist = dynamic(['.ps1', '.vbs', '.bat', '.scr']);
      Cisco_Umbrella
      | where EventType == 'proxylogs'
      | where DvcAction =~ 'Allowed'
      | extend file_ext = extract(@'.*(\.\w+)$', 1, UrlOriginal)
      | extend Filename = extract(@'.*\/*\/(.*\.\w+)$', 1, UrlOriginal)
      | where file_ext in (file_ext_blocklist)
      | project TimeGenerated, SrcIpAddr, DstIpAddr, Identities, Filename, UrlOriginal
  schedule:
    frequency: PT10M
  detectionAction:
    alertTemplate:
      title: Cisco Cloud Security - Request to blocklisted file type
      description: '''Detects request to potentially harmful file types (.ps1, .bat, .vbs, etc.).'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlOriginal
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1189
      - tactic: CommandAndControl
        techniques:
        - technique: T1105
