properties:
  id: xdr-b619d1f1-7f39-4c7e-bf9e-afbb46457997
  displayName: Cisco Cloud Security - Crypto Miner User-Agent Detected
  status: disabled
  queryCondition:
    queryText: |-
      Cisco_Umbrella
      | where EventType == "proxylogs"
      | where HttpUserAgentOriginal contains "XMRig" or HttpUserAgentOriginal contains "ccminer"
      | extend Message = "Crypto Miner User Agent"
      | project TimeGenerated, Message, SrcIpAddr, DstIpAddr, UrlOriginal, HttpUserAgentOriginal
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: Cisco Cloud Security - Crypto Miner User-Agent Detected
      description: '''Detects suspicious user agent strings used by crypto miners in proxy logs.'''
      severity: medium
      entityMappings:
        urls:
        - id: url1
          addressColumn: UrlOriginal
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1496
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
          subTechniques:
          - T1071.001
      - tactic: Exfiltration
        techniques:
        - technique: T1041
