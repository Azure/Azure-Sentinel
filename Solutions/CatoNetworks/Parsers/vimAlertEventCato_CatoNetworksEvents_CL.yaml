{
  "id": "7db9faa7-6cf7-46fb-9c60-2d4a03404e7f",
  "Function": {
    "Title": "Cato AlertEvent ASIM parser",
    "Version": "3.0.3",
    "LastUpdated": "2026-11-19"
  },
  "Category": "Microsoft Sentinel Parser",
  "FunctionName": "vimAlertEventCato_CatoNetworksEvents_CL",
  "FunctionAlias": "vimAlertEventCato_CatoNetworksEvents_CL",
  "FunctionQuery": "CatoNetworksEvents_CL\n| where not(disabled)\n// time is epoch milliseconds; ARM's DCR stores that same clock as TimeGenerated.\n// Select the stored column only when the raw time column is absent, never time_str.\n| where tostring(column_ifexists(\"event_sub_type\", \"\")) != \"Flow\"\n| where tostring(column_ifexists(\"source\", \"\")) != \"cato:hec:flows\"\n    and tostring(column_ifexists(\"sourcetype\", \"\")) != \"cato:hec:flows\"\n    and tostring(column_ifexists(\"Type\", \"\")) != \"cato:hec:flows\"\n| extend _CatoCommonRawCount = column_ifexists(\"event_count\", dynamic(null)),\n    _CatoCommonClock = column_ifexists(\"time\",\n        datetime_diff(\"millisecond\", column_ifexists(\"TimeGenerated\", datetime(null)), datetime(1970-01-01))),\n    _CatoCommonExtra = todynamic(column_ifexists(\"AdditionalFields\", \"{}\"))\n| extend _CatoCommonCountText = tostring(_CatoCommonRawCount),\n    _CatoCommonCount = tolong(_CatoCommonRawCount),\n    _CatoCommonSourceTime = unixtime_milliseconds_todatetime(tolong(tostring(_CatoCommonClock)))\n| where isnull(_CatoCommonRawCount)\n    or (_CatoCommonCountText matches regex @\"^[0-9]+$\" and _CatoCommonCount between (1 .. 2147483647))\n| where isnotnull(_CatoCommonSourceTime)\n| where (isnull(starttime) or _CatoCommonSourceTime >= starttime)\n    and (isnull(endtime) or _CatoCommonSourceTime <= endtime)\n| extend\n    TimeGenerated = _CatoCommonSourceTime,\n    EventStartTime = _CatoCommonSourceTime,\n    EventEndTime = _CatoCommonSourceTime,\n    EventCount = toint(coalesce(_CatoCommonCount, long(1))),\n    EventVendor = \"Cato Networks\",\n    EventProduct = \"Cato Cloud\",\n    EventSchemaVersion = \"1.0.0\",\n    EventOriginalType = tostring(column_ifexists(\"event_type\", \"\")),\n    EventOriginalSubType = tostring(column_ifexists(\"event_sub_type\", \"\")),\n    EventOriginalUid = tostring(column_ifexists(\"event_id\", \"\")),\n    EventUid = tostring(column_ifexists(\"_ItemId\", \"\")),\n    AdditionalFields = iff(gettype(_CatoCommonExtra) == \"dictionary\", _CatoCommonExtra, dynamic({})),\n    Dvc = \"Cato Cloud\",\n    DvcScopeId = tostring(column_ifexists(\"account_id\", \"\")),\n    DvcScope = tostring(column_ifexists(\"account_name\", \"\"))\n| extend _CatoCommonAuthenticated = EventOriginalType == \"Connectivity\" and EventOriginalSubType == \"Authenticated\",\n    _CatoCommonPopScope = EventOriginalType == \"Security\" and EventOriginalSubType in (\n        \"Internet Firewall\", \"WAN Firewall\", \"LAN Firewall\", \"IPS\", \"Suspicious Activity\",\n        \"Dynamic Prevention\", \"DNS Protection\", \"Agentic Threat Prevention\", \"Private Access Policy\",\n        \"RPF\", \"Anti Malware\", \"Apps Security\", \"Misclassification\", \"NG Anti Malware\", \"SDP Activity\", \"TLS\")\n| extend EventMessage = iff(_CatoCommonAuthenticated\n        or (EventOriginalType == \"Security\" and EventOriginalSubType in (\"Data Security Alert\", \"Email Security Alert\")),\n        tostring(column_ifexists(\"event_message\", \"\")), \"\"),\n    DvcOriginalAction = iff(_CatoCommonAuthenticated\n        or (EventOriginalType == \"System\" and EventOriginalSubType == \"Audit\")\n        or (EventOriginalType == \"Security\" and EventOriginalSubType in (\n            \"Internet Firewall\", \"WAN Firewall\", \"LAN Firewall\", \"IPS\", \"Suspicious Activity\",\n            \"Dynamic Prevention\", \"DNS Protection\", \"Agentic Threat Prevention\", \"Private Access Policy\",\n            \"RPF\", \"Anti Malware\", \"Apps Security\", \"NG Anti Malware\", \"SDP Activity\", \"TLS\",\n            \"SaaS Security API Anti Malware\", \"SaaS Security API Data Protection\", \"Endpoint Protection\")),\n        tostring(column_ifexists(\"action\", \"\")), \"\"),\n    AdditionalFields = bag_merge(AdditionalFields,\n        iff((_CatoCommonAuthenticated or _CatoCommonPopScope) and isnotempty(tostring(column_ifexists(\"pop_name\", \"\"))),\n            bag_pack(\"CatoPopName\", tostring(column_ifexists(\"pop_name\", \"\"))), dynamic({})))\n| project-away _CatoCommon*\n| extend _CatoSecurity = EventOriginalType == 'Security',\n    _CatoXdr = EventOriginalType == 'Detection and Response',\n    _CatoSystemAlert = EventOriginalType == 'System' and EventOriginalSubType == 'Alert Triggered',\n    _CatoEventId = iff(gettype(column_ifexists('event_id', '')) == 'string', tostring(column_ifexists('event_id', '')), '')\n// Apply the conservative Security baseline; D&R and System alerts remain explicit extensions.\n| where (_CatoSecurity and (\n        (EventOriginalSubType in ('Anti Malware', 'SaaS Security API Anti Malware')\n            and gettype(column_ifexists('threat_name', '')) == 'string'\n            and isnotempty(trim(@'\\s+', tostring(column_ifexists('threat_name', '')))))\n        or (EventOriginalSubType == 'Endpoint Protection' and (\n            (gettype(column_ifexists('threat_name', '')) == 'string'\n                and isnotempty(trim(@'\\s+', tostring(column_ifexists('threat_name', '')))))\n            or (gettype(column_ifexists('detection_name', '')) == 'string'\n                and isnotempty(trim(@'\\s+', tostring(column_ifexists('detection_name', '')))))))\n        or EventOriginalSubType in ('Data Security Alert', 'Email Security Alert')))\n    or _CatoXdr or _CatoSystemAlert\n| where isnotempty(trim(@'\\s+', _CatoEventId))\n| extend _CatoXdrKnown = _CatoXdr and EventOriginalSubType in (\n        'XDR Account Operations', 'XDR Anomaly', 'XDR CDR', 'XDR Endpoint',\n        'XDR Generic Producer', 'XDR Network', 'XDR Predictive', 'XDR Threat'),\n    _CatoXdrUser = _CatoXdr and EventOriginalSubType in ('XDR Anomaly', 'XDR Endpoint', 'XDR Threat'),\n    _CatoXdrThreat = _CatoXdr and EventOriginalSubType in (\n        'XDR Anomaly', 'XDR CDR', 'XDR Endpoint', 'XDR Generic Producer', 'XDR Threat'),\n    _CatoAntiMalware = _CatoSecurity and EventOriginalSubType == 'Anti Malware',\n    _CatoSaasMalware = _CatoSecurity and EventOriginalSubType == 'SaaS Security API Anti Malware',\n    _CatoEndpoint = _CatoSecurity and EventOriginalSubType == 'Endpoint Protection'\n// Admission does not imply field availability: each scope follows its detailed mapping row.\n| extend _CatoFileScope = _CatoAntiMalware or _CatoSaasMalware or _CatoEndpoint or _CatoSystemAlert,\n    _CatoUserScope = _CatoAntiMalware or _CatoSaasMalware or _CatoEndpoint or _CatoXdrUser or _CatoSystemAlert,\n    _CatoDeviceScope = _CatoAntiMalware or _CatoEndpoint or _CatoXdrUser or _CatoSystemAlert,\n    _CatoRuleScope = _CatoAntiMalware or _CatoSaasMalware or _CatoXdrKnown or _CatoSystemAlert,\n    _CatoHostIpScope = _CatoAntiMalware or (_CatoXdr and EventOriginalSubType == 'XDR Network') or _CatoSystemAlert,\n    _CatoNetworkSrcScope = _CatoAntiMalware or _CatoSaasMalware or _CatoXdrUser or _CatoSystemAlert,\n    _CatoNetworkDstScope = _CatoAntiMalware or _CatoSystemAlert\n| extend EventSchema = 'AlertEvent', EventType = 'Alert',\n    EventUid = _CatoEventId, EventOriginalUid = _CatoEventId,\n    EventSubType = case(_CatoSecurity, 'Threat',\n        _CatoXdr and EventOriginalSubType == 'XDR Anomaly', 'Anomaly',\n        _CatoSystemAlert or (_CatoXdr and EventOriginalSubType in ('XDR Account Operations', 'XDR Network')), 'Compliance Violation',\n        'Suspicious Activity'),\n    EventMessage = iff((_CatoXdrKnown or _CatoSystemAlert\n        or (_CatoSecurity and EventOriginalSubType in ('Data Security Alert', 'Email Security Alert')))\n        and gettype(column_ifexists('event_message', '')) == 'string', tostring(column_ifexists('event_message', '')), ''),\n    _CatoIndication = iff(_CatoXdrKnown and gettype(column_ifexists('indication', '')) == 'string',\n        tostring(column_ifexists('indication', '')), ''),\n    RuleName = iff(_CatoRuleScope and gettype(column_ifexists('rule_name', '')) == 'string',\n        tostring(column_ifexists('rule_name', '')), ''),\n    ThreatName = iff((_CatoAntiMalware or _CatoSaasMalware or _CatoEndpoint or _CatoXdrThreat or _CatoSystemAlert)\n        and gettype(column_ifexists('threat_name', '')) == 'string', tostring(column_ifexists('threat_name', '')), ''),\n    ThreatOriginalCategory = iff((_CatoEndpoint or _CatoXdrThreat or _CatoSystemAlert)\n        and gettype(column_ifexists('threat_type', '')) == 'string', tostring(column_ifexists('threat_type', '')), ''),\n    Username = iff(_CatoUserScope and gettype(column_ifexists('user_name', '')) == 'string',\n        tostring(column_ifexists('user_name', '')), ''),\n    UserId = iff(_CatoUserScope and gettype(column_ifexists('user_id', '')) == 'string',\n        tostring(column_ifexists('user_id', '')), ''),\n    _CatoFileSize = iff(_CatoFileScope, tostring(column_ifexists('file_size', '')), ''),\n    _CatoRemediation = iff((_CatoXdrUser or (_CatoSecurity and EventOriginalSubType == 'Data Security Alert'))\n        and gettype(column_ifexists('recommended_actions', '')) in ('array', 'string'),\n        parse_json(tostring(column_ifexists('recommended_actions', ''))), dynamic(null)),\n    _CatoClassification = iff(_CatoSecurity and EventOriginalSubType == 'Email Security Alert'\n        and gettype(column_ifexists('classification', '')) == 'string', tostring(column_ifexists('classification', '')), ''),\n    _CatoHostIp = iff(_CatoHostIpScope, tostring(column_ifexists('host_ip', '')), ''),\n    _CatoHostMac = iff(_CatoDeviceScope, tostring(column_ifexists('host_mac', '')), ''),\n    _CatoProcessId = iff(_CatoEndpoint, tostring(column_ifexists('src_pid', '')), '')\n| extend AlertName = coalesce(_CatoIndication, RuleName),\n    ThreatCategory = case(\n        ThreatOriginalCategory =~ 'Malware', 'Malware', ThreatOriginalCategory =~ 'Ransomware', 'Ransomware',\n        ThreatOriginalCategory =~ 'Trojan', 'Trojan', ThreatOriginalCategory =~ 'Virus', 'Virus',\n        ThreatOriginalCategory =~ 'Worm', 'Worm', ThreatOriginalCategory =~ 'Adware', 'Adware',\n        ThreatOriginalCategory =~ 'Spyware', 'Spyware', ThreatOriginalCategory =~ 'Rootkit', 'Rootkit',\n        ThreatOriginalCategory =~ 'Cryptominer', 'Cryptominer', ThreatOriginalCategory =~ 'Phishing', 'Phishing',\n        ThreatOriginalCategory =~ 'Spam', 'Spam', ThreatOriginalCategory =~ 'MaliciousUrl', 'MaliciousUrl',\n        ThreatOriginalCategory =~ 'Spoofing', 'Spoofing',\n        ThreatOriginalCategory =~ 'Security Policy Violation', 'Security Policy Violation',\n        isempty(ThreatOriginalCategory), '', 'Unknown'),\n    UsernameType = case(isempty(Username), '',\n        Username matches regex @'^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$', 'UPN',\n        Username matches regex @'^[^\\\\]+\\\\[^\\\\]+$', 'Windows',\n        Username matches regex @'(?i)^(CN|UID)=.+,.+=.+$', 'DN', 'Simple'),\n    FileName = iff(_CatoFileScope and gettype(column_ifexists('file_name', '')) == 'string',\n        extract(@'([^/\\\\]+)$', 1, tostring(column_ifexists('file_name', ''))), ''),\n    FileSize = iff(_CatoFileSize matches regex @'^[0-9]+$', tolong(_CatoFileSize), long(null)),\n    // No documented algorithm discriminator exists: neither hash length nor md5 establishes file_hash's algorithm.\n    FileMD5 = '', FileSHA1 = '', FileSHA256 = '',\n    Url = iff((_CatoAntiMalware or _CatoSaasMalware or _CatoSystemAlert)\n        and gettype(column_ifexists('full_path_url', '')) == 'string', tostring(column_ifexists('full_path_url', '')), ''),\n    AttackRemediationSteps = iff(gettype(_CatoRemediation) == 'array', strcat_array(_CatoRemediation, '\\n'),\n        iff(gettype(_CatoRemediation) == 'string', tostring(_CatoRemediation), '')),\n    AlertVerdict = case(_CatoClassification in~ ('FALSE_POSITIVE', 'False Positive'), 'False Positive',\n        _CatoClassification in~ ('TRUE_POSITIVE', 'True Positive'), 'True Positive',\n        _CatoClassification in~ ('BENIGN_POSITIVE', 'Benign Positive'), 'Benign Positive', ''),\n    DvcId = iff((_CatoAntiMalware or (_CatoXdr and EventOriginalSubType == 'XDR Endpoint') or _CatoSystemAlert)\n        and gettype(column_ifexists('device_id', '')) == 'string', tostring(column_ifexists('device_id', '')), ''),\n    DvcHostname = iff(_CatoDeviceScope and gettype(column_ifexists('device_name', '')) == 'string',\n        tostring(column_ifexists('device_name', '')), ''),\n    DvcIpAddr = iff(_CatoHostIp !contains '/' and isnotempty(parse_ipv6(_CatoHostIp)), _CatoHostIp, ''),\n    DvcMacAddr = iff(_CatoHostMac matches regex @'(?i)^([0-9a-f]{2}:){5}[0-9a-f]{2}$'\n        or _CatoHostMac matches regex @'(?i)^([0-9a-f]{2}-){5}[0-9a-f]{2}$', _CatoHostMac, ''),\n    DvcOs = iff(_CatoDeviceScope and gettype(column_ifexists('os_type', '')) == 'string',\n        tostring(column_ifexists('os_type', '')), ''),\n    DvcOsVersion = iff((_CatoAntiMalware or _CatoEndpoint or (_CatoXdr and EventOriginalSubType == 'XDR Endpoint') or _CatoSystemAlert)\n        and gettype(column_ifexists('os_version', '')) == 'string', tostring(column_ifexists('os_version', '')), ''),\n    ProcessName = iff(_CatoEndpoint and gettype(column_ifexists('src_process_path', '')) == 'string',\n        tostring(column_ifexists('src_process_path', '')), ''),\n    ProcessId = iff(_CatoProcessId matches regex @'^[0-9]+$' and isnotnull(tolong(_CatoProcessId)), _CatoProcessId, ''),\n    ProcessCommandLine = iff(_CatoEndpoint and gettype(column_ifexists('src_process_cmdline', '')) == 'string',\n        tostring(column_ifexists('src_process_cmdline', '')), '')\n| extend AlertId = EventUid, AlertDescription = EventMessage, User = Username,\n    UserIdType = iff(isnotempty(UserId), 'Other', ''), Rule = RuleName,\n    DvcIdType = iff(isnotempty(DvcId), 'Other', ''),\n    Dvc = coalesce(DvcId, DvcHostname, DvcIpAddr, 'Cato Cloud'),\n    IpAddr = DvcIpAddr, Hostname = DvcHostname,\n    AdditionalFields = bag_merge(\n        bag_pack('CatoFileHash', iff(_CatoFileScope, column_ifexists('file_hash', ''), ''),\n            'CatoNetworkContext', bag_pack(\n                'src_ip', iff(_CatoNetworkSrcScope, tostring(column_ifexists('src_ip', '')), ''),\n                'dest_ip', iff(_CatoNetworkDstScope, tostring(column_ifexists('dest_ip', '')), ''),\n                'src_port', iff(_CatoNetworkDstScope, tolong(column_ifexists('src_port', long(null))), long(null)),\n                'dest_port', iff(_CatoNetworkDstScope, tolong(column_ifexists('dest_port', long(null))), long(null)))),\n        AdditionalFields)\n| where isempty(tostring(ipaddr_has_any_prefix)) or tostring(ipaddr_has_any_prefix) == '[]' or has_any_ipv4_prefix(DvcIpAddr, ipaddr_has_any_prefix)\n| where isempty(tostring(hostname_has_any)) or tostring(hostname_has_any) == '[]' or DvcHostname has_any (hostname_has_any)\n| where isempty(tostring(username_has_any)) or tostring(username_has_any) == '[]' or Username has_any (username_has_any)\n// These optional filter roles have no mapped normalized fields in the approved AlertEvent table.\n| where isempty(tostring(attacktactics_has_any)) or tostring(attacktactics_has_any) == '[]'\n| where isempty(tostring(attacktechniques_has_any)) or tostring(attacktechniques_has_any) == '[]'\n| where isempty(tostring(eventseverity_has_any)) or tostring(eventseverity_has_any) == '[]'\n| where isempty(tostring(threatcategory_has_any)) or tostring(threatcategory_has_any) == '[]' or ThreatCategory has_any (threatcategory_has_any)\n| where isempty(tostring(alertverdict_has_any)) or tostring(alertverdict_has_any) == '[]' or AlertVerdict has_any (alertverdict_has_any)\n| project-away _CatoSecurity, _CatoXdr, _CatoSystemAlert, _CatoEventId,\n    _CatoXdrKnown, _CatoXdrUser, _CatoXdrThreat, _CatoAntiMalware, _CatoSaasMalware, _CatoEndpoint,\n    _CatoFileScope, _CatoUserScope, _CatoDeviceScope, _CatoRuleScope, _CatoHostIpScope,\n    _CatoNetworkSrcScope, _CatoNetworkDstScope, _CatoIndication, _CatoFileSize, _CatoRemediation,\n    _CatoClassification, _CatoHostIp, _CatoHostMac, _CatoProcessId\n| extend AdditionalFields = iff(pack, bag_merge(AdditionalFields, pack_all(true)), AdditionalFields)",
