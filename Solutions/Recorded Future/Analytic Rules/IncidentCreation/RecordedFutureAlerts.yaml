id: 0aded97e-4e2d-4e4d-93cf-4a7e45c7bab3
name: Recorded Future Alerts Incident Creation
description: |
  'Create Recorded Future Classic Alerts in Microsoft Defender'
severity: Medium
status: Available
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
requiredDataConnectors:
  - connectorId: RecordedFuture
    dataTypes:
      - RecordedFutureClassicAlerts_V2_CL
query: |
  RecordedFutureClassicAlerts_V2_CL
  | where TimeGenerated >= now(-1h)
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: 'Alert: {{AlertName}}'
  alertDescriptionFormat: |
    _Recorded Future Alert_

    AlertID:
    {{AlertID}}

    Triggered: {{Triggered}}

    AI Summary: {{AISummary}}
  alertDynamicProperties:
    - alertProperty: AlertLink
      value: URL
customDetails:
  RuleName: RuleName
  RuleId: RuleId
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 1h
    matchingMethod: Selected
    groupByCustomDetails:
      - RuleId
version: 2.0.0
kind: NRT
