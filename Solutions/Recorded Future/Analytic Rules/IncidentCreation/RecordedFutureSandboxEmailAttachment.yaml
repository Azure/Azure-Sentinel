id: a1b2c3d4-5678-90ab-cdef-222222222222
name: Recorded Future Sandbox - Malicious Email Attachment
description: |
  'Creates incidents when Recorded Future Sandbox detects malicious files from Outlook email attachments'
severity: High
status: Available
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
requiredDataConnectors:
  - connectorId: RecordedFuture
    dataTypes:
      - RecordedFutureSandboxResults_V2_CL
query: |
  RecordedFutureSandboxResults_V2_CL
  | where TimeGenerated >= now(-1h)
  | where Source == "OutlookAttachment"
  | where toint(SandboxScore) >= 50
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: 'Malicious Email Attachment: {{FileName}} from {{EmailFrom}}'
  alertDescriptionFormat: |
    _Recorded Future Sandbox - Malicious Email Attachment Detected_

    **Sandbox Score:** {{SandboxScore}}/100

    **Verdict:** {{SandboxVerdict}}

    **Sample ID:** {{SampleId}}

    A malicious file was detected in an email attachment. Review the full sandbox report and investigate the sender.
customDetails:
  Source: Source
  SandboxScore: SandboxScore
  SandboxVerdict: SandboxVerdict
  FileName: FileName
  SampleId: SampleId
  EmailFrom: EmailFrom
  EmailTo: EmailTo
entityMappings:
  - entityType: File
    fieldMappings:
      - identifier: Name
        columnName: FileName
  - entityType: Mailbox
    fieldMappings:
      - identifier: MailboxPrimaryAddress
        columnName: EmailFrom
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 1h
    matchingMethod: Selected
    groupByCustomDetails:
      - EmailFrom
version: 2.0.0
kind: NRT
