properties:
  id: xdr-1267d53d-f5fd-418b-b8da-34453a5994c2
  displayName: Google DNS - CVE-2020-1350 (SIGRED) exploitation pattern
  status: disabled
  queryCondition:
    queryText: 'let threshold = 15;

      GCPCloudDNS

      | where QueryTypeName in~ (''SIG'', ''RRSIG'')

      | where NetworkProtocol =~ ''TCP''

      | summarize count() by SrcIpAddr, bin(TimeGenerated, 1m)

      | where count_ < threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT15M
  detectionAction:
    alertTemplate:
      title: Google DNS - CVE-2020-1350 (SIGRED) exploitation pattern
      description: '''Detects exploitation pattern of CVE-2020-1350 (SIGRED) vulnerability.'''
      severity: high
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: PrivilegeEscalation
        techniques:
        - technique: T1068
