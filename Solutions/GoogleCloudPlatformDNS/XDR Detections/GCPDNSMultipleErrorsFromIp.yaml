properties:
  id: xdr-7e81a935-5e91-45a5-92fd-3b58c180513b
  displayName: Google DNS - Multiple errors for source
  status: disabled
  queryCondition:
    queryText: 'let threshold = 10;

      let err = dynamic([''NXDOMAIN'', ''SERVFAIL'', ''REFUSED'']);

      GCPCloudDNS

      | where EventResultDetails in~ (err)

      | summarize count() by SrcIpAddr, bin(TimeGenerated, 10m)

      | where count_ > threshold

      | extend IPCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Google DNS - Multiple errors for source
      description: '''Detects multiple errors for the same source IP address.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1095
