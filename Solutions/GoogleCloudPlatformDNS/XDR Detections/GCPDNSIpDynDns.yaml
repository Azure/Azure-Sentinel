      let dyndns = dynamic(['noip.com', 'dynu.com', 'dyn.com', 'dynv6.com']);
      GCPCloudDNS
      | where Query in~ (dyndns)
      | extend DNSCustomEntity = Query, IPCustomEntity = SrcIpAddr
