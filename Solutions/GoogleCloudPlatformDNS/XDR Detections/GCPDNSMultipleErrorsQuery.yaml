properties:
  id: xdr-da04a5d6-e2be-4cba-8cdb-a3f2efa87e9e
  displayName: Google DNS - Multiple errors to same domain
  status: disabled
  queryCondition:
    queryText: |-
      let GCPCloudDNS = view () {
          let DNSQuery_GcpDns_empty = datatable(
              TimeGenerated:datetime,
              Query:string,
              QueryTypeName:string,
              ResponseName:string,
              EventResultDetails:string,
              NetworkProtocol:string,
              SrcIpAddr:string,
              EventOriginalUid:string,
              EventSeverity:string,
              EventCount:int,
              EventProduct:string,
              EventVendor:string,
              EventSchemaVersion:string,
              Dvc:string,
              EventType:string,
              EventResult:string,
              EventSubType:string,
              EventEndTime:datetime,
              ResponseCodeName:string,
              Domain:string,
              IpAddr:string,
              EventStartTime:datetime,
              payload_serverLatency_d:real
          )[];
          let DNSQuery_GcpDns = union isfuzzy=true GCP_DNS_CL, DNSQuery_GcpDns_empty
          | extend
              Query=column_ifexists('payload_queryName_s', ''),
              QueryTypeName=column_ifexists('payload_queryType_s', ''),
              ResponseName=column_ifexists('payload_rdata_s', ''),
              EventResultDetails=column_ifexists('payload_responseCode_s', ''),
              NetworkProtocol=column_ifexists('payload_protocol_s', ''),
              SrcIpAddr=column_ifexists('payload_sourceIP_s', ''),
              EventOriginalUid=column_ifexists('insert_id_s', ''),
              EventSeverity=column_ifexists('severity_s', ''),
              EventCount=(1),
              EventProduct="Cloud DNS",
              EventVendor="GCP",
              EventSchemaVersion="0.1.0",
              Dvc="GCPDNS",
              EventType=iif(column_ifexists('resource_type_s', '') == "dns_query", "lookup", column_ifexists('resource_type_s', '')),
              EventResult=iff(EventResultDetails =~ 'NOERROR', 'Success', 'Failure'),
              EventSubType='response',
              EventEndTime=todatetime(column_ifexists('timestamp_t', ''))
          | extend
              ResponseCodeName=EventResultDetails,
              Domain=Query,
              IpAddr=SrcIpAddr,
              EventStartTime=EventEndTime;
          let DNSQuery_GcpDnsV2 = union isfuzzy=true GCPDNS, DNSQuery_GcpDns_empty
          | extend
              Query=column_ifexists('QueryName', ''),
              QueryTypeName=column_ifexists('QueryType', ''),
              ResponseName=column_ifexists('Rdata', ''),
              EventResultDetails=column_ifexists('ResponseCode', ''),
              NetworkProtocol=column_ifexists('Protocol', ''),
              SrcIpAddr=column_ifexists('SourceIP', ''),
              EventOriginalUid=column_ifexists('InsertId', ''),
              EventSeverity=column_ifexists('Severity', ''),
              EventCount=(1),
              EventProduct="Cloud DNS",
              EventVendor="GCP",
              EventSchemaVersion="0.1.0",
              Dvc="GCPDNS",
              EventType=iif(column_ifexists('ResourceType', '') == "dns_query", "lookup", column_ifexists('ResourceType', '')),
              EventResult=iff(EventResultDetails =~ 'NOERROR', 'Success', 'Failure'),
              EventSubType='response',
              EventEndTime=todatetime(column_ifexists('Timestamp', ''))
          | extend
              ResponseCodeName=EventResultDetails,
              Domain=Query,
              IpAddr=SrcIpAddr,
              EventStartTime=EventEndTime,
              payload_serverLatency_d=toreal(column_ifexists('ServerLatency', ''));
          union isfuzzy=true DNSQuery_GcpDns, DNSQuery_GcpDnsV2
          | project-reorder Query, QueryTypeName, ResponseName, EventResultDetails, NetworkProtocol, SrcIpAddr, EventOriginalUid, EventSeverity, EventCount, EventProduct, EventVendor, EventSchemaVersion, Dvc, EventType, EventResult, EventSubType, EventEndTime, ResponseCodeName, Domain, IpAddr, EventStartTime
      };
      let threshold = 2;
      let err = dynamic(['NXDOMAIN', 'SERVFAIL', 'REFUSED']);
      GCPCloudDNS
      | where EventResultDetails in~ (err)
      | summarize ips = makeset(SrcIpAddr) by Query, bin(TimeGenerated, 10m)
      | where array_length(ips) >= threshold
      | extend DNSCustomEntity = Query, IPCustomEntity = tostring(ips[0])
      | extend ips = strcat_array(ips, ', ')
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Google DNS - Multiple errors to same domain
      description: '''Detects multiple errors to same domain.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1095
      customDetails:
        DNSDomainName: DNSCustomEntity
