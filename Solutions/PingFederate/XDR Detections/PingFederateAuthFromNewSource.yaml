properties:
  id: xdr-30583ed4-d13c-43b8-baf2-d75fbe727210
  displayName: Ping Federate - Authentication from new IP.
  status: disabled
  queryCondition:
    queryText: 'let known_src =

      PingFederateEvent

      | where TimeGenerated between (ago(14d) .. ago(1d))

      | where EventType in~ (''AUTHN_ATTEMPT'', ''SSO'')

      | where isnotempty(SrcIpAddr)

      | summarize makeset(SrcIpAddr);

      PingFederateEvent

      | where EventType in~ (''AUTHN_ATTEMPT'', ''SSO'')

      | where isnotempty(SrcIpAddr)

      | where SrcIpAddr !in (known_src)

      | extend AccountCustomEntity = DstUserName

      | extend IpCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ping Federate - Authentication from new IP.
      description: '''Detects authentication requests from new IP address.'''
      severity: low
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IpCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
