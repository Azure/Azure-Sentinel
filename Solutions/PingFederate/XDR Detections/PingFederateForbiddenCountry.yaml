properties:
  id: xdr-14042f74-e50b-4c21-8a01-0faf4915ada4
  displayName: Ping Federate - Forbidden country
  status: disabled
  queryCondition:
    queryText: 'let forbidden_geo = dynamic([''CH'']);

      PingFederateEvent

      | where isnotempty(DstGeoCountry)

      | where tostring(DstGeoCountry) in~ (forbidden_geo)

      | extend AccountCustomEntity = DstUserName

      | extend IpCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ping Federate - Forbidden country
      description: '''Detects requests from forbidden countries.'''
      severity: high
