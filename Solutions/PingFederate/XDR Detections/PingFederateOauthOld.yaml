properties:
  id: xdr-85f70197-4865-4635-a4b2-a9c57e8fea1b
  displayName: Ping Federate - OAuth old version
  status: disabled
  queryCondition:
    queryText: "// PingFederateEvent parser inlined: Defender XDR cannot resolve Sentinel\
      \ workspace functions.\nlet xdr_inline_PingFederateEvent = view () {\nCommonSecurityLog\
      \ \n| where DeviceProduct has 'PingFederate'\n| extend EventVendor = DeviceVendor\n\
      | extend EventProduct = DeviceProduct\n| extend EventProductVersion = DeviceVersion\n\
      | extend EventSeverity = LogSeverity\n| extend SrcIpAddr = SourceIP\n| extend\
      \ SrcHostname = SourceHostName\n| extend SrcUserName = SourceUserName\n| extend\
      \ EventMessage = Message\n| extend EventSubType = DeviceEventClassID\n| extend\
      \ EventType = Activity\n| extend DstUserName = DestinationUserID\n| extend DstGeoCountry\
      \ = extract(@'country=;?(\\w+),.*', 1, AdditionalExtensions)\n| extend EventResultDetails\
      \ = extract(@'description=(.*?),.*', 1, AdditionalExtensions)\n| extend DvcHostname\
      \ = DeviceAddress\n| project TimeGenerated\n        , EventVendor\n        ,\
      \ EventProduct\n        , EventProductVersion\n        , EventMessage\n    \
      \    , EventType\n        , EventSubType\n        , DstUserName\n        , DstGeoCountry\n\
      \        , DvcHostname\n        , EventSeverity\n        , SrcIpAddr\n     \
      \   , SrcHostname\n        , SrcUserName\n        , EventResultDetails\n   \
      \     , DeviceCustomString1Label\n        , DeviceCustomString1\n        , DeviceCustomString2Label\n\
      \        , DeviceCustomString2\n        , DeviceCustomString3Label\n       \
      \ , DeviceCustomString3\n        , DeviceCustomString4Label\n        , DeviceCustomString4\n\
      \        , DeviceCustomString5Label\n        , DeviceCustomString5\n       \
      \ , DeviceCustomString6Label\n        , DeviceCustomString6\n        , AdditionalExtensions\n\
      };\nxdr_inline_PingFederateEvent\n| where isnotempty(DeviceCustomString3)\n\
      | extend proto = extract(@'(OAuth)', 1, DeviceCustomString3)\n| extend ver =\
      \ extract(@'(\\d+)', 1, DeviceCustomString3)\n| where proto =~ 'OAuth'\n| where\
      \ ver !~ '20'\n| extend AccountCustomEntity = DstUserName\n| extend IpCustomEntity\
      \ = SrcIpAddr"
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Ping Federate - OAuth old version
      description: '''Detects requests using not the latest version of OAuth protocol.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IpCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      customDetails:
        AccountName: AccountCustomEntity
