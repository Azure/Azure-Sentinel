properties:
  id: xdr-fddd3840-acd2-41ed-94d9-1474b0a7c8a6
  displayName: Ping Federate - SAML old version
  status: disabled
  queryCondition:
    queryText: 'PingFederateEvent

      | where isnotempty(DeviceCustomString3)

      | extend proto = extract(@''(SAML)'', 1, DeviceCustomString3)

      | extend ver = extract(@''(\d+)'', 1, DeviceCustomString3)

      | where proto =~ ''SAML''

      | where ver !~ ''20''

      | extend AccountCustomEntity = DstUserName

      | extend IpCustomEntity = SrcIpAddr'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Ping Federate - SAML old version
      description: '''Detects requests using not the latest version of SAML protocol.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IpCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1190
      customDetails:
        AccountName: AccountCustomEntity
