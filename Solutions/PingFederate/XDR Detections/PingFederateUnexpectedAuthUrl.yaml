properties:
  id: xdr-9578ef7f-cbb4-4e9a-bd26-37c15c53b413
  displayName: Ping Federate - Unexpected authentication URL.
  status: disabled
  queryCondition:
    queryText: 'let known_domains =

      PingFederateEvent

      | where TimeGenerated between (ago(14d) .. ago(1d))

      | where isnotempty(DeviceCustomString1)

      | extend url_parsed = parse_url(DeviceCustomString1)

      | extend url_domain = extract(@''.*\.(.*\.[a-z]+)'', 1, tostring(url_parsed.Host))

      | summarize makeset(url_domain);

      PingFederateEvent

      | where isnotempty(DeviceCustomString1)

      | extend url_parsed = parse_url(DeviceCustomString1)

      | extend url_domain = extract(@''.*\.(.*\.[a-z]+)'', 1, tostring(url_parsed.Host))

      | where url_domain !in (known_domains)

      | extend AccountCustomEntity = DstUserName

      | extend IpCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ping Federate - Unexpected authentication URL.
      description: '''Detects unexpected authentication URL.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IpCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
