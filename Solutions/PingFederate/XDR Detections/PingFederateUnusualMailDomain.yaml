properties:
  id: xdr-dc79de7d-2590-4852-95fb-f8e02b34f4da
  displayName: Ping Federate - Unusual mail domain.
  status: disabled
  queryCondition:
    queryText: 'let known_domains =

      PingFederateEvent

      | where TimeGenerated between (ago(14d) .. ago(1d))

      | extend email = extract(@''email=(.*?),.*'', 1, AdditionalExtensions)

      | extend m_domain = extract(@''@(.*)'', 1, email)

      | where isnotempty(m_domain)

      | summarize makeset(m_domain);

      PingFederateEvent

      | extend email = extract(@''email=(.*?),.*'', 1, AdditionalExtensions)

      | extend m_domain = extract(@''@(.*)'', 1, email)

      | where isnotempty(m_domain)

      | where m_domain !in (known_domains)

      | extend AccountCustomEntity = DstUserName

      | extend IpCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ping Federate - Unusual mail domain.
      description: '''Detects unusual mail domain in authentication requests.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IpCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
