properties:
  id: xdr-64e65105-c4fc-4c28-a4e9-bb1a3ce7652d
  displayName: Ping Federate - Unexpected country for user
  status: disabled
  queryCondition:
    queryText: 'let known_countries =

      PingFederateEvent

      | where TimeGenerated between (ago(1d) .. ago(1h))

      | where isnotempty(DstGeoCountry)

      | summarize makeset(DstGeoCountry);

      PingFederateEvent

      | where isnotempty(DstGeoCountry)

      | where DstGeoCountry !in (known_countries)

      | extend AccountCustomEntity = DstUserName

      | extend IpCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ping Federate - Unexpected country for user
      description: '''Detects requests from different countries for user in shotr
        term.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IpCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
