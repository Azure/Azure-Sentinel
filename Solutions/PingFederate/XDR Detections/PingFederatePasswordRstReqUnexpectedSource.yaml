properties:
  id: xdr-2d201d21-77b4-4d97-95f3-26b5c6bde09f
  displayName: Ping Federate - Password reset request from unexpected source IP address..
  status: disabled
  queryCondition:
    queryText: 'let known_src =

      PingFederateEvent

      | where TimeGenerated between (ago(14d) .. ago(1d))

      | where isnotempty(SrcIpAddr)

      | summarize makeset(SrcIpAddr);

      PingFederateEvent

      | where EventType =~ ''PWD_RESET_REQUEST''

      | where isnotempty(SrcIpAddr)

      | where SrcIpAddr !in (known_src)

      | extend AccountCustomEntity = DstUserName

      | extend IpCustomEntity = SrcIpAddr'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ping Federate - Password reset request from unexpected source IP address..
      description: '''Detects password reset requests from unexpected source IP address.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IpCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountName: AccountCustomEntity
