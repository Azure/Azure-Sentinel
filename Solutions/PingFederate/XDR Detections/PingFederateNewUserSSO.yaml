properties:
  id: xdr-05282c91-7aaf-4d76-9a19-6dc582e6a411
  displayName: Ping Federate - New user SSO success login
  status: disabled
  queryCondition:
    queryText: 'let known_usrs =

      PingFederateEvent

      | where TimeGenerated between (ago(14d) .. ago(1d))

      | where isnotempty(DstUserName)

      | summarize makeset(DstUserName);

      PingFederateEvent

      | where EventType =~ ''SSO''

      | where EventMessage has ''success''

      | where DstUserName !in (known_usrs)

      | extend AccountCustomEntity = DstUserName'
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ping Federate - New user SSO success login
      description: '''Detects new user SSO success login.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      - tactic: Persistence
        techniques:
        - technique: T1078
        - technique: T1136
      customDetails:
        AccountName: AccountCustomEntity
