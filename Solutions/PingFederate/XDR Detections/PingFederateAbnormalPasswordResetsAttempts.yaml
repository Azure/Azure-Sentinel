properties:
  id: xdr-e45a7334-2cb4-4690-8156-f02cac73d584
  displayName: Ping Federate - Abnormal password reset attempts
  status: disabled
  queryCondition:
    queryText: 'let threshold = 10;

      PingFederateEvent

      | where EventType =~ ''PWD_RESET_REQUEST''

      | summarize count() by DstUserName, bin(TimeGenerated, 30m)

      | where count_ > threshold

      | extend AccountCustomEntity = DstUserName'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Ping Federate - Abnormal password reset attempts
      description: '''Detects abnormal password reset attempts for user in short period
        of time.'''
      severity: high
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1110
      customDetails:
        AccountName: AccountCustomEntity
