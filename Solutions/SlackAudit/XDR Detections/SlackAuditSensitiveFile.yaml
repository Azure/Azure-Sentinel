properties:
  id: xdr-279316e8-8965-47d2-9788-b94dc352c853
  displayName: SlackAudit - Public link created for file which can contain sensitive information.
  status: disabled
  queryCondition:
    queryText: |-
      let _SlackAudit = union isfuzzy=true
          (SlackAuditV2_CL),
          (SlackAudit_CL),
          (datatable(TimeGenerated:datetime, Id:string, DateCreate:string, Action:string, Actor:dynamic, Entity:dynamic, Context:dynamic, Details:dynamic, ActionDescription:string)[])
      | extend TimeGenerated = iff(isnotempty(column_ifexists('DateCreate', '')) and isnotnull(todatetime(column_ifexists('DateCreate', ''))), todatetime(column_ifexists('DateCreate', '')), TimeGenerated)
      | extend actor = todynamic(Actor), entity = todynamic(Entity), context = todynamic(Context), details = todynamic(Details)
      | extend
          EventVendor = 'Slack',
          EventProduct = 'Audit',
          EventSchemaVersion = '0.1.0',
          EventId = column_ifexists('Id', ''),
          EventEndTime = column_ifexists('DateCreate', ''),
          Action = column_ifexists('Action', ''),
          DvcAction = column_ifexists('Action', ''),
          DvcActionDesc = column_ifexists('ActionDescription', ''),
          ActorType = tostring(actor.type),
          SrcUserIdentity = tostring(actor.user.id),
          SrcUserName = tostring(actor.user.name),
          SrcUserEmail = tostring(actor.user.email),
          SrcUserTeam = tostring(actor.user.team),
          EntityType = tostring(entity.type),
          EntityFileId = tostring(entity.file.id),
          EntityFileName = tostring(entity.file.name),
          EntityFileFiletype = tostring(entity.file.filetype),
          EntityFileTitle = tostring(entity['file']['title']),
          EntityUserId = tostring(entity.user.id),
          EntityUserName = tostring(entity.user.name),
          EntityUserEmail = tostring(entity.user.email),
          EntityUserTeam = tostring(entity.user.team),
          UserAgentOriginal = tostring(context.ua),
          SrcIpAddr = tostring(context.ip_address),
          SessionId = tostring(context.session_id),
          DetailsType = tostring(details.type),
          DetailsNewValue = tostring(details.new_value),
          DetailsPreviousValue = tostring(details.previous_value);
      let AllowedFiles = dynamic([]);
      let AllowedUsers = dynamic([]);
      _SlackAudit
      | where Action =~ 'file_public_link_created'
      | extend FileNameLower = tolower(EntityFileName), UserLower = tolower(SrcUserName)
      | where EntityFileName in~ ('id_rsa')
          or FileNameLower has_any ('password', 'secret', 'token', 'credential', 'private key', 'api key')
          or FileNameLower has_any ('.ssh', '.npmrc', '.muttrc', '.gitconfig', '.netrc', 'package.json', 'Gemfile', 'bower.json', 'config.gypi', 'travis.yml', 'config.json')
      | where array_length(AllowedFiles) == 0 or EntityFileName !in~ (AllowedFiles)
      | where array_length(AllowedUsers) == 0 or UserLower !in~ (AllowedUsers)
      | extend AccountCustomEntity = SrcUserName
      | extend IPCustomEntity = SrcIpAddr
      | project TimeGenerated, EntityFileName, Action, SrcUserName, SrcUserEmail, SrcIpAddr, AccountCustomEntity, IPCustomEntity
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: SlackAudit - Public link created for file which can contain sensitive information.
      description: |-
        'Detects public links created for files that may contain sensitive data such as passwords, authentication tokens,
        secret keys, or private configuration files. Tune exclusions using the SlackAuditSensitiveFile_Allowlist_File and SlackAuditSensitiveFile_Allowlist_Account
        watchlists when known benign files or accounts generate expected public-link activity.'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: SrcUserEmail
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1048
        - technique: T1567
          subTechniques:
          - T1567.002
      customDetails:
        FileName: EntityFileName
        Action: Action
        SourceUser: SrcUserName
        SourceIP: SrcIpAddr
        ActorEntity: AccountCustomEntity
        IpEntity: IPCustomEntity
