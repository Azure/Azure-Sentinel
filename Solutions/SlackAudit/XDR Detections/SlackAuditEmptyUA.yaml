schemaVersion: 1.0.0
version: 3.2.2
kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
requiredDataConnectors:
- connectorId: SlackAuditAPI
  dataTypes:
  - SlackAudit_CL
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - SlackAuditV2_CL
    - SlackAudit_CL
  requiredDataConnectors:
  - connectorId: SlackAuditAPI
    dataTypes:
    - SlackAudit_CL
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 04528635-a5f1-438b-ab74-21ca7bc3aa32
    path: Analytic Rules/SlackAuditEmptyUA.yaml
    version: 1.0.1
    querySha256: 1ef04d7cfe73a02d439e135760f84e22096384e7e886c0262b8e524f0919dc65
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1d, lookback=1d; target frequency=P1D, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Account mapping is incomplete and was removed
    - Custom-detail values must remain within the documented combined 4 KB per-alert limit; runtime values are unverified
      and the service drops all custom details if exceeded
    informational:
    - Account.FullName mismatch is informational because its original value is preserved as customDetails.AccountFullName
      from query column `AccountCustomEntity`; supplemental details do not restore entity identity, correlation, or alert
      parity
    errors: []
    originalTactics:
    - InitialAccess
    originalTechniques:
    - T1133
    reviewScope:
      sourceDocumentSha256: 57ce9622bc115242f42c48885f6af8d37c61c7975fd9fde654a3a6bbb38450eb
      targetQuerySha256: e34b78036a28b0f21d782cc29c6a43d82ce55506fe64aed4ec5c19968f3bcaac
    supplementalEntityDetails:
    - entityType: Account
      entityIndex: 1
      identifier: FullName
      sourceColumn: AccountCustomEntity
      column: AccountCustomEntity
      status: available
      customDetailKey: AccountFullName
properties:
  id: xdr-04528635-a5f1-438b-ab74-21ca7bc3aa32
  displayName: SlackAudit - Empty User Agent
  status: disabled
  queryCondition:
    queryText: |-
      let _SlackAudit = union isfuzzy=true
          (SlackAuditV2_CL),
          (SlackAudit_CL),
          (datatable(TimeGenerated:datetime, Id:string, DateCreate:string, Action:string, Actor:dynamic, Entity:dynamic, Context:dynamic, Details:dynamic, ActionDescription:string)[])
      | extend TimeGenerated = iff(isnotempty(column_ifexists('DateCreate', '')) and isnotnull(todatetime(column_ifexists('DateCreate', ''))), todatetime(column_ifexists('DateCreate', '')), TimeGenerated)
      | extend actor = todynamic(Actor), entity = todynamic(Entity), context = todynamic(Context), details = todynamic(Details)
      | extend
          EventVendor = 'Slack',
          EventProduct = 'Audit',
          EventSchemaVersion = '0.1.0',
          EventId = column_ifexists('Id', ''),
          EventEndTime = column_ifexists('DateCreate', ''),
          Action = column_ifexists('Action', ''),
          DvcAction = column_ifexists('Action', ''),
          DvcActionDesc = column_ifexists('ActionDescription', ''),
          ActorType = tostring(actor.type),
          SrcUserIdentity = tostring(actor.user.id),
          SrcUserName = tostring(actor.user.name),
          SrcUserEmail = tostring(actor.user.email),
          SrcUserTeam = tostring(actor.user.team),
          EntityType = tostring(entity.type),
          EntityFileId = tostring(entity.file.id),
          EntityFileName = tostring(entity.file.name),
          EntityFileFiletype = tostring(entity.file.filetype),
          EntityFileTitle = tostring(entity['file']['title']),
          EntityUserId = tostring(entity.user.id),
          EntityUserName = tostring(entity.user.name),
          EntityUserEmail = tostring(entity.user.email),
          EntityUserTeam = tostring(entity.user.team),
          UserAgentOriginal = tostring(context.ua),
          SrcIpAddr = tostring(context.ip_address),
          SessionId = tostring(context.session_id),
          DetailsType = tostring(details.type),
          DetailsNewValue = tostring(details.new_value),
          DetailsPreviousValue = tostring(details.previous_value);
      _SlackAudit
      | where isempty(UserAgentOriginal)
      | extend AccountCustomEntity = SrcUserName
      | project TimeGenerated, AccountCustomEntity, SrcUserName, SrcUserEmail, SrcIpAddr, UserAgentOriginal
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: SlackAudit - Empty User Agent
      description: '''This query shows connections to the Slack Workspace with empty User Agent.'''
      severity: low
      entityMappings:
        accounts:
        - id: account1
          upnColumn: SrcUserEmail
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1133
      customDetails:
        SlackUser: SrcUserName
        UserAgent: UserAgentOriginal
        AccountFullName: AccountCustomEntity
