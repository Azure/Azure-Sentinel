properties:
  id: xdr-e6e99dcb-4dff-48d2-8012-206ca166b36b
  displayName: SlackAudit - User login after deactivated.
  status: disabled
  queryCondition:
    queryText: |-
      let _SlackAudit = union isfuzzy=true
          (SlackAuditV2_CL),
          (SlackAudit_CL),
          (datatable(TimeGenerated:datetime, Id:string, DateCreate:string, Action:string, Actor:dynamic, Entity:dynamic, Context:dynamic, Details:dynamic, ActionDescription:string)[])
      | extend TimeGenerated = iff(isnotempty(column_ifexists('DateCreate', '')) and isnotnull(todatetime(column_ifexists('DateCreate', ''))), todatetime(column_ifexists('DateCreate', '')), TimeGenerated)
      | extend actor = todynamic(Actor), entity = todynamic(Entity), context = todynamic(Context), details = todynamic(Details)
      | extend
          EventVendor = 'Slack',
          EventProduct = 'Audit',
          EventSchemaVersion = '0.1.0',
          EventId = column_ifexists('Id', ''),
          EventEndTime = column_ifexists('DateCreate', ''),
          Action = column_ifexists('Action', ''),
          DvcAction = column_ifexists('Action', ''),
          DvcActionDesc = column_ifexists('ActionDescription', ''),
          ActorType = tostring(actor.type),
          SrcUserIdentity = tostring(actor.user.id),
          SrcUserName = tostring(actor.user.name),
          SrcUserEmail = tostring(actor.user.email),
          SrcUserTeam = tostring(actor.user.team),
          EntityType = tostring(entity.type),
          EntityFileId = tostring(entity.file.id),
          EntityFileName = tostring(entity.file.name),
          EntityFileFiletype = tostring(entity.file.filetype),
          EntityFileTitle = tostring(entity['file']['title']),
          EntityUserId = tostring(entity.user.id),
          EntityUserName = tostring(entity.user.name),
          EntityUserEmail = tostring(entity.user.email),
          EntityUserTeam = tostring(entity.user.team),
          UserAgentOriginal = tostring(context.ua),
          SrcIpAddr = tostring(context.ip_address),
          SessionId = tostring(context.session_id),
          DetailsType = tostring(details.type),
          DetailsNewValue = tostring(details.new_value),
          DetailsPreviousValue = tostring(details.previous_value);
      let lbperiod_max_d = 14d;
      let lbperiod_min_d = 1d;
      let lb_time_max_h = 24h;
      _SlackAudit
      | where TimeGenerated between (ago(lbperiod_max_d) .. ago(lbperiod_min_d))
      | where Action =~ 'user_deactivated'
      | summarize deactivation_time = max(TimeGenerated) by EntityUserEmail, EntityUserId
      | project deactivation_time, EntityUserEmail, EntityUserId
      | join (_SlackAudit
            | where TimeGenerated > ago(lb_time_max_h)
            | where Action =~ 'user_login'
            | summarize new_login_time = max(TimeGenerated) by SrcUserEmail, SrcUserIdentity
            | project new_login_time, SrcUserEmail, EntityUserId = SrcUserIdentity) on EntityUserId
      | where EntityUserEmail == SrcUserEmail
      | where deactivation_time < new_login_time
      | extend AccountCustomEntity = SrcUserEmail
      | project deactivation_time, new_login_time, EntityUserEmail, EntityUserId, SrcUserEmail, AccountCustomEntity
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: SlackAudit - User login after deactivated.
      description: |-
        'Detects when a Slack user account was deactivated and the same user identity later authenticated again within
        the detection window, which may indicate account reactivation, unauthorized access, or use of a deactivated account. Analyst
        triage should review the deactivation time, subsequent login time, EntityUserEmail, and EntityUserId to determine whether
        the login was expected. This rule uses the SlackAuditAPI connector and SlackAudit_CL data type.'
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          upnColumn: AccountCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
          subTechniques:
          - T1078.004
      customDetails:
        DeactivationTime: deactivation_time
        NewLoginTime: new_login_time
        SlackUserEmail: EntityUserEmail
        SlackUserId: EntityUserId
        AccountFullName: AccountCustomEntity
