properties:
  id: xdr-3b11f06e-4afd-4ae6-8477-c61136619ac8
  displayName: SlackAudit - Unknown User Agent
  status: disabled
  queryCondition:
    queryText: |-
      let _SlackAudit = union isfuzzy=true
          (SlackAuditV2_CL),
          (SlackAudit_CL),
          (datatable(TimeGenerated:datetime, Id:string, DateCreate:string, Action:string, Actor:dynamic, Entity:dynamic, Context:dynamic, Details:dynamic, ActionDescription:string)[])
      | extend TimeGenerated = iff(isnotempty(column_ifexists('DateCreate', '')) and isnotnull(todatetime(column_ifexists('DateCreate', ''))), todatetime(column_ifexists('DateCreate', '')), TimeGenerated)
      | extend actor = todynamic(Actor), entity = todynamic(Entity), context = todynamic(Context), details = todynamic(Details)
      | extend
          EventVendor = 'Slack',
          EventProduct = 'Audit',
          EventSchemaVersion = '0.1.0',
          EventId = column_ifexists('Id', ''),
          EventEndTime = column_ifexists('DateCreate', ''),
          Action = column_ifexists('Action', ''),
          DvcAction = column_ifexists('Action', ''),
          DvcActionDesc = column_ifexists('ActionDescription', ''),
          ActorType = tostring(actor.type),
          SrcUserIdentity = tostring(actor.user.id),
          SrcUserName = tostring(actor.user.name),
          SrcUserEmail = tostring(actor.user.email),
          SrcUserTeam = tostring(actor.user.team),
          EntityType = tostring(entity.type),
          EntityFileId = tostring(entity.file.id),
          EntityFileName = tostring(entity.file.name),
          EntityFileFiletype = tostring(entity.file.filetype),
          EntityFileTitle = tostring(entity['file']['title']),
          EntityUserId = tostring(entity.user.id),
          EntityUserName = tostring(entity.user.name),
          EntityUserEmail = tostring(entity.user.email),
          EntityUserTeam = tostring(entity.user.team),
          UserAgentOriginal = tostring(context.ua),
          SrcIpAddr = tostring(context.ip_address),
          SessionId = tostring(context.session_id),
          DetailsType = tostring(details.type),
          DetailsNewValue = tostring(details.new_value),
          DetailsPreviousValue = tostring(details.previous_value);
      let lbperiod = 14d;
      let known_UAs = _SlackAudit
      | where TimeGenerated > ago(lbperiod)
      | where isnotempty(UserAgentOriginal)
      | summarize makeset(UserAgentOriginal);
      _SlackAudit
      | where UserAgentOriginal !in (known_UAs)
      | extend AccountCustomEntity = SrcUserName
      | project TimeGenerated, SrcUserName, SrcUserEmail, SrcIpAddr, UserAgentOriginal, AccountCustomEntity
  schedule:
    frequency: PT24H
  detectionAction:
    alertTemplate:
      title: SlackAudit - Unknown User Agent
      description: |-
        'Detects Slack workspace activity from unknown user agents by comparing recent UserAgentOriginal values against
        a 14d baseline of known user agents.'
      severity: low
      entityMappings:
        accounts:
        - id: account1
          upnColumn: SrcUserEmail
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
          subTechniques:
          - T1071.001
      customDetails:
        Account: AccountCustomEntity
        UserAgent: UserAgentOriginal
