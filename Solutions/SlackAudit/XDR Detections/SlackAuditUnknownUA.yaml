    dataTypes:
    - SlackAuditV2_CL
    - SlackAudit_CL
  requiredDataConnectors:
  - connectorId: SlackAuditAPI
    dataTypes:
    - SlackAudit_CL
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 3b11f06e-4afd-4ae6-8477-c61136619ac8
    path: Analytic Rules/SlackAuditUnknownUA.yaml
    version: 1.0.2
    querySha256: cb179babcf5ffc0d60e8f8a4381ad6e0fdb60256755bad9f68c5983ca896dd9d
    schedule:
      queryFrequency: 24h
      queryPeriod: 14d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=24h, lookback=14d; target frequency=PT24H, native lookback=unknown/unconfigured;
