id: d3c08d98-7099-48cc-898c-ab9fc5d510ad
Function:
  Title: Corelight Connection Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_anomaly
FunctionAlias: corelight_anomaly
FunctionQuery: |
    let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
    let corelight_anomaly = view () {
        union isfuzzy=true
            Corelight_v3_anomaly_CL,
            dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
        | join kind=leftouter 
            (corelight_conn
            | project uid, local_orig, local_resp
            )
            on $left.uid == $right.uid
        | project-away uid1
        | extend
            item_assoc_entities_similarity = tostring(item_assoc_entities_similarity),
            usecase_description = coalesce(usecase_description, use_case_description),
            usecase = coalesce(usecase, use_case)
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "anomaly",
            ts = TimeGenerated
        | extend
            is_dest_internal_ip = iff(local_resp == true, "true", "false"),
            is_src_internal_ip = iff(local_orig == true, "true", "false"),
            direction = case(
                    local_orig == true and local_resp == true,
                    "internal", 
                    local_orig == true and local_resp == false,
                    "outbound", 
                    local_orig == false and local_resp == false,
                    "external", 
                    local_orig == false and local_resp == true,
                    "inbound", 
                    "unknown"
                )
        | project
            TimeGenerated,
            path,
            system_name,
            write_ts,
            uid,
            entity,
            original_entity,
            entity_training_items,
            item,
            item_score,
            item_assoc_entities,
            item_assoc_entities_similarity,
            ignorable,
            history_days,
            history,
            nn1_entities,
            nn1_entity_similarity,
            nn1_train_items,
            nn1_pred_items,
            nn2_entities,
            nn2_entity_similarity,
            nn2_train_items,
            nn2_pred_items,
            nn3_entities,
            nn3_entity_similarity,
            nn3_train_items,
            nn3_pred_items,
            nn4_entities,
            nn4_entity_similarity,
            nn4_train_items,
            nn4_pred_items,
            nn5_entities,
            nn5_entity_similarity,
            nn5_train_items,
            nn5_pred_items,
            nn6_entities,
            nn6_entity_similarity,
            nn6_train_items,
            nn6_pred_items,
            nn7_entities,
            nn7_entity_similarity,
            nn7_train_items,
            nn7_pred_items,
            nn8_entities,
            nn8_entity_similarity,
            nn8_train_items,
            nn8_pred_items,
            nn9_entities,
            nn9_entity_similarity,
            nn9_train_items,
            nn9_pred_items,
            nn10_entities,
            nn10_entity_similarity,
            nn10_train_items,
            nn10_pred_items,
            anomaly_type,
            usecase_description,
            usecase,
            EventVendor,
            EventProduct,
            EventType,
            ts,
            is_dest_internal_ip,
            is_src_internal_ip,
            direction
    };
    corelight_anomaly