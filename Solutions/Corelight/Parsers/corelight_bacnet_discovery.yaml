Function:
  Title: corelight_bacnet_discovery parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_bacnet_discovery
FunctionAlias: corelight_bacnet_discovery
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_bacnet_discovery = view () {
      union isfuzzy=true Corelight_v3_bacnet_discovery_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="bacnet_discovery",
          ts=TimeGenerated
  };
  corelight_bacnet_discovery
