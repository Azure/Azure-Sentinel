id: 20819acc-0324-5a3b-a528-91c8f366e31c
Function:
  Title: corelight_print parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_print
FunctionAlias: corelight_print
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_print = view () {
      union isfuzzy=true Corelight_v3_print_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="print",
          ts=TimeGenerated
  };
  corelight_print
