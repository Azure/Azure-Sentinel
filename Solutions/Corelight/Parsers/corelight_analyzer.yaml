id: 146cecdf-0e69-5258-8f87-622b125774ce
Function:
  Title: corelight_analyzer parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_analyzer
FunctionAlias: corelight_analyzer
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_analyzer = view () {
      union isfuzzy=true Corelight_v3_analyzer_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="analyzer",
          ts=TimeGenerated
  };
  corelight_analyzer
