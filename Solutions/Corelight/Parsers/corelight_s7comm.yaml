
id: 15ceed25-739f-4d91-a7c4-59a7d0c7606c
Function:
  Title: Corelight S7comm Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_s7comm
FunctionAlias: corelight_s7comm
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
    let corelight_s7comm = view () {
        union isfuzzy=true Corelight_v3_s7comm_CL, dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
        | join kind=leftouter 
        ( corelight_conn
        | project uid, local_orig, local_resp
        ) on $left.uid == $right.uid
        | project-away uid1
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "s7comm",
            ts = TimeGenerated,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            sensor_name = coalesce(system_name, "unknown")
        | extend
            is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
            is_dest_internal_ip = iff(local_resp == true, "true", "false"),
            is_src_internal_ip = iff(local_orig == true, "true", "false"),
            direction=case(local_orig==true and local_resp==true, "internal", local_orig==true and local_resp==false, "outbound", local_orig==false and local_resp==false, "external", local_orig==false and local_resp==true, "inbound", "unknown")
        | project
            TimeGenerated,
            subfunction_code,
            subfunction_name,
            error_code,
            error_class,
            rosctr_code,
            write_ts,
            function_code,
            path,
            pdu_reference,
            is_orig,
            system_name,
            id_orig_h,
            id_orig_p,
            id_resp_h,
            id_resp_p,
            uid,
            function_name,
            rosctr_name,
            EventVendor,
            EventProduct,
            EventType,
            ts,
            src,
            src_ip,
            src_port,
            dest,
            dest_ip,
            dest_port,
            sensor_name,
            is_broadcast,
            is_dest_internal_ip,
            is_src_internal_ip,
            direction
    };
    corelight_s7comm