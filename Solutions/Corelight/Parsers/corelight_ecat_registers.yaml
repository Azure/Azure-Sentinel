Function:
  Title: corelight_ecat_registers parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_ecat_registers
FunctionAlias: corelight_ecat_registers
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ecat_registers = view () {
      union isfuzzy=true Corelight_v3_ecat_registers_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ecat_registers",
          ts=TimeGenerated
  };
  corelight_ecat_registers
