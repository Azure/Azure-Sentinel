id: 73146559-230e-5895-8dff-707d918ede6a
Function:
  Title: corelight_stats parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_stats
FunctionAlias: corelight_stats
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_stats = view () {
      union isfuzzy=true Corelight_v3_stats_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="stats",
          ts=TimeGenerated
  };
  corelight_stats

...
