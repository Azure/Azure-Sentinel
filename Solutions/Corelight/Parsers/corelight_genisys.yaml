id: 787f2d0d-d385-53ae-b998-16d9d6972940
Function:
  Title: corelight_genisys parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_genisys
FunctionAlias: corelight_genisys
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_genisys = view () {
      union isfuzzy=true Corelight_v3_genisys_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="genisys",
          ts=TimeGenerated
  };
  corelight_genisys
