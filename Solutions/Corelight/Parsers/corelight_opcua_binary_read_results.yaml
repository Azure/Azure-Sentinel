FunctionAlias: corelight_opcua_binary_read_results
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_opcua_binary_read_results = view () {
      union isfuzzy=true Corelight_v3_opcua_binary_read_results_CL, dummy_table
