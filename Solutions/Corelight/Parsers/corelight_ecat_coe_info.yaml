FunctionName: corelight_ecat_coe_info
FunctionAlias: corelight_ecat_coe_info
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ecat_coe_info = view () {
      union isfuzzy=true Corelight_v3_ecat_coe_info_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ecat_coe_info",
          ts=TimeGenerated
  };
  corelight_ecat_coe_info
