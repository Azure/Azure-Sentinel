Category: Microsoft Sentinel Parser
FunctionName: corelight_opcua_binary_browse
FunctionAlias: corelight_opcua_binary_browse
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_opcua_binary_browse = view () {
      union isfuzzy=true Corelight_v3_opcua_binary_browse_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="opcua_binary_browse",
          ts=TimeGenerated
  };
  corelight_opcua_binary_browse
