id: 79e0b10d-e82a-44a5-bf31-6b7fc16ff9a2
Function:
  Title: Corelight RDP Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_rdp
FunctionAlias: corelight_rdp
FunctionQuery: |
    let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
    let corelight_rdp = view () {
        union isfuzzy=true Corelight_v3_rdp_CL, dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
        | join kind=leftouter 
        ( corelight_conn
        | project uid, local_orig, local_resp
        ) on $left.uid == $right.uid
        | project-away uid1
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "rdp",
            ts = TimeGenerated,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            app = security_protocol,
            sensor_name = coalesce(system_name, "unknown")
        | extend 
            action = case(result == "Success", "success", result == "SSL_NOT_ALLOWED_BY_SERVER", "failure", auth_success == true, "success", auth_success == false, "failure", "unknown"),
            is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
            is_dest_internal_ip = iff(local_resp == true, "true", "false"),
            is_src_internal_ip = iff(local_orig == true, "true", "false")
        | project
            TimeGenerated,
            path,
            system_name,
            write_ts,
            auth_success,
            cert_count,
            channels_joined,
            cookie,
            id_orig_h,
            id_orig_p,
            id_resp_h,
            id_resp_p,
            inferences,
            result,
            security_protocol,
            uid,
            client_channels,
            keyboard_layout,
            client_build,
            client_name,
            client_dig_product_id,
            desktop_width,
            desktop_height,
            requested_color_depth,
            cert_type,
            cert_permanent,
            encryption_level,
            encryption_method,
            rdpeudp_uid,
            rdfp_string,
            rdfp_hash,
            EventVendor,
            EventProduct,
            EventType,
            ts,
            src,
            src_ip,
            src_port,
            dest,
            dest_ip,
            dest_port,
            app,
            sensor_name,
            action,
            is_broadcast,
            is_dest_internal_ip,
            is_src_internal_ip
    };
    corelight_rdp