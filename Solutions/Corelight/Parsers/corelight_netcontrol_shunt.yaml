Function:
  Title: corelight_netcontrol_shunt parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_netcontrol_shunt
FunctionAlias: corelight_netcontrol_shunt
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_netcontrol_shunt = view () {
      union isfuzzy=true Corelight_v3_netcontrol_shunt_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="netcontrol_shunt",
          ts=TimeGenerated
  };
  corelight_netcontrol_shunt
