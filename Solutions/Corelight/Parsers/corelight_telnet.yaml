id: fadf8955-127e-561e-a782-58dff93ddaf2
Function:
  Title: corelight_telnet parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_telnet
FunctionAlias: corelight_telnet
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_telnet = view () {
      union isfuzzy=true Corelight_v3_telnet_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="telnet",
          ts=TimeGenerated
  };
  corelight_telnet
