Function:
  Title: corelight_notice_alarm parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_notice_alarm
FunctionAlias: corelight_notice_alarm
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_notice_alarm = view () {
      union isfuzzy=true Corelight_v3_notice_alarm_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="notice_alarm",
          ts=TimeGenerated
  };
  corelight_notice_alarm
