FunctionAlias: corelight_mqtt_subscribe
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_mqtt_subscribe = view () {
      union isfuzzy=true Corelight_v3_mqtt_subscribe_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="mqtt_subscribe",
          ts=TimeGenerated
  };
  corelight_mqtt_subscribe

