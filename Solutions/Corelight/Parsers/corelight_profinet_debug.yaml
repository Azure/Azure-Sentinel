FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_profinet_debug = view () {
      union isfuzzy=true Corelight_v3_profinet_debug_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
