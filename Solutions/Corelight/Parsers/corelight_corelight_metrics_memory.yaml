Function:
  Title: Corelight Metrics Memory Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_corelight_metrics_memory
FunctionAlias: corelight_corelight_metrics_memory
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
    let corelight_corelight_metrics_memory = view () {
        union isfuzzy=true Corelight_v3_corelight_metrics_memory_CL, dummy_table
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "corelight_metrics_memory",
            ts = TimeGenerated,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            sensor_name = coalesce(system_name, "unknown")
        | project
            TimeGenerated,
            timestartpos,
            path,
            system_name,
            write_ts,
            ts,
            usage,
            timeendpos,
            id_orig_h,
            id_orig_p,
            id_resp_h,
            id_resp_p,
            direction,
            EventVendor,
            EventProduct,
            EventType,
            src,
            src_ip,
            src_port,
            dest,
            dest_ip,
            dest_port,
            sensor_name
    };
    corelight_corelight_metrics_memory