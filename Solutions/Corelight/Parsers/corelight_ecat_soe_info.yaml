Function:
  Title: corelight_ecat_soe_info parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_ecat_soe_info
FunctionAlias: corelight_ecat_soe_info
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ecat_soe_info = view () {
      union isfuzzy=true Corelight_v3_ecat_soe_info_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ecat_soe_info",
          ts=TimeGenerated
  };
  corelight_ecat_soe_info
