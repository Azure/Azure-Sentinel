
id: aa7abc13-e833-4d18-930b-d14bec7183be
Function:
  Title: Corelight Smb Mapping
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_smb_mapping
FunctionAlias: corelight_smb_mapping
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
  let corelight_smb_mapping = view () {
        union isfuzzy=true Corelight_v3_smb_mapping_CL, dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
          | join kind=leftouter 
          ( corelight_conn
          | project uid, local_orig, local_resp
          ) on $left.uid == $right.uid
          | project-away uid1
        | extend
            EventVendor="Corelight",
            EventProduct="CorelightSensor",
            EventType="smb_mapping",
            ts=TimeGenerated,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            sensor_name = coalesce(system_name, "unknown"),
            file_share_type = share_type,
            file_path_root = path
        | extend
              is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
              is_dest_internal_ip = iff(local_resp == true, "true", "false"),
              is_src_internal_ip = iff(local_orig == true, "true", "false"),
              direction=case(local_orig==true and local_resp==true, "internal", local_orig==true and local_resp==false, "outbound", local_orig==false and local_resp==false, "external", local_orig==false and local_resp==true, "inbound", "unknown")
        | project
              TimeGenerated,
              path,
              system_name,
              write_ts,
              uid,
              id_orig_h,
              id_orig_p,
              id_resp_h,
              id_resp_p,
              service,
              native_file_system,
              share_type,
              id_resp_l2_vendor,
              id_resp_l2_addr,
              id_orig_l2_vendor,
              id_orig_l2_addr,
              EventVendor,
              EventProduct,
              EventType,
              ts,
              src,
              src_ip,
              src_port,
              dest,
              dest_ip,
              dest_port,
              sensor_name,
              file_share_type,
              file_path_root,
              is_broadcast,
              is_dest_internal_ip,
              is_src_internal_ip,
              direction
    };
    corelight_smb_mapping