id: ce04f307-5cfc-5409-89a1-206ef4e4f4cf
Function:
  Title: corelight_websocket parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_websocket
FunctionAlias: corelight_websocket
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_websocket = view () {
      union isfuzzy=true Corelight_v3_websocket_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="websocket",
          ts=TimeGenerated
  };
  corelight_websocket
