Category: Microsoft Sentinel Parser
FunctionName: corelight_local_subnets
FunctionAlias: corelight_local_subnets
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_local_subnets = view () {
      union isfuzzy=true Corelight_v3_local_subnets_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="local_subnets",
          ts=TimeGenerated
  };
  corelight_local_subnets

...
