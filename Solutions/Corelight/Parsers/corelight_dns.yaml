id: 409a4ed9-4a53-42e9-8025-22e23f76d852
Function:
  Title: Corelight DNS Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_dns
FunctionAlias: corelight_dns
FunctionQuery: |
    let DNSLookup = datatable(
        rcode: int,
        reply_code: string,
        cim_reply_code: string
    )[
        0,"NOERROR","No Error",
        1,"FORMERR","FormErr",
        2,"SERVFAIL","ServFail",
        3,"NXDOMAIN","NXDomain",
        4,"NOTIMP","NotImp",
        5,"REFUSED","Refused"
    ];
    let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
    let corelight_dns = view () {
        union isfuzzy=true
            (Corelight_v3_dns_CL
                | extend AA=tostring(AA), RA=tostring(RA), RD=tostring(RD), TC=tostring(TC), TTLs=tostring(TTLs), num=toreal(num), qclass=toreal(qclass), qtype=toreal(qtype), rejected=tostring(rejected), trans_id=tostring(trans_id), zeek_Z=toreal(zeek_Z)),
            (Corelight_v3_dns_red_CL
                | extend AA=tostring(AA), RA=tostring(RA), RD=tostring(RD), TC=tostring(TC), TTLs=tostring(TTLs), num=toreal(num), qclass=toreal(qclass), qtype=toreal(qtype), rejected=tostring(rejected), trans_id=tostring(trans_id), zeek_Z=toreal(zeek_Z)),
            dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
        | join kind=leftouter 
        ( corelight_conn
        | project uid, local_orig, local_resp    
        ) on $left.uid == $right.uid
        | project-away uid1
        | extend
            Z = zeek_Z
        | extend rcode = toint(rcode)
        | lookup DNSLookup on rcode
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "dns",
            ts = TimeGenerated,
            dns_flags_authoritative_answer = AA,
            dns_flags_recursion_available = RA,
            dns_flags_truncated_response = TC,
            ttl = TTLs,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            record_class = qclass_name,
            record_type = qtype_name,
            reply_code_id = rcode,
            dns_flags_rejected = rejected,
            duration = rtt,
            response_time = rtt,
            transaction_id = trans_id,
            session_id = uid,
            answer_count = array_length(todynamic(answers)),
            query_count = array_length(todynamic(query)),
            sensor_name = coalesce(system_name, "unknown"),
            reply_code = cim_reply_code
        | extend
            is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
            is_dest_internal_ip = iff(local_resp == true, "true", "false"),
            is_src_internal_ip = iff(local_orig == true, "true", "false"),
            transport = iff(proto == "icmp" and id_orig_h matches regex ".*:.*", "icmp6", proto),
            query_length = strlen(query),
            answer_length = iff(answer_count == 1, strlen(tostring(answers)), tolong('')),
            message_type = iff(isnotnull(rcode), "Response", "Query")
        | project
            TimeGenerated,
            path,
            system_name,
            write_ts,
            AA,
            RA,
            RD,
            TC,
            TTLs,
            Z,
            answers,
            id_orig_h,
            id_orig_p,
            id_resp_h,
            id_resp_p,
            proto,
            qclass,
            qclass_name,
            qtype,
            qtype_name,
            query,
            rcode,
            rcode_name,
            rejected,
            rtt,
            trans_id,
            uid,
            num,
            icann_domain,
            icann_host_subdomain,
            icann_tld,
            is_trusted_domain,
            EventVendor,
            EventProduct,
            EventType,
            ts,
            dns_flags_authoritative_answer,
            dns_flags_recursion_available,
            dns_flags_truncated_response,
            ttl,
            src,
            src_ip,
            src_port,
            dest,
            dest_ip,
            dest_port,
            record_class,
            record_type,
            reply_code_id,
            dns_flags_rejected,
            duration,
            response_time,
            transaction_id,
            session_id,
            answer_count,
            query_count,
            sensor_name,
            is_broadcast,
            is_dest_internal_ip,
            is_src_internal_ip,
            transport,
            query_length,
            answer_length,
            message_type,
            reply_code
    };
    corelight_dns