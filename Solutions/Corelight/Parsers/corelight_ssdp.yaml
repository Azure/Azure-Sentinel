id: 9c05749f-db96-576d-ad78-b031547db0f2
Function:
  Title: corelight_ssdp parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_ssdp
FunctionAlias: corelight_ssdp
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ssdp = view () {
      union isfuzzy=true Corelight_v3_ssdp_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ssdp",
          ts=TimeGenerated
  };
  corelight_ssdp
