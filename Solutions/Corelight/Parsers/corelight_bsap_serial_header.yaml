Function:
  Title: corelight_bsap_serial_header parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_bsap_serial_header
FunctionAlias: corelight_bsap_serial_header
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_bsap_serial_header = view () {
      union isfuzzy=true Corelight_v3_bsap_serial_header_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="bsap_serial_header",
          ts=TimeGenerated
  };
  corelight_bsap_serial_header
