id: fc79b88d-cc59-5f0c-8178-951c7dfd9410
Function:
  Title: corelight_logschema parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_logschema
FunctionAlias: corelight_logschema
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_logschema = view () {
      union isfuzzy=true Corelight_v3_logschema_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="logschema",
          ts=TimeGenerated
  };
  corelight_logschema
