id: 223bd0ab-489f-542c-9850-a6919591c226
Function:
  Title: corelight_quic parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_quic
FunctionAlias: corelight_quic
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_quic = view () {
      union isfuzzy=true Corelight_v3_quic_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="quic",
          ts=TimeGenerated
  };
  corelight_quic
