Function:
  Title: corelight_cip_io parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_cip_io
FunctionAlias: corelight_cip_io
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_cip_io = view () {
      union isfuzzy=true Corelight_v3_cip_io_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="cip_io",
          ts=TimeGenerated
  };
  corelight_cip_io
