Function:
  Title: corelight_bsap_ip_header parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_bsap_ip_header
FunctionAlias: corelight_bsap_ip_header
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_bsap_ip_header = view () {
      union isfuzzy=true Corelight_v3_bsap_ip_header_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="bsap_ip_header",
          ts=TimeGenerated
  };
  corelight_bsap_ip_header
