id: 6f40e628-d994-4c66-8f14-4fcad3b0f52f
Function:
  Title: Corelight etc viz Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_etc_viz
FunctionAlias: corelight_etc_viz
FunctionQuery: |
    let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
    let corelight_etc_viz = view () {
        union isfuzzy=true Corelight_v3_etc_viz_CL, dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
        | join kind=leftouter 
        ( corelight_conn
        | project uid, local_orig, local_resp
        ) on $left.uid == $right.uid
        |project-away uid1
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "etc_viz",
            ts = TimeGenerated,
            session_id = uid,
            status = viz_stat,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            bytes_out = tolong(c2s_viz_size),
            bytes_in = tolong(s2c_viz_size),
            sensor_name = coalesce(system_name, "unknown")
        | extend
            bytes = bytes_in + bytes_out,
            is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
            is_dest_internal_ip = iff(local_resp == true, "true", "false"),
            is_src_internal_ip = iff(local_orig == true, "true", "false")
        | project
            TimeGenerated,
            path,
            system_name,
            write_ts,
            uid,
            server_a,
            server_p,
            service,
            viz_stat,
            c2s_viz_size,
            c2s_viz_enc_dev,
            c2s_viz_enc_frac,
            c2s_viz_pdu1_enc,
            c2s_viz_clr_frac,
            c2s_viz_clr_ex,
            s2c_viz_size,
            s2c_viz_enc_dev,
            s2c_viz_enc_frac,
            s2c_viz_pdu1_enc,
            s2c_viz_clr_frac,
            s2c_viz_clr_ex,
            id_orig_h,
            id_orig_p,
            id_resp_h,
            id_resp_p,
            EventVendor,
            EventProduct,
            EventType,
            ts,
            session_id,
            status,
            src,
            src_ip,
            src_port,
            dest,
            dest_ip,
            dest_port,
            bytes_out,
            bytes_in,
            sensor_name,
            bytes,
            is_broadcast,
            is_dest_internal_ip,
            is_src_internal_ip
    };
    corelight_etc_viz