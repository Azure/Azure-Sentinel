FunctionName: corelight_conn_red
FunctionAlias: corelight_conn_red
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_conn_red = view () {
      union isfuzzy=true Corelight_v3_conn_red_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="conn_red",
          ts=TimeGenerated
  };
  corelight_conn_red

