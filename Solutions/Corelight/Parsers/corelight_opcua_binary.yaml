id: cf1e1c12-8799-52d5-b225-77a416b0d5a2
Function:
  Title: corelight_opcua_binary parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_opcua_binary
FunctionAlias: corelight_opcua_binary
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_opcua_binary = view () {
      union isfuzzy=true Corelight_v3_opcua_binary_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="opcua_binary",
          ts=TimeGenerated
  };
  corelight_opcua_binary
