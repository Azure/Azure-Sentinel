Function:
  Title: corelight_bsap_serial_rdb parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_bsap_serial_rdb
FunctionAlias: corelight_bsap_serial_rdb
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_bsap_serial_rdb = view () {
      union isfuzzy=true Corelight_v3_bsap_serial_rdb_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="bsap_serial_rdb",
          ts=TimeGenerated
  };
  corelight_bsap_serial_rdb
