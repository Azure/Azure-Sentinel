id: 3a79e58a-cb7c-5d58-8f7d-633896beed42
Function:
  Title: corelight_config parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_config
FunctionAlias: corelight_config
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_config = view () {
      union isfuzzy=true Corelight_v3_config_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="config",
          ts=TimeGenerated
  };
  corelight_config
