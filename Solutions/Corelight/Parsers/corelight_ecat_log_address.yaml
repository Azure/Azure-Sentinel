Function:
  Title: corelight_ecat_log_address parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_ecat_log_address
FunctionAlias: corelight_ecat_log_address
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ecat_log_address = view () {
      union isfuzzy=true Corelight_v3_ecat_log_address_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ecat_log_address",
          ts=TimeGenerated
  };
  corelight_ecat_log_address
