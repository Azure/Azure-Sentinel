id: 7ab21b8c-00f3-4312-bce8-abec2c13866b
Function:
  Title: Corelight Intel Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_intel
FunctionAlias: corelight_intel
FunctionQuery: |
    let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
    let corelight_intel = view () {
        union isfuzzy=true Corelight_v3_intel_CL, dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
        | join kind=leftouter 
        ( corelight_conn
        | project uid, local_orig, local_resp    
        ) on $left.uid == $right.uid
        | project-away uid1
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "intel",
            ts = TimeGenerated,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_host = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_host = id_resp_h,
            dest_port = id_resp_p,
            signature = seen_indicator,
            category = seen_indicator_type,
            object = filename,
            file_name = filename,
            sensor_name = coalesce(system_name, "unknown")
        | extend
            is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
            is_dest_internal_ip = iff(local_resp == true, "true", "false"),
            is_src_internal_ip = iff(local_orig == true, "true", "false"),
            direction=case(local_orig==true and local_resp==true, "internal", local_orig==true and local_resp==false, "outbound", local_orig==false and local_resp==false, "external", local_orig==false and local_resp==true, "inbound", "unknown")
        | project
            TimeGenerated,
            path,
            system_name,
            write_ts,
            file_mime_type,
            file_desc,
            fuid,
            seen_indicator,
            seen_indicator_type,
            seen_where,
            sources,
            id_orig_h,
            id_orig_p,
            id_resp_h,
            id_resp_p,
            uid,
            matched,
            filename,
            EventVendor,
            EventProduct,
            EventType,
            ts,
            src,
            src_ip,
            src_host,
            src_port,
            dest,
            dest_ip,
            dest_host,
            dest_port,
            signature = seen_indicator,
            category = seen_indicator_type,
            object,
            file_name,
            sensor_name,
            is_broadcast,
            is_dest_internal_ip,
            is_src_internal_ip,
            direction
    };
    corelight_intel