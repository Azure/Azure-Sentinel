id: edfdfe91-7f7b-5a4c-b7dd-4c55ffa719b9
Function:
  Title: corelight_ldap parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_ldap
FunctionAlias: corelight_ldap
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ldap = view () {
      union isfuzzy=true Corelight_v3_ldap_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ldap",
          ts=TimeGenerated
  };
  corelight_ldap
