id: 3577c600-751f-53d5-bf61-0f2b50aa29ad
Function:
  Title: corelight_loaded_scripts parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_loaded_scripts
FunctionAlias: corelight_loaded_scripts
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_loaded_scripts = view () {
      union isfuzzy=true Corelight_v3_loaded_scripts_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="loaded_scripts",
          ts=TimeGenerated
  };
  corelight_loaded_scripts
