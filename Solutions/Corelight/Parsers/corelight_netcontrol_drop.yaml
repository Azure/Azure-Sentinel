Function:
  Title: corelight_netcontrol_drop parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_netcontrol_drop
FunctionAlias: corelight_netcontrol_drop
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_netcontrol_drop = view () {
      union isfuzzy=true Corelight_v3_netcontrol_drop_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="netcontrol_drop",
          ts=TimeGenerated
  };
  corelight_netcontrol_drop
