id: 6038d35d-c7eb-5ab7-bffd-1a641e17bec6
Function:
  Title: corelight_cluster parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_cluster
FunctionAlias: corelight_cluster
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_cluster = view () {
      union isfuzzy=true Corelight_v3_cluster_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="cluster",
          ts=TimeGenerated
  };
  corelight_cluster
