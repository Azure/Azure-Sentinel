
id: 6dcc46a5-e942-47c9-8621-e7bec6447208
Function:
  Title: Corelight Smb Files
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_smb_files
FunctionAlias: corelight_smb_files
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
  let corelight_smb_files = view () {
        union isfuzzy=true Corelight_v3_smb_files_CL, dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
          | join kind=leftouter 
          ( corelight_conn
          | project uid, local_orig, local_resp
          ) on $left.uid == $right.uid
          | project-away uid1
        | extend
            EventVendor="Corelight",
            EventProduct="CorelightSensor",
            EventType="smb_files",
            ts=TimeGenerated,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            sensor_name = coalesce(system_name, "unknown"),
            file_size = size,
            file_access_time = times_accessed,
            file_change_time = times_changed,
            file_create_time = times_created,
            file_modify_time = times_modified,
            file_name = name,
            file_path_root = path
        | extend
              is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
              is_dest_internal_ip = iff(local_resp == true, "true", "false"),
              is_src_internal_ip = iff(local_orig == true, "true", "false"),
              direction=case(local_orig==true and local_resp==true, "internal", local_orig==true and local_resp==false, "outbound", local_orig==false and local_resp==false, "external", local_orig==false and local_resp==true, "inbound", "unknown")
        | project
              TimeGenerated,
              path,
              system_name,
              write_ts,
              uid,
              id_orig_h,
              id_orig_p,
              id_resp_h,
              id_resp_p,
              fuid,
              action,
              name,
              size,
              prev_name,
              times_modified,
              times_accessed,
              times_created,
              times_changed,
              data_offset_req,
              data_len_req,
              data_len_rsp,
              id_resp_l2_vendor,
              id_resp_l2_addr,
              id_orig_l2_vendor,
              id_orig_l2_addr,
              EventVendor,
              EventProduct,
              EventType,
              ts,
              src,
              src_ip,
              src_port,
              dest,
              dest_ip,
              dest_port,
              sensor_name,
              file_size = size,
              file_access_time,
              file_change_time,
              file_create_time,
              file_modify_time,
              file_name,
              file_path_root,
              is_broadcast,
              is_dest_internal_ip,
              is_src_internal_ip,
              direction
    };
  corelight_smb_files