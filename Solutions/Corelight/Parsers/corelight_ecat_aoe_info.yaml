Category: Microsoft Sentinel Parser
FunctionName: corelight_ecat_aoe_info
FunctionAlias: corelight_ecat_aoe_info
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ecat_aoe_info = view () {
      union isfuzzy=true Corelight_v3_ecat_aoe_info_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ecat_aoe_info",
          ts=TimeGenerated
  };
  corelight_ecat_aoe_info
