id: 9ee3fab9-afc4-440b-b68b-1b0b04416bd1
Function:
  Title: Corelight FTP Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_ftp
FunctionAlias: corelight_ftp
FunctionQuery: |
    let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
    let corelight_ftp = view () {
        union isfuzzy=true Corelight_v3_ftp_CL, dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
        | join kind=leftouter 
        ( corelight_conn
        | project uid, local_orig, local_resp
        ) on $left.uid == $right.uid
        | project-away uid1
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "ftp",
            ts = TimeGenerated,
            signature_id = toint(reply_code),
            signature = reply_msg,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            sensor_name = coalesce(system_name, "unknown")
        | extend 
            extract_user = extract("user/(?<user>\\w+)", 1, user),
            action = case(signature_id<300, "Success", "Failure"),
            object = split(arg, '/')[-1],
            is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
            is_dest_internal_ip = iff(local_resp == true, "true", "false"),
            is_src_internal_ip = iff(local_orig == true, "true", "false")
        | project
            TimeGenerated,
            path,
            system_name,
            write_ts,
            command,
            data_channel_orig_h,
            data_channel_passive,
            data_channel_resp_h,
            arg,
            data_channel_resp_p,
            err,
            id_orig_h,
            id_orig_p,
            id_resp_h,
            id_resp_p,
            reply_code,
            reply_msg,
            uid,
            user,
            mime_type,
            file_size,
            fuid,
            EventVendor,
            EventProduct,
            EventType,
            ts,
            signature_id,
            signature,
            src,
            src_ip,
            src_port,
            dest,
            dest_ip,
            dest_port,
            sensor_name,
            extract_user,
            action,
            object,
            is_broadcast,
            is_dest_internal_ip,
            is_src_internal_ip
    };
    corelight_ftp