Function:
  Title: corelight_cip_identity parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_cip_identity
FunctionAlias: corelight_cip_identity
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_cip_identity = view () {
      union isfuzzy=true Corelight_v3_cip_identity_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="cip_identity",
          ts=TimeGenerated
  };
  corelight_cip_identity
