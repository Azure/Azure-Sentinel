Function:
  Title: corelight_bacnet_property parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_bacnet_property
FunctionAlias: corelight_bacnet_property
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_bacnet_property = view () {
      union isfuzzy=true Corelight_v3_bacnet_property_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="bacnet_property",
          ts=TimeGenerated
  };
  corelight_bacnet_property
