FunctionName: corelight_opcua_binary_browse_response_references
FunctionAlias: corelight_opcua_binary_browse_response_references
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_opcua_binary_browse_response_references = view () {
      union isfuzzy=true Corelight_v3_opcua_binary_browse_response_ref_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="opcua_binary_browse_response_references",
          ts=TimeGenerated
  };
