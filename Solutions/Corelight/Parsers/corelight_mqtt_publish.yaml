Function:
  Title: corelight_mqtt_publish parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_mqtt_publish
FunctionAlias: corelight_mqtt_publish
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_mqtt_publish = view () {
      union isfuzzy=true Corelight_v3_mqtt_publish_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="mqtt_publish",
          ts=TimeGenerated
  };
  corelight_mqtt_publish

...
