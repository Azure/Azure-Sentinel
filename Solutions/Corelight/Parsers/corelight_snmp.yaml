id: aac55768-271e-5ce8-bd75-6b2ce04d9067
Function:
  Title: corelight_snmp parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_snmp
FunctionAlias: corelight_snmp
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_snmp = view () {
      union isfuzzy=true Corelight_v3_snmp_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="snmp",
          ts=TimeGenerated
  };
  corelight_snmp

...
