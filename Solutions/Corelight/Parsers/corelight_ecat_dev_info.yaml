FunctionName: corelight_ecat_dev_info
FunctionAlias: corelight_ecat_dev_info
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ecat_dev_info = view () {
      union isfuzzy=true Corelight_v3_ecat_dev_info_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ecat_dev_info",
          ts=TimeGenerated
