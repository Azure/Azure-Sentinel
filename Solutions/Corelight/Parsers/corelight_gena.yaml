id: b252ed68-49db-5cda-b24b-4bdf534d5221
Function:
  Title: corelight_gena parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_gena
FunctionAlias: corelight_gena
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_gena = view () {
      union isfuzzy=true Corelight_v3_gena_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="gena",
          ts=TimeGenerated
  };
  corelight_gena
