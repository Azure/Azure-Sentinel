Function:
  Title: corelight_weird parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_weird
FunctionAlias: corelight_weird
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_weird = view () {
      union isfuzzy=true Corelight_v3_weird_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="weird",
          ts=TimeGenerated
  };
  corelight_weird

...
