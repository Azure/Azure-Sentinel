id: 669323dc-f355-581f-b944-9497d6065b5a
Function:
  Title: corelight_amqp parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_amqp
FunctionAlias: corelight_amqp
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_amqp = view () {
      union isfuzzy=true Corelight_v3_amqp_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="amqp",
          ts=TimeGenerated
  };
  corelight_amqp
