Function:
  Title: corelight_dnp3_control parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_dnp3_control
FunctionAlias: corelight_dnp3_control
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_dnp3_control = view () {
      union isfuzzy=true Corelight_v3_dnp3_control_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="dnp3_control",
          ts=TimeGenerated
  };
  corelight_dnp3_control
