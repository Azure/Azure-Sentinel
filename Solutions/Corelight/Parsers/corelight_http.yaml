id: c59e2153-f622-4655-9b3e-3630520a127b
Function:
  Title: Corelight HTTP Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_http
FunctionAlias: corelight_http
FunctionQuery: |
    let StatusLookup = datatable(
        status: string,
        action: string
    )[
        "success","allowed",
        "failure","blocked",
        "200","success",
        "204","success",
        "206","success",
        "207","success",
        "301","success",
        "302","success",
        "303","success",
        "304","success",
        "307","success",
        "400","failure",
        "401","failure",
        "403","failure",
        "404","failure",
        "408","failure",
        "500","failure",
        "503","failure",
        "504","failure"
    ];
    let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
    let corelight_http = view () {
        union isfuzzy=true
            (Corelight_v3_http_CL
                | extend orig_filenames=tostring(orig_filenames), orig_mime_types=tostring(orig_mime_types), proxied=tostring(proxied), push=tostring(push), resp_filenames=tostring(resp_filenames), resp_mime_types=tostring(resp_mime_types), stream_id=toreal(stream_id), tags=tostring(tags), trans_depth=toreal(trans_depth)),
            (Corelight_v3_http_red_CL
                | extend orig_filenames=tostring(orig_filenames), orig_mime_types=tostring(orig_mime_types), proxied=tostring(proxied), push=tostring(push), resp_filenames=tostring(resp_filenames), resp_mime_types=tostring(resp_mime_types), stream_id=toreal(stream_id), tags=tostring(tags), trans_depth=toreal(trans_depth)),
            (Corelight_v3_http2_CL
                | extend orig_filenames=tostring(orig_filenames), orig_mime_types=tostring(orig_mime_types), proxied=tostring(proxied), push=tostring(push), resp_filenames=tostring(resp_filenames), resp_mime_types=tostring(resp_mime_types), stream_id=toreal(stream_id), tags=tostring(tags), trans_depth=toreal(trans_depth)),
            dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
        | join kind=leftouter 
        ( corelight_conn
        | project uid, local_orig, local_resp
        ) on $left.uid == $right.uid
        | project-away uid1
        | extend
            user_agent = iff(isempty(user_agent), dynamic([]), pack_array(user_agent))
        | extend status_code = tostring(toint(status_code))
        | lookup StatusLookup on $left.status_code == $right.status
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "http",
            ts = TimeGenerated,
            dest_host = host,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            http_method = method,
            bytes_in = request_body_len,
            bytes_out = response_body_len,
            status = status_code,
            vendor_action = status_msg,
            uri_path = uri,
            object = resp_filenames,
            http_user_agent = user_agent,
            http_referrer = referrer,
            http_content_type = orig_mime_types,
            sensor_name = coalesce(system_name, "unknown"),
            http_version = version,
            http_username = username,
            http_encoding = encoding
        | extend
            http_user_agent_length = strlen(http_user_agent),
            bytes = bytes_in + bytes_out,
            is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
            is_dest_internal_ip = iff(local_resp == true, "true", "false"),
            is_src_internal_ip = iff(local_orig == true, "true", "false"),
            host_header=dest_host,
            referrer_domain_domain=parse_url(referrer).Host,
            referrer_domain_ip=strcat(parse_url(referrer).Host, ":", parse_url(referrer).Port),
            direction=case(local_orig==true and local_resp==true, "internal", local_orig==true and local_resp==false, "outbound", local_orig==false and local_resp==false, "external", local_orig==false and local_resp==true, "inbound", "unknown")
        | extend 
            url = strcat("http://",host_header,uri),
            url_domain = host_header
        | project
            TimeGenerated,
            path,
            system_name,
            write_ts,
            host,
            id_orig_h,
            id_orig_p,
            id_resp_h,
            id_resp_p,
            id_vlan,
            method,
            orig_fuids,
            post_body,
            request_body_len,
            resp_fuids,
            response_body_len,
            status_code,
            status_msg,
            tags,
            trans_depth,
            uid,
            uri,
            version,
            resp_filenames,
            user_agent,
            referrer,
            origin,
            info_code,
            info_msg,
            username,
            proxied,
            orig_filenames,
            orig_mime_types,
            resp_mime_types,
            push,
            encoding,
            stream_id,
            server_headers,
            client_headers,
            EventVendor,
            EventProduct,
            EventType,
            ts,
            dest_host,
            src,
            src_ip,
            src_port,
            dest,
            dest_ip,
            dest_port,
            http_method,
            bytes_in,
            bytes_out,
            status,
            vendor_action,
            uri_path,
            object,
            http_user_agent,
            http_referrer,
            http_content_type,
            sensor_name,
            http_version,
            http_username,
            http_encoding,
            http_user_agent_length,
            bytes,
            is_broadcast,
            is_dest_internal_ip,
            is_src_internal_ip,
            host_header,
            referrer_domain_domain,
            referrer_domain_ip,
            direction,
            url,
            url_domain,
            action
    };
    corelight_http