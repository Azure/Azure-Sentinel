Function:
  Title: corelight_modbus_detailed parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_modbus_detailed
FunctionAlias: corelight_modbus_detailed
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_modbus_detailed = view () {
      union isfuzzy=true Corelight_v3_modbus_detailed_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="modbus_detailed",
          ts=TimeGenerated
  };
  corelight_modbus_detailed
