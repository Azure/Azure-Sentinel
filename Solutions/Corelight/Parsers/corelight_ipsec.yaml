id: ec427adf-cfa9-5b25-a2ea-9234737f9a90
Function:
  Title: corelight_ipsec parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_ipsec
FunctionAlias: corelight_ipsec
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ipsec = view () {
      union isfuzzy=true Corelight_v3_ipsec_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ipsec",
          ts=TimeGenerated
  };
  corelight_ipsec

...
