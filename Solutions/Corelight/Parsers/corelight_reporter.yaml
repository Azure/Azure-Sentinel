id: 465b0d65-391c-5179-bfd4-34be72653462
Function:
  Title: corelight_reporter parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_reporter
FunctionAlias: corelight_reporter
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_reporter = view () {
      union isfuzzy=true Corelight_v3_reporter_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="reporter",
          ts=TimeGenerated
  };
  corelight_reporter

...
