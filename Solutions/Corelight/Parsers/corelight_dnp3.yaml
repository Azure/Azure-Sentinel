id: 93c09830-25c4-5b79-852c-eeb7f2f6720d
Function:
  Title: corelight_dnp3 parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_dnp3
FunctionAlias: corelight_dnp3
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_dnp3 = view () {
      union isfuzzy=true Corelight_v3_dnp3_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="dnp3",
          ts=TimeGenerated
  };
  corelight_dnp3

...
