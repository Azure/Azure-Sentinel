id: bbf21913-3c59-54b5-ba97-966e7eed6e6b
Function:
  Title: corelight_broker parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_broker
FunctionAlias: corelight_broker
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_broker = view () {
      union isfuzzy=true Corelight_v3_broker_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="broker",
          ts=TimeGenerated
  };
  corelight_broker
