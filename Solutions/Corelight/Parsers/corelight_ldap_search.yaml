id: 959a1581-d7a1-5da0-b9fe-2ac332d8defa
Function:
  Title: corelight_ldap_search parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_ldap_search
FunctionAlias: corelight_ldap_search
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_ldap_search = view () {
      union isfuzzy=true Corelight_v3_ldap_search_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="ldap_search",
          ts=TimeGenerated
  };
  corelight_ldap_search
