id: 8743090f-fc35-5be8-ab0c-a7a76cfa1aff
Function:
  Title: corelight_profinet parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_profinet
FunctionAlias: corelight_profinet
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_profinet = view () {
      union isfuzzy=true Corelight_v3_profinet_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="profinet",
          ts=TimeGenerated
  };
  corelight_profinet

...
