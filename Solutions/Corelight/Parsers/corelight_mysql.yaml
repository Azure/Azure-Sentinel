id: 14f8caf6-fbbe-423e-9a30-c3b76c323fe7
Function:
  Title: Corelight Mysql Events
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_mysql
FunctionAlias: corelight_mysql
FunctionQuery: |
    let dummy_table = datatable(TimeGenerated: datetime, uid: string) [];
    let corelight_mysql = view () {
        union isfuzzy=true Corelight_v3_mysql_CL, dummy_table
        | summarize arg_max(TimeGenerated, *) by uid
        | join kind=leftouter 
        ( corelight_conn
        | project uid, local_orig, local_resp
        ) on $left.uid == $right.uid
        | project-away uid1
        | extend
            EventVendor = "Corelight",
            EventProduct = "CorelightSensor",
            EventType = "mysql",
            ts = TimeGenerated,
            action = cmd,
            src = id_orig_h,
            src_ip = id_orig_h,
            src_port = id_orig_p,
            dest = id_resp_h,
            dest_ip = id_resp_h,
            dest_port = id_resp_p,
            user = iff(cmd=="login",arg,""),
            query = iff(cmd=="query",arg,""),
            sensor_name = coalesce(system_name, "unknown")
        | extend
            is_broadcast =iff(src in("0.0.0.0", "255.255.255.255") or dest in("255.255.255.255", "0.0.0.0"),"true","false"),
            is_dest_internal_ip = iff(local_resp == true, "true", "false"),
            is_src_internal_ip = iff(local_orig == true, "true", "false"),
            direction=case(local_orig==true and local_resp==true, "internal", local_orig==true and local_resp==false, "outbound", local_orig==false and local_resp==false, "external", local_orig==false and local_resp==true, "inbound", "unknown")
        | project
            TimeGenerated,
            path,
            system_name,
            write_ts,
            uid,
            id_orig_h,
            id_orig_p,
            id_resp_h,
            id_resp_p,
            cmd,
            arg,
            success,
            rows,
            response,
            EventVendor,
            EventProduct,
            EventType,
            ts,
            action,
            src,
            src_ip,
            src_port,
            dest,
            dest_ip,
            dest_port,
            user,
            query,
            sensor_name,
            is_broadcast,
            is_dest_internal_ip,
            is_src_internal_ip,
            direction
    };
    corelight_mysql