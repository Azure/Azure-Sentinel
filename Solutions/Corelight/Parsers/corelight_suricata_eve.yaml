Function:
  Title: corelight_suricata_eve parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_suricata_eve
FunctionAlias: corelight_suricata_eve
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_suricata_eve = view () {
      union isfuzzy=true Corelight_v3_suricata_eve_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="suricata_eve",
          ts=TimeGenerated
  };
  corelight_suricata_eve

...
