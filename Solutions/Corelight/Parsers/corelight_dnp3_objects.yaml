Function:
  Title: corelight_dnp3_objects parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_dnp3_objects
FunctionAlias: corelight_dnp3_objects
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_dnp3_objects = view () {
      union isfuzzy=true Corelight_v3_dnp3_objects_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="dnp3_objects",
          ts=TimeGenerated
  };
  corelight_dnp3_objects
