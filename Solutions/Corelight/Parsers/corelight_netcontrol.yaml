id: 098b3bd4-15cc-5598-ae89-149f5f7b6caa
Function:
  Title: corelight_netcontrol parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_netcontrol
FunctionAlias: corelight_netcontrol
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_netcontrol = view () {
      union isfuzzy=true Corelight_v3_netcontrol_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="netcontrol",
          ts=TimeGenerated
  };
  corelight_netcontrol
