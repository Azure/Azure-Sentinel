  Title: corelight_opcua_binary_variant_data parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_opcua_binary_variant_data
FunctionAlias: corelight_opcua_binary_variant_data
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_opcua_binary_variant_data = view () {
      union isfuzzy=true Corelight_v3_opcua_binary_variant_data_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="opcua_binary_variant_data",
          ts=TimeGenerated
  };
  corelight_opcua_binary_variant_data
