Function:
  Title: corelight_corelight_ad_exe_files parser for Corelight
  Version: 1.0.0
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_corelight_ad_exe_files
FunctionAlias: corelight_corelight_ad_exe_files
FunctionQuery: |
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_corelight_ad_exe_files = view () {
      union isfuzzy=true Corelight_v3_corelight_ad_exe_files_CL, dummy_table
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="corelight_ad_exe_files",
          ts=TimeGenerated
  };
  corelight_corelight_ad_exe_files
