id: f22fb3d8-a796-57bc-aa94-4fe6b863993b
Function:
  Title: corelight_dga parser for Corelight
  Version: '2.0.0'
  LastUpdated: '2026-08-17'
Category: Microsoft Sentinel Parser
FunctionName: corelight_dga
FunctionAlias: corelight_dga
FunctionQuery: |+
  let dummy_table = datatable(TimeGenerated: datetime) [];
  let corelight_dga = view () {
      union isfuzzy=true Corelight_v3_dga_CL, dummy_table
        | extend
            _path=path,
            _system_name=system_name,
            _write_ts=write_ts
      | extend
          EventVendor="Corelight",
          EventProduct="CorelightSensor",
          EventType="dga",
          ts=TimeGenerated
  };
  corelight_dga

...
