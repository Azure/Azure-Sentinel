Function:
  Title: Parser for Microsoft Entra ID Assets
  Version: '1.0.0'
  LastUpdated: '2026-10-28'
Product: Microsoft Entra ID
Description: |
  Normalizes legacy camelCase and current PascalCase Entra asset and relationship data
  to a shared PascalCase schema at query time without modifying stored data.
  Existing PascalCase columns take precedence by column presence, including null and
  empty values. Fields absent from the source remain empty or null.
  Legacy data must already be queryable in the environment where the function runs.
  This does not migrate data or reconstruct snapshot or changefeed state.
FunctionName: EntraAssetsNormalize
FunctionAlias: EntraAssetsNormalize
