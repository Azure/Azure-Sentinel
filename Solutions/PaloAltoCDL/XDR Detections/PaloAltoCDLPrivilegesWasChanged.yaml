      \ PanOSPacketsDroppedMax:string, PanOSPacketsDroppedTunnel:string, PanOSTunnelInspectionRule:string,\
      \ PanOSTunnelRemoteUserIP:string, PanOSTunnelRemoteIMSIID:string, PanOSProtocolDataUnitsessionID:string,\
      \ end:string, PanOSUGFlags:string, PanOSUserIdentifiedBySource:string, PanOSTag:string,\
      \ PanOSEventTime:datetime, PanOSDeviceGroup:string, PanOSTemplate:string, PanOSSourceUser:string,\
      \ PanOSHipMatchType:string, PanOSSource:string, PanOSTimestampDeviceIdentification:string,\
      \ deviceExternalID:string, PanOSVirtualSystem:string, Name:string, PanOSStage:string,\
      \ PanOSAuthMethod:string, PanOSTunnelType:string, PanOSSourceRegion:string,\
      \ PanOSPrivateIPv4:string, PanOSPrivateIPv6:string, PanOSEndpointSN:string,\
      \ PanOSGlobalProtectClientVersion:string, PanOSEndpointOSType:string, PanOSEndpointOSVersion:string,\
      \ PanOSCountOfRepeats:string, PanOSQuarantineReason:string, PanOSConnectionError:string,\
      \ PanOSDescription:string, PanOSGlobalProtectGatewayLocation:string, PanOSLoginDuration:string,\
      \ PanOSConnectionMethod:string, PanOSConnectionErrorID:string, PanOSPortal:string,\
      \ PanOSSequenceNo:string, PanOSGatewaySelectionType:string, PanOSSSLResponseTime:string,\
