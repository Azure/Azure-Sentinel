      \ quote=\"'\")\n| extend DvcIpAddr = iff(DeviceCustomIPv6Address1Label == \"\
      Device IPv6 Address\", DeviceCustomIPv6Address1, \"\")\n         , DstIpAddr\
      \ = iff(DeviceCustomIPv6Address3Label == \"Destination IPv6 Address\", DeviceCustomIPv6Address3,\
      \ \"\")\n         , SrcIpAddr = iff(DeviceCustomIPv6Address2Label == \"Source\
      \ IPv6 Address\", DeviceCustomIPv6Address2, \"\")\n         , EventResultDetails\
      \ = coalesce(column_ifexists(\"reason\",\"\"),column_ifexists(\"Reason\",\"\"\
      ))\n         , SrcZone = iff(DeviceCustomString4Label == \"FromZone\", DeviceCustomString4,\
      \ \"\") \n         , DstZone = iff(DeviceCustomString5Label == \"Zone\", DeviceCustomString5,\
      \ \"\") \n         , NetworkPackets = iff(DeviceCustomNumber2Label == \"PacketsTotal\"\
      , DeviceCustomNumber2, int(null))\n         , NetworkDuration = iff(DeviceCustomNumber3Label\
      \ == \"SessionDuration\", DeviceCustomNumber3, int(null))\n         , NetworkSessionId\
      \ =  iff(DeviceCustomNumber1Label == \"SessionID\", DeviceCustomNumber1, int(null))\n\
      \         , EventStartTime = coalesce(column_ifexists(\"StartTime\",datetime(null))\n\
      \         , todatetime(column_ifexists(\"start\",\"\")))\n         , EventEndTime\
      \ = coalesce(column_ifexists(\"EventEndTime\",datetime(null))\n         , todatetime(column_ifexists(\"\
