      \          , SrcPortNumber = SourcePort\n                , DvcInboundInterface\
      \ = DeviceInboundInterface\n                , DvcOutboundInterface = DeviceOutboundInterface\n\
      \                , NetworkProtocol = Protocol\n                , NetworkApplicationProtocol\
      \ = ApplicationProtocol\n                , SrcDomain = SourceNTDomain\n    \
      \            , SrcUserId = SourceUserID\n                , DstBytes = ReceivedBytes\n\
      \                , SrcBytes = SentBytes\n| extend EventTimeIngested = todatetime(ReceiptTime)\n\
      | extend SrcNatIpAddr = case(isempty(SourceIP), SourceTranslatedAddress, \n\
      \                            pack_array(SourceTranslatedAddress,SourceIP))\n\
      | extend DstNatIpAddr = case(isempty(DestinationIP), DestinationTranslatedAddress,\n\
      \                            pack_array(DestinationTranslatedAddress, DestinationIP))\n\
      \ | extend SrcUsername = iff(isnotempty(SourceUserName), SourceUserName, suser0)\n\
      \ | extend DstUsername = iff(isnotempty(DestinationUserName), DestinationUserName,\
      \ duser0)\n| project-away ReceiptTime, Type, StartTime, EndTime, DeviceVendor,\
      \ DeviceProduct, duser0, DestinationUserName, suser0, SourceUserName, AdditionalExtensions,\
      \ DestinationTranslatedAddress, DestinationIP,SourceTranslatedAddress, SourceIP,\
      \ DeviceCustom*, FlexString*\n};\nlet q_period = 14d;\nlet dt_lookBack = 24h;\n\
      let p = _xdr_inline_PaloAltoCDLEvent\n| where TimeGenerated between (ago(q_period)..ago(dt_lookBack))\n\
      | summarize OldPrivileges = make_set(DestinationUserPrivileges) by DstUsername;\n\
      _xdr_inline_PaloAltoCDLEvent\n| where TimeGenerated > ago(dt_lookBack)\n| summarize\
      \ TimeGenerated = max(TimeGenerated), NewPrivileges = make_set(DestinationUserPrivileges)\
      \ by DstUsername\n| join kind=innerunique (p) on DstUsername\n| where tostring(OldPrivileges)\
      \ != tostring(NewPrivileges)\n| extend AccountCustomEntity = DstUsername"
