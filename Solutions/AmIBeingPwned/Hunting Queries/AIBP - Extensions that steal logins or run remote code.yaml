id: 9049c716-3a27-42ab-a8e5-e39c1c376fef
name: AIBP - Extensions that steal logins or run remote code
description: |
  'Lists browser extensions Am I Being Pwned alerted on that can steal logins or run remote code, with their latest state and install count. Use it to find extensions that are still running after a block was sent.'
requiredDataConnectors:
  - connectorId: AmIBeingPwnedEventsConnector
    dataTypes:
      - AIBPEvents_CL
tactics:
  - CredentialAccess
  - Execution
relevantTechniques:
  - T1176
  - T1555
  - T1059
query: |-
  AIBPEvents_CL
  | where TimeGenerated > ago(14d)
  | where EventType == "alert.raised"
  | where StealsLogins == true or RemoteCode == true
  | summarize arg_max(TimeGenerated, *), Alerts = dcount(AlertId), Tiers = make_set(AlertTier) by ExtensionId
  | project LastAlert = TimeGenerated, ExtensionId, ExtensionName, IssueKind, Severity, IssueState, StealsLogins, RemoteCode, InstallCount, Alerts, Tiers
  | sort by IssueState asc, InstallCount desc
version: 1.0.1
