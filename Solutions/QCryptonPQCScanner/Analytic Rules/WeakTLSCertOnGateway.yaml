id: 3c9b1e2a-7d4f-4a6b-8e3d-2f4a1c5d6b7e
name: Public TLS certificate with classical signature on Application Gateway
description: |
  An Application Gateway or Front Door is presenting a TLS certificate signed with a classical
  algorithm (RSA / ECDSA) that is quantum-vulnerable. If the certificate's validity extends past
  the plausible arrival of cryptographically-relevant quantum computers, replace with a PQ-hybrid
  certificate now.
severity: High
requiredDataConnectors:
  - connectorId: QCryptonPQCScanner
    dataTypes:
      - PQReadiness_CL
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1190
query: |
  PQReadiness_CL
  | where TimeGenerated > ago(1h)
  | where AssetKind == "tls-cert"
  | where QuantumPosture == "vulnerable"
  | project TimeGenerated, ResourceName, AssetIdentifier, SignatureAlgorithm, ExpiresOn, RiskScore, SubscriptionId, ResourceGroup
  | order by RiskScore desc
entityMappings:
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: AssetIdentifier
version: 1.0.0
kind: Scheduled
