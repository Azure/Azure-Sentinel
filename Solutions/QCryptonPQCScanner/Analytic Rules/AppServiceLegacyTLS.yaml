id: 7f8e9d1c-2b3a-4e5f-6c7d-8a9b0c1d2e3f
name: App Service using TLS < 1.3
description: |
  An Azure App Service is configured to accept inbound TLS below 1.3. Only TLS 1.3 supports
  the negotiation of hybrid PQ key exchange (X25519MLKEM768 etc.); legacy versions cannot be
  upgraded to PQ without a client protocol change.
severity: Medium
requiredDataConnectors:
  - connectorId: QCryptonPQCScanner
    dataTypes:
      - PQReadiness_CL
queryFrequency: P1D
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
query: |
  PQReadiness_CL
  | where TimeGenerated > ago(1d)
  | where AssetKind == "tls-config"
  | where ResourceType =~ "microsoft.web/sites"
  | where QuantumPosture in ("vulnerable", "partial")
  | project TimeGenerated, ResourceName, PostureReason, RiskScore, SubscriptionId, ResourceGroup
  | order by RiskScore desc
entityMappings:
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: ResourceName
version: 1.0.0
kind: Scheduled
