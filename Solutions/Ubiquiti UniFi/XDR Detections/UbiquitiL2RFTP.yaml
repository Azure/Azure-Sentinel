properties:
  id: xdr-fd200125-9d57-4838-85ca-6430c63e4e5d
  displayName: Ubiquiti - Unusual FTP connection to external server
  status: disabled
  queryCondition:
    queryText: |-
      let allowed_ftp = dynamic(['127.0.0.2']);
      UbiquitiAuditEvent
      | where EventCategory == 'firewall'
      | where ipv4_is_private(SrcIpAddr)
      | where ipv4_is_private(DstIpAddr) == 'False'
      | where DstPortNumber in ('20', '21')
      | where DstIpAddr !in (allowed_ftp)
      | extend IPCustomEntity = SrcIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ubiquiti - Unusual FTP connection to external server
      description: '''Detects local to remote (L2R) FTP connections.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1048
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
          subTechniques:
          - T1071.002
