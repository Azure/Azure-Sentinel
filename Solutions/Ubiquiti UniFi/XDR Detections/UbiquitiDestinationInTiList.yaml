properties:
  id: xdr-db60ca0b-b668-439b-b889-b63b57ef20fb
  displayName: Ubiquiti - Connection to known malicious IP or C2
  status: disabled
  queryCondition:
    queryText: |-
      let malicious_ips =
      ThreatIntelligenceIndicator
      | where isnotempty(NetworkIP)
      | summarize make_list(NetworkIP);
      UbiquitiAuditEvent
      | where EventCategory =~ 'firewall'
      | where ipv4_is_private(SrcIpAddr)
      | where ipv4_is_private(DstIpAddr) == 'False'
      | where DstIpAddr in (malicious_ips)
      | where DvcAction =~ 'Accepted' or DvcAction =~ 'Other'
      | extend IPCustomEntity = SrcIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ubiquiti - Connection to known malicious IP or C2
      description: '''Detects allowed connections to IP addresses which are in TI list and are known to be malicious.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Exfiltration
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
        - technique: T1571
        - technique: T1572
