properties:
  id: xdr-9757cee3-1a6c-4d8e-a968-3b7e48ded690
  displayName: Ubiquiti - Unknown MAC Joined AP
  status: disabled
  queryCondition:
    queryText: |-
      let lbperiod = 14d;
      let lbperiod_24h = 24h;
      let known_macs = UbiquitiAuditEvent
      | where TimeGenerated between (ago(lbperiod) .. ago(lbperiod_24h))
      | where DvcAction =~ 'JOIN'
      | summarize makeset(SrcMacAddr);
      UbiquitiAuditEvent
      | where DvcAction =~ 'JOIN'
      | where SrcMacAddr !in (known_macs)
      | extend Device = SrcMacAddr
      | extend HostCustomEntity = Device
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ubiquiti - Unknown MAC Joined AP
      description: '''Detects when device with unseen MAC Address joined AP.'''
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostCustomEntity
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1133
      customDetails:
        HostFullName: HostCustomEntity
