properties:
  id: xdr-6df85d74-e32f-4b71-80e5-bfe2af00be1c
  displayName: Ubiquiti - Large ICMP to external server
  status: disabled
  queryCondition:
    queryText: |-
      UbiquitiAuditEvent
      | where EventCategory =~ 'firewall'
      | where ipv4_is_private(SrcIpAddr)
      | where ipv4_is_private(DstIpAddr) == 'False'
      | where NetworkProtocol =~ 'ICMP'
      | summarize avg_packet_length = avg(toint(NetworkBytes))
      | extend a = 1
      | join (UbiquitiAuditEvent
        | where EventCategory =~ 'firewall'
        | where ipv4_is_private(SrcIpAddr)
        | where ipv4_is_private(DstIpAddr) == 'False'
        | where NetworkProtocol =~ 'ICMP'
        | extend a = 1) on a
      | where toint(NetworkBytes) > 2*avg_packet_length
      | extend IPCustomEntity = SrcIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ubiquiti - Large ICMP to external server
      description: '''Detects large ICMP packets to external host.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: Exfiltration
        techniques:
        - technique: T1041
      - tactic: CommandAndControl
        techniques:
        - technique: T1572
