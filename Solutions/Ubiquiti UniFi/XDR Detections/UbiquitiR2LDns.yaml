properties:
  id: xdr-14a23ded-7fb9-48ee-ba39-859517a49b51
  displayName: Ubiquiti - Unusual DNS connection
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 50;
      UbiquitiAuditEvent
      | where EventCategory =~ 'firewall'
      | where ipv4_is_private(SrcIpAddr) == 'False'
      | where ipv4_is_private(DstIpAddr)
      | where DstPortNumber == '53'
      | summarize count() by SrcIpAddr, DstIpAddr
      | where count_ > threshold
      | extend IPCustomEntity = DstIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ubiquiti - Unusual DNS connection
      description: '''Detects unusual remote to local (R2L) DNS connections.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1090
        - technique: T1572
