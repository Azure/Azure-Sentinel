properties:
  id: xdr-fe232837-9bdc-4e2b-8c08-cdac2610eed3
  displayName: Ubiquiti - connection to non-corporate DNS server
  status: disabled
  queryCondition:
    queryText: |-
      let corp_dns = dynamic(['127.0.0.2']);
      UbiquitiAuditEvent
      | where DstPortNumber == '53'
      | where DstIpAddr !in (corp_dns)
      | extend IPCustomEntity = SrcIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ubiquiti - connection to non-corporate DNS server
      description: '''Detects connections to non-corporate DNS servers.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1572
      - tactic: Exfiltration
        techniques:
        - technique: T1041
