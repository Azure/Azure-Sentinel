  detectionAction:
    alertTemplate:
      title: Ubiquiti - SSH from external source
      description: '''Detects remote to local (R2L) SSH connection to internal host.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
