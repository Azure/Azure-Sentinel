properties:
  id: xdr-7feb3c32-2a11-4eb8-a2d7-e3792b31cb80
  displayName: Ubiquiti - Possible connection to cryptominning pool
  status: disabled
  queryCondition:
    queryText: |-
      let susp_dst_ports = dynamic(['14433', '14444', '3333', '3334', '3335', '3336', '4444', '45560', '45700', '5555', '5556', '6666', '7777', '8788', '8888', '8899', '9999', '10034']);
      UbiquitiAuditEvent
      | where ipv4_is_private(SrcIpAddr)
      | where ipv4_is_private(DstIpAddr) == 'False'
      | where DstPortNumber in (susp_dst_ports)  or (DnsQuery contains 'pool' and DnsQuery contains 'xmr')
      | extend IPCustomEntity = SrcIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Ubiquiti - Possible connection to cryptominning pool
      description: '''Detects connections which may indicate that device is infected with cryptominer.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: IPCustomEntity
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1071
        - technique: T1095
        - technique: T1571
