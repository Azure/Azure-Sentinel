resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
contentProvenance:
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 48c026d8-7f36-4a95-9568-6f1420d66e37
    path: Analytic Rules/SubscriptionMigration.yaml
    version: 1.0.1
    querySha256: c208ea8fe23cc3250549ad48dcf26f1346181949c8aae4decdd7d6638562987d
    schedule:
      queryFrequency: 5m
      queryPeriod: 20m
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
