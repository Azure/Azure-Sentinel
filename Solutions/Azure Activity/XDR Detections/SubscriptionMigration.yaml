  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 48c026d8-7f36-4a95-9568-6f1420d66e37
    path: Analytic Rules/SubscriptionMigration.yaml
    version: 3.1.2
    querySha256: c208ea8fe23cc3250549ad48dcf26f1346181949c8aae4decdd7d6638562987d
    schedule:
      queryFrequency: 5m
      queryPeriod: 20m
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=5m, lookback=20m; target frequency=PT5M, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - customDetails 'DestinationTenantId' column `DestinationTenantId` requires runtime output-schema binding verification
    - customDetails 'SourceTenantId' column `SourceTenantId` requires runtime output-schema binding verification
    - Account.FullName value is retained as customDetails.AccountFullName from query column `Caller`, but its target output
