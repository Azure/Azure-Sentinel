properties:
  id: xdr-56fe0db0-6779-46fa-b3c5-006082a53064
  displayName: NRT Creation of expensive computes in Azure
  status: disabled
  queryCondition:
    queryText: |-
      let tokens = dynamic(["416","208","192","128","120","96","80","72","64","48","44","40","nc12","nc24","nv24"]);
      let operationList = dynamic(["microsoft.compute/virtualmachines/write", "microsoft.resources/deployments/write"]);
      AzureActivity
      | where OperationNameValue in~ (operationList)
      | where ActivityStatusValue startswith "Accept"
      | where Properties has 'vmSize'
      | extend parsed_property= parse_json(tostring((parse_json(Properties).responseBody))).properties
      | extend vmSize = tostring((parsed_property.hardwareProfile).vmSize)
      | mv-apply token=tokens to typeof(string) on (where vmSize contains token)
      | extend ComputerName = tostring((parsed_property.osProfile).computerName)
      | project TimeGenerated, OperationNameValue, ActivityStatusValue, Caller, CallerIpAddress, ComputerName, vmSize
      | extend Name = tostring(split(Caller,'@',0)[0]), UPNSuffix = tostring(split(Caller,'@',1)[0])
  schedule:
    frequency: PT0S
  detectionAction:
    alertTemplate:
      title: NRT Creation of expensive computes in Azure
      description: "'Identifies the creation of large size or expensive VMs (with GPUs or with a large number of virtual CPUs)\
        \ in Azure.\nAn adversary may create new or update existing virtual machines to evade defenses or use them for cryptomining\
        \ purposes.\nFor Windows/Linux Vm Sizes, see https://docs.microsoft.com/azure/virtual-machines/windows/sizes \nAzure\
        \ VM Naming Conventions, see https://docs.microsoft.com/azure/virtual-machines/vm-naming-conventions'"
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        hosts:
        - id: host1
          nameColumn: ComputerName
        ips:
        - id: ip1
          addressColumn: CallerIpAddress
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1578
      customDetails:
        AccountFullName: Caller
