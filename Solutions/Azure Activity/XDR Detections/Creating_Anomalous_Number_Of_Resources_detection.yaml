properties:
  id: xdr-suspicious-number-of-resource-creation-or-deployment-activities-361dd1e3
  displayName: Suspicious number of resource creation or deployment activities
  status: disabled
  queryCondition:
    queryText: |-
      let szOperationNames = dynamic(["microsoft.compute/virtualMachines/write", "microsoft.resources/deployments/write"]);
      let starttime = 7d;
      let endtime = 1d;
      let timeframe = 1d;
      let TimeSeriesData =
      AzureActivity
      | where TimeGenerated between (startofday(ago(starttime)) .. startofday(now()))
      | where OperationNameValue in~ (szOperationNames)
      | project TimeGenerated, Caller
      | make-series Total = count() on TimeGenerated from startofday(ago(starttime)) to startofday(now()) step timeframe by Caller;
      TimeSeriesData
      | extend (anomalies, score, baseline) = series_decompose_anomalies(Total, 3, -1, 'linefit')
      | mv-expand Total to typeof(double), TimeGenerated to typeof(datetime), anomalies to typeof(double), score to typeof(double), baseline to typeof(long)
      | where TimeGenerated >= startofday(ago(endtime))
      | where anomalies > 0 and baseline > 0
      | project Caller, TimeGenerated, Total, baseline, anomalies, score
      | join (AzureActivity
      | where TimeGenerated > startofday(ago(endtime))
      | where OperationNameValue in~ (szOperationNames)
      | summarize make_set(OperationNameValue,100), make_set(_ResourceId,100), make_set(CallerIpAddress,100) by bin(TimeGenerated, timeframe), Caller
      ) on TimeGenerated, Caller
      | mv-expand CallerIpAddress=set_CallerIpAddress
      | project-away Caller1
      | extend Name = iif(Caller has '@',tostring(split(Caller,'@',0)[0]),"")
      | extend UPNSuffix = iif(Caller has '@',tostring(split(Caller,'@',1)[0]),"")
      | extend AadUserId = iif(Caller !has '@',Caller,"")
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Suspicious number of resource creation or deployment activities
      description: '''Indicates when an anomalous number of VM creations or deployment activities occur in Azure via the AzureActivity
        log. This query generates the baseline pattern of cloud resource creation by an individual and generates an anomaly
        when any unusual spike is detected. These anomalies from unusual or privileged users could be an indication of a cloud
        infrastructure takedown by an adversary.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
        - id: account2
          aadUserIdColumn: AadUserId
        ips:
        - id: ip1
          addressColumn: CallerIpAddress
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1496
