kind: CustomDetection
resourceType: Microsoft.Security/detectionRules
apiVersion: 2026-06-01-preview
requiredDataConnectors:
- connectorId: AzureActivity
  dataTypes:
  - AzureActivity
contentProvenance:
  requiredWorkloads:
  - workload: sentinel
    dataTypes:
    - AzureActivity
  requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes:
    - AzureActivity
  dependencyReviewRequired: false
  source:
    platform: Microsoft Sentinel
    kind: AnalyticsRule
    id: 68c89998-8052-4c80-a1f6-9d81060b6d57
    path: Analytic Rules/Machine_Learning_Creation.yaml
    version: 1.0.0
    querySha256: 0fc9454249496fc96881b16826f19a58a9da8c2f449168e8f296c40ac8096913
    schedule:
      queryFrequency: 1d
      queryPeriod: 1d
  conversion:
    tool: sentinel-to-xdr-migration
    version: 0.1.0
    status: converted
    reviewRequired: false
    reviewReasons: []
    requiredWorkloads:
    - sentinel
    warnings:
    - 'Schedule assessment: source frequency=1d, lookback=1d; target frequency=P1D, native lookback=unknown/unconfigured;
      mixed, Sentinel-only, or unknown query surface; no custom lookback is configured in the payload. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Account.Name column `Caller` was mapped as a complete UPN identity
    informational:
