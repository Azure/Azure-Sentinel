id: d1000000-0000-4a2b-8c3d-000000000001
name: Claroty xDome - Internet-exposed OT/IoT devices
description: |
  Lists OT and IoT devices that Claroty xDome reports as communicating with the internet. Operational
  technology and IoT assets should rarely talk directly to the internet; those that do are candidate
  pivot points for command-and-control or data exfiltration and should be reviewed.
requiredDataConnectors:
- connectorId: ClarotyXDomeCCFConnector
  dataTypes:
  - ClarotyXDomeDevice_CL
tactics:
- CommandAndControl
- Exfiltration
query: |
  ClarotyXDomeDevice
  | where InternetCommunication == true
  | where DeviceCategory in~ ('OT', 'IoT')
  | project
      TimeGenerated,
      DeviceName,
      DeviceCategory,
      DeviceSubcategory,
      DeviceType,
      SiteName,
      PurdueLevel,
      RiskLevel,
      IpAddr,
      KnownVulnerabilities
  | sort by RiskLevel desc
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IpAddr
