id: d1000000-0000-4a2b-8c3d-000000000002
name: Claroty xDome - Devices using insecure protocols
description: |
  Surfaces devices that Claroty xDome reports as using insecure or clear-text protocols (for example
  Telnet, FTP, or unauthenticated industrial protocols). These weaken the environment and can enable
  credential capture or lateral movement, especially on OT segments.
requiredDataConnectors:
- connectorId: ClarotyXDomeCCFConnector
  dataTypes:
  - ClarotyXDomeDevice_CL
tactics:
- LateralMovement
- CredentialAccess
query: |
  ClarotyXDomeDevice
  | where array_length(InsecureProtocols) > 0
  | project
      TimeGenerated,
      DeviceName,
      DeviceCategory,
      DeviceType,
      SiteName,
      PurdueLevel,
      RiskLevel,
      InsecureProtocols,
      IpAddr,
      IsOnline
  | sort by RiskLevel desc
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IpAddr
