id: d1000000-0000-4a2b-8c3d-000000000003
name: Claroty xDome - OT configuration or mode changes
description: |
  Highlights Claroty xDome OT activity events that represent configuration uploads/downloads, firmware
  or program transfers, or controller mode changes, normalized to the ASIM Network Session schema.
  These engineering operations against industrial controllers can be legitimate maintenance or an
  indicator of tampering, and are worth reviewing against a change window.
requiredDataConnectors:
- connectorId: ClarotyXDomeCCFConnector
  dataTypes:
  - ClarotyXDomeOTEvent_CL
tactics:
- Impact
query: |
  ASimNetworkSessionClarotyXDome
  | where EventOriginalType has_any ('config', 'program', 'firmware', 'mode', 'download', 'upload') or isnotempty(DvcAction)
  | project
      TimeGenerated,
      EventOriginalType,
      DvcAction,
      SrcHostname,
      SrcIpAddr,
      DstHostname,
      DstIpAddr,
      NetworkApplicationProtocol,
      EventMessage
  | sort by TimeGenerated desc
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DstHostname
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: DstIpAddr
