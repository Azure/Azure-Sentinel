id: b2000000-0000-4a2b-8c3d-000000000006
Category: Microsoft Sentinel Parser
Function:
  Title: Audit Event ASIM filtering parser for Claroty xDome audit log
  Version: '1.0.0'
  LastUpdated: '2026-08-01'
Product:
  Name: Claroty xDome
Normalization:
  Schema: AuditEvent
  Version: '0.1'
References:
- Title: ASIM Audit Event Schema
  Link: https://aka.ms/ASimAuditEventDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
Description: |
  This ASIM parser supports filtering and normalizing Claroty xDome audit log events,
  ingested into the ClarotyXDomeAuditLog_CL table, to the ASIM Audit Event normalized schema.
FunctionName: vimAuditEventClarotyXDome
FunctionAlias: vimAuditEventClarotyXDome
EquivalentBuiltInParser: _Im_AuditEvent_ClarotyXDome
FunctionParams:
- Name: starttime
  Type: datetime
  Default: datetime(null)
- Name: endtime
  Type: datetime
  Default: datetime(null)
- Name: srcipaddr_has_any_prefix
  Type: dynamic
  Default: dynamic([])
- Name: eventtype_in
  Type: dynamic
  Default: dynamic([])
- Name: eventresult
  Type: string
  Default: '*'
- Name: actorusername_has_any
  Type: dynamic
  Default: dynamic([])
- Name: operation_has_any
  Type: dynamic
  Default: dynamic([])
- Name: object_has_any
  Type: dynamic
  Default: dynamic([])
- Name: newvalue_has_any
  Type: dynamic
  Default: dynamic([])
- Name: disabled
  Type: bool
  Default: false
FunctionQuery: |
  let parser = (
      starttime:datetime=datetime(null),
      endtime:datetime=datetime(null),
      srcipaddr_has_any_prefix:dynamic=dynamic([]),
      eventtype_in:dynamic=dynamic([]),
      eventresult:string='*',
      actorusername_has_any:dynamic=dynamic([]),
      operation_has_any:dynamic=dynamic([]),
      object_has_any:dynamic=dynamic([]),
      newvalue_has_any:dynamic=dynamic([]),
      disabled:bool=false
  ) {
      ClarotyXDomeAuditLog_CL
      | where not(disabled)
          and (isnull(starttime) or TimeGenerated >= starttime)
          and (isnull(endtime) or TimeGenerated <= endtime)
          and (array_length(actorusername_has_any) == 0 or Username has_any (actorusername_has_any))
          and (array_length(operation_has_any) == 0 or Action has_any (operation_has_any))
          and (array_length(object_has_any) == 0 or Category has_any (object_has_any))
      | extend actlower = tolower(Action)
      | extend
          EventCount = int(1),
          EventStartTime = TimeGenerated,
          EventEndTime = TimeGenerated,
          EventProduct = 'xDome',
          EventVendor = 'Claroty',
          EventSchema = 'AuditEvent',
          EventSchemaVersion = '0.1',
          EventResult = 'Success',
          EventOriginalUid = tostring(ID),
          EventMessage = Details,
          Operation = Action,
          Object = Category,
          ObjectType = 'Other',
          NewValue = '',
          ActorUsername = Username,
          ActorUsernameType = 'Simple',
          ActorDisplayName = UserDisplayName,
          SrcIpAddr = extract(@'\b(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b', 0, tostring(Details)),
          Dvc = 'xDome'
      | extend
          EventType = case(
              actlower has 'create' or actlower has 'add', 'Create',
              actlower has 'delete' or actlower has 'remove', 'Delete',
              actlower has 'update' or actlower has 'edit' or actlower has 'modify' or actlower has 'change', 'Set',
              actlower has 'view' or actlower has 'read' or actlower has 'get' or actlower has 'export' or actlower has 'download', 'Read',
              actlower has 'enable', 'Enable',
              actlower has 'disable', 'Disable',
              actlower has 'execute' or actlower has 'run', 'Execute',
              'Other')
      | extend
          User = ActorUsername,
          IpAddr = SrcIpAddr
      | where (eventresult == '*' or EventResult =~ eventresult)
          and (array_length(eventtype_in) == 0 or EventType in~ (eventtype_in))
          and (array_length(srcipaddr_has_any_prefix) == 0 or has_any_ipv4_prefix(SrcIpAddr, srcipaddr_has_any_prefix))
          and (array_length(newvalue_has_any) == 0 or NewValue has_any (newvalue_has_any))
  };
  parser(
      starttime = starttime,
      endtime = endtime,
      srcipaddr_has_any_prefix = srcipaddr_has_any_prefix,
      eventtype_in = eventtype_in,
      eventresult = eventresult,
      actorusername_has_any = actorusername_has_any,
      operation_has_any = operation_has_any,
      object_has_any = object_has_any,
      newvalue_has_any = newvalue_has_any,
      disabled = disabled
  )
