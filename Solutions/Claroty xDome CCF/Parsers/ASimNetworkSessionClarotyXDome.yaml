id: b2000000-0000-4a2b-8c3d-000000000001
Category: Microsoft Sentinel Parser
Function:
  Title: Network Session ASIM parser for Claroty xDome OT activity events
  Version: '1.0.0'
  LastUpdated: '2026-08-01'
Product:
  Name: Claroty xDome
Normalization:
  Schema: NetworkSession
  Version: '0.2.7'
References:
- Title: ASIM Network Session Schema
  Link: https://aka.ms/ASimNetworkSessionDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
Description: |
  This ASIM parser supports normalizing Claroty xDome OT activity events,
  ingested into the ClarotyXDomeOTEvent_CL table, to the ASIM Network Session normalized schema.
FunctionName: ASimNetworkSessionClarotyXDome
FunctionAlias: ASimNetworkSessionClarotyXDome
EquivalentBuiltInParser: _ASim_NetworkSession_ClarotyXDome
FunctionParams:
- Name: disabled
  Type: bool
  Default: false
FunctionQuery: |
  let parser = (disabled: bool = false) {
      ClarotyXDomeOTEvent_CL
      | where not(disabled)
      | extend
          EventOriginalType = EventType,
          EventOriginalUid = tostring(EventId),
          EventOriginalSubType = Mode,
          EventMessage = Description
      | extend
          EventCount = int(1),
          EventStartTime = TimeGenerated,
          EventEndTime = TimeGenerated,
          EventType = 'NetworkSession',
          EventResult = 'Success',
          EventProduct = 'xDome',
          EventVendor = 'Claroty',
          EventSchema = 'NetworkSession',
          EventSchemaVersion = '0.2.7',
          DvcAction = Mode,
          SrcIpAddr = SourceIP,
          DstIpAddr = DestIP,
          SrcPortNumber = SourcePort,
          DstPortNumber = DestPort,
          NetworkProtocol = toupper(IpProtocol),
          NetworkApplicationProtocol = Protocol,
          SrcHostname = SourceDeviceName,
          DstHostname = DestDeviceName,
          SrcUsername = SourceUsername,
          SrcDvcId = SourceAssetId,
          DstDvcId = DestAssetId
      | extend
          IpAddr = SrcIpAddr,
          Src = SrcIpAddr,
          Dst = DstIpAddr,
          User = SrcUsername,
          Hostname = DstHostname
  };
  parser(disabled = disabled)
