id: a1c2e4f6-1111-4a2b-8c3d-100000000004
Function:
  Title: Parser for ClarotyXDomeAlert
  Version: '1.0.0'
  LastUpdated: '2026-07-29'
Category: Microsoft Sentinel Parser
FunctionName: ClarotyXDomeAlert
FunctionAlias: ClarotyXDomeAlert
FunctionQuery: |
  let ClarotyXDomeAlert_view = view () {
      ClarotyXDomeAlert_CL
      | summarize arg_max(UpdatedTime, *) by ID
      | extend EventVendor = 'Claroty', EventProduct = 'xDome'
      | project
          TimeGenerated,
          AlertUpdated = UpdatedTime,
          AlertId = ID,
          AlertName, AlertTypeName, AlertClass,
          AlertCategory = Category,
          Status, Description,
          DevicesCount, UnresolvedDevicesCount, MedicalDevicesCount,
          IoTDevicesCount = IOTDevicesCount,
          ITDevicesCount, OTDevicesCount,
          MitreTechniqueIcsIds = MitreTechniqueICSIds,
          MitreTechniqueIcsNames = MitreTechniqueICSNames,
          MitreTechniqueEnterpriseIds, MitreTechniqueEnterpriseNames,
          MaliciousIpTags = MaliciousIPTagsList,
          EventVendor, EventProduct
  };
  ClarotyXDomeAlert_view
