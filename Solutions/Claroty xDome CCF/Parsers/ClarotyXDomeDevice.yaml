id: a1c2e4f6-1111-4a2b-8c3d-100000000001
Function:
  Title: Parser for ClarotyXDomeDevice
  Version: '1.0.0'
  LastUpdated: '2026-07-29'
Category: Microsoft Sentinel Parser
FunctionName: ClarotyXDomeDevice
FunctionAlias: ClarotyXDomeDevice
FunctionQuery: |
  let ClarotyXDomeDevice_view = view () {
      ClarotyXDomeDevice_CL
      | summarize arg_max(TimeGenerated, *) by DeviceUid
      | extend
          DeviceId = DeviceUid,
          Hostname = DeviceName,
          IpAddr = tostring(IpList[0]),
          IpAddresses = IpList,
          MacAddr = tostring(MacList[0]),
          OsFamily = OsCategory,
          RiskLevel = RiskScore,
          NetworkZone = PurdueLevel,
          EventVendor = 'Claroty',
          EventProduct = 'xDome'
      | project
          TimeGenerated, DeviceId, DeviceName, Hostname, AssetId,
          DeviceCategory, DeviceSubcategory, DeviceType, DeviceTypeFamily,
          Manufacturer, Model, SerialNumber,
          OsName, OsVersion, OsFamily,
          IpAddr, IpAddresses, MacAddr, NetworkList, VlanList,
          SiteName, SiteGroupName, NetworkZone, PurdueLevel,
          RiskLevel, RiskScorePoints, Criticality,
          IsOnline, Retired, KnownVulnerabilities,
          InternetCommunication, InsecureProtocols, Labels,
          SwitchIpList, SwitchNameList, SwitchPortList,
          FirstSeenList, LastSeenList, LastSeenReported,
          EventVendor, EventProduct
  };
  ClarotyXDomeDevice_view
