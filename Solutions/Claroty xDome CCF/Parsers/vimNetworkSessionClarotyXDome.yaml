id: b2000000-0000-4a2b-8c3d-000000000002
Category: Microsoft Sentinel Parser
Function:
  Title: Network Session ASIM filtering parser for Claroty xDome OT activity events
  Version: '1.0.0'
  LastUpdated: '2026-08-01'
Product:
  Name: Claroty xDome
Normalization:
  Schema: NetworkSession
  Version: '0.2.7'
References:
- Title: ASIM Network Session Schema
  Link: https://aka.ms/ASimNetworkSessionDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
Description: |
  This ASIM parser supports filtering and normalizing Claroty xDome OT activity events,
  ingested into the ClarotyXDomeOTEvent_CL table, to the ASIM Network Session normalized schema.
FunctionName: vimNetworkSessionClarotyXDome
FunctionAlias: vimNetworkSessionClarotyXDome
EquivalentBuiltInParser: _Im_NetworkSession_ClarotyXDome
FunctionParams:
- Name: starttime
  Type: datetime
  Default: datetime(null)
- Name: endtime
  Type: datetime
  Default: datetime(null)
- Name: srcipaddr_has_any_prefix
  Type: dynamic
  Default: dynamic([])
- Name: dstipaddr_has_any_prefix
  Type: dynamic
  Default: dynamic([])
- Name: ipaddr_has_any_prefix
  Type: dynamic
  Default: dynamic([])
- Name: dstportnumber
  Type: int
  Default: int(null)
- Name: hostname_has_any
  Type: dynamic
  Default: dynamic([])
- Name: dvcaction
  Type: dynamic
  Default: dynamic([])
- Name: eventresult
  Type: string
  Default: '*'
- Name: disabled
  Type: bool
  Default: false
FunctionQuery: |
  let parser = (
      starttime:datetime=datetime(null),
      endtime:datetime=datetime(null),
      srcipaddr_has_any_prefix:dynamic=dynamic([]),
      dstipaddr_has_any_prefix:dynamic=dynamic([]),
      ipaddr_has_any_prefix:dynamic=dynamic([]),
      dstportnumber:int=int(null),
      hostname_has_any:dynamic=dynamic([]),
      dvcaction:dynamic=dynamic([]),
      eventresult:string='*',
      disabled:bool=false
  ) {
      let src_or_any = set_union(srcipaddr_has_any_prefix, ipaddr_has_any_prefix);
      let dst_or_any = set_union(dstipaddr_has_any_prefix, ipaddr_has_any_prefix);
      ClarotyXDomeOTEvent_CL
      | where not(disabled)
          and (isnull(starttime) or TimeGenerated >= starttime)
          and (isnull(endtime) or TimeGenerated <= endtime)
          and (array_length(dvcaction) == 0 or Mode has_any (dvcaction))
          and (isnull(dstportnumber) or DestPort == dstportnumber)
          and (array_length(hostname_has_any) == 0 or SourceDeviceName has_any (hostname_has_any) or DestDeviceName has_any (hostname_has_any))
          and (array_length(src_or_any) == 0 or has_any_ipv4_prefix(SourceIP, src_or_any))
          and (array_length(dst_or_any) == 0 or has_any_ipv4_prefix(DestIP, dst_or_any))
      | extend
          EventOriginalType = EventType,
          EventOriginalUid = tostring(EventID),
          EventOriginalSubType = Mode,
          EventMessage = Description
      | extend
          EventCount = int(1),
          EventStartTime = TimeGenerated,
          EventEndTime = TimeGenerated,
          EventType = 'NetworkSession',
          EventResult = 'Success',
          EventProduct = 'xDome',
          EventVendor = 'Claroty',
          EventSchema = 'NetworkSession',
          EventSchemaVersion = '0.2.7',
          DvcAction = Mode,
          SrcIpAddr = SourceIP,
          DstIpAddr = DestIP,
          SrcPortNumber = SourcePort,
          DstPortNumber = DestPort,
          NetworkProtocol = toupper(IPProtocol),
          NetworkApplicationProtocol = Protocol,
          SrcHostname = SourceDeviceName,
          DstHostname = DestDeviceName,
          SrcUsername = SourceUsername,
          SrcDvcId = SourceAssetID,
          DstDvcId = DestAssetID
      | extend
          IpAddr = SrcIpAddr,
          Src = SrcIpAddr,
          Dst = DstIpAddr,
          User = SrcUsername,
          Hostname = DstHostname
      | where (eventresult == '*' or EventResult =~ eventresult)
  };
  parser(
      starttime = starttime,
      endtime = endtime,
      srcipaddr_has_any_prefix = srcipaddr_has_any_prefix,
      dstipaddr_has_any_prefix = dstipaddr_has_any_prefix,
      ipaddr_has_any_prefix = ipaddr_has_any_prefix,
      dstportnumber = dstportnumber,
      hostname_has_any = hostname_has_any,
      dvcaction = dvcaction,
      eventresult = eventresult,
      disabled = disabled
  )
