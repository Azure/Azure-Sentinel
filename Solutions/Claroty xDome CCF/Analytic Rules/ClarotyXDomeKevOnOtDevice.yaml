id: c1000000-0000-4a2b-8c3d-000000000001
name: Claroty xDome - Known-exploited vulnerability on an OT device
version: 1.0.0
kind: Scheduled
description: |
  Identifies devices categorized as OT that are affected by a vulnerability flagged as known-exploited
  (CISA KEV) by Claroty xDome. Known-exploited vulnerabilities on operational technology assets represent
  a high-priority remediation and monitoring target.
severity: High
requiredDataConnectors:
- connectorId: ClarotyXDomeCCFConnector
  dataTypes:
  - ClarotyXDomeDeviceVulnerability_CL
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
status: Available
tactics:
- InitialAccess
relevantTechniques:
- T1190
query: |
  ClarotyXDomeDeviceVulnerability
  | where VulnerabilityIsKnownExploited == true
  | where DeviceCategory =~ 'OT'
  | project
      TimeGenerated,
      DeviceUid,
      DeviceCategory,
      DeviceSiteName,
      DeviceRiskScore,
      VulnerabilityId,
      VulnerabilityName,
      VulnerabilityCveIds,
      VulnerabilityScore,
      VulnerabilityEpssScore
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceUid
customDetails:
  VulnerabilityName: VulnerabilityName
  CveIds: VulnerabilityCveIds
  Site: DeviceSiteName
  DeviceRiskScore: DeviceRiskScore
alertDetailsOverride:
  alertDisplayNameFormat: 'Known-exploited vulnerability {{VulnerabilityName}} on OT device {{DeviceUid}}'
  alertDescriptionFormat: 'Device {{DeviceUid}} at site {{DeviceSiteName}} is affected by known-exploited vulnerability {{VulnerabilityName}} ({{VulnerabilityCveIds}}).'
