id: c1000000-0000-4a2b-8c3d-000000000002
name: Claroty xDome - High or critical severity threat alert on a device
version: 1.0.0
kind: Scheduled
description: |
  Surfaces Claroty xDome device alerts normalized to the ASIM Alert Event schema whose severity is
  High or Critical. These alerts typically indicate threat activity, malicious communication, or
  policy violations affecting an OT/IoT/IT device and warrant investigation.
severity: High
requiredDataConnectors:
- connectorId: ClarotyXDomeCCFConnector
  dataTypes:
  - ClarotyXDomeDeviceAlert_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
status: Available
tactics:
- Impact
query: |
  ASimAlertEventClarotyXDome
  | where EventSeverity in ('High', 'Critical')
  | project
      TimeGenerated,
      AlertId,
      AlertName,
      AlertType,
      EventSeverity,
      ThreatCategory,
      AttackTechniques,
      DvcHostname,
      DvcIpAddr,
      DstIpAddr,
      DeviceCategory,
      DeviceSiteName
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DvcHostname
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: DvcIpAddr
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: DstIpAddr
customDetails:
  AlertName: AlertName
  Severity: EventSeverity
  ThreatCategory: ThreatCategory
  Site: DeviceSiteName
alertDetailsOverride:
  alertDisplayNameFormat: '{{EventSeverity}} xDome alert {{AlertName}} on {{DvcHostname}}'
  alertDescriptionFormat: 'Claroty xDome raised a {{EventSeverity}} severity alert ({{AlertName}}) on device {{DvcHostname}} ({{DvcIpAddr}}) at site {{DeviceSiteName}}.'
