properties:
  id: xdr-57e56fc9-417a-4f41-a579-5475aea7b8ce
  displayName: Potential DHCP Starvation Attack
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 1000;
      Infoblox
      | where ProcessName =~ "dhcpd" and Log_Type =~ "DHCPREQUEST"
      | summarize count() by SrcIpAddr, bin(TimeGenerated,5m)
      | where count_ > threshold
      | join kind=inner (Infoblox
          | where ProcessName =~ "dhcpd" and Log_Type =~ "DHCPREQUEST"
          ) on SrcIpAddr
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Potential DHCP Starvation Attack
      description: '''This creates an incident in the event that an excessive amount of DHCPREQUEST have been recieved by
        a DHCP Server and could potentially be an indication of a DHCP Starvation Attack.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1200
