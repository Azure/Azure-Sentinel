properties:
  id: xdr-5b8344eb-fa28-4ac3-bcff-bc19d5d63089
  displayName: Detect DNS queries reporting multiple errors from different clients - Static threshold based (ASIM DNS Solution)
  status: disabled
  queryCondition:
    queryText: "let lookback=1h;\nlet threshold = 2;\nlet errors = dynamic(['NXDOMAIN', 'SERVFAIL', 'REFUSED']);\n_Im_Dns(starttime=ago(lookback))\n  | where EventResultDetails has_any (errors)\n  | summarize SrcIPs = make_set(SrcIpAddr, 100), Dvcs = make_set(Dvc, 100), ResourceIds = make_set(_ResourceId, 100) by DnsQuery, bin(TimeGenerated, 10min)\n  | where array_length(SrcIPs) >= threshold\n  | extend TotalIPs = array_length(SrcIPs),IPCountthreshold = threshold\n  | extend DomainName = strcat(split(DnsQuery, \".\")[1], \".\", split(DnsQuery, \".\")[2])\n  | mv-expand SrcIPs\n  | extend SrcIP = tostring(SrcIPs)\n  | mv-expand Dvcs\n  | extend Dvc = tostring(Dvcs)\n  | mv-expand ResourceIds\n  | extend ResourceId = tostring(ResourceIds)\n  | extend Dvc = strcat(split(Dvc, \".\")[0])\n  | summarize Start=min(TimeGenerated), End=max(TimeGenerated) by SrcIP, Dvc, ResourceId, DnsQuery, DomainName, SrcIPs = tostring(SrcIPs), IPCountthreshold = threshold, TotalIPs\n  | extend HostName = tostring(split(Dvc,\
      \ \".\")[0]), DomainIndex = toint(indexof(Dvc, '.'))\n  | extend HostNameDomain = iff(DomainIndex != -1, substring(Dvc, DomainIndex + 1), Dvc)"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Detect DNS queries reporting multiple errors from different clients - Static threshold based (ASIM DNS Solution)
      description: '''This rule creates an alert when multiple clients report errors for the same DNS query. This helps in identifying possible similar C2 communications originating from different clients. It utilizes [ASIM](https://aka.ms/AboutASIM) normalization and is applied to any source that supports the ASIM DNS schema.'''
      severity: medium
      entityMappings:
        dns:
        - id: dn1
          domainNameColumn: DnsQuery
        ips:
        - id: ip1
          addressColumn: SrcIP
        azureResources:
        - id: azureResource1
          resourceIdColumn: ResourceId
        hosts:
        - id: host1
          nameColumn: HostName
          ntDomainColumn: HostNameDomain
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1568
        - technique: T1573
        - technique: T1008
      customDetails:
        SrcIPs: SrcIPs
        IPCountthreshold: IPCountthreshold
        TotalIPs: TotalIPs
        UrlUrl: DnsQuery
