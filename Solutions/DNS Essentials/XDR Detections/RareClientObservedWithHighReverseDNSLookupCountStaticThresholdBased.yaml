properties:
  id: xdr-rare-client-observed-with-high-reverse-dns-lookup-count-static-threshold-77b7c820
  displayName: Rare client observed with high reverse DNS lookup count - Static threshold based (ASIM DNS Solution)
  status: disabled
  queryCondition:
    queryText: |-
      let threshold = 10;
      let stime = 10d;
      let etime = 1d;
      let SearchDomain = dynamic(["in-addr.arpa"]);
      _Im_Dns(starttime=ago(etime), domain_has_any=SearchDomain)
      | summarize
        StartTimeUtc = min(TimeGenerated),
        EndTimeUtc = max(TimeGenerated),
        DNSQueryCount=dcount(DnsQuery)
        by SrcIpAddr
      | where DNSQueryCount > threshold
      | project StartTimeUtc, EndTimeUtc, SrcIpAddr, DNSQueryCount
      | join kind=leftanti (_Im_Dns(starttime=ago(stime), endtime=ago(etime), domain_has_any=SearchDomain)
        | summarize DNSQueryCount=dcount(DnsQuery) by SrcIpAddr, bin(TimeGenerated, 1d)
        | where DNSQueryCount > threshold
        | project SrcIpAddr, DNSQueryCount
        )
        on SrcIpAddr
      | join kind=inner (_Im_Dns(starttime=ago(etime), domain_has_any=SearchDomain)
        | summarize DNSQueries=make_set(DnsQuery, 1000) by SrcIpAddr)
        on SrcIpAddr
      | extend DNSQuerythreshold = threshold
      | project-away SrcIpAddr1
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Rare client observed with high reverse DNS lookup count - Static threshold based (ASIM DNS Solution)
      description: '''This rule identifies clients with high reverse DNS counts, which could be carrying out reconnaissance
        or discovery activity. This helps in detecting the possible initial phases of an attack, like discovery and reconnaissance.
        It utilizes [ASIM](https://aka.ms/AboutASIM) normalization and is applied to any source that supports the ASIM DNS
        schema.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: Reconnaissance
        techniques:
        - technique: T1590
