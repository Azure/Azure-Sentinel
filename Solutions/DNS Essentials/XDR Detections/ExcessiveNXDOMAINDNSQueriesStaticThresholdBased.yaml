properties:
  id: xdr-4ab8b09e-3c23-4974-afbe-7e653779eb2b
  displayName: Detect excessive NXDOMAIN DNS queries - Static threshold based (ASIM DNS Solution)
  status: disabled
  queryCondition:
    queryText: |-
      let lookback = 1h;
      let threshold = 200;
      _Im_Dns(starttime=ago(lookback), responsecodename='NXDOMAIN')
      | summarize NXDOMAINCount=count() by SrcIpAddr, bin(TimeGenerated, 15m)
      | where NXDOMAINCount > threshold
      | join kind=inner (_Im_Dns(starttime=ago(lookback), responsecodename='NXDOMAIN')
        | summarize DNSQueries = makeset(DnsQuery) by SrcIpAddr)
        on SrcIpAddr
      | extend NXDOMAINthreshold=threshold
      | project-away SrcIpAddr1
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Detect excessive NXDOMAIN DNS queries - Static threshold based (ASIM DNS Solution)
      description: '''This rule generates an alert when the configured threshold for DNS queries to non-existent domains is
        breached. This helps in identifying possible C2 communications. It utilizes [ASIM](https://aka.ms/AboutASIM) normalization
        and is applied to any source that supports the ASIM DNS schema.'''
      severity: medium
      entityMappings:
        ips:
        - id: ip1
          addressColumn: SrcIpAddr
      tactics:
      - tactic: CommandAndControl
        techniques:
        - technique: T1568
        - technique: T1008
      customDetails:
        DNSQueries: DNSQueries
        NXDOMAINthreshold: NXDOMAINthreshold
        NXDOMAINCount: NXDOMAINCount
