properties:
  id: xdr-0b85a077-8ba5-4cb5-90f7-1e882afe40c9
  displayName: GitHub - User was invited to the repository
  status: disabled
  queryCondition:
    queryText: |-
      GitHubAuditData
      | where Action == "org.invite_member"
      | project Actor, Action
      | extend Name = iif(Actor contains "@", split(Actor, "@")[0], Actor)
      | extend UPNSuffix = iif(Actor contains "@", split(Actor, "@")[1], "")
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: GitHub - User was invited to the repository
      description: '''Detect activities when a user was invited to the repository. This query runs every day and its severity
        is Medium.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: Actor
