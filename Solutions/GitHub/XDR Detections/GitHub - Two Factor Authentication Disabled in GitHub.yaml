properties:
  id: xdr-3ff0fffb-d963-40c0-b235-3404f915add7
  displayName: GitHub Two Factor Auth Disable
  status: disabled
  queryCondition:
    queryText: |-
      GitHubAuditData
      | where Action == "org.disable_two_factor_requirement"
      | project TimeGenerated, Action, Actor, Country, Repository
      | extend Name = iif(Actor contains "@", split(Actor, "@")[0], Actor)
      | extend UPNSuffix = iif(Actor contains "@", split(Actor, "@")[1], "")
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: GitHub Two Factor Auth Disable
      description: '''Two-factor authentication is a process where a user is prompted during the sign-in process for an additional
        form of identification, such as to enter a code on their cellphone or to provide a fingerprint scan. Two factor authentication
        reduces the risk of account takeover. Attacker will want to disable such security tools in order to go undetected.
        '''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
      customDetails:
        AccountFullName: Actor
