properties:
  id: xdr-0b85a077-8ba5-4cb5-90f7-1e882afe10c7
  displayName: GitHub - pull request was created
  status: disabled
  queryCondition:
    queryText: 'GitHubAuditData

      | where Action == "pull_request.create"

      | project Actor, Action

      | extend AccountName = tostring(split(Actor, "@")[0]), AccountUPNSuffix = tostring(split(Actor, "@")[1])'
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: GitHub - pull request was created
      description: '''Detect activities when a pull request was created. This query runs every day and its severity is Medium.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: AccountName
          upnSuffixColumn: AccountUPNSuffix
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: Actor
