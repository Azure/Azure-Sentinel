properties:
  id: xdr-0b85a077-8ba5-4cb5-90f7-1e882afe20c9
  displayName: GitHub - User visibility Was changed
  status: disabled
  queryCondition:
    queryText: |-
      GitHubAuditData
      | where Visibility != PreviousVisibility
      | project Actor, PreviousVisibility, Visibility
      | extend Name = iif(Actor contains "@", split(Actor, "@")[0], Actor)
      | extend UPNSuffix = iif(Actor contains "@", split(Actor, "@")[1], "")
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: GitHub - User visibility Was changed
      description: '''Detect activities when a user visibility Was changed. This query runs every day and its severity is
        Medium.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: Actor
