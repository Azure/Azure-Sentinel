properties:
  id: xdr-0b85a077-8ba5-4cb5-90f7-1e882afe10c8
  displayName: GitHub - User was blocked
  status: disabled
  queryCondition:
    queryText: |-
      GitHubAuditData
      | where Action == "org.block_user"
      | project Actor, Action
      | extend Name = iif(Actor contains "@", split(Actor, "@")[0], Actor)
      | extend UPNSuffix = iif(Actor contains "@", split(Actor, "@")[1], "")
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: GitHub - User was blocked
      description: '''Detect activities when a user was blocked on the repository. This query runs every day and its severity
        is Medium.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: Actor
