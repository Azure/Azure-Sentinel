properties:
  id: xdr-0b85a077-8ba5-4cb5-90f7-1e882afe10c4
  displayName: GitHub - User was added to the organization
  status: disabled
  queryCondition:
    queryText: |-
      GitHubAuditData
      | where Action == "org.add_member"
      | project Actor, Action
      | extend Name = iif(Actor contains "@", split(Actor, "@")[0], Actor)
      | extend UPNSuffix = iif(Actor contains "@", split(Actor, "@")[1], "")
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: GitHub - User was added to the organization
      description: '''Detect activities when a user was added to the organization. This query runs every day and its severity
        is Medium.'''
      severity: medium
      entityMappings:
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: InitialAccess
        techniques:
        - technique: T1078
      customDetails:
        AccountFullName: Actor
