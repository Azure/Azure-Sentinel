id: 660dcde8-d5ae-58a9-a61e-22b510bf2f41
name: RedRays - export heartbeat missing
description: Alerts when a previously connected RedRays instance stops sending export heartbeats. Set the threshold
  above your export interval and expected ingestion delay. The rule needs a previous heartbeat within its one-day
  query window.
severity: Medium
requiredDataConnectors:
- connectorId: RedRaysSAPSecurityFindings
  dataTypes:
  - RedRaysExportHealth_CL
queryFrequency: 15m
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
query: '// Set above the export interval and ingestion delay. Requires a heartbeat in the lookback.

  let maxHeartbeatAge = 60m;

  RedRaysExportHealth_CL

  | where RecordKind == ''HEARTBEAT''

  | summarize LastSeen=max(TimeGenerated) by ProductInstanceId

  | where LastSeen < ago(maxHeartbeatAge)

  | extend TimeGenerated=LastSeen'
version: 1.0.0
kind: Scheduled
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: Selected
    groupByCustomDetails:
    - ProductInstanceId
customDetails:
  ProductInstanceId: ProductInstanceId
