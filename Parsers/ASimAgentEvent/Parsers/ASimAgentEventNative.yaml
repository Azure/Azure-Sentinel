Parser:
  Title: Agent Event ASIM parser for Microsoft Sentinel native Agent Event table
  Version: '0.1.0'
  LastUpdated: Nov 04, 2026
Product:
  Name: Native
Normalization:
  Schema: AgentEvent
  Version: '1.0.0'
References:
  - Title: Native Agent Event table
    Link: https://learn.microsoft.com/azure/azure-monitor/reference/tables/asimagenteventlogs
  - Title: ASIM Agent Event Schema
    Link: https://aka.ms/ASimAgentEventDoc
Description: |
  This ASIM parser supports normalizing the native Agent Event table (ASimAgentEventLogs) to the ASIM Agent Event normalized schema. While the native table is ASIM compliant, the parser is needed to add capabilities, such as aliases, available only at query time.
ParserName: ASimAgentEventNative
EquivalentBuiltInParser: _ASim_AgentEvent_Native
ParserParams:
  - Name: disabled
    Type: bool
    Default: false
  - Name: pack
    Type: bool
    Default: false
ParserQuery: |
  let parser = (disabled:bool=false, pack:bool=false) {
    ASimAgentEventLogs
    | where not(disabled)
    | extend
        EventSchema = "AgentEvent",
        EventStartTime = coalesce(EventStartTime, TimeGenerated),
        EventEndTime = coalesce(EventEndTime, TimeGenerated),
        PlatformTargetAgentEntityKey = column_ifexists("PlatformTargetAgentEntityKey", ""),
        AdditionalFields = iff(pack, AdditionalFields, dynamic({}))
    | project
        TimeGenerated, Type, EventUid, EventOriginalUid, EventSchema, EventSchemaVersion,
        EventStartTime, EventEndTime, EventCount, EventVendor, EventProduct,
        SrcAgentId, SrcAgentName, SrcAgentOriginalType, SrcAgentDescription, SrcAgentBlueprintId,
        SrcIpAddr, SrcFQDN, SrcPortNumber, TargetAgentId, TargetAgentName,
        TargetAgentUsername, TargetAgentUserId, TargetAgentOriginalType,
        TargetAgentDescription, TargetAgentBlueprintId, TargetAgentEntityKey,
        PlatformTargetAgentId, PlatformTargetAgentName, PlatformTargetAgentDescription,
        PlatformTargetAgentEntityKey, PlatformTargetOriginalAgentType,
        ActorUserId, ActorUserIdType, ActorUserScope, ActorUserScopeId,
        ActorUsername, ActorUsernameType, ActorUserAdditionalIds, ActorUserEntityKey,
        ActingAppName, ActingAppId, ActingAppType, ActingApplicationEntityKey,
        SrcAgentEntityKey, DvcEntityKey, EventSessionId, EventSessionName,
        EventType, EventOriginalType, EventRequestId, EventRequestTemperature,
        EventRequestTopP, EventRequestPresencePenalty, EventRequestFrequencyPenalty,
        EventRequestSeed, EventResponseId, EventOriginalRequestDetails,
        EventOriginalResultDetails, EventErrorDetails, EventOriginalErrorType,
        EventThoughtProcessDetails, EventThoughtProcessId, EventFinishReasons,
        EventOutputType, ToolId, ToolName, ToolDescription, ToolOriginalType,
        ModelProviderName, ModelName, InputTokensUsed, OutputTokensUsed,
        AdditionalEntities, AdditionalFields
  };
  parser(disabled=disabled, pack=pack)
