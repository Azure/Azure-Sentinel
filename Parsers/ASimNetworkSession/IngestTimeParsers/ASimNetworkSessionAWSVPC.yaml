Parser:
  Title: AWS VPC Network Session ASIM ingestion-time parser
  Version: '0.3'
  LastUpdated: 'Sep 4, 2026'
Product:
  Name: AWS VPC
Normalization:
  Schema: NetworkSession
  Version: '0.2.2'
Author: Microsoft
Description: |
  Normalizes AWS VPC Flow logs from the AWSVPCFlow raw-table shape into the
  native ASimNetworkSessionLogs table during ingestion.
ParserName: ASimNetworkSessionAWSVPC
DCRType: Standard
InputStream: Microsoft-AWSVPCFlow
SourceRawTable: AWSVPCFlow
TargetASIMTable: ASimNetworkSessionLogs
ParserFilterQuery: |
  source
  | where LogStatus == "OK"
ParserQuery: |
  source
  | extend Type = "AWSVPCFlow"
  | where LogStatus == "OK"
  | extend
      EventVendor = "AWS",
      EventProduct = "VPC",
      NetworkBytes = tolong(Bytes),
      NetworkPackets = tolong(Packets),
      EventProductVersion = tostring(Version),
      EventType = "NetworkSession",
      EventCount = toint(1),
      EventResult = iff (Action == "ACCEPT", "Success", "Failure"),
      EventSeverity = iff (Action == "ACCEPT", "Informational", "Low"),
      EventSchemaVersion = "0.2.2",
      EventSchema = "NetworkSession",
      SrcAppType = iff (PktSrcAwsService != "", "CloudService", ""),
      DstAppType = iff (PktDstAwsService != "", "CloudService", ""),
      DvcIdType = "AwsVpcId"
  | extend
      NetworkProtocol = case(
          Protocol == 0, "HOPOPT",
          Protocol == 1, "ICMP",
          Protocol == 2, "IGMP",
          Protocol == 3, "GGP",
          Protocol == 4, "IPv4",
          Protocol == 5, "ST",
          Protocol == 6, "TCP",
          Protocol == 7, "CBT",
          Protocol == 8, "EGP",
          Protocol == 9, "IGP",
          Protocol == 10, "BBN-RCC-MON",
          Protocol == 11, "NVP-II",
          Protocol == 12, "PUP",
          Protocol == 13, "ARGUS (deprecated)",
          Protocol == 14, "EMCON",
          Protocol == 15, "XNET",
          Protocol == 16, "CHAOS",
          Protocol == 17, "UDP",
          Protocol == 18, "MUX",
          Protocol == 19, "DCN-MEAS",
          Protocol == 20, "HMP",
          Protocol == 21, "PRM",
          Protocol == 22, "XNS-IDP",
          Protocol == 23, "TRUNK-1",
          Protocol == 24, "TRUNK-2",
          Protocol == 25, "LEAF-1",
          Protocol == 26, "LEAF-2",
          Protocol == 27, "RDP",
          Protocol == 28, "IRTP",
          Protocol == 29, "ISO-TP4",
          Protocol == 30, "NETBLT",
          Protocol == 31, "MFE-NSP",
          Protocol == 32, "MERIT-INP",
          Protocol == 33, "DCCP",
          Protocol == 34, "3PC",
          Protocol == 35, "IDPR",
          Protocol == 36, "XTP",
          Protocol == 37, "DDP",
          Protocol == 38, "IDPR-CMTP",
          Protocol == 39, "TP++",
          Protocol == 40, "IL",
          Protocol == 41, "IPv6",
          Protocol == 42, "SDRP",
          Protocol == 43, "IPv6-Route",
          Protocol == 44, "IPv6-Frag",
          Protocol == 45, "IDRP",
          Protocol == 46, "RSVP",
          Protocol == 47, "GRE",
          Protocol == 48, "DSR",
          Protocol == 49, "BNA",
          Protocol == 50, "ESP",
          Protocol == 51, "AH",
          Protocol == 52, "I-NLSP",
          Protocol == 53, "SWIPE (deprecated)",
          Protocol == 54, "NARP",
          Protocol == 55, "MOBILE",
          Protocol == 56, "TLSP",
          Protocol == 57, "SKIP",
          Protocol == 58, "IPv6-ICMP",
          Protocol == 59, "IPv6-NoNxt",
          Protocol == 60, "IPv6-Opts",
          Protocol == 62, "CFTP",
          Protocol == 64, "SAT-EXPAK",
          Protocol == 65, "KRYPTOLAN",
          Protocol == 66, "RVD",
          Protocol == 67, "IPPC",
          Protocol == 69, "SAT-MON",
          Protocol == 70, "VISA",
          Protocol == 71, "IPCV",
          Protocol == 72, "CPNX",
          Protocol == 73, "CPHB",
          Protocol == 74, "WSN",
          Protocol == 75, "PVP",
          Protocol == 76, "BR-SAT-MON",
          Protocol == 77, "SUN-ND",
          Protocol == 78, "WB-MON",
          Protocol == 79, "WB-EXPAK",
          Protocol == 80, "ISO-IP",
          Protocol == 81, "VMTP",
          Protocol == 82, "SECURE-VMTP",
          Protocol == 83, "VINES",
          Protocol == 84, "TTP",
          Protocol == 85, "NSFNET-IGP",
          Protocol == 86, "DGP",
          Protocol == 87, "TCF",
          Protocol == 88, "EIGRP",
          Protocol == 89, "OSPFIGP",
          Protocol == 90, "Sprite-RPC",
          Protocol == 91, "LARP",
          Protocol == 92, "MTP",
          Protocol == 93, "AX.25",
          Protocol == 94, "IPIP",
          Protocol == 95, "MICP (deprecated)",
          Protocol == 96, "SCC-SP",
          Protocol == 97, "ETHERIP",
          Protocol == 98, "ENCAP",
          Protocol == 100, "GMTP",
          Protocol == 101, "IFMP",
          Protocol == 102, "PNNI",
          Protocol == 103, "PIM",
          Protocol == 104, "ARIS",
          Protocol == 105, "SCPS",
          Protocol == 106, "QNX",
          Protocol == 107, "A/N",
          Protocol == 108, "IPComp",
          Protocol == 109, "SNP",
          Protocol == 110, "Compaq-Peer",
          Protocol == 111, "IPX-in-IP",
          Protocol == 112, "VRRP",
          Protocol == 113, "PGM",
          Protocol == 115, "L2TP",
          Protocol == 116, "DDX",
          Protocol == 117, "IATP",
          Protocol == 118, "STP",
          Protocol == 119, "SRP",
          Protocol == 120, "UTI",
          Protocol == 121, "SMP",
          Protocol == 122, "SM (deprecated)",
          Protocol == 123, "PTP",
          Protocol == 124, "ISIS over IPv4",
          Protocol == 125, "FIRE",
          Protocol == 126, "CRTP",
          Protocol == 127, "CRUDP",
          Protocol == 128, "SSCOPMCE",
          Protocol == 129, "IPLT",
          Protocol == 130, "SPS",
          Protocol == 131, "PIPE",
          Protocol == 132, "SCTP",
          Protocol == 133, "FC",
          Protocol == 134, "RSVP-E2E-IGNORE",
          Protocol == 135, "Mobility Header",
          Protocol == 136, "UDPLite",
          Protocol == 137, "MPLS-in-IP",
          Protocol == 138, "manet",
          Protocol == 139, "HIP",
          Protocol == 140, "Shim6",
          Protocol == 141, "WESP",
          Protocol == 142, "ROHC",
          Protocol == 143, "Ethernet",
          Protocol == 255, "Reserved",
          "")
  | extend
      DvcAction = case(
          Action == "ACCEPT", "Allow",
          Action == "REJECT", "Deny",
          "")
  | extend
      NetworkDirection = case(
          FlowDirection == "ingress", "Inbound",
          FlowDirection == "egress", "Outbound",
          "")
  | project-rename
      DstIpAddr = DstAddr,
      DstPortNumber = DstPort,
      SrcNatIpAddr = PktSrcAddr,
      DstNatIpAddr = PktDstAddr,
      SrcPortNumber = SrcPort,
      SrcIpAddr = SrcAddr,
      EventEndTime = End,
      DvcInboundInterface = InterfaceId,
      DvcSubscriptionId = AccountId,
      DvcId = VpcId,
      NetworkProtocolVersion = TrafficType,
      EventOriginalResultDetails = LogStatus,
      SrcAppName = PktSrcAwsService,
      DstAppName = PktDstAwsService
  | extend
      IpAddr = SrcIpAddr,
      Src = SrcIpAddr,
      Dst = DstIpAddr,
      Dvc = DvcId,
      EventStartTime = TimeGenerated,
      DvcInterface = DvcInboundInterface
  | project-away Action, AzId, Bytes, FlowDirection, InstanceId, Packets, Protocol, Region, SourceSystem, SublocationId, SublocationType, SubnetId, TcpFlags, TenantId, TrafficPath, Version
Changes:
  - Version: '0.3'
    Date: 'Sep 4, 2026'
    Changes:
      - Initial ingestion-time publication sample converted from ASimNetworkSessionAWSVPC; targets ASimNetworkSessionLogs.
