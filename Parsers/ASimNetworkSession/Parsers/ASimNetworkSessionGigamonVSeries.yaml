Parser:
  Title: Network Session ASIM parser for Gigamon V-Series Application Metadata Intelligence
  Version: '1.1.0'
  LastUpdated: Nov 20, 2026
Product:
  Name: Gigamon V-Series Application Metadata Intelligence
Normalization:
  Schema: NetworkSession
  Version: '1.0.0'
References:
  - Title: ASIM Network Session Schema
    Link: https://aka.ms/ASimNetworkSessionDoc
  - Title: ASIM
    Link: https://aka.ms/AboutASIM
  - Title: Gigamon Application Metadata Intelligence
    Link: https://docs.gigamon.com/doclib612/Content/GV-Cloud-V-Series-Applications/App_Metadata_Intelligence.html
Description: |
  This ASIM parser normalizes Gigamon V-Series Application Metadata Intelligence
  flow records to the ASIM NetworkSession schema.
ParserName: ASimNetworkSessionGigamonVSeries
EquivalentBuiltInParser: _ASim_NetworkSession_GigamonVSeries
ParserParams:
  - Name: disabled
    Type: bool
    Default: false
  - Name: pack
    Type: bool
    Default: false
ParserQuery: |
  let parser = (disabled:bool=false, pack:bool=false) {
      GigamonV2_CL
      | where not(disabled)
      | extend
          EventStartTime = coalesce(todatetime(start_time), TimeGenerated),
          EventEndTime = coalesce(todatetime(end_time), todatetime(start_time), TimeGenerated),
          NetworkProtocol = case(
              isempty(protocol), "",
              protocol in~ ("6", "TCP"), "TCP",
              protocol in~ ("17", "UDP"), "UDP",
              protocol
          )
      | project
          TimeGenerated,
          EventCount = int(1),
          EventStartTime,
          EventEndTime,
          EventProduct = "V-Series Application Metadata Intelligence",
          EventVendor = "Gigamon",
          EventSchema = "NetworkSession",
          EventSchemaVersion = "0.2.7",
          EventType = "NetworkSession",
          EventResult = "Success",
          Dvc = coalesce(generator, vendor),
          SrcIpAddr = coalesce(src_ip, src_ipv6),
          IpAddr = coalesce(src_ip, src_ipv6),
          DstIpAddr = coalesce(dst_ip, dst_ipv6),
          Src = coalesce(src_ip, src_ipv6, src_mac),
          Dst = coalesce(dst_ip, dst_ipv6, dst_mac),
          SrcMacAddr = src_mac,
          DstMacAddr = dst_mac,
          SrcPortNumber = toint(src_port),
          DstPortNumber = toint(dst_port),
          NetworkProtocol,
          NetworkProtocolVersion = case(ip_version in~ ("4", "IPv4"), "IPv4", ip_version in~ ("6", "IPv6"), "IPv6", ""),
          SrcBytes = tolong(src_bytes),
          DstBytes = tolong(dst_bytes),
          SrcPackets = tolong(src_packets),
          DstPackets = tolong(dst_packets),
          AdditionalFields = iff(pack, bag_pack(
              "total_bytes", total_bytes,
              "total_packets", total_packets,
              "device_inbound_interface", device_inbound_interface,
              "egress_intf_id", egress_intf_id,
              "tcp_flags", tcp_flags,
              "tcpflagsyn", tcpflagsyn,
              "tcpflagfin", tcpflagfin,
              "tcpflagrst", tcpflagrst,
              "tcp_flag_reset", tcp_flag_reset,
              "ip_ttl", ip_ttl,
              "ip_hdr_len", ip_hdr_len,
              "ip_frag_flags", ip_frag_flags,
              "outer_src_ip", outer_src_ip,
              "outer_dst_ip", outer_dst_ip,
              "tcp_rtt", tcp_rtt
          ), dynamic(null)),
          EventUid = id,
          Type = "GigamonV2_CL"
  };
  parser(disabled=disabled, pack=pack)
