Parser:
  Title: Audit Event ASIM parser for Barracuda WAF
  Version: '0.2.3'
  LastUpdated: Oct 10, 2026
Product:
  Name: Barracuda WAF
Normalization:
  Schema: AuditEvent
  Version: '1.0.0'
References:
- Title: ASIM Audit Event Schema
  Link: https://aka.ms/ASimAuditEventDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
- Title: Logs type Description in Barracuda CEF
  Link: https://campus.barracuda.com/product/webapplicationfirewall/doc/78810008/types-of-logs/
Description: |
  This ASIM parser supports normalizing Barracuda WAF logs ingested in 'CommonSecurityLog' table to the ASIM Audit Event schema.
Exceptions:
- Field: Dst
  Warning: Missing recommended field
  Exception: The existing mapping identifies the reporting WAF in Dvc fields and the administrator client in Src fields. It does not identify a separate destination entity to populate this alias.
- Field: DvcAction
  Warning: Missing recommended field
  Exception: The supported AUDIT records describe administrator activity, not a security-device enforcement action. EventType and EventResult retain the operation and outcome.
- Field: DvcDomain
  Warning: Missing recommended field
  Exception: The supported AUDIT format supplies a reporting-device name, but no separate device-domain field. The existing DvcHostname mapping is retained.
- Field: TargetHostname
  Warning: Missing recommended field
  Exception: The supported AUDIT format identifies the reporting WAF, but no separate target-host identity. The WAF identity remains in the existing Dvc fields.
- Field: TargetIpAddr
  Warning: Missing recommended field
  Exception: Audit objects are configuration resources, not necessarily network endpoints. The reporting-device and administrator-client IP addresses are retained in DvcIpAddr and SrcIpAddr.
ParserName: ASimAuditEventBarracudaCEF
EquivalentBuiltInParser: _ASim_AuditEvent_BarracudaCEF
ParserParams:
  - Name: disabled
    Type: bool
    Default: false
ParserQuery: |
  let EventTypeLookup = datatable (
      ChangeType_s: string,
      EventType_lookup: string
  )
      [
      "SET", "Set",
      "ADD", "Create",
      "DEL", "Delete",
      "NONE", "Other",
      "", "Other"
  ];
  let SeverityLookup = datatable (severity: int, EventSeverity: string)
      [
      0, "High", 
      1, "High", 
      2, "High", 
      3, "Medium",
      4, "Low",
      5, "Low", 
      6, "Informational",
      7, "Informational" 
  ];
  let ObjectTypeLookup = datatable (ObjectType_s: string, ObjectType: string)[
      "global", "Other",
      "Services", "Service",
      "web_firewall_policy", "Policy Rule",
      "service", "Service",
      "json_url_profile", "Other",
      "server", "Service",
      "header_acl", "Directory Service Object",
      "virtual_ip_config_address", "Configuration Atom",
      "aps_req_rewrite_policy", "Policy Rule",
      "aps_url_acl", "Directory Service Object",
      "websocket_security_policy", "Policy Rule",
      "aps_ftp_acl", "Directory Service Object",
      "user_system_ip", "Configuration Atom",
      "syslog_server", "Service",
      "attack_action", "Configuration Atom",
      "global_adr", "Configuration Atom",
      "aps_content_protection", "Other"
  ];
  let parser = (disabled: bool=false) {
      let BarracudaCEF = 
          CommonSecurityLog
          | where not(disabled)
              and DeviceVendor startswith "Barracuda"
              and (DeviceProduct == "WAF" or DeviceProduct == "WAAS")
          | where DeviceEventCategory == "AUDIT" 
              and (toupper(ProcessName) !in ("LOGIN", "LOGOUT", "UNSUCCESSFUL_LOGIN", "SESSION_TIMEOUT"))
          | parse trim(@'[^\w(")]+', Message) with * "Reason=" Reason: string 
          | extend Reason = trim('"', Reason)
          | extend 
              EventResultDetails = Reason,
              severity = toint(LogSeverity)
          | lookup SeverityLookup on severity
          | lookup EventTypeLookup on $left.EventOutcome == $right.ChangeType_s
          | lookup ObjectTypeLookup on $left.FileType == $right.ObjectType_s
          | extend
              EventResult = "Success", 
              EventSchema = "AuditEvent",
              EventSchemaVersion = "1.0.0",
              EventVendor = "Barracuda",
              EventProduct = "WAF",
              EventCount = toint(1)
          | extend
              EventType = EventType_lookup,
              Dvc = DeviceName, 
              EventStartTime = iff(isnotempty(FlexNumber2), unixtime_milliseconds_todatetime(tolong(ReceiptTime) - tolong(FlexNumber2)), unixtime_milliseconds_todatetime(tolong(ReceiptTime))),
              Operation = ProcessName,
              DvcIpAddr = DeviceAddress,
              NewValue = DeviceCustomString1,
              SrcIpAddr = SourceIP,
              EventMessage = Message,
              OldValue = DeviceCustomString2,
              DvcHostname = DeviceName,
              ActorUsername = DestinationUserName,
              Object = FileName,
              ThreatConfidence = toint(ThreatConfidence) ,
              EventUid = _ItemId    
          | extend
              Src = SrcIpAddr,
              EventEndTime = EventStartTime,
              ActorUsernameType = iff(isnotempty(ActorUsername), "Simple", ""),
              ActorUserType = iff(isnotempty(ActorUsername), "Admin", ""),
              User = ActorUsername,
              Value = NewValue 
          | extend
              IpAddr = SrcIpAddr,
              ValueType = iff(isnotempty(Value), "Other", "")
          | extend
              ActingApplicationEntityKey = "",
              ActorUserAdditionalIds = dynamic([]),
              ActorUserEntityKey = "",
              AdditionalEntities = dynamic([]),
              DvcEntityKey = "",
              SrcSystemEntityKey = "",
              TargetApplicationEntityKey = "",
              TargetSystemEntityKey = ""
          | project
              ActingApplicationEntityKey,
              ActorUserAdditionalIds,
              ActorUserEntityKey,
              ActorUserType,
              ActorUsername,
              ActorUsernameType,
              AdditionalEntities,
              Dvc,
              DvcEntityKey,
              DvcHostname,
              DvcIpAddr,
              EventCount,
              EventEndTime,
              EventMessage,
              EventProduct,
              EventResult,
              EventResultDetails,
              EventSchema,
              EventSchemaVersion,
              EventSeverity,
              EventStartTime,
              EventType,
              EventUid,
              EventVendor,
              IpAddr,
              NewValue,
              Object,
              ObjectType,
              Operation,
              Src,
              SrcIpAddr,
              SrcSystemEntityKey,
              TargetApplicationEntityKey,
              TargetSystemEntityKey,
              TimeGenerated,
              Type,
              User,
              Value,
              ValueType;
      BarracudaCEF
  };
  parser(disabled=disabled)