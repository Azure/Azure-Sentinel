    newvalue_has_any=newvalue_has_any,
    disabled=(BuiltInDisabled or ('ExcludevimAuditEventAWSCloudTrailEC2FleetAndSpot' in (DisabledParsers))),
    pack=pack
  ),
  vimAuditEventAWSCloudTrailEC2ImagesAndImportExport(
