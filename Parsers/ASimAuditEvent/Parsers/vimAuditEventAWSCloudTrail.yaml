    disabled=(BuiltInDisabled or ('ExcludevimAuditEventAWSCloudTrailEC2PrivateConnectivity' in (DisabledParsers))),
    pack=pack
  ),
  vimAuditEventAWSCloudTrailEC2SecurityAndObservability(
