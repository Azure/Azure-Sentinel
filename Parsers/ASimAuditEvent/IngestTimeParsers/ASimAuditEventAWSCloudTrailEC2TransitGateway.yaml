Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 TransitGateway activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 TransitGateway activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2TransitGateway'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | where EventName in (
      "AcceptTransitGatewayClientVpnAttachment",
      "AcceptTransitGatewayPeeringAttachment",
      "AcceptTransitGatewayVpcAttachment",
      "CreateTransitGateway",
      "CreateTransitGatewayConnect",
      "CreateTransitGatewayConnectPeer",
      "CreateTransitGatewayPeeringAttachment",
      "CreateTransitGatewayVpcAttachment",
      "DeleteTransitGateway",
      "DeleteTransitGatewayClientVpnAttachment",
      "DeleteTransitGatewayConnect",
      "DeleteTransitGatewayConnectPeer",
      "DeleteTransitGatewayPeeringAttachment",
      "DeleteTransitGatewayVpcAttachment",
      "DescribeTransitGatewayAttachments",
      "DescribeTransitGatewayConnectPeers",
      "DescribeTransitGatewayConnects",
      "DescribeTransitGatewayMeteringPolicies",
      "DescribeTransitGatewayPeeringAttachments",
      "DescribeTransitGatewayVpcAttachments",
      "DescribeTransitGateways",
      "GetTransitGatewayAttachmentNatConfiguration",
      "ModifyTransitGateway",
      "ModifyTransitGatewayAttachmentNatConfiguration",
      "ModifyTransitGatewayVpcAttachment",
      "RejectTransitGatewayClientVpnAttachment",
      "RejectTransitGatewayPeeringAttachment",
      "RejectTransitGatewayVpcAttachment"
  )
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | where EventName in (
      "AcceptTransitGatewayClientVpnAttachment",
      "AcceptTransitGatewayPeeringAttachment",
      "AcceptTransitGatewayVpcAttachment",
      "CreateTransitGateway",
      "CreateTransitGatewayConnect",
      "CreateTransitGatewayConnectPeer",
      "CreateTransitGatewayPeeringAttachment",
      "CreateTransitGatewayVpcAttachment",
      "DeleteTransitGateway",
      "DeleteTransitGatewayClientVpnAttachment",
      "DeleteTransitGatewayConnect",
      "DeleteTransitGatewayConnectPeer",
      "DeleteTransitGatewayPeeringAttachment",
      "DeleteTransitGatewayVpcAttachment",
      "DescribeTransitGatewayAttachments",
      "DescribeTransitGatewayConnectPeers",
      "DescribeTransitGatewayConnects",
      "DescribeTransitGatewayMeteringPolicies",
      "DescribeTransitGatewayPeeringAttachments",
      "DescribeTransitGatewayVpcAttachments",
      "DescribeTransitGateways",
      "GetTransitGatewayAttachmentNatConfiguration",
      "ModifyTransitGateway",
      "ModifyTransitGatewayAttachmentNatConfiguration",
      "ModifyTransitGatewayVpcAttachment",
      "RejectTransitGatewayClientVpnAttachment",
      "RejectTransitGatewayPeeringAttachment",
      "RejectTransitGatewayVpcAttachment"
  )
  | extend EventType = case(
      EventName in ("CreateTransitGateway", "CreateTransitGatewayConnect", "CreateTransitGatewayConnectPeer", "CreateTransitGatewayPeeringAttachment", "CreateTransitGatewayVpcAttachment"), "Create",
      EventName in ("DeleteTransitGateway", "DeleteTransitGatewayClientVpnAttachment", "DeleteTransitGatewayConnect", "DeleteTransitGatewayConnectPeer", "DeleteTransitGatewayPeeringAttachment", "DeleteTransitGatewayVpcAttachment"), "Delete",
      EventName in ("AcceptTransitGatewayPeeringAttachment", "AcceptTransitGatewayVpcAttachment", "RejectTransitGatewayPeeringAttachment", "RejectTransitGatewayVpcAttachment"), "Execute",
      EventName in ("DescribeTransitGatewayAttachments", "DescribeTransitGatewayConnectPeers", "DescribeTransitGatewayConnects", "DescribeTransitGatewayMeteringPolicies", "DescribeTransitGatewayPeeringAttachments", "DescribeTransitGatewayVpcAttachments", "DescribeTransitGateways", "GetTransitGatewayAttachmentNatConfiguration"), "Read",
      EventName in ("AcceptTransitGatewayClientVpnAttachment", "ModifyTransitGateway", "ModifyTransitGatewayAttachmentNatConfiguration", "ModifyTransitGatewayVpcAttachment", "RejectTransitGatewayClientVpnAttachment"), "Set",
      "")
  | extend Object = case(
      EventName in ("CreateTransitGateway", "CreateTransitGatewayVpcAttachment", "DeleteTransitGateway", "DescribeTransitGateways", "ModifyTransitGateway"), "Transit Gateway",
      EventName in ("AcceptTransitGatewayPeeringAttachment", "AcceptTransitGatewayVpcAttachment", "DescribeTransitGatewayAttachments", "RejectTransitGatewayPeeringAttachment"), "Transit Gateway Attachment",
      EventName in ("GetTransitGatewayAttachmentNatConfiguration", "ModifyTransitGatewayAttachmentNatConfiguration"), "Transit Gateway Attachment NAT Configuration",
      EventName in ("AcceptTransitGatewayClientVpnAttachment", "DeleteTransitGatewayClientVpnAttachment", "RejectTransitGatewayClientVpnAttachment"), "Transit Gateway Client VPN Attachment",
      EventName in ("CreateTransitGatewayConnect", "DeleteTransitGatewayConnect", "DescribeTransitGatewayConnects"), "Transit Gateway Connect",
      EventName in ("CreateTransitGatewayConnectPeer", "DeleteTransitGatewayConnectPeer", "DescribeTransitGatewayConnectPeers"), "Transit Gateway Connect Peer",
      EventName in ("DescribeTransitGatewayMeteringPolicies"), "Transit Gateway Metering Policy",
      EventName in ("CreateTransitGatewayPeeringAttachment", "DeleteTransitGatewayPeeringAttachment", "DescribeTransitGatewayPeeringAttachments"), "Transit Gateway Peering Attachment",
      EventName in ("DeleteTransitGatewayVpcAttachment", "DescribeTransitGatewayVpcAttachments", "ModifyTransitGatewayVpcAttachment", "RejectTransitGatewayVpcAttachment"), "Transit Gateway VPC Attachment",
      "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
      EventName in ("AcceptTransitGatewayClientVpnAttachment", "RejectTransitGatewayClientVpnAttachment"),
        ResponseElements.transitGatewayClientVpnAttachment,
      EventName in ("AcceptTransitGatewayPeeringAttachment", "CreateTransitGatewayPeeringAttachment",
        "RejectTransitGatewayPeeringAttachment"), ResponseElements.transitGatewayPeeringAttachment,
      EventName in ("AcceptTransitGatewayVpcAttachment", "CreateTransitGatewayVpcAttachment",
        "ModifyTransitGatewayVpcAttachment", "RejectTransitGatewayVpcAttachment"),
        ResponseElements.transitGatewayVpcAttachment,
      EventName in ("CreateTransitGateway", "ModifyTransitGateway"), ResponseElements.transitGateway,
      EventName == "CreateTransitGatewayConnect", ResponseElements.transitGatewayConnect,
      EventName == "CreateTransitGatewayConnectPeer", ResponseElements.transitGatewayConnectPeer,
      EventName == "ModifyTransitGatewayAttachmentNatConfiguration", pack("natGatewayRuleSet",
        ResponseElements.natGatewayRuleSet, "natGatewaySupport", ResponseElements.natGatewaySupport,
        "natSystemRouteSupport", ResponseElements.natSystemRouteSupport),
      parse_json('null')
    ), parse_json('null'))
  | extend ObjectId = case(
      EventName in ("AcceptTransitGatewayClientVpnAttachment", "DeleteTransitGatewayClientVpnAttachment",
        "GetTransitGatewayAttachmentNatConfiguration", "ModifyTransitGatewayAttachmentNatConfiguration",
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
        "RejectTransitGatewayClientVpnAttachment"), iff(isnotnull(RequestParameters.transitGatewayAttachmentId), RequestParameters.transitGatewayAttachmentId, RequestParameters.TransitGatewayAttachmentId),
      EventName in ("AcceptTransitGatewayPeeringAttachment", "AcceptTransitGatewayVpcAttachment",
        "DeleteTransitGatewayConnect", "DeleteTransitGatewayPeeringAttachment",
        "DeleteTransitGatewayVpcAttachment", "ModifyTransitGatewayVpcAttachment",
        "RejectTransitGatewayPeeringAttachment", "RejectTransitGatewayVpcAttachment"),
        RequestParameters.TransitGatewayAttachmentId,
      EventName == "CreateTransitGateway", ResponseElements.transitGateway.transitGatewayId,
      EventName == "CreateTransitGatewayConnect",
        ResponseElements.transitGatewayConnect.transitGatewayGonnectId,
      EventName == "CreateTransitGatewayConnectPeer",
        ResponseElements.transitGatewayConnectPeer.transitGatewayConnectPeerId,
      EventName == "CreateTransitGatewayPeeringAttachment",
        ResponseElements.transitGatewayPeeringAttachment.transitGatewayPeeringAttachmentId,
      EventName in ("CreateTransitGatewayVpcAttachment", "DeleteTransitGateway", "ModifyTransitGateway"),
        RequestParameters.TransitGatewayId,
      EventName == "DeleteTransitGatewayConnectPeer", RequestParameters.TransitGatewayConnectPeerId,
      EventName in ("DescribeTransitGatewayAttachments", "DescribeTransitGatewayPeeringAttachments",
        "DescribeTransitGatewayVpcAttachments"), RequestParameters.TransitGatewayAttachmentIds,
      EventName == "DescribeTransitGatewayConnectPeers", RequestParameters.TransitGatewayConnectPeerIds,
      EventName == "DescribeTransitGatewayConnects", RequestParameters.TransitGatewayMeteringPolicyIds,
      EventName == "DescribeTransitGatewayMeteringPolicies", RequestParameters.TransitGatewayMulticastDomainIds,
      EventName == "DescribeTransitGateways", RequestParameters.TransitGatewayIds,
      parse_json('null')
    )
  | extend
      Type = "AWSCloudTrail",
      EventCount = int(1),
      EventStartTime = TimeGenerated,
      EventEndTime = TimeGenerated,
      EventSeverity = "Informational",
      EventSchema = "AuditEvent",
      EventSchemaVersion = "1.0.0",
      EventVendor = "AWS",
      EventProduct = "CloudTrail",
      Dvc = "CloudTrail",
      EventMessage = ErrorMessage,
      ObjectType = "Cloud Resource",
      TargetAppName = "Amazon Elastic Compute Cloud",
      TargetAppType = "Service",
      EventUid = tostring(AwsEventId)
  | project-rename
      EventOriginalSubType = EventTypeName,
      EventOriginalType = EventName,
      EventOriginalResultDetails = ErrorMessage,
      EventProductVersion = EventVersion,
      ActorUserId = UserIdentityAccountId,
      ActorUsername = UserIdentityUserName,
      ActorOriginalUserType = UserIdentityType,
      HttpUserAgent = UserAgent
  | extend
      ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
      ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
      SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
      ActingApplicationEntityKey = "",
      ActorUserAdditionalIds = parse_json('[]'),
      ActorUserEntityKey = "",
      AdditionalEntities = parse_json('[]'),
      DvcEntityKey = "",
      SrcSystemEntityKey = "",
      TargetApplicationEntityKey = "",
      TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
      "ActorAccessKeyId", UserIdentityAccessKeyId,
      "AWSRegion", AWSRegion,
      "APIVersion", APIVersion,
      "ManagementEvent", ManagementEvent,
      "ReadOnly", ReadOnly,
      "RequestParameters", RequestParameters,
      "ResponseElements", ResponseElements
    )
  | extend
      Operation = EventOriginalType,
      User = ActorUsername,
      IpAddr = SrcIpAddr,
      Application = TargetAppName,
      Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
      TimeGenerated,
      Type,
      EventCount,
      EventStartTime,
      EventEndTime,
      EventSeverity,
      EventSchemaVersion,
      EventVendor,
      EventProduct,
      EventResult,
      EventMessage,
      TargetAppName,
      EventOriginalSubType,
      EventOriginalType,
      EventOriginalUid,
      EventOriginalResultDetails,
      EventProductVersion,
      ActorUserId,
      ActorUsername,
      ActorOriginalUserType,
      HttpUserAgent,
      ActorUserIdType,
      ActorUsernameType,
      SrcIpAddr,
      AdditionalFields,
      EventType,
      NewValue,
      ObjectId,
      ObjectType,
      Object,
      TargetAppType,
      Operation,
      ActingApplicationEntityKey,
      ActorUserAdditionalIds,
      ActorUserEntityKey,
      AdditionalEntities,
      DvcEntityKey,
      SrcSystemEntityKey,
      TargetApplicationEntityKey,
      TargetSystemEntityKey
Change:
  Date: '2026-11-06'
  Description: 'Initial ingestion-time conversion.'

