Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 SecurityAndObservability activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 SecurityAndObservability activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2SecurityAndObservability'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateFlowLogs", "CreateNetworkAcl", "CreateNetworkAclEntry", "CreateNetworkInsightsAccessScope", "CreateNetworkInsightsPath", "CreateSecurityGroup", "CreateTrafficMirrorFilter", "CreateTrafficMirrorFilterRule", "CreateTrafficMirrorSession", "CreateTrafficMirrorTarget", "CreateVpcBlockPublicAccessExclusion", "CreateVpcEncryptionControl"), "Create",
  EventName in ("DeleteFlowLogs", "DeleteNetworkAcl", "DeleteNetworkInsightsAccessScope", "DeleteNetworkInsightsAccessScopeAnalysis", "DeleteNetworkInsightsAnalysis", "DeleteNetworkInsightsPath", "DeleteSecurityGroup", "DeleteTrafficMirrorFilter", "DeleteTrafficMirrorFilterRule", "DeleteTrafficMirrorSession", "DeleteTrafficMirrorTarget", "DeleteVpcBlockPublicAccessExclusion", "DeleteVpcEncryptionControl"), "Delete",
  EventName in ("RevokeSecurityGroupEgress", "RevokeSecurityGroupIngress"), "Disable",
  EventName in ("EnableReachabilityAnalyzerOrganizationSharing"), "Enable",
  EventName in ("AuthorizeSecurityGroupEgress", "AuthorizeSecurityGroupIngress"), "Execute",
  EventName in ("DescribeAccountVpcEncryptionControl", "DescribeFlowLogs", "DescribeNetworkAcls", "DescribeNetworkInsightsAccessScopeAnalyses", "DescribeNetworkInsightsAccessScopes", "DescribeNetworkInsightsAnalyses", "DescribeNetworkInsightsPaths", "DescribeSecurityGroupReferences", "DescribeSecurityGroupRules", "DescribeSecurityGroupVpcAssociations", "DescribeSecurityGroups", "DescribeStaleSecurityGroups", "DescribeTrafficMirrorFilterRules", "DescribeTrafficMirrorFilters", "DescribeTrafficMirrorSessions", "DescribeTrafficMirrorTargets", "DescribeVpcBlockPublicAccessExclusions", "DescribeVpcBlockPublicAccessOptions", "DescribeVpcEncryptionControls", "GetFlowLogsIntegrationTemplate", "GetNetworkInsightsAccessScopeAnalysisFindings", "GetNetworkInsightsAccessScopeContent", "GetSecurityGroupsForVpc"), "Read",
  EventName in ("AssociateSecurityGroupVpc", "DeleteNetworkAclEntry", "DisassociateSecurityGroupVpc", "ModifyAccountVpcEncryptionControl", "ModifySecurityGroupRules", "ModifyTrafficMirrorFilterNetworkServices", "ModifyTrafficMirrorFilterRule", "ModifyTrafficMirrorSession", "ModifyVpcBlockPublicAccessExclusion", "ModifyVpcBlockPublicAccessOptions", "ModifyVpcEncryptionControl", "ReplaceNetworkAclAssociation", "ReplaceNetworkAclEntry", "UpdateSecurityGroupRuleDescriptionsEgress", "UpdateSecurityGroupRuleDescriptionsIngress"), "Set",
  EventName in ("StartNetworkInsightsAccessScopeAnalysis", "StartNetworkInsightsAnalysis"), "Start",
  "")
  | where isnotempty(EventType)
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateFlowLogs", "CreateNetworkAcl", "CreateNetworkAclEntry", "CreateNetworkInsightsAccessScope", "CreateNetworkInsightsPath", "CreateSecurityGroup", "CreateTrafficMirrorFilter", "CreateTrafficMirrorFilterRule", "CreateTrafficMirrorSession", "CreateTrafficMirrorTarget", "CreateVpcBlockPublicAccessExclusion", "CreateVpcEncryptionControl"), "Create",
  EventName in ("DeleteFlowLogs", "DeleteNetworkAcl", "DeleteNetworkInsightsAccessScope", "DeleteNetworkInsightsAccessScopeAnalysis", "DeleteNetworkInsightsAnalysis", "DeleteNetworkInsightsPath", "DeleteSecurityGroup", "DeleteTrafficMirrorFilter", "DeleteTrafficMirrorFilterRule", "DeleteTrafficMirrorSession", "DeleteTrafficMirrorTarget", "DeleteVpcBlockPublicAccessExclusion", "DeleteVpcEncryptionControl"), "Delete",
  EventName in ("RevokeSecurityGroupEgress", "RevokeSecurityGroupIngress"), "Disable",
  EventName in ("EnableReachabilityAnalyzerOrganizationSharing"), "Enable",
  EventName in ("AuthorizeSecurityGroupEgress", "AuthorizeSecurityGroupIngress"), "Execute",
  EventName in ("DescribeAccountVpcEncryptionControl", "DescribeFlowLogs", "DescribeNetworkAcls", "DescribeNetworkInsightsAccessScopeAnalyses", "DescribeNetworkInsightsAccessScopes", "DescribeNetworkInsightsAnalyses", "DescribeNetworkInsightsPaths", "DescribeSecurityGroupReferences", "DescribeSecurityGroupRules", "DescribeSecurityGroupVpcAssociations", "DescribeSecurityGroups", "DescribeStaleSecurityGroups", "DescribeTrafficMirrorFilterRules", "DescribeTrafficMirrorFilters", "DescribeTrafficMirrorSessions", "DescribeTrafficMirrorTargets", "DescribeVpcBlockPublicAccessExclusions", "DescribeVpcBlockPublicAccessOptions", "DescribeVpcEncryptionControls", "GetFlowLogsIntegrationTemplate", "GetNetworkInsightsAccessScopeAnalysisFindings", "GetNetworkInsightsAccessScopeContent", "GetSecurityGroupsForVpc"), "Read",
  EventName in ("AssociateSecurityGroupVpc", "DeleteNetworkAclEntry", "DisassociateSecurityGroupVpc", "ModifyAccountVpcEncryptionControl", "ModifySecurityGroupRules", "ModifyTrafficMirrorFilterNetworkServices", "ModifyTrafficMirrorFilterRule", "ModifyTrafficMirrorSession", "ModifyVpcBlockPublicAccessExclusion", "ModifyVpcBlockPublicAccessOptions", "ModifyVpcEncryptionControl", "ReplaceNetworkAclAssociation", "ReplaceNetworkAclEntry", "UpdateSecurityGroupRuleDescriptionsEgress", "UpdateSecurityGroupRuleDescriptionsIngress"), "Set",
  EventName in ("StartNetworkInsightsAccessScopeAnalysis", "StartNetworkInsightsAnalysis"), "Start",
  "")
  | where isnotempty(EventType)
  | extend Object = case(
  EventName in ("EnableReachabilityAnalyzerOrganizationSharing"), "",
  EventName in ("DescribeAccountVpcEncryptionControl", "ModifyAccountVpcEncryptionControl"), "Account VPC Encryption Control",
  EventName in ("CreateFlowLogs", "DeleteFlowLogs", "DescribeFlowLogs", "GetFlowLogsIntegrationTemplate"), "Flow Logs",
  EventName in ("CreateNetworkAcl", "CreateNetworkAclEntry", "DeleteNetworkAcl", "DeleteNetworkAclEntry", "DescribeNetworkAcls", "ReplaceNetworkAclAssociation", "ReplaceNetworkAclEntry"), "Network ACL",
  EventName in ("CreateNetworkInsightsAccessScope", "DeleteNetworkInsightsAccessScope", "DescribeNetworkInsightsAccessScopes", "GetNetworkInsightsAccessScopeContent"), "Network Insights Access Scope",
  EventName in ("DeleteNetworkInsightsAccessScopeAnalysis", "DescribeNetworkInsightsAccessScopeAnalyses", "GetNetworkInsightsAccessScopeAnalysisFindings", "StartNetworkInsightsAccessScopeAnalysis"), "Network Insights Access Scope Analysis",
  EventName in ("DeleteNetworkInsightsAnalysis", "DescribeNetworkInsightsAnalyses", "StartNetworkInsightsAnalysis"), "Network Insights Analysis",
  EventName in ("CreateNetworkInsightsPath", "DeleteNetworkInsightsPath", "DescribeNetworkInsightsPaths"), "Network Insights Path",
  EventName in ("AuthorizeSecurityGroupEgress", "AuthorizeSecurityGroupIngress", "CreateSecurityGroup", "DeleteSecurityGroup", "DescribeSecurityGroupReferences", "DescribeSecurityGroups", "RevokeSecurityGroupEgress", "RevokeSecurityGroupIngress", "UpdateSecurityGroupRuleDescriptionsEgress", "UpdateSecurityGroupRuleDescriptionsIngress"), "Security Group",
  EventName in ("DescribeSecurityGroupRules"), "Security Group Rule",
  EventName in ("DescribeSecurityGroupVpcAssociations"), "Security Group VPC Association",
  EventName in ("ModifySecurityGroupRules"), "SecurityGroup",
  EventName in ("CreateTrafficMirrorFilter", "DeleteTrafficMirrorFilter", "DescribeTrafficMirrorFilters", "ModifyTrafficMirrorFilterNetworkServices"), "Traffic Mirror Filter",
  EventName in ("CreateTrafficMirrorFilterRule", "DeleteTrafficMirrorFilterRule", "DescribeTrafficMirrorFilterRules", "ModifyTrafficMirrorFilterRule"), "Traffic Mirror Filter Rule",
  EventName in ("CreateTrafficMirrorSession", "DeleteTrafficMirrorSession", "DescribeTrafficMirrorSessions", "ModifyTrafficMirrorSession"), "Traffic Mirror Session",
  EventName in ("CreateTrafficMirrorTarget", "DeleteTrafficMirrorTarget", "DescribeTrafficMirrorTargets"), "Traffic Mirror Target",
  EventName in ("AssociateSecurityGroupVpc", "DescribeStaleSecurityGroups", "DescribeVpcEncryptionControls", "DisassociateSecurityGroupVpc", "GetSecurityGroupsForVpc"), "VPC",
  EventName in ("DescribeVpcBlockPublicAccessOptions", "ModifyVpcBlockPublicAccessOptions"), "VPC BPA",
  EventName in ("CreateVpcBlockPublicAccessExclusion", "DeleteVpcBlockPublicAccessExclusion", "DescribeVpcBlockPublicAccessExclusions", "ModifyVpcBlockPublicAccessExclusion"), "VPC BPA Exclusion",
  EventName in ("ModifyVpcEncryptionControl"), "VPC Encryption",
  EventName in ("CreateVpcEncryptionControl", "DeleteVpcEncryptionControl"), "VPC Encryption Control",
  "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
  EventName == "AssociateSecurityGroupVpc", RequestParameters.GroupId,
  EventName in ("AuthorizeSecurityGroupEgress", "AuthorizeSecurityGroupIngress"),
  ResponseElements.securityGroupRuleSet,
  EventName == "CreateFlowLogs", ResponseElements.unsuccessful,
  EventName == "CreateNetworkAcl", ResponseElements.networkAcl,
  EventName in ("CreateNetworkAclEntry", "DeleteNetworkAclEntry"), RequestParameters.RuleNumber,
  EventName == "CreateNetworkInsightsAccessScope", ResponseElements.networkInsightsAccessScopeContent,
  EventName == "CreateNetworkInsightsPath", ResponseElements.networkInsightsPath,
  EventName == "CreateSecurityGroup", ResponseElements.groupId,
  EventName in ("CreateTrafficMirrorFilter", "ModifyTrafficMirrorFilterNetworkServices"),
  ResponseElements.trafficMirrorFilter,
  EventName in ("CreateTrafficMirrorFilterRule", "ModifyTrafficMirrorFilterRule"),
  ResponseElements.trafficMirrorFilterRule,
  EventName in ("CreateTrafficMirrorSession", "ModifyTrafficMirrorSession"),
  ResponseElements.trafficMirrorSession,
  EventName == "CreateTrafficMirrorTarget", ResponseElements.trafficMirrorTarget,
  EventName in ("CreateVpcBlockPublicAccessExclusion", "ModifyVpcBlockPublicAccessExclusion"),
  ResponseElements.vpcBlockPublicAccessExclusion,
  EventName in ("CreateVpcEncryptionControl", "ModifyVpcEncryptionControl"),
  ResponseElements.vpcEncryptionControl,
  EventName == "ModifyAccountVpcEncryptionControl", ResponseElements.accountVpcEncryptionControl,
  EventName == "ModifySecurityGroupRules", RequestParameters.SecurityGroupRule.N,
  EventName == "ModifyVpcBlockPublicAccessOptions", ResponseElements.vpcBlockPublicAccessOptions,
  EventName == "ReplaceNetworkAclAssociation", ResponseElements.newAssociationId,
  EventName in ("RevokeSecurityGroupEgress", "RevokeSecurityGroupIngress"),
  ResponseElements.revokedSecurityGroupRuleSet,
  EventName == "StartNetworkInsightsAccessScopeAnalysis",
  ResponseElements.networkInsightsAccessScopeAnalysis,
  EventName == "StartNetworkInsightsAnalysis", ResponseElements.networkInsightsAnalysis,
  EventName in ("UpdateSecurityGroupRuleDescriptionsEgress", "UpdateSecurityGroupRuleDescriptionsIngress"),
  RequestParameters.IpPermissions,
  parse_json('null')
  ), parse_json('null'))
  | extend ObjectId = case(
  EventName in ("AssociateSecurityGroupVpc", "DescribeStaleSecurityGroups", "DescribeVpcEncryptionControls",
  "DisassociateSecurityGroupVpc", "GetSecurityGroupsForVpc"), RequestParameters.VpcId,
  EventName in ("AuthorizeSecurityGroupEgress", "AuthorizeSecurityGroupIngress", "DeleteSecurityGroup",
  "DescribeSecurityGroupReferences", "DescribeSecurityGroups", "ModifySecurityGroupRules",
  "RevokeSecurityGroupEgress", "RevokeSecurityGroupIngress", "UpdateSecurityGroupRuleDescriptionsEgress",
  "UpdateSecurityGroupRuleDescriptionsIngress"), RequestParameters.GroupId,
  EventName == "CreateFlowLogs", ResponseElements.flowLogIdSet,
  EventName == "CreateNetworkAcl", ResponseElements.networkAcl.networkAclId,
  EventName in ("CreateNetworkAclEntry", "DeleteNetworkAcl", "DeleteNetworkAclEntry", "DescribeNetworkAcls",
  "ReplaceNetworkAclAssociation", "ReplaceNetworkAclEntry"), RequestParameters.NetworkAclId,
  EventName == "CreateNetworkInsightsAccessScope",
  ResponseElements.networkInsightsAccessScope.networkInsightsAccessScopeId,
  EventName == "CreateNetworkInsightsPath", ResponseElements.networkInsightsPath.networkInsightsPathId,
  EventName == "CreateSecurityGroup", ResponseElements.groupId,
  EventName == "CreateTrafficMirrorFilter", ResponseElements.trafficMirrorFilter.trafficMirrorFilterId,
  EventName == "CreateTrafficMirrorFilterRule",
  ResponseElements.trafficMirrorFilterRule.trafficMirrorFilterRuleId,
  EventName == "CreateTrafficMirrorSession", ResponseElements.trafficMirrorSession.trafficMirrorSessionId,
  EventName == "CreateTrafficMirrorTarget", ResponseElements.trafficMirrorTarget.trafficMirrorTargetId,
  EventName == "CreateVpcBlockPublicAccessExclusion",
  ResponseElements.vpcBlockPublicAccessExclusion.vpcBlockPublicAccessExclusionId,
  EventName == "CreateVpcEncryptionControl", ResponseElements.vpcEncryptionControl.vpcEncryptionControlId,
  EventName in ("DeleteFlowLogs", "DescribeFlowLogs", "GetFlowLogsIntegrationTemplate"),
  RequestParameters.FlowLogId,
  EventName == "DeleteNetworkInsightsAccessScope", ResponseElements.networkInsightsAccessScopeId,
  EventName in ("DeleteNetworkInsightsAccessScopeAnalysis",
  "GetNetworkInsightsAccessScopeAnalysisFindings"), ResponseElements.networkInsightsAccessScopeAnalysisId,
  EventName == "DeleteNetworkInsightsAnalysis", ResponseElements.networkInsightsAnalysisId,
  EventName == "DeleteNetworkInsightsPath", ResponseElements.networkInsightsPathId,
  EventName in ("DeleteTrafficMirrorFilter", "DescribeTrafficMirrorFilters",
  "ModifyTrafficMirrorFilterNetworkServices"), RequestParameters.TrafficMirrorFilterId,
  EventName in ("DeleteTrafficMirrorFilterRule", "DescribeTrafficMirrorFilterRules",
  "ModifyTrafficMirrorFilterRule"), RequestParameters.TrafficMirrorFilterRuleId,
  EventName in ("DeleteTrafficMirrorSession", "DescribeTrafficMirrorSessions",
  "ModifyTrafficMirrorSession"), RequestParameters.TrafficMirrorSessionId,
  EventName in ("DeleteTrafficMirrorTarget", "DescribeTrafficMirrorTargets"),
  RequestParameters.TrafficMirrorTargetId,
  EventName in ("DeleteVpcBlockPublicAccessExclusion", "DescribeVpcBlockPublicAccessExclusions",
  "ModifyVpcBlockPublicAccessExclusion"), RequestParameters.ExclusionId,
  EventName in ("DeleteVpcEncryptionControl", "ModifyVpcEncryptionControl"),
  RequestParameters.VpcEncryptionControlId,
  EventName == "DescribeNetworkInsightsAccessScopeAnalyses",
  RequestParameters.NetworkInsightsAccessScopeAnalysisId,
  EventName in ("DescribeNetworkInsightsAccessScopes", "GetNetworkInsightsAccessScopeContent",
  "StartNetworkInsightsAccessScopeAnalysis"), RequestParameters.NetworkInsightsAccessScopeId,
  EventName == "DescribeNetworkInsightsAnalyses", RequestParameters.NetworkInsightsAnalysisId,
  EventName in ("DescribeNetworkInsightsPaths", "StartNetworkInsightsAnalysis"),
  RequestParameters.NetworkInsightsPathId,
  EventName == "DescribeSecurityGroupRules", RequestParameters.SecurityGroupRuleId,
  EventName == "DescribeVpcBlockPublicAccessOptions", RequestParameters.VpcIds,
  parse_json('null')
  )
  | extend
  Type = "AWSCloudTrail",
  EventCount = int(1),
  EventStartTime = TimeGenerated,
  EventEndTime = TimeGenerated,
  EventSeverity = "Informational",
  EventSchema = "AuditEvent",
  EventSchemaVersion = "1.0.0",
  EventVendor = "AWS",
  EventProduct = "CloudTrail",
  Dvc = "CloudTrail",
  EventMessage = ErrorMessage,
  ObjectType = "Cloud Resource",
  TargetAppName = "Amazon Elastic Compute Cloud",
  TargetAppType = "Service",
  EventUid = tostring(AwsEventId)
  | project-rename
  EventOriginalSubType = EventTypeName,
  EventOriginalType = EventName,
  EventOriginalResultDetails = ErrorMessage,
  EventProductVersion = EventVersion,
  ActorUserId = UserIdentityAccountId,
  ActorUsername = UserIdentityUserName,
  ActorOriginalUserType = UserIdentityType,
  HttpUserAgent = UserAgent
  | extend
  ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
  ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
  SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
  ActingApplicationEntityKey = "",
  ActorUserAdditionalIds = parse_json('[]'),
  ActorUserEntityKey = "",
  AdditionalEntities = parse_json('[]'),
  DvcEntityKey = "",
  SrcSystemEntityKey = "",
  TargetApplicationEntityKey = "",
  TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
  "ActorAccessKeyId", UserIdentityAccessKeyId,
  "AWSRegion", AWSRegion,
  "APIVersion", APIVersion,
  "ManagementEvent", ManagementEvent,
  "ReadOnly", ReadOnly,
  "RequestParameters", RequestParameters,
  "ResponseElements", ResponseElements
  )
  | extend
  Operation = EventOriginalType,
  User = ActorUsername,
  IpAddr = SrcIpAddr,
  Application = TargetAppName,
  Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
  TimeGenerated,
  Type,
  EventCount,
  EventStartTime,
  EventEndTime,
  EventSeverity,
  EventSchemaVersion,
  EventVendor,
  EventProduct,
  EventResult,
  EventMessage,
  TargetAppName,
  EventOriginalSubType,
  EventOriginalType,
  EventOriginalUid,
  EventOriginalResultDetails,
  EventProductVersion,
  ActorUserId,
  ActorUsername,
  ActorOriginalUserType,
  HttpUserAgent,
  ActorUserIdType,
  ActorUsernameType,
  SrcIpAddr,
  AdditionalFields,
  EventType,
  NewValue,
  ObjectId,
  ObjectType,
  Object,
  TargetAppType,
  Operation,
  ActingApplicationEntityKey,
  ActorUserAdditionalIds,
  ActorUserEntityKey,
  AdditionalEntities,
  DvcEntityKey,
  SrcSystemEntityKey,
  TargetApplicationEntityKey,
  TargetSystemEntityKey
Change:
