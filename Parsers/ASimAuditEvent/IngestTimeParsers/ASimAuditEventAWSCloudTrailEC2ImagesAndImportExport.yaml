  )
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | where EventName in (
      "AttachImageWatermark",
      "BundleInstance",
      "CancelBundleTask",
      "CancelConversionTask",
      "CancelExportTask",
      "CancelImageLaunchPermission",
      "CancelImportTask",
      "CopyFpgaImage",
      "CopyImage",
      "CreateFpgaImage",
      "CreateImage",
      "CreateImageUsageReport",
      "CreateInstanceExportTask",
      "CreateRestoreImageTask",
      "CreateStoreImageTask",
      "DeleteFpgaImage",
      "DeleteImageUsageReport",
      "DeregisterImage",
      "DescribeBundleTasks",
      "DescribeConversionTasks",
      "DescribeExportImageTasks",
      "DescribeExportTasks",
      "DescribeFastLaunchImages",
      "DescribeFpgaImageAttribute",
      "DescribeFpgaImages",
      "DescribeImageAttribute",
      "DescribeImageReferences",
      "DescribeImageUsageReportEntries",
      "DescribeImageUsageReports",
      "DescribeImages",
      "DescribeImportImageTasks",
      "DescribeImportSnapshotTasks",
      "DescribeStoreImageTasks",
      "DetachImageWatermark",
      "DisableAllowedImagesSettings",
      "DisableFastLaunch",
      "DisableImage",
      "DisableImageBlockPublicAccess",
      "DisableImageDeprecation",
      "DisableImageDeregistrationProtection",
      "EnableAllowedImagesSettings",
      "EnableFastLaunch",
      "EnableImage",
      "EnableImageBlockPublicAccess",
      "EnableImageDeprecation",
      "EnableImageDeregistrationProtection",
      "ExportImage",
      "GetAllowedImagesSettings",
      "GetImageAncestry",
      "GetImageBlockPublicAccessState",
      "GetImageFindings",
      "ImportImage",
      "ImportInstance",
      "ImportSnapshot",
      "ImportVolume",
      "ListImagesInRecycleBin",
      "ModifyFpgaImageAttribute",
      "ModifyImageAttribute",
      "RegisterImage",
      "ReplaceImageCriteriaInAllowedImagesSettings",
      "ReplaceImageInstanceTypeSpecification",
      "ResetFpgaImageAttribute",
      "ResetImageAttribute",
      "RestoreImageFromRecycleBin"
  )
  | extend EventType = case(
      EventName in ("CreateFpgaImage", "CreateImage", "CreateImageUsageReport", "CreateInstanceExportTask", "CreateRestoreImageTask", "CreateStoreImageTask", "ImportImage", "ImportInstance", "ImportSnapshot", "ImportVolume", "RegisterImage"), "Create",
      EventName in ("CancelBundleTask", "CancelConversionTask", "CancelExportTask", "CancelImageLaunchPermission", "CancelImportTask", "DeleteFpgaImage", "DeleteImageUsageReport", "DeregisterImage", "DetachImageWatermark"), "Delete",
      EventName in ("DisableAllowedImagesSettings", "DisableFastLaunch", "DisableImage", "DisableImageBlockPublicAccess", "DisableImageDeprecation", "DisableImageDeregistrationProtection"), "Disable",
      EventName in ("EnableAllowedImagesSettings", "EnableFastLaunch", "EnableImage", "EnableImageBlockPublicAccess", "EnableImageDeprecation", "EnableImageDeregistrationProtection"), "Enable",
      EventName in ("BundleInstance", "CopyFpgaImage", "CopyImage", "ExportImage", "ResetFpgaImageAttribute", "ResetImageAttribute"), "Execute",
      EventName in ("DescribeBundleTasks", "DescribeConversionTasks", "DescribeExportImageTasks", "DescribeExportTasks", "DescribeFastLaunchImages", "DescribeFpgaImageAttribute", "DescribeFpgaImages", "DescribeImageAttribute", "DescribeImageReferences", "DescribeImageUsageReportEntries", "DescribeImageUsageReports", "DescribeImages", "DescribeImportImageTasks", "DescribeImportSnapshotTasks", "DescribeStoreImageTasks", "GetAllowedImagesSettings", "GetImageAncestry", "GetImageBlockPublicAccessState", "GetImageFindings", "ListImagesInRecycleBin"), "Read",
      EventName in ("AttachImageWatermark", "ModifyFpgaImageAttribute", "ModifyImageAttribute", "ReplaceImageCriteriaInAllowedImagesSettings", "ReplaceImageInstanceTypeSpecification", "RestoreImageFromRecycleBin"), "Set",
      "")
  | extend Object = case(
      EventName in ("CancelImageLaunchPermission", "CopyImage", "CreateImage", "CreateRestoreImageTask", "CreateStoreImageTask", "DeregisterImage", "DescribeFastLaunchImages", "DescribeImageAttribute", "DescribeImageReferences", "DescribeImages", "DisableAllowedImagesSettings", "DisableFastLaunch", "DisableImage", "DisableImageBlockPublicAccess", "DisableImageDeprecation", "DisableImageDeregistrationProtection", "EnableAllowedImagesSettings", "EnableFastLaunch", "EnableImageBlockPublicAccess", "EnableImageDeprecation", "EnableImageDeregistrationProtection", "ExportImage", "GetAllowedImagesSettings", "GetImageAncestry", "GetImageBlockPublicAccessState", "GetImageFindings", "ImportImage", "ListImagesInRecycleBin", "ModifyImageAttribute", "RegisterImage", "ReplaceImageCriteriaInAllowedImagesSettings", "ReplaceImageInstanceTypeSpecification", "ResetImageAttribute"), "AMI",
      EventName in ("DeleteImageUsageReport", "DescribeImageUsageReportEntries", "DescribeImageUsageReports"), "AMI Usage Report",
      EventName in ("AttachImageWatermark", "DetachImageWatermark"), "AMI Watermark",
      EventName in ("CancelBundleTask", "DescribeBundleTasks"), "Bundle Task",
      EventName in ("CancelConversionTask", "DescribeConversionTasks"), "Conversion Task",
      EventName in ("ImportSnapshot"), "EBS Snapshot",
      EventName in ("ImportVolume"), "EBS Volume",
      EventName in ("BundleInstance", "EnableImage", "ImportInstance"), "EC2 Instance",
      EventName in ("DescribeExportImageTasks"), "Export Image Task",
      EventName in ("CancelExportTask", "DescribeExportTasks"), "Export Task",
      EventName in ("CopyFpgaImage", "CreateFpgaImage", "DeleteFpgaImage", "DescribeFpgaImageAttribute", "DescribeFpgaImages", "ModifyFpgaImageAttribute", "ResetFpgaImageAttribute"), "FPGA Image",
      EventName in ("CreateImageUsageReport"), "Image Usage Report",
      EventName in ("DescribeImportImageTasks"), "Import Image Task",
      EventName in ("DescribeImportSnapshotTasks"), "Import Snapshot Task",
      EventName in ("CancelImportTask"), "Import Task",
      EventName in ("CreateInstanceExportTask"), "Instance Export Task",
      EventName in ("RestoreImageFromRecycleBin"), "Snapshot",
      EventName in ("DescribeStoreImageTasks"), "Store Image Task",
      "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
      EventName == "AttachImageWatermark", ResponseElements.watermarkKey,
      EventName in ("BundleInstance", "CancelBundleTask"), ResponseElements.bundleInstanceTask,
      EventName == "CopyFpgaImage", ResponseElements.fpgaImageId,
      EventName in ("CopyImage", "CreateImage", "CreateRestoreImageTask"), ResponseElements.imageId,
      EventName == "CreateFpgaImage", ResponseElements.fpgaImageGlobalId,
      EventName == "CreateImageUsageReport", ResponseElements.reportId,
      EventName == "CreateInstanceExportTask", ResponseElements.exportTask,
      EventName == "EnableAllowedImagesSettings", RequestParameters.AllowedImagesSettingsState,
      EventName == "ExportImage", ResponseElements.s3ExportLocation,
      EventName == "ImportImage", ResponseElements,
      EventName in ("ImportInstance", "ImportVolume"), ResponseElements.conversionTask,
      EventName == "ImportSnapshot", ResponseElements.snapshotTaskDetail,
      EventName == "ModifyFpgaImageAttribute", ResponseElements.fpgaImageAttribute,
      EventName == "ReplaceImageInstanceTypeSpecification",
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
        iff(isnotnull(RequestParameters.instanceTypeSpecification), RequestParameters.instanceTypeSpecification, RequestParameters.InstanceTypeSpecification),
      parse_json('null')
    ), parse_json('null'))
  | extend ObjectId = case(
      EventName in ("AttachImageWatermark", "DetachImageWatermark", "GetImageFindings",
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
        "ReplaceImageInstanceTypeSpecification"), iff(isnotnull(RequestParameters.imageId), RequestParameters.imageId, RequestParameters.ImageId),
      EventName == "BundleInstance", RequestParameters.InstanceId,
      EventName == "CancelBundleTask", RequestParameters.BundleId,
      EventName in ("CancelConversionTask", "DescribeConversionTasks"), RequestParameters.ConversionTaskId,
      EventName in ("CancelExportTask", "DescribeExportTasks"), RequestParameters.ExportTaskId,
      EventName in ("CancelImageLaunchPermission", "DeregisterImage", "DescribeFastLaunchImages",
        "DescribeImageAttribute", "DescribeStoreImageTasks", "DisableFastLaunch", "DisableImage",
        "DisableImageDeprecation", "DisableImageDeregistrationProtection", "EnableFastLaunch", "EnableImage",
        "EnableImageDeprecation", "EnableImageDeregistrationProtection", "ExportImage", "GetImageAncestry",
        "ListImagesInRecycleBin", "ModifyImageAttribute", "ResetImageAttribute", "RestoreImageFromRecycleBin"),
        RequestParameters.ImageId,
      EventName == "CancelImportTask", ResponseElements.importTaskId,
      EventName == "CopyFpgaImage", ResponseElements.fpgaImageId,
      EventName in ("CopyImage", "CreateImage", "CreateRestoreImageTask", "ImportImage", "RegisterImage"),
        ResponseElements.imageId,
      EventName == "CreateFpgaImage", ResponseElements.fpgaImageGlobalId,
      EventName == "CreateImageUsageReport", ResponseElements.reportId,
      EventName == "CreateInstanceExportTask", ResponseElements.exportTask.exportTaskId,
      EventName == "CreateStoreImageTask", ResponseElements.objectKey,
      EventName in ("DeleteFpgaImage", "DescribeFpgaImageAttribute", "DescribeFpgaImages",
        "ResetFpgaImageAttribute"), RequestParameters.FpgaImageId,
      EventName == "DeleteImageUsageReport", RequestParameters.ReportId,
      EventName == "DescribeBundleTasks", ResponseElements.bundleInstanceTasksSet,
      EventName == "DescribeExportImageTasks", RequestParameters.ExportImageTaskId,
      EventName in ("DescribeImageReferences", "DescribeImageUsageReportEntries", "DescribeImageUsageReports",
        "DescribeImages"), RequestParameters.ImageId.N,
      EventName in ("DescribeImportImageTasks", "DescribeImportSnapshotTasks"),
        RequestParameters.ImportTaskId.N,
      EventName in ("ImportInstance", "ImportVolume"), ResponseElements.conversionTask.conversionTaskId,
      EventName == "ImportSnapshot", ResponseElements.snapshotTaskDetail.snapshotTaskDetailId,
      EventName == "ModifyFpgaImageAttribute", ResponseElements.fpgaImageAttribute.fpgaImageId,
      parse_json('null')
    )
  | extend
      Type = "AWSCloudTrail",
      EventCount = int(1),
      EventStartTime = TimeGenerated,
      EventEndTime = TimeGenerated,
      EventSeverity = "Informational",
      EventSchema = "AuditEvent",
      EventSchemaVersion = "1.0.0",
      EventVendor = "AWS",
      EventProduct = "CloudTrail",
      Dvc = "CloudTrail",
      EventMessage = ErrorMessage,
      ObjectType = "Cloud Resource",
      TargetAppName = "Amazon Elastic Compute Cloud",
      TargetAppType = "Service",
      EventUid = tostring(AwsEventId)
  | project-rename
      EventOriginalSubType = EventTypeName,
      EventOriginalType = EventName,
      EventOriginalResultDetails = ErrorMessage,
      EventProductVersion = EventVersion,
      ActorUserId = UserIdentityAccountId,
      ActorUsername = UserIdentityUserName,
      ActorOriginalUserType = UserIdentityType,
      HttpUserAgent = UserAgent
  | extend
      ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
      ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
      SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
      ActingApplicationEntityKey = "",
      ActorUserAdditionalIds = parse_json('[]'),
      ActorUserEntityKey = "",
      AdditionalEntities = parse_json('[]'),
      DvcEntityKey = "",
      SrcSystemEntityKey = "",
      TargetApplicationEntityKey = "",
      TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
      "ActorAccessKeyId", UserIdentityAccessKeyId,
      "AWSRegion", AWSRegion,
      "APIVersion", APIVersion,
      "ManagementEvent", ManagementEvent,
      "ReadOnly", ReadOnly,
      "RequestParameters", RequestParameters,
      "ResponseElements", ResponseElements
    )
  | extend
      Operation = EventOriginalType,
      User = ActorUsername,
      IpAddr = SrcIpAddr,
      Application = TargetAppName,
      Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
      TimeGenerated,
      Type,
      EventCount,
      EventStartTime,
      EventEndTime,
      EventSeverity,
      EventSchemaVersion,
      EventVendor,
      EventProduct,
      EventResult,
      EventMessage,
      TargetAppName,
      EventOriginalSubType,
      EventOriginalType,
      EventOriginalUid,
      EventOriginalResultDetails,
      EventProductVersion,
      ActorUserId,
      ActorUsername,
      ActorOriginalUserType,
      HttpUserAgent,
      ActorUserIdType,
      ActorUsernameType,
      SrcIpAddr,
      AdditionalFields,
      EventType,
      NewValue,
      ObjectId,
      ObjectType,
      Object,
      TargetAppType,
      Operation,
      ActingApplicationEntityKey,
      ActorUserAdditionalIds,
      ActorUserEntityKey,
      AdditionalEntities,
      DvcEntityKey,
      SrcSystemEntityKey,
      TargetApplicationEntityKey,
      TargetSystemEntityKey
