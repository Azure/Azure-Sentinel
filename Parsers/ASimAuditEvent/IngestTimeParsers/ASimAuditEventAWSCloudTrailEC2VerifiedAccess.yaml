Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 VerifiedAccess activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 VerifiedAccess activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2VerifiedAccess'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | where EventName in (
      "AttachVerifiedAccessTrustProvider",
      "CreateVerifiedAccessEndpoint",
      "CreateVerifiedAccessGroup",
      "CreateVerifiedAccessInstance",
      "CreateVerifiedAccessTrustProvider",
      "DeleteVerifiedAccessEndpoint",
      "DeleteVerifiedAccessGroup",
      "DeleteVerifiedAccessInstance",
      "DeleteVerifiedAccessTrustProvider",
      "DescribeVerifiedAccessEndpoints",
      "DescribeVerifiedAccessGroups",
      "DescribeVerifiedAccessInstanceLoggingConfigurations",
      "DescribeVerifiedAccessInstances",
      "DescribeVerifiedAccessTrustProviders",
      "DetachVerifiedAccessTrustProvider",
      "ExportVerifiedAccessInstanceClientConfiguration",
      "GetVerifiedAccessEndpointPolicy",
      "GetVerifiedAccessEndpointTargets",
      "GetVerifiedAccessGroupPolicy",
      "ModifyVerifiedAccessEndpoint",
      "ModifyVerifiedAccessEndpointPolicy",
      "ModifyVerifiedAccessGroup",
      "ModifyVerifiedAccessGroupPolicy",
      "ModifyVerifiedAccessInstance",
      "ModifyVerifiedAccessInstanceLoggingConfiguration",
      "ModifyVerifiedAccessTrustProvider"
  )
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | where EventName in (
      "AttachVerifiedAccessTrustProvider",
      "CreateVerifiedAccessEndpoint",
      "CreateVerifiedAccessGroup",
      "CreateVerifiedAccessInstance",
      "CreateVerifiedAccessTrustProvider",
      "DeleteVerifiedAccessEndpoint",
      "DeleteVerifiedAccessGroup",
      "DeleteVerifiedAccessInstance",
      "DeleteVerifiedAccessTrustProvider",
      "DescribeVerifiedAccessEndpoints",
      "DescribeVerifiedAccessGroups",
      "DescribeVerifiedAccessInstanceLoggingConfigurations",
      "DescribeVerifiedAccessInstances",
      "DescribeVerifiedAccessTrustProviders",
      "DetachVerifiedAccessTrustProvider",
      "ExportVerifiedAccessInstanceClientConfiguration",
      "GetVerifiedAccessEndpointPolicy",
      "GetVerifiedAccessEndpointTargets",
      "GetVerifiedAccessGroupPolicy",
      "ModifyVerifiedAccessEndpoint",
      "ModifyVerifiedAccessEndpointPolicy",
      "ModifyVerifiedAccessGroup",
      "ModifyVerifiedAccessGroupPolicy",
      "ModifyVerifiedAccessInstance",
      "ModifyVerifiedAccessInstanceLoggingConfiguration",
      "ModifyVerifiedAccessTrustProvider"
  )
  | extend EventType = case(
      EventName in ("CreateVerifiedAccessEndpoint", "CreateVerifiedAccessGroup", "CreateVerifiedAccessInstance", "CreateVerifiedAccessTrustProvider"), "Create",
      EventName in ("DeleteVerifiedAccessEndpoint", "DeleteVerifiedAccessGroup", "DeleteVerifiedAccessInstance", "DeleteVerifiedAccessTrustProvider"), "Delete",
      EventName in ("ExportVerifiedAccessInstanceClientConfiguration"), "Execute",
      EventName in ("DescribeVerifiedAccessEndpoints", "DescribeVerifiedAccessGroups", "DescribeVerifiedAccessInstanceLoggingConfigurations", "DescribeVerifiedAccessInstances", "DescribeVerifiedAccessTrustProviders", "GetVerifiedAccessEndpointPolicy", "GetVerifiedAccessEndpointTargets", "GetVerifiedAccessGroupPolicy"), "Read",
      EventName in ("AttachVerifiedAccessTrustProvider", "DetachVerifiedAccessTrustProvider", "ModifyVerifiedAccessEndpoint", "ModifyVerifiedAccessEndpointPolicy", "ModifyVerifiedAccessGroup", "ModifyVerifiedAccessGroupPolicy", "ModifyVerifiedAccessInstance", "ModifyVerifiedAccessInstanceLoggingConfiguration", "ModifyVerifiedAccessTrustProvider"), "Set",
      "")
  | extend Object = case(
      EventName in ("AttachVerifiedAccessTrustProvider"), "EC2 Instance",
      EventName in ("ExportVerifiedAccessInstanceClientConfiguration"), "Verfied Access Instance",
      EventName in ("CreateVerifiedAccessEndpoint", "DeleteVerifiedAccessEndpoint", "DescribeVerifiedAccessEndpoints", "GetVerifiedAccessEndpointPolicy", "GetVerifiedAccessEndpointTargets", "ModifyVerifiedAccessEndpoint"), "Verified Access Endpoint",
      EventName in ("ModifyVerifiedAccessEndpointPolicy"), "Verified Access Endpoint Policy",
      EventName in ("CreateVerifiedAccessGroup", "DeleteVerifiedAccessGroup", "DescribeVerifiedAccessGroups", "ModifyVerifiedAccessGroup"), "Verified Access Group",
      EventName in ("GetVerifiedAccessGroupPolicy", "ModifyVerifiedAccessGroupPolicy"), "Verified Access Group Policy",
      EventName in ("CreateVerifiedAccessInstance", "DeleteVerifiedAccessInstance", "DescribeVerifiedAccessInstances", "ModifyVerifiedAccessInstance", "ModifyVerifiedAccessInstanceLoggingConfiguration"), "Verified Access Instance",
      EventName in ("DescribeVerifiedAccessInstanceLoggingConfigurations"), "Verified Access Instance Logging Configuration",
      EventName in ("CreateVerifiedAccessTrustProvider", "DeleteVerifiedAccessTrustProvider", "DescribeVerifiedAccessTrustProviders", "DetachVerifiedAccessTrustProvider", "ModifyVerifiedAccessTrustProvider"), "Verified Access Trust Provider",
      "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
      EventName in ("AttachVerifiedAccessTrustProvider", "CreateVerifiedAccessInstance",
        "ModifyVerifiedAccessInstance"), ResponseElements.verifiedAccessInstance,
      EventName in ("CreateVerifiedAccessEndpoint", "ModifyVerifiedAccessEndpoint"),
        ResponseElements.verifiedAccessEndpoint,
      EventName in ("CreateVerifiedAccessGroup", "ModifyVerifiedAccessGroup"),
        ResponseElements.verifiedAccessGroup,
      EventName in ("CreateVerifiedAccessTrustProvider", "ModifyVerifiedAccessTrustProvider"),
        ResponseElements.verifiedAccessTrustProvider,
      EventName == "ExportVerifiedAccessInstanceClientConfiguration", ResponseElements.openVpnConfigurationSet,
      EventName in ("ModifyVerifiedAccessEndpointPolicy", "ModifyVerifiedAccessGroupPolicy"),
        ResponseElements.sseSpecification,
      EventName == "ModifyVerifiedAccessInstanceLoggingConfiguration", ResponseElements.loggingConfiguration,
      parse_json('null')
    ), parse_json('null'))
  | extend ObjectId = case(
      EventName in ("AttachVerifiedAccessTrustProvider", "DeleteVerifiedAccessInstance",
        "DescribeVerifiedAccessInstanceLoggingConfigurations", "DescribeVerifiedAccessInstances",
        "ExportVerifiedAccessInstanceClientConfiguration", "ModifyVerifiedAccessGroup",
        "ModifyVerifiedAccessInstance", "ModifyVerifiedAccessInstanceLoggingConfiguration"),
        RequestParameters.VerifiedAccessInstanceId,
      EventName == "CreateVerifiedAccessEndpoint",
        ResponseElements.verifiedAccessEndpoint.verifiedAccessEndpointId,
      EventName == "CreateVerifiedAccessGroup", ResponseElements.verifiedAccessGroup.verifiedAccessGroupId,
      EventName == "CreateVerifiedAccessInstance",
        ResponseElements.verifiedAccessInstance.verifiedAccessInstanceId,
      EventName == "CreateVerifiedAccessTrustProvider",
        ResponseElements.verifiedAccessTrustProvider.verifiedAccessTrustProviderId,
      EventName in ("DeleteVerifiedAccessEndpoint", "GetVerifiedAccessEndpointPolicy",
        "GetVerifiedAccessEndpointTargets", "ModifyVerifiedAccessEndpointPolicy"),
        RequestParameters.VerifiedAccessEndpointId,
      EventName in ("DeleteVerifiedAccessGroup", "DescribeVerifiedAccessEndpoints",
        "DescribeVerifiedAccessGroups", "GetVerifiedAccessGroupPolicy", "ModifyVerifiedAccessEndpoint",
        "ModifyVerifiedAccessGroupPolicy"), RequestParameters.VerifiedAccessGroupId,
      EventName in ("DeleteVerifiedAccessTrustProvider", "DescribeVerifiedAccessTrustProviders",
        "DetachVerifiedAccessTrustProvider", "ModifyVerifiedAccessTrustProvider"),
        RequestParameters.VerifiedAccessTrustProviderId,
      parse_json('null')
    )
  | extend
      Type = "AWSCloudTrail",
      EventCount = int(1),
      EventStartTime = TimeGenerated,
      EventEndTime = TimeGenerated,
      EventSeverity = "Informational",
      EventSchema = "AuditEvent",
      EventSchemaVersion = "1.0.0",
      EventVendor = "AWS",
      EventProduct = "CloudTrail",
      Dvc = "CloudTrail",
      EventMessage = ErrorMessage,
      ObjectType = "Cloud Resource",
      TargetAppName = "Amazon Elastic Compute Cloud",
      TargetAppType = "Service",
      EventUid = tostring(AwsEventId)
  | project-rename
      EventOriginalSubType = EventTypeName,
      EventOriginalType = EventName,
      EventOriginalResultDetails = ErrorMessage,
      EventProductVersion = EventVersion,
      ActorUserId = UserIdentityAccountId,
      ActorUsername = UserIdentityUserName,
      ActorOriginalUserType = UserIdentityType,
      HttpUserAgent = UserAgent
  | extend
      ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
      ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
      SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
      ActingApplicationEntityKey = "",
      ActorUserAdditionalIds = parse_json('[]'),
      ActorUserEntityKey = "",
      AdditionalEntities = parse_json('[]'),
      DvcEntityKey = "",
      SrcSystemEntityKey = "",
      TargetApplicationEntityKey = "",
      TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
      "ActorAccessKeyId", UserIdentityAccessKeyId,
      "AWSRegion", AWSRegion,
      "APIVersion", APIVersion,
      "ManagementEvent", ManagementEvent,
      "ReadOnly", ReadOnly,
      "RequestParameters", RequestParameters,
      "ResponseElements", ResponseElements
    )
  | extend
      Operation = EventOriginalType,
      User = ActorUsername,
      IpAddr = SrcIpAddr,
      Application = TargetAppName,
      Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
      TimeGenerated,
      Type,
      EventCount,
      EventStartTime,
      EventEndTime,
      EventSeverity,
      EventSchemaVersion,
      EventVendor,
      EventProduct,
      EventResult,
      EventMessage,
      TargetAppName,
      EventOriginalSubType,
      EventOriginalType,
      EventOriginalUid,
      EventOriginalResultDetails,
      EventProductVersion,
      ActorUserId,
      ActorUsername,
      ActorOriginalUserType,
      HttpUserAgent,
      ActorUserIdType,
      ActorUsernameType,
      SrcIpAddr,
      AdditionalFields,
      EventType,
      NewValue,
      ObjectId,
      ObjectType,
      Object,
      TargetAppType,
      Operation,
      ActingApplicationEntityKey,
      ActorUserAdditionalIds,
      ActorUserEntityKey,
      AdditionalEntities,
      DvcEntityKey,
      SrcSystemEntityKey,
      TargetApplicationEntityKey,
      TargetSystemEntityKey
Change:
  Date: '2026-11-06'
  Description: 'Initial ingestion-time conversion.'
