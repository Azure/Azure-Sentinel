Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 instance activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 instance activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2Instances'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateApplicationStatusCheck", "CreateInstanceEventWindow", "RegisterInstanceEventNotificationAttributes"), "Create",
  EventName in ("DeleteApplicationStatusCheck", "DeleteInstanceEventWindow", "DisassociateApplicationStatusCheck", "DisassociateIamInstanceProfile"), "Delete",
  EventName in ("DisableApplicationStatusCheckSuppression", "DisableInstanceSqlHaStandbyDetections"), "Disable",
  EventName in ("EnableApplicationStatusCheckSuppression", "EnableInstanceSqlHaStandbyDetections"), "Enable",
  EventName in ("MonitorInstances", "RebootInstances", "ResetInstanceAttribute", "SendDiagnosticInterrupt", "UnmonitorInstances"), "Execute",
  EventName in ("ReportInstanceStatus"), "Other",
  EventName in ("DescribeApplicationStatus", "DescribeApplicationStatusCheckAssociations", "DescribeApplicationStatusChecks", "DescribeIamInstanceProfileAssociations", "DescribeInstanceAttribute", "DescribeInstanceCreditSpecifications", "DescribeInstanceEventNotificationAttributes", "DescribeInstanceEventWindows", "DescribeInstanceImageMetadata", "DescribeInstanceSqlHaHistoryStates", "DescribeInstanceSqlHaStates", "DescribeInstanceStatus", "DescribeInstances", "GetDefaultCreditSpecification", "GetInstanceMetadataDefaults", "GetInstanceUefiData"), "Read",
  EventName in ("AssociateApplicationStatusCheck", "AssociateIamInstanceProfile", "AssociateInstanceEventWindow", "DisassociateInstanceEventWindow", "ModifyApplicationStatusCheck", "ModifyDefaultCreditSpecification", "ModifyInstanceAttribute", "ModifyInstanceCapacityReservationAttributes", "ModifyInstanceCpuOptions", "ModifyInstanceCreditSpecification", "ModifyInstanceEventStartTime", "ModifyInstanceEventWindow", "ModifyInstanceMaintenanceOptions", "ModifyInstanceMetadataDefaults", "ModifyInstanceMetadataOptions", "ModifyInstanceNetworkPerformanceOptions", "ModifyInstancePlacement", "ModifyPrivateDnsNameOptions", "ModifyPublicIpDnsNameOptions", "ReplaceIamInstanceProfileAssociation"), "Set",
  EventName in ("RunInstances", "StartInstances"), "Start",
  EventName in ("StopInstances", "TerminateInstances"), "Stop",
  "")
  | where isnotempty(EventType)
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateApplicationStatusCheck", "CreateInstanceEventWindow", "RegisterInstanceEventNotificationAttributes"), "Create",
  EventName in ("DeleteApplicationStatusCheck", "DeleteInstanceEventWindow", "DisassociateApplicationStatusCheck", "DisassociateIamInstanceProfile"), "Delete",
  EventName in ("DisableApplicationStatusCheckSuppression", "DisableInstanceSqlHaStandbyDetections"), "Disable",
  EventName in ("EnableApplicationStatusCheckSuppression", "EnableInstanceSqlHaStandbyDetections"), "Enable",
  EventName in ("MonitorInstances", "RebootInstances", "ResetInstanceAttribute", "SendDiagnosticInterrupt", "UnmonitorInstances"), "Execute",
  EventName in ("ReportInstanceStatus"), "Other",
  EventName in ("DescribeApplicationStatus", "DescribeApplicationStatusCheckAssociations", "DescribeApplicationStatusChecks", "DescribeIamInstanceProfileAssociations", "DescribeInstanceAttribute", "DescribeInstanceCreditSpecifications", "DescribeInstanceEventNotificationAttributes", "DescribeInstanceEventWindows", "DescribeInstanceImageMetadata", "DescribeInstanceSqlHaHistoryStates", "DescribeInstanceSqlHaStates", "DescribeInstanceStatus", "DescribeInstances", "GetDefaultCreditSpecification", "GetInstanceMetadataDefaults", "GetInstanceUefiData"), "Read",
  EventName in ("AssociateApplicationStatusCheck", "AssociateIamInstanceProfile", "AssociateInstanceEventWindow", "DisassociateInstanceEventWindow", "ModifyApplicationStatusCheck", "ModifyDefaultCreditSpecification", "ModifyInstanceAttribute", "ModifyInstanceCapacityReservationAttributes", "ModifyInstanceCpuOptions", "ModifyInstanceCreditSpecification", "ModifyInstanceEventStartTime", "ModifyInstanceEventWindow", "ModifyInstanceMaintenanceOptions", "ModifyInstanceMetadataDefaults", "ModifyInstanceMetadataOptions", "ModifyInstanceNetworkPerformanceOptions", "ModifyInstancePlacement", "ModifyPrivateDnsNameOptions", "ModifyPublicIpDnsNameOptions", "ReplaceIamInstanceProfileAssociation"), "Set",
  EventName in ("RunInstances", "StartInstances"), "Start",
  EventName in ("StopInstances", "TerminateInstances"), "Stop",
  "")
  | where isnotempty(EventType)
  | extend Object = case(
  EventName in ("CreateApplicationStatusCheck", "DeleteApplicationStatusCheck", "DescribeApplicationStatusChecks", "ModifyApplicationStatusCheck"), "Application Status Check",
  EventName in ("AssociateApplicationStatusCheck", "DescribeApplicationStatusCheckAssociations", "DisassociateApplicationStatusCheck"), "Application Status Check Association",
  EventName in ("DisableApplicationStatusCheckSuppression", "EnableApplicationStatusCheckSuppression"), "Application Status Check Suppression",
  EventName in ("AssociateIamInstanceProfile", "DescribeInstanceAttribute", "DescribeInstanceCreditSpecifications", "DescribeInstanceImageMetadata", "DescribeInstanceSqlHaHistoryStates", "DescribeInstanceSqlHaStates", "DescribeInstanceStatus", "DescribeInstances", "DisableInstanceSqlHaStandbyDetections", "EnableInstanceSqlHaStandbyDetections", "GetDefaultCreditSpecification", "GetInstanceUefiData", "ModifyDefaultCreditSpecification", "ModifyInstanceAttribute", "ModifyInstanceCapacityReservationAttributes", "ModifyInstanceCpuOptions", "ModifyInstanceCreditSpecification", "ModifyInstanceEventStartTime", "ModifyInstanceMetadataDefaults", "ModifyInstanceMetadataOptions", "ModifyInstanceNetworkPerformanceOptions", "ModifyInstancePlacement", "ModifyPrivateDnsNameOptions", "MonitorInstances", "RebootInstances", "ReportInstanceStatus", "ResetInstanceAttribute", "RunInstances", "SendDiagnosticInterrupt", "StartInstances", "StopInstances", "TerminateInstances", "UnmonitorInstances"), "EC2 Instance",
  EventName in ("DescribeApplicationStatus"), "EC2 Instance Application Status",
  EventName in ("DescribeIamInstanceProfileAssociations", "DisassociateIamInstanceProfile", "ReplaceIamInstanceProfileAssociation"), "IAM Instance Profile Association",
  EventName in ("ModifyInstanceMaintenanceOptions"), "IMDS",
  EventName in ("DescribeInstanceEventNotificationAttributes", "RegisterInstanceEventNotificationAttributes"), "Instance Event Notification Attribute",
  EventName in ("AssociateInstanceEventWindow", "CreateInstanceEventWindow", "DeleteInstanceEventWindow", "DescribeInstanceEventWindows", "DisassociateInstanceEventWindow", "ModifyInstanceEventWindow"), "Instance Event Window",
  EventName in ("GetInstanceMetadataDefaults"), "Instance Metadata Defaults",
  EventName in ("ModifyPublicIpDnsNameOptions"), "Network Interface",
  "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
  EventName == "AssociateApplicationStatusCheck", ResponseElements.successfulResultSet,
  EventName == "AssociateIamInstanceProfile", ResponseElements.iamInstanceProfileAssociation,
  EventName == "AssociateInstanceEventWindow", ResponseElements.instanceEventWindow,
  EventName == "CreateApplicationStatusCheck", ResponseElements.applicationStatusCheck,
  EventName == "CreateInstanceEventWindow", ResponseElements.instanceEventWindow,
  EventName == "DisableApplicationStatusCheckSuppression", ResponseElements.successfulResultSet,
  EventName == "EnableApplicationStatusCheckSuppression", ResponseElements.successfulResultSet,
  EventName == "ModifyApplicationStatusCheck", ResponseElements.applicationStatusCheck,
  EventName == "ModifyDefaultCreditSpecification", ResponseElements.instanceFamilyCreditSpecification,
  EventName == "ModifyInstanceAttribute", RequestParameters.Attribute,
  EventName == "ModifyInstanceCapacityReservationAttributes",
  RequestParameters.CapacityReservationSpecification,
  EventName == "ModifyInstanceCpuOptions", ResponseElements,
  EventName == "ModifyInstanceEventStartTime", ResponseElements.event,
  EventName == "ModifyPublicIpDnsNameOptions", RequestParameters.HostnameType,
  EventName == "MonitorInstances", ResponseElements.instancesSet,
  EventName == "RegisterInstanceEventNotificationAttributes", ResponseElements.instanceTagAttribute,
  EventName == "ReplaceIamInstanceProfileAssociation", ResponseElements.iamInstanceProfileAssociation,
  EventName == "RunInstances", ResponseElements.groupSet,
  EventName == "StartInstances", ResponseElements.instancesSet,
  EventName == "StopInstances", ResponseElements.instancesSet,
  EventName == "UnmonitorInstances", ResponseElements.instancesSet,
  parse_json('null')
  ), parse_json('null'))
  | extend ObjectId = case(
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
  EventName == "AssociateApplicationStatusCheck", iff(isnotnull(RequestParameters.applicationStatusCheckId), RequestParameters.applicationStatusCheckId, RequestParameters.ApplicationStatusCheckId),
  EventName == "AssociateIamInstanceProfile", RequestParameters.InstanceId,
  EventName == "AssociateInstanceEventWindow", RequestParameters.InstanceEventWindowId,
  EventName == "CreateApplicationStatusCheck",
  ResponseElements.applicationStatusCheck.applicationStatusCheckId,
  EventName == "CreateInstanceEventWindow", ResponseElements.instanceEventWindow.instanceEventWindowId,
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
  EventName == "DeleteApplicationStatusCheck", iff(isnotnull(RequestParameters.applicationStatusCheckId), RequestParameters.applicationStatusCheckId, RequestParameters.ApplicationStatusCheckId),
  EventName == "DeleteInstanceEventWindow", RequestParameters.InstanceEventWindowId,
  EventName == "DescribeIamInstanceProfileAssociations", RequestParameters.AssociationId,
  EventName == "DescribeInstanceAttribute", RequestParameters.InstanceId,
  EventName == "DescribeInstanceCreditSpecifications", RequestParameters.InstanceId,
  EventName == "DescribeInstanceEventWindows", RequestParameters.InstanceEventWindowId.N,
  EventName == "DescribeInstanceImageMetadata", RequestParameters.InstanceId.N,
  EventName == "DescribeInstanceSqlHaHistoryStates", RequestParameters.InstanceId.N,
  EventName == "DescribeInstanceSqlHaStates", RequestParameters.InstanceId.N,
  EventName == "DescribeInstanceStatus", RequestParameters.InstanceId.N,
  EventName == "DescribeInstances", RequestParameters.InstanceId.N,
  EventName == "DisableInstanceSqlHaStandbyDetections", RequestParameters.InstanceId,
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
  EventName == "DisassociateApplicationStatusCheck", iff(isnotnull(RequestParameters.applicationStatusCheckId), RequestParameters.applicationStatusCheckId, RequestParameters.ApplicationStatusCheckId),
  EventName == "DisassociateIamInstanceProfile", RequestParameters.AssociationId,
  EventName == "DisassociateInstanceEventWindow", RequestParameters.InstanceEventWindowId,
  EventName == "EnableInstanceSqlHaStandbyDetections", RequestParameters.InstanceId,
  EventName == "GetInstanceUefiData", ResponseElements.instanceId,
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
  EventName == "ModifyApplicationStatusCheck", iff(isnotnull(RequestParameters.applicationStatusCheckId), RequestParameters.applicationStatusCheckId, RequestParameters.ApplicationStatusCheckId),
  EventName == "ModifyDefaultCreditSpecification",
  ResponseElements.instanceFamilyCreditSpecification.instanceFamilyCreditSpecificationId,
  EventName == "ModifyInstanceAttribute", RequestParameters.InstanceId,
  EventName == "ModifyInstanceCapacityReservationAttributes", RequestParameters.InstanceId,
  EventName == "ModifyInstanceCpuOptions", ResponseElements.instanceId,
  EventName == "ModifyInstanceCreditSpecification", RequestParameters.InstanceCreditSpecification,
  EventName == "ModifyInstanceEventStartTime", RequestParameters.InstanceEventId,
  EventName == "ModifyInstanceEventWindow", RequestParameters.InstanceEventWindowId,
  EventName == "ModifyInstanceMaintenanceOptions", ResponseElements.instanceId,
  EventName == "ModifyInstanceMetadataOptions", ResponseElements.instanceId,
  EventName == "ModifyInstanceNetworkPerformanceOptions", ResponseElements.instanceId,
  EventName == "ModifyInstancePlacement", ResponseElements.instanceId,
  EventName == "ModifyPrivateDnsNameOptions", RequestParameters.InstanceId,
  EventName == "ModifyPublicIpDnsNameOptions", RequestParameters.NetworkInterfaceId,
  EventName == "MonitorInstances", RequestParameters.InstanceId,
  EventName == "RebootInstances", RequestParameters.InstanceId,
  EventName == "ReplaceIamInstanceProfileAssociation",
  ResponseElements.iamInstanceProfileAssociation.associationId,
  EventName == "ReportInstanceStatus", RequestParameters.InstanceId,
  EventName == "ResetInstanceAttribute", RequestParameters.InstanceId,
  EventName == "RunInstances", ResponseElements.requesterId,
  EventName == "SendDiagnosticInterrupt", RequestParameters.InstanceId,
  EventName == "StartInstances", RequestParameters.InstanceId,
  EventName == "StopInstances", RequestParameters.InstanceId,
  EventName == "TerminateInstances", RequestParameters.InstanceId,
  EventName == "UnmonitorInstances", RequestParameters.InstanceId,
  parse_json('null')
  )
  | extend
  Type = "AWSCloudTrail",
  EventCount = int(1),
  EventStartTime = TimeGenerated,
  EventEndTime = TimeGenerated,
  EventSeverity = "Informational",
  EventSchema = "AuditEvent",
  EventSchemaVersion = "1.0.0",
  EventVendor = "AWS",
  EventProduct = "CloudTrail",
  Dvc = "CloudTrail",
  EventMessage = ErrorMessage,
  ObjectType = "Cloud Resource",
  TargetAppName = "Amazon Elastic Compute Cloud",
  TargetAppType = "Service",
  EventUid = tostring(AwsEventId)
  | project-rename
  EventOriginalSubType = EventTypeName,
  EventOriginalType = EventName,
  EventOriginalResultDetails = ErrorMessage,
  EventProductVersion = EventVersion,
  ActorUserId = UserIdentityAccountId,
  ActorUsername = UserIdentityUserName,
  ActorOriginalUserType = UserIdentityType,
  HttpUserAgent = UserAgent
  | extend
  ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
  ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
  SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
  ActingApplicationEntityKey = "",
  ActorUserAdditionalIds = parse_json('[]'),
  ActorUserEntityKey = "",
  AdditionalEntities = parse_json('[]'),
  DvcEntityKey = "",
  SrcSystemEntityKey = "",
  TargetApplicationEntityKey = "",
  TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
  "ActorAccessKeyId", UserIdentityAccessKeyId,
  "AWSRegion", AWSRegion,
  "APIVersion", APIVersion,
  "ManagementEvent", ManagementEvent,
  "ReadOnly", ReadOnly,
  "RequestParameters", RequestParameters,
  "ResponseElements", ResponseElements
  )
  | extend
  Operation = EventOriginalType,
  User = ActorUsername,
  IpAddr = SrcIpAddr,
  Application = TargetAppName,
  Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
  TimeGenerated,
  Type,
  EventCount,
  EventStartTime,
  EventEndTime,
  EventSeverity,
  EventSchemaVersion,
  EventVendor,
  EventProduct,
  EventResult,
  EventMessage,
  TargetAppName,
  EventOriginalSubType,
  EventOriginalType,
  EventOriginalUid,
  EventOriginalResultDetails,
  EventProductVersion,
  ActorUserId,
  ActorUsername,
  ActorOriginalUserType,
  HttpUserAgent,
  ActorUserIdType,
  ActorUsernameType,
  SrcIpAddr,
  AdditionalFields,
  EventType,
  NewValue,
  ObjectId,
  ObjectType,
  Object,
  TargetAppType,
  Operation,
  ActingApplicationEntityKey,
  ActorUserAdditionalIds,
  ActorUserEntityKey,
  AdditionalEntities,
  DvcEntityKey,
  SrcSystemEntityKey,
  TargetApplicationEntityKey,
  TargetSystemEntityKey
Change:
  Date: '2026-11-06'
  Description: 'Initial ingestion-time conversion.'
