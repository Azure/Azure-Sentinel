Parser:
  DisplayName: 'AuditEvent ingestion-time ASIM parser for Salesforce Real-Time Event Monitoring'
  Version: '0.1.0'
  LastUpdated: '2026-11-12'
Product:
  Name: 'Salesforce Real-Time Event Monitoring'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes SalesForceRealTimeEventMonitoring_CL into ASimAuditEventLogs during ingestion. Query-only fields are retained in AdditionalFields.QueryTimeFields; review documented lossy conversions.
ParserName: 'ASimAuditEventSalesforceRealTimeEventMonitoring'
DCRType: 'Standard'
InputStream: 'Custom-SalesForceRealTimeEventMonitoring_CL'
SourceRawTable: 'SalesForceRealTimeEventMonitoring_CL'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventType == "PermissionSetEventStore"
  | where Operation !in ("AssignedToUsers", "UnassignedFromUsers")
ParserQuery: |
  source
  | extend Type = "SalesForceRealTimeEventMonitoring_CL"
  | extend SalesforceDomain = columnifexists("SalesforceDomain", columnifexists("apiUrl", "")),
      SalesforceObjectId = columnifexists("SalesforceObjectId", columnifexists("Id", "")),
      UserNameDetail = columnifexists("UserNameDetail", columnifexists("Username", "")),
      SalesforceResourceId = columnifexists("SalesforceResourceId", columnifexists("ResourceId", "")),
      TimeGenerated = columnifexists("TimeGenerated", iff(isempty(EventDate), now(), todatetime(EventDate)))
  | where EventType == "PermissionSetEventStore"
  | where Operation !in ("AssignedToUsers", "UnassignedFromUsers")
  | extend
      _SourceType = EventType,
      _Org = tostring(SalesforceDomain)
  | extend
      // NOTE(DCR-LOSSY: 3.34 parse_url) - regex Host extraction omits URL decoding and bracketed IPv6 handling
      _OrgHost = tostring(extract(@"^[a-zA-Z][a-zA-Z0-9+.-]*://(?:[^@/]*@)?([^:/?#]*)", 1, iff(_Org contains "://", _Org, strcat("https://", _Org)))),
      SrcIpAddr = iff(isnotnull(parse_ipv4(SourceIp)) or isnotempty(parse_ipv6(SourceIp)), SourceIp, "")
  | extend
      // NOTE(DCR-LOSSY: 3.4 coalesce non-string) - datetime arguments use isnotnull; typed datetime fallback; toolkit requires review
      EventStartTime = iif(isnotnull(EventDate), EventDate, TimeGenerated),
      // NOTE(DCR-LOSSY: 3.4 coalesce non-string) - datetime arguments use isnotnull; typed datetime fallback; toolkit requires review
      EventEndTime = iif(isnotnull(EventDate), EventDate, TimeGenerated),
      EventCount = toint(1),
      EventVendor = "Salesforce",
      EventProduct = "Real-Time Event Monitoring",
      EventSchema = "AuditEvent",
      EventSchemaVersion = "1.0.0",
      EventOriginalType = _SourceType,
      EventSubType = PermissionType,
      EventType = case(
          Operation in ("PermsEnabled", "CriticalPerms"), "Enable",
          Operation == "PermsDisabled", "Disable",
          "Other"),
      EventResult = case(
          PolicyOutcome in ("Block", "MeteringBlock", "EndSession", "TwoFADenied", "TwoFAReportedDenied")
              or PolicyOutcome startswith "Failed" or PolicyOutcome startswith "TwoFAFailed", "Failure",
          PolicyOutcome in ("", "NoAction", "ExemptNoAction", "MeteringNoAction", "Notified",
              "TwoFANoAction", "TwoFASucceeded", "TwoFAAutomatedSuccess"), "Success",
          "NA"),
      EventSeverity = "Informational",
      EventUid = iif(isnotempty(EventIdentifier), EventIdentifier, iif(isnotempty(SalesforceObjectId), SalesforceObjectId, EventUuid)),
      EventOriginalUid = SalesforceObjectId,
      EventOriginalResultDetails = PolicyOutcome,
      EventMessage = Operation,
      Object = case(
          array_length(ParentNameList) == 1, tostring(ParentNameList[0]),
          array_length(ParentNameList) > 1, tostring(ParentNameList),
          array_length(ParentIdList) == 1, tostring(ParentIdList[0]),
          array_length(ParentIdList) > 1, tostring(ParentIdList),
          tostring(PermissionList)),
      ObjectId = iff(array_length(ParentIdList) == 1, tostring(ParentIdList[0]), ""),
      ObjectType = "Configuration Atom",
      OriginalObjectType = PermissionType,
      OldValue = iff(Operation == "PermsDisabled", tostring(PermissionList), ""),
      NewValue = iff(Operation in ("PermsEnabled", "CriticalPerms"), tostring(PermissionList), ""),
      Value = iff(Operation in ("PermsEnabled", "CriticalPerms"), tostring(PermissionList), ""),
      ValueType = iff(array_length(PermissionList) > 0, "Other", ""),
      Dvc = iif(isnotempty(_OrgHost), _OrgHost, "Salesforce Real-Time Event Monitoring"),
      DvcFQDN = _OrgHost,
      DvcHostname = tostring(split(_OrgHost, ".")[0]),
      DvcDomain = iff(indexof(_OrgHost, ".") >= 0, substring(_OrgHost, indexof(_OrgHost, ".") + 1), ""),
      DvcScope = _OrgHost,
      DvcOriginalAction = PolicyOutcome,
      DvcAction = case(
          PolicyOutcome in ("Block", "MeteringBlock"), "Deny",
          PolicyOutcome == "EndSession", "Terminate",
          PolicyOutcome in ("NoAction", "ExemptNoAction", "MeteringNoAction", "Notified",
              "TwoFANoAction", "TwoFASucceeded", "TwoFAAutomatedSuccess"), "Allow",
          ""),
      ActorUserId = UserId,
      ActorUserIdType = iff(isempty(UserId), "", "SalesforceId"),
      ActorUsername = UserNameDetail,
      ActorUsernameType = iff(isempty(UserNameDetail), "", iff(UserNameDetail contains "@", "UPN", "Simple")),
      ActorScope = _OrgHost,
      ActorSessionId = SessionKey,
      ActingAppName = EventSource,
      ActingAppType = iff(isempty(EventSource), "", "SaaS application"),
      ActingOriginalAppType = EventSource,
      TargetAppName = "Salesforce",
      TargetAppType = "SaaS application",
      RuleName = iif(isnotempty(PolicyId), PolicyId, Policy),
      AdditionalFields = pack(
          "ParentIdList", ParentIdList, "ParentNameList", ParentNameList,
          "PermissionList", PermissionList, "PermissionType", PermissionType,
          "ImpactedUserIds", ImpactedUserIds, "UserCount", UserCount,
          "HasExternalUsers", HasExternalUsers,
          "PermissionExpiration", PermissionExpiration,
          "PermissionExpirationList", PermissionExpirationList,
          "LoginKey", LoginKey, "SourceIp", SourceIp,
          "LoginHistoryId", LoginHistoryId, "SessionLevel", SessionLevel,
          "RelatedEventIdentifier", RelatedEventIdentifier,
          "PolicyOutcome", PolicyOutcome, "EvaluationTime", EvaluationTime),
      DvcEntityKey = "",
      ActorUserEntityKey = "",
      SrcSystemEntityKey = "",
      TargetSystemEntityKey = "",
      ActingApplicationEntityKey = "",
      TargetApplicationEntityKey = "",
      ActorUserAdditionalIds = parse_json('[]'),
      AdditionalEntities = parse_json('[]')
  | extend
      DvcDomainType = iff(isempty(DvcDomain), "", "FQDN"),
      Src = SrcIpAddr,
      IpAddr = SrcIpAddr,
      User = ActorUsername,
      Application = TargetAppName,
      Dst = TargetAppName,
      Rule = RuleName,
      Type = tostring(Type)
  | project
      TimeGenerated, Type, EventStartTime, EventEndTime, EventCount,
      EventVendor, EventProduct, EventSchema, EventSchemaVersion,
      EventOriginalType, EventSubType, EventType, EventResult, EventSeverity,
      EventUid, EventOriginalUid, EventOriginalResultDetails, EventMessage,
      Operation, Object, ObjectId, ObjectType, OriginalObjectType,
      OldValue, NewValue, Value, ValueType,
      Dvc, DvcFQDN, DvcHostname, DvcDomain, DvcDomainType, DvcScope, DvcOriginalAction, DvcAction,
      ActorUserId, ActorUserIdType, ActorUsername, ActorUsernameType,
      ActorScope, ActorSessionId, User, SrcIpAddr, Src, IpAddr,
      ActingAppName, ActingAppType, ActingOriginalAppType,
      TargetAppName, TargetAppType, Application, Dst, RuleName, Rule,
      AdditionalFields, DvcEntityKey, ActorUserEntityKey, SrcSystemEntityKey,
      TargetSystemEntityKey, ActingApplicationEntityKey, TargetApplicationEntityKey,
      ActorUserAdditionalIds, AdditionalEntities
  // NOTE(DCR-LOSSY: storage projection) - query-only fields preserved in AdditionalFields.QueryTimeFields
  | extend AdditionalFields = bag_merge(AdditionalFields, pack("QueryTimeFields", pack("EventSchema", EventSchema, "EventUid", EventUid, "Value", Value, "Dvc", Dvc, "User", User, "Src", Src, "IpAddr", IpAddr, "Application", Application, "Dst", Dst, "Rule", Rule)))
  | project TimeGenerated, Type, EventStartTime, EventEndTime, EventCount, EventVendor, EventProduct, EventSchemaVersion, EventOriginalType, EventSubType, EventType, EventResult, EventSeverity, EventOriginalUid, EventOriginalResultDetails, EventMessage, Operation, Object, ObjectId, ObjectType, OriginalObjectType, OldValue, NewValue, ValueType, DvcFQDN, DvcHostname, DvcDomain, DvcDomainType, DvcScope, DvcOriginalAction, DvcAction, ActorUserId, ActorUserIdType, ActorUsername, ActorUsernameType, ActorScope, ActorSessionId, SrcIpAddr, ActingAppName, ActingAppType, ActingOriginalAppType, TargetAppName, TargetAppType, RuleName, AdditionalFields, DvcEntityKey, ActorUserEntityKey, SrcSystemEntityKey, TargetSystemEntityKey, ActingApplicationEntityKey, TargetApplicationEntityKey, ActorUserAdditionalIds, AdditionalEntities
Change:
  Date: '2026-11-12'
  Description: 'Initial per-table ingestion-time definition with query-only values preserved in AdditionalFields.QueryTimeFields.'
