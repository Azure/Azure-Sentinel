Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 CapacityAndReservations activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 CapacityAndReservations activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2CapacityAndReservations'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("AllocateHosts", "CreateCapacityManagerDataExport", "CreateCapacityReservation", "CreateCapacityReservationBySplitting", "CreateCapacityReservationCancellationQuote", "CreateCapacityReservationDateChangeQuote", "CreateCapacityReservationFleet", "CreateInterruptibleCapacityReservationAllocation", "CreateReservedInstancesListing", "PurchaseCapacityBlock", "PurchaseCapacityBlockExtension", "PurchaseHostReservation", "PurchaseReservedInstancesOffering", "PurchaseScheduledInstances", "RunScheduledInstances"), "Create",
  EventName in ("CancelCapacityReservation", "CancelCapacityReservationFleets", "CancelReservedInstancesListing", "DeleteCapacityManagerDataExport", "DeleteQueuedReservedInstances", "DisassociateCapacityReservationBillingOwner", "ReleaseHosts"), "Delete",
  EventName in ("DisableCapacityManager"), "Disable",
  EventName in ("EnableCapacityManager"), "Enable",
  EventName in ("AcceptCapacityReservationBillingOwnership", "AcceptReservedInstancesExchangeQuote", "ConfirmProductInstance", "MoveCapacityReservationInstances", "RejectCapacityReservationBillingOwnership"), "Execute",
  EventName in ("DescribeCapacityBlockExtensionHistory", "DescribeCapacityBlockExtensionOfferings", "DescribeCapacityBlockOfferings", "DescribeCapacityBlockStatus", "DescribeCapacityBlocks", "DescribeCapacityManagerDataExports", "DescribeCapacityReservationBillingRequests", "DescribeCapacityReservationCancellationQuotes", "DescribeCapacityReservationDateChangeQuotes", "DescribeCapacityReservationFleets", "DescribeCapacityReservationTopology", "DescribeCapacityReservations", "DescribeHostReservationOfferings", "DescribeHostReservations", "DescribeHosts", "DescribeMacHosts", "DescribeReservedInstances", "DescribeReservedInstancesListings", "DescribeReservedInstancesModifications", "DescribeReservedInstancesOfferings", "DescribeScheduledInstanceAvailability", "DescribeScheduledInstances", "GetCapacityManagerAttributes", "GetCapacityManagerMetricData", "GetCapacityManagerMetricDimensions", "GetCapacityManagerMonitoredTagKeys", "GetCapacityReservationUsage", "GetGroupsForCapacityReservation", "GetHostReservationPurchasePreview", "GetReservedInstancesExchangeQuote"), "Read",
  EventName in ("AssociateCapacityReservationBillingOwner", "ModifyCapacityReservation", "ModifyCapacityReservationFleet", "ModifyHosts", "ModifyReservedInstances", "UpdateCapacityManagerMonitoredTagKeys", "UpdateCapacityManagerOrganizationsAccess", "UpdateInterruptibleCapacityReservationAllocation"), "Set",
  "")
  | where isnotempty(EventType)
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("AllocateHosts", "CreateCapacityManagerDataExport", "CreateCapacityReservation", "CreateCapacityReservationBySplitting", "CreateCapacityReservationCancellationQuote", "CreateCapacityReservationDateChangeQuote", "CreateCapacityReservationFleet", "CreateInterruptibleCapacityReservationAllocation", "CreateReservedInstancesListing", "PurchaseCapacityBlock", "PurchaseCapacityBlockExtension", "PurchaseHostReservation", "PurchaseReservedInstancesOffering", "PurchaseScheduledInstances", "RunScheduledInstances"), "Create",
  EventName in ("CancelCapacityReservation", "CancelCapacityReservationFleets", "CancelReservedInstancesListing", "DeleteCapacityManagerDataExport", "DeleteQueuedReservedInstances", "DisassociateCapacityReservationBillingOwner", "ReleaseHosts"), "Delete",
  EventName in ("DisableCapacityManager"), "Disable",
  EventName in ("EnableCapacityManager"), "Enable",
  EventName in ("AcceptCapacityReservationBillingOwnership", "AcceptReservedInstancesExchangeQuote", "ConfirmProductInstance", "MoveCapacityReservationInstances", "RejectCapacityReservationBillingOwnership"), "Execute",
  EventName in ("DescribeCapacityBlockExtensionHistory", "DescribeCapacityBlockExtensionOfferings", "DescribeCapacityBlockOfferings", "DescribeCapacityBlockStatus", "DescribeCapacityBlocks", "DescribeCapacityManagerDataExports", "DescribeCapacityReservationBillingRequests", "DescribeCapacityReservationCancellationQuotes", "DescribeCapacityReservationDateChangeQuotes", "DescribeCapacityReservationFleets", "DescribeCapacityReservationTopology", "DescribeCapacityReservations", "DescribeHostReservationOfferings", "DescribeHostReservations", "DescribeHosts", "DescribeMacHosts", "DescribeReservedInstances", "DescribeReservedInstancesListings", "DescribeReservedInstancesModifications", "DescribeReservedInstancesOfferings", "DescribeScheduledInstanceAvailability", "DescribeScheduledInstances", "GetCapacityManagerAttributes", "GetCapacityManagerMetricData", "GetCapacityManagerMetricDimensions", "GetCapacityManagerMonitoredTagKeys", "GetCapacityReservationUsage", "GetGroupsForCapacityReservation", "GetHostReservationPurchasePreview", "GetReservedInstancesExchangeQuote"), "Read",
  EventName in ("AssociateCapacityReservationBillingOwner", "ModifyCapacityReservation", "ModifyCapacityReservationFleet", "ModifyHosts", "ModifyReservedInstances", "UpdateCapacityManagerMonitoredTagKeys", "UpdateCapacityManagerOrganizationsAccess", "UpdateInterruptibleCapacityReservationAllocation"), "Set",
  "")
  | where isnotempty(EventType)
  | extend Object = case(
  EventName in ("DescribeCapacityBlockOfferings", "DescribeCapacityBlockStatus", "DescribeCapacityBlocks", "PurchaseCapacityBlock", "PurchaseCapacityBlockExtension"), "Capacity Block",
  EventName in ("DescribeCapacityBlockExtensionHistory"), "Capacity Block Extension History",
  EventName in ("DescribeCapacityBlockExtensionOfferings"), "Capacity Block Extension Offering",
  EventName in ("DisableCapacityManager", "EnableCapacityManager", "GetCapacityManagerAttributes", "GetCapacityManagerMetricData", "GetCapacityManagerMetricDimensions", "UpdateCapacityManagerOrganizationsAccess"), "Capacity Manager",
  EventName in ("DeleteCapacityManagerDataExport"), "Capacity Manager Configuration",
  EventName in ("DescribeCapacityManagerDataExports"), "Capacity Manager Data Exports",
  EventName in ("GetCapacityManagerMonitoredTagKeys", "UpdateCapacityManagerMonitoredTagKeys"), "Capacity Manager Monitored Tag Keys",
  EventName in ("AcceptCapacityReservationBillingOwnership", "AssociateCapacityReservationBillingOwner", "CancelCapacityReservation", "CancelCapacityReservationFleets", "CreateCapacityReservation", "CreateCapacityReservationBySplitting", "CreateInterruptibleCapacityReservationAllocation", "DescribeCapacityReservationBillingRequests", "DescribeCapacityReservationTopology", "DescribeCapacityReservations", "DisassociateCapacityReservationBillingOwner", "GetCapacityReservationUsage", "GetGroupsForCapacityReservation", "ModifyCapacityReservation", "MoveCapacityReservationInstances", "RejectCapacityReservationBillingOwnership", "UpdateInterruptibleCapacityReservationAllocation"), "Capacity Reservation",
  EventName in ("CreateCapacityReservationCancellationQuote", "DescribeCapacityReservationCancellationQuotes"), "Capacity Reservation Cancellation Quote",
  EventName in ("CreateCapacityReservationDateChangeQuote", "DescribeCapacityReservationDateChangeQuotes"), "Capacity Reservation Date Change Quote",
  EventName in ("CreateCapacityReservationFleet", "DescribeCapacityReservationFleets", "ModifyCapacityReservationFleet"), "Capacity Reservation Fleet",
  EventName in ("AcceptReservedInstancesExchangeQuote"), "Convertible Reserved Instance",
  EventName in ("AllocateHosts", "DescribeHosts", "DescribeMacHosts", "GetHostReservationPurchasePreview", "ModifyHosts", "PurchaseHostReservation", "ReleaseHosts"), "Dedicated Host",
  EventName in ("DescribeHostReservationOfferings", "DescribeHostReservations"), "Dedicated Host Reservation",
  EventName in ("CreateCapacityManagerDataExport"), "EC2 Capacity Manager Data Report",
  EventName in ("ConfirmProductInstance", "DescribeScheduledInstanceAvailability", "DescribeScheduledInstances", "RunScheduledInstances"), "EC2 Instance",
  EventName in ("DeleteQueuedReservedInstances", "DescribeReservedInstances", "GetReservedInstancesExchangeQuote", "ModifyReservedInstances", "PurchaseReservedInstancesOffering"), "Reserved Instance",
  EventName in ("CancelReservedInstancesListing", "CreateReservedInstancesListing", "DescribeReservedInstancesListings"), "Reserved Instance Listing",
  EventName in ("DescribeReservedInstancesModifications"), "Reserved Instance Modification",
  EventName in ("DescribeReservedInstancesOfferings"), "Reserved Instance Offering",
  EventName in ("PurchaseScheduledInstances"), "Scheduled Instance",
  "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
  EventName == "AllocateHosts", ResponseElements.hostIdSet,
  EventName == "AssociateCapacityReservationBillingOwner", RequestParameters.CapacityReservationId,
  EventName == "CancelCapacityReservationFleets", ResponseElements.successfulFleetCancellationSet,
  EventName in ("CancelReservedInstancesListing", "CreateReservedInstancesListing"),
  ResponseElements.reservedInstancesListingsSet,
  EventName == "ConfirmProductInstance", ResponseElements.ownerId,
  EventName == "CreateCapacityManagerDataExport", ResponseElements.capacityManagerDataExportId,
  EventName == "CreateCapacityReservation", ResponseElements.capacityReservation,
  EventName in ("CreateCapacityReservationBySplitting", "MoveCapacityReservationInstances"),
  ResponseElements.destinationCapacityReservation,
  EventName == "CreateCapacityReservationCancellationQuote",
  ResponseElements.capacityReservationCancellationQuote,
  EventName == "CreateCapacityReservationDateChangeQuote",
  ResponseElements.capacityReservationModificationQuote,
  EventName == "CreateCapacityReservationFleet", ResponseElements.state,
  EventName == "CreateInterruptibleCapacityReservationAllocation", ResponseElements.interruptionType,
  EventName == "EnableCapacityManager", ResponseElements.output,
  EventName == "ModifyReservedInstances", RequestParameters.ReservedInstancesConfigurationSetItemType.N,
  EventName == "PurchaseCapacityBlock", ResponseElements.capacityBlockSet,
  EventName == "PurchaseCapacityBlockExtension", ResponseElements.capacityBlockExtensionSet,
  EventName == "PurchaseReservedInstancesOffering", ResponseElements.reservedInstancesId,
  EventName == "PurchaseScheduledInstances", ResponseElements.scheduledInstanceSet,
  EventName == "RunScheduledInstances", ResponseElements.instanceIdSet,
  EventName == "UpdateCapacityManagerMonitoredTagKeys", ResponseElements.capacityManagerTagKeySet,
  EventName == "UpdateInterruptibleCapacityReservationAllocation", RequestParameters.TargetInstanceCount,
  parse_json('null')
  ), parse_json('null'))
  | extend ObjectId = case(
  EventName in ("AcceptCapacityReservationBillingOwnership", "AssociateCapacityReservationBillingOwner",
  "CancelCapacityReservation", "DescribeCapacityBlockExtensionHistory",
  "DescribeCapacityBlockExtensionOfferings", "DescribeCapacityReservationBillingRequests",
  "DescribeCapacityReservationTopology", "DescribeCapacityReservations",
  "DisassociateCapacityReservationBillingOwner", "GetGroupsForCapacityReservation",
  "ModifyCapacityReservation", "RejectCapacityReservationBillingOwnership"),
  RequestParameters.CapacityReservationId,
  EventName == "AcceptReservedInstancesExchangeQuote", ResponseElements.exchangeId,
  EventName == "AllocateHosts", ResponseElements.hostIdSet,
  EventName in ("CancelCapacityReservationFleets", "DescribeCapacityReservationFleets",
  "ModifyCapacityReservationFleet"), RequestParameters.CapacityReservationFleetId,
  EventName == "CancelReservedInstancesListing", RequestParameters.ReservedInstancesListingId,
  EventName == "ConfirmProductInstance", RequestParameters.InstanceId,
  EventName in ("CreateCapacityManagerDataExport", "DeleteCapacityManagerDataExport"),
  ResponseElements.capacityManagerDataExportId,
  EventName == "CreateCapacityReservation", ResponseElements.capacityReservation.capacityReservationId,
  EventName == "CreateCapacityReservationBySplitting",
  ResponseElements.destinationCapacityReservation.destinationCapacitySplittingId,
  EventName == "CreateCapacityReservationCancellationQuote",
  ResponseElements.capacityReservationCancellationQuote.capacityReservationCancellationQuoteId,
  EventName == "CreateCapacityReservationDateChangeQuote",
  ResponseElements.capacityReservationModificationQuote.capacityReservationModificationQuoteId,
  EventName == "CreateCapacityReservationFleet", ResponseElements.capacityReservationFleetId,
  EventName in ("CreateInterruptibleCapacityReservationAllocation",
  "UpdateInterruptibleCapacityReservationAllocation"), ResponseElements.sourceCapacityReservationId,
  EventName in ("CreateReservedInstancesListing", "DeleteQueuedReservedInstances",
  "DescribeReservedInstances", "DescribeReservedInstancesListings", "ModifyReservedInstances"),
  RequestParameters.ReservedInstancesId,
  EventName in ("DescribeCapacityBlockStatus", "DescribeCapacityBlocks"), RequestParameters.CapacityBlockId,
  EventName == "DescribeCapacityManagerDataExports", RequestParameters.CapacityManagerDataExportId,
  EventName in ("DescribeHostReservationOfferings", "GetHostReservationPurchasePreview"),
  RequestParameters.OfferingId,
  EventName == "DescribeHostReservations", RequestParameters.HostReservationIdSet,
  EventName in ("DescribeHosts", "DescribeMacHosts", "ModifyHosts", "ReleaseHosts"),
  RequestParameters.HostId,
  EventName == "DescribeReservedInstancesModifications", RequestParameters.ReservedInstancesModificationId,
  EventName in ("DescribeReservedInstancesOfferings", "PurchaseReservedInstancesOffering"),
  RequestParameters.ReservedInstancesOfferingId,
  EventName in ("DescribeScheduledInstances", "RunScheduledInstances"),
  RequestParameters.ScheduledInstanceId,
  EventName == "GetCapacityReservationUsage", ResponseElements.capacityReservationId,
  EventName == "GetReservedInstancesExchangeQuote", RequestParameters.ReservedInstanceId,
  EventName == "MoveCapacityReservationInstances", RequestParameters.SourceCapacityReservationId,
  EventName in ("PurchaseCapacityBlock", "PurchaseCapacityBlockExtension"),
  RequestParameters.CapacityBlockOfferingId,
  EventName == "PurchaseHostReservation", RequestParameters.HostIdSet,
  EventName == "PurchaseScheduledInstances", RequestParameters.PurchaseRequest,
  parse_json('null')
  )
  | extend
  Type = "AWSCloudTrail",
  EventCount = int(1),
  EventStartTime = TimeGenerated,
  EventEndTime = TimeGenerated,
  EventSeverity = "Informational",
  EventSchema = "AuditEvent",
  EventSchemaVersion = "1.0.0",
  EventVendor = "AWS",
  EventProduct = "CloudTrail",
  Dvc = "CloudTrail",
  EventMessage = ErrorMessage,
  ObjectType = "Cloud Resource",
  TargetAppName = "Amazon Elastic Compute Cloud",
  TargetAppType = "Service",
  EventUid = tostring(AwsEventId)
  | project-rename
  EventOriginalSubType = EventTypeName,
  EventOriginalType = EventName,
  EventOriginalResultDetails = ErrorMessage,
  EventProductVersion = EventVersion,
  ActorUserId = UserIdentityAccountId,
  ActorUsername = UserIdentityUserName,
  ActorOriginalUserType = UserIdentityType,
  HttpUserAgent = UserAgent
  | extend
  ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
  ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
  SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
  ActingApplicationEntityKey = "",
  ActorUserAdditionalIds = parse_json('[]'),
  ActorUserEntityKey = "",
  AdditionalEntities = parse_json('[]'),
  DvcEntityKey = "",
  SrcSystemEntityKey = "",
  TargetApplicationEntityKey = "",
  TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
  "ActorAccessKeyId", UserIdentityAccessKeyId,
  "AWSRegion", AWSRegion,
  "APIVersion", APIVersion,
  "ManagementEvent", ManagementEvent,
  "ReadOnly", ReadOnly,
  "RequestParameters", RequestParameters,
  "ResponseElements", ResponseElements
  )
  | extend
  Operation = EventOriginalType,
  User = ActorUsername,
  IpAddr = SrcIpAddr,
  Application = TargetAppName,
  Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
  TimeGenerated,
  Type,
  EventCount,
  EventStartTime,
  EventEndTime,
  EventSeverity,
  EventSchemaVersion,
  EventVendor,
  EventProduct,
  EventResult,
  EventMessage,
  TargetAppName,
  EventOriginalSubType,
  EventOriginalType,
  EventOriginalUid,
  EventOriginalResultDetails,
  EventProductVersion,
  ActorUserId,
  ActorUsername,
  ActorOriginalUserType,
  HttpUserAgent,
  ActorUserIdType,
  ActorUsernameType,
  SrcIpAddr,
  AdditionalFields,
  EventType,
  NewValue,
  ObjectId,
  ObjectType,
  Object,
  TargetAppType,
  Operation,
  ActingApplicationEntityKey,
  ActorUserAdditionalIds,
  ActorUserEntityKey,
  AdditionalEntities,
  DvcEntityKey,
  SrcSystemEntityKey,
  TargetApplicationEntityKey,
  TargetSystemEntityKey
