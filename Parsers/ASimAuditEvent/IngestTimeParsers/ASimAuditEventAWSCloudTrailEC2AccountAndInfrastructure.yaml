Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 AccountAndInfrastructure activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 AccountAndInfrastructure activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2AccountAndInfrastructure'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateCarrierGateway", "CreateCoipCidr", "CreateCoipPool", "CreateLocalGatewayRoute", "CreateLocalGatewayRouteTable", "CreateLocalGatewayRouteTableVirtualInterfaceGroupAssociation", "CreateLocalGatewayRouteTableVpcAssociation", "CreateLocalGatewayVirtualInterface", "CreateLocalGatewayVirtualInterfaceGroup", "CreateManagedPrefixList", "CreateSecondaryNetwork", "CreateSecondarySubnet", "CreateTags"), "Create",
  EventName in ("CancelDeclarativePoliciesReport", "DeleteCarrierGateway", "DeleteCoipPool", "DeleteLocalGatewayRouteTable", "DeleteLocalGatewayRouteTableVirtualInterfaceGroupAssociation", "DeleteLocalGatewayRouteTableVpcAssociation", "DeleteLocalGatewayVirtualInterface", "DeleteLocalGatewayVirtualInterfaceGroup", "DeleteManagedPrefixList", "DeleteSecondaryNetwork", "DeleteSecondarySubnet", "DeleteTags", "DeregisterInstanceEventNotificationAttributes"), "Delete",
  EventName in ("DisableAwsNetworkPerformanceMetricSubscription"), "Disable",
  EventName in ("EnableAwsNetworkPerformanceMetricSubscription"), "Enable",
  EventName in ("DescribeAccountAttributes", "DescribeAggregateIdFormat", "DescribeAvailabilityZones", "DescribeAwsNetworkPerformanceMetricSubscriptions", "DescribeCarrierGateways", "DescribeCoipPools", "DescribeDeclarativePoliciesReports", "DescribeElasticGpus", "DescribeIdFormat", "DescribeIdentityIdFormat", "DescribeInstanceTopology", "DescribeInstanceTypeOfferings", "DescribeInstanceTypes", "DescribeLocalGatewayRouteTableVirtualInterfaceGroupAssociations", "DescribeLocalGatewayRouteTableVpcAssociations", "DescribeLocalGatewayRouteTables", "DescribeLocalGatewayVirtualInterfaceGroups", "DescribeLocalGatewayVirtualInterfaces", "DescribeLocalGateways", "DescribeManagedPrefixLists", "DescribeOutpostLags", "DescribePrefixLists", "DescribePrincipalIdFormat", "DescribeRegions", "DescribeSecondaryInterfaces", "DescribeSecondaryNetworks", "DescribeSecondarySubnets", "DescribeServiceLinkVirtualInterfaces", "DescribeTags", "GetAwsNetworkPerformanceData", "GetCoipPoolUsage", "GetDeclarativePoliciesReportSummary", "GetInstanceTypesFromInstanceRequirements", "GetManagedPrefixListAssociations", "GetManagedPrefixListEntries", "GetManagedResourceVisibility", "SearchLocalGatewayRoutes"), "Read",
  EventName in ("DeleteCoipCidr", "DeleteLocalGatewayRoute", "ModifyAvailabilityZoneGroup", "ModifyIdFormat", "ModifyIdentityIdFormat", "ModifyLocalGatewayRoute", "ModifyManagedPrefixList", "ModifyManagedResourceVisibility", "RestoreManagedPrefixListVersion"), "Set",
  EventName in ("StartDeclarativePoliciesReport"), "Start",
  "")
  | where isnotempty(EventType)
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateCarrierGateway", "CreateCoipCidr", "CreateCoipPool", "CreateLocalGatewayRoute", "CreateLocalGatewayRouteTable", "CreateLocalGatewayRouteTableVirtualInterfaceGroupAssociation", "CreateLocalGatewayRouteTableVpcAssociation", "CreateLocalGatewayVirtualInterface", "CreateLocalGatewayVirtualInterfaceGroup", "CreateManagedPrefixList", "CreateSecondaryNetwork", "CreateSecondarySubnet", "CreateTags"), "Create",
  EventName in ("CancelDeclarativePoliciesReport", "DeleteCarrierGateway", "DeleteCoipPool", "DeleteLocalGatewayRouteTable", "DeleteLocalGatewayRouteTableVirtualInterfaceGroupAssociation", "DeleteLocalGatewayRouteTableVpcAssociation", "DeleteLocalGatewayVirtualInterface", "DeleteLocalGatewayVirtualInterfaceGroup", "DeleteManagedPrefixList", "DeleteSecondaryNetwork", "DeleteSecondarySubnet", "DeleteTags", "DeregisterInstanceEventNotificationAttributes"), "Delete",
  EventName in ("DisableAwsNetworkPerformanceMetricSubscription"), "Disable",
  EventName in ("EnableAwsNetworkPerformanceMetricSubscription"), "Enable",
  EventName in ("DescribeAccountAttributes", "DescribeAggregateIdFormat", "DescribeAvailabilityZones", "DescribeAwsNetworkPerformanceMetricSubscriptions", "DescribeCarrierGateways", "DescribeCoipPools", "DescribeDeclarativePoliciesReports", "DescribeElasticGpus", "DescribeIdFormat", "DescribeIdentityIdFormat", "DescribeInstanceTopology", "DescribeInstanceTypeOfferings", "DescribeInstanceTypes", "DescribeLocalGatewayRouteTableVirtualInterfaceGroupAssociations", "DescribeLocalGatewayRouteTableVpcAssociations", "DescribeLocalGatewayRouteTables", "DescribeLocalGatewayVirtualInterfaceGroups", "DescribeLocalGatewayVirtualInterfaces", "DescribeLocalGateways", "DescribeManagedPrefixLists", "DescribeOutpostLags", "DescribePrefixLists", "DescribePrincipalIdFormat", "DescribeRegions", "DescribeSecondaryInterfaces", "DescribeSecondaryNetworks", "DescribeSecondarySubnets", "DescribeServiceLinkVirtualInterfaces", "DescribeTags", "GetAwsNetworkPerformanceData", "GetCoipPoolUsage", "GetDeclarativePoliciesReportSummary", "GetInstanceTypesFromInstanceRequirements", "GetManagedPrefixListAssociations", "GetManagedPrefixListEntries", "GetManagedResourceVisibility", "SearchLocalGatewayRoutes"), "Read",
  EventName in ("DeleteCoipCidr", "DeleteLocalGatewayRoute", "ModifyAvailabilityZoneGroup", "ModifyIdFormat", "ModifyIdentityIdFormat", "ModifyLocalGatewayRoute", "ModifyManagedPrefixList", "ModifyManagedResourceVisibility", "RestoreManagedPrefixListVersion"), "Set",
  EventName in ("StartDeclarativePoliciesReport"), "Start",
  "")
  | where isnotempty(EventType)
  | extend Object = case(
  EventName in ("DescribeAccountAttributes"), "Account Attributes",
  EventName in ("CancelDeclarativePoliciesReport", "DescribeDeclarativePoliciesReports", "GetDeclarativePoliciesReportSummary"), "Account Status Report",
  EventName in ("ModifyAvailabilityZoneGroup"), "Availability Zone Group",
  EventName in ("DescribeAvailabilityZones"), "Availability Zones",
  EventName in ("CreateCarrierGateway", "DeleteCarrierGateway", "DescribeCarrierGateways"), "Carrier Gateway",
  EventName in ("CreateCoipCidr", "CreateCoipPool", "DeleteCoipCidr", "DeleteCoipPool", "DescribeCoipPools", "GetCoipPoolUsage"), "COIP Pool",
  EventName in ("DescribeInstanceTopology", "DescribeInstanceTypeOfferings", "DescribeInstanceTypes", "GetInstanceTypesFromInstanceRequirements"), "EC2 Instance",
  EventName in ("CreateTags", "DeleteTags", "DescribeAggregateIdFormat", "DescribeIdFormat", "DescribeIdentityIdFormat", "DescribePrincipalIdFormat", "DescribeRegions", "ModifyIdFormat", "ModifyIdentityIdFormat"), "EC2 Resources",
  EventName in ("DescribeTags"), "EC2 Tags",
  EventName in ("DescribeElasticGpus"), "Elastic Gpu",
  EventName in ("DescribeAwsNetworkPerformanceMetricSubscriptions"), "Infrastructure Performance Metric Subscriptions",
  EventName in ("DescribeOutpostLags"), "LAGs",
  EventName in ("DescribeLocalGateways"), "Local Gateway",
  EventName in ("CreateLocalGatewayRoute", "CreateLocalGatewayRouteTable", "DeleteLocalGatewayRoute", "DeleteLocalGatewayRouteTable", "DescribeLocalGatewayRouteTables", "ModifyLocalGatewayRoute", "SearchLocalGatewayRoutes"), "Local Gateway Route Table",
  EventName in ("CreateLocalGatewayRouteTableVirtualInterfaceGroupAssociation", "DeleteLocalGatewayRouteTableVirtualInterfaceGroupAssociation", "DescribeLocalGatewayRouteTableVirtualInterfaceGroupAssociations"), "Local Gateway Route Table Virtual Interface Group Association",
  EventName in ("CreateLocalGatewayRouteTableVpcAssociation", "DeleteLocalGatewayRouteTableVpcAssociation", "DescribeLocalGatewayRouteTableVpcAssociations"), "Local Gateway Route Table VPC Association",
  EventName in ("CreateLocalGatewayVirtualInterface", "DeleteLocalGatewayVirtualInterface", "DeleteLocalGatewayVirtualInterfaceGroup"), "Local Gateway Virtual Interface",
  EventName in ("CreateLocalGatewayVirtualInterfaceGroup", "DescribeLocalGatewayVirtualInterfaceGroups", "DescribeLocalGatewayVirtualInterfaces"), "Local Gateway Virtual Interface Group",
  EventName in ("DeleteManagedPrefixList", "GetManagedPrefixListAssociations", "GetManagedPrefixListEntries", "ModifyManagedPrefixList", "RestoreManagedPrefixListVersion"), "Managed Prefix List",
  EventName in ("GetManagedResourceVisibility", "ModifyManagedResourceVisibility"), "Managed Resource Visibility",
  EventName in ("DisableAwsNetworkPerformanceMetricSubscription", "EnableAwsNetworkPerformanceMetricSubscription"), "Metric Subscription",
  EventName in ("GetAwsNetworkPerformanceData"), "Network Performance Data",
  EventName in ("StartDeclarativePoliciesReport"), "Policies Report",
  EventName in ("CreateManagedPrefixList", "DescribeManagedPrefixLists", "DescribePrefixLists"), "Prefix List",
  EventName in ("DescribeSecondaryInterfaces"), "Secondary Interface",
  EventName in ("CreateSecondaryNetwork", "DeleteSecondaryNetwork", "DescribeSecondaryNetworks"), "Secondary Network",
  EventName in ("CreateSecondarySubnet", "DeleteSecondarySubnet", "DescribeSecondarySubnets"), "Secondary Subnet",
  EventName in ("DescribeServiceLinkVirtualInterfaces"), "Service Link Virtual Interface",
  EventName in ("DeregisterInstanceEventNotificationAttributes"), "Tag Key",
  "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
  EventName == "CreateCarrierGateway", ResponseElements.carrierGateway,
  EventName in ("CreateCoipCidr", "DeleteCoipCidr"), ResponseElements.coipCidr,
  EventName == "CreateCoipPool", ResponseElements.coipPool,
  EventName in ("CreateLocalGatewayRoute", "DeleteLocalGatewayRoute"), ResponseElements.route,
  EventName == "CreateLocalGatewayRouteTable", ResponseElements.localGatewayRouteTable,
  EventName == "CreateLocalGatewayRouteTableVirtualInterfaceGroupAssociation",
  ResponseElements.localGatewayRouteTableVirtualInterfaceGroupAssociation,
  EventName == "CreateLocalGatewayRouteTableVpcAssociation",
  ResponseElements.localGatewayRouteTableVpcAssociation,
  EventName == "CreateLocalGatewayVirtualInterface", ResponseElements.localGatewayVirtualInterface,
  EventName == "CreateLocalGatewayVirtualInterfaceGroup",
  ResponseElements.localGatewayVirtualInterfaceGroup,
  EventName in ("CreateManagedPrefixList", "RestoreManagedPrefixListVersion"), ResponseElements.prefixList,
  EventName == "CreateSecondaryNetwork", ResponseElements.secondaryNetwork,
  EventName == "CreateSecondarySubnet", ResponseElements.secondarySubnet,
  EventName == "CreateTags", RequestParameters.tagSet.items,
  EventName == "EnableAwsNetworkPerformanceMetricSubscription", RequestParameters.Source,
  EventName == "ModifyManagedResourceVisibility", ResponseElements.visibility,
  parse_json('null')
  ), parse_json('null'))
  | extend ObjectId = case(
  EventName in ("CancelDeclarativePoliciesReport", "DescribeDeclarativePoliciesReports"),
  RequestParameters.ReportId,
  EventName == "CreateCarrierGateway", ResponseElements.carrierGateway.carrierGatewayId,
  EventName in ("CreateCoipCidr", "DeleteCoipCidr", "DeleteCoipPool"), RequestParameters.CoipPoolId,
  EventName == "CreateCoipPool", ResponseElements.coipPool.poolId,
  EventName == "CreateLocalGatewayRoute", ResponseElements.route.localGatewayRouteTableId,
  EventName == "CreateLocalGatewayRouteTable",
  ResponseElements.localGatewayRouteTable.localGatewayRouteTableId,
  EventName == "CreateLocalGatewayRouteTableVirtualInterfaceGroupAssociation",
  ResponseElements.localGatewayRouteTableVirtualInterfaceGroupAssociation.localGatewayRouteTableVirtualInterfaceGroupAssociationId,
  EventName == "CreateLocalGatewayRouteTableVpcAssociation",
  ResponseElements.localGatewayRouteTableVpcAssociation.localGatewayRouteTableVpcAssociationId,
  EventName == "CreateLocalGatewayVirtualInterface",
  ResponseElements.localGatewayVirtualInterface.localGatewayVirtualInterfaceId,
  EventName == "CreateLocalGatewayVirtualInterfaceGroup",
  ResponseElements.localGatewayVirtualInterfaceGroup.localGatewayVirtualInterfaceGroupId,
  EventName == "CreateManagedPrefixList", ResponseElements.prefixList.prefixListId,
  EventName == "CreateSecondaryNetwork", ResponseElements.secondaryNetwork.secondaryNetworkId,
  EventName == "CreateSecondarySubnet", ResponseElements.secondarySubnet.secondarySubnetId,
  EventName == "CreateTags", RequestParameters.resourcesSet.items,
  EventName in ("DeleteCarrierGateway", "DescribeCarrierGateways"), RequestParameters.CarrierGatewayId,
  EventName in ("DeleteLocalGatewayRoute", "DeleteLocalGatewayRouteTable",
  "DescribeLocalGatewayRouteTables", "ModifyLocalGatewayRoute", "SearchLocalGatewayRoutes"),
  RequestParameters.LocalGatewayRouteTableId,
  EventName in ("DeleteLocalGatewayRouteTableVirtualInterfaceGroupAssociation",
  "DescribeLocalGatewayRouteTableVirtualInterfaceGroupAssociations"),
  RequestParameters.LocalGatewayRouteTableVirtualInterfaceGroupAssociationId,
  EventName in ("DeleteLocalGatewayRouteTableVpcAssociation",
  "DescribeLocalGatewayRouteTableVpcAssociations"),
  RequestParameters.LocalGatewayRouteTableVpcAssociationId,
  EventName in ("DeleteLocalGatewayVirtualInterface", "DescribeLocalGatewayVirtualInterfaces"),
  RequestParameters.LocalGatewayVirtualInterfaceId,
  EventName in ("DeleteLocalGatewayVirtualInterfaceGroup", "DescribeLocalGatewayVirtualInterfaceGroups"),
  RequestParameters.LocalGatewayVirtualInterfaceGroupId,
  EventName in ("DeleteManagedPrefixList", "DescribeManagedPrefixLists", "DescribePrefixLists",
  "GetManagedPrefixListAssociations", "GetManagedPrefixListEntries", "ModifyManagedPrefixList",
  "RestoreManagedPrefixListVersion"), RequestParameters.PrefixListId,
  EventName in ("DeleteSecondaryNetwork", "DescribeSecondaryNetworks"),
  RequestParameters.SecondaryNetworkId,
  EventName == "DeleteSecondarySubnet", RequestParameters.SecondarySubnetId,
  EventName == "DeleteTags", RequestParameters.ResourceId,
  EventName == "DeregisterInstanceEventNotificationAttributes",
  ResponseElements.instanceTagAttribute.instanceTagKeySet,
  EventName == "DescribeAccountAttributes", RequestParameters.AttributeName,
  EventName == "DescribeAggregateIdFormat", ResponseElements.statusSet,
  EventName == "DescribeAvailabilityZones", ResponseElements.availabilityZoneInfo,
  EventName == "DescribeAwsNetworkPerformanceMetricSubscriptions", ResponseElements.subscriptionSet,
  EventName in ("DescribeCoipPools", "GetCoipPoolUsage"), RequestParameters.PoolId,
  EventName == "DescribeElasticGpus", RequestParameters.ElasticGpuId,
  EventName == "DescribeInstanceTopology", RequestParameters.InstanceId.N,
  EventName == "DescribeLocalGateways", RequestParameters.LocalGatewayId,
  EventName == "DescribeOutpostLags", RequestParameters.OutpostLagId,
  EventName == "DescribeSecondaryInterfaces", RequestParameters.SecondaryInterfaceId,
  EventName == "DescribeServiceLinkVirtualInterfaces", RequestParameters.ServiceLinkVirtualInterfaceId,
  EventName in ("GetDeclarativePoliciesReportSummary", "StartDeclarativePoliciesReport"),
  ResponseElements.reportId,
  EventName == "ModifyAvailabilityZoneGroup", RequestParameters.GroupName,
  parse_json('null')
  )
  | extend
  Type = "AWSCloudTrail",
  EventCount = int(1),
  EventStartTime = TimeGenerated,
  EventEndTime = TimeGenerated,
  EventSeverity = "Informational",
  EventSchema = "AuditEvent",
  EventSchemaVersion = "1.0.0",
  EventVendor = "AWS",
  EventProduct = "CloudTrail",
  Dvc = "CloudTrail",
  EventMessage = ErrorMessage,
  ObjectType = "Cloud Resource",
  TargetAppName = "Amazon Elastic Compute Cloud",
  TargetAppType = "Service",
  EventUid = tostring(AwsEventId)
  | project-rename
  EventOriginalSubType = EventTypeName,
  EventOriginalType = EventName,
  EventOriginalResultDetails = ErrorMessage,
  EventProductVersion = EventVersion,
  ActorUserId = UserIdentityAccountId,
  ActorUsername = UserIdentityUserName,
  ActorOriginalUserType = UserIdentityType,
  HttpUserAgent = UserAgent
  | extend
  ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
  ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
  SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
  ActingApplicationEntityKey = "",
  ActorUserAdditionalIds = parse_json('[]'),
  ActorUserEntityKey = "",
  AdditionalEntities = parse_json('[]'),
  DvcEntityKey = "",
  SrcSystemEntityKey = "",
  TargetApplicationEntityKey = "",
  TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
  "ActorAccessKeyId", UserIdentityAccessKeyId,
  "AWSRegion", AWSRegion,
  "APIVersion", APIVersion,
  "ManagementEvent", ManagementEvent,
  "ReadOnly", ReadOnly,
  "RequestParameters", RequestParameters,
  "ResponseElements", ResponseElements
  )
  | extend
  Operation = EventOriginalType,
  User = ActorUsername,
  IpAddr = SrcIpAddr,
  Application = TargetAppName,
  Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
  TimeGenerated,
  Type,
  EventCount,
  EventStartTime,
  EventEndTime,
  EventSeverity,
  EventSchemaVersion,
  EventVendor,
  EventProduct,
  EventResult,
  EventMessage,
  TargetAppName,
  EventOriginalSubType,
  EventOriginalType,
  EventOriginalUid,
  EventOriginalResultDetails,
  EventProductVersion,
  ActorUserId,
  ActorUsername,
  ActorOriginalUserType,
  HttpUserAgent,
  ActorUserIdType,
  ActorUsernameType,
  SrcIpAddr,
  AdditionalFields,
  EventType,
  NewValue,
  ObjectId,
  ObjectType,
  Object,
  TargetAppType,
  Operation,
  ActingApplicationEntityKey,
  ActorUserAdditionalIds,
  ActorUserEntityKey,
  AdditionalEntities,
  DvcEntityKey,
  SrcSystemEntityKey,
  TargetApplicationEntityKey,
  TargetSystemEntityKey
Change:
