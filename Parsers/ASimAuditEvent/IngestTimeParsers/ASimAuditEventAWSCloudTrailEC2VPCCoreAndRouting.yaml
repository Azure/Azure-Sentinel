Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 VPCCoreAndRouting activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 VPCCoreAndRouting activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2VPCCoreAndRouting'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateDefaultSubnet", "CreateDefaultVpc", "CreateDhcpOptions", "CreateEgressOnlyInternetGateway", "CreateInternetGateway", "CreateNatGateway", "CreateRoute", "CreateRouteServer", "CreateRouteServerEndpoint", "CreateRouteServerPeer", "CreateRouteTable", "CreateSubnet", "CreateSubnetCidrReservation", "CreateVpc", "CreateVpcPeeringConnection"), "Create",
  EventName in ("DeleteDhcpOptions", "DeleteEgressOnlyInternetGateway", "DeleteInternetGateway", "DeleteNatGateway", "DeleteRoute", "DeleteRouteServer", "DeleteRouteServerEndpoint", "DeleteRouteServerPeer", "DeleteRouteTable", "DeleteSubnet", "DeleteSubnetCidrReservation", "DeleteVpc", "DeleteVpcPeeringConnection", "UnassignPrivateNatGatewayAddress"), "Delete",
  EventName in ("DisableRouteServerPropagation", "DisableVgwRoutePropagation", "DisableVpcClassicLink", "DisableVpcClassicLinkDnsSupport"), "Disable",
  EventName in ("EnableRouteServerPropagation", "EnableVgwRoutePropagation", "EnableVpcClassicLink", "EnableVpcClassicLinkDnsSupport"), "Enable",
  EventName in ("AcceptVpcPeeringConnection", "RejectVpcPeeringConnection"), "Execute",
  EventName in ("DescribeClassicLinkInstances", "DescribeDhcpOptions", "DescribeEgressOnlyInternetGateways", "DescribeInternetGateways", "DescribeNatGateways", "DescribeRouteServerEndpoints", "DescribeRouteServerPeers", "DescribeRouteServers", "DescribeRouteTables", "DescribeSubnets", "DescribeVpcAttribute", "DescribeVpcClassicLink", "DescribeVpcClassicLinkDnsSupport", "DescribeVpcPeeringConnections", "DescribeVpcs", "GetRouteServerAssociations", "GetRouteServerPropagations", "GetRouteServerRoutingDatabase", "GetSubnetCidrReservations", "GetVpcResourcesBlockingEncryptionEnforcement"), "Read",
  EventName in ("AssignPrivateNatGatewayAddress", "AssociateDhcpOptions", "AssociateNatGatewayAddress", "AssociateRouteServer", "AssociateRouteTable", "AssociateSubnetCidrBlock", "AssociateVpcCidrBlock", "AttachClassicLinkVpc", "AttachInternetGateway", "DetachClassicLinkVpc", "DetachInternetGateway", "DisassociateNatGatewayAddress", "DisassociateRouteServer", "DisassociateRouteTable", "DisassociateSubnetCidrBlock", "DisassociateVpcCidrBlock", "ModifyRouteServer", "ModifySubnetAttribute", "ModifyVpcAttribute", "ModifyVpcPeeringConnectionOptions", "ModifyVpcTenancy", "ReplaceRoute", "ReplaceRouteTableAssociation"), "Set",
  "")
  | where isnotempty(EventType)
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateDefaultSubnet", "CreateDefaultVpc", "CreateDhcpOptions", "CreateEgressOnlyInternetGateway", "CreateInternetGateway", "CreateNatGateway", "CreateRoute", "CreateRouteServer", "CreateRouteServerEndpoint", "CreateRouteServerPeer", "CreateRouteTable", "CreateSubnet", "CreateSubnetCidrReservation", "CreateVpc", "CreateVpcPeeringConnection"), "Create",
  EventName in ("DeleteDhcpOptions", "DeleteEgressOnlyInternetGateway", "DeleteInternetGateway", "DeleteNatGateway", "DeleteRoute", "DeleteRouteServer", "DeleteRouteServerEndpoint", "DeleteRouteServerPeer", "DeleteRouteTable", "DeleteSubnet", "DeleteSubnetCidrReservation", "DeleteVpc", "DeleteVpcPeeringConnection", "UnassignPrivateNatGatewayAddress"), "Delete",
  EventName in ("DisableRouteServerPropagation", "DisableVgwRoutePropagation", "DisableVpcClassicLink", "DisableVpcClassicLinkDnsSupport"), "Disable",
  EventName in ("EnableRouteServerPropagation", "EnableVgwRoutePropagation", "EnableVpcClassicLink", "EnableVpcClassicLinkDnsSupport"), "Enable",
  EventName in ("AcceptVpcPeeringConnection", "RejectVpcPeeringConnection"), "Execute",
  EventName in ("DescribeClassicLinkInstances", "DescribeDhcpOptions", "DescribeEgressOnlyInternetGateways", "DescribeInternetGateways", "DescribeNatGateways", "DescribeRouteServerEndpoints", "DescribeRouteServerPeers", "DescribeRouteServers", "DescribeRouteTables", "DescribeSubnets", "DescribeVpcAttribute", "DescribeVpcClassicLink", "DescribeVpcClassicLinkDnsSupport", "DescribeVpcPeeringConnections", "DescribeVpcs", "GetRouteServerAssociations", "GetRouteServerPropagations", "GetRouteServerRoutingDatabase", "GetSubnetCidrReservations", "GetVpcResourcesBlockingEncryptionEnforcement"), "Read",
  EventName in ("AssignPrivateNatGatewayAddress", "AssociateDhcpOptions", "AssociateNatGatewayAddress", "AssociateRouteServer", "AssociateRouteTable", "AssociateSubnetCidrBlock", "AssociateVpcCidrBlock", "AttachClassicLinkVpc", "AttachInternetGateway", "DetachClassicLinkVpc", "DetachInternetGateway", "DisassociateNatGatewayAddress", "DisassociateRouteServer", "DisassociateRouteTable", "DisassociateSubnetCidrBlock", "DisassociateVpcCidrBlock", "ModifyRouteServer", "ModifySubnetAttribute", "ModifyVpcAttribute", "ModifyVpcPeeringConnectionOptions", "ModifyVpcTenancy", "ReplaceRoute", "ReplaceRouteTableAssociation"), "Set",
  "")
  | where isnotempty(EventType)
  | extend Object = case(
  EventName in ("CreateDhcpOptions"), "Dhcp Options",
  EventName in ("DeleteDhcpOptions", "DescribeDhcpOptions"), "DHCP Options",
  EventName in ("DescribeClassicLinkInstances"), "EC2 Classic Instances",
  EventName in ("CreateEgressOnlyInternetGateway", "DeleteEgressOnlyInternetGateway", "DescribeEgressOnlyInternetGateways"), "Egress-only Internet Gateway",
  EventName in ("CreateInternetGateway", "DeleteInternetGateway", "DescribeInternetGateways"), "Internet Gateway",
  EventName in ("AssignPrivateNatGatewayAddress", "AssociateNatGatewayAddress", "CreateNatGateway", "DeleteNatGateway", "DescribeNatGateways", "DisassociateNatGatewayAddress"), "NAT Gateway",
  EventName in ("UnassignPrivateNatGatewayAddress"), "NAT Gateway Address",
  EventName in ("CreateRouteServer", "DeleteRouteServer", "EnableRouteServerPropagation", "GetRouteServerAssociations", "GetRouteServerPropagations", "GetRouteServerRoutingDatabase", "ModifyRouteServer"), "Route Server",
  EventName in ("CreateRouteServerEndpoint", "DeleteRouteServerEndpoint", "DescribeRouteServerEndpoints"), "Route Server Endpoint",
  EventName in ("CreateRouteServerPeer", "DeleteRouteServerPeer", "DescribeRouteServerPeers"), "Route Server Peer",
  EventName in ("DescribeRouteServers"), "Route Sever",
  EventName in ("CreateRoute", "CreateRouteTable", "DeleteRoute", "DeleteRouteTable", "DescribeRouteTables", "DisableRouteServerPropagation", "DisassociateRouteTable"), "Route Table",
  EventName in ("AssociateSubnetCidrBlock", "CreateDefaultSubnet", "CreateSubnet", "DeleteSubnet", "DescribeSubnets", "DisassociateSubnetCidrBlock", "GetSubnetCidrReservations", "ModifySubnetAttribute", "ReplaceRouteTableAssociation"), "Subnet",
  EventName in ("CreateSubnetCidrReservation", "DeleteSubnetCidrReservation"), "Subnet CIDR Reservation",
  EventName in ("DisableVgwRoutePropagation", "EnableVgwRoutePropagation"), "Virtual Private Gateway",
  EventName in ("AcceptVpcPeeringConnection", "AssociateDhcpOptions", "AssociateRouteServer", "AssociateVpcCidrBlock", "AttachClassicLinkVpc", "AttachInternetGateway", "CreateDefaultVpc", "CreateVpc", "DeleteVpc", "DescribeVpcAttribute", "DescribeVpcs", "DetachClassicLinkVpc", "DetachInternetGateway", "DisassociateRouteServer", "DisassociateVpcCidrBlock", "GetVpcResourcesBlockingEncryptionEnforcement", "ModifyVpcAttribute", "ModifyVpcTenancy", "RejectVpcPeeringConnection"), "VPC",
  EventName in ("DescribeVpcClassicLink", "DescribeVpcClassicLinkDnsSupport", "DisableVpcClassicLink", "DisableVpcClassicLinkDnsSupport", "EnableVpcClassicLink", "EnableVpcClassicLinkDnsSupport"), "VPC Classic Link",
  EventName in ("ReplaceRoute"), "VPC Endpoint",
  EventName in ("CreateVpcPeeringConnection", "DeleteVpcPeeringConnection", "DescribeVpcPeeringConnections", "ModifyVpcPeeringConnectionOptions"), "VPC Peering Connection",
  EventName in ("AssociateRouteTable"), "VPC Route Table",
  "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
  EventName in ("AcceptVpcPeeringConnection", "CreateVpcPeeringConnection"),
  ResponseElements.vpcPeeringConnection,
  EventName == "AssignPrivateNatGatewayAddress", RequestParameters.PrivateIpAddress,
  EventName == "AssociateDhcpOptions", RequestParameters.DhcpOptionsId,
  EventName == "AssociateNatGatewayAddress", ResponseElements.natGatewayAddressSet,
  EventName == "AssociateRouteServer", ResponseElements.routeServerAssociation,
  EventName == "AssociateRouteTable", ResponseElements.associationId,
  EventName == "AssociateSubnetCidrBlock", ResponseElements.ipv6CidrBlockAssociation,
  EventName == "AssociateVpcCidrBlock",
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
  iff(isnotnull(ResponseElements.cidrBlockAssociation), ResponseElements.cidrBlockAssociation, ResponseElements.ipv6CidrBlockAssociation),
  EventName == "AttachClassicLinkVpc", RequestParameters.InstanceId,
  EventName == "AttachInternetGateway", RequestParameters.InternetGatewayId,
  EventName in ("CreateDefaultSubnet", "CreateSubnet"), ResponseElements.subnet,
  EventName in ("CreateDefaultVpc", "CreateVpc"), ResponseElements.vpc,
  EventName == "CreateDhcpOptions", ResponseElements.dhcpOptions,
  EventName == "CreateEgressOnlyInternetGateway", ResponseElements.egressOnlyInternetGateway,
  EventName == "CreateInternetGateway", ResponseElements.internetGateway,
  EventName == "CreateNatGateway", ResponseElements.natGateway,
  EventName in ("CreateRouteServer", "ModifyRouteServer"), ResponseElements.routeServer,
  EventName == "CreateRouteServerEndpoint", ResponseElements.routeServerEndpoint,
  EventName == "CreateRouteServerPeer", ResponseElements.routeServerPeer,
  EventName == "CreateRouteTable", ResponseElements.routeTable,
  EventName == "CreateSubnetCidrReservation", ResponseElements.subnetCidrReservation,
  EventName == "EnableRouteServerPropagation", ResponseElements.routeServerPropagation,
  EventName == "ModifyVpcPeeringConnectionOptions", RequestParameters.RequesterPeeringConnectionOptions,
  EventName == "ModifyVpcTenancy", RequestParameters.InstanceTenancy,
  EventName == "ReplaceRouteTableAssociation", ResponseElements.newAssociationId,
  parse_json('null')
  ), parse_json('null'))
  | extend ObjectId = case(
  EventName in ("AcceptVpcPeeringConnection", "CreateVpcPeeringConnection"),
  ResponseElements.vpcPeeringConnection.vpcPeeringConnectionId,
  EventName in ("AssignPrivateNatGatewayAddress", "DeleteNatGateway", "DescribeNatGateways",
  "UnassignPrivateNatGatewayAddress"), RequestParameters.NatGatewayId,
  EventName in ("AssociateDhcpOptions", "AssociateVpcCidrBlock", "AttachClassicLinkVpc",
  "AttachInternetGateway", "DeleteVpc", "DescribeVpcClassicLink", "DescribeVpcs", "DetachClassicLinkVpc",
  "DetachInternetGateway", "DisableVpcClassicLink", "DisableVpcClassicLinkDnsSupport",
  "DisassociateRouteServer", "EnableVpcClassicLink", "EnableVpcClassicLinkDnsSupport",
  "GetVpcResourcesBlockingEncryptionEnforcement", "ModifyVpcAttribute", "ModifyVpcTenancy"),
  RequestParameters.VpcId,
  EventName in ("AssociateNatGatewayAddress", "DisassociateNatGatewayAddress"),
  ResponseElements.natGatewayId,
  EventName in ("AssociateRouteServer", "DeleteRouteServer", "DescribeRouteServers",
  "EnableRouteServerPropagation", "GetRouteServerAssociations", "GetRouteServerPropagations",
  "GetRouteServerRoutingDatabase", "ModifyRouteServer"), RequestParameters.RouteServerId,
  EventName == "AssociateRouteTable", ResponseElements.associationId,
  EventName in ("AssociateSubnetCidrBlock", "DisassociateSubnetCidrBlock"), ResponseElements.subnetId,
  EventName in ("CreateDefaultSubnet", "CreateSubnet"), ResponseElements.subnet.subnetId,
  EventName in ("CreateDefaultVpc", "CreateVpc"), ResponseElements.vpc.vpcId,
  EventName == "CreateDhcpOptions", ResponseElements.dhcpOptions.dhcpOptionsId,
  EventName == "CreateEgressOnlyInternetGateway", ResponseElements.egressOnlyInternetGateway.vpcId,
  EventName == "CreateInternetGateway", ResponseElements.internetGateway.internetGatewayId,
  EventName == "CreateNatGateway", ResponseElements.natGateway.natGatewayId,
  EventName in ("CreateRoute", "DeleteRoute", "DeleteRouteTable", "DescribeRouteTables",
  "DisableRouteServerPropagation", "ReplaceRouteTableAssociation"), RequestParameters.RouteTableId,
  EventName == "CreateRouteServer", ResponseElements.routeServer.routeServerId,
  EventName == "CreateRouteServerEndpoint", ResponseElements.routeServerEndpoint.routeServerEndpointId,
  EventName == "CreateRouteServerPeer", ResponseElements.routeServerPeer.routeServerPeerId,
  EventName == "CreateRouteTable", ResponseElements.routeTable.routeTableId,
  EventName == "CreateSubnetCidrReservation",
  ResponseElements.subnetCidrReservation.subnetCidrReservationId,
  EventName in ("DeleteDhcpOptions", "DescribeDhcpOptions"), RequestParameters.DhcpOptionsId,
  EventName in ("DeleteEgressOnlyInternetGateway", "DescribeEgressOnlyInternetGateways"),
  RequestParameters.EgressOnlyInternetGatewayId,
  EventName in ("DeleteInternetGateway", "DescribeInternetGateways"), RequestParameters.InternetGatewayId,
  EventName in ("DeleteRouteServerEndpoint", "DescribeRouteServerEndpoints"),
  RequestParameters.RouteServerEndpointId,
  EventName in ("DeleteRouteServerPeer", "DescribeRouteServerPeers"), RequestParameters.RouteServerPeerId,
  EventName in ("DeleteSubnet", "DescribeSubnets", "GetSubnetCidrReservations", "ModifySubnetAttribute"),
  RequestParameters.SubnetId,
  EventName == "DeleteSubnetCidrReservation", RequestParameters.SubnetCidrReservationId,
  EventName in ("DeleteVpcPeeringConnection", "DescribeVpcPeeringConnections",
  "ModifyVpcPeeringConnectionOptions", "RejectVpcPeeringConnection"),
  RequestParameters.VpcPeeringConnectionId,
  EventName == "DescribeClassicLinkInstances", RequestParameters.InstanceId,
  EventName in ("DescribeVpcAttribute", "DisassociateVpcCidrBlock"), ResponseElements.vpcId,
  EventName == "DescribeVpcClassicLinkDnsSupport", RequestParameters.VpcIds,
  EventName in ("DisableVgwRoutePropagation", "EnableVgwRoutePropagation"), RequestParameters.GatewayId,
  EventName == "DisassociateRouteTable", RequestParameters.AssociationId,
  EventName == "ReplaceRoute", RequestParameters.VpcEndpointId,
  parse_json('null')
  )
  | extend
  Type = "AWSCloudTrail",
  EventCount = int(1),
  EventStartTime = TimeGenerated,
  EventEndTime = TimeGenerated,
  EventSeverity = "Informational",
  EventSchema = "AuditEvent",
  EventSchemaVersion = "1.0.0",
  EventVendor = "AWS",
  EventProduct = "CloudTrail",
  Dvc = "CloudTrail",
  EventMessage = ErrorMessage,
  ObjectType = "Cloud Resource",
  TargetAppName = "Amazon Elastic Compute Cloud",
  TargetAppType = "Service",
  EventUid = tostring(AwsEventId)
  | project-rename
  EventOriginalSubType = EventTypeName,
  EventOriginalType = EventName,
  EventOriginalResultDetails = ErrorMessage,
  EventProductVersion = EventVersion,
  ActorUserId = UserIdentityAccountId,
  ActorUsername = UserIdentityUserName,
  ActorOriginalUserType = UserIdentityType,
  HttpUserAgent = UserAgent
  | extend
  ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
  ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
  SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
  ActingApplicationEntityKey = "",
  ActorUserAdditionalIds = parse_json('[]'),
  ActorUserEntityKey = "",
  AdditionalEntities = parse_json('[]'),
  DvcEntityKey = "",
  SrcSystemEntityKey = "",
  TargetApplicationEntityKey = "",
  TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
  "ActorAccessKeyId", UserIdentityAccessKeyId,
  "AWSRegion", AWSRegion,
  "APIVersion", APIVersion,
  "ManagementEvent", ManagementEvent,
  "ReadOnly", ReadOnly,
  "RequestParameters", RequestParameters,
  "ResponseElements", ResponseElements
  )
  | extend
  Operation = EventOriginalType,
  User = ActorUsername,
  IpAddr = SrcIpAddr,
  Application = TargetAppName,
  Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
  TimeGenerated,
  Type,
  EventCount,
  EventStartTime,
  EventEndTime,
  EventSeverity,
  EventSchemaVersion,
  EventVendor,
  EventProduct,
  EventResult,
  EventMessage,
  TargetAppName,
  EventOriginalSubType,
  EventOriginalType,
  EventOriginalUid,
  EventOriginalResultDetails,
  EventProductVersion,
  ActorUserId,
  ActorUsername,
  ActorOriginalUserType,
  HttpUserAgent,
  ActorUserIdType,
  ActorUsernameType,
  SrcIpAddr,
  AdditionalFields,
  EventType,
  NewValue,
  ObjectId,
  ObjectType,
  Object,
  TargetAppType,
  Operation,
  ActingApplicationEntityKey,
  ActorUserAdditionalIds,
  ActorUserEntityKey,
  AdditionalEntities,
  DvcEntityKey,
  SrcSystemEntityKey,
  TargetApplicationEntityKey,
  TargetSystemEntityKey
Change:
