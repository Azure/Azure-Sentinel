Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 IPAM activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 IPAM activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2IPAM'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("AllocateIpamPoolCidr", "CreateIpam", "CreateIpamExternalResourceVerificationToken", "CreateIpamPolicy", "CreateIpamPool", "CreateIpamPrefixListResolver", "CreateIpamPrefixListResolverTarget", "CreateIpamResourceDiscovery", "CreateIpamScope", "CreatePublicIpv4Pool"), "Create",
  EventName in ("DeleteIpam", "DeleteIpamExternalResourceVerificationToken", "DeleteIpamPolicy", "DeleteIpamPool", "DeleteIpamPrefixListResolver", "DeleteIpamPrefixListResolverTarget", "DeleteIpamResourceDiscovery", "DeleteIpamScope", "DeletePublicIpv4Pool", "DisassociateIpamResourceDiscovery", "ReleaseIpamPoolAllocation", "WithdrawByoipCidr"), "Delete",
  EventName in ("DisableIpamOrganizationAdminAccount", "DisableIpamPolicy"), "Disable",
  EventName in ("EnableIpamOrganizationAdminAccount", "EnableIpamPolicy"), "Enable",
  EventName in ("AdvertiseByoipCidr", "DeprovisionByoipCidr", "DeprovisionIpamByoasn", "DeprovisionIpamPoolCidr", "DeprovisionPublicIpv4PoolCidr", "MoveByoipCidrToIpam", "ProvisionByoipCidr", "ProvisionIpamByoasn", "ProvisionIpamPoolCidr", "ProvisionPublicIpv4PoolCidr"), "Execute",
  EventName in ("DescribeByoipCidrs", "DescribeIpamByoasn", "DescribeIpamExternalResourceVerificationTokens", "DescribeIpamPolicies", "DescribeIpamPoolAllocations", "DescribeIpamPools", "DescribeIpamPrefixListResolverTargets", "DescribeIpamPrefixListResolvers", "DescribeIpamResourceDiscoveries", "DescribeIpamResourceDiscoveryAssociations", "DescribeIpamScopes", "DescribeIpams", "DescribeIpv6Pools", "DescribePublicIpv4Pools", "GetAssociatedIpv6PoolCidrs", "GetEnabledIpamPolicy", "GetIpamAddressHistory", "GetIpamDiscoveredAccounts", "GetIpamDiscoveredPublicAddresses", "GetIpamDiscoveredResourceCidrs", "GetIpamPolicyAllocationRules", "GetIpamPolicyOrganizationTargets", "GetIpamPoolAllocations", "GetIpamPoolCidrs", "GetIpamPrefixListResolverRules", "GetIpamPrefixListResolverVersionEntries", "GetIpamPrefixListResolverVersions", "GetIpamResourceCidrs"), "Read",
  EventName in ("AssociateIpamByoasn", "AssociateIpamResourceDiscovery", "DisassociateIpamByoasn", "ModifyIpam", "ModifyIpamPolicyAllocationRules", "ModifyIpamPool", "ModifyIpamPoolAllocation", "ModifyIpamPrefixListResolver", "ModifyIpamPrefixListResolverTarget", "ModifyIpamResourceCidr", "ModifyIpamResourceDiscovery", "ModifyIpamScope"), "Set",
  "")
  | where isnotempty(EventType)
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("AllocateIpamPoolCidr", "CreateIpam", "CreateIpamExternalResourceVerificationToken", "CreateIpamPolicy", "CreateIpamPool", "CreateIpamPrefixListResolver", "CreateIpamPrefixListResolverTarget", "CreateIpamResourceDiscovery", "CreateIpamScope", "CreatePublicIpv4Pool"), "Create",
  EventName in ("DeleteIpam", "DeleteIpamExternalResourceVerificationToken", "DeleteIpamPolicy", "DeleteIpamPool", "DeleteIpamPrefixListResolver", "DeleteIpamPrefixListResolverTarget", "DeleteIpamResourceDiscovery", "DeleteIpamScope", "DeletePublicIpv4Pool", "DisassociateIpamResourceDiscovery", "ReleaseIpamPoolAllocation", "WithdrawByoipCidr"), "Delete",
  EventName in ("DisableIpamOrganizationAdminAccount", "DisableIpamPolicy"), "Disable",
  EventName in ("EnableIpamOrganizationAdminAccount", "EnableIpamPolicy"), "Enable",
  EventName in ("AdvertiseByoipCidr", "DeprovisionByoipCidr", "DeprovisionIpamByoasn", "DeprovisionIpamPoolCidr", "DeprovisionPublicIpv4PoolCidr", "MoveByoipCidrToIpam", "ProvisionByoipCidr", "ProvisionIpamByoasn", "ProvisionIpamPoolCidr", "ProvisionPublicIpv4PoolCidr"), "Execute",
  EventName in ("DescribeByoipCidrs", "DescribeIpamByoasn", "DescribeIpamExternalResourceVerificationTokens", "DescribeIpamPolicies", "DescribeIpamPoolAllocations", "DescribeIpamPools", "DescribeIpamPrefixListResolverTargets", "DescribeIpamPrefixListResolvers", "DescribeIpamResourceDiscoveries", "DescribeIpamResourceDiscoveryAssociations", "DescribeIpamScopes", "DescribeIpams", "DescribeIpv6Pools", "DescribePublicIpv4Pools", "GetAssociatedIpv6PoolCidrs", "GetEnabledIpamPolicy", "GetIpamAddressHistory", "GetIpamDiscoveredAccounts", "GetIpamDiscoveredPublicAddresses", "GetIpamDiscoveredResourceCidrs", "GetIpamPolicyAllocationRules", "GetIpamPolicyOrganizationTargets", "GetIpamPoolAllocations", "GetIpamPoolCidrs", "GetIpamPrefixListResolverRules", "GetIpamPrefixListResolverVersionEntries", "GetIpamPrefixListResolverVersions", "GetIpamResourceCidrs"), "Read",
  EventName in ("AssociateIpamByoasn", "AssociateIpamResourceDiscovery", "DisassociateIpamByoasn", "ModifyIpam", "ModifyIpamPolicyAllocationRules", "ModifyIpamPool", "ModifyIpamPoolAllocation", "ModifyIpamPrefixListResolver", "ModifyIpamPrefixListResolverTarget", "ModifyIpamResourceCidr", "ModifyIpamResourceDiscovery", "ModifyIpamScope"), "Set",
  "")
  | where isnotempty(EventType)
  | extend Object = case(
  EventName in ("DescribeIpamByoasn", "DisassociateIpamByoasn", "ProvisionIpamByoasn"), "ASN",
  EventName in ("AdvertiseByoipCidr", "AssociateIpamByoasn", "DeprovisionByoipCidr", "DescribeByoipCidrs", "MoveByoipCidrToIpam", "WithdrawByoipCidr"), "BYOIP CIDR",
  EventName in ("ProvisionByoipCidr"), "Elastic IP address",
  EventName in ("CreateIpam", "DeleteIpam", "DeprovisionIpamByoasn", "DescribeIpams", "ModifyIpam"), "IPAM",
  EventName in ("DisableIpamOrganizationAdminAccount"), "IPAM Account",
  EventName in ("GetIpamDiscoveredAccounts", "GetIpamDiscoveredPublicAddresses", "GetIpamDiscoveredResourceCidrs"), "IPAM Discovery",
  EventName in ("CreateIpamPolicy", "DeleteIpamPolicy", "DescribeIpamPolicies", "DisableIpamPolicy", "EnableIpamPolicy", "GetEnabledIpamPolicy", "GetIpamPolicyAllocationRules", "GetIpamPolicyOrganizationTargets", "ModifyIpamPolicyAllocationRules"), "IPAM Policy",
  EventName in ("AllocateIpamPoolCidr", "CreateIpamPool", "DeleteIpamPool", "DeprovisionIpamPoolCidr", "DescribeIpamPools", "GetIpamPoolAllocations", "GetIpamPoolCidrs", "GetIpamResourceCidrs", "ModifyIpamPool", "ProvisionIpamPoolCidr"), "IPAM Pool",
  EventName in ("DescribeIpamPoolAllocations", "ModifyIpamPoolAllocation", "ReleaseIpamPoolAllocation"), "IPAM Pool Allocation",
  EventName in ("CreateIpamPrefixListResolver", "DeleteIpamPrefixListResolver", "DescribeIpamPrefixListResolvers", "GetIpamPrefixListResolverRules", "GetIpamPrefixListResolverVersionEntries", "GetIpamPrefixListResolverVersions", "ModifyIpamPrefixListResolver"), "IPAM Prefix List Resolver",
  EventName in ("CreateIpamPrefixListResolverTarget", "DeleteIpamPrefixListResolverTarget", "DescribeIpamPrefixListResolverTargets", "ModifyIpamPrefixListResolverTarget"), "IPAM Prefix List Resolver Target",
  EventName in ("ModifyIpamResourceCidr"), "IPAM Resource",
  EventName in ("CreateIpamResourceDiscovery", "DeleteIpamResourceDiscovery", "DescribeIpamResourceDiscoveries", "ModifyIpamResourceDiscovery"), "IPAM Resource Discovery",
  EventName in ("DisassociateIpamResourceDiscovery"), "IPAM Resource Discovery Assocation",
  EventName in ("DescribeIpamResourceDiscoveryAssociations"), "IPAM Resource Discovery Association",
  EventName in ("CreateIpamScope", "DeleteIpamScope", "DescribeIpamScopes", "GetIpamAddressHistory", "ModifyIpamScope"), "IPAM Scope",
  EventName in ("CreateIpamExternalResourceVerificationToken", "DeleteIpamExternalResourceVerificationToken", "DescribeIpamExternalResourceVerificationTokens"), "IPAM Verification Token",
  EventName in ("DescribeIpv6Pools", "GetAssociatedIpv6PoolCidrs"), "IPV6 Pool CIDR",
  EventName in ("CreatePublicIpv4Pool", "DeletePublicIpv4Pool", "DeprovisionPublicIpv4PoolCidr", "DescribePublicIpv4Pools", "ProvisionPublicIpv4PoolCidr"), "Public Ipv4 Pool",
  EventName in ("EnableIpamOrganizationAdminAccount"), "VPC",
  EventName in ("AssociateIpamResourceDiscovery"), "VPC IPAM",
  "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
  EventName == "AllocateIpamPoolCidr", RequestParameters.AllowedCidr,
  EventName == "AssociateIpamByoasn", ResponseElements.asnAssociation,
  EventName == "AssociateIpamResourceDiscovery", ResponseElements.ipamResourceDiscoveryAssociation,
  EventName in ("CreateIpam", "ModifyIpam"), ResponseElements.ipam,
  EventName == "CreateIpamExternalResourceVerificationToken",
  ResponseElements.ipamExternalResourceVerificationToken,
  EventName == "CreateIpamPolicy", ResponseElements.ipamPolicy,
  EventName == "CreateIpamPool", ResponseElements.ipamPool,
  EventName in ("CreateIpamPrefixListResolver", "ModifyIpamPrefixListResolver"),
  ResponseElements.ipamPrefixListResolver,
  EventName in ("CreateIpamPrefixListResolverTarget", "ModifyIpamPrefixListResolverTarget"),
  ResponseElements.ipamPrefixListResolverTarget,
  EventName in ("CreateIpamResourceDiscovery", "ModifyIpamResourceDiscovery"),
  ResponseElements.ipamResourceDiscovery,
  EventName in ("CreateIpamScope", "ModifyIpamScope"), ResponseElements.ipamScope,
  EventName in ("DeprovisionByoipCidr", "MoveByoipCidrToIpam", "ProvisionByoipCidr", "WithdrawByoipCidr"),
  ResponseElements.byoipCidr,
  EventName in ("DeprovisionIpamByoasn", "ProvisionIpamByoasn"), ResponseElements.byoasn,
  EventName in ("DeprovisionIpamPoolCidr", "ProvisionIpamPoolCidr"), ResponseElements.ipamPoolCidr,
  EventName == "DeprovisionPublicIpv4PoolCidr", ResponseElements.deprovisionedAddressSet,
  EventName == "EnableIpamOrganizationAdminAccount", ResponseElements.success,
  EventName == "ModifyIpamPolicyAllocationRules", ResponseElements.ipamPolicyDocument,
  EventName == "ModifyIpamPool", ResponseElements.ipamPoolId,
  EventName == "ModifyIpamPoolAllocation", ResponseElements.ipamPoolAllocation,
  EventName == "ModifyIpamResourceCidr", ResponseElements.ipamResourceCidr,
  EventName == "ProvisionPublicIpv4PoolCidr", ResponseElements.poolAddressRange,
  parse_json('null')
  ), parse_json('null'))
  | extend ObjectId = case(
  EventName == "AdvertiseByoipCidr", ResponseElements.byoipCidr.cidr,
  EventName == "AllocateIpamPoolCidr", ResponseElements.ipamPoolAllocation.ipamPoolAllocationId,
  EventName in ("AssociateIpamByoasn", "DisassociateIpamByoasn", "ProvisionIpamByoasn"),
  RequestParameters.Asn,
  EventName == "AssociateIpamResourceDiscovery",
  ResponseElements.ipamResourceDiscoveryAssociation.ipamResourceDiscoveryAssociationId,
  EventName == "CreateIpam", ResponseElements.ipam.ipamId,
  EventName == "CreateIpamExternalResourceVerificationToken",
  ResponseElements.ipamExternalResourceVerificationToken.ipamExternalResourceVerificationTokenId,
  EventName == "CreateIpamPolicy", ResponseElements.ipamPolicy.ipamPolicyId,
  EventName == "CreateIpamPool", ResponseElements.ipamPool.ipamPoolId,
  EventName == "CreateIpamPrefixListResolver",
  ResponseElements.ipamPrefixListResolver.ipamPrefixListResolverId,
  EventName == "CreateIpamPrefixListResolverTarget",
  ResponseElements.ipamPrefixListResolverTarget.ipamPrefixListResolverTargetId,
  EventName == "CreateIpamResourceDiscovery",
  ResponseElements.ipamResourceDiscovery.ipamResourceDiscoveryId,
  EventName == "CreateIpamScope", ResponseElements.ipamScope.ipamScopeId,
  EventName in ("CreatePublicIpv4Pool", "ProvisionPublicIpv4PoolCidr"), ResponseElements.poolId,
  EventName in ("DeleteIpam", "DeprovisionIpamByoasn", "DescribeIpams", "ModifyIpam"),
  RequestParameters.IpamId,
  EventName in ("DeleteIpamExternalResourceVerificationToken",
  "DescribeIpamExternalResourceVerificationTokens"),
  RequestParameters.IpamExternalResourceVerificationTokenId,
  EventName in ("DeleteIpamPolicy", "DescribeIpamPolicies", "DisableIpamPolicy", "EnableIpamPolicy",
  "GetIpamPolicyAllocationRules", "GetIpamPolicyOrganizationTargets", "ModifyIpamPolicyAllocationRules"),
  RequestParameters.IpamPolicyId,
  EventName in ("DeleteIpamPool", "DeprovisionIpamPoolCidr", "DescribeIpamPools", "GetIpamPoolAllocations",
  "GetIpamPoolCidrs", "GetIpamResourceCidrs", "ModifyIpamPool", "ProvisionIpamPoolCidr"),
  RequestParameters.IpamPoolId,
  EventName in ("DeleteIpamPrefixListResolver", "DescribeIpamPrefixListResolvers",
  "GetIpamPrefixListResolverRules", "GetIpamPrefixListResolverVersionEntries",
  "GetIpamPrefixListResolverVersions", "ModifyIpamPrefixListResolver"),
  RequestParameters.IpamPrefixListResolverId,
  EventName in ("DeleteIpamPrefixListResolverTarget", "DescribeIpamPrefixListResolverTargets",
  "ModifyIpamPrefixListResolverTarget"), RequestParameters.IpamPrefixListResolverTargetId,
  EventName in ("DeleteIpamResourceDiscovery", "DescribeIpamResourceDiscoveries",
  "GetIpamDiscoveredAccounts", "GetIpamDiscoveredPublicAddresses", "GetIpamDiscoveredResourceCidrs",
  "ModifyIpamResourceDiscovery"), RequestParameters.IpamResourceDiscoveryId,
  EventName in ("DeleteIpamScope", "DescribeIpamScopes", "GetIpamAddressHistory", "ModifyIpamScope"),
  RequestParameters.IpamScopeId,
  EventName in ("DeletePublicIpv4Pool", "DeprovisionPublicIpv4PoolCidr", "DescribeIpv6Pools",
  "DescribePublicIpv4Pools", "GetAssociatedIpv6PoolCidrs"), RequestParameters.PoolId,
  EventName in ("DeprovisionByoipCidr", "MoveByoipCidrToIpam", "ProvisionByoipCidr", "WithdrawByoipCidr"),
  RequestParameters.Cidr,
  EventName == "DescribeByoipCidrs", ResponseElements.byoipCidrSet,
  EventName in ("DescribeIpamResourceDiscoveryAssociations", "DisassociateIpamResourceDiscovery"),
  RequestParameters.IpamResourceDiscoveryAssociationId,
  EventName in ("DisableIpamOrganizationAdminAccount", "EnableIpamOrganizationAdminAccount"),
  RequestParameters.DelegatedAdminAccountId,
  EventName == "GetEnabledIpamPolicy", ResponseElements.ipamPolicyId,
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
  EventName == "ModifyIpamPoolAllocation", iff(isnotnull(RequestParameters.ipamPoolAllocationId), RequestParameters.ipamPoolAllocationId, RequestParameters.IpamPoolAllocationId),
  EventName == "ModifyIpamResourceCidr", RequestParameters.ResourceId,
  EventName == "ReleaseIpamPoolAllocation", RequestParameters.IpamPoolAllocationId,
  parse_json('null')
  )
  | extend
  Type = "AWSCloudTrail",
  EventCount = int(1),
  EventStartTime = TimeGenerated,
  EventEndTime = TimeGenerated,
  EventSeverity = "Informational",
  EventSchema = "AuditEvent",
  EventSchemaVersion = "1.0.0",
  EventVendor = "AWS",
  EventProduct = "CloudTrail",
  Dvc = "CloudTrail",
  EventMessage = ErrorMessage,
  ObjectType = "Cloud Resource",
  TargetAppName = "Amazon Elastic Compute Cloud",
  TargetAppType = "Service",
  EventUid = tostring(AwsEventId)
  | project-rename
  EventOriginalSubType = EventTypeName,
  EventOriginalType = EventName,
  EventOriginalResultDetails = ErrorMessage,
  EventProductVersion = EventVersion,
  ActorUserId = UserIdentityAccountId,
  ActorUsername = UserIdentityUserName,
  ActorOriginalUserType = UserIdentityType,
  HttpUserAgent = UserAgent
  | extend
  ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
  ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
  SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
  ActingApplicationEntityKey = "",
  ActorUserAdditionalIds = parse_json('[]'),
  ActorUserEntityKey = "",
  AdditionalEntities = parse_json('[]'),
  DvcEntityKey = "",
  SrcSystemEntityKey = "",
  TargetApplicationEntityKey = "",
  TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
  "ActorAccessKeyId", UserIdentityAccessKeyId,
  "AWSRegion", AWSRegion,
  "APIVersion", APIVersion,
  "ManagementEvent", ManagementEvent,
  "ReadOnly", ReadOnly,
  "RequestParameters", RequestParameters,
  "ResponseElements", ResponseElements
  )
  | extend
  Operation = EventOriginalType,
  User = ActorUsername,
  IpAddr = SrcIpAddr,
  Application = TargetAppName,
  Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
  TimeGenerated,
  Type,
  EventCount,
  EventStartTime,
  EventEndTime,
  EventSeverity,
  EventSchemaVersion,
  EventVendor,
  EventProduct,
  EventResult,
  EventMessage,
  TargetAppName,
  EventOriginalSubType,
  EventOriginalType,
  EventOriginalUid,
  EventOriginalResultDetails,
  EventProductVersion,
  ActorUserId,
  ActorUsername,
  ActorOriginalUserType,
  HttpUserAgent,
  ActorUserIdType,
  ActorUsernameType,
  SrcIpAddr,
  AdditionalFields,
  EventType,
  NewValue,
  ObjectId,
  ObjectType,
  Object,
  TargetAppType,
  Operation,
  ActingApplicationEntityKey,
  ActorUserAdditionalIds,
  ActorUserEntityKey,
  AdditionalEntities,
  DvcEntityKey,
  SrcSystemEntityKey,
  TargetApplicationEntityKey,
  TargetSystemEntityKey
