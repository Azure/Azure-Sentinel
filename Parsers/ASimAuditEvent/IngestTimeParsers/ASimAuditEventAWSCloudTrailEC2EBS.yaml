Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 EBS activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 EBS activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2EBS'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | where EventName in (
      "AttachVolume",
      "CopySnapshot",
      "CopyVolumes",
      "CreateReplaceRootVolumeTask",
      "CreateSnapshot",
      "CreateSnapshots",
      "CreateVolume",
      "DeleteSnapshot",
      "DeleteVolume",
      "DescribeFastSnapshotRestores",
      "DescribeLockedSnapshots",
      "DescribeReplaceRootVolumeTasks",
      "DescribeSnapshotAttribute",
      "DescribeSnapshots",
      "DescribeSnapshotTierStatus",
      "DescribeVolumeAttribute",
      "DescribeVolumes",
      "DescribeVolumesModifications",
      "DescribeVolumeStatus",
      "DetachVolume",
      "DisableEbsEncryptionByDefault",
      "DisableFastSnapshotRestores",
      "DisableSnapshotBlockPublicAccess",
      "EnableEbsEncryptionByDefault",
      "EnableFastSnapshotRestores",
      "EnableSnapshotBlockPublicAccess",
      "EnableVolumeIO",
      "GetEbsDefaultKmsKeyId",
      "GetEbsEncryptionByDefault",
      "GetSnapshotBlockPublicAccessState",
      "ListSnapshotsInRecycleBin",
      "ListVolumesInRecycleBin",
      "LockSnapshot",
      "ModifyEbsDefaultKmsKeyId",
      "ModifySnapshotAttribute",
      "ModifySnapshotTier",
      "ModifyVolume",
      "ModifyVolumeAttribute",
      "ResetEbsDefaultKmsKeyId",
      "ResetSnapshotAttribute",
      "RestoreSnapshotFromRecycleBin",
      "RestoreSnapshotTier",
      "RestoreVolumeFromRecycleBin",
      "UnlockSnapshot"
  )
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | where EventName in (
      "AttachVolume",
      "CopySnapshot",
      "CopyVolumes",
      "CreateReplaceRootVolumeTask",
      "CreateSnapshot",
      "CreateSnapshots",
      "CreateVolume",
      "DeleteSnapshot",
      "DeleteVolume",
      "DescribeFastSnapshotRestores",
      "DescribeLockedSnapshots",
      "DescribeReplaceRootVolumeTasks",
      "DescribeSnapshotAttribute",
      "DescribeSnapshots",
      "DescribeSnapshotTierStatus",
      "DescribeVolumeAttribute",
      "DescribeVolumes",
      "DescribeVolumesModifications",
      "DescribeVolumeStatus",
      "DetachVolume",
      "DisableEbsEncryptionByDefault",
      "DisableFastSnapshotRestores",
      "DisableSnapshotBlockPublicAccess",
      "EnableEbsEncryptionByDefault",
      "EnableFastSnapshotRestores",
      "EnableSnapshotBlockPublicAccess",
      "EnableVolumeIO",
      "GetEbsDefaultKmsKeyId",
      "GetEbsEncryptionByDefault",
      "GetSnapshotBlockPublicAccessState",
      "ListSnapshotsInRecycleBin",
      "ListVolumesInRecycleBin",
      "LockSnapshot",
      "ModifyEbsDefaultKmsKeyId",
      "ModifySnapshotAttribute",
      "ModifySnapshotTier",
      "ModifyVolume",
      "ModifyVolumeAttribute",
      "ResetEbsDefaultKmsKeyId",
      "ResetSnapshotAttribute",
      "RestoreSnapshotFromRecycleBin",
      "RestoreSnapshotTier",
      "RestoreVolumeFromRecycleBin",
      "UnlockSnapshot"
  )
  | extend EventType = case(
      EventName in ("CreateReplaceRootVolumeTask", "CreateSnapshot", "CreateSnapshots", "CreateVolume"), "Create",
      EventName in ("DeleteSnapshot", "DeleteVolume"), "Delete",
      EventName in ("DisableEbsEncryptionByDefault", "DisableFastSnapshotRestores", "DisableSnapshotBlockPublicAccess"), "Disable",
      EventName in ("EnableEbsEncryptionByDefault", "EnableFastSnapshotRestores", "EnableSnapshotBlockPublicAccess", "EnableVolumeIO"), "Enable",
      EventName in ("CopySnapshot", "CopyVolumes", "LockSnapshot", "ResetEbsDefaultKmsKeyId", "ResetSnapshotAttribute", "UnlockSnapshot"), "Execute",
      EventName in ("DescribeFastSnapshotRestores", "DescribeLockedSnapshots", "DescribeReplaceRootVolumeTasks", "DescribeSnapshotAttribute", "DescribeSnapshots", "DescribeSnapshotTierStatus", "DescribeVolumeAttribute", "DescribeVolumes", "DescribeVolumesModifications", "DescribeVolumeStatus", "GetEbsDefaultKmsKeyId", "GetEbsEncryptionByDefault", "GetSnapshotBlockPublicAccessState", "ListSnapshotsInRecycleBin", "ListVolumesInRecycleBin"), "Read",
      EventName in ("AttachVolume", "DetachVolume", "ModifyEbsDefaultKmsKeyId", "ModifySnapshotAttribute", "ModifySnapshotTier", "ModifyVolume", "ModifyVolumeAttribute", "RestoreSnapshotFromRecycleBin", "RestoreSnapshotTier", "RestoreVolumeFromRecycleBin"), "Set",
      "")
  | extend Object = case(
      EventName in ("GetEbsDefaultKmsKeyId"), "AWS KMS Key",
      EventName in ("DisableEbsEncryptionByDefault", "EnableEbsEncryptionByDefault", "GetEbsEncryptionByDefault"), "EBS Encryption",
      EventName in ("ModifyEbsDefaultKmsKeyId", "ResetEbsDefaultKmsKeyId"), "EBS KMS Key",
      EventName in ("CopySnapshot", "DeleteSnapshot", "DescribeFastSnapshotRestores", "DescribeLockedSnapshots", "DisableSnapshotBlockPublicAccess", "ListSnapshotsInRecycleBin", "LockSnapshot", "ModifySnapshotAttribute", "ModifySnapshotTier", "RestoreSnapshotFromRecycleBin", "RestoreSnapshotTier", "UnlockSnapshot"), "EBS Snapshot",
      EventName in ("CopyVolumes", "CreateVolume", "DeleteVolume", "DescribeVolumeAttribute", "DescribeVolumes", "DescribeVolumesModifications", "DescribeVolumeStatus", "EnableVolumeIO", "ListVolumesInRecycleBin", "ModifyVolume", "ModifyVolumeAttribute", "RestoreVolumeFromRecycleBin"), "EBS Volume",
      EventName in ("CreateSnapshot", "CreateSnapshots"), "EBS Volume Snapshot",
      EventName in ("AttachVolume", "DetachVolume"), "EC2 Instance",
      EventName in ("CreateReplaceRootVolumeTask", "DescribeReplaceRootVolumeTasks"), "Replace Root Volume Task",
      EventName in ("DescribeSnapshotAttribute", "DescribeSnapshots", "DescribeSnapshotTierStatus", "DisableFastSnapshotRestores", "EnableFastSnapshotRestores", "EnableSnapshotBlockPublicAccess", "GetSnapshotBlockPublicAccessState", "ResetSnapshotAttribute"), "Snapshot",
      "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
      EventName == "AttachVolume", ResponseElements.volumeId,
      EventName == "CopySnapshot", ResponseElements.snapshotId,
      EventName == "CopyVolumes", ResponseElements.volumeSet,
      EventName == "CreateReplaceRootVolumeTask", ResponseElements.replaceRootVolumeTask,
      EventName in ("CreateSnapshot", "CreateVolume", "LockSnapshot", "RestoreSnapshotFromRecycleBin",
        "RestoreSnapshotTier"), ResponseElements,
      EventName == "CreateSnapshots", ResponseElements.snapshotSet,
      EventName == "EnableEbsEncryptionByDefault", ResponseElements.ebsEncryptionByDefault,
      EventName == "ModifyEbsDefaultKmsKeyId", ResponseElements.kmsKeyId,
      EventName == "ModifySnapshotTier", RequestParameters.StorageTier,
      EventName == "ModifyVolume", ResponseElements.volumeModification,
      EventName == "ModifyVolumeAttribute", RequestParameters.AutoEnableIO,
      parse_json('null')
    ), parse_json('null'))
  | extend ObjectId = case(
      EventName in ("AttachVolume", "DetachVolume"), RequestParameters.InstanceId,
      EventName in ("CopySnapshot", "CreateSnapshot", "LockSnapshot"), ResponseElements.snapshotId,
      EventName == "CopyVolumes", ResponseElements.volumeSet,
      EventName == "CreateReplaceRootVolumeTask",
        ResponseElements.replaceRootVolumeTask.replaceRootVolumeTaskId,
      EventName == "CreateSnapshots", ResponseElements.snapshotSet.snapshotId,
      EventName == "CreateVolume", ResponseElements.volumeId,
      EventName in ("DeleteSnapshot", "DescribeLockedSnapshots", "DescribeSnapshotAttribute",
        "DescribeSnapshots", "ListSnapshotsInRecycleBin", "ModifySnapshotAttribute", "ModifySnapshotTier",
        "ResetSnapshotAttribute", "RestoreSnapshotFromRecycleBin", "RestoreSnapshotTier", "UnlockSnapshot"),
        RequestParameters.SnapshotId,
      EventName in ("DeleteVolume", "DescribeVolumeAttribute", "DescribeVolumes",
        "DescribeVolumesModifications", "DescribeVolumeStatus", "EnableVolumeIO", "ListVolumesInRecycleBin",
        "ModifyVolumeAttribute", "RestoreVolumeFromRecycleBin"), RequestParameters.VolumeId,
      EventName == "DescribeReplaceRootVolumeTasks", RequestParameters.ReplaceRootVolumeTaskId,
      EventName == "DisableFastSnapshotRestores", RequestParameters.SourceSnapshotId,
      EventName in ("GetEbsDefaultKmsKeyId", "ModifyEbsDefaultKmsKeyId", "ResetEbsDefaultKmsKeyId"),
        ResponseElements.kmsKeyId,
      EventName == "ModifyVolume", ResponseElements.volumeModification.volumeId,
      parse_json('null')
    )
  | extend
      Type = "AWSCloudTrail",
      EventCount = int(1),
      EventStartTime = TimeGenerated,
      EventEndTime = TimeGenerated,
      EventSeverity = "Informational",
      EventSchema = "AuditEvent",
      EventSchemaVersion = "1.0.0",
      EventVendor = "AWS",
      EventProduct = "CloudTrail",
      Dvc = "CloudTrail",
      EventMessage = ErrorMessage,
      ObjectType = "Cloud Resource",
      TargetAppName = "Amazon Elastic Compute Cloud",
      TargetAppType = "Service",
      EventUid = tostring(AwsEventId)
  | project-rename
      EventOriginalSubType = EventTypeName,
      EventOriginalType = EventName,
      EventOriginalResultDetails = ErrorMessage,
      EventProductVersion = EventVersion,
      ActorUserId = UserIdentityAccountId,
      ActorUsername = UserIdentityUserName,
      ActorOriginalUserType = UserIdentityType,
      HttpUserAgent = UserAgent
  | extend
      ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
      ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
      SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
      ActingApplicationEntityKey = "",
      ActorUserAdditionalIds = parse_json('[]'),
      ActorUserEntityKey = "",
      AdditionalEntities = parse_json('[]'),
      DvcEntityKey = "",
      SrcSystemEntityKey = "",
      TargetApplicationEntityKey = "",
      TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
      "ActorAccessKeyId", UserIdentityAccessKeyId,
      "AWSRegion", AWSRegion,
      "APIVersion", APIVersion,
      "ManagementEvent", ManagementEvent,
      "ReadOnly", ReadOnly,
      "RequestParameters", RequestParameters,
      "ResponseElements", ResponseElements
    )
  | extend
      Operation = EventOriginalType,
      User = ActorUsername,
      IpAddr = SrcIpAddr,
      Application = TargetAppName,
      Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
      TimeGenerated,
      Type,
      EventCount,
      EventStartTime,
      EventEndTime,
      EventSeverity,
      EventSchemaVersion,
      EventVendor,
      EventProduct,
      EventResult,
      EventMessage,
      TargetAppName,
      EventOriginalSubType,
      EventOriginalType,
      EventOriginalUid,
      EventOriginalResultDetails,
      EventProductVersion,
      ActorUserId,
      ActorUsername,
      ActorOriginalUserType,
      HttpUserAgent,
      ActorUserIdType,
      ActorUsernameType,
      SrcIpAddr,
      AdditionalFields,
      EventType,
      NewValue,
      ObjectId,
      ObjectType,
      Object,
      TargetAppType,
      Operation,
      ActingApplicationEntityKey,
      ActorUserAdditionalIds,
      ActorUserEntityKey,
      AdditionalEntities,
      DvcEntityKey,
      SrcSystemEntityKey,
      TargetApplicationEntityKey,
      TargetSystemEntityKey
Change:
  Date: '2026-11-06'
  Description: 'Initial ingestion-time conversion.'
