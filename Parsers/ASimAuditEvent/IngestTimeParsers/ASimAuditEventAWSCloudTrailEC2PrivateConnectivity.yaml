Parser:
  DisplayName: 'Ingestion-time Audit Event ASIM parser for AWS CloudTrail EC2 PrivateConnectivity activity'
  Version: '0.1.0'
  LastUpdated: '2026-11-06'
Product:
  Name: 'AWS CloudTrail'
Normalization:
  Schema: 'AuditEvent'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes AWS CloudTrail EC2 PrivateConnectivity activity from AWSCloudTrail to ASimAuditEventLogs during ingestion.
ParserName: 'ASimAuditEventAWSCloudTrailEC2PrivateConnectivity'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimAuditEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateClientVpnEndpoint", "CreateClientVpnRoute", "CreateCustomerGateway", "CreateVpcEndpoint", "CreateVpcEndpointConnectionNotification", "CreateVpcEndpointServiceConfiguration", "CreateVpnConcentrator", "CreateVpnConnection", "CreateVpnGateway", "ImportClientVpnClientCertificateRevocationList"), "Create",
  EventName in ("DeleteClientVpnEndpoint", "DeleteClientVpnEndpointAuthorizationPolicy", "DeleteCustomerGateway", "DeleteVpcEndpointConnectionNotifications", "DeleteVpcEndpointServiceConfigurations", "DeleteVpcEndpoints", "DeleteVpnConcentrator", "DeleteVpnConnection", "DeleteVpnGateway", "DisassociateClientVpnTargetNetwork"), "Delete",
  EventName in ("RevokeClientVpnIngress"), "Disable",
  EventName in ("AcceptVpcEndpointConnections", "AuthorizeClientVpnIngress", "ExportClientVpnClientCertificateRevocationList", "ExportClientVpnClientConfiguration", "RejectVpcEndpointConnections"), "Execute",
  EventName in ("DescribeClientVpnAuthorizationRules", "DescribeClientVpnConnections", "DescribeClientVpnEndpoints", "DescribeClientVpnRoutes", "DescribeClientVpnTargetNetworks", "DescribeCustomerGateways", "DescribeVpcEndpointAssociations", "DescribeVpcEndpointConnectionNotifications", "DescribeVpcEndpointConnections", "DescribeVpcEndpointServiceConfigurations", "DescribeVpcEndpointServicePermissions", "DescribeVpcEndpointServices", "DescribeVpcEndpoints", "DescribeVpnConcentrators", "DescribeVpnConnections", "DescribeVpnGateways", "GetActiveVpnTunnelStatus", "GetClientVpnEndpointAuthorizationPolicy", "GetVpnConnectionDeviceSampleConfiguration", "GetVpnConnectionDeviceTypes", "GetVpnTunnelReplacementStatus"), "Read",
  EventName in ("ApplySecurityGroupsToClientVpnTargetNetwork", "AssociateClientVpnTargetNetwork", "AttachVpnGateway", "CreateVpnConnectionRoute", "DeleteClientVpnRoute", "DeleteVpnConnectionRoute", "DetachVpnGateway", "ModifyClientVpnEndpoint", "ModifyClientVpnEndpointAuthorizationPolicy", "ModifyVpcEndpoint", "ModifyVpcEndpointConnectionNotification", "ModifyVpcEndpointPayerResponsibility", "ModifyVpcEndpointServiceConfiguration", "ModifyVpcEndpointServicePayerResponsibility", "ModifyVpcEndpointServicePermissions", "ModifyVpnConnection", "ModifyVpnConnectionOptions", "ModifyVpnTunnelCertificate", "ModifyVpnTunnelOptions", "ReplaceVpnTunnel"), "Set",
  EventName in ("StartVpcEndpointServicePrivateDnsVerification"), "Start",
  EventName in ("TerminateClientVpnConnections"), "Stop",
  "")
  | where isnotempty(EventType)
ParserQuery: |
  source
  | where EventSource == "ec2.amazonaws.com"
  | extend EventType = case(
  EventName in ("CreateClientVpnEndpoint", "CreateClientVpnRoute", "CreateCustomerGateway", "CreateVpcEndpoint", "CreateVpcEndpointConnectionNotification", "CreateVpcEndpointServiceConfiguration", "CreateVpnConcentrator", "CreateVpnConnection", "CreateVpnGateway", "ImportClientVpnClientCertificateRevocationList"), "Create",
  EventName in ("DeleteClientVpnEndpoint", "DeleteClientVpnEndpointAuthorizationPolicy", "DeleteCustomerGateway", "DeleteVpcEndpointConnectionNotifications", "DeleteVpcEndpointServiceConfigurations", "DeleteVpcEndpoints", "DeleteVpnConcentrator", "DeleteVpnConnection", "DeleteVpnGateway", "DisassociateClientVpnTargetNetwork"), "Delete",
  EventName in ("RevokeClientVpnIngress"), "Disable",
  EventName in ("AcceptVpcEndpointConnections", "AuthorizeClientVpnIngress", "ExportClientVpnClientCertificateRevocationList", "ExportClientVpnClientConfiguration", "RejectVpcEndpointConnections"), "Execute",
  EventName in ("DescribeClientVpnAuthorizationRules", "DescribeClientVpnConnections", "DescribeClientVpnEndpoints", "DescribeClientVpnRoutes", "DescribeClientVpnTargetNetworks", "DescribeCustomerGateways", "DescribeVpcEndpointAssociations", "DescribeVpcEndpointConnectionNotifications", "DescribeVpcEndpointConnections", "DescribeVpcEndpointServiceConfigurations", "DescribeVpcEndpointServicePermissions", "DescribeVpcEndpointServices", "DescribeVpcEndpoints", "DescribeVpnConcentrators", "DescribeVpnConnections", "DescribeVpnGateways", "GetActiveVpnTunnelStatus", "GetClientVpnEndpointAuthorizationPolicy", "GetVpnConnectionDeviceSampleConfiguration", "GetVpnConnectionDeviceTypes", "GetVpnTunnelReplacementStatus"), "Read",
  EventName in ("ApplySecurityGroupsToClientVpnTargetNetwork", "AssociateClientVpnTargetNetwork", "AttachVpnGateway", "CreateVpnConnectionRoute", "DeleteClientVpnRoute", "DeleteVpnConnectionRoute", "DetachVpnGateway", "ModifyClientVpnEndpoint", "ModifyClientVpnEndpointAuthorizationPolicy", "ModifyVpcEndpoint", "ModifyVpcEndpointConnectionNotification", "ModifyVpcEndpointPayerResponsibility", "ModifyVpcEndpointServiceConfiguration", "ModifyVpcEndpointServicePayerResponsibility", "ModifyVpcEndpointServicePermissions", "ModifyVpnConnection", "ModifyVpnConnectionOptions", "ModifyVpnTunnelCertificate", "ModifyVpnTunnelOptions", "ReplaceVpnTunnel"), "Set",
  EventName in ("StartVpcEndpointServicePrivateDnsVerification"), "Start",
  EventName in ("TerminateClientVpnConnections"), "Stop",
  "")
  | where isnotempty(EventType)
  | extend Object = case(
  EventName in ("ExportClientVpnClientCertificateRevocationList", "ExportClientVpnClientConfiguration"), "Client VPN Client",
  EventName in ("AssociateClientVpnTargetNetwork", "AuthorizeClientVpnIngress", "CreateClientVpnEndpoint", "CreateClientVpnRoute", "DeleteClientVpnEndpoint", "DeleteClientVpnRoute", "DescribeClientVpnAuthorizationRules", "DescribeClientVpnConnections", "DescribeClientVpnEndpoints", "DescribeClientVpnRoutes", "DescribeClientVpnTargetNetworks", "ModifyClientVpnEndpoint", "TerminateClientVpnConnections"), "Client VPN Endpoint",
  EventName in ("DeleteClientVpnEndpointAuthorizationPolicy", "GetClientVpnEndpointAuthorizationPolicy", "ModifyClientVpnEndpointAuthorizationPolicy"), "Client VPN Endpoint Authorization Policy",
  EventName in ("CreateCustomerGateway", "DeleteCustomerGateway", "DescribeCustomerGateways"), "Customer Gateway",
  EventName in ("StartVpcEndpointServicePrivateDnsVerification"), "DNS",
  EventName in ("DisassociateClientVpnTargetNetwork"), "Target Network",
  EventName in ("AcceptVpcEndpointConnections", "ApplySecurityGroupsToClientVpnTargetNetwork", "AttachVpnGateway", "CreateVpnGateway", "DetachVpnGateway", "RejectVpcEndpointConnections"), "VPC",
  EventName in ("CreateVpcEndpointConnectionNotification"), "VPC Connection Notification",
  EventName in ("CreateVpcEndpoint", "DeleteVpcEndpoints", "DescribeVpcEndpointAssociations", "DescribeVpcEndpoints", "ModifyVpcEndpoint", "ModifyVpcEndpointPayerResponsibility"), "VPC Endpoint",
  EventName in ("DescribeVpcEndpointConnections"), "VPC Endpoint Connection",
  EventName in ("DeleteVpcEndpointConnectionNotifications", "DescribeVpcEndpointConnectionNotifications", "ModifyVpcEndpointConnectionNotification"), "VPC Endpoint Connection Notification",
  EventName in ("DescribeVpcEndpointServicePermissions"), "Vpc Endpoint Service",
  EventName in ("CreateVpcEndpointServiceConfiguration", "DeleteVpcEndpointServiceConfigurations", "DescribeVpcEndpointServiceConfigurations", "DescribeVpcEndpointServices", "ModifyVpcEndpointServiceConfiguration", "ModifyVpcEndpointServicePayerResponsibility", "ModifyVpcEndpointServicePermissions"), "VPC Endpoint Service",
  EventName in ("CreateVpnConcentrator", "DeleteVpnConcentrator", "DescribeVpnConcentrators"), "VPN Concentrator",
  EventName in ("CreateVpnConnection", "CreateVpnConnectionRoute", "DeleteVpnConnection", "DeleteVpnConnectionRoute", "DescribeVpnConnections", "GetActiveVpnTunnelStatus", "GetVpnConnectionDeviceSampleConfiguration", "GetVpnConnectionDeviceTypes", "GetVpnTunnelReplacementStatus", "ImportClientVpnClientCertificateRevocationList", "ModifyVpnConnection", "ModifyVpnConnectionOptions", "ModifyVpnTunnelCertificate", "ModifyVpnTunnelOptions", "ReplaceVpnTunnel", "RevokeClientVpnIngress"), "VPN Connection",
  EventName in ("DeleteVpnGateway", "DescribeVpnGateways"), "VPN Gateway",
  "")
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements)
  | extend EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure")
  | extend NewValue = iff(EventResult == "Success", case(
  EventName == "ApplySecurityGroupsToClientVpnTargetNetwork", ResponseElements.securityGroupIds,
  EventName == "AssociateClientVpnTargetNetwork", ResponseElements.associationId,
  EventName == "AttachVpnGateway", ResponseElements.attachment,
  EventName in ("AuthorizeClientVpnIngress", "CreateClientVpnRoute", "DeleteClientVpnRoute",
  "ExportClientVpnClientCertificateRevocationList", "RevokeClientVpnIngress"), ResponseElements.status,
  EventName == "CreateClientVpnEndpoint", ResponseElements.dnsName,
  EventName == "CreateCustomerGateway", ResponseElements.customerGateway,
  EventName == "CreateVpcEndpoint", ResponseElements.vpcEndpoint,
  EventName == "CreateVpcEndpointConnectionNotification", ResponseElements.connectionNotification,
  EventName == "CreateVpcEndpointServiceConfiguration", ResponseElements.serviceConfiguration,
  EventName == "CreateVpnConcentrator", ResponseElements.vpnConcentrator,
  EventName in ("CreateVpnConnection", "ModifyVpnConnection", "ModifyVpnConnectionOptions",
  "ModifyVpnTunnelCertificate", "ModifyVpnTunnelOptions"), ResponseElements.vpnConnection,
  EventName == "CreateVpnConnectionRoute", RequestParameters.DestinationCidrBlock,
  EventName == "CreateVpnGateway", ResponseElements.vpnGateway,
  EventName == "ExportClientVpnClientConfiguration", ResponseElements.clientConfiguration,
  EventName == "ModifyClientVpnEndpoint", RequestParameters.Description,
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
  EventName == "ModifyClientVpnEndpointAuthorizationPolicy", iff(isnotnull(RequestParameters.policyDocument), RequestParameters.policyDocument, RequestParameters.PolicyDocument),
  EventName == "ModifyVpcEndpointPayerResponsibility", ResponseElements.payerResponsibilitySet,
  EventName == "ModifyVpcEndpointServicePayerResponsibility", RequestParameters.PayerResponsibility,
  EventName == "ModifyVpcEndpointServicePermissions", RequestParameters.AddAllowedPrincipals.N,
  EventName == "RejectVpcEndpointConnections", ResponseElements.unsuccessful,
  EventName == "ReplaceVpnTunnel", RequestParameters.VpnTunnelOutsideIpAddress,
  parse_json('null')
  ), parse_json('null'))
  | extend ObjectId = case(
  EventName in ("AcceptVpcEndpointConnections", "DeleteVpcEndpointServiceConfigurations",
  "DescribeVpcEndpointServiceConfigurations", "DescribeVpcEndpointServicePermissions",
  "ModifyVpcEndpointServiceConfiguration", "ModifyVpcEndpointServicePayerResponsibility",
  "ModifyVpcEndpointServicePermissions", "StartVpcEndpointServicePrivateDnsVerification"),
  RequestParameters.ServiceId,
  EventName in ("ApplySecurityGroupsToClientVpnTargetNetwork", "AssociateClientVpnTargetNetwork",
  "AuthorizeClientVpnIngress", "CreateClientVpnRoute", "DeleteClientVpnEndpoint", "DeleteClientVpnRoute",
  "DescribeClientVpnAuthorizationRules", "DescribeClientVpnConnections", "DescribeClientVpnEndpoints",
  "DescribeClientVpnRoutes", "DescribeClientVpnTargetNetworks",
  "ExportClientVpnClientCertificateRevocationList", "ExportClientVpnClientConfiguration",
  "ModifyClientVpnEndpoint", "RevokeClientVpnIngress", "TerminateClientVpnConnections"),
  RequestParameters.ClientVpnEndpointId,
  EventName in ("AttachVpnGateway", "DetachVpnGateway"), RequestParameters.VpcId,
  EventName == "CreateClientVpnEndpoint", ResponseElements.clientVpnEndpointId,
  EventName == "CreateCustomerGateway", ResponseElements.customerGateway.customerGatewayId,
  EventName == "CreateVpcEndpoint", ResponseElements.vpcEndpoint.vpcEndpointId,
  EventName == "CreateVpcEndpointConnectionNotification",
  ResponseElements.connectionNotification.connectionNotificationId,
  EventName == "CreateVpcEndpointServiceConfiguration", ResponseElements.serviceConfiguration.serviceId,
  EventName == "CreateVpnConcentrator", ResponseElements.vpnConcentrator.vpnConcentratorId,
  EventName == "CreateVpnConnection", ResponseElements.vpnConnection.vpnConnectionId,
  EventName in ("CreateVpnConnectionRoute", "DeleteVpnConnection", "DeleteVpnConnectionRoute",
  "DescribeVpnConnections", "GetActiveVpnTunnelStatus", "GetVpnConnectionDeviceSampleConfiguration",
  "GetVpnTunnelReplacementStatus", "ModifyVpnConnection", "ModifyVpnConnectionOptions",
  "ModifyVpnTunnelCertificate", "ModifyVpnTunnelOptions", "ReplaceVpnTunnel"),
  RequestParameters.VpnConnectionId,
  EventName == "CreateVpnGateway", ResponseElements.vpnGateway.vpnGatewayId,
  EventName in ("DeleteClientVpnEndpointAuthorizationPolicy", "GetClientVpnEndpointAuthorizationPolicy",
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
  "ModifyClientVpnEndpointAuthorizationPolicy"), iff(isnotnull(RequestParameters.clientVpnEndpointId), RequestParameters.clientVpnEndpointId, RequestParameters.ClientVpnEndpointId),
  EventName in ("DeleteCustomerGateway", "DescribeCustomerGateways"), RequestParameters.CustomerGatewayId,
  EventName in ("DeleteVpcEndpointConnectionNotifications", "DescribeVpcEndpointConnectionNotifications",
  "ModifyVpcEndpointConnectionNotification"), RequestParameters.ConnectionNotificationId,
  EventName in ("DeleteVpcEndpoints", "DescribeVpcEndpointAssociations", "DescribeVpcEndpoints",
  "RejectVpcEndpointConnections"), RequestParameters.VpcEndpointId,
  EventName in ("DeleteVpnConcentrator", "DescribeVpnConcentrators"), RequestParameters.VpnConcentratorId,
  EventName in ("DeleteVpnGateway", "DescribeVpnGateways"), RequestParameters.VpnGatewayId,
  EventName == "DisassociateClientVpnTargetNetwork", ResponseElements.associationId,
  EventName == "ModifyVpcEndpoint", RequestParameters.RemoveRouteTableId.N,
  // NOTE(DCR-LOSSY: 3.4 coalesce) - dynamic empty-string/null edge cases require comparison
  EventName == "ModifyVpcEndpointPayerResponsibility", iff(isnotnull(RequestParameters.vpcEndpointId), RequestParameters.vpcEndpointId, RequestParameters.VpcEndpointId),
  parse_json('null')
  )
  | extend
  Type = "AWSCloudTrail",
  EventCount = int(1),
  EventStartTime = TimeGenerated,
  EventEndTime = TimeGenerated,
  EventSeverity = "Informational",
  EventSchema = "AuditEvent",
  EventSchemaVersion = "1.0.0",
  EventVendor = "AWS",
  EventProduct = "CloudTrail",
  Dvc = "CloudTrail",
  EventMessage = ErrorMessage,
  ObjectType = "Cloud Resource",
  TargetAppName = "Amazon Elastic Compute Cloud",
  TargetAppType = "Service",
  EventUid = tostring(AwsEventId)
  | project-rename
  EventOriginalSubType = EventTypeName,
  EventOriginalType = EventName,
  EventOriginalResultDetails = ErrorMessage,
  EventProductVersion = EventVersion,
  ActorUserId = UserIdentityAccountId,
  ActorUsername = UserIdentityUserName,
  ActorOriginalUserType = UserIdentityType,
  HttpUserAgent = UserAgent
  | extend
  ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
  ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
  SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, ""),
  ActingApplicationEntityKey = "",
  ActorUserAdditionalIds = parse_json('[]'),
  ActorUserEntityKey = "",
  AdditionalEntities = parse_json('[]'),
  DvcEntityKey = "",
  SrcSystemEntityKey = "",
  TargetApplicationEntityKey = "",
  TargetSystemEntityKey = ""
  | extend AdditionalFields = pack(
  "ActorAccessKeyId", UserIdentityAccessKeyId,
  "AWSRegion", AWSRegion,
  "APIVersion", APIVersion,
  "ManagementEvent", ManagementEvent,
  "ReadOnly", ReadOnly,
  "RequestParameters", RequestParameters,
  "ResponseElements", ResponseElements
  )
  | extend
  Operation = EventOriginalType,
  User = ActorUsername,
  IpAddr = SrcIpAddr,
  Application = TargetAppName,
  Value = NewValue
  // NOTE(DCR-LOSSY: destination-schema projection) - approved alias removal, UID mapping and dynamic serialization
  | extend NewValue = tostring(NewValue), ObjectId = tostring(ObjectId)
  | project-rename EventOriginalUid = EventUid
  | project
  TimeGenerated,
  Type,
  EventCount,
  EventStartTime,
  EventEndTime,
  EventSeverity,
  EventSchemaVersion,
  EventVendor,
  EventProduct,
  EventResult,
  EventMessage,
  TargetAppName,
  EventOriginalSubType,
  EventOriginalType,
  EventOriginalUid,
  EventOriginalResultDetails,
  EventProductVersion,
  ActorUserId,
  ActorUsername,
  ActorOriginalUserType,
  HttpUserAgent,
  ActorUserIdType,
  ActorUsernameType,
  SrcIpAddr,
  AdditionalFields,
  EventType,
  NewValue,
  ObjectId,
  ObjectType,
  Object,
  TargetAppType,
  Operation,
  ActingApplicationEntityKey,
  ActorUserAdditionalIds,
  ActorUserEntityKey,
  AdditionalEntities,
  DvcEntityKey,
  SrcSystemEntityKey,
  TargetApplicationEntityKey,
  TargetSystemEntityKey
Change:
  Date: '2026-11-06'
  Description: 'Initial ingestion-time conversion.'

