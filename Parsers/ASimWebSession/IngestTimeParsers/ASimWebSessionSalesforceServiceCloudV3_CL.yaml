Parser:
  DisplayName: 'WebSession ASIM ingestion-time parser for Salesforce Service Cloud (SalesforceServiceCloudV3_CL)'
  Version: '0.2.0'
  LastUpdated: '2026-11-12'
Product:
  Name: 'Salesforce Service Cloud'
Normalization:
  Schema: 'WebSession'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes SalesforceServiceCloudV3_CL into ASimWebSessionLogs during ingestion. Query-only fields are retained in AdditionalFields.QueryTimeFields; review documented lossy conversions.
ParserName: 'ASimWebSessionSalesforceServiceCloudV3_CL'
DCRType: 'Standard'
InputStream: 'Custom-SalesforceServiceCloudV3_CL'
SourceRawTable: 'SalesforceServiceCloudV3_CL'
TargetASIMTable: 'ASimWebSessionLogs'
ParserFilterQuery: |
  source
  | where EventType in ("ApiTotalUsage", "RestApi", "BulkApi2", "ApexCallout", "ExternalODataCallout", "MetadataApiOperation", "NamedCredential", "URI", "AuraRequest", "LightningPageView", "LightningPerformance", "LightningInteraction", "UiTelemetryResourceTiming", "UiTelemetryNavigationTiming", "CSPViolation")
ParserQuery: |
  source
  | extend Type = "SalesforceServiceCloudV3_CL"
  | where EventType in ("ApiTotalUsage", "RestApi", "BulkApi2", "ApexCallout", "ExternalODataCallout", "MetadataApiOperation", "NamedCredential", "URI", "AuraRequest", "LightningPageView", "LightningPerformance", "LightningInteraction", "UiTelemetryResourceTiming", "UiTelemetryNavigationTiming", "CSPViolation")
    | project-rename EventOriginalType = EventType
    | extend
  EventType = case(
      EventOriginalType in ("ApiTotalUsage", "RestApi", "BulkApi2", "ApexCallout", "ExternalODataCallout", "MetadataApiOperation", "NamedCredential"), "ApiRequest",
      EventOriginalType in ("URI", "AuraRequest", "LightningPageView", "LightningPerformance", "LightningInteraction", "UiTelemetryResourceTiming", "UiTelemetryNavigationTiming", "CSPViolation"), "WebServerSession",
      "")
    | extend
        Url = iif(isnotempty(Url), Url, Uri),
        _UrlHost = extract(@"https?://([^/:?#]+)", 1, Url)
    | extend
        DstFQDN = iff(_UrlHost has ".", _UrlHost, ""),
        DstHostname = iff(isnotempty(_UrlHost), extract(@"^([^.]+)", 1, _UrlHost), ""),
        DstDomain = extract(@"^[^.]+\.(.*)", 1, _UrlHost),
        DstDomainType = iff(_UrlHost has ".", "FQDN", "")
    | extend
        EventCount              = int(1),
        EventStartTime          = TimeGenerated,
        EventEndTime            = TimeGenerated,
        EventSchema             = "WebSession",
        EventSchemaVersion      = "1.0.0",
        EventVendor             = "Salesforce",
        EventProduct            = "Salesforce Service Cloud",
        EventProductVersion     = ApiVersion,
        EventSeverity           = "Informational",
        EventResultDetails      = StatusCode,
        EventResult             = case(
                                    isempty(StatusCode),         "NA",
                                    (toint(StatusCode) >= 100 and toint(StatusCode) <= 399), "Success",
                                    (toint(StatusCode) >= 400 and toint(StatusCode) <= 599), "Failure",
                                    "NA"
                                  ),
        EventOriginalResultDetails = StatusCode
    | extend
        HttpRequestMethod       = HttpMethod,
        HttpStatusCode          = EventResultDetails,
        HttpUserAgent           = iif(isnotempty(HttpUserAgentOriginal), HttpUserAgentOriginal, iif(isnotempty(HttpUserAgent), HttpUserAgent, UserAgent)),
        HttpReferrer            = iif(isnotempty(HttpReferrerOriginal), HttpReferrerOriginal, ReferrerUri),
        SrcIpAddr               = iif(isnotempty(ClientIp), ClientIp, iif(isnotempty(SourceIp), SourceIp, SrcIpAddr)),
        SrcUserId               = UserId,
        SrcUserIdType           = iff(isnotempty(UserId), "SalesforceId", ""),
        SrcUsername             = iif(isnotempty(UserEmail), UserEmail, User),
        SrcUserType             = case(
                                    UserType == "Standard" or UserType == "S", "Regular",
                                    UserType == "X", "Admin",
                                    ""
                                  ),
        SrcBytes                = tolong(RequestSize),
        SrcDvcId                = iif(isnotempty(SrcDvcId), SrcDvcId, DeviceId),
        SrcDvcModelName         = iif(isnotempty(SrcDvcModelName), SrcDvcModelName, DeviceModel),
        SrcDvcOs                = OsName,
        DstBytes                = tolong(iif(isnotempty(DstBytes), DstBytes, ResponseSize)),
        DstAppName              = "Salesforce Service Cloud",
        DstAppType              = "SaaS application",
        Dvc                     = "Salesforce Service Cloud",
        DvcScopeId              = OrganizationId,
        NetworkDuration         = toint(Duration),
        NetworkSessionId        = SessionKey,
        TlsVersion              = TlsProtocol,
        TlsCipher               = CipherSuite
    | extend
      SrcUsernameType         = case(
                                    isnotempty(SrcUsername) and SrcUsername has "@", "UPN",
                                    isnotempty(SrcUsername), "Simple",
                                    ""
                                  )
    | extend
        SrcDvcIdType            = iff(isnotempty(SrcDvcId), "Other", ""),
        Dst                     = iif(isnotempty(DstFQDN), DstFQDN, iif(isnotempty(DstHostname), DstHostname, DstAppName)),
        Src                     = SrcIpAddr,
        IpAddr                  = SrcIpAddr,
        User                    = SrcUsername,
        UserAgent               = HttpUserAgent,
        Hostname                = DstHostname,
        Duration                = NetworkDuration,
        SessionId               = NetworkSessionId
    | extend
        AdditionalFields = pack(
                "ApiVersion",       ApiVersion,
                "ApiType",          ApiType,
                "SessionType",      SessionType,
                "BrowserName",      BrowserName,
                "BrowserVersion",   BrowserVersion,
                "OsVersion",        OsVersion,
                "PlatformType",     PlatformType,
                "DevicePlatform",   DevicePlatform,
                "ConnectionType",   ConnectionType,
                "RequestId",        RequestId,
                "Quiddity",         Quiddity,
                "ExecTime",         ExecTime,
                "TotalTime",        TotalTime,
                "CpuTime",          CpuTime,
                "DbTotalTime",      DbTotalTime,
                "DbCpuTime",        DbCpuTime,
                "RowsProcessed",    RowsProcessed,
                "IsLongRunningRequest", IsLongRunningRequest
            )
    | project
        TimeGenerated,
        EventCount,
        EventStartTime,
        EventEndTime,
        EventType,
        EventResult,
        EventProduct,
        EventVendor,
        EventSchema,
        EventSchemaVersion,
        Dvc,
        Url,
        Dst,
        EventResultDetails,
        EventSeverity,
        HttpRequestMethod,
        HttpStatusCode,
        DstHostname,
        DstBytes,
        SrcIpAddr,
        SrcBytes,
        ASimMatchingIpAddr = "SrcIpAddr",
        ASimMatchingHostname = "DstHostname",
        EventOriginalType,
        EventOriginalResultDetails,
        EventProductVersion,
        HttpUserAgent,
        HttpReferrer,
        DstFQDN,
        DstDomain,
        DstDomainType,
        DstAppName,
        DstAppType,
        SrcUserId,
        SrcUserIdType,
        SrcUsername,
        SrcUsernameType,
        SrcUserType,
        SrcDvcId,
        SrcDvcIdType,
        SrcDvcModelName,
        SrcDvcOs,
        DvcScopeId,
        NetworkDuration,
        NetworkSessionId,
        TlsVersion,
        TlsCipher,
        AdditionalFields,
        IpAddr,
        User,
        UserAgent,
        Hostname,
        Duration,
        SessionId,
        Src,
        Type
  // NOTE(DCR-LOSSY: storage projection) - query-only fields preserved in AdditionalFields.QueryTimeFields
  | extend AdditionalFields = bag_merge(AdditionalFields, pack("QueryTimeFields", pack("EventSchema", EventSchema, "Dst", Dst, "HttpStatusCode", HttpStatusCode, "ASimMatchingIpAddr", ASimMatchingIpAddr, "ASimMatchingHostname", ASimMatchingHostname, "SrcDvcModelName", SrcDvcModelName, "SrcDvcOs", SrcDvcOs, "DvcScopeId", DvcScopeId, "TlsVersion", TlsVersion, "TlsCipher", TlsCipher, "IpAddr", IpAddr, "User", User, "UserAgent", UserAgent, "Hostname", Hostname, "Duration", Duration, "SessionId", SessionId, "Src", Src)))
  | project TimeGenerated, EventCount, EventStartTime, EventEndTime, EventType, EventResult, EventProduct, EventVendor, EventSchemaVersion, Dvc, Url, EventResultDetails, EventSeverity, HttpRequestMethod, DstHostname, DstBytes, SrcIpAddr, SrcBytes, EventOriginalType, EventOriginalResultDetails, EventProductVersion, HttpUserAgent, HttpReferrer, DstFQDN, DstDomain, DstDomainType, DstAppName, DstAppType, SrcUserId, SrcUserIdType, SrcUsername, SrcUsernameType, SrcUserType, SrcDvcId, SrcDvcIdType, NetworkDuration, NetworkSessionId, AdditionalFields, Type
Change:
  Date: '2026-11-12'
  Description: 'Initial per-table ingestion-time definition with query-only values preserved in AdditionalFields.QueryTimeFields.'
