Parser:
  Title: Authentication ASIM filtering parser for Salesforce Login History
  Version: '0.1.0'
  LastUpdated: Oct 01, 2026
Product:
  Name: Salesforce Login History
Normalization:
  Schema: Authentication
  Version: '1.0.0'
References:
- Title: ASIM Authentication Schema
  Link: https://aka.ms/ASimAuthenticationDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
- Title: SalesforceLoginHistory table documentation
  Link: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/salesforceloginhistory
Description: |
  This ASIM filtering parser normalizes Salesforce login history events stored in the SalesforceLoginHistory table and supports the standard Authentication filter parameters.
  This parser was created using the agentic ASIM parser creation tool, powered by Skills in GitHub.
ParserName: vimAuthenticationSalesforceLoginHistory
EquivalentBuiltInParser: _Im_Authentication_SalesforceLoginHistory
ParserParams:
  - Name: starttime
    Type: datetime
    Default: datetime(null)
  - Name: endtime
    Type: datetime
    Default: datetime(null)
  - Name: username_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: targetappname_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: srcipaddr_has_any_prefix
    Type: dynamic
    Default: dynamic([])
  - Name: srchostname_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: eventtype_in
    Type: dynamic
    Default: dynamic([])
  - Name: eventresultdetails_in
    Type: dynamic
    Default: dynamic([])
  - Name: eventresult
    Type: string
    Default: '*'
  - Name: disabled
    Type: bool
    Default: false
  - Name: pack
    Type: bool
    Default: false
ParserQuery: |
  let parser = (
      starttime: datetime = datetime(null),
      endtime: datetime = datetime(null),
      username_has_any: dynamic = dynamic([]),
      targetappname_has_any: dynamic = dynamic([]),
      srcipaddr_has_any_prefix: dynamic = dynamic([]),
      srchostname_has_any: dynamic = dynamic([]),
      eventtype_in: dynamic = dynamic([]),
      eventresultdetails_in: dynamic = dynamic([]),
      eventresult: string = "*",
      disabled: bool = false,
      pack: bool = false
  ) {
      SalesforceLoginHistory
      | where not(disabled)
      | where isnull(starttime)
          or LoginTime >= starttime
          or (isnull(LoginTime) and TimeGenerated >= starttime)
      | where isnull(endtime)
          or LoginTime <= endtime
          or (isnull(LoginTime) and TimeGenerated <= endtime)
      | where array_length(username_has_any) == 0
          or UserId has_any (username_has_any)
      | where array_length(srcipaddr_has_any_prefix) == 0
          or has_any_ipv4_prefix(SourceIp, srcipaddr_has_any_prefix)
      | where array_length(srchostname_has_any) == 0
      | where array_length(eventtype_in) == 0
          or "Logon" in~ (eventtype_in)
      | where eventresult == "*"
          or (eventresult =~ "Success" and Status =~ "Success")
          or (eventresult =~ "Failure" and Status !~ "Success" and isnotempty(Status))
          or (eventresult =~ "NA" and isempty(Status))
      | extend EventResultDetails = case(
          Status =~ "Success" or isempty(Status), "",
          Status =~ "Invalid Password", "Incorrect password",
          Status in~ ("Password Lockout", "User is Frozen"), "User locked",
          Status =~ "User is Inactive", "User disabled",
          Status in~ (
              "Lightning Login required",
              "Multi-factor required",
              "Passwordless Login via Passkeys required"
          ), "MFA not satisfied",
          Status in~ (
              "Failed: Not approved",
              "Failed: Not approved for access",
              "No community access",
              "Restricted IP",
              "Username-Password Flow Disabled"
          ), "Logon violates policy",
          "Other")
      | where array_length(eventresultdetails_in) == 0
          or EventResultDetails in~ (eventresultdetails_in)
      | extend SalesforceDomain = tostring(column_ifexists("SalesforceDomain", ""))
      | where array_length(targetappname_has_any) == 0
          or isempty(SalesforceDomain)
          or SalesforceDomain has_any (targetappname_has_any)
      | extend TargetUrl = iff(
          isempty(LoginUrl),
          "",
          iff(LoginUrl startswith "http://"
              or LoginUrl startswith "https://",
              LoginUrl,
              strcat("https://", LoginUrl)))
      | extend LoginUrlFQDN = tostring(parse_url(TargetUrl)["Host"])
      | extend TargetFQDN = case(
          isnotempty(SalesforceDomain), SalesforceDomain,
          isnotempty(LoginUrlFQDN), LoginUrlFQDN,
          LoginUrl)
      | invoke _ASIM_ResolveFQDN('TargetFQDN')
      | extend TargetAppName = iff(isnotempty(TargetFQDN), TargetFQDN, "Salesforce")
      | where array_length(targetappname_has_any) == 0
          or TargetAppName has_any (targetappname_has_any)
      | extend EventTime = coalesce(LoginTime, TimeGenerated)
      | extend NormalizedSourceIp = iff(
          isnotnull(parse_ipv4(SourceIp)) or isnotempty(parse_ipv6(SourceIp)),
          SourceIp,
          "")
      | extend
          ActingAppName = iff(isnotempty(Application), Application, Browser),
          ActingAppType = case(
              isnotempty(Application), "SaaS application",
              isnotempty(Browser), "Browser",
              "Other"),
          EventResult = case(
              Status =~ "Success", "Success",
              isempty(Status), "NA",
              "Failure"),
          DvcAction = case(
              Status =~ "Success", "Allowed",
              isempty(Status), "",
              "Blocked")
      | extend
          LogonMethod = case(
              LoginSubType =~ "OAuth Client Credentials", "Service Principal",
              LoginSubType =~ "OAuth OTP Login"
                  or Status in~ (
                      "Lightning Login required",
                      "Multi-factor required",
                      "Passwordless Login via Passkeys required"
                  )
                  or AuthMethodReference contains "multipleauthn",
                  "Multi factor authentication",
              AuthMethodReference contains "x509"
                  or AuthMethodReference contains "smartcard",
                  "PKI",
              LoginType contains "Passwordless"
                  or AuthMethodReference contains "fido",
                  "Passwordless",
              LoginSubType in~ (
                  "OAuth Username-Password",
                  "UI Password Reset",
                  "UI Username-Password"
              )
                  or Status =~ "Invalid Password",
                  "Username & Password",
              "Other"),
          LogonProtocol = case(
              LoginSubType contains "OAuth", "OAuth",
              LoginSubType contains "SOAP", "SOAP",
              LoginType contains "SAML", "SAML",
              LoginSubType startswith "UI", "Basic Auth",
              LoginSubType =~ "Internal Salesforce Authentication", "Salesforce",
              "Other"),
          EventSubType = case(
              LoginSubType contains "OAuth"
                  or LoginSubType contains "SOAP"
                  or LoginType in~ (
                      "Application",
                      "Other Apex API",
                      "Remote Access 2.0",
                      "Remote Access Client",
                      "Salesforce Outlook Integration"
                  ),
                  "Service",
              "Interactive"),
          SrcDeviceType = case(
              Platform startswith "Android"
                  or Platform in~ ("iOS/Mac", "iPad", "iPhone"),
                  "Mobile Device",
              Platform startswith "Windows"
                  or Platform in~ ("Linux", "Mac OSX"),
                  "Computer",
              isnotempty(Platform), "Other",
              "")
      | extend
          EventUid = hash_sha256(strcat(
              TenantId, "|",
              tostring(EventTime), "|",
              UserId, "|",
              SourceIp, "|",
              LoginType, "|",
              LoginSubType, "|",
              Application, "|",
              LoginUrl, "|",
              Status)),
          AdditionalFields = iff(
              pack,
              bag_pack(
                  "ApiType", ApiType,
                  "ApiVersion", ApiVersion,
                  "AuthMethodReference", AuthMethodReference,
                  "Browser", Browser,
                  "CipherSuite", CipherSuite,
                  "ClientVersion", ClientVersion,
                  "ForwardedForIp", ForwardedForIp,
                  "LoginGeoId", LoginGeoId,
                  "OptionsIsGet", OptionsIsGet,
                  "OptionsIsPost", OptionsIsPost,
                  "SourceIp", SourceIp,
                  "SourceSystem", SourceSystem,
                  "LoginTime", LoginTime,
                  "TenantId", TenantId,
                  "TlsProtocol", TlsProtocol,
                  "_BilledSize", _BilledSize,
                  "_IsBillable", _IsBillable
              ),
              dynamic({}))
      | project-rename
          ActingAppId = AuthenticationServiceId,
          EventProductVersion = ApiVersion,
          TargetAppId = NetworkId
      | project
          TimeGenerated,
          Type = "SalesforceLoginHistory",
          EventCount = toint(1),
          EventEndTime = EventTime,
          EventMessage = Status,
          EventOriginalResultDetails = Status,
          EventOriginalSubType = LoginSubType,
          EventOriginalType = LoginType,
          EventProduct = "Salesforce Login History",
          EventProductVersion,
          EventResult,
          EventResultDetails,
          EventSchema = "Authentication",
          EventSchemaVersion = "1.0.0",
          EventSeverity = "Informational",
          EventStartTime = EventTime,
          EventSubType,
          EventType = "Logon",
          EventUid,
          EventVendor = "Salesforce",
          ActingAppId,
          ActingAppName,
          ActingAppType,
          ActingOriginalAppType = ApiType,
          ActingApplicationEntityKey = "",
          ActorUserAdditionalIds = dynamic([]),
          ActorUserEntityKey = "",
          AdditionalEntities = dynamic([]),
          AdditionalFields,
          Application = TargetAppName,
          Dst = coalesce(FQDN, tostring(ExtractedHostname)),
          Dvc = "Salesforce Login History",
          DvcAction,
          DvcDescription = "Salesforce authentication service",
          DvcDomain = "",
          DvcDomainType = "",
          DvcEntityKey = "",
          DvcFQDN = "",
          DvcHostname = "",
          HttpUserAgent = Browser,
          IpAddr = NormalizedSourceIp,
          LogonMethod,
          LogonProtocol,
          LogonTarget = coalesce(FQDN, tostring(ExtractedHostname)),
          Src = NormalizedSourceIp,
          SrcDeviceType,
          SrcDvcOs = Platform,
          SrcGeoCountry = CountryIso,
          SrcHostname = "",
          SrcIpAddr = NormalizedSourceIp,
          SrcSystemEntityKey = "",
          TargetAppId,
          TargetApplicationEntityKey = "",
          TargetAppName,
          TargetAppType = "SaaS application",
          TargetDomain = tostring(Domain),
          TargetDomainType = DomainType,
          TargetFQDN = FQDN,
          TargetHostname = tostring(ExtractedHostname),
          TargetSystemEntityKey = "",
          TargetUrl,
          TargetUserAdditionalIds = dynamic([]),
          TargetUserEntityKey = "",
          TargetUserId = UserId,
          TargetUserIdType = iff(isnotempty(UserId), "SalesforceId", ""),
          User = UserId
  };
  parser(
      starttime=starttime,
      endtime=endtime,
      username_has_any=username_has_any,
      targetappname_has_any=targetappname_has_any,
      srcipaddr_has_any_prefix=srcipaddr_has_any_prefix,
      srchostname_has_any=srchostname_has_any,
      eventtype_in=eventtype_in,
      eventresultdetails_in=eventresultdetails_in,
      eventresult=eventresult,
      disabled=disabled,
      pack=pack
  )
