Parser:
  Title: ASIM Authentication parser for Barracuda WAF
  Version: '0.1.1'
  LastUpdated: Oct 10, 2026
Product:
  Name: Barracuda WAF
Normalization:
  Schema: Authentication
  Version: '1.0.0'
References:
- Title: ASIM Authentication Schema
  Link: https://aka.ms/ASimAuthenticationDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
- Title: Logs type Description in Barracuda WAF
  Link: https://campus.barracuda.com/product/webapplicationfirewall/doc/78810008/types-of-logs/
Description: |
  This ASIM parser supports normalizing the Barracuda WAF logs to the ASIM authentication normalized schema.
Exceptions:
- Field: Dst
  Warning: Missing recommended field
  Exception: The existing mapping identifies the reporting WAF in Dvc fields and the administrator client in Src fields. It does not identify a separate destination entity to populate this alias.
- Field: DvcAction
  Warning: Missing recommended field
  Exception: The supported AUDIT records describe administrator activity, not a security-device enforcement action. EventType and EventResult retain the operation and outcome.
- Field: DvcDomain
  Warning: Missing recommended field
  Exception: The supported AUDIT format supplies a reporting-device name, but no separate device-domain field. The existing DvcHostname mapping is retained.
- Field: TargetDomain
  Warning: Missing recommended field
  Exception: The supported AUDIT authentication format does not provide a target-system domain.
- Field: TargetHostname
  Warning: Missing recommended field
  Exception: The supported AUDIT format identifies the reporting WAF, but no separate target-host identity. The WAF identity remains in the existing Dvc fields.
ParserName: ASimAuthenticationBarracudaWAF
EquivalentBuiltInParser: _ASim_Authentication_BarracudaWAF
ParserParams:
  - Name: disabled
    Type: bool
    Default: false
ParserQuery: |
  let barracudaSchema = datatable(
      LogType_s: string,
      UnitName_s: string,
      EventName_s: string,
      DeviceReceiptTime_s: string,
      HostIP_s: string,
      host_s: string,
      LoginIP_s: string,
      Severity_s: string,
      LoginPort_d: real,
      AdminName_s: string,
      EventMessage_s: string,
      TimeTaken_d: real,
      TenantId: string,
      Message: string,
      SourceSystem: string,
      _ResourceId: string,
      RawData: string,
      Computer: string,
      MG: string,
      ManagementGroupName: string,
      SourceIP: string
  )[];
  let SeverityLookup = datatable (severity: int, EventSeverity: string)
      [
      0, "High", 
      1, "High", 
      2, "High", 
      3, "Medium",
      4, "Low",
      5, "Low", 
      6, "Informational",
      7, "Informational" 
  ];
  let EventTypeLookup = datatable (
      EventName_s: string,
      EventType_lookup: string,
      EventResult: string
  )
      [
      "LOGIN", "Logon", "Success",
      "UNSUCCESSFUL_LOGIN", "Logoff", "Failure",
      "LOGOUT", "Logoff", "Success",
      "SESSION_TIMEOUT", "Logoff", "Success"
  ];
  let EventResultDetailsLookup = datatable (
      Reason: string,
      EventResultDetails: string
  )
      [
      "Invalid Username/Password", "Incorrect password",
      "Account Lockout", "User locked",
      "Expired or Disabled Accounts", "User disabled",
      "IP Blocking", "Logon violates policy",
      "Session Timeouts", "Session expired",
      "CAPTCHA Verification", "Other"
  ];
  let parser = (disabled: bool=false)
  {
  let BarracudaCustom = 
      union isfuzzy=true
          barracudaSchema,
          barracuda_CL
      | where not(disabled)
          and (LogType_s == "AUDIT")
          and (EventName_s in ("LOGIN", "LOGOUT", "UNSUCCESSFUL_LOGIN", "SESSION_TIMEOUT"))
      | parse trim(@'[^\w(")]+', EventMessage_s) with * "Reason=" Reason:string
      | extend Reason = trim(@'(")', Reason)
      | lookup EventResultDetailsLookup on Reason
      | extend EventResultDetails = iff(EventName_s == "SESSION_TIMEOUT", "Session expired", EventResultDetails)
      | lookup EventTypeLookup on EventName_s
      | extend 
          EventType = EventType_lookup,
          severity = toint(Severity_s)
      | lookup SeverityLookup on severity
      | extend
          Dvc = UnitName_s,
          EventCount = toint(1),
          EventProduct = "WAF",
          EventSchema = "Authentication",
          EventSchemaVersion = "1.0.0",
          EventVendor = "Barracuda"
      | extend
          EventStartTime = iff(isnotempty(TimeTaken_d), unixtime_milliseconds_todatetime(tolong(DeviceReceiptTime_s)-tolong(TimeTaken_d)), unixtime_milliseconds_todatetime(tolong(DeviceReceiptTime_s))),
          SrcPortNumber = toint(LoginPort_d),
          DvcIpAddr = HostIP_s,
          SrcIpAddr = LoginIP_s,
          DvcHostname = host_s,
          ActorUsername = AdminName_s
      | extend
          ActorUsernameType = iff(isnotempty(ActorUsername), "Simple", ""),
          ActorUserType = iff(isnotempty(ActorUsername), "Admin", "")
      | extend
          IpAddr = SrcIpAddr,
          Src = SrcIpAddr,
          EventEndTime = EventStartTime
      | extend
          EventUid = tostring(column_ifexists("_ItemId", "")),
          ActingApplicationEntityKey = "",
          ActorUserAdditionalIds = dynamic([]),
          ActorUserEntityKey = "",
          AdditionalEntities = dynamic([]),
          DvcEntityKey = "",
          SrcSystemEntityKey = "",
          TargetApplicationEntityKey = "",
          TargetSystemEntityKey = "",
          TargetUserAdditionalIds = dynamic([]),
          TargetUserEntityKey = ""
      | project
          ActingApplicationEntityKey,
          ActorUserAdditionalIds,
          ActorUserEntityKey,
          ActorUserType,
          ActorUsername,
          ActorUsernameType,
          AdditionalEntities,
          Dvc,
          DvcEntityKey,
          DvcHostname,
          DvcIpAddr,
          EventCount,
          EventEndTime,
          EventProduct,
          EventResult,
          EventResultDetails,
          EventSchema,
          EventSchemaVersion,
          EventSeverity,
          EventStartTime,
          EventType,
          EventUid,
          EventVendor,
          IpAddr,
          Src,
          SrcIpAddr,
          SrcPortNumber,
          SrcSystemEntityKey,
          TargetApplicationEntityKey,
          TargetSystemEntityKey,
          TargetUserAdditionalIds,
          TargetUserEntityKey,
          TimeGenerated,
          Type;
  let BarracudaCEF = 
      CommonSecurityLog
      | where not(disabled) and DeviceVendor startswith "Barracuda" and (DeviceProduct == "WAF" or DeviceProduct == "WAAS")
      | where DeviceEventCategory == "AUDIT"
          and (toupper(ProcessName) in ("LOGIN", "LOGOUT", "UNSUCCESSFUL_LOGIN", "SESSION_TIMEOUT"))
      | parse trim(@'[^\w(")]+', Message) with * "Reason=" Reason:string
      | extend Reason = trim(@'(")', Reason)
      | lookup EventResultDetailsLookup on Reason
      | extend EventResultDetails = iff(toupper(ProcessName) == "SESSION_TIMEOUT", "Session expired", EventResultDetails)
      | extend ProcessName = toupper(ProcessName)
      | lookup EventTypeLookup on $left.ProcessName == $right.EventName_s
      | extend 
          EventType = EventType_lookup,
          severity = toint(LogSeverity)
      | lookup SeverityLookup on severity
      | extend
          Dvc = DeviceName,
          EventCount = toint(1),
          EventProduct = "WAF",
          EventSchema = "Authentication",
          EventSchemaVersion = "1.0.0",
          EventVendor = "Barracuda"
      | extend
          EventStartTime = iff(isnotempty(FlexNumber2), unixtime_milliseconds_todatetime(tolong(ReceiptTime)-tolong(FlexNumber2)), unixtime_milliseconds_todatetime(tolong(ReceiptTime))),
          SrcPortNumber = toint(SourcePort),
          DvcIpAddr = DeviceAddress,
          SrcIpAddr = SourceIP,
          DvcHostname = DeviceName,
          ActorUsername= DestinationUserName
      | extend
          ActorUsernameType = iff(isnotempty(ActorUsername), "Simple", ""),
          ActorUserType = iff(isnotempty(ActorUsername), "Admin", "")
      | extend
          IpAddr = SrcIpAddr,
          Src = SrcIpAddr,
          EventEndTime = EventStartTime
      | extend
          EventUid = tostring(column_ifexists("_ItemId", "")),
          ActingApplicationEntityKey = "",
          ActorUserAdditionalIds = dynamic([]),
          ActorUserEntityKey = "",
          AdditionalEntities = dynamic([]),
          DvcEntityKey = "",
          SrcSystemEntityKey = "",
          TargetApplicationEntityKey = "",
          TargetSystemEntityKey = "",
          TargetUserAdditionalIds = dynamic([]),
          TargetUserEntityKey = ""
      | project
          ActingApplicationEntityKey,
          ActorUserAdditionalIds,
          ActorUserEntityKey,
          ActorUserType,
          ActorUsername,
          ActorUsernameType,
          AdditionalEntities,
          Dvc,
          DvcEntityKey,
          DvcHostname,
          DvcIpAddr,
          EventCount,
          EventEndTime,
          EventProduct,
          EventResult,
          EventResultDetails,
          EventSchema,
          EventSchemaVersion,
          EventSeverity,
          EventStartTime,
          EventType,
          EventUid,
          EventVendor,
          IpAddr,
          Src,
          SrcIpAddr,
          SrcPortNumber,
          SrcSystemEntityKey,
          TargetApplicationEntityKey,
          TargetSystemEntityKey,
          TargetUserAdditionalIds,
          TargetUserEntityKey,
          TimeGenerated,
          Type;
  union isfuzzy = true 
    BarracudaCustom,
    BarracudaCEF
  };
  parser(disabled=disabled)