Parser:
  Title: Authentication ASIM filtering parser for Oracle Cloud Infrastructure (OCI) sign-in logs
  Version: '0.1.0'
  LastUpdated: Sep 14, 2026
Product:
  Name: Oracle Cloud Infrastructure
Normalization:
  Schema: Authentication
  Version: '0.1.3'
References:
- Title: ASIM Authentication Schema
  Link: https://aka.ms/ASimAuthenticationDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
Description: |
  This ASIM parser supports filtering and normalizing Oracle Cloud Infrastructure (OCI) authentication events, stored in the OCI_LogsV2_CL table, to the ASIM Authentication schema.
  Maps imAuthentication's username_has_any parameter to ASimAuthenticationOracleOCI's targetusername_has_any.
ParserName: vimAuthenticationOracleOCI
EquivalentBuiltInParser: _Im_Authentication_OracleOCI
ParserParams:
  - Name: starttime
    Type: datetime
    Default: datetime(null)
  - Name: endtime
    Type: datetime
    Default: datetime(null)
  - Name: username_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: targetappname_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: srcipaddr_has_any_prefix
    Type: dynamic
    Default: dynamic([])
  - Name: srchostname_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: eventtype_in
    Type: dynamic
    Default: dynamic([])
  - Name: eventresultdetails_in
    Type: dynamic
    Default: dynamic([])
  - Name: eventresult
    Type: string
    Default: '*'
  - Name: disabled
    Type: bool
    Default: false
  - Name: pack
    Type: bool
    Default: false
ParserQuery: |
  let parser = (
      starttime:                  datetime = datetime(null),
      endtime:                    datetime = datetime(null),
      username_has_any:           dynamic  = dynamic([]),
      targetappname_has_any:      dynamic  = dynamic([]),
      srcipaddr_has_any_prefix:   dynamic  = dynamic([]),
      srchostname_has_any:        dynamic  = dynamic([]),
      eventtype_in:               dynamic  = dynamic([]),
      eventresultdetails_in:      dynamic  = dynamic([]),
      eventresult:                string   = '*',
      disabled:                   bool     = false,
      pack:                       bool     = false
  ) {
      ASimAuthenticationOracleOCI(
          starttime                = starttime,
          endtime                  = endtime,
          targetusername_has_any   = username_has_any,
          targetappname_has_any    = targetappname_has_any,
          srcipaddr_has_any_prefix = srcipaddr_has_any_prefix,
          srchostname_has_any      = srchostname_has_any,
          eventtype_in             = eventtype_in,
          eventresultdetails_in    = eventresultdetails_in,
          eventresult              = eventresult,
          disabled                 = disabled,
          pack                     = pack
      )
  };
  parser(
      starttime                = starttime,
      endtime                  = endtime,
      username_has_any         = username_has_any,
      targetappname_has_any    = targetappname_has_any,
      srcipaddr_has_any_prefix = srcipaddr_has_any_prefix,
      srchostname_has_any      = srchostname_has_any,
      eventtype_in             = eventtype_in,
      eventresultdetails_in    = eventresultdetails_in,
      eventresult              = eventresult,
      disabled                 = disabled,
      pack                     = pack
  )
