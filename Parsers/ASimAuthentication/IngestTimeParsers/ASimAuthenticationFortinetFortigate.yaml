Parser:
  DisplayName: 'ASIM Authentication parser for Fortinet - Fortigate - ingestion-time normalization'
  Version: '0.1.1'
  LastUpdated: '2026-10-22'
Product:
  Name: 'Fortigate'
Normalization:
  Schema: 'Authentication'
  Version: '0.1.4'
Author: 'Microsoft'
Description: |
  Normalizes Fortigate Authentication events from CommonSecurityLog into ASimAuthenticationEventLogs during ingestion.
ParserName: 'ASimAuthenticationFortinetFortigate'
DCRType: 'Standard'
InputStream: 'Microsoft-CommonSecurityLog'
SourceRawTable: 'CommonSecurityLog'
TargetASIMTable: 'ASimAuthenticationEventLogs'
ParserFilterQuery: |
  source
  | where DeviceVendor == "Fortinet"
  | where DeviceProduct has "Fortigate"
  | where DeviceEventClassID !in ("0100022949", "0100022952")
  | where (DeviceAction == "logout" and Activity in ("system event logout", "event:system success"))
      or (DeviceAction == "login" and Activity in ("system event login", "event:system failed", "event:system success"))
ParserQuery: |
  source
  | extend Type="CommonSecurityLog"
  | where DeviceVendor=="Fortinet"
  | where DeviceProduct has "Fortigate"
  | where DeviceEventClassID !in("0100022949","0100022952")
  | where(DeviceAction=="logout" and Activity in("system event logout","event:system success"))or(DeviceAction=="login" and Activity in("system event login","event:system failed","event:system success"))
  | extend EventType=iif(DeviceAction=="logout","Logoff","Logon")
  | extend EventResultDetails=iif(DeviceAction=="login",case(Message has "invalid password","Incorrect password",Message has "invalid","No such user or password",Message has "disabled","User disabled",Message has "no valid user certificate","Incorrect key",Message has "blocked IP","Logon violates policy",Message has "max login failures","Logon violates policy",Message has "declined disclaimer","Logon violates policy",Message has "password renewal","Logon violates policy",Message has "internal error","Other",Message has "connection timeout","Other",""),"")
  | extend EventStartTime=TimeGenerated,EventEndTime=TimeGenerated,EventSchema="Authentication",EventSchemaVersion="0.1.4",EventCount=int(1),Type="CommonSecurityLog"
  | project-rename EventProductVersion=DeviceVersion,TargetIpAddr=DestinationIP,TargetHostname=Computer,TargetFQDN=DeviceName,EventOriginalType=Activity,EventOriginalSubType=DeviceEventClassID,TargetUsername=DestinationUserName,TargetDvcId=DeviceExternalID,SrcIpAddr=SourceIP,ActingAppName=SourceProcessName,EventMessage=Message
  | extend EventVendor="Fortinet",EventProduct="FortiGate"
  | extend TargetUsernameType="Simple",TargetDvcIdType="Other"
  | parse-kv AdditionalExtensions as(deviceSeverity: string,status: string,["ad.status"]: string)with(pair_delimiter=";",kv_delimiter="=")
  | extend EventResult=case(["ad.status"]=="success" or status=="success","Success",["ad.status"]=="failed" or status=="failed","Failure",EventMessage has "login failed","Failure",EventMessage has "Login disabled","Failure",EventMessage has "logged out","Success",EventMessage has "logged in successfully","Success","NA")
  | extend EventOriginalSeverity=iif(isnotempty(deviceSeverity),deviceSeverity,iif(isnotempty(LogSeverity),LogSeverity,""))
  | extend EventSeverity=case(EventOriginalSeverity=="information","Informational",EventOriginalSeverity=="notice","Informational",EventOriginalSeverity=="warning","Low",EventOriginalSeverity=="error","Low",EventOriginalSeverity=="alert","Medium",EventOriginalSeverity=="critical","High",EventOriginalSeverity=="emergency","High",EventOriginalSeverity=="0","Informational",EventOriginalSeverity=="1","Informational",EventOriginalSeverity=="2","Informational",EventOriginalSeverity=="3","Informational",EventOriginalSeverity=="4","Low",EventOriginalSeverity=="5","Low",EventOriginalSeverity=="6","Low",EventOriginalSeverity=="7","Medium",EventOriginalSeverity=="8","Medium",EventOriginalSeverity=="9","High",EventOriginalSeverity=="10","High","")
  | extend Dvc=TargetDvcId,IpAddr=SrcIpAddr
  | project TimeGenerated,Type,EventResultDetails,EventType,EventStartTime,EventEndTime,EventSchema,EventSchemaVersion,EventCount,EventProductVersion,EventProduct,EventVendor,TargetIpAddr,TargetHostname,TargetFQDN,EventOriginalType,EventOriginalSeverity,EventOriginalSubType,TargetUsername,TargetDvcId,SrcIpAddr,ActingAppName,EventMessage,TargetUsernameType,TargetDvcIdType,EventResult,EventSeverity,Dvc,IpAddr
Change:
  Date: '2026-10-22'
  Description: 'Initial ingest-time parser targeting ASimAuthenticationEventLogs.'
