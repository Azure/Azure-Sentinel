  from the SalesforceServiceCloudV3_CL raw-table shape into the native
  ASimAuthenticationEventLogs table during ingestion.
ParserName: ASimAuthenticationSalesforceServiceCloud
DCRType: Standard
InputStream: Custom-SalesforceServiceCloudV3_CL
SourceRawTable: SalesforceServiceCloudV3_CL
TargetASIMTable: ASimAuthenticationEventLogs
ParserFilterQuery: |
  source
  | where tolower(EventType) in ("login", "loginas", "logout")
