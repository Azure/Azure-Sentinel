Parser:
  DisplayName: 'Authentication ASIM ingestion-time parser for Salesforce Login History'
  Version: '0.1.2'
  LastUpdated: '2026-10-26'
Product:
  Name: 'Salesforce Login History'
Normalization:
  Schema: 'Authentication'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes Salesforce login history events from the SalesforceLoginHistory raw table into ASimAuthenticationEventLogs during ingestion.
ParserName: 'ASimAuthenticationSalesforceLoginHistory'
DCRType: 'Standard'
InputStream: 'Microsoft-SentinelSalesforceLoginHistory'
SourceRawTable: 'SalesforceLoginHistory'
TargetASIMTable: 'ASimAuthenticationEventLogs'
ParserFilterQuery: |
  source
ParserQuery: |
  source
  | extend Type = "SalesforceLoginHistory"
  | extend EventTime = iif(isnotnull(LoginTime), LoginTime, TimeGenerated)
  | extend NormalizedSourceIp = iff(
      isnotnull(parse_ipv4(SourceIp)) or isnotempty(parse_ipv6(SourceIp)),
      SourceIp,
      "")
  | extend TargetUrl = iff(
      isempty(LoginUrl),
      "",
      iff(LoginUrl startswith "http://"
          or LoginUrl startswith "https://",
          LoginUrl,
          strcat("https://", LoginUrl)))
  // NOTE(DCR-LOSSY: 3.34 parse_url Host) - regex extraction does not percent-decode URL components
  | extend LoginUrlFQDN = extract(@"^[a-zA-Z][a-zA-Z0-9+.-]*://(?:[^@/]*@)?([^:/?#]*)", 1, TargetUrl)
  | extend TargetFQDN = case(
      isnotempty(SalesforceDomain), SalesforceDomain,
      isnotempty(LoginUrlFQDN), LoginUrlFQDN,
      LoginUrl)
  | extend _srcHost1 = TargetFQDN
  | extend DomainType = case(
      indexof(_srcHost1, "\\") >= 0, "Windows",
      indexof(_srcHost1, ".") >= 0,  "FQDN",
      "")
  | extend
      FQDN = iif(DomainType == "", "", _srcHost1),
      Domain = case(
          DomainType == "Windows", substring(_srcHost1, 0, indexof(_srcHost1, "\\")),
          DomainType == "FQDN",    substring(_srcHost1, indexof(_srcHost1, ".") + 1, strlen(_srcHost1)),
          ""),
      ExtractedHostname = case(
          DomainType == "Windows", substring(_srcHost1, indexof(_srcHost1, "\\") + 1, strlen(_srcHost1)),
          DomainType == "FQDN",    substring(_srcHost1, 0, indexof(_srcHost1, ".")),
          _srcHost1)
  | project-away _srcHost1
  | extend
      ActingAppName = iff(isnotempty(Application), Application, Browser),
      ActingAppType = case(
          isnotempty(Application), "SaaS application",
          isnotempty(Browser), "Browser",
          "Other"),
      EventResult = case(
          Status =~ "Success", "Success",
          isempty(Status), "NA",
          "Failure"),
      EventResultDetails = case(
          Status =~ "Success" or isempty(Status), "",
          Status =~ "Invalid Password", "Incorrect password",
          tolower(Status) in ("password lockout", "user is frozen"), "User locked",
          Status =~ "User is Inactive", "User disabled",
          tolower(Status) in ("lightning login required", "multi-factor required", "passwordless login via passkeys required"), "MFA not satisfied",
          tolower(Status) in ("failed: not approved", "failed: not approved for access", "no community access", "restricted ip", "username-password flow disabled"), "Logon violates policy",
          "Other"),
      DvcAction = case(
          Status =~ "Success", "Allowed",
          isempty(Status), "",
          "Blocked")
  | extend
      LogonMethod = case(
          LoginSubType =~ "OAuth Client Credentials", "Service Principal",
          LoginSubType =~ "OAuth OTP Login"
              or tolower(Status) in ("lightning login required", "multi-factor required", "passwordless login via passkeys required")
              or AuthMethodReference contains "multipleauthn",
              "Multi factor authentication",
          AuthMethodReference contains "x509"
              or AuthMethodReference contains "smartcard",
              "PKI",
          LoginType contains "Passwordless"
              or AuthMethodReference contains "fido",
              "Passwordless",
          tolower(LoginSubType) in ("oauth username-password", "ui password reset", "ui username-password")
              or Status =~ "Invalid Password",
              "Username & Password",
          "Other"),
      LogonProtocol = case(
          LoginSubType contains "OAuth", "OAuth",
          LoginSubType contains "SOAP", "SOAP",
          LoginType contains "SAML", "SAML",
          LoginSubType startswith "UI", "Basic Auth",
          LoginSubType =~ "Internal Salesforce Authentication", "Salesforce",
          "Other"),
      EventSubType = case(
          LoginSubType contains "OAuth"
              or LoginSubType contains "SOAP"
              or tolower(LoginType) in ("application", "other apex api", "remote access 2.0", "remote access client", "salesforce outlook integration"),
              "Service",
          "Interactive"),
      SrcDeviceType = case(
          Platform startswith "Android"
              or tolower(Platform) in ("ios/mac", "ipad", "iphone"),
              "Mobile Device",
          Platform startswith "Windows"
              or tolower(Platform) in ("linux", "mac osx"),
              "Computer",
          isnotempty(Platform), "Other",
          "")
  | extend
      EventUid = hash_sha256(strcat(
          tostring(EventTime), "|",
          UserId, "|",
          SourceIp, "|",
          LoginType, "|",
          LoginSubType, "|",
          Application, "|",
          LoginUrl, "|",
          Status)),
      AdditionalFields = pack(
              "ApiType", ApiType,
              "ApiVersion", ApiVersion,
              "AuthMethodReference", AuthMethodReference,
              "Browser", Browser,
              "CipherSuite", CipherSuite,
              "ClientVersion", ClientVersion,
              "ForwardedForIp", ForwardedForIp,
              "LoginGeoId", LoginGeoId,
              "OptionsIsGet", OptionsIsGet,
              "OptionsIsPost", OptionsIsPost,
              "SourceIp", SourceIp,
              "LoginTime", LoginTime,
              "TlsProtocol", TlsProtocol
      )
  | project-rename
      ActingAppId = AuthenticationServiceId,
      ActingOriginalAppType = ApiType,
      EventOriginalSubType = LoginSubType,
      EventOriginalType = LoginType,
      EventProductVersion = ApiVersion,
      HttpUserAgent = Browser,
      SrcDvcOs = Platform,
      SrcGeoCountry = CountryIso,
      TargetAppId = NetworkId
  | project
      TimeGenerated,
      Type,
      EventCount = toint(1),
      EventEndTime = EventTime,
      EventMessage = Status,
      EventOriginalResultDetails = Status,
      EventOriginalSubType,
      EventOriginalType,
      EventProduct = "Salesforce Login History",
      EventProductVersion,
      EventResult,
      EventResultDetails,
      EventSchema = "Authentication",
      EventSchemaVersion = "1.0.0",
      EventStartTime = EventTime,
      EventSubType,
      EventType = "Logon",
      EventUid,
      EventVendor = "Salesforce",
      ActingAppId,
      ActingAppName,
      ActingAppType,
      ActingOriginalAppType,
      AdditionalFields,
      Dst = iif(isnotempty(FQDN), FQDN, tostring(ExtractedHostname)),
      Dvc = "Salesforce Login History",
      DvcAction,
      HttpUserAgent,
      IpAddr = NormalizedSourceIp,
      LogonMethod,
      LogonProtocol,
      LogonTarget = iif(isnotempty(FQDN), FQDN, tostring(ExtractedHostname)),
      Src = NormalizedSourceIp,
      SrcDeviceType,
      SrcDvcOs,
      SrcGeoCountry,
      SrcIpAddr = NormalizedSourceIp,
      TargetAppId,
      TargetDomain = tostring(Domain),
      TargetDomainType = DomainType,
      TargetFQDN = FQDN,
      TargetHostname = tostring(ExtractedHostname),
      TargetUrl,
      TargetUserId = UserId,
      TargetUserIdType = iff(isnotempty(UserId), "SalesforceId", ""),
      User = UserId
Change:
  Date: '2026-10-26'
  Description: 'Use DCR-supported parse_ipv4 and parse_ipv6 functions for source IP validation.'
