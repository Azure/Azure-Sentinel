Parser:
  DisplayName: Salesforce Login History Authentication ASIM ingestion-time parser
  Version: '0.1.0'
  LastUpdated: '2026-10-07'
Product:
  Name: Salesforce Login History
Normalization:
  Schema: Authentication
  Version: '1.0.0'
Author: Microsoft
Description: |
  Normalizes Salesforce login history events from the SalesforceLoginHistoryV2_CL raw-stream shape into the native ASimAuthenticationEventLogs table during ingestion.
ParserName: ASimAuthenticationSalesforceLoginHistoryV2
DCRType: Standard
InputStream: Custom-SalesforceLoginHistoryV2_CL
SourceRawTable: SalesforceLoginHistoryV2_CL
TargetASIMTable: ASimAuthenticationEventLogs
ParserFilterQuery: |
  source
ParserQuery: |
  source
  | extend TimeGenerated = iif(isnull(LoginTime), now(), todatetime(LoginTime))
  | extend NormalizedSourceIp = iif(
      SourceIp matches regex @"^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$"
          or (
              SourceIp contains ":"
              and SourceIp matches regex @"^[0-9A-Fa-f:]+$"
          ),
      SourceIp,
      "")
  | extend TargetUrl = iif(
      isempty(LoginUrl),
      "",
      iif(
          LoginUrl startswith "http://"
              or LoginUrl startswith "https://",
          LoginUrl,
          strcat("https://", LoginUrl)
      )
  )
  | extend SalesforceDomainUrl = iif(
      isempty(apiUrl),
      "",
      iif(
          apiUrl startswith "http://"
              or apiUrl startswith "https://",
          apiUrl,
          strcat("https://", apiUrl)
      )
  )
  | extend
      LoginUrlFQDN = extract(@"^https?://([^/:]+)", 1, TargetUrl),
      SalesforceDomainFQDN = extract(@"^https?://([^/:]+)", 1, SalesforceDomainUrl)
  | extend TargetFQDN = case(
      isnotempty(SalesforceDomainFQDN), SalesforceDomainFQDN,
      isnotempty(LoginUrlFQDN), LoginUrlFQDN,
      LoginUrl
  )
  | extend TargetHostParts = split(TargetFQDN, ".")
  | extend
      TargetHostname = iif(
          isempty(TargetFQDN),
          "",
          tostring(TargetHostParts[0])
      ),
      TargetDomain = iif(
          array_length(TargetHostParts) > 1,
          substring(TargetFQDN, indexof(TargetFQDN, ".") + 1),
          ""
      ),
      TargetDomainType = iif(
          array_length(TargetHostParts) > 1,
          "FQDN",
          ""
      ),
      TargetFQDN = iif(
          array_length(TargetHostParts) > 1,
          TargetFQDN,
          ""
      )
  | extend
      ActingAppName = iif(isnotempty(Application), Application, Browser),
      ActingAppType = case(
          isnotempty(Application), "SaaS application",
          isnotempty(Browser), "Browser",
          "Other"
      ),
      EventResult = case(
          Status =~ "Success", "Success",
          isempty(Status), "NA",
          "Failure"
      ),
      EventResultDetails = case(
          Status =~ "Success" or isempty(Status), "",
          Status =~ "Invalid Password", "Incorrect password",
          Status in ("Password Lockout", "User is Frozen"), "User locked",
          Status =~ "User is Inactive", "User disabled",
          Status in (
              "Lightning Login required",
              "Multi-factor required",
              "Passwordless Login via Passkeys required"
          ), "MFA not satisfied",
          Status in (
              "Failed: Not approved",
              "Failed: Not approved for access",
              "No community access",
              "Restricted IP",
              "Username-Password Flow Disabled"
          ), "Logon violates policy",
          "Other"
      ),
      DvcAction = case(
          Status =~ "Success", "Allowed",
          isempty(Status), "",
          "Blocked"
      )
  | extend
      LogonMethod = case(
          LoginSubType =~ "OAuth Client Credentials", "Service Principal",
          LoginSubType =~ "OAuth OTP Login"
              or Status in (
                  "Lightning Login required",
                  "Multi-factor required",
                  "Passwordless Login via Passkeys required"
              )
              or AuthMethodReference contains "multipleauthn",
              "Multi factor authentication",
          AuthMethodReference contains "x509"
              or AuthMethodReference contains "smartcard",
              "PKI",
          LoginType contains "Passwordless"
              or AuthMethodReference contains "fido",
              "Passwordless",
          LoginSubType in (
              "OAuth Username-Password",
              "UI Password Reset",
              "UI Username-Password"
          )
              or Status =~ "Invalid Password",
              "Username & Password",
          "Other"
      ),
      LogonProtocol = case(
          LoginSubType contains "OAuth", "OAuth",
          LoginSubType contains "SOAP", "SOAP",
          LoginType contains "SAML", "SAML",
          LoginSubType startswith "UI", "Basic Auth",
          LoginSubType =~ "Internal Salesforce Authentication", "Salesforce",
          "Other"
      ),
      EventSubType = case(
          LoginSubType contains "OAuth"
              or LoginSubType contains "SOAP"
              or LoginType in (
                  "Application",
                  "Other Apex API",
                  "Remote Access 2.0",
                  "Remote Access Client",
                  "Salesforce Outlook Integration"
              ),
              "Service",
          "Interactive"
      ),
      SrcDeviceType = case(
          Platform startswith "Android"
              or Platform in ("iOS/Mac", "iPad", "iPhone"),
              "Mobile Device",
          Platform startswith "Windows"
              or Platform in ("Linux", "Mac OSX"),
              "Computer",
          isnotempty(Platform), "Other",
          ""
      )
  | extend
      EventOriginalUid = hash_sha256(strcat(
          tostring(TimeGenerated), "|",
          UserId, "|",
          SourceIp, "|",
          LoginGeoId, "|",
          LoginType, "|",
          LoginSubType, "|",
          Application, "|",
          LoginUrl, "|",
          apiUrl, "|",
          Status
      )),
      TargetAppName = iif(isnotempty(TargetFQDN), TargetFQDN, "Salesforce"),
      TargetUsername = UserId,
      TargetUsernameType = iif(isnotempty(UserId), "Simple", ""),
      AdditionalFields = pack(
          "AuthMethodReference", AuthMethodReference,
          "CipherSuite", CipherSuite,
          "ClientVersion", ClientVersion,
          "ForwardedForIp", ForwardedForIp,
          "LoginGeoId", LoginGeoId,
          "LoginTime", LoginTime,
          "OptionsIsGet", OptionsIsGet,
          "OptionsIsPost", OptionsIsPost,
          "SourceIp", SourceIp,
          "TlsProtocol", TlsProtocol
      )
  | project-rename
      ActingAppId = AuthenticationServiceId,
      ActingOriginalAppType = ApiType,
      EventOriginalSubType = LoginSubType,
      EventOriginalType = LoginType,
      EventProductVersion = ApiVersion,
      HttpUserAgent = Browser,
      SrcDvcOs = Platform,
      SrcGeoCountry = CountryIso,
      TargetAppId = NetworkId,
      TargetUserId = UserId
  | project
      TimeGenerated,
      Type = "SalesforceLoginHistoryV2_CL",
      AdditionalFields,
      EventMessage = Status,
      EventCount = toint(1),
      EventStartTime = TimeGenerated,
      EventEndTime = TimeGenerated,
      EventType = "Logon",
      EventSubType,
      EventResult,
      EventResultDetails,
      EventOriginalUid,
      EventOriginalType,
      EventOriginalSubType,
      EventOriginalResultDetails = Status,
      EventProduct = "Salesforce Login History",
      EventProductVersion,
      EventVendor = "Salesforce",
      EventSchemaVersion = "1.0.0",
      DvcAction,
      ActingAppId,
      ActingAppName,
      ActingAppType,
      ActingOriginalAppType,
      HttpUserAgent,
      TargetUserId,
      TargetUserIdType = iif(isnotempty(TargetUserId), "SalesforceId", ""),
      TargetUsername,
      TargetUsernameType,
      TargetAppId,
      TargetAppName,
      TargetAppType = "SaaS application",
      TargetUrl,
      TargetHostname,
      TargetDomain,
      TargetDomainType,
      TargetFQDN,
      SrcIpAddr = NormalizedSourceIp,
      SrcDeviceType,
      SrcGeoCountry,
      SrcDvcOs,
      LogonMethod,
      LogonProtocol
Change:
  Date: '2026-10-07'
  Description: Initial ingestion-time parser converted from the merged Salesforce query-time ASIM parser.
