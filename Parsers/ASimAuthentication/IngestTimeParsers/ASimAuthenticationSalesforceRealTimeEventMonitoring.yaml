Parser:
  DisplayName: 'Authentication ASIM ingestion-time parser for Salesforce Real-Time Event Monitoring'
  Version: '0.1.0'
  LastUpdated: '2026-11-12'
Product:
  Name: 'Salesforce Real-Time Event Monitoring'
Normalization:
  Schema: 'Authentication'
  Version: '1.0.0'
Author: 'Microsoft'
Description: |
  Normalizes SalesForceRealTimeEventMonitoring_CL into ASimAuthenticationEventLogs during ingestion. Query-only fields are retained in AdditionalFields.QueryTimeFields; review documented lossy conversions.
ParserName: 'ASimAuthenticationSalesforceRealTimeEventMonitoring'
DCRType: 'Standard'
InputStream: 'Custom-SalesForceRealTimeEventMonitoring_CL'
SourceRawTable: 'SalesForceRealTimeEventMonitoring_CL'
TargetASIMTable: 'ASimAuthenticationEventLogs'
ParserFilterQuery: |
  source
  | where EventType in ("LoginEvent", "LoginAsEvent", "LogoutEvent", "IdentityVerificationEvent")
  | where LoginAsCategory != "LoginAccessChange"
ParserQuery: |
  source
  | extend Type = "SalesForceRealTimeEventMonitoring_CL"
  | extend
      SalesforceObjectId = columnifexists("SalesforceObjectId", columnifexists("Id", ""))
      , UserNameDetail = columnifexists("UserNameDetail", columnifexists("Username", ""))
      , SalesforceDomain = columnifexists("SalesforceDomain", columnifexists("apiUrl", ""))
      , SalesforceResourceId = columnifexists("SalesforceResourceId", columnifexists("ResourceId", ""))
      , TimeGenerated = columnifexists("TimeGenerated", iff(isempty(EventDate), now(), todatetime(EventDate)))
      | where EventType in (
          "LoginEvent"
          , "LoginAsEvent"
          , "LogoutEvent"
          , "IdentityVerificationEvent"
      )
      | where LoginAsCategory != "LoginAccessChange"
      | project-rename EventOriginalType = EventType
      | extend
          EventType = case(
              EventOriginalType == "LogoutEvent", "Logoff",
              EventOriginalType == "IdentityVerificationEvent"
                  and Activity != "Login",
                  "Elevate",
              "Logon"
          )
          , EventResult = case(
              PolicyOutcome in (
                  "Block"
                  , "MeteringBlock"
                  , "TwoFADenied"
                  , "TwoFAReportedDenied"
              )
                  or PolicyOutcome startswith "Failed",
                  "Failure",
              PolicyOutcome in ("TwoFAInitiated", "TwoFAInProgress"), "NA",
              EventOriginalType in ("LoginAsEvent", "LogoutEvent"), "Success",
              Status in ("Success", "Succeeded", "AutomatedSuccess"), "Success",
              isempty(Status) or Status in ("InProgress", "Initiated"), "NA",
              "Failure"
          )
          , EventResultDetails = case(
              PolicyOutcome in ("Block", "MeteringBlock"), "Logon violates policy",
              PolicyOutcome in ("TwoFADenied", "TwoFAReportedDenied"),
                  "MFA not satisfied",
              PolicyOutcome startswith "Failed", "Other",
              Status in (
                  ""
                  , "Success"
                  , "Succeeded"
                  , "AutomatedSuccess"
                  , "InProgress"
                  , "Initiated"
              ), "",
              Status in ("Invalid Password", "FailedInvalidPassword"), "Incorrect password",
              Status == "FailedInvalidCode", "Incorrect key",
              Status in (
                  "Password Lockout"
                  , "User is Frozen"
                  , "FailedPasswordLockout"
                  , "FailedTooManyAttempts"
              ), "User locked",
              Status == "User is Inactive", "User disabled",
              Status in (
                  "Lightning Login required"
                  , "Multi-factor required"
                  , "Passwordless Login via Passkeys required"
              ), "MFA not satisfied",
              Status in (
                  "Failed: Not approved"
                  , "Failed: Not approved for access"
                  , "No community access"
                  , "Restricted IP"
                  , "Restricted Time"
                  , "Username-Password Flow Disabled"
              ), "Logon violates policy",
              "Other"
          )
      | extend _SrcIpAddr = case(
          isnotnull(parse_ipv4(SourceIp)) or isnotempty(parse_ipv6(SourceIp)), SourceIp,
          strlen(SourceIp) == 32 and SourceIp startswith "00000000000000000000ffff",
              format_ipv4(tolong(strcat("0x", substring(SourceIp, 24, 8)))),
          strlen(SourceIp) == 32,
              strcat(
                  substring(SourceIp, 0, 4), ":", substring(SourceIp, 4, 4), ":"
                  , substring(SourceIp, 8, 4), ":", substring(SourceIp, 12, 4), ":"
                  , substring(SourceIp, 16, 4), ":", substring(SourceIp, 20, 4), ":"
                  , substring(SourceIp, 24, 4), ":", substring(SourceIp, 28, 4)
              ),
          ""
      )
  // NOTE(DCR-LOSSY: 3.34 parse_url) - host regex has no decoding and differs for malformed or IPv6 URLs
      | extend _DomainFQDN = tostring(extract(@"^[a-zA-Z][a-zA-Z0-9+.-]*://(?:[^@/]*@)?([^:/?#]*)", 1, columnifexists("SalesforceDomain", "")))
      | extend _DomainHostname = tostring(split(_DomainFQDN, ".")[0])
      | extend
      TargetUserType = case(
          UserType == "Standard", "Regular",
          UserType == "Guest", "Guest",
          UserType == "AutomatedProcess", "System",
          UserType == "CsnOnly", "Other",
          UserType == "CspLitePortal", "Other",
          UserType == "CustomerSuccess", "Other",
          UserType == "PowerCustomerSuccess", "Other",
          UserType == "PowerPartner", "Other",
          UserType == "SelfService", "Other",
          "")
      | extend
          EventSubType = case(
              EventOriginalType == "LoginAsEvent", "AssumeRole",
              LoginSubType in (
                  "OAuth Client Credentials"
                  , "OAuth Username-Password"
                  , "OAuth JWT Bearer Token"
                  , "SOAP API"
              )
                  or LoginType in ("Other Apex API", "Remote Access Client"),
                  "Service",
              LoginType == "Remote Access 2.0"
                  and isempty(LoginSubType)
                  and Application !in ("", "Browser", "N/A"),
                  "Service",
              EventOriginalType == "LogoutEvent", "",
              "Interactive"
          )
          , LogonMethod = case(
              EventOriginalType == "LoginEvent",
                  case(
                      LoginSubType == "OAuth Client Credentials", "Service Principal",
                      AuthMethodReference has "multipleauthn"
                          or LoginSubType == "OAuth OTP Login",
                          "Multi factor authentication",
                      (AuthMethodReference has "x509" or AuthMethodReference has "smartcard")
                          or LoginType == "Certificate-based login",
                          "PKI",
                      LoginType has "Passwordless" or AuthMethodReference has "fido",
                          "Passwordless",
                      LoginSubType in (
                          "UI Username-Password"
                          , "UI Password Reset"
                          , "OAuth Username-Password"
                          , "SOAP API"
                      )
                          or Status == "Invalid Password",
                          "Username & Password",
                      "Other"
                  ),
              EventOriginalType == "IdentityVerificationEvent",
                  case(
                      Policy startswith "Passwordless", "Passwordless",
                      VerificationMethod == "Password", "Username & Password",
                      "Multi factor authentication"
                  ),
              ""
          )
          , LogonProtocol = case(
              LoginType has "SAML", "SAML",
              LoginSubType has "OAuth" or LoginType has "Remote Access", "OAuth",
              LoginSubType has "SOAP" or LoginType == "Other Apex API", "SOAP",
              ""
          )
          , EventOriginalSubType = case(
              EventOriginalType == "LoginEvent", LoginType,
              EventOriginalType == "LoginAsEvent", LoginAsCategory,
              EventOriginalType == "IdentityVerificationEvent", Activity,
              ""
          )
          , ActingAppName = case(
              Application == "Browser", Browser,
              Application !in ("", "N/A"), Application,
              ""
          )
          , ActingAppType = case(
              Application == "Browser" and isnotempty(Browser), "Browser",
              Application !in ("", "N/A", "Browser"), "Other",
              ""
          )
          , SrcDeviceType = case(
              Platform startswith "Android"
                  or Platform in ("iOS/Mac", "iPad", "iPhone"),
                  "Mobile Device",
              Platform startswith "Windows"
                  or Platform in ("Linux", "Mac OSX"),
                  "Computer",
              Platform in ("", "Unknown"), "",
              "Other"
          )
          , DvcAction = case(
              PolicyOutcome in ("Block", "MeteringBlock"), "Blocked",
              EventOriginalType != "LoginEvent", "",
              EventResult == "Success", "Allowed",
              EventResult == "Failure", "Blocked",
              ""
          )
          , TargetUrl = case(
              EventOriginalType == "LoginEvent"
                  and (isempty(LoginUrl) or LoginUrl startswith "http"),
                  LoginUrl,
              EventOriginalType == "LoginEvent", strcat("https://", LoginUrl),
              TargetUrl startswith "http", TargetUrl,
              ""
          )
          , AdditionalFields = pack(
                  "SessionKey", SessionKey
                  , "SessionLevel", SessionLevel
                  , "LoginHistoryId", LoginHistoryId
                  , "LoginType", LoginType
                  , "LoginSubType", LoginSubType
                  , "LoginGeoId", LoginGeoId
                  , "PostalCode", PostalCode
                  , "AuthMethodReference", AuthMethodReference
                  , "AuthServiceId", AuthServiceId
                  , "ApiType", ApiType
                  , "ApiVersion", ApiVersion
                  , "ClientVersion", ClientVersion
                  , "HttpMethod", HttpMethod
                  , "CipherSuite", CipherSuite
                  , "TlsProtocol", TlsProtocol
                  , "ForwardedForIp", ForwardedForIp
                  , "Policy", Policy
                  , "PolicyId", PolicyId
                  , "PolicyOutcome", PolicyOutcome
                  , "VerificationMethod", VerificationMethod
                  , "EventGroup", EventGroup
                  , "RelatedEventIdentifier", RelatedEventIdentifier
              )
      | project-rename
          EventOriginalUid = EventIdentifier
          , EventOriginalResultDetails = Status
          , TargetUserId = UserId
          , TargetUsername = UserNameDetail
          , TargetOriginalUserType = UserType
          , TargetSessionId = LoginKey
          , ActorUsername = DelegatedUsername
          , ActorScopeId = DelegatedOrganizationId
          , SrcDvcOs = Platform
          , SrcGeoCity = City
          , SrcGeoCountry = CountryIso
          , SrcGeoRegion = Subdivision
      | extend
  // NOTE(DCR-LOSSY: 3.4 coalesce) - nonstring null-only fallback conservatively requires semantic review
          EventStartTime = iif(isnotnull(EventDate), EventDate, TimeGenerated)
          , TargetUsernameType = case(
              isempty(TargetUsername), "",
              TargetUsername has "@", "UPN",
              "Simple"
          )
          , ActorUsernameType = case(
              isempty(ActorUsername), "",
              ActorUsername has "@", "UPN",
              "Simple"
          )
      | project
          TimeGenerated
          , Type
          , EventCount = toint(1)
          , EventStartTime
          , EventEndTime = EventStartTime
          , EventType
          , EventSubType
          , EventResult
          , EventResultDetails
          , EventOriginalResultDetails
          , EventOriginalType
          , EventOriginalSubType
          , EventOriginalUid
  // NOTE(DCR-LOSSY: X.2 EventUid) - source EventIdentifier replaces storage-assigned identity; manual review required
          , EventUid = tostring(EventOriginalUid)
          , EventSeverity = iff(EventResult == "Failure", "Low", "Informational")
          , EventProduct = "Real-Time Event Monitoring"
          , EventVendor = "Salesforce"
          , EventSchema = "Authentication"
          , EventSchemaVersion = "1.0.0"
          , Dvc = iif(isnotempty(_DomainFQDN), _DomainFQDN, "Salesforce")
          , DvcFQDN = _DomainFQDN
          , DvcHostname = _DomainHostname
          , DvcDomain = substring(_DomainFQDN, strlen(_DomainHostname) + 1)
          , DvcDomainType = iff(isnotempty(_DomainFQDN), "FQDN", "")
          , DvcAction
          , DvcOriginalAction = PolicyOutcome
          , TargetAppName = "Salesforce"
          , TargetAppType = "SaaS application"
          , Application = "Salesforce"
          , TargetFQDN = _DomainFQDN
          , TargetHostname = _DomainHostname
          , TargetDomain = substring(_DomainFQDN, strlen(_DomainHostname) + 1)
          , TargetDomainType = iff(isnotempty(_DomainFQDN), "FQDN", "")
          , Dst = iif(isnotempty(_DomainFQDN), _DomainFQDN, "Salesforce")
          , LogonTarget = iif(isnotempty(TargetUrl), TargetUrl, "Salesforce")
          , TargetUrl
          , TargetUserId
          , TargetUserIdType = iff(isnotempty(TargetUserId), "SalesforceId", "")
          , TargetUsername
          , TargetUsernameType
          , TargetUserType
          , TargetOriginalUserType
          , TargetSessionId
          , User = iif(isnotempty(TargetUsername), TargetUsername, TargetUserId)
          , ActorUsername
          , ActorUsernameType
          , ActorScopeId
          , ActingAppName
          , ActingAppType
          , LogonMethod
          , LogonProtocol
          , SrcIpAddr = _SrcIpAddr
          , Src = _SrcIpAddr
          , IpAddr = _SrcIpAddr
          , SrcDvcOs = iff(SrcDvcOs == "Unknown", "", SrcDvcOs)
          , SrcDeviceType
          , SrcGeoCity
          , SrcGeoCountry
          , SrcGeoRegion
  // NOTE(DCR-LOSSY: 3.4 coalesce) - nonstring null-only fallback conservatively requires semantic review
          , SrcGeoLatitude = iif(isnotnull(LoginLatitude), LoginLatitude, Latitude)
  // NOTE(DCR-LOSSY: 3.4 coalesce) - nonstring null-only fallback conservatively requires semantic review
          , SrcGeoLongitude = iif(isnotnull(LoginLongitude), LoginLongitude, Longitude)
          , AdditionalFields
  // NOTE(DCR-LOSSY: storage projection) - query-only fields preserved in AdditionalFields.QueryTimeFields
  | extend AdditionalFields = bag_merge(AdditionalFields, pack("QueryTimeFields", pack("EventUid", EventUid, "EventSchema", EventSchema, "Dvc", Dvc, "Application", Application, "Dst", Dst, "LogonTarget", LogonTarget, "User", User, "Src", Src, "IpAddr", IpAddr)))
  | project TimeGenerated, Type, EventCount, EventStartTime, EventEndTime, EventType, EventSubType, EventResult, EventResultDetails, EventOriginalResultDetails, EventOriginalType, EventOriginalSubType, EventOriginalUid, EventSeverity, EventProduct, EventVendor, EventSchemaVersion, DvcFQDN, DvcHostname, DvcDomain, DvcDomainType, DvcAction, DvcOriginalAction, TargetAppName, TargetAppType, TargetFQDN, TargetHostname, TargetDomain, TargetDomainType, TargetUrl, TargetUserId, TargetUserIdType, TargetUsername, TargetUsernameType, TargetUserType, TargetOriginalUserType, TargetSessionId, ActorUsername, ActorUsernameType, ActorScopeId, ActingAppName, ActingAppType, LogonMethod, LogonProtocol, SrcIpAddr, SrcDvcOs, SrcDeviceType, SrcGeoCity, SrcGeoCountry, SrcGeoRegion, SrcGeoLatitude, SrcGeoLongitude, AdditionalFields
Change:
  Date: '2026-11-12'
  Description: 'Initial per-table ingestion-time definition with query-only values preserved in AdditionalFields.QueryTimeFields.'
