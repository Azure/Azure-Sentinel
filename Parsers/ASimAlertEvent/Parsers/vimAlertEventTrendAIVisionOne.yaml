Parser:
  Title: Alert Event ASIM filtering parser for TrendAI VisionOne
  Version: '0.1.0'
  LastUpdated: Nov 27, 2026
Product:
  Name: TrendAI Vision One
Normalization:
  Schema: AlertEvent
  Version: '0.1.0'
References:
- Title: ASIM Alert Event Schema
  Link: https://aka.ms/ASimAlertEventDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
- Title: Developer
  Link: https://www.bluevoyant.com/
Description: |
  This ASIM parser supports normalizing and filtering TrendAI Workbench Alerts ingested in TrendAI_XDR_WORKBENCH_V2_CL table (via Codeless Connector Framework) to the ASIM Alert normalized schema.
ParserName: vimAlertEventTrendAIVisionOne
EquivalentBuiltInParser: _Im_AlertEvent_TrendAIVisionOne
ParserParams:
  - Name: starttime
    Type: datetime
    Default: datetime(null)
  - Name: endtime
    Type: datetime
    Default: datetime(null)
  - Name: ipaddr_has_any_prefix
    Type: dynamic
    Default: dynamic([])
  - Name: hostname_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: username_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: attacktactics_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: attacktechniques_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: threatcategory_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: alertverdict_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: eventseverity_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: disabled
    Type: bool
    Default: false
  - Name: pack
    Type: bool
    Default: false
ParserQuery: |
  let parser = (
      starttime: datetime=datetime(null),
      endtime: datetime=datetime(null),
      ipaddr_has_any_prefix: dynamic=dynamic([]),
      hostname_has_any: dynamic=dynamic([]),
      username_has_any: dynamic=dynamic([]),
      attacktactics_has_any: dynamic=dynamic([]),
      attacktechniques_has_any: dynamic=dynamic([]),
      threatcategory_has_any: dynamic=dynamic([]),
      alertverdict_has_any: dynamic=dynamic([]),
      eventseverity_has_any: dynamic=dynamic([]),
      disabled:bool=false,
      pack: bool = false
  ){
  TrendAI_XDR_WORKBENCH_V2_CL
  | where not(disabled)
  | where (isnull(starttime) or TimeGenerated >= starttime)
      and (isnull(endtime) or TimeGenerated <= endtime)
  | where (array_length(eventseverity_has_any) == 0) or (
      ("High" in (eventseverity_has_any) and severity_s in ("high", "critical"))
      or ("Medium" in (eventseverity_has_any) and severity_s =~ "medium")
      or ("Low" in (eventseverity_has_any) and severity_s =~ "low")
      or ("Informational" in (eventseverity_has_any) and severity_s =~ "informational")
  )
  | where array_length(threatcategory_has_any) == 0 // Source has no threat category data
  | project-rename 
      EventStartTime = createdTime_t
      , EventEndTime = updatedTime_t
      , EventUid = workbenchId_s
      , EventSeverity = severity_s
      , EventMessage = description_s
      , EventOwner = xdrCustomerID_g
      , RuleName = model_s
      , AlertName = workbenchName_s
      , ThreatName = MalwareName_s
      , EventReportUrl = workbenchLink_s
  | extend
      EventResult = "Success"
      , EventType = "Alert"
      , EventVendor = "TrendAI"
      , EventProduct = "Vision One"
      , EventSchema = "AlertEvent"
      , EventSchemaVersion = "1.0.0"
      , EventCount = int(1)
      , ThreatRiskLevel = toint(priorityScore_d)
      , RuleNumber = toint(modelId_g)
      , AlertOriginalStatus = alertStatus_s
  | extend 
      AlertStatus = 
          case(
              alertStatus_s in~("new","in_progress"), "Active",
              alertStatus_s =~ "resolved", "Closed",
              "Active"
          )
      , AlertVerdict = 
          case(
              investigationResult_s =~ "True Positive", "True Positive",
              investigationResult_s =~ "False Positive", "False Positive",
              investigationResult_s has "Benign", "Benign Positive",
              "Unknown"
          )
  | where (array_length(alertverdict_has_any) == 0 or AlertVerdict has_any (alertverdict_has_any))
  //parse host and user
  | mv-apply entities on (
      extend type = tostring(entities.entityType)
      | extend value = entities.entityValue
      | summarize value = make_list(value) by type
      | summarize entities = make_bag(bag_pack(type, value))
  )
  | extend 
      Username = coalesce(UserAccountName_s, tostring(entities.account[0]))
      , DvcIpAddr = tostring(entities.host[0].ips[0])
      , host_ = coalesce(HostHostName_s, tostring(entities.host[0].name))
  | where (array_length(username_has_any) == 0 or Username has_any (username_has_any))
  | where (array_length(ipaddr_has_any_prefix) == 0 or has_any_ipv4_prefix(DvcIpAddr, ipaddr_has_any_prefix))
  | extend 
      DvcHostname = 
          case (
              host_ contains "\\", split(host_,"\\")[1],
              host_ contains ".", split(host_,".")[0],
              host_
          )
      , DvcDomain = 
          case (
              host_ contains "\\", split(host_,"\\")[0],
              host_ contains ".", tostring(strcat_array(array_slice(split(host_,"."), 1, -1), '.')),
              ""
          )
      , DvcDomainType = 
          case(
              host_ contains "\\", "Windows",
              host_ contains ".", "FQDN",
              ""
          )
      , UsernameType = 
          case(
              Username contains "@", "UPN",
              Username contains "\\", "Windows",
              Username contains "OU=", "DN",
              Username matches regex @"^\d{11}$","AWSId",
              "Simple"
          )
  | where array_length(hostname_has_any) == 0 or DvcHostname has_any (hostname_has_any)
  //parse indicators
  | mv-apply indicators on (
      extend type = tostring(indicators.type)
      | extend value = tostring(indicators.value)
      | summarize value = make_list(value) by type
      | summarize indicators = make_bag(bag_pack(type, value))
  )
  | extend 
      ProcessCommandLine = coalesce(ProcessCommandLine_s, indicators.command_line)
      , FileName = coalesce(FileName_s, indicators.filename)
      , FilePath = coalesce(FileDirectory_s, indicators.fullpath)
      , FileSHA1 = tostring(indicators.file_sha1)
      , FileSHA256 = tostring(indicators.file_sha256)
      , Url = coalesce(URL_s, indicators.url)
      , RegistryKey = coalesce(RegistryKey_s, indicators.registry_key) 
      , RegistryValue = coalesce(RegistryValueName_s, indicators.registry_value)  
      , RegistryValueData = coalesce(RegistryValue_s, indicators.registry_value_data)
  //parse mitre
  | mv-apply matched_rule = matchedRules on(
      extend mitre_id = matched_rule.matchedFilters[0].mitreTechniqueIds
      | summarize AttackTechniques = strcat_array(make_set(mitre_id),", ")
  )
  | where array_length(attacktactics_has_any) == 0 // Source has no MITRE tactic data
  | where array_length(attacktechniques_has_any) == 0 or AttackTechniques has_any (attacktechniques_has_any)
  //additional details
  | extend AdditionalFields = 
      iff(pack == true,
          bag_pack(
              "AlertTriggerTimestamp_t", alertTriggerTimestamp_t,
              "IncidentId", incidentId_s,
              "InvestigationStatus", investigationStatus_s,
              "AlertOriginalVerdict", investigationResult_s,
              "AlertProvider",alertProvider_s,
              "ModelType", modelType_s,
              "SchemaVersion", schemaVersion_s,
              "SourceSystem", SourceSystem,
              "TenantId", TenantId,
              "WorkbenchCompleteTimestamp", workbenchCompleteTimestamp_t,
              "UserAccountNTDomain", UserAccountNTDomain_s,
              "MailboxPrimaryAddress", MailboxPrimaryAddress_s,
              "FileHashValue",FileHashValue_s,
              "DomainNameIOC", DomainName_s,
              "IPAddressIOC", IPAddress,
              "ImpactScope", impactScope_s,
              "RawData", RawData,
              "Indicators", indicators,
              "Entities", entities,
              "MatchedRules", matchedRules
          )
          , dynamic({}))
  //alias
  | extend 
      AlertDescription = EventMessage
      , AlertId = EventUid
      , Dvc = DvcHostname
      , Rule = RuleName
      , Hostname = DvcHostname
      , IpAddr = DvcIpAddr
      , User = Username
  | project-away *_*,IPAddress,Computer,MG, ManagementGroupName,RawData,SourceSystem,TenantId, entities, indicators, matchedRules
  | project-reorder
      TimeGenerated
      , EventSeverity
      , AlertId
      , AlertName
      , AlertDescription
      , AlertVerdict
      , AlertStatus
      , AlertOriginalStatus
      , ThreatRiskLevel
      , DvcHostname
      , DvcDomain
      , DvcDomainType
      , DvcIpAddr
      , Username
      , UsernameType
      , ProcessCommandLine
      , FileName
      , FilePath
      , FileSHA1
      , FileSHA256
      , Url
      , RegistryKey
      , RegistryValue
      , RegistryValueData
      , IpAddr
      , User
      , Rule
      , RuleNumber
      , RuleName
      , EventReportUrl
      , EventUid
      , EventType
      , EventCount
      , EventMessage
      , EventStartTime
      , EventEndTime
      , EventProduct
      , EventVendor
      , EventResult
      , EventSchema
      , EventSchemaVersion
      , Type
      , Dvc
      , Hostname
      , AdditionalFields 
  };
  parser(
      starttime=starttime
      , endtime=endtime
      , ipaddr_has_any_prefix=ipaddr_has_any_prefix
      , hostname_has_any=hostname_has_any
      , username_has_any=username_has_any
      , attacktactics_has_any=attacktactics_has_any
      , attacktechniques_has_any=attacktechniques_has_any
      , threatcategory_has_any=threatcategory_has_any
      , alertverdict_has_any=alertverdict_has_any
      , eventseverity_has_any=eventseverity_has_any
      , disabled=disabled
      , pack=pack
  )