Parser:
  Title: Alert Event ASIM filtering parser for Microsoft Sentinel native Alert Event table
  Version: '0.1.0'
  LastUpdated: Nov 04, 2026
Product:
  Name: Native
Normalization:
  Schema: AlertEvent
  Version: '0.1.0'
References:
  - Title: Native Alert Event table
    Link: https://learn.microsoft.com/azure/azure-monitor/reference/tables/asimalerteventlogs
  - Title: ASIM Alert Event Schema
    Link: https://aka.ms/ASimAlertEventDoc
Description: |
  This ASIM parser supports normalizing the native Alert Event table (ASimAlertEventLogs) to the ASIM Alert Event normalized schema. While the native table is ASIM compliant, the parser is needed to add capabilities, such as aliases, available only at query time.
ParserName: vimAlertEventNative
EquivalentBuiltInParser: _Im_AlertEvent_Native
ParserParams:
  - Name: starttime
    Type: datetime
    Default: datetime(null)
  - Name: endtime
    Type: datetime
    Default: datetime(null)
  - Name: ipaddr_has_any_prefix
    Type: dynamic
    Default: dynamic([])
  - Name: hostname_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: username_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: attacktactics_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: attacktechniques_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: threatcategory_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: alertverdict_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: eventseverity_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: disabled
    Type: bool
    Default: false
  - Name: pack
    Type: bool
    Default: false
ParserQuery: |
  let parser = (
      starttime:datetime=datetime(null), endtime:datetime=datetime(null),
      ipaddr_has_any_prefix:dynamic=dynamic([]), hostname_has_any:dynamic=dynamic([]),
      username_has_any:dynamic=dynamic([]), attacktactics_has_any:dynamic=dynamic([]),
      attacktechniques_has_any:dynamic=dynamic([]), threatcategory_has_any:dynamic=dynamic([]),
      alertverdict_has_any:dynamic=dynamic([]), eventseverity_has_any:dynamic=dynamic([]),
      disabled:bool=false, pack:bool=false) {
    ASimAlertEventLogs
    | where not(disabled)
    | where isnull(starttime) or coalesce(EventStartTime, TimeGenerated) >= starttime
    | where isnull(endtime) or coalesce(EventEndTime, TimeGenerated) <= endtime
    | where array_length(ipaddr_has_any_prefix) == 0
        or has_any_ipv4_prefix(DvcIpAddr, ipaddr_has_any_prefix)
    | where array_length(hostname_has_any) == 0
        or DvcHostname has_any (hostname_has_any) or DvcFQDN has_any (hostname_has_any)
    | where array_length(username_has_any) == 0 or Username has_any (username_has_any)
    | where array_length(attacktactics_has_any) == 0 or AttackTactics has_any (attacktactics_has_any)
    | where array_length(attacktechniques_has_any) == 0 or AttackTechniques has_any (attacktechniques_has_any)
    | where array_length(threatcategory_has_any) == 0 or ThreatCategory has_any (threatcategory_has_any)
    | where array_length(alertverdict_has_any) == 0 or AlertVerdict has_any (alertverdict_has_any)
    | where array_length(eventseverity_has_any) == 0 or EventSeverity has_any (eventseverity_has_any)
    | extend
        EventSchema = "AlertEvent",
        EventStartTime = coalesce(EventStartTime, TimeGenerated),
        EventEndTime = coalesce(EventEndTime, TimeGenerated),
        Dvc = coalesce(DvcFQDN, DvcHostname, DvcIpAddr, DvcId, _ResourceId),
        FileSize = tolong(FileSize),
        AdditionalFields = iff(pack, AdditionalFields, dynamic({}))
    | extend
        AlertId = EventUid,
        AlertDescription = EventMessage,
        Hostname = DvcHostname,
        IpAddr = DvcIpAddr,
        User = Username,
        Rule = coalesce(RuleName, tostring(RuleNumber))
    | project
        TimeGenerated, Type, EventUid, EventOriginalUid, EventSchema, EventSchemaVersion,
        EventStartTime, EventEndTime, EventCount, EventVendor, EventProduct,
        EventProductVersion, EventType, EventSubType, EventResult, EventResultDetails,
        EventOriginalType, EventOriginalSubType, EventOriginalResultDetails,
        EventSeverity, EventOriginalSeverity, EventMessage, EventOwner, EventReportUrl,
        Dvc, DvcIpAddr, DvcHostname, DvcDomain, DvcDomainType, DvcFQDN,
        DvcDescription, DvcId, DvcIdType, DvcMacAddr, DvcZone, DvcOs, DvcOsVersion,
        DvcAction, DvcOriginalAction, DvcInterface, DvcScopeId, DvcScope, DvcEntityKey,
        AlertId, AlertName, AlertDescription, AlertVerdict, AlertStatus, AlertOriginalStatus,
        DetectionMethod, Rule, RuleNumber, RuleName, RuleDescription,
        ThreatId, ThreatName, ThreatFirstReportedTime, ThreatLastReportedTime,
        ThreatCategory, ThreatOriginalCategory, ThreatIsActive, ThreatRiskLevel,
        ThreatOriginalRiskLevel, ThreatConfidence, ThreatOriginalConfidence,
        IndicatorType, IndicatorAssociation, AttackTactics, AttackTechniques,
        AttackRemediationSteps, UserId, UserIdType, Username, User, UsernameType,
        UserType, OriginalUserType, UserSessionId, UserScopeId, UserScope,
        UserEntityKey, UserAdditionalIds, ProcessId, ProcessCommandLine,
        ProcessName, ProcessFileCompany, ProcessEntityKey, FileName, FilePath,
        FileSHA1, FileSHA256, FileMD5, FileSize, FileEntityKey, Url,
        RegistryKey, RegistryValue, RegistryValueData, RegistryValueType,
        EmailMessageId, EmailSubject, Hostname, IpAddr, AdditionalEntities, AdditionalFields
  };
  parser(starttime=starttime, endtime=endtime, ipaddr_has_any_prefix=ipaddr_has_any_prefix,
      hostname_has_any=hostname_has_any, username_has_any=username_has_any,
      attacktactics_has_any=attacktactics_has_any, attacktechniques_has_any=attacktechniques_has_any,
      threatcategory_has_any=threatcategory_has_any, alertverdict_has_any=alertverdict_has_any,
      eventseverity_has_any=eventseverity_has_any, disabled=disabled, pack=pack)
