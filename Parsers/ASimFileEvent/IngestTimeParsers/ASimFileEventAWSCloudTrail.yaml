Parser:
  DisplayName: 'FileEvent ASIM parser for AWS Cloud Trail'
  Version: '0.1.0'
  LastUpdated: '2026-10-24'
Product:
  Name: 'AWS Cloud Trail'
Normalization:
  Schema: 'FileEvent'
  Version: '0.2.2'
Author: 'Microsoft'
Description: |
  Normalizes AWS Cloud Trail FileEvent events from AWSCloudTrail into ASimFileEventLogs during ingestion. EventUid is populated directly from AwsEventId, matching the query-time parser.
ParserName: 'ASimFileEventAWSCloudTrail'
DCRType: 'Workspace'
InputStream: 'Microsoft-AWSCloudTrail'
SourceRawTable: 'AWSCloudTrail'
TargetASIMTable: 'ASimFileEventLogs'
ParserFilterQuery: |
  source
  | where EventSource == "s3.amazonaws.com" and EventName in ("CompleteMultipartUpload", "CopyObject", "CreateBucket", "CreateBucketMetadataConfiguration", "CreateBucketMetadataTableConfiguration", "CreateMultipartUpload", "DeleteBucket", "DeleteBucketAnalyticsConfiguration", "DeleteBucketCors", "DeleteBucketEncryption", "DeleteBucketIntelligentTieringConfiguration", "DeleteBucketInventoryConfiguration", "DeleteBucketLifecycle", "DeleteBucketMetadataConfiguration", "DeleteBucketMetadataTableConfiguration", "DeleteBucketMetricsConfiguration", "DeleteBucketOwnershipControls", "DeleteBucketPolicy", "DeleteBucketReplication", "DeleteBucketTagging", "DeleteBucketWebsite", "DeleteObject", "DeleteObjects", "DeleteObjectTagging", "DeletePublicAccessBlock", "GetBucketAbac", "GetBucketAccelerateConfiguration", "GetBucketAcl", "GetBucketAnalyticsConfiguration", "GetBucketCors", "GetBucketEncryption", "GetBucketIntelligentTieringConfiguration", "GetBucketInventoryConfiguration", "GetBucketLifecycle", "GetBucketLifecycleConfiguration", "GetBucketLocation", "GetBucketLogging", "GetBucketMetadataConfiguration", "GetBucketMetadataTableConfiguration", "GetBucketMetricsConfiguration", "GetBucketNotification", "GetBucketNotificationConfiguration", "GetBucketOwnershipControls", "GetBucketPolicy", "GetBucketPolicyStatus", "GetBucketReplication", "GetBucketRequestPayment", "GetBucketTagging", "GetBucketVersioning", "GetBucketWebsite", "GetObject", "GetObjectAcl", "GetObjectAttributes", "GetObjectLegalHold", "GetObjectLockConfiguration", "GetObjectRetention", "GetObjectTagging", "GetObjectTorrent", "GetPublicAccessBlock", "HeadBucket", "HeadObject", "ListBucketAnalyticsConfigurations", "ListBucketIntelligentTieringConfigurations", "ListBucketMetricsConfigurations", "ListBuckets", "ListDirectoryBuckets", "ListObjects", "ListObjectsV2", "ListObjectVersions", "ListParts", "PutBucketAbac", "PutBucketAccelerateConfiguration", "PutBucketAcl", "PutBucketAnalyticsConfiguration", "PutBucketCors", "PutBucketEncryption", "PutBucketIntelligentTieringConfiguration", "PutBucketInventoryConfiguration", "PutBucketLifecycle", "PutBucketLifecycleConfiguration", "PutBucketLogging", "PutBucketMetricsConfiguration", "PutBucketNotification", "PutBucketNotificationConfiguration", "PutBucketOwnershipControls", "PutBucketPolicy", "PutBucketReplication", "PutBucketRequestPayment", "PutBucketTagging", "PutBucketVersioning", "PutBucketWebsite", "PutObject", "PutObjectAcl", "PutObjectLegalHold", "PutObjectLockConfiguration", "PutObjectRetention", "PutObjectTagging", "PutPublicAccessBlock", "RenameObject", "RestoreObject", "SelectObjectContent", "UpdateBucketMetadataInventoryTableConfiguration", "UpdateBucketMetadataJournalTableConfiguration", "UpdateObjectEncryption", "UploadPart", "UploadPartCopy")
ParserQuery: |
  source
  | extend Type = "AWSCloudTrail"
  | where EventSource == "s3.amazonaws.com"
  | extend RequestParameters = todynamic(RequestParameters), ResponseElements = todynamic(ResponseElements), Resources = todynamic(Resources)
      | where EventSource == "s3.amazonaws.com"
      | extend EventType = case(
      EventName in ("CompleteMultipartUpload", "CreateMultipartUpload", "PutObject", "RestoreObject", "UploadPart", "UploadPartCopy"), "FileCreated",
      EventName == "CopyObject", "FileCopied",
      EventName == "CreateBucket", "FolderCreated",
      EventName in ("CreateBucketMetadataConfiguration", "CreateBucketMetadataTableConfiguration", "DeleteBucketAnalyticsConfiguration", "DeleteBucketCors", "DeleteBucketEncryption", "DeleteBucketIntelligentTieringConfiguration", "DeleteBucketInventoryConfiguration", "DeleteBucketLifecycle", "DeleteBucketMetadataConfiguration", "DeleteBucketMetadataTableConfiguration", "DeleteBucketMetricsConfiguration", "DeleteBucketOwnershipControls", "DeleteBucketPolicy", "DeleteBucketReplication", "DeleteBucketTagging", "DeleteBucketWebsite", "PutBucketAbac", "PutBucketAccelerateConfiguration", "PutBucketAcl", "PutBucketAnalyticsConfiguration", "PutBucketCors", "PutBucketEncryption", "PutBucketIntelligentTieringConfiguration", "PutBucketInventoryConfiguration", "PutBucketLifecycle", "PutBucketLifecycleConfiguration", "PutBucketLogging", "PutBucketMetricsConfiguration", "PutBucketNotification", "PutBucketNotificationConfiguration", "PutBucketOwnershipControls", "PutBucketPolicy", "PutBucketReplication", "PutBucketRequestPayment", "PutBucketTagging", "PutBucketVersioning", "PutBucketWebsite", "PutPublicAccessBlock", "UpdateBucketMetadataInventoryTableConfiguration", "UpdateBucketMetadataJournalTableConfiguration"), "FolderModified",
      EventName == "DeleteBucket", "FolderDeleted",
      EventName in ("DeleteObject", "DeleteObjects"), "FileDeleted",
      EventName in ("DeleteObjectTagging", "DeletePublicAccessBlock", "PutObjectAcl", "PutObjectLegalHold", "PutObjectLockConfiguration", "PutObjectRetention", "PutObjectTagging", "UpdateObjectEncryption"), "FileAttributesUpdated",
      EventName in ("GetBucketAbac", "GetBucketAccelerateConfiguration", "GetBucketAcl", "GetBucketAnalyticsConfiguration", "GetBucketCors", "GetBucketEncryption", "GetBucketIntelligentTieringConfiguration", "GetBucketInventoryConfiguration", "GetBucketLifecycle", "GetBucketLifecycleConfiguration", "GetBucketLocation", "GetBucketLogging", "GetBucketMetadataConfiguration", "GetBucketMetadataTableConfiguration", "GetBucketMetricsConfiguration", "GetBucketNotification", "GetBucketNotificationConfiguration", "GetBucketOwnershipControls", "GetBucketPolicy", "GetBucketPolicyStatus", "GetBucketReplication", "GetBucketRequestPayment", "GetBucketTagging", "GetBucketVersioning", "GetBucketWebsite", "GetPublicAccessBlock", "HeadBucket", "ListBucketAnalyticsConfigurations", "ListBucketIntelligentTieringConfigurations", "ListBucketMetricsConfigurations", "ListBuckets", "ListDirectoryBuckets"), "FolderAttributesAccessed",
      EventName in ("GetObject", "GetObjectAcl", "GetObjectAttributes", "GetObjectLegalHold", "GetObjectLockConfiguration", "GetObjectRetention", "GetObjectTagging", "GetObjectTorrent", "HeadObject", "ListObjects", "ListObjectsV2", "ListObjectVersions", "ListParts", "SelectObjectContent"), "FileAccessed",
      EventName == "RenameObject", "FileRenamed",
      ""),
      EventSubType = case(
      EventName in ("CompleteMultipartUpload", "CreateMultipartUpload"), "Checkin",
      EventName == "GetObject", "Download",
      EventName in ("PutObject", "UploadPart", "UploadPartCopy"), "Upload",
      "")
      | where isnotempty(EventType)
      | extend EventSubType = case(
          EventType == "FileDeleted" and ResponseElements["x-amz-delete-marker"] == true, "Versions",
          EventSubType
      )
      | extend
          TargetFileDirectory = tostring(RequestParameters.bucketName),
          TargetFileName = iif(isnotempty(tostring(RequestParameters.key)), tostring(RequestParameters.key), tostring(RequestParameters.prefix))
      | extend
          TargetFilePathType = "Unix",
          TargetFilePath = strcat(TargetFileDirectory, "/", TargetFileName),
          TargetAppType = "Service"
      | extend
          SrcFilePath = tostring(RequestParameters["x-amz-copy-source"])
      | extend AdditionalData = pack(
          "BucketARN", iif(isnotempty(iff(Resources[0].type == "AWS::S3::Bucket", tostring(Resources[0].ARN), "")), iff(Resources[0].type == "AWS::S3::Bucket", tostring(Resources[0].ARN), ""), iff(Resources[1].type == "AWS::S3::Bucket", tostring(Resources[1].ARN), "")),
          "ObjectARN", iif(isnotempty(iff(Resources[0].type == "AWS::S3::Object", tostring(Resources[0].ARN), "")), iff(Resources[0].type == "AWS::S3::Object", tostring(Resources[0].ARN), ""), iff(Resources[1].type == "AWS::S3::Object", tostring(Resources[1].ARN), ""))
      )
  | extend
      Type = "AWSCloudTrail",
      EventCount = int(1),
      EventStartTime = TimeGenerated,
      EventEndTime = TimeGenerated,
      EventSeverity = "Informational",
      EventSchema = "FileEvent",
      EventSchemaVersion = "0.2.2",
      EventVendor = "AWS",
      EventProduct = "CloudTrail",
      Dvc = "CloudTrail",
      EventResult = iff(isempty(ErrorCode) and isempty(ErrorMessage), "Success", "Failure"),
      EventMessage = ErrorMessage
  | extend TargetAppName = case(EventSource == "s3.amazonaws.com", "Amazon S3", "")
  | project-rename
      EventOriginalSubType = EventTypeName,
      EventOriginalType = EventName,
      EventUid = AwsEventId,
      EventOriginalResultDetails = ErrorMessage,
      EventProductVersion = EventVersion
  | project-rename
      ActorUserId = UserIdentityAccountId,
      ActorUsername = UserIdentityUserName,
      ActorOriginalUserType = UserIdentityType,
      HttpUserAgent = UserAgent
  | extend
      ActorUserIdType = iff(isempty(ActorUserId), "", "AWSId"),
      ActorUsernameType = iff(isempty(ActorUsername), "", "Simple"),
      SrcIpAddr = iff(ipv4_is_in_range(SourceIpAddress, "0.0.0.0/0"), SourceIpAddress, "")
  | extend AdditionalFields = pack(
      "ActorAccessKeyId", UserIdentityAccessKeyId,
      "AWSRegion", AWSRegion,
      "APIVersion", APIVersion,
      "ManagementEvent", ManagementEvent,
      "ReadOnly", ReadOnly,
      "RequestParameters", RequestParameters,
      "ResponseElements", ResponseElements
  )
  | extend AdditionalFields = bag_merge(AdditionalFields, AdditionalData)
  | extend
      User = ActorUsername,
      IpAddr = SrcIpAddr,
      FileName = TargetFileName,
      FilePath = TargetFilePath,
      Application = TargetAppName
  | project
      TimeGenerated,
      Type,
      EventCount,
      EventStartTime,
      EventEndTime,
      EventSeverity,
      EventSchema,
      EventSchemaVersion,
      EventVendor,
      EventProduct,
      Dvc,
      EventResult,
      EventMessage,
      TargetAppName,
      EventOriginalSubType,
      EventOriginalType,
      EventUid,
      EventOriginalResultDetails,
      EventProductVersion,
      ActorUserId,
      ActorUsername,
      ActorOriginalUserType,
      HttpUserAgent,
      ActorUserIdType,
      ActorUsernameType,
      SrcIpAddr,
      AdditionalFields,
      User,
      IpAddr,
      FileName,
      FilePath,
      Application,
      TargetAppType,
      EventType,
      EventSubType,
      TargetFileDirectory,
      TargetFileName,
      TargetFilePathType,
      TargetFilePath,
      SrcFilePath
Change:
  Date: '2026-10-24'
  Description: 'Initial ingest-time parser targeting ASimFileEventLogs.'
