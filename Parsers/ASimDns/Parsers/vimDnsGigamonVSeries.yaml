Parser:
  Title: Parameterized DNS ASIM parser for Gigamon V-Series Application Metadata Intelligence
  Version: '1.0.0'
  LastUpdated: Sep 02, 2026
Product:
  Name: Gigamon V-Series Application Metadata Intelligence
Normalization:
  Schema: Dns
  Version: '1.0.0'
References:
  - Title: ASIM DNS Schema
    Link: https://aka.ms/ASimDnsDoc
  - Title: ASIM
    Link: https://aka.ms/AboutASIM
  - Title: Gigamon Application Metadata Intelligence
    Link: https://docs.gigamon.com/doclib612/Content/GV-Cloud-V-Series-Applications/App_Metadata_Intelligence.html
Description: |
  Parameterized ASIM parser for Gigamon V-Series Application Metadata Intelligence
  DNS records.
ParserName: vimDnsGigamonVSeries
EquivalentBuiltInParser: _Im_Dns_GigamonVSeries
ParserParams:
  - Name: starttime
    Type: datetime
    Default: datetime(null)
  - Name: endtime
    Type: datetime
    Default: datetime(null)
  - Name: srcipaddr
    Type: string
    Default: '*'
  - Name: domain_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: responsecodename
    Type: string
    Default: '*'
  - Name: response_has_ipv4
    Type: string
    Default: '*'
  - Name: response_has_any_prefix
    Type: dynamic
    Default: dynamic([])
  - Name: eventtype
    Type: string
    Default: 'Query'
  - Name: pack
    Type: bool
    Default: false
  - Name: disabled
    Type: bool
    Default: false
ParserQuery: |
  let parser = (
      starttime:datetime=datetime(null),
      endtime:datetime=datetime(null),
      srcipaddr:string='*',
      domain_has_any:dynamic=dynamic([]),
      responsecodename:string='*',
      response_has_ipv4:string='*',
      response_has_any_prefix:dynamic=dynamic([]),
      eventtype:string='Query',
      pack:bool=false,
      disabled:bool=false
  ) {
      GigamonV2_CL
      | where not(disabled)
      | where isnotempty(dns_query) or isnotempty(dns_name)
      | extend
          EventStartTime = coalesce(todatetime(start_time), TimeGenerated),
          EventEndTime = coalesce(todatetime(end_time), todatetime(start_time), TimeGenerated),
          SrcIpAddr = coalesce(src_ip, src_ipv6),
          Src = coalesce(src_ip, src_ipv6, src_mac),
          DnsQuery = coalesce(dns_query, dns_name),
          ResponseCodeName = coalesce(dns_reply_code, "")
      | where (isnull(starttime) or EventStartTime >= starttime)
          and (isnull(endtime) or EventEndTime <= endtime)
          and (srcipaddr == '*' or SrcIpAddr == srcipaddr)
          and (array_length(domain_has_any) == 0 or DnsQuery has_any (domain_has_any))
          and (array_length(response_has_any_prefix) == 0)
          and (response_has_ipv4 == '*')
          and (responsecodename == '*' or ResponseCodeName =~ responsecodename)
          and (eventtype == 'Query')
      | project
          TimeGenerated,
          EventCount = int(1),
          EventStartTime,
          EventEndTime,
          EventProduct = "V-Series Application Metadata Intelligence",
          EventVendor = "Gigamon",
          EventSchema = "Dns",
          EventSchemaVersion = "0.1.7",
          EventType = "Query",
          EventResult = iff(isempty(dns_reply_code) or dns_reply_code in~ ("0", "NOERROR"), "Success", "Failure"),
          EventResultDetails = ResponseCodeName,
          Dvc = coalesce(generator, vendor),
          Src,
          SrcIpAddr,
          IpAddr = SrcIpAddr,
          DstIpAddr = coalesce(dst_ip, dst_ipv6),
          DnsQuery,
          Domain = DnsQuery,
          DnsQueryType = case(
              isnotnull(toint(dns_query_type)), toint(dns_query_type),
              dns_query_type =~ "A", int(1),
              dns_query_type =~ "NS", int(2),
              dns_query_type =~ "CNAME", int(5),
              dns_query_type =~ "SOA", int(6),
              dns_query_type =~ "PTR", int(12),
              dns_query_type =~ "MX", int(15),
              dns_query_type =~ "TXT", int(16),
              dns_query_type =~ "AAAA", int(28),
              dns_query_type =~ "SRV", int(33),
              int(null)
          ),
          DnsQueryTypeName = dns_query_type,
          DnsResponseCode = case(
              isnotnull(toint(dns_reply_code)), toint(dns_reply_code),
              dns_reply_code =~ "NOERROR", int(0),
              dns_reply_code =~ "FORMERR", int(1),
              dns_reply_code =~ "SERVFAIL", int(2),
              dns_reply_code =~ "NXDOMAIN", int(3),
              dns_reply_code =~ "NOTIMP", int(4),
              dns_reply_code =~ "REFUSED", int(5),
              int(null)
          ),
          DnsResponseCodeName = coalesce(dns_reply_code, ""),
          DnsQueryClass = case(
              isnotnull(toint(coalesce(dns_class, dns_host_class))), toint(coalesce(dns_class, dns_host_class)),
              coalesce(dns_class, dns_host_class) =~ "IN", int(1),
              coalesce(dns_class, dns_host_class) =~ "CH", int(3),
              coalesce(dns_class, dns_host_class) =~ "HS", int(4),
              coalesce(dns_class, dns_host_class) =~ "NONE", int(254),
              coalesce(dns_class, dns_host_class) =~ "ANY", int(255),
              int(null)
          ),
          DnsQueryClassName = coalesce(dns_class, dns_host_class),
          DnsFlags = dns_flags,
          DnsTtl = toint(dns_ttl),
          EventUid = id,
          Type = "GigamonV2_CL"
  };
  parser(
      starttime=starttime,
      endtime=endtime,
      srcipaddr=srcipaddr,
      domain_has_any=domain_has_any,
      responsecodename=responsecodename,
      response_has_ipv4=response_has_ipv4,
      response_has_any_prefix=response_has_any_prefix,
      eventtype=eventtype,
      pack=pack,
      disabled=disabled
  )
