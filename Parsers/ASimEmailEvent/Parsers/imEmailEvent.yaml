Parser:
  Title: Email Event ASIM filtering parser
  Version: '1.0.0'
  LastUpdated: Sep 09, 2026
Product:
  Name: Source agnostic
Normalization:
  Schema: EmailEvent
  Version: '1.0.0'
References:
- Title: ASIM Email Event Schema
  Link: https://aka.ms/ASimEmailEventDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
Description: |
    This ASIM parser supports filtering and normalizing Email Event logs from all supported sources to the ASIM 'EmailEvent' normalized schema.
ParserName: imEmailEvent
EquivalentBuiltInParser: _Im_EmailEvent
Parsers:
  - _Im_EmailEvent_Empty
ParserParams:
  - Name: starttime
    Type: datetime
    Default: datetime(null)
  - Name: endtime
    Type: datetime
    Default: datetime(null)
  - Name: ipaddr_has_any_prefix
    Type: dynamic
    Default: dynamic([])
  - Name: emailfromaddress_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: emailrecipient_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: emailsubject_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: emaildirection_in
    Type: dynamic
    Default: dynamic([])
  - Name: emaildeliverylocation_in
    Type: dynamic
    Default: dynamic([])
  - Name: eventresult
    Type: string
    Default: '*'
  - Name: pack
    Type: bool
    Default: false
ParserQuery: |
  let DisabledParsers=materialize(_GetWatchlist('ASimDisabledParsers') | where SearchKey in ('Any', 'ExcludeimEmailEvent') | extend SourceSpecificParser=column_ifexists('SourceSpecificParser','') | distinct SourceSpecificParser | where isnotempty(SourceSpecificParser));
  let imBuiltInDisabled=toscalar('ExcludeimEmailEvent' in (DisabledParsers) or 'Any' in (DisabledParsers)); 
  let parser=(
    starttime: datetime=datetime(null), 
    endtime: datetime=datetime(null), 
    ipaddr_has_any_prefix: dynamic=dynamic([]),
    emailfromaddress_has_any: dynamic=dynamic([]),
    emailrecipient_has_any: dynamic=dynamic([]),
    emailsubject_has_any: dynamic=dynamic([]),
    emaildirection_in: dynamic=dynamic([]),
    emaildeliverylocation_in: dynamic=dynamic([]),
    eventresult: string='*',
    pack:bool=false)
  {
  union isfuzzy=true
    vimEmailEventEmpty
  };
  parser (starttime=starttime, endtime=endtime, ipaddr_has_any_prefix=ipaddr_has_any_prefix, emailfromaddress_has_any=emailfromaddress_has_any, emailrecipient_has_any=emailrecipient_has_any, emailsubject_has_any=emailsubject_has_any, emaildirection_in=emaildirection_in, emaildeliverylocation_in=emaildeliverylocation_in, eventresult=eventresult, pack=pack)