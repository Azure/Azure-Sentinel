Parser:
  Title: ASIM Email Event parser for Proofpoint POD messages
  Version: '0.1.0'
  LastUpdated: Oct 23, 2026
Product:
  Name: Proofpoint On Demand Email Security
Normalization:
  Schema: EmailEvent
  Version: '1.0.0'
References:
- Title: ASIM Email Event Schema
  Link: https://aka.ms/ASimEmailEventDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
- Title: Proofpoint on Demand Log API
  Link: https://proofpointcommunities.force.com/community/s/article/Proofpoint-on-Demand-Pod-Log-API
Description: |
  Normalizes message inspection records from the CCP connector's ProofpointPODMessage_CL
  table to ASIM EmailEvent. Each source message remains one event, including messages
  with multiple recipients or MIME parts. Filter disposition is not delivery confirmation.
  Live source sampling and schema/data validation are deferred by user direction.
  See the schema README for mapping limitations and validation status.
ParserName: ASimEmailEventProofpointPODMessage
EquivalentBuiltInParser: _ASim_EmailEvent_ProofpointPODMessage
ParserParams:
  - Name: disabled
    Type: bool
    Default: false
  - Name: pack
    Type: bool
    Default: false
ParserQuery: |
  let parser = (disabled:bool=false, pack:bool=false) {
    ProofpointPODMessage_CL
    | where not(disabled)
    | extend
        _connection=parse_json(tostring(connection)),
        _envelope=parse_json(tostring(envelope)),
        _msg=parse_json(tostring(msg)),
        _pps=parse_json(tostring(pps)),
        _metadata=parse_json(tostring(metadata)),
        _filter=parse_json(tostring(['filter']))
    | project-rename EventStartTime=eventTime, EventOriginalUid=guid
    | extend
        EventVendor="Proofpoint",
        EventProduct="POD",
        EventSchema="EmailEvent",
        EventSchemaVersion="1.0.0",
        EventType="EmailInspection",
        EventCount=int(1),
        EventEndTime=EventStartTime,
        EventResult="NA",
        EventProductVersion=coalesce(tostring(_pps.version), tostring(_metadata.origin.data.version)),
        DvcFQDN=coalesce(tostring(_pps.agent), tostring(_metadata.origin.data.agent)),
        DvcOriginalAction=tostring(_filter.disposition),
        SrcIpAddr=tostring(_connection.ip),
        SrcFQDN=tostring(_connection.host),
        SrcGeoCountry=tostring(_connection.country),
        Dst=iff(array_length(_envelope.rcpts) == 1, tostring(_envelope.rcpts[0]), tostring(_envelope.rcpts)),
        EmailMailFromAddress=tostring(_envelope.from),
        EmailFromAddress=iff(array_length(_msg.parsedAddresses.from) == 1, tostring(_msg.parsedAddresses.from[0]), ""),
        EmailToRecipients=iff(isnull(_msg.parsedAddresses['to']), dynamic([]), _msg.parsedAddresses['to']),
        EmailSubject=iff(array_length(_msg.normalizedHeader.subject) == 1, tostring(_msg.normalizedHeader.subject[0]), ""),
        EmailSizeBytes=tolong(_msg.sizeBytes),
        EmailLanguage=tostring(_msg.lang),
        EmailDirection=case(
            _filter.routeDirection =~ "inbound", "Inbound",
            _filter.routeDirection =~ "outbound", "Outbound",
            _filter.routeDirection =~ "internal", "Internal",
            _filter.routeDirection =~ "local", "Local",
            "Unknown"),
        EmailProtocolName=iff(tostring(_connection.protocol) =~ "smtp:smtp", "SMTP", ""),
        EmailSpfOriginalResult=tostring(_filter.modules.spf.result),
        EmailDmarcOriginalResult=tostring(_filter.modules.dmarc.filterdResult),
        EmailDkimOriginalResult=iff(array_length(_filter.modules.dkimv) == 1, tostring(_filter.modules.dkimv[0].result), ""),
        EmailDkimDomain=iff(array_length(_filter.modules.dkimv) == 1, tostring(_filter.modules.dkimv[0].domain), ""),
        DvcEntityKey="",
        AdditionalEntities=dynamic([]),
        AdditionalFields=iff(pack, bag_pack(
            "connection", connection, "envelope", envelope, "msg", msg,
            "pps", pps, "metadata", metadata, "filter", ['filter'], "msgParts", msgParts), dynamic({})),
        Type=tostring(column_ifexists("Type", "ProofpointPODMessage_CL"))
    | extend
        Dvc=coalesce(DvcFQDN, EventProduct),
        DvcHostname=tostring(split(DvcFQDN, ".")[0]),
        DvcDomain=iff(indexof(DvcFQDN, ".") >= 0, substring(DvcFQDN, indexof(DvcFQDN, ".") + 1), ""),
        DvcAction=iff(DvcOriginalAction in~ ("reject", "discard"), "Blocked", "NA"),
        Src=coalesce(SrcIpAddr, SrcFQDN),
        SrcHostname=tostring(split(SrcFQDN, ".")[0]),
        SrcDomain=iff(indexof(SrcFQDN, ".") >= 0, substring(SrcFQDN, indexof(SrcFQDN, ".") + 1), ""),
        EmailMailFromDomain=tostring(split(EmailMailFromAddress, "@")[1]),
        EmailFromDomain=tostring(split(EmailFromAddress, "@")[1]),
        EmailSpfResult=case(
            EmailSpfOriginalResult =~ "pass", "Pass",
            EmailSpfOriginalResult =~ "fail", "Fail",
            EmailSpfOriginalResult =~ "softfail", "SoftFail",
            EmailSpfOriginalResult =~ "neutral", "Neutral",
            EmailSpfOriginalResult =~ "none", "None",
            EmailSpfOriginalResult =~ "temperror", "TemporaryError",
            EmailSpfOriginalResult =~ "permerror", "PermanentError", ""),
        EmailDmarcResult=case(
            EmailDmarcOriginalResult =~ "pass", "Pass",
            EmailDmarcOriginalResult =~ "fail", "Fail",
            EmailDmarcOriginalResult =~ "none", "None", ""),
        EmailDkimResult=case(
            EmailDkimOriginalResult =~ "pass", "Pass",
            EmailDkimOriginalResult =~ "fail", "Fail",
            EmailDkimOriginalResult =~ "none", "None",
            EmailDkimOriginalResult =~ "temperror", "TemporaryError",
            EmailDkimOriginalResult =~ "permerror", "PermanentError", "")
    | extend
        DvcDomainType=iff(isnotempty(DvcDomain), "FQDN", ""),
        SrcDomainType=iff(isnotempty(SrcDomain), "FQDN", ""),
        IpAddr=SrcIpAddr
    | project
        TimeGenerated, Type,
        EventVendor, EventProduct, EventProductVersion, EventSchema, EventSchemaVersion,
        EventType, EventCount, EventStartTime, EventEndTime, EventResult, EventOriginalUid,
        Dvc, DvcFQDN, DvcHostname, DvcDomain, DvcDomainType, DvcOriginalAction, DvcAction, DvcEntityKey,
        Src, SrcIpAddr, SrcFQDN, SrcHostname, SrcDomain, SrcDomainType, SrcGeoCountry, IpAddr, Dst,
        EmailMailFromAddress, EmailMailFromDomain, EmailFromAddress, EmailFromDomain,
        EmailToRecipients, EmailSubject, EmailSizeBytes, EmailLanguage, EmailDirection, EmailProtocolName,
        EmailSpfOriginalResult, EmailSpfResult, EmailDmarcOriginalResult, EmailDmarcResult,
        EmailDkimOriginalResult, EmailDkimResult, EmailDkimDomain,
        AdditionalEntities, AdditionalFields
  };
  parser(disabled=disabled, pack=pack)
