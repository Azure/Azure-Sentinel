Parser:
  Title: Email Event ASIM parser
  Version: '1.0.4'
  LastUpdated: Oct 29, 2026
Product:
  Name: Source agnostic
Normalization:
  Schema: EmailEvent
  Version: '1.0.0'
References:
- Title: ASIM Email Event Schema
  Link: https://aka.ms/ASimEmailEventDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
Description: |
  This ASIM parser supports normalizing Email Event logs from all supported sources to the ASIM Email Event normalized schema.
ParserName: ASimEmailEvent
EquivalentBuiltInParser: _ASim_EmailEvent
Parsers:
  - _Im_EmailEvent_Empty
  - _ASim_EmailEvent_ProofpointPODMessage
  - _ASim_EmailEvent_ProofpointPODMailLog
  - _ASim_EmailEvent_MicrosoftDefenderOffice365
  - _ASim_EmailEvent_ProofpointTAPDelivered
  - _ASim_EmailEvent_ProofpointTAPBlocked
ParserParams:
  - Name: pack
    Type: bool
    Default: false
ParserQuery: |
  let DisabledParsers=materialize(_GetWatchlist('ASimDisabledParsers') | where SearchKey in ('Any', 'ExcludeASimEmailEvent') | extend SourceSpecificParser=column_ifexists('SourceSpecificParser','') | distinct SourceSpecificParser| where isnotempty(SourceSpecificParser));
  let ASimBuiltInDisabled=toscalar('ExcludeASimEmailEvent' in (DisabledParsers) or 'Any' in (DisabledParsers));
  let parser=(pack:bool=false){
  union isfuzzy=true
    vimEmailEventEmpty,
    ASimEmailEventProofpointPODMessage(
      disabled=ASimBuiltInDisabled or ('ExcludeASimEmailEventProofpointPODMessage' in (DisabledParsers)),
      pack=pack),
    ASimEmailEventProofpointPODMailLog(pack=pack, disabled=(ASimBuiltInDisabled or ('ExcludeASimEmailEventProofpointPODMailLog' in (DisabledParsers)))),
    ASimEmailEventMicrosoftDefenderOffice365(disabled=(ASimBuiltInDisabled or ('ExcludeASimEmailEventMicrosoftDefenderOffice365' in (DisabledParsers))), pack=pack),
    ASimEmailEventProofpointTAPDelivered(
      disabled=ASimBuiltInDisabled or ('ExcludeASimEmailEventProofpointTAPDelivered' in (DisabledParsers)),
      pack=pack),
    ASimEmailEventProofpointTAPBlocked(
      disabled=ASimBuiltInDisabled or ('ExcludeASimEmailEventProofpointTAPBlocked' in (DisabledParsers)),
      pack=pack)
  };
  parser (pack=pack)
