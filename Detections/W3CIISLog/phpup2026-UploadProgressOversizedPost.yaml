id: 3f8a6c21-9e4b-4d7a-b1c5-6a2e8f0d3b9c
name: PHP rfc1867 Duplicate-Header OOM-Amplification Attempt (CVE-2026-109618/109619)
description: |
  '2026-10-21 rewrite: this rule previously detected an oversized
  multipart POST as a proxy for a same-request heap-spray mechanism that
  does not match the real fix (php/php-src commit 82f8f31b16a, "Avoid
  state corruption via bailout") - see
  https://github.com/rjmendez/phpup-2026 ANALYSIS.md. Replaced with the
  real, fix-confirmed signal: main/rfc1867.c previously saved every
  header line in a multipart part unconditionally; the fix restricts
  this to Content-Disposition/Content-Type and skips duplicates.

  2026-10-21 second fix, same day: the first rewrite above still matched
  only a literal duplicated "Content-Disposition" string. A real lab
  reproduction (github.com/rjmendez/phpup-2026, examples/pcaps/
  phpup2026-real-oom-amplification.pcap) used an arbitrary short header
  name instead, for maximum entries-per-byte - and a rule keyed on one
  literal name is under-inclusive against any attacker optimizing for
  amplification density, including that real reproduction. Replaced the
  literal match with a generic "any header name repeated within one
  request body" check (extract all header-looking tokens, group, flag
  duplicates) so the detection doesn't depend on which name an attacker
  picks. A sibling bug in this repo's own Suricata rule (same literal-
  match mistake) was caught and fixed the same way; see phpup-2026's
  rules/suricata.rules for the live-fire verification record.

  Requires WAF request body inspection (Azure Application Gateway / Front
  Door with body logging enabled) - standard W3C/IIS access logs do not
  carry POST body content at all, so this cannot run against W3CIISLog.
  Does NOT require PHP_SESSION_UPLOAD_PROGRESS or a PHPSESSID cookie -
  the OOM-amplification trigger works against any multipart upload
  endpoint, not only session.upload_progress users.
  References:
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  - https://github.com/rjmendez/phpup-2026'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: WAF
    dataTypes:
      - AzureDiagnostics
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1190
tags:
  - CVE-2026-109618
  - CVE-2026-109619
  - phpup-2026
query: |
  AzureDiagnostics
  | where Category in ("ApplicationGatewayAccessLog", "FrontDoorAccessLog")
  | where requestBody_s has "multipart/form-data"
  | extend HeaderNames = extract_all(@"\r\n([!-9;-~]+):", requestBody_s)
  | mv-expand HeaderName = HeaderNames to typeof(string)
  | summarize HeaderOccurrences = count()
      by TimeGenerated, clientIP_s, host_s, requestUri_s, httpStatus_d, HeaderName
  | where HeaderOccurrences >= 2
  | summarize MaxDuplicateCount = max(HeaderOccurrences), DuplicatedHeaderNames = make_set(HeaderName)
      by TimeGenerated, clientIP_s, host_s, requestUri_s, httpStatus_d
  | extend
      HostName = tostring(split(host_s, ".")[0]),
      DomainIndex = toint(indexof(host_s, "."))
  | extend HostNameDomain = iff(DomainIndex != -1, substring(host_s, DomainIndex + 1), host_s)
  | project TimeGenerated, clientIP_s, host_s, requestUri_s, httpStatus_d, MaxDuplicateCount,
            DuplicatedHeaderNames, HostName, HostNameDomain
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: clientIP_s
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostName
      - identifier: DnsDomain
        columnName: HostNameDomain
version: 2.1.0
kind: Scheduled
metadata:
    source:
        kind: Community
    author:
        name: rjmendez
    support:
        tier: Community
    categories:
        domains: [ "Security - Threat Protection" ]
