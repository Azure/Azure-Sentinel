id: 3f8a6c21-9e4b-4d7a-b1c5-6a2e8f0d3b9c
name: PHP Session Upload Progress UAF - Oversized Multipart POST (CVE-2026-109619)
description: |
  '[Unvalidated] This rule''s premise (a heap spray requiring an
  oversized multipart body) does not match PHP''s official advisory for
  CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp). The advisory describes a
  cross-request mechanism - a fatal-error-interrupted request leaves a
  stale global pointer, later consumed by a different request on the
  same worker during early-init (upload-progress handling is one
  confirmed consumer path) - not a within-one-request heap spray sized
  by body length. An oversized multipart POST with a PHPSESSID cookie
  may still correlate with probing or exploitation attempts in practice,
  but that correlation has not been demonstrated against the real
  mechanism; treat this as a size+cookie structural heuristic of unknown
  precision, not a confirmed exploitation signal. Tune csBytes to this
  environment''s normal upload sizes to control false positives from
  legitimate large uploads. Standard W3C extended logging does not
  capture POST body content, so this cannot directly confirm the
  PHP_SESSION_UPLOAD_PROGRESS field name or any payload bytes either way.
  Not CVE-2026-109618 - a separate, unrelated OOM-corruption bug
  (GHSA-w8hw-w9fx-j79w).
  References:
  - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  - https://github.com/rjmendez/phpup-2026'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: AzureMonitor(IIS)
    dataTypes:
      - W3CIISLog
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1190
tags:
  - CVE-2026-109619
  - phpup-2026
query: |
  W3CIISLog
  | where csMethod == "POST"
  | where csCookie has "PHPSESSID="
  | where csBytes >= 40000
  | extend
      HostName = tostring(split(Computer, ".")[0]),
      DomainIndex = toint(indexof(Computer, "."))
  | extend HostNameDomain = iff(DomainIndex != -1, substring(Computer, DomainIndex + 1), Computer)
  | project TimeGenerated, cIP, csHost, csUriStem, csMethod, csBytes, scStatus,
            Computer, HostName, HostNameDomain
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: cIP
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostName
      - identifier: DnsDomain
        columnName: HostNameDomain
version: 1.0.2
kind: Scheduled
metadata:
    source:
        kind: Community
    author:
        name: rjmendez
    support:
        tier: Community
    categories:
        domains: [ "Security - Threat Protection" ]
