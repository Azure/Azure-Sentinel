id: f95e2044-d214-40f2-9bac-980556d52aee
name: PHP rfc1867 Amplification Burst From Single Source (CVE-2026-109618/109619)
description: |
  '2026-10-21 rewrite, repurposed, not just re-caveated: this rule
  previously keyed on a 200/502/503 response-mix "worker crash pattern"
  built on a single-request multipart-stall mechanism. A real PHP 8.3.6
  lab given that exact documented precondition returned a clean 200 OK,
  not a crash, and the mechanism itself does not match the real fix
  (php/php-src commit 82f8f31b16a) - see
  https://github.com/rjmendez/phpup-2026 ANALYSIS.md. That premise is
  deleted, not kept as an "unvalidated" rule.

  Repurposed as the burst-over-time complement to
  phpup2026-UploadProgressOversizedPost.yaml''s real, fix-confirmed
  duplicate-Content-Disposition-header signal: repeated amplification
  attempts from one source in a short window, regardless of whether any
  single request alone crosses that rule''s threshold. What the
  producer request''s own HTTP-visible symptom looks like (500 page,
  truncated response, or no visible anomaly at all if the fatal error is
  only logged) is itself unconfirmed - this rule does not assume a
  specific response-status fingerprint, only repetition.
  References:
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  - https://github.com/rjmendez/phpup-2026'
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: WAF
    dataTypes:
      - AzureDiagnostics
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1190
tags:
  - CVE-2026-109618
  - CVE-2026-109619
  - phpup-2026
query: |
  AzureDiagnostics
  | where Category in ("ApplicationGatewayAccessLog", "FrontDoorAccessLog")
  | where requestBody_s has "multipart/form-data"
  | extend CDCount = countof(requestBody_s, "Content-Disposition")
  | where CDCount >= 2
  | summarize
      Hits      = count(),
      Targets   = make_set(requestUri_s, 5),
      StartTime = min(TimeGenerated),
      EndTime   = max(TimeGenerated)
      by bin(TimeGenerated, 5m), clientIP_s, host_s
  | where Hits >= 3
  | extend
      HostName = tostring(split(host_s, ".")[0]),
      DomainIndex = toint(indexof(host_s, "."))
  | extend HostNameDomain = iff(DomainIndex != -1, substring(host_s, DomainIndex + 1), host_s)
  | project StartTime, EndTime, clientIP_s, host_s, Hits, Targets, HostName, HostNameDomain
  | sort by Hits desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: clientIP_s
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostName
      - identifier: DnsDomain
        columnName: HostNameDomain
version: 2.0.0
kind: Scheduled
metadata:
    source:
        kind: Community
    author:
        name: rjmendez
    support:
        tier: Community
    categories:
        domains: [ "Security - Threat Protection" ]
