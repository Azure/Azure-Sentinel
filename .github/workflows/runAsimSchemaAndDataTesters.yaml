            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          if ! [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pull request head SHA."
            exit 1
          fi
          pr_data_dir="$RUNNER_TEMP/asim-pr-data"
          trusted_base_ref="refs/remotes/origin/asim-trusted-base"
          pr_head_ref="refs/remotes/origin/asim-pr-head"
          merge_base=""

          # Fetch only the pinned base and PR histories, deepening until Git
