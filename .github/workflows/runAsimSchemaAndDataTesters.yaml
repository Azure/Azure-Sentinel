# Each pull request that updates ASIM parsers triggers the script.
# The script runs ASIM Schema and Data testers on the "ASIM-GithubShared-Canary" workspace.
#
# SECURITY BOUNDARIES:
# - OIDC federated identity (AZURE_ASIM_CLIENT_ID_MC01) is scoped to canary workspace only:
#   Workspace: ASIM-GithubShared-Canary
#   Resource Group: github-asim-rg
#   Identity permissions: Canary RG/workspace only; deny cross-workspace and out-of-RG access
# - Fork PRs require explicit "SafeToRun" label approval from maintainer
# - Label is auto-removed on new commits (synchronize event) to prevent TOCTOU
# - All validation scripts are re-downloaded from master branch before execution
name: Run ASIM query-time parser validation

env:
  ASIM_CANARY_SUBSCRIPTION_ID: "b0c23e5e-a6c4-499e-950a-07de64febd19"
  ASIM_CANARY_RESOURCE_GROUP: "github-asim-rg"
  ASIM_CANARY_WORKSPACE_NAME: "ASIM-GithubShared-Canary"
  ASIM_CANARY_WORKSPACE_ID: "979d8dd3-e81d-4476-a1ef-b30833ada11b"
  ASIM_CANARY_DCE_NAME: "ASIM-GithubShared-Canary-DCE"
  ASIM_CANARY_INGESTION_ENDPOINT: "https://asim-githubshared-canary-dce-nz1r.eastus2euap-1.canary.ingest.monitor.azure.com"
  ASIM_CANARY_LOCATION: "eastus2euap"

on:
  pull_request_target:
    types: [labeled, synchronize]
    branches:
      - master
    paths:
      - "Parsers/ASimDns/Parsers/**"
      - "Parsers/ASimNetworkSession/Parsers/**"
      - "Parsers/ASimWebSession/Parsers/**"
      - "Parsers/ASimProcessEvent/Parsers/**"
      - "Parsers/ASimAuditEvent/Parsers/**"
      - "Parsers/ASimAuthentication/Parsers/**"
      - "Parsers/ASimFileEvent/Parsers/**"
      - "Parsers/ASimRegistryEvent/Parsers/**"
      - "Parsers/ASimUserManagement/Parsers/**"
      - "Parsers/ASimDhcpEvent/Parsers/**"
      - "Parsers/ASimAlertEvent/Parsers/**"
      - "Parsers/ASimAssetEntity/Parsers/**"
      - "Parsers/ASimAgentEvent/Parsers/**"
      - "Parsers/ASimEmailEvent/Parsers/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # group: asim-tests-${{ github.event.pull_request.number || github.sha }}
  # cancel-in-progress: true
  group: >-
    asim-tests-${{ github.event.pull_request.head.repo.fork
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event.pull_request.head.repo.fork }}

jobs:
  # Security gate: Fork PRs require manual approval via "SafeToRun" label
  # Internal PRs (same repo) can proceed without labels
  security-gate:
    name: Security approval gate for fork PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      approved: ${{ steps.check-approval.outputs.approved }}
      approved_sha: ${{ steps.check-approval.outputs.approved_sha }}
    steps:
      - name: Verify approver has write access (fork + SafeToRun)
        # SECURITY: the dynamic equivalent of an Environment's "required reviewers".
        # Only collaborators can add labels, but a triage-only account could still apply
        # SafeToRun; this rejects anyone without write/maintain/admin from approving a
        # fork PR test run that uses the canary Azure credentials. Failing here fails the
        # whole security-gate job, so every downstream (needs: security-gate) job is skipped.
        if: |
          github.event.pull_request.head.repo.fork == true &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'SafeToRun'
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            const log = (level, message) => {
              const icons = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' };
              console.log(`${icons[level] || 'ℹ️'} ${message}`);
            };

            const approver = context.payload.sender.login;
            log('info', `Validating approver permissions for @${approver}`);

            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: approver,
            });

            // Legacy `permission` maps maintain->write and triage->read, so this
            // allowlist authorizes admin/maintain/write and rejects triage/read/none.
            const allowed = ['admin', 'maintain', 'write'];
            log('info', `@${approver} permission level: ${perm.permission}`);

            if (!allowed.includes(perm.permission)) {
              core.setFailed(`@${approver} lacks write access (has '${perm.permission}') and is not authorized to approve fork PR test runs`);
            } else {
              log('success', `@${approver} is authorized to approve fork PR test runs`);
            }

      - name: Check if PR needs approval
        id: check-approval
        env:
          APPROVAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Function to log with consistent formatting
          log_info() { echo "ℹ️  $1"; }
          log_success() { echo "✅ $1"; }

          log_info "Starting PR approval check..."
          if ! [[ "$APPROVAL_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pull request head SHA."
            exit 1
          fi

          # Check if this is a fork PR
          is_fork="${{ github.event.pull_request.head.repo.fork }}"
          log_info "Fork PR: $is_fork"

          if [ "$is_fork" = "true" ]; then
            log_info "FORK PR DETECTED - Proceeding with security checks"
            
            # Check if "SafeToRun" label is present
            labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
            log_info "Available labels: $labels"
            
            # For fork PRs, only approve on 'labeled' events where SafeToRun is being added
            trigger_event="${{ github.event.action }}"
            log_info "Workflow triggered by event: $trigger_event"
            
            if [ "$trigger_event" = "labeled" ]; then
              # Check if the label being added is 'SafeToRun'
              label_added="${{ github.event.label.name }}"
              log_info "Label event: $label_added"
              
              if [ "$label_added" = "SafeToRun" ]; then
                log_success "SafeToRun label being added on fork PR - approving"
                echo "approved=true" >> $GITHUB_OUTPUT
                echo "approved_sha=$APPROVAL_HEAD_SHA" >> $GITHUB_OUTPUT
                echo "needs_approval=false" >> $GITHUB_OUTPUT
                echo "comment_needed=false" >> $GITHUB_OUTPUT
              else
                log_info "Different label applied, not SafeToRun"
                echo "approved=false" >> $GITHUB_OUTPUT
                echo "needs_approval=false" >> $GITHUB_OUTPUT
                echo "comment_needed=false" >> $GITHUB_OUTPUT
              fi
            elif [ "$trigger_event" = "synchronize" ]; then
              log_info "New commits detected (synchronize event) - SafeToRun label will be auto-removed"
              echo "approved=false" >> $GITHUB_OUTPUT
              echo "needs_approval=false" >> $GITHUB_OUTPUT
              echo "comment_needed=false" >> $GITHUB_OUTPUT
              echo "should_remove_label=true" >> $GITHUB_OUTPUT
              exit 1
            else
              log_info "Unexpected event for fork PR: $trigger_event"
              echo "approved=false" >> $GITHUB_OUTPUT
              echo "needs_approval=false" >> $GITHUB_OUTPUT
              echo "comment_needed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            log_success "Internal PR - auto-approved"
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "approved_sha=$APPROVAL_HEAD_SHA" >> $GITHUB_OUTPUT
            echo "needs_approval=false" >> $GITHUB_OUTPUT
            echo "comment_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify approved SHA is still the pull request head
        if: steps.check-approval.outputs.approved == 'true'
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        env:
          APPROVED_SHA: ${{ steps.check-approval.outputs.approved_sha }}
        with:
          script: |
            const approvedSha = process.env.APPROVED_SHA;
            if (!/^[0-9a-f]{40}$/.test(approvedSha)) {
              core.setFailed('Approved pull request SHA is invalid');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.head.sha !== approvedSha) {
              core.setFailed(`Pull request head moved from approved SHA ${approvedSha} to ${pr.head.sha}`);
            }

      - name: Auto-remove SafeToRun label on synchronize for fork PRs
        if: |
          always() &&
          github.event.pull_request.head.repo.fork == true &&
          github.event.action == 'synchronize' &&
          steps.check-approval.outputs.should_remove_label == 'true'
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            const log = (level, message) => {
              const icons = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' };
              console.log(`${icons[level] || 'ℹ️'} ${message}`);
            };

            try {
              log('info', 'Attempting to remove stale SafeToRun label on synchronize event');
              
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });

              const hasLabel = pr.labels.some(label => label.name === 'SafeToRun');
              
              if (hasLabel) {
                log('info', 'SafeToRun label found, removing it...');
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: 'SafeToRun'
                });
                log('success', 'SafeToRun label removed due to new commits');
              } else {
                log('info', 'SafeToRun label not present, nothing to remove');
              }
            } catch (error) {
              log('error', `Failed to remove label: ${error.message}`);
              if (error.status === 404) {
                log('info', 'Label or PR not found, continuing...');
              } else {
                throw error;
              }
            }

      - name: Prevent fork modifications to test infrastructure
        if: github.event.pull_request.head.repo.fork == true
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            const log = (level, message) => {
              const icons = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' };
              console.log(`${icons[level] || 'ℹ️'} ${message}`);
            };

            log('info', 'Checking for modifications to protected ASIM validation paths in fork PR...');

            // Paginate through all changed files in the PR
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const protectedPrefixes = [
              '.script/tests/asimParsersTest/',
              'ASIM/',
              '.github/',
            ];
            const forbiddenFiles = files
              .map(f => f.filename)
              .filter(name => protectedPrefixes.some(prefix => name.startsWith(prefix)));

            if (forbiddenFiles.length > 0) {
              log('error', 'Fork PRs cannot modify protected ASIM validation or workflow files');
              log('error', 'Modified protected files detected:');
              forbiddenFiles.forEach(f => console.log(`  - ${f}`));
              core.setFailed('Fork PR modifies protected ASIM validation files');
            } else {
              log('success', 'No protected ASIM validation files were modified');
            }

      - name: Comment on fork PR for approval guidance
        if: |
          always() && 
          github.event.pull_request.head.repo.fork == true && 
          steps.check-approval.outputs.comment_needed == 'true'
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            // Helper function for consistent logging
            const log = (level, message) => {
              const icons = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' };
              console.log(`${icons[level] || 'ℹ️'} ${message}`);
            };

            log('info', 'Comment step triggered for fork PR approval guidance');

            try {
              // Fetch existing comments
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              // Look for existing security guidance comments
              const botComments = comments.filter(comment => 
                comment.user.login === 'github-actions[bot]' &&
                (comment.body.includes('🔒 **Security Approval Required**') ||
                 comment.body.includes('🔒 **Security Re-approval Required**'))
              );
              
              // Create approval message
              const timestamp = new Date().toISOString();
              
              let commentBody;
              if ('${{ steps.check-approval.outputs.needs_approval }}' === 'true') {
                // Initial approval scenario
                commentBody = `🔒 **Security Approval Required**
              
              This fork PR requires manual approval before automated testing can run.
              
              **For security, a maintainer must:**
              1. 📝 Review the code changes carefully
              2. ✅ **Verify file types** - This PR should only contain \`.yml\`, \`.yaml\`, or \`.json\` files. Check for any executable scripts (.ps1, .py, .sh, .exe, etc.) which are not allowed in this context.
              3. 🏷️ Add the \`SafeToRun\` label if the changes are safe to execute
              
              **Note**: If new commits are added later, simply remove and re-add the \`SafeToRun\` label.
              
              ---
              *🤖 Automated security check • Created: ${timestamp}*  
              *Learn more: [GitHub Security Lab - Preventing PWN Requests](https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/)*`;
              } else {
                // Re-approval scenario (new commits OR pr edits with existing label)
                commentBody = `🔒 **Security Re-approval Required**
              
              ⚠️ **Fork PR verification needed**: This fork PR has been updated.
              
              **For security, a maintainer must:**
              1. 📝 Review the latest commits carefully for any security concerns
              2. ✅ **Verify file types** - Ensure commits only contain \`.yml\`, \`.yaml\`, or \`.json\` files. Reject if any executable scripts (.ps1, .py, .sh, .exe, etc.) are included.
              3. 🏷️ Remove the \`SafeToRun\` label
              4. 🏷️ Re-add the \`SafeToRun\` label if the latest commits are safe
              
              This simple process ensures that all commits have been properly reviewed before testing with repository secrets.
              
              ---
              *🤖 Automated security check • Updated: ${timestamp}*  
              *Learn more: [GitHub Security Lab - Preventing PWN Requests](https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/)*`;
              }
              
              // Always create a new comment for maximum visibility
              // Keep existing comments for audit trail - don't delete them
              // Update security guidance to emphasize KQL and CSV review
              let enhancedCommentBody = commentBody;
              if (enhancedCommentBody.includes('**Verify file types**')) {
                enhancedCommentBody = enhancedCommentBody.replace(
                  '2. ✅ **Verify file types** - This PR should only contain `.yml`, `.yaml`, or `.json` files. Check for any executable scripts (.ps1, .py, .sh, .exe, etc.) which are not allowed in this context.',
                  '2. ✅ **Verify file types** - This PR should only contain `.yml`, `.yaml`, `.json`, or `.csv` files. Reject any executable scripts (.ps1, .py, .sh, .exe, etc.).\n   ⚠️ **CRITICAL: Review KQL and CSV content for abuse:**\n      - Read the **ParserQuery** KQL for unauthorized data access/manipulation and reject cross-workspace/cluster references (e.g. `workspace(...)`, `cluster(...)`, `externaldata`)\n      - Inspect the **sample-data** CSV `Type` column for path-traversal-shaped or non-allowlisted table names (must match the builtin allowlist or a `_CL` suffix)\n      - Examine **sample-data** CSVs for injection attempts or sensitive data disclosure\n      - Check that queries are read-only and target only the fixed test/canary workspace'
                );
              }
              if (enhancedCommentBody.includes('**Verify file types** - Ensure')) {
                enhancedCommentBody = enhancedCommentBody.replace(
                  '2. ✅ **Verify file types** - Ensure commits only contain `.yml`, `.yaml`, or `.json` files. Reject if any executable scripts (.ps1, .py, .sh, .exe, etc.) are included.',
                  '2. ✅ **Verify file types** - Ensure commits only contain `.yml`, `.yaml`, `.json`, or `.csv` files. Reject if any executable scripts (.ps1, .py, .sh, .exe, etc.) are included.\n   ⚠️ **CRITICAL: Review KQL and CSV content for abuse:**\n      - Read the **ParserQuery** KQL for unauthorized data access/manipulation and reject cross-workspace/cluster references (e.g. `workspace(...)`, `cluster(...)`, `externaldata`)\n      - Inspect the **sample-data** CSV `Type` column for path-traversal-shaped or non-allowlisted table names (must match the builtin allowlist or a `_CL` suffix)\n      - Examine **sample-data** CSVs for injection attempts or sensitive data disclosure\n      - Check that queries are read-only and target only the fixed test/canary workspace'
                );
              }
              
              log('info', 'Creating new security guidance comment (preserving audit trail)');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: enhancedCommentBody
              });
              log('success', 'Created new security guidance comment');
              
              log('success', 'Comment operation completed successfully');
              
            } catch (error) {
              log('error', `Failed to post comment: ${error.message}`);
              if (error.response) {
                log('error', `API Response: ${error.response.status} - ${error.response.data?.message || 'Unknown error'}`);
              }
              // Don't fail the step if comment posting fails
              log('warning', 'Comment posting failed, but continuing workflow...');
            }

  Run-ASim-TemplateValidation:
    name: Run ASim Template Validation tests
    needs: security-gate
    if: |
      needs.security-gate.outputs.approved == 'true' &&
      needs.security-gate.outputs.approved_sha == github.event.pull_request.head.sha &&
      (github.event.pull_request.head.repo.fork == false ||
       (github.event.action == 'labeled' && github.event.label.name == 'SafeToRun'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security-gate.outputs.approved_sha }}
          repository: ${{ github.repository }}
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Parsers/**/*.yaml
            /Parsers/**/*.yml
            /Sample Data/ASIM/**/*.csv
            /ASIM/dev/ASimTester/Testers/*.yaml
            /.script/tests/asimParsersTest/ExclusionListForASimTests.csv
      - name: Setup git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "<>"
      - name: Merge master into pull request branch
        run: |
          git merge origin/master
          Conflicts=$(git ls-files -u | wc -l)
          if [ "$Conflicts" -gt 0 ] ; then
            echo "There is a merge conflict. Aborting"
            git merge --abort
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.x"
      - name: Install dependencies
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
        run: |
          python -m pip install --disable-pip-version-check --quiet --only-binary=:all: pip==26.3
          python -m pip install --disable-pip-version-check --quiet --only-binary=:all: \
            requests==2.34.2 \
            PyYAML==6.0.3 \
            tabulate==0.10.0
      - name: Run ASim parsers template validations python script
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid trusted base SHA."
            exit 1
          fi
          restore_trusted_file() {
            local path="$1"
            rm -f "$path"
            mkdir -p "$(dirname "$path")"
            git show "$TRUSTED_BASE_SHA:$path" > "$path"
          }
          helperPath=".script/tests/asimParsersTest/asim_parser_file_utils.py"
          filePath=".script/tests/asimParsersTest/VerifyASimParserTemplate.py"
          restore_trusted_file "$helperPath"
          restore_trusted_file "$filePath"
          python "$filePath"
  Run-ASim-Sample-Data-Ingest:
    needs:
      - security-gate
      - Run-ASim-TemplateValidation
    name: Run ASim Sample Data Ingestion
    if: |
      needs.security-gate.outputs.approved == 'true' &&
      needs.security-gate.outputs.approved_sha == github.event.pull_request.head.sha &&
      (github.event.pull_request.head.repo.fork == false ||
       (github.event.action == 'labeled' && github.event.label.name == 'SafeToRun'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security-gate.outputs.approved_sha }}
          repository: ${{ github.repository }}
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Parsers/**/*.yaml
            /Parsers/**/*.yml
            /Sample Data/ASIM/**/*.csv
            /ASIM/dev/ASimTester/Testers/*.yaml
            /.script/tests/asimParsersTest/ExclusionListForASimTests.csv
      - name: Setup git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "<>"
      - name: Merge master into pull request branch
        run: |
          git merge origin/master
          Conflicts=$(git ls-files -u | wc -l)
          if [ "$Conflicts" -gt 0 ] ; then
            echo "There is a merge conflict. Aborting"
            git merge --abort
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.x"
      - name: Install dependencies
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
        run: |
          python -m pip install --disable-pip-version-check --quiet --only-binary=:all: pip==26.3
          python -m pip install --disable-pip-version-check --quiet --only-binary=:all: \
            azure-core==1.41.0 \
            azure-identity==1.27.0 \
            azure-monitor-ingestion==1.1.0 \
            requests==2.34.2 \
            PyYAML==6.0.3
      - name: Login to Azure Public Cloud
        # SECURITY: AZURE_ASIM_CLIENT_ID_MC01 federated identity must be scoped to canary resources only:
        # - Workspace: ASIM-GithubShared-Canary
        # - Resource Group: github-asim-rg
        # - Deny read access to other workspaces/subscriptions
        # - Deny write access outside canary RG
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_ASIM_CLIENT_ID_MC01 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_MC01 }}
          subscription-id: ${{ env.ASIM_CANARY_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
      - name: Asim Sample Log Ingestion
        id: Ingestlogs
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid trusted base SHA."
            exit 1
          fi
          restore_trusted_file() {
            local path="$1"
            rm -f "$path"
            mkdir -p "$(dirname "$path")"
            git show "$TRUSTED_BASE_SHA:$path" > "$path"
          }
          helperPath=".script/tests/asimParsersTest/asim_parser_file_utils.py"
          filePath=".script/tests/asimParsersTest/ingestASimSampleData.py"
          restore_trusted_file "$helperPath"
          restore_trusted_file "$filePath"
          python "$filePath" "${{ github.event.pull_request.number }}"
  Run-ASim-Schema-Data-tests:
    needs:
      - security-gate
      - Run-ASim-Sample-Data-Ingest
    name: Run ASim Schema and Data tests
    if: |
      needs.security-gate.outputs.approved == 'true' &&
      needs.security-gate.outputs.approved_sha == github.event.pull_request.head.sha &&
      (github.event.pull_request.head.repo.fork == false ||
       (github.event.action == 'labeled' && github.event.label.name == 'SafeToRun'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security-gate.outputs.approved_sha }}
          repository: ${{ github.repository }}
          persist-credentials: false
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Parsers/**/*.yaml
            /Parsers/**/*.yml
            /Sample Data/ASIM/**/*.csv
            /ASIM/dev/ASimTester/Testers/*.yaml
            /.script/tests/asimParsersTest/ExclusionListForASimTests.csv

      - name: Login to Azure Public Cloud with AzPowershell
        # SECURITY: AZURE_ASIM_CLIENT_ID_MC01 federated identity must be scoped to canary resources only:
        # - Workspace: ASIM-GithubShared-Canary
        # - Resource Group: github-asim-rg
        # - Deny read access to other workspaces/subscriptions
        # - Deny write access outside canary RG
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_ASIM_CLIENT_ID_MC01 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_MC01 }}
          subscription-id: ${{ env.ASIM_CANARY_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
          allow-no-subscriptions: true

      - name: Setup git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "<>"

      - name: Merge master into pull request branch
        run: |
          git merge origin/master
          Conflicts=$(git ls-files -u | wc -l)
          if [ "$Conflicts" -gt 0 ] ; then
            echo "There is a merge conflict. Aborting"
            git merge --abort
            exit 1
          fi
      - name: Run ASIM Schema and Data tests PowerShell script
        uses: azure/powershell@f5b8adcfff1904872c7b98d4012d4914d74b1a82
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          inlineScript: |
            if ($env:TRUSTED_BASE_SHA -notmatch '^[0-9a-f]{40}$') {
              throw "Invalid trusted base SHA."
            }
            function Restore-TrustedFile([string] $Path) {
              if (Test-Path $Path) {
                Remove-Item -LiteralPath $Path -Force
              }
              $parent = Split-Path -Parent $Path
              New-Item -ItemType Directory -Path $parent -Force | Out-Null
              $content = & git show "$($env:TRUSTED_BASE_SHA):$Path"
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to restore trusted file $Path"
              }
              [System.IO.File]::WriteAllText(
                $Path,
                ([string]::Join("`n", [string[]]$content) + "`n"),
                [System.Text.UTF8Encoding]::new($false)
              )
            }
            $filePath = ".script/tests/asimParsersTest/runAsimTesters.ps1"
            $filePath_convert_yaml = ".script/tests/asimParsersTest/convertYamlToObject.ps1"
            $filePath_helper = ".script/tests/asimParsersTest/asim_parser_file_utils.py"
            Restore-TrustedFile $filePath
            Restore-TrustedFile $filePath_convert_yaml
            Restore-TrustedFile $filePath_helper
            & $filePath
          azPSVersion: "17.0.0"
  Run-ASim-Parser-Filtering-Tests:
    needs:
      - security-gate
      - Run-ASim-Sample-Data-Ingest
    name: Run ASim Parser Filtering tests
    # SECURITY: same fork-PR gate as the other secret-bearing jobs - fork PRs may only
    # run on the 'labeled' (SafeToRun) event; internal PRs run unconditionally.
    if: |
      needs.security-gate.outputs.approved == 'true' &&
      needs.security-gate.outputs.approved_sha == github.event.pull_request.head.sha &&
      (github.event.pull_request.head.repo.fork == false ||
       (github.event.action == 'labeled' && github.event.label.name == 'SafeToRun'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security-gate.outputs.approved_sha }}
          repository: ${{ github.repository }}
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Parsers/**/*.yaml
            /Parsers/**/*.yml
            /Sample Data/ASIM/**/*.csv
            /ASIM/dev/ASimTester/Testers/*.yaml
            /.script/tests/asimParsersTest/ExclusionListForASimTests.csv
      - name: Setup git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "<>"
      - name: Merge master into pull request branch
        run: |
          git merge origin/master
          Conflicts=$(git ls-files -u | wc -l)
          if [ "$Conflicts" -gt 0 ] ; then
            echo "There is a merge conflict. Aborting"
            git merge --abort
            exit 1
          fi
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.x"
      - name: Install dependencies
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
        run: |
          python -m pip install --disable-pip-version-check --quiet --only-binary=:all: pip==26.3
          python -m pip install --disable-pip-version-check --quiet --only-binary=:all: \
            azure-identity==1.27.0 \
            azure-monitor-query==1.4.1 \
            PyYAML==6.0.3
      - name: Login to Azure Public Cloud
        # SECURITY: AZURE_ASIM_CLIENT_ID_MC01 federated identity must be scoped to canary resources only:
        # - Workspace: ASIM-GithubShared-Canary
        # - Resource Group: github-asim-rg
        # - Deny read access to other workspaces/subscriptions
        # - Deny write access outside canary RG
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_ASIM_CLIENT_ID_MC01 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_MC01 }}
          subscription-id: ${{ env.ASIM_CANARY_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
      - name: Run ASim parsers filtering tests python script
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid trusted base SHA."
            exit 1
          fi
          restore_trusted_file() {
            local path="$1"
            rm -f "$path"
            mkdir -p "$(dirname "$path")"
            git show "$TRUSTED_BASE_SHA:$path" > "$path"
          }
          helperPath=".script/tests/asimParsersTest/asim_parser_file_utils.py"
          filePath=".script/tests/asimParsersTest/ASimFilteringTest.py"
          restore_trusted_file "$helperPath"
          restore_trusted_file "$filePath"
          python "$filePath"