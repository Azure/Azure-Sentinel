          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ needs.security-gate.outputs.approved_sha }}
        run: |
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
