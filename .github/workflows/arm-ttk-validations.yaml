name: Arm-ttk Validations

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'Solutions/**/mainTemplate.json'
      - 'Solutions/**/createUiDefinition.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  identify-changes:
    runs-on: ubuntu-latest
    outputs:
      solutionsJson: ${{ steps.step1.outputs.solutionsJson }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - shell: pwsh
        id: step1
        name: Identify Changes in PR
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          try {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module powershell-yaml -Force
            ./.script/package-automation/arm-ttk-tests.ps1
          }
          catch {
            Write-Error "Failed to run ARM-TTK tests: $_"
            exit 1
          }

  run-arm-ttk:
    needs: identify-changes
    if: ${{ needs.identify-changes.outputs.solutionsJson != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.identify-changes.outputs.solutionsJson) }}
    name: ARM-TTK - ${{ matrix.solutionName }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        id: publishGithubPackage
        name: Run ARM-TTK
        with:
          context: .
          file: ./.github/actions/Dockerfile
          push: false
          provenance: false
          build-args: |
            SolutionName=${{ matrix.solutionName }}
            mainTemplateChanged=${{ matrix.mainTemplateChanged }}
            createUiChanged=${{ matrix.createUiChanged }}
