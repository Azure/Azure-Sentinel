name: Run ASIM ingestion validation unit tests
run-name: ASIM ingestion validation tests on ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - master
  # Allows to run workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ASimIngestionValidationTests:
    name: ASIM ingestion validation unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            requests PyYAML

      - name: Build Kusto analyzer
        run: |
          analyzer_project=".script/tests/asimParsersTest/ingestTimeParser/kusto_analyzer/kusto_analyzer.csproj"
          dotnet restore "$analyzer_project" --locked-mode --nologo
          dotnet build "$analyzer_project" \
            --configuration Release \
            --no-restore \
            --nologo \
            --verbosity quiet
          echo "ASIM_KUSTO_ANALYZER_DLL=$GITHUB_WORKSPACE/.script/tests/asimParsersTest/ingestTimeParser/kusto_analyzer/bin/Release/net8.0/AsimKustoAnalyzer.dll" \
            >> "$GITHUB_ENV"

      - name: Run ingestion validation unit tests
        run: |
          python -m unittest discover \
            -s ".script/tests/asimParsersTest/ingestTimeParser/tests" \
            -p "test_asim_*.py"
